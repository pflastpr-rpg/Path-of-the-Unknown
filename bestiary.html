ack (+10 To-Hit). On a hit, deal 1d10 + 14 damage and the target's DM is reduced by 2 for the remainder of the encounter as the arrow disrupts the armour's structural integrity.\n\nWithdrawal Shot (Ranged Cost: 1 Action): The Archer moves up to half its movement speed and fires in the same action without penalty. This is not fleeing — it is maintaining optimal distance. The shot is made at +8 To-Hit for 1d10 + 10 damage.\n\nSilent Mark (Cost: 1 Action): The Archer identifies a single target and notches a specific arrow. Until the end of its next turn, its next ranged attack against that target ignores half of the target's DM — Armour value. The Archer has had longer to think about this shot than the armour's maker had to make it.`},
{name:`Blight Elf: Shadow-Priest of Syl-Kares`,size:`Medium`,type:`Humanoid / Blight Elf`,tier:`Elite`,tierColor:`#b45309`,desc:`The Shadow-Priests are the Syl-Kethara — those in whom the blood pact with Syl-Kares lives most completely. They carry the Verdant Empire's bitterness in their bones, and they have had five centuries to refine bitterness into something more useful: discipline. Their casting draws from the pact's terms rather than from any conventional discipline, which means the rules that govern other casters do not always apply to them. The church in the north has no entry for them in their demonology. This is an oversight with consequences.`,agl:7,awa:8,cha:5,int:9,phy:4,wil:10,move:15,ap:3,def:15,wmArmor:1,wmBS:5,wmDP:2,wounds:90,focus:`+2/6`,reroll:0,luck:3,meleeHit:`+2`,meleeDmg:`+8`,meleeHeal:`1`,rangeHit:`1`,rangeDmg:`+6`,rangeHeal:`1d10+8`,castHit:`0`,castDmg:`+16`,castHeal:`2d10+28`,castType:`Shaman`,fear:`Syl-Kares Pact`,mob:`2`,gear:`1`,meleeDetail:`Bone-Carved Staff of the Pact, Crimson-stained vestments, Blood-pact focus (required for casting)`,rangeDetail:`Bone-Carved Staff (2H)`,abilities:`Passive Traits\nThe Pact's Weight: The Shadow-Priest's casting does not follow standard Arcane Backlash rules. A natural 1 on a casting roll instead transfers 1d10 damage directly from the Priest to the nearest living ally — the pact demands payment, and it collects from whoever is available.\n\nDesiccating Aura: Any creature that begins its turn within 20ft of the Priest loses 1 Wound per turn as the pact draws ambient vitality. This is not a condition — it cannot be resisted or removed while the Priest lives.\n\nSyl-Kares' Memory: The Shadow-Priest is immune to Charm, Dominate, and Fear effects. The Verdant Empire's fall already happened. Nothing the party can threaten approaches that.\n\nAction-Based Abilities\nBlood Debt (TN 9, Casting Cost: 2 Actions): The Priest names a debt and the pact enforces it. Make a Casting attack (+16 To-Hit) against a target within 50ft. On a hit, the target takes 2d10 + 28 damage and must surpass Willpower TN 9 + Resist bonus or become Shaken for 2 turns as the pact's weight presses on their mind.\n\nVerdant Drain (TN 10, Casting Cost: 2 Actions): The Priest draws the living world's energy through a target. Make a Casting attack (+16 To-Hit) against a target within 40ft. On a hit, deal 2d10 + 20 damage. The Priest heals 1d10 + 12 damage from the stolen vitality. A target reduced to 0 damage by this spell does not leave a body — the pact takes everything.\n\nSpirit-Binding (TN 12, Casting Cost: 3 Actions): Once per encounter. The Priest binds a defeated creature as a Desiccated servant. The creature rises with half its original Wounds, cannot be Turned, and obeys the Priest absolutely. It acts immediately on the Priest's initiative. When the Priest dies, all bound Desiccated collapse.`},
{name:`Blight-Spider: The Web-Stitcher`,size:`Large`,type:`Beast / Monstrosity`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A Blight-Spider is roughly the size of a carriage, but its silhouette is jagged and uneven. It reinforces its own exoskeleton by "stitching" pieces of rotted wood, rusted metal, and the bones of past victims to its legs using a thick, oily black silk. This makes it look like a moving pile of forest detritus—until its eight glowing, multi-faceted eyes snap open. They spin a three-dimensional lattice of toxic tripwires through the air and are masters of agility, dropping from the canopy to snatch prey before vanishing back into the leaves. They do not eat immediately; they paralyze and stitch their victims to the trees to be slowly digested by black sap.`,agl:9,awa:7,cha:1,int:2,phy:6,wil:5,move:20,ap:3,def:8,wmArmor:20,wmBS:10,wmDP:35,wounds:70,focus:`+3/9`,reroll:2,luck:1,meleeHit:`+4`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`4`,mob:`1`,gear:`None`,meleeDetail:`Toxic Mandibles & Barbed Legs`,rangeDetail:`Oily Black Silk. Shoots web projectiles up to 60ft`,abilities:`Passive Traits \nDetritus Camouflage: As long as the Blight-Spider remains motionless, it is indistinguishable from a pile of dead wood, rusted scrap, and forest rot. It automatically gains Advantage on any Stealth checks to initiate an ambush, and enemies cannot target it from afar until it moves or attacks.\n\n3D Toxic Lattice: The spider constantly trails invisible, toxic tripwires. Any area within 30 feet of the spider (including the air above it) is considered a hazard. If an enemy moves more than 10 feet during their turn within this area, they snap a tripwire and must surpass Agility TN 9 + Resist bonus or immediately take 1d10 Acid/Poison Damage and have their Movement halted for the rest of that turn.\n\nMaster of the Canopy: The spider completely ignores all difficult terrain and vertical climbing penalties. When it uses a Move action to climb up a wall or tree, it instantly Disengages from all melee combat without triggering any free attacks of opportunity.\n\nAction-Based Abilities \nCanopy Snatch (Range Cost: 1 Action): The spider drops from above or fires a thick tether of oily silk. Make a Ranged attack (+3 To-Hit) against a target within 40 feet. If successful, the target takes 15 damage and is Grappled. The spider can immediately pull the grappled target 20 feet toward itself or hoist them into the air.\n\nBlack-Sap Bite (Melee Cost: 2 Actions): A vicious, venomous strike from its mandibles. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 25 damage, and the target must pass a severe Physique(10) test. On a failure, the black sap enters their bloodstream, inflicting the Stunned and Poisoned conditions for 1 round.\n\nThe Macabre Stitch (Cost: 1 Action): The spider rapidly binds a Stunned or Grappled target to the environment. The target is violently pinned to a nearby tree, wall, or the floor with oily black silk. While stitched, the target cannot take any Physical or Agility actions and automatically suffers 2d10 Acid Damage at the start of each of their turns as the black sap begins to digest them alive. They (or an ally) must spend an Action and surpass Physique TN 9 + Resist bonus to rip the silk away.`},
{name:`Blue Dragon: The Storm of the Dunes`,size:`Enormous`,type:`Dragon`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A Blue Dragon is a magnificent and terrifying sight. Its scales are the deep, iridescent blue of a desert sky at midnight, polished to a mirror-sheen by the abrasive sands. A singular, massive horn projects from its snout—a lightning rod for the static energy that constantly hums through its body. They are patient hunters, burying themselves beneath the sand for days until a caravan passes overhead, erupting in a shower of glass and electricity. They possess an immense ego and a particular obsession with gems (especially sapphires), often sparing a "lesser being" if offered a worthy tribute.`,agl:5,awa:8,cha:15,int:7,phy:18,wil:12,move:`27/60F`,ap:3,def:9,wmArmor:30,wmBS:20,wmDP:`Immune`,wounds:550,focus:`+2/6`,reroll:3,luck:1,meleeHit:`+6`,meleeDmg:`+60`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`8`,mob:`1`,gear:`A massive hoard buried deep beneath the desert`,meleeDetail:`The Lightning Horn & Claws`,rangeDetail:`Chain Lightning`,abilities:`Passive Traits\nThe Living Lightning Rod: Static electricity constantly hums through the dragon's body. Any time a player successfully hits the Blue Dragon with a metal Melee weapon, the kinetic impact discharges the static, instantly dealing 1d10 Lightning Damage back to the attacker.\n\nDune Ambusher: When buried beneath the sand, the dragon is entirely undetectable by non-magical means. It automatically gains Advantage on its Initiative roll. When it erupts from the sand, the superheated lightning fuses the ground in a 40-foot radius into jagged glass, turning the battlefield into severe Difficult Terrain that causes Bleed 1d10 damage if fallen upon.\n\nThe Sapphire Tribute: The dragon's immense ego is its only real weakness. As an Action, a player can hold up a gemstone of significant value and grovel. The dragon must pass a surpass Willpower TN 7 + Resist bonus; if it fails, its ego wins out, and it will spend its next turn demanding the gem and conversing rather than attacking that specific player. Sapphires impose Disadvantage on the dragon's surpass Willpower TN 7 + Resist bonus to resist.\n\nAction-Based Abilities\nEruption of the Storm (Melee Cost: 3 Actions): The dragon bursts from its sandy grave. It makes a Melee attack (+6 To-Hit) against every target within a 30-foot radius. On a hit, targets take 1d10 + 60 damage, are violently thrown 20 feet backward, and are knocked Prone amidst the newly formed glass.\n\nMidnight Sky Beam (Range Cost: 2 Actions): The dragon lowers its massive horn and unleashes a concentrated beam of static energy. Make a Ranged attack (+5 To-Hit) against a 100-foot line. On a hit, it deals 4d10 + 30 Lightning Damage, and targets are completely Deafened and Stunned for 1 round from the thunderclap.\n\nArrogant Pin (Melee Cost: 1 Action): The dragon slams a claw down on a single target to demand its tribute. Make a Melee attack (+6 To-Hit). If successful, it deals half damage 1d10 + 30, but the target is Grappled and Restrained under the sheer weight of the beast, completely unable to move until the dragon lifts its claw.`},
{name:`Boar (Razorgor): The Living Battering Ram`,size:`Large`,type:`Beast / Monstrosity`,tier:`Elite`,tierColor:`#b45309`,desc:`Twisted by the same dark energies that birthed the Beastmen, these boars are unnaturally large—some standing as tall as a pony at the shoulder. Their hides are thick as cured leather, often embedded with rusted spear tips and broken arrows from failed hunts. They don't just bite; they impact. A charging boar carries enough kinetic energy to shatter shields and snap the legs of horses. They are notoriously difficult to kill, refusing to acknowledge pain until their heart finally stops beating. The Beastmen use them as living line-breakers to shatter defensive formations.`,agl:6,awa:5,cha:1,int:2,phy:9,wil:7,move:16,ap:3,def:7,wmArmor:8,wmBS:10,wmDP:20,wounds:85,focus:`0`,reroll:0,luck:0,meleeHit:`+3`,meleeDmg:`+20`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-5`,gear:`Barding if Mount`,meleeDetail:`Rusted Tusks & Trampling Hooves`,rangeDetail:`None`,abilities:`Passive Traits\nUnstoppable Momentum: Once the Razorgor begins its gallop, it cannot easily turn. If it moves more than 15 feet in a straight line during its turn, it can freely move through spaces occupied by other creatures (friend or foe). Any creature it passes through must surpass Agility TN 6 + Resist bonus or take 1d10 Bludgeoning Damage and be knocked Prone.\n\nDeadened Nerves: The boar simply refuses to acknowledge pain. It is completely immune to the Stunned and Fatigued conditions. Furthermore, when its Wounds are reduced to 0, its heart stops, but its adrenaline carries it forward—it immediately takes one final, full turn before dropping dead.\n\nThe Line Breaker: Designed to shatter formations, the Razorgor deals double damage to physical shields, barricades, and magical walls. It completely ignores any defensive bonuses a player might receive from standing in a "Shield Wall" or defensive formation.\n\nAction-Based Abilities \nBattering Ram Charge (Melee Cost: 2 Actions): The boar lowers its head and explodes forward. It moves up to its maximum Movement (45 feet) in a straight line and makes a Melee attack (+3 To-Hit). If successful, it deals 2d10 + 20 damage, permanently shatters the target's shield (if equipped), and violently knocks them 10 feet backward and Prone.\n\nGutting Tusk (Melee Cost: 1 Action): A brutal, upward thrust with its massive rusted tusks. Make a Melee attack (+3 To-Hit). If this attack hits a target that is currently Prone, it automatically inflicts 1 Bleeding condition as the tusk tears through armor and flesh.\n\nFrenzied Thrash (Melee Cost: 1 Action): If cornered or surrounded, the boar violently thrashes its massive head from side to side. It makes a single Melee attack (+3 To-Hit) against the Defense of all enemies within 5 feet. Anyone hit takes half damage 1d10 + 10 and is pushed 5 feet away.`},
{name:`Bog Octopuss (Silt Lurker)`,size:`Giant`,type:`Beast / Monstrosity`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A master of camouflage, its skin mimics the texture of wet moss, decaying logs, and oily peat. It doesn't swim so much as it "drifts" through the mud, using eight muscular tentacles to pull itself along the swamp floor or hang from low cypress branches. Unlike its oceanic cousins, it secretes a thick, paralytic mucus to "marinate" prey. It is the silent killer of the marsh—one moment you’re stepping on a log, the next, you’re being dragged into the dark, anaerobic depths. It prefers to strike from total concealment, waiting for the heaviest member of the party to walk over it before erupting in a whirlwind of suction cups and slime.`,agl:11,awa:9,cha:2,int:5,phy:12,wil:7,move:`17W/8L`,ap:3,def:6,wmArmor:20,wmBS:20,wmDP:30,wounds:320,focus:`+2/6`,reroll:1,luck:0,meleeHit:`+6`,meleeDmg:`+50`,meleeHeal:`0`,rangeHit:`+4`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1`,gear:`None`,meleeDetail:`Suction-Cup Tentacles`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nPerfect Peat Camouflage: As long as the Bog Octopus is submerged in mud or resting against a cypress tree, it is entirely indistinguishable from the environment. It automatically gains Advantage on Stealth checks. If it attacks a target who has not detected it, that attack gains Advantage and automatically Grapples the target on a hit.\n\nParalytic Mucus: The creature's skin constantly secretes a numbing slime. Any time an enemy successfully hits the Bog Octopus with an unarmed strike, or starts their turn Grappled by it, the enemy must surpass Physique TN 12 + Resist bonus or suffer 1 Poison condition and lose half their Movement speed as their limbs go numb.\n\nAnaerobic Drag (Drown Mechanics): The Silt Lurker does not fight fair. If the Octopus has a target Grappled, it can use its innate Movement to drag that target directly underwater or deep into the thick mud. Once submerged, the target cannot speak or cast spells with verbal components, and they immediately begin suffering from Drowning/Suffocation rules.\n\nAction-Based Abilities\nEruption of Suction Cups (Melee Cost: 2 Actions): The Octopus bursts from concealment, lashing out with massive tentacles. It makes a Melee attack (+6 To-Hit) against up to two targets within 15 feet. If successful, it deals normal 1d10 + 50 damage, and the targets are violently pulled into spaces adjacent to the Octopus and Grappled.\n\nMarinate the Prey (Range Cost: 1 Action): The Octopus forcefully expels a thick glob of paralytic mucus at a target within 30 feet. Make a Ranged attack (+4 To-Hit). If successful, it deals 1d10 +20 Acid/Poison Damage, and the target is completely Stunned for 1 round as their nervous system locks up.\n\nDrag to the Depths (Cost: 1 Action): The Octopus tightens its grip on a Grappled target and violently crushes them. The target automatically takes 2d10 + 30 Bludgeoning Damage. If the Octopus and the target are submerged in the mud/water, the target instantly loses 1 additional round of their held breath (accelerating the drowning process).`},
{name:`Bog-Witch (Swamp Hag)`,size:`Small`,type:`Fey / Humanoid`,tier:`Minion`,tierColor:`#607080`,desc:`The Swamp Hag is a creature of stagnant rot and ancient, bitter magic, born when a forest spirit is completely corrupted by the runoff of dark rituals or a plague-ridden graveyard. Standing barely four feet tall, she is a twisted, hunched figure draped in sodden moss and discarded human hair. Her skin is the color of bruised eggplant, feeling like wet, cured leather. Instead of eyes, two glowing pits of yellow bile see perfectly through the thickest bog mists. She carries a gnarled staff of petrified driftwood, and the air around her hums with the sickening buzzing of thousands of carrion flies.`,agl:2,awa:6,cha:5,int:9,phy:1,wil:7,move:10,ap:3,def:8,wmArmor:5,wmBS:15,wmDP:20,wounds:25,focus:`+3/9`,reroll:2,luck:1,meleeHit:`+2`,meleeDmg:`+7`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+25`,castHeal:`0`,castType:`Wizardry`,fear:``,mob:`1`,gear:`Petrified Driftwood Staff, Sodden Moss Rags`,meleeDetail:`Driftwood Staff`,rangeDetail:`None`,abilities:`Passive Traits \nBile-Sight: The Swamp Hag's glowing yellow eye-pits perceive reality flawlessly. She completely ignores all cover penalties from fog, smoke, and magical darkness. She is immune to the Blinded condition and cannot be ambushed.\n\nThe Carrion Halo: Thousands of flies constantly swarm around the Hag. Any ranged attacks (arrows, bolts, thrown weapons) made against her from further than 15 feet away automatically suffer Disadvantage, as the dense buzzing cloud throws off aim and obscures her frail silhouette.\n\nAura of Stagnant Rot: The graveyard magic that birthed her actively suppresses life. Any magical healing cast by players within 30 feet of the Hag is automatically halved (rounded down) as the rot absorbs the ambient holy energy.\n\nAction-Based Abilities \nBlighted Hex(TN7) (Casting Cost: 1 Action): The Hag points a rotting finger and whispers an ancient curse. Make a Casting attack (+4 To-Hit) against a target within 40 feet. If successful, it deals 1d10 + 25 Necrotic Damage, and the target must pass a surpass Willpower TN 7 + Resist bonus or suffer 1 Fatigued condition as their life force is sapped.\n\nGraveyard Runoff(TN9) (Casting Cost: 2 Actions): The Hag strikes her driftwood staff against the ground, causing the earth in a 20-foot radius to liquefy into foul, acidic muck. The area becomes permanent Difficult Terrain. Any enemy that ends their turn in the muck takes 2d10 + 25 Acid Damage and gains 1 Poison condition.\n\nSwarm Command (Cost: 1 Action): The Hag commands her carrion flies to attack. Make a Ranged attack (+3 To-Hit) against an enemy within 30 feet. If it hits, the target takes no Wounds, but the flies swarm their eyes and throat, instantly inflicting the Blinded and Silenced conditions until the target spends an Action to swat them away.`},
{name:`Bone Giant: The Amalgamation`,size:`Giant`,type:`Undead / Construct`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The ultimate weapon of a master necromancer. It is not a resurrected creature, but an amalgamation—a golem of death constructed from the fused skeletons of hundreds of humans, horses, and beasts. The bones are lashed together by thick, glowing sinews of sickly-green necromantic energy, and inside its hollow ribcage, a localized storm of trapped souls swirls like a vortex. It wears no armor; its outer layer of fused skulls and femurs acts as a hardened carapace. It moves with a jerky, unnatural rhythm, but its sheer stride length makes it terrifyingly fast. Wielding an uprooted graveyard mausoleum pillar on chains, it exists only to smash castle gates and crush armored formations into dust.`,agl:5,awa:7,cha:2,int:1,phy:15,wil:9,move:27,ap:3,def:8,wmArmor:25,wmBS:20,wmDP:`Immune`,wounds:400,focus:`0`,reroll:0,luck:0,meleeHit:`+5`,meleeDmg:`+50`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`8`,mob:`1`,gear:`Uprooted Mausoleum Pillar with Chains`,meleeDetail:`Mausoleum Pillar Greatclub`,rangeDetail:`Chunks of Graveyard Stone`,abilities:`Passive Traits\nAmalgamation of Death: Because it is a golem made of hundreds of corpses rather than a single undead entity, standard "Turn Undead" or banishing spells are highly ineffective. It automatically succeeds on Willpower tests to resist being turned, commanded, or frightened. Additionally, it takes no extra damage from Critical Hits, as it has no vital organs or singular structural weak point.\n\nChorus of the Damned: The vortex of trapped souls in its ribcage is an overwhelming hazard. Any living creature that starts its turn within 30 feet of the Giant takes 10 Psychic/Necrotic Damage from the wailing spirits and is Deafened.\n\nSiege Engine: The Bone Giant is built to reduce fortresses to dust. It deals double damage to all environmental structures, walls, vehicles, and physical shields. It ignores Movement penalties for walking through difficult terrain, as it simply crushes the obstacles beneath its massive feet.\n\nAction-Based Abilities\nMausoleum Sweep (Cost: 2 Actions): The Giant swings its massive stone pillar in a brutal, horizontal arc. Make a Melee attack (+5 To-Hit) against up to two adjacent targets. On a hit, it deals 1d10 + 50 Bludgeoning Damage. Targets struck must pass a severe Physique(12) test or be violently hurled 30 feet backward, landing Prone.\n\nVortex Vent (Range Cost: 2 Actions): The Giant forcibly opens its ribcage, unleashing a torrent of the screaming souls trapped within. Make a Ranged attack (+3 To-Hit) in a 60-foot cone. On a hit, targets take 3d10 + 20 Necrotic Damage and gain 1 Stunned condition as the spectral hands tear at their life-force.\n\nUnnatural Trample (Cost: 1 Action): The Giant uses its terrifyingly fast stride to crush the frontline. It moves up to its full 60-foot Movement speed in a straight line, passing freely through the spaces of any smaller creatures. Any enemy whose space it moves through must surpass Agility TN 10 + Resist bonus or take 30 Bludgeoning Damage from its colossal, skeletal feet.`},
{name:`Bugbear: The Shadow-Stalker`,size:`Medium`,type:`Goblinoid`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A Bugbear is a contradiction: a seven-foot-tall mountain of muscle and coarse, matted fur that can move as silently as a ghost. Their joints seem unnaturally loose, allowing them to squeeze into spaces that should be far too small for them, and their long, gangly arms give them a reach that catches most adventurers off-guard. They don't hunt for glory; they are apex bullies who enjoy the moment of pure, frozen terror when a sentry realizes the "shadow" behind them has breathing and a morningstar.`,agl:7,awa:6,cha:1,int:2,phy:9,wil:5,move:14,ap:3,def:6,wmArmor:6,wmBS:10,wmDP:20,wounds:45,focus:`0`,reroll:0,luck:0,meleeHit:`+3`,meleeDmg:`+15/25(2H)`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+10`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`2-10`,gear:`Rusted Iron Morningstar, Throwing Javelins`,meleeDetail:`1H or 2H Iron MorningStar`,rangeDetail:`Hurled Javelin`,abilities:`Passive Traits \nSilent Contortionist: The Bugbear's loose joints and padded feet make it a master infiltrator. It automatically gains Advantage on all Stealth checks. Furthermore, it can squeeze through windows, grates, or gaps designed for Small creatures without suffering any Movement penalties.\n\nGangly Reach: Its unnaturally long arms allow it to strike from completely unexpected angles. The Bugbear's Melee attacks have a 10-foot reach, allowing it to attack players from behind cover, around corners, or while hanging from the rafters without engaging in base-to-base contact.\n\nBrutal Efficiency (The Bully's Advantage): The Bugbear wants to end the fight in the first three seconds. If the Bugbear attacks a target that has not yet taken a turn in combat, or attacks a target from Stealth, its Melee attacks automatically deal double damage.\n\nAction-Based Abilities \nShadow-Stalker's Drop (Melee Cost: 2 Actions): The Bugbear drops from the ceiling or bursts from a thicket to deliver a devastating opening strike. It moves up to 15 feet and makes a Melee attack (+3 To-Hit). If successful, it deals 1d10 + 25 damage, and the target must surpass Physique TN 9 + Resist bonus or instantly gain 1 Stunned condition from the concussive trauma.\n\nMorningstar Sweep (Melee Cost: 1 Action): Utilizing its 10-foot reach, the Bugbear swings its morningstar at the party's legs. Make a Melee attack (+3 To-Hit). If successful, it deals half damage 1d10 + 8, but the target is violently tripped and knocked Prone.\n\nFade into the Dark (Cost: 1 Action): The Bugbear refuses to fight a fair battle. It instantly Disengages from melee combat without triggering any free attacks of opportunity and can move up to 20 feet into a shadowed area, cover, or up a wall to re-enter Stealth.`},
{name:`Cave Spider: The Jagged-Ambusher`,size:`Medium`,type:`Beast / Monstrosity`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A Cave Spider is roughly the size of a squat human or a large wolf, but its eight spindly, multi-jointed legs give it a much wider footprint. Its thorax is covered in jagged, calcified plates that perfectly mimic the texture of wet stalactites or jagged limestone. They do not build massive, visible webs; instead, they spin nearly invisible, high-tension "trip-wires" across cave floors and narrow corridors. They are patient stalkers, preferring to drop from the ceiling to deliver a single, paralyzing bite before retreating into the shadows to let the toxin do its gruesome work.`,agl:9,awa:7,cha:1,int:2,phy:6,wil:5,move:23,ap:3,def:7,wmArmor:20,wmBS:10,wmDP:30,wounds:40,focus:`+2/6`,reroll:1,luck:1,meleeHit:`+4`,meleeDmg:`+15`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+10`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1-4`,gear:`Calcified Plating (Natural Armor)`,meleeDetail:`Paralyzing Fangs`,rangeDetail:`High-Tension Silk. Shoots invisible trip-wires up to 40ft`,abilities:`Passive Traits\nStalactite Camouflage: When clinging to a rocky ceiling or wall and remaining motionless, the Cave Spider is virtually indistinguishable from a jagged limestone formation. It automatically gains Advantage on any Stealth checks to initiate an ambush, and enemies suffer Disadvantage on Awareness checks to spot it in the dark.\n\nHigh-Tension Trip-Wires: At the start of the encounter, the Cave Spider has already laid invisible silk trip-wires in the immediate 30-foot area. Whenever an enemy uses a Move action to travel more than 10 feet through this zone, they must surpass Agility TN 9 + Resist bonus or violently trip, falling Prone and ending their Movement for that turn.\n\nCeiling Scuttler: The Cave Spider completely ignores all difficult terrain modifiers for climbing. It can move at its full speed of 40 across sheer walls and ceilings, and takes zero falling damage if it intentionally drops onto a target.\n\nAction-Based Abilities\nThe Jagged Drop (Melee Cost: 1 Action): The spider releases its grip on the ceiling and plummets onto an unsuspecting target. It moves up to 20 feet vertically and makes a Melee attack (+3 To-Hit). If successful, it deals 1d10 + 25 damage, and the sheer weight of its calcified thorax knocks the target Prone.\n\nParalyzing Bite (Melee Cost: 2 Actions): The spider's signature execution tool. Make a Melee attack (+3 To-Hit) against a target. If successful, it deals 1d10 + 15 damage, and the target must pass a severe Physique(10) test. On a failure, the venom takes hold—inflicting 1 Poison condition (1d10 damage) and the Stunned condition for 1 round.\n\nScuttle to the Shadows (Cost: 1 Action): Adhering to its hit-and-run nature, the spider instantly Disengages from melee combat without triggering any free attacks of opportunity. It can immediately move up to 20 feet, preferably up a wall or into a narrow crevice, to let its venom do the work.`},
{name:`Chaos Dwarf: The Lava-Forged (Bin Uluhm Taskmaster)`,size:`Medium`,type:`Humanoid / Corrupted`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`Hailing from the molten, volcanic depths of Bin Uluhm, these corrupted kin of the Dwarves have traded their honor for dark industry and infernal pacts. Their beards are singed and woven with jagged obsidian shards, their skin stained with soot and ash. Instead of building for the sake of the craft, they build engines of war and chains for the enslaved. Fueled by spite, burning malice, and the oppressive heat of their lava-forged home, they wield serrated blades and crude, explosive black-powder weapons, acting as ruthless, unforgiving taskmasters.`,agl:1,awa:5,cha:2,int:8,phy:9,wil:6,move:10,ap:3,def:7,wmArmor:13,wmBS:15,wmDP:20,wounds:45,focus:`0`,reroll:0,luck:1,meleeHit:`+4`,meleeDmg:`+25(2H)`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+15`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`Faith`,fear:`0`,mob:`2-6`,gear:`Serrated Black-Iron Cleaver, Volcanic Blunderbuss, Barbed Whip`,meleeDetail:`Serrated Black-Iron Cleaver`,rangeDetail:`Blunderbuss/Rifle`,abilities:`Passive Traits\nLava-Forged Resilience: Born in the infernos of Bin Uluhm, the Chaos Dwarf is completely immune to the Burning condition and takes 0 damage from mundane or magical Fire. If hit by a Fire-based attack, their obsidian armor absorbs the heat, automatically granting them +10 damage on their next Melee attack.\n\nThe Meat Shield (Cruel Taskmaster): The Chaos Dwarf surrounds itself with expendable thralls. If the Dwarf is targeted by a Melee or Ranged attack and has an allied minion (or a summoned slave) adjacent to them, the Dwarf can use its Reaction to violently pull the minion into the path of the blow, forcing the minion to take all the Wounds and effects instead.\n\nDark Engineering: Their weapons are crafted to maximize suffering. Any time the Chaos Dwarf rolls a Critical Hit, the jagged edges of their weapons automatically inflict 1 Bleeding and 1 Poisoned condition as toxic ash is ground into the wound.\n\nAction-Based Abilities\nSerrated Cleave (Melee Cost: 1 Action): A brutal hacking motion meant to rip flesh rather than cleanly cut. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 25 damage, and the jagged wound is so horrific that the target's healing received from spells or potions is halved for 1 full round.\n\nVolcanic Blunderbuss (Range Cost: 2 Actions): The Dwarf levels a crude, heavy firearm packed with black powder and obsidian shrapnel. Make a Ranged attack (+2 To-Hit) against all targets in a 15-foot cone. On a hit, targets take 2d10 + 15 Fire/Piercing Damage, are knocked 5 feet backward, and gain 1 Burning condition from the white-hot slag.\n\nCrack the Whip (Range Cost: 1 Action): The Dwarf weaponizes terror to drive its forces. It targets one allied minion or slave within 15 feet. That ally instantly takes 5 damage from the barbed whip, but the sheer adrenaline and fear grant the ally 1 free Action to immediately move or attack out of turn.`},
{name:`Chaos Dwarf: The Slag-Drudge`,size:`Medium`,type:`Humanoid / Corrupted`,tier:`Minion`,tierColor:`#607080`,desc:`The lowest of the low in the Bin Uluhm hierarchy. While the Taskmasters wield cruel whips and the Overseers build mighty machines, the Slag-Drudges are the miserable, soot-covered laborers who shovel the magma and haul the volatile black-powder. They are barely treated better than the slaves, clad in literal scrap iron and cooled slag strapped to their burned skin. They are half-blind from the forge-glare, deafened by industry, and fight out of sheer, terrified desperation and malicious spite.`,agl:-1,awa:0,cha:-2,int:0,phy:6,wil:5,move:8,ap:3,def:4,wmArmor:8,wmBS:0,wmDP:10,wounds:20,focus:`0`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+12`,meleeHeal:`0`,rangeHit:`+1`,rangeDmg:`+5`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`3-18`,gear:`usty Slag-Shovel, Unstable Black-Powder Flask, Scrap Iron.`,meleeDetail:`Rusty Slag-Shovel`,rangeDetail:`Hot Cinders`,abilities:`Passive Traits\nStrength in Misery: The Slag-Drudge is far more afraid of its boss than it is of the players. If a Slag-Drudge is standing within 30 feet of an allied Bin Uluhm Taskmaster or Overseer, it automatically gains Advantage on its Melee To-Hit rolls out of sheer terror of missing.\n\nSpiteful Demise: They carry unstable flasks of mining powder on their belts. When a Slag-Drudge is reduced to 0 damage, it spitefully detonates the flask. Every creature (friend or foe) within 5 feet must surpass Agility TN 5 + Resist bonus or take 10 Fire Damage from the blast.\n\nAsh-Blind: Having spent their entire lives staring into magma vents, they are completely immune to the Blinded condition and ignore all visibility penalties caused by smoke or ash.\n\nAction-Based Abilities\nShovel Strike (Cost: 1 Action): A desperate, heavy swing with a crude mining tool. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 12 Bludgeoning/Slashing Damage.\n\nHot Cinder Toss (Range Cost: 1 Action): The Drudge reaches into its apron and throws a handful of burning slag. Make a Ranged attack (+1 To-Hit) against a target within 15 feet. On a hit, it deals 5 Fire Damage and the target gains 1 Burning condition.\n\nCowardly Scramble (Cost: 1 Action): The Drudge drops to all fours to escape. It moves up to 15 feet. This movement completely ignores Difficult Terrain and does not trigger free attacks of opportunity.`},
{name:`Chaos Wizard (Warlock)`,size:`Medium`,type:`Humanoid`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A corrupted scholar who gazed too deeply into the void and let the void in. Shrouded in dark, shifting robes and surrounded by the smell of ozone and rotting copper, this caster is a living conduit for daemonic energies. They are physically frail, but the reality-bending magic they wield makes them an apocalyptic threat if left unchallenged on the battlefield.\n\nArtifact Drop: The Void-Glass Eye\nIf the party manages to corner and slay the Warlock before being torn apart by the void, they can loot the artifact from the scholar's cooling corpse.\n\nType: Magical Amulet / Wondrous Item\n\nRequirements: Can only be attuned by a character with at least 10 Willpower.\n\nDescription: This heavy, jagged amulet is strung on a chain of blackened iron. The centerpiece is a sphere of clouded, swirling glass that feels freezing cold to the touch. If stared at for too long, the smoke inside seems to form a slit, unblinking pupil. It smells faintly of ozone and old blood.\n\nCustom Passive Traits:\n\nWhispers in the Dark: The Eye is constantly feeding the wearer secrets from the void. The wearer gains a permanent +2 bonus to their Intellect and Awareness characteristics while the amulet is worn. However, the whispers make restful sleep nearly impossible. The wearer must pass a Willpower DV(10) test every morning; if they fail, they wake up with 1 Exhausted condition that cannot be removed until the next day.\n\nCorrupted Attunement: The amulet bonds with the wearer's lifeforce. If the wearer attempts to take the amulet off, they immediately suffer 3d10 undefendable damage as the void-glass fiercely resists being removed.\n\nAction-Based Abilities:\n\nGlimpse the Abyss (Cost: 1 Action): The wearer can clutch the amulet and channel its dark energy to cast the Gaze of the Abyss ability. They lock eyes with a target within 40 feet, forcing the victim to make a Willpower test. On a failure, the victim suffers 1 Stunned condition and loses all Damage Mitigation from their armor for their next turn.\n\nThe Void's Toll: Magic this dark always demands a price. Every time the wearer successfully uses the Glimpse the Abyss action, they must roll a d10. On a roll of 1 or 2, the Eye feeds directly on their lifeforce, causing the wearer to permanently lose 1 point from their maximum Physical characteristic.`,agl:2,awa:6,cha:7,int:9,phy:1,wil:8,move:12,ap:3,def:5,wmArmor:4,wmBS:10,wmDP:5,wounds:72,focus:`+3/9`,reroll:2,luck:2,meleeHit:`+2`,meleeDmg:`+8`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+25`,castHeal:`0`,castType:`Wizardry`,fear:``,mob:`1`,gear:`Magic Robes`,meleeDetail:`Short Sword or Long Sword`,rangeDetail:`None`,abilities:`Passive Traits\nConduit of the Void: The Warlock is not fully anchored to the material plane. They take only half damage from all non-magical physical attacks. However, if they take Wounds from a Holy or Radiant source, their connection to the void flickers, and they lose 1 Action on their next turn.\n\nShifting Robes: The dark, tearing energy around the Warlock bends light. Any Ranged attack (arrows, bolts, thrown weapons) made against the Warlock from further than 20 feet away automatically suffers Disadvantage.\n\nApocalyptic Presence: The smell of rotting copper and ozone suffocates the area. Enemies that start their turn within 30 feet of the Warlock cannot regain Focus points, and any active healing potions or spells cast in this radius heal for exactly half their normal amount.\n\nAction-Based Abilities\nGaze of the Abyss(TN7) (Casting Cost: 1 Action): Channeling the power of their artifact, the Warlock locks eyes with a target within 40 feet. Make a Casting attack (+4 To-Hit). If successful, it deals no Wounds, but the victim must make a Willpower(10) test. On a failure, the victim suffers 1 Stunned condition and loses all Damage Mitigation from their armor for their next turn as the void strips their defenses.\n\nOzone Rend(TN11) (Casting Cost: 2 Actions): The Warlock tears a hole in reality. Make a Casting attack (+4 To-Hit) against all targets in a 20-foot radius. On a success, targets take 2d10 + 25 Daemonic/Lightning Damage and are violently pushed 10 feet away from the epicenter of the blast.\n\nVoid Step(TN6) (Casting Cost: 1 Action): The Warlock folds space to protect their frail body. They instantly Disengage from melee combat without triggering any free attacks, teleporting up to 30 feet to an unoccupied space they can see, leaving behind a cloud of freezing, foul-smelling smoke.`},
{name:`Cherubim: The Iron-Beast`,size:`Giant`,type:`Celestial / Construct`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A Cherubim is a massive, four-legged entity standing 18 feet tall, its body forged from a living alloy of celestial bronze and iron. It possesses four distinct wings covered in thousands of flickering, golden eyes that see into every spectrum of existence—infrared, magical, and moral. Its most unsettling feature is its head, which continuously rotates to reveal four distinct faces: the Man (Wisdom), the Lion (Might), the Ox (Endurance), and the Eagle (Agility). Depending on which face is currently forward, the Cherubim’s fighting style shifts instantly. They are the ultimate "Living Weapon," designed to guard the gates of reality from anything that would dare approach the High Seat.`,agl:5,awa:8,cha:4,int:7,phy:12,wil:15,move:`20/27F`,ap:3,def:`9/11F`,wmArmor:`25/50`,wmBS:30,wmDP:`Immune`,wounds:320,focus:`+2/6`,reroll:2,luck:3,meleeHit:`+6/+8`,meleeDmg:`+35/+55`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+20`,castHeal:`0`,castType:`Faith`,fear:`6`,mob:`1`,gear:`None (It is the weapon)`,meleeDetail:`Brazen Hooves & Wings`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nOmniscient Wings: Covered in thousands of golden eyes, the Cherubim perceives the absolute truth of the battlefield. It is immune to the Blinded condition, ignores all forms of invisibility or magical darkness, and can never be Flanked.\n\nLiving Alloy: The Cherubim’s body is immune to mundane weaponry. Any physical attacks made with non-magical, non-adamantine weapons deal exactly half damage (before mitigation is applied) and have their armor sundering effects completely ignored.\n\nThe Fourfold Visage: At the start of the Cherubim's turn, its massive head violently rotates to reveal a new face, fundamentally altering its combat loop for that round:\n\nFace of the Lion (Might): Its Melee To-Hit becomes an overwhelming +8, and all Melee damage are increased by +20.\n\nFace of the Ox (Endurance): Its Armor Mitigation doubles to 50, and it becomes completely immune to being knocked Prone or moved.\n\nFace of the Eagle (Agility): It unfolds its wings, gaining a Flight speed of 80 feet, and its Defense increases to 11 while airborne.\n\nFace of the Man (Wisdom): It projects an aura of divine law. Any enemy attempting to cast a spell within 60 feet must surpass Willpower TN 12 + Resist bonus, or the spell fizzles and is wasted.\n\nAction-Based Abilities \nJudgment of the Hoof (Melee Cost: 1 Action): The Cherubim rears up and brings its celestial bronze hooves down on a target. Make a Melee attack (+6 To-Hit, modified by Visage). If successful, it deals normal 1d10 + 35 damage and permanently shatters the target's physical shield, if non-magical.\n\nSearing Gaze(TN9) (Casting Cost: 2 Actions): The thousands of eyes on its wings flare with blinding, infrared light. Make a Casting attack (+4 To-Hit) against a target within 40 feet. On a hit, it deals 2d10 + 20 Radiant Damage, and the target is permanently Marked. The Cherubim's melee attacks automatically gain Advantage against Marked targets.\n\nGatekeeper's Banishment (Melee Cost: 2 Actions): The Cherubim strikes the earth, unleashing a shockwave of moral and magical energy in a 20-foot radius. All enemies caught in the blast must surpass Physique TN 12 + Resist bonus or take 3d10 + 35 Radiant Damage and be violently thrown 15 feet away, landing Prone. Summoned creatures or undead hit by this blast take double damage.`},
{name:`Chimera: The Living Chaos`,size:`Large`,type:`Monstrosity`,tier:`Elite`,tierColor:`#b45309`,desc:`The Chimera is a staggering blasphemy of nature—a fusion of Lion, Goat, and Dragon. It is the ultimate "Chaos-Factor" in combat, as each head operates with its own intent, allowing the creature to breathe fire, gore with horns, and rend with claws all in the same breath. A nightmare stitched together from the scrap heap of creation, it is what happens when Nature has a mid-life crisis. Commonly found in rocky crags or desolate ruins, the Chimera is more than just a multi-headed beast—it is a three-way civil war held together by a single, bloodthirsty nervous system.`,agl:5,awa:8,cha:2,int:1,phy:9,wil:6,move:`20/33F`,ap:3,def:7,wmArmor:15,wmBS:10,wmDP:20,wounds:110,focus:`+1/3`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`4`,mob:`1`,gear:`None`,meleeDetail:`Claws, Horns, & Fangs`,rangeDetail:`Dragon's Scorch`,abilities:`Passive Traits\nThe Three-Way Civil War: Because the Chimera has three distinct brains, it is incredibly difficult to shut down. The Chimera is completely immune to the Charmed, Stunned, and Flanked conditions. If a spell or ability would normally Stun the creature, it only suppresses one of the heads for a round, costing it 1 Action instead of its entire turn.\n\nScrap-Heap Anatomy: The Chimera's internal organs are a tangled, nonsensical mess. Any Critical Hit landed on the Chimera only deals normal damage, as the attacker merely strikes a vestigial mass of muscle or a redundant bone plate instead of a vital organ.\n\nUnpredictable Thrashing: At the start of the Chimera's turn, roll a d6. On a 1 or 2, the Goat head takes charge (gains +15Ft Movement speed for that turn). On a 3 or 4, the Lion head takes charge (Melee attacks gain +10 damage). On a 5 or 6, the Dragon head takes charge (flies up to 20 feet without triggering attacks of opportunity).\n\nAction-Based Abilities \n(The Chimera uses its 3 Actions to let each head strike once per turn)\n\nLion's Rend (Melee Cost: 1 Action): The lion head lunges to tear flesh. Make a Melee attack (+4 To-Hit). If successful, it deals normal 1d10 +25 damage and automatically inflicts 1 Bleeding condition as its fangs lock in and violently shake.\n\nGoat's Gore (Melee Cost: 1 Action): The goat head delivers a brutal, concussive headbutt. Make a Melee attack (+4 To-Hit). If successful, it deals half Wound bonus, 1d10 + 13, but the sheer kinetic force knocks the target 10 feet backward and violently Prone.\n\nDragon's Scorch (Range Cost: 1 Action): The dragon head exhales a chaotic burst of flame. Make a Ranged attack (+3 To-Hit) against all targets in a 15-foot cone. On a hit, targets take 2d10 + 20 Fire Damage and gain 1 Burning condition.`},
{name:`Chlorofel Thorn-Wolf`,size:`Medium`,type:`Plant-Beast (Scout)`,tier:`Lore`,tierColor:`#607080`,desc:`Predatory plant-animal hybrids that blend perfectly into the vibrant colors of the Weald. They are the 'invisible' hunters of the forest canopy.`,agl:7,awa:4,cha:1,int:2,phy:6,wil:3,move:13,ap:4,def:5,wmArmor:8,wmBS:0,wmDP:0,wounds:35,focus:`1`,reroll:1,luck:0,meleeHit:`+5`,meleeDmg:`1d10+4`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`1d10+5`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`0`,mob:`1d10`,gear:`Needle Fur`,meleeDetail:`Serrated Bite`,rangeDetail:`Needle-Spray`,abilities:`Passive Traits\nPhotosynthetic Camouflage: The wolf gains Advantage on all Agility tests to hide while in the brush of the Chromatic Weald.\n\nNeedle Fur: Any creature striking the wolf with a melee attack takes 1d10-3 automatic piercing damage from the pine-needle coat.\n\nPack Tactics: The wolf gains a +1 To-Hit bonus for every other Chlorofel creature currently engaged with the same target.\n\nAction-Based Abilities\nNeedle-Spray (1 Action): Ranged +5. The wolf shakes its coat, firing needles in a 15ft cone. Deals 1d10+5 damage and causes 1 Bleeding condition.\n\nSerrated Bite (2 Actions): If the hit is successful, the wolf latches on with hooked teeth. Target is Grappled (Def 0).\n\nFloral Scent (TN 6 - 1 Action): The wolf releases an alluring aroma. Target must pass a surpass Willpower TN 7 + Resist bonus or be Stunned for 1 turn.`},
{name:`Chromatic Dragon: The Sovereign (The Five-Fold Ruin)`,size:`Titanic`,type:`Dragon / Mythic`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Sovereign is a terrifying sight. Her main body is covered in scales that shift and shimmer like oil on water, showing glimpses of every chromatic color. She possesses five long, serpentine necks, each ending in a head representing a different element. To face her is to face five different bosses at once. Each head has its own personality and its own "initiative" in combat. She doesn't just attack; she creates a symphony of elemental destruction where fire melts what the ice has frozen, and acid dissolves what the lightning has shattered.`,agl:4,awa:9,cha:15,int:6,phy:21,wil:12,move:`33/67F`,ap:5,def:8,wmArmor:40,wmBS:35,wmDP:`Immune`,wounds:850,focus:`+3/9`,reroll:5,luck:0,meleeHit:`+7`,meleeDmg:`+70`,meleeHeal:`0`,rangeHit:`+6`,rangeDmg:`+50`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`8`,mob:`1`,gear:`The ruined wealth of five fallen kingdoms`,meleeDetail:`Five Maws & Titanic Claws`,rangeDetail:`The Symphony of Breath`,abilities:`Passive Traits\nThe Five-Fold Initiative: The Sovereign does not take a single turn. Instead, her 5 Actions are split across the initiative order. At the start of combat, the GM rolls 5 distinct initiatives (one for Red, Blue, Green, Black, and White). Each head takes exactly 1 Action on its specific turn. If the Sovereign's Wounds drop by 170 (one-fifth of her health), one head is severed, permanently reducing her Actions by 1.\n\nChromatic Shimmer: Her scales constantly shift elements to protect her. At the end of every round, she absorbs the element of the last spell or magical attack that hit her, becoming completely immune to that specific damage type for the entirety of the next round.\n\nElemental Symphony (Combo Magic): The heads work in tandem to multiply destruction. If a target is currently suffering from an elemental condition (like Burning or Frozen) and is hit by a different elemental breath weapon from the Sovereign, the conflicting magic violently combusts, dealing an additional 3d10 undefendable damage.\n\nAction-Based Abilities (5 Actions to Spend - 1 Per Head)\n(Each head uses its specific action on its own initiative turn)\n\nThe Red/Black Maw (Range Fire/Acid - Cost: 1 Action): The head exhales a 60-foot cone of either melting acid or roaring flame. Make a Ranged attack (+6 To-Hit). On a hit, targets take 1d10 + 50 damage and gain either 1 Burning or 1 Melting condition (permanently degrading armor).\n\nThe Blue/White Maw (Range Lightning/Cold - Cost: 1 Action): The head fires a 100-foot line of blinding lightning or freezing ice. Make a Ranged attack (+6 To-Hit). On a hit, targets take 1d10 + 50 damage and are either Stunned (Lightning) or have their Movement reduced to 0 for 1 round (Cold).\n\nThe Green Maw (Melee Poison Gas - Cost: 1 Action): The green head sweeps the battlefield, biting a specific target. Make a Melee attack (+7 To-Hit). If successful, it deals 1d10 + 70 damage and the target is swallowed by a cloud of toxic gas, suffering the Blinded and Poisoned conditions (d10 damage).`},
{name:`Clay Golem: The Tomb Guardian`,size:`Large`,type:`Construct / Elemental`,tier:`Elite`,tierColor:`#b45309`,desc:`Clay Golems are not merely statues; they are semi-liquid constructs of primordial clay imbued with a fragment of a spirit. Standing nearly ten feet tall, the golem has a disproportionately large upper body with long, trunk-like arms. Its head is a featureless dome, save for a single glowing glyph etched into its forehead. Its surface is perpetually damp and shifting. Unlike stone or iron golems, the clay version is disturbingly silent, its footsteps making a soft "thud-squelch" sound on the stone floors of the tombs it protects. When struck, the clay doesn't shatter; it ripples like water, sealing the wound almost as quickly as it is made.`,agl:5,awa:6,cha:1,int:2,phy:9,wil:8,move:12,ap:3,def:7,wmArmor:12,wmBS:15,wmDP:`Immune`,wounds:95,focus:`0`,reroll:1,luck:0,meleeHit:`+4`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1-2`,gear:`None`,meleeDetail:`Trunk-like Arms`,rangeDetail:`None`,abilities:`Passive Traits\nRippling Clay (Self-Sealing): Mundane weapons get stuck in its body or pass through harmlessly. Any physical Melee attack that deals Slashing or Piercing Damage has its total damage cut in half before Armor Mitigation is even applied. Furthermore, the Golem is completely immune to the Bleeding and Fatigued conditions.\n\nSilent Squelch: Despite being 10 feet tall, the Clay Golem makes virtually no sound. It automatically succeeds on Agility tests to move silently, granting it Advantage on its opening attacks against a party that is relying solely on hearing to navigate a dungeon.\n\nBerserk Degradation: If the glowing glyph on its forehead takes targeted magic damage, or the Golem's Health drops below 20%, the binding spirit fractures. The Golem enters a mindless Frenzy, attacking the closest creature (friend or foe) with Advantage on all To-Hit rolls, completely ignoring any defensive tactics.\n\nAction-Based Abilities\nTrunk-Arm Slam (Cost: 1 Action): The Golem brings down a massive, mud-caked fist. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 25 Bludgeoning Damage, and the target must surpass Physique TN 8 + Resist bonus or be knocked Prone.\n\nSmothering Embrace (Melee Cost: 2 Actions): The Golem attempts to absorb a target into its semi-liquid chest. Target one adjacent enemy. Make a Melee attack (+4 To-Hit). On a hit, it deals 20 Bludgeoning Damage, and the target is pulled into the clay. The target is instantly Grappled, Restrained, and Silenced (unable to breathe or cast verbal spells). They take 10 Suffocation damage at the start of their turn until they use an Action to break free.\n\nGlyph of Sluggishness (Cost: 1 Action): The glyph on the Golem's featureless dome flares with ancient curse magic. All enemies within a 20-foot radius must surpass Willpower TN 7 + Resist bonus. On a failure, their Movement speed is reduced by half on their next turn, and they cannot use Reactions, replicating the heavy, dragging sensation of wading through deep mud.`},
{name:`Cloud Giant: The Masked Noble`,size:`Enormous`,type:`Giant / Elemental`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Standing 30 feet tall, these gilded aristocrats of the sky wear masks of frozen mist and flowing silks that defy gravity. They do not merely live in the sky; they weaponize the very atmosphere, crushing intruders under the sheer weight of the air itself. High-ranking nobles wear masks of "cloud-silver" that change expression based on their current mood, from aloof amusement to terrifying wrath. Adorned in jewelry carved from sky-sapphires and silks that never stain, their very presence feels expensive, intimidating, and suffocating to lesser beings.`,agl:4,awa:5,cha:12,int:8,phy:18,wil:9,move:`27/40F`,ap:3,def:7,wmArmor:40,wmBS:30,wmDP:`Immune`,wounds:600,focus:`+4/12`,reroll:3,luck:2,meleeHit:`+6`,meleeDmg:`+50`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+40`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`9`,mob:`1`,gear:`Mask of Frozen Mist, Sky-Sapphire Scepter, Gravity-Defying Silks`,meleeDetail:`Sky-Sapphire Scepter`,rangeDetail:`Atmospheric Crush`,abilities:`Passive Traits\nWeight of the Sky: The Cloud Giant weaponizes the ambient air pressure around them. The area within 60 feet of the Giant is treated as extreme Difficult Terrain for all hostile creatures. Any enemy that attempts to Move or Dash within this radius must pass a severe Physique(12) test or have their Movement reduced to 0 for the turn, pinned by the heavy air.\n\nMask of Frozen Mist: The Giant's shifting cloud-silver mask protects their mind and senses. They are completely immune to the Blinded, Charmed, and Taunted conditions. If a player attempts to target the Giant with a psychological or illusion spell, the mask shifts to an expression of terrifying wrath, reflecting the spell's energy back as 20 Psychic Damage.\n\nUntouchable Silks: The Giant floats effortlessly. They are completely immune to falling damage, ignore all ground-based traps or hazards, and cannot be knocked Prone, Grappled, or Restrained by any creature smaller than Enormous size.\n\nAction-Based Abilities\nScepter of the Stratosphere (Melee Cost: 1 Action): The Noble swings a massive, gilded scepter with terrifying grace. Make a Melee attack (+6 To-Hit) with a massive 30-foot reach. If successful, it deals 1d10 + 50 Bludgeoning/Force Damage, instantly shattering any non-magical shields.\n\nBarometric Implosion (Range Cost: 3 Actions): The Giant clenches their fist, instantly increasing the atmospheric pressure in a localized 30-foot radius up to 100 feet away. Make a Ranged attack (+5 To-Hit). On a hit, all targets take 4d10 + 40 Force/Bludgeoning Damage. Any metal armor worn by the targets is instantly bent, reducing their Damage Mitigation by 5 for the rest of the encounter as it crushes inward.\n\nGale-Step Reposition (Cost: 1 Action): The Giant dissolves into a flurry of pristine white clouds and instantly teleports up to 80 feet to an unoccupied space. This movement does not trigger attacks of opportunity and leaves behind a localized vacuum that violently pulls all enemies within 20 feet of their previous location 15 feet inward, causing them to collide and fall Prone.`},
{name:`Crimson Tri-Mantis`,size:`Large`,type:`Beast / Insectoid`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A blood-red apex predator standing 12 feet tall. Its three bladed forelimbs move so fast they create a whistling vacuum in the air before they strike. It does not stalk prey slowly; it waits in absolute, terrifying stillness before erupting into a blur of crimson and severing limbs before the victim even hears the sound of the air tearing.`,agl:9,awa:6,cha:1,int:2,phy:8,wil:5,move:27,ap:3,def:7,wmArmor:9,wmBS:8,wmDP:30,wounds:80,focus:`+2/6`,reroll:1,luck:1,meleeHit:`+4`,meleeDmg:`+20/+30`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-2`,gear:`Razor Chitin`,meleeDetail:`Tri-Bladed Forelimbs`,rangeDetail:`None`,abilities:`Passive Traits\nVacuum Strikes: The sheer speed of the Mantis's forelimbs warps the air pressure around the blades. Its Melee attacks completely ignore the Armor Mitigation provided by physical shields, and players cannot use the "Parry" reaction to deflect its blows, as the vacuum simply pulls their weapons out of alignment.\n\nCompound Omnivision: The Tri-Mantis's massive, multifaceted eyes process movement in a 360-degree arc. It is completely immune to the Blinded and Flanked conditions, and attackers can never gain Advantage from striking it from behind or from Stealth.\n\nCrimson Stillness: Despite being bright red, it perfectly mimics bloody detritus or specific crimson flora in its environment. If it remains completely motionless, it gains Advantage on Stealth checks. If it attacks a target who hasn't detected it, it automatically wins the Initiative tie for that round.\n\nAction-Based Abilities\nWhistling Cleave (Melee Cost: 1 Action): A blindingly fast slash with one of its bladed arms. Make a Melee attack (+4 To-Hit). If successful, it deals normal 1d10 + 20 damage and automatically inflicts 1 Bleeding condition as the razor-edge surgically parts flesh.\n\nVacuum Guillotine (Melee Cost: 2 Actions): The Mantis strikes with two blades simultaneously, crossing them like scissors to create a localized barometric drop. Make a Melee attack (+4 To-Hit). If successful, it deals 2d10 + 30 damage, and the target is Deafened and Stunned for 1 round as the sudden vacuum pops their eardrums and stuns their nervous system.\n\nPredator's Vault (Cost: 1 Action): Relying on its powerful hind legs, the Mantis instantly Disengages from melee combat without triggering free attacks of opportunity. It leaps up to 30 feet in any direction (including vertically). Upon landing, any adjacent enemy must surpass Agility TN 9 + Resist bonus or be knocked Prone by the sheer force of the impact.`},
{name:`Crypt Guard: The Eternal Sentry`,size:`Medium`,type:`Undead / Construct`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A harrowing sight—a skeleton draped in the rusted, pitted remains of once-glorious plate armor. Frayed tabards bearing faded heraldry hang from their ribcages. They simply stand in the dark, their hollow eye sockets glowing with cold blue balefire. Unlike common undead, the Crypt Guard retains the muscle memory of its former life. They move with a chilling, mechanical precision, interlocking shields as if still on the battlefields of the living. To them, every living thing is a grave robber, and the only penalty for trespassing is a cold blade to the heart.`,agl:5,awa:6,cha:1,int:2,phy:8,wil:9,move:10,ap:3,def:7,wmArmor:`10/20`,wmBS:15,wmDP:`Immune`,wounds:45,focus:`+1/3`,reroll:0,luck:0,meleeHit:`+2/+4`,meleeDmg:`+8/20(2H)`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`6`,mob:`1-8`,gear:`Rusted Broadsword, Heavy Iron Shield, Pitted Plate Armor.`,meleeDetail:`Rusted Broadsword w/ Shield or 2H Weapon`,rangeDetail:`None`,abilities:`Passive Traits\nPhalanx Discipline: If a Crypt Guard ends its turn adjacent to at least one allied Crypt Guard, they automatically interlock shields. While interlocked, they gain Advantage on all Defense checks against frontal attacks, and they become completely immune to being pushed backward or knocked Prone.\n\nCold Vengeance (Undead Fortitude): They simply do not care about environmental trauma. The Crypt Guard is completely immune to the Bleeding and Fatigued conditions. Furthermore, they ignore all Movement penalties from difficult terrain if it was created by environmental hazards (like a wall of fire, acid pools, or caltrops), marching straight through the pain.\n\nVeteran's Muscle Memory: Their combat reflexes are ingrained in their bones. If an enemy makes a Melee attack against the Crypt Guard and misses, the Guard may immediately use its Reaction to make a Melee attack (1 Action) (+4 To-Hit) in retaliation.\n\nAction-Based Abilities \nGrinding Advance (Melee Cost: 2 Actions): The Guard steps forward in perfect unison and thrusts. It moves 5 feet directly toward an enemy and makes a Melee attack (+2 To-Hit). If successful, it deals 20 damage, and the target is forcefully pushed 5 feet backward to make room for the marching wall.\n\nShield Wall Lock (Cost: 2 Actions): The Guard plants its heavy iron shield into the stone floor and braces. Until its next turn, its Armor Mitigation doubles (from 10 to 20). Any physical Melee attack that strikes the Guard while braced causes the attacker's weapon to shudder violently, costing the attacker 1 Action on their next turn from the jarring impact.\n\nBalefire Strike (Melee Cost: 1 Action): The Guard channels the cold blue fire of its eyes down the blade of its sword. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 15 Cold/Necrotic Damage, and the target's Movement speed is halved on their next turn as the chill of the grave sinks into their muscles.`},
{name:`Daemon Lord: The Abyssal Strategist`,size:`Large`,type:`Fiend / Daemonic`,tier:`Elite`,tierColor:`#b45309`,desc:`Standing between 8 and 10 feet tall, the Daemon Lord possesses an aura of dark majesty that is almost physical, forcing even the most chaotic spirits to bow. Forged from the soul-stuff of fallen heroes, his armor is immaculate, and he carries a blade that can sever a soul with a scratch. When he speaks, reality itself tries to obey. He does not merely lead through strength, but through a supreme, cold intellect that views the mortal realms as a chessboard. To him, a Greater Daemon is simply an expensive, violent siege engine to be deployed and discarded.`,agl:2,awa:1,cha:8,int:9,phy:6,wil:8,move:`13/20F`,ap:3,def:7,wmArmor:20,wmBS:30,wmDP:`Immune`,wounds:110,focus:`+4/12`,reroll:3,luck:1,meleeHit:`+5`,meleeDmg:`+45(2H)`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+32`,castHeal:`0`,castType:`Wizardry`,fear:`7`,mob:`1`,gear:`oul-Forged Plate, The Abyssal Greatsword`,meleeDetail:`Abyssal Greatsword`,rangeDetail:`None`,abilities:`Passive Traits\nAura of Dark Majesty: The Lord's presence suppresses hope. Enemies within 30 feet of him cannot gain Advantage on any attack rolls, regardless of flanking or stealth. Additionally, any allied Daemons within this aura gain +5 to their damage dealt as they are driven to impress their master.\n\nThe Duelist King: If forced into a 1v1 engagement (meaning no other allies or enemies are adjacent to him and his target), his strikes sever the soul. Any target he hits in a 1v1 cannot be healed by magical means for 1 full round. Furthermore, he completely ignores the Flanked condition, smoothly pivoting to parry.\n\nMaster's Guard: Because he relies on flawless parrying rather than dodging, any Melee attack that fails to beat his Defense of 7 results in the attacker being smoothly deflected and pushed 5 feet backward, ruining their positioning.\n\nAction-Based Abilities\nThe Voice of Ruin(TN7) (Casting Cost: 1 Action): He speaks a command that reality forces mortals to obey. Make a Casting attack (+4 To-Hit) against a target within 40 feet. On a hit, it deals no Wounds, but the target must instantly use their Reaction to move up to 15 feet in a direction of the Lord's choosing (forcing them into traps, off cliffs, or away from the healer).\n\nFlawless Riposte (Melee Cost: 2 Actions): The Lord executes a breathtakingly precise sword technique. Make a Melee attack (+5 To-Hit). If successful, it deals normal 1d10 + 45 damage and the target is violently Disarmed. Make a Physique vs surpass Physique TN 7 + Resist bonus. if failed, their weapon is knocked 10 feet away, and they gain 1 Stunned condition from the agonizing shock to their nerves.\n\nGrand Commander's Edict(TN12) (Casting Cost: 1 Action): The Lord points his blade, directing the flow of battle. He chooses one player; immediately, any allied Daemon on the battlefield may use its Reaction to move its full speed toward that player and make a single Melee attack. If the Lord has no allies currently alive, this Action instead summons 1d10 Lesser Daemons to the edges of the battlefield.`},
{name:`Daemon Prince: The Ascended Favored`,size:`Medium`,type:`Fiend / Aberration (Former Mortal)aemon`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The ultimate "teacher's pet" of the Chaos Gods. Because they were once mortal, they possess a cruel, personal ambition that pure-blood daemons lack. They are walking trophies, adorned with "gifts" like crystalline skin, wings of shifting smoke, or armor fused directly to their nervous system. They are arguably more dangerous than older daemons because they understand humanity perfectly—they know how to break a knight's oath or exploit a wizard's pride. Other daemons respect them out of envy; they know the Prince is the "Favored Son," and to strike him is to invite the direct wrath of the gods.`,agl:8,awa:1,cha:9,int:2,phy:7,wil:4,move:`13/27F`,ap:3,def:6,wmArmor:15,wmBS:20,wmDP:`Immune`,wounds:75,focus:`+3/9`,reroll:2,luck:3,meleeHit:`+5`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+10`,castHeal:`0`,castType:`Wizardry`,fear:`5`,mob:`1`,gear:`A masterwork, corrupted mortal weapon (e.g., a twisted halberd or a screaming rapier).`,meleeDetail:`Screaming Rapier/Longsword`,rangeDetail:`None`,abilities:`Passive Traits\nThe Favored Son (Jealous Gods): The Chaos Gods are watching their pet perform. If any character other than the one the Prince is actively dueling deals damage to the Prince, the gods violently intervene. The interloping attacker instantly takes 1d10 undefendable Warp damage from a sudden burst of abyssal lightning.\n\nMortal Insight: He knows exactly how to wound human pride. If an enemy attacks the Prince and misses, the Prince mocks them, automatically gaining Advantage on his next Melee attack against that specific enemy.\n\nCrystalline Deflection: The gifts of his patron make his anatomy unpredictable. He is completely immune to Critical Hits (they only deal normal damage), and players cannot sever his limbs or disarm him, as his weapon is fused to his nervous system.\n\nAction-Based Abilities\nTheatrical Challenge(TN7) (Casting Cost: 1 Action): The Prince points his screaming blade at the strongest hero, demanding a duel. Make a Casting attack (+4 To-Hit) against one target within 40 feet. On a hit, it deals no Wounds, but the target is Charmed into a rage—they cannot willingly target anyone except the Prince on their next turn, and they suffer Disadvantage in their first turn of combat and or they attempt to flee.\n\nSmoke-Step Flourish (Melee Cost: 2 Actions): Moving with impossible, smoky grace, the Prince instantly Disengages without triggering free attacks of opportunity, teleports up to 20 feet, and makes a Melee attack (+5 To-Hit). If successful, it deals 1d10 + 25 damage.\n\nGift of Mutation (Melee Cost: 2 Actions): The Prince grabs an enemy and forces raw, warping chaos into their veins. Make a Melee attack (+5 To-Hit). If successful, it deals 2d10 + 15 Acid/Warp damage, and the target must pass a severe Physique(10) test. On a failure, their flesh temporarily warps: they gain 1 Poison condition (1d10 damage) and drop any weapons or shields they are holding as their hands painfully fuse into useless lumps of flesh for 1 round.`},
{name:`Dark Elf: Noktorian Gutter-Blade`,size:`Medium`,type:`Humanoid`,tier:`Minion`,tierColor:`#607080`,desc:`The bottom feeders of the Obsidian Chasm. While the Night-Blades are elite assassins, the Gutter-Blades are the desperate street-rats, scavengers, and disposable pawns of Noktorian society. Wrapped in soot-stained rags and wielding chipped, rusted shivs, they lurk in the darkest crevices of the subterranean city. They are underfed, uneducated, and entirely devoid of loyalty. They fight like cornered vermin—striking only when they have overwhelming numbers, using dirty tricks, and fleeing at the first sign of genuine danger.`,agl:6,awa:5,cha:0,int:0,phy:0,wil:0,move:12,ap:3,def:4,wmArmor:5,wmBS:3,wmDP:10,wounds:14,focus:`0`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+6`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`+4`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`4-12`,gear:`usted Shiv, Pouch of Blinding Spores, Soot-Stained Rags`,meleeDetail:`Rusted Shiv`,rangeDetail:`Pocket Spores, Throwing Dagger`,abilities:`Passive Traits\nChasm Vermin: The Gutter-Blades are entirely at home in the pitch black. They ignore all penalties for dim light or darkness. Furthermore, if a Gutter-Blade makes a Melee attack against a target that is already engaged with at least two other allied Gutter-Blades, they automatically gain Advantage on the To-Hit roll (Pack Tactics).\n\nCraven Flight: Their instinct is self-preservation above all else. If a Gutter-Blade takes any Wounds, or if they witness an allied Dark Elf die within 15 feet of them, they immediately use a Reaction to Disengage and move 15 feet away, scurrying up the nearest wall if possible.\n\nCrude Toxin: They don't have access to refined neurotoxins, so they smear their shivs with whatever venomous centipede ichor they can find. Any time a Gutter-Blade scores a Critical Hit with a Melee attack, the crude venom seeps in, applying 1 Poisoned condition to the target.\n\nAction-Based Abilities\nGut-Stab (Melee Cost: 1 Action): A desperate, upward thrust with a rusty blade. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 +6 Piercing Damage.\n\nPocket Spores (Range Cost: 1 Action): The Elf reaches into their rags and hurls a handful of bioluminescent fungal spores at a target's face. Make a Ranged attack against a target within 10 feet. On a hit, it deals no Wounds, but the target is Blinded for 1 round as the glowing powder burns their eyes.\n\nScurry (Cost: 1 Action): The Gutter-Blade drops to all fours, moving up to 30 feet. During this movement, they can climb vertical surfaces or hang from ceilings at their full movement speed without needing to make Agility tests.`},
{name:`Dark Elf: Noktorian Night-Blade`,size:`Medium`,type:`Humanoid`,tier:`Minion`,tierColor:`#607080`,desc:`Hailing from Noktoria, the Obsidian Chasm, these dark kin are the ruthless, subterranean mirrors of the Thalasien Elite. Where their surface cousins glide with stoic grace, the Night-Blades slink through absolute darkness clad in shadow-silk that seems to absorb light. They are sadistic, thriving on psychological warfare, cruel taunts, and lethal poisons. They do not fight fair; they strike from the ceiling, poison the air, and vanish before a counterattack can be mounted. To fight a Noktorian is to fight your own paranoia in the dark.`,agl:9,awa:6,cha:8,int:5,phy:1,wil:2,move:14,ap:3,def:7,wmArmor:8,wmBS:15,wmDP:20,wounds:28,focus:`+1/3`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+8`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+6`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`Wizardry`,fear:``,mob:`2-15`,gear:`Twin Noktorian Daggers, Hand-Crossbow, Vials of Spider-Venom, Shadow-Silk Cloak.`,meleeDetail:`Twin Daggers`,rangeDetail:`Throwing Dagger, Hand-Crossbow`,abilities:`Passive Traits\nNoktorian Venom: Every weapon the Night-Blade wields is coated in a debilitating subterranean neurotoxin. Any time they successfully deal damage to a target, that target automatically gains 1 Poisoned condition and takes an additional 5 Poison Damage at the start of their next turn on a failed physique(5) test.\n\nCruel Opportunist: They thrive on the suffering and disadvantage of others. If a Night-Blade attacks a target that is currently Prone, Blinded, or Poisoned, the Night-Blade automatically gains Advantage on their To-Hit roll.\n\nLight-Absorbing Silk: While in dim light or darkness, the Dark Elf is functionally invisible. They automatically win Initiative ties if striking from the shadows, and any Ranged attacks made against them in dim light suffer Disadvantage.\n\nAction-Based Abilities\nShadow-Slip (Cost: 1 Action): The Elf seemingly melts into the darkness. They instantly teleport up to 30 feet to any unoccupied space that is in shadow or dim light. This movement does not trigger attacks of opportunity and can be used to move vertically up walls.\n\nWhispers in the Dark (Cost: 1 Action): Weaponizing their 8 Charisma, the Elf projects cruel, terrifying whispers into the mind of a target within 40 feet. The target must surpass Willpower TN 5 + Resist bonus or become Shaken and Taunted (forced to attack wildly into the darkness rather than assisting their allies) for 1 round.\n\nSurgical Twin-Strike (Melee Cost: 2 Actions): The Elf steps out of the shadows for a rapid double-stab. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 15 Piercing Damage, applies the Noktorian Venom, and reduces the target's Movement by half on their next turn as the tendons are clipped.`},
{name:`Deer(Stag): Ghost of the Deep Woods`,size:`Medium`,type:`Beast`,tier:`Minion`,tierColor:`#607080`,desc:`The Deer is the ghost of the deep woods. While often viewed as mere prey by the more aggressive inhabitants of the forest, the Deer is a master of evasion and sensory awareness. A mature Stag, with its crown of jagged antlers and powerful, spring-like musculature, can be quite formidable when cornered or during the "rutting" season. They are the first to know when danger enters the grove. Some druidic circles believe the eldest Stags act as vessels for the forest's own spirit, guiding travelers away from danger—or leading the unworthy into the heart of a briar patch.`,agl:9,awa:8,cha:4,int:1,phy:7,wil:5,move:20,ap:3,def:6,wmArmor:5,wmBS:10,wmDP:10,wounds:20,focus:`+1/3`,reroll:1,luck:1,meleeHit:`+2`,meleeDmg:`+15`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-5`,gear:`None`,meleeDetail:`Hammering Hooves & Antlers`,rangeDetail:`None`,abilities:`Passive Traits\nGhost of the Woods: The Stag leaves almost no tracks. It automatically gains Advantage on all Stealth checks while in a forest environment, and players suffer Disadvantage on any Awareness or Tracking checks trying to locate the herd.\n\nHyper-Sensory Alarm: The Deer is the first to know when danger approaches. It is completely immune to being ambushed or surprised. If combat breaks out, the Deer automatically wins all Initiative ties.\n\nSpring-Loaded Bound: The Stag ignores all Movement penalties associated with natural difficult terrain (like dense underbrush, mud, or shallow streams). It can leap up to 15 feet over obstacles or gaps without needing a running start.\n\nAction-Based Abilities\nStartled Dash (Cost: 1 Action): The Deer's primary survival instinct. It instantly Disengages from melee combat without triggering any free attacks of opportunity and uses its full Movement (50 feet) to sprint away from the nearest threat.\n\nThe Desperate Kick (Melee Cost: 2 Actions): If cornered, the Stag rears up and uses its hooves like hammers. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 15 damage, permanently shatters the target's equipped physical shield, and the target must pass a severe surpass Physique TN 7 + Resist bonus or suffer 1 Stunned condition from cracked ribs.\n\nRutting Charge (Cost: 2 Actions): The Stag lowers its crown of jagged antlers and charges. It moves up to 30 feet in a straight line and makes a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 15 Piercing Damage and violently knocks the target Prone.`},
{name:`Dire Wolf: The Winter-Hunter`,size:`Large`,type:`Beast`,tier:`Elite`,tierColor:`#b45309`,desc:`Roughly the size of a draft horse, a Dire Wolf weighs nearly 800 lbs of dense bone and corded muscle. Their fur is thick, coarse, and matted. Unlike standard wolves that rely merely on numbers, a single Dire Wolf is a credible threat to a seasoned warrior; a pack of them is a highly intelligent execution squad. They possess a "bone-crushing" bite force that exceeds a grizzly bear's, and they hunt by slamming into prey with the force of a battering ram, pinning targets to the ground before going for the throat.`,agl:7,awa:8,cha:1,int:2,phy:9,wil:5,move:23,ap:3,def:6,wmArmor:10,wmBS:8,wmDP:25,wounds:85,focus:`+1/3`,reroll:1,luck:1,meleeHit:`+4/+8`,meleeDmg:`+25/+35`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`4`,mob:`1-3`,gear:`None`,meleeDetail:`Bone-Crushing Jaws`,rangeDetail:`None`,abilities:`Passive Traits\nExecution Squad (Pack Tactics): The Dire Wolf fights with flawless, instinctual coordination. It automatically gains Advantage on all Melee attack rolls if at least one of its allies is adjacent to its target and isn't incapacitated.\n\nBattering Ram Momentum: The wolf uses its 800-lb mass as a weapon. If the Dire Wolf moves at least 20 feet in a straight line before making a Melee attack, the target must pass a severe Agility(7) test or be violently knocked Prone by the sheer kinetic impact.\n\nWinter's Stride: Born for the frozen wilds, the Dire Wolf completely ignores Movement penalties caused by ice, deep snow, or freezing mud. It also possesses natural resistance to Cold/Frost magic, taking exactly half damage from those sources.\n\nAction-Based Abilities\nBone-Crushing Bite (Melee Cost: 1 Action): The wolf snaps its massive jaws shut. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 25 normal damage. If this attack hits a target that is currently Prone, the sheer pressure of the bite shatters bone, inflicting 1 Stunned condition.\n\nThe Throat Pin (Melee Cost: 2 Actions): The wolf attempts to end the fight instantly. It leaps onto a Prone target and locks its jaws onto their neck. Make a Melee attack (+4 To-Hit). On a hit, it deals 2d10 + 35 damage, and the target is Grappled and Silenced (cannot speak or cast verbal spells). Until the target breaks the grapple, they automatically take 20 damage at the start of each of their turns. Make a Physique or Strength Conditioning  vs surpass Physique TN 7 + Resist bonus.\n\nPredator's Pivot (Cost: 1 Action): The wolf darts out of striking distance to circle its prey. It instantly Disengages from melee combat without triggering free attacks of opportunity and moves up to 30 feet, allowing it to set up another Battering Ram charge on its next turn.`},
