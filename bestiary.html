{name:`Ogre Witch-Doctor: The Blood-Speaker`,size:`Large`,type:`Humanoid (Giant-Kin / Caster)`,tier:`Elite`,tierColor:`#b45309`,desc:`The Witch-Doctor is a horrifying anomaly among ogres: one that has discovered the power of the spirit realm by consuming the brains of human wizards and elven seers. Adorned in rattling bone fetishes, bleached skulls, and crude totems of dried blood, they channel the chaotic, hungry magic of the "Great Maw." They do not cast elegant, academic spells. Instead, they vomit curses, boil the blood of their enemies, and hurl unstable elemental magic through rhythmic stomping and guttural, throat-tearing chants. To face a Blood-Speaker is to face a wizard trapped inside the body of a siege engine.`,agl:1,awa:4,cha:1,int:2,phy:6,wil:12,move:14,ap:3,def:5,wmArmor:10,wmBS:25,wmDP:30,wounds:90,focus:`+2/6`,reroll:2,luck:0,meleeHit:`+3`,meleeDmg:`+20`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+25`,castHeal:`+10`,castType:`Shaman`,fear:``,mob:``,gear:`Skull-Topped Fetish Staff, Bone Armor, Pouches of Reagents (Teeth, Blood, Ash)`,meleeDetail:`Fetish Staff`,rangeDetail:`None`,abilities:`Passive Traits\nGuttural Casting: The Witch-Doctor does not use delicate incantations. Their Casting attacks cannot be prevented by the Silenced condition, and they do not provoke counter-attacks when casting a spell while engaged in melee combat.\n\nBone Wards: The skulls hanging from the Ogre's armor are bound with protective spirits. Any Ranged attack made against the Witch-Doctor suffers Disadvantage, as the skulls animate to chatter and bite at incoming arrows.\n\nUnyielding Mass: Because of its Large size and immense density, the Witch-Doctor cannot be physically pushed, Grappled, or knocked Prone by Melee attacks from Medium or smaller creatures.\n\nAction-Based Abilities\nBlood-Boil Hex(TN7) (Casting Cost: 2 Actions): The Witch-Doctor locks eyes with a target and crushes a handful of raw meat. Target one enemy within 60 feet. Make a Casting attack (+4 To-Hit). On a hit, the target takes 1d10 + 25 Fire/Necrotic Damage as their blood literally cooks in their veins, and they gain the Weakened condition.\n\nSpirits of the Maw (Cost: 1 Action): The Ogre opens its mouth unnaturally wide and exhales a cloud of screaming, spectral jaws. All enemies in a 30-foot cone must surpass Agility TN 7 + Resist bonus or take 15 Necrotic Damage and lose 5 points of DM-B/S (Spell Mitigation) for the remainder of the encounter as the spirits tear away their magical defenses.\n\nCrushing Staff (Melee Cost: 1 Action): A brutal, straightforward slam with the massive iron-shod fetish staff. Make a Melee attack (+3 To-Hit). If successful, it deals 1d10 + 20 Bludgeoning/Necrotic Damage.`},
{name:`Oracle of Third Eye (Mystic)`,size:`Small`,type:`Humanoid / Caster`,tier:`Minion`,tierColor:`#607080`,desc:`A diminutive, floating mystic with three glowing eyes that rarely blinks. Being Small, it is incredibly difficult to hit, and it uses highly specialized magic to control the battlefield rather than relying on raw physical strength.`,agl:4,awa:5,cha:3,int:9,phy:2,wil:6,move:17,ap:4,def:11,wmArmor:3,wmBS:2,wmDP:0,wounds:10,focus:`+4/12`,reroll:2,luck:2,meleeHit:`0`,meleeDmg:`0`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+29`,castHeal:`0`,castType:`Wizardry`,fear:``,mob:`1-3`,gear:`Gilded Silks, Talisman of the Third Eye`,meleeDetail:`None`,rangeDetail:`None`,abilities:`Passive Traits\nForesight: The Oracle's third eye glimpses attacks before they happen. It forces any attacker rolling a natural 10 on a To-Hit against it to reroll the attack once per turn.\n\nAura of the Triad: Any ally within 15 ft of the Oracle gains +1 to their Willpower characteristic and +1 to their DM-B/S (Damage Mitigation - Bless/Spell).\n\nEthereal Float: The Oracle ignores all ground-based hazards, traps, and difficult terrain, hovering silently above the battlefield.\n\nActions\nMind Fracture(TN5) (Casting Cost: 1): Targets one enemy within 60 ft. The target must make a Willpower Save (vs Int 7). On a failure, they take 10 damage and gain the Confused condition, forcing them to move in a random direction on their next turn.\n\nThree-Fold Ward(TN8) (Casting Cost: 2): The Oracle places a glowing triangular ward on an ally. The next three times that ally takes damage, the damage is reduced by 10.\n\nGlimpse of the Void (Area Cost: 3): The Oracle opens its third eye fully, projecting a 30 ft cone of psychic agony. All enemies in the cone take 3d10 + Casting damage (10) and lose 1 Action on their next turn due to mental shock.`},
{name:`Orc Chieftain: The Iron-Breaker`,size:`Large`,type:`Orc / WarBoss`,tier:`Elite`,tierColor:`#b45309`,desc:`To become a Chieftain in the Orcish war-host, one must not only be the strongest, but the most violently relentless. The Iron-Breaker is a towering mountain of green muscle and jagged, bolted scrap-iron armor. He wields a massive, two-handed executioner's axe that looks more like a slab of sharpened anvil than a traditional weapon. Whether charging on foot or surveying the carnage from the back of his Wyvern, he bellows orders that inspire terrifying bloodlust in his warriors. He doesn't just want to defeat his enemies; he wants to break their lines, their armor, and their spirit in a single, deafening charge.`,agl:3,awa:5,cha:9,int:2,phy:15,wil:6,move:14,ap:4,def:10,wmArmor:20,wmBS:10,wmDP:25,wounds:130,focus:`+2/6`,reroll:3,luck:2,meleeHit:`+6`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1`,gear:`+2 Bolted Steel Armor, The Anvil-Axe (Heavy 2H Melee), Jagged Javelins`,meleeDetail:`The Anvil-Axe (Massive Executioner's Cleaver)`,rangeDetail:`Jagged Javelins. Hurled from the Wyvern's back up to 60ft`,abilities:`Passive Traits\nAura of the Warlord: The Chieftain's roaring presence dominates the battlefield. All allied Orcs within 60 feet are completely immune to the Shaken and Charmed conditions. Furthermore, any Orc that starts its turn in this aura gains a +2 bonus to their Melee damage.\n\nBloodlust Aura: The Chieftain’s very presence drives his war-host into a frenzy. All allied Orcs and beasts (including the Wyvern) within 40 feet of the Chieftain gain a permanent +10 to their Melee damage and become completely immune to the Fear and Charmed conditions as long as the Chieftain is alive.\n\nDeath Before Dishonor: If the Chieftain is reduced to 0 damage, his unbreakable Willpower kicks in. Instead of dying immediately, he remains at 1 Wound and instantly gains 1 free Action to make a final, desperate melee swing against the nearest enemy before collapsing.\n\nSky-Warlord's Bond: While mounted on the Wyvern, the Chieftain and the beast share their Initiative turn. The Chieftain cannot be forcefully dismounted or knocked Prone by any attack unless the attack specifically targets the saddle's rigging. Additionally, any Melee attacks made by the Chieftain against targets below him (while mounted) automatically gain Advantage.\n\nAction-Based Abilities\nExecutioner's Cleave (Melee Cost: 2 Actions): The Chieftain brings his massive anvil-axe down in a devastating, sweeping arc. Make a Melee attack (+6 To-Hit). If successful, it deals 2d10 + 45 damage and instantly sunders the target's defenses, permanently reducing their Armor Mitigation by 5. If this attack kills the target, all enemies within 30 feet must surpass Willpower TN 6 + Resist bonus or suffer 1 Fatigued condition from sheer terror.\n\nCommanding Bellow (Cost: 1 Action): The Chieftain roars a guttural command, dictating the flow of the battlefield. The Chieftain chooses one allied creature within 60 feet (often his Wyvern or an Orc lieutenant). That ally immediately gets to use its Reaction to make one free Melee attack or move up to half its Movement speed.\n\nLeap of the Iron-Breaker (Melee Cost: 2 Actions): Designed for when the Wyvern dive-bombs into the enemy ranks. The Chieftain leaps from the saddle directly into the fray. He can dismount as a free action and immediately make a Melee attack (+6 To-Hit) against an adjacent enemy. If this attack hits a target that is currently Prone or Stunned (like from the Wyvern's Sky-Crush), it deals an automatic 2 Bleeding conditions.\n\nShatter the Line (Cost: 2 Actions): The Chieftain lowers his shoulder and surges into the enemy ranks. He moves up to 30 feet in a straight line. Any enemy in his path must make an Agility(11) test against his Physical To-Hit. On a failure, they take 25 Bludgeoning Damage, are violently pushed 10 feet to the side, and are knocked Prone.`},
{name:`Orc: Bone-Shaman`,size:`Medium`,type:`Orc / Shaman`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Bone-Shaman holds a position in the war-host that the Chieftain tolerates rather than commands — the Spirits chose the Shaman, and arguing with the Spirits' choice has a poor historical success rate in Orcish culture. They are leaner than the warriors, older than most of the host, and carrying bones that are not all theirs in the fetish bundles at their belt. The Spirits they speak to are not gentle ancestors — they are the specific, named dead of battles past, each one with an opinion on current tactics.`,agl:4,awa:8,cha:5,int:5,phy:6,wil:12,move:12,ap:3,def:13,wmArmor:1,wmBS:5,wmDP:4,wounds:80,focus:`+2/6`,reroll:0,luck:3,meleeHit:`+2`,meleeDmg:`+8`,meleeHeal:`1`,rangeHit:`1`,rangeDmg:`+6`,rangeHeal:`1d10+10`,castHit:`0`,castDmg:`+14`,castHeal:`2d10+22`,castType:`Shaman`,fear:`Shamanism`,mob:`2`,gear:`1`,meleeDetail:`Bone-Fetish Staff, Spirit-Cord (braided from the hair of three dead Chieftains), Orcish hide-robes`,rangeDetail:`Bone-Fetish Staff (2H)`,abilities:`Passive Traits\nSpirit Sight: The Bone-Shaman sees spirits, recent dead, and invisible creatures as though they were fully visible. It cannot be surprised by spirit-based abilities.\n\nAncestral Ward: Allied Orcs within 30ft gain +1 DM against spell and blessing damage while the Shaman is alive — the ancestors stand between the living and what seeks them.\n\nThe Dead Are Opinionated: Once per encounter, when the Bone-Shaman rolls a natural 1 on a casting attempt, a Spirit intervenes and the roll is treated as a natural 5 instead. The Spirit then adds its opinion to the Shaman's next tactical decision, which the GM should roleplay as loudly as possible.\n\nAction-Based Abilities\nSpirit-Strike (TN 8, Casting Cost: 1 Action): The Shaman sends a named ancestor through a target's body. Make a Casting attack (+14 To-Hit) against a target within 50ft for 2d10 + 22 spirit damage. The target must surpass Willpower TN 8 + Resist bonus or become Shaken for 2 turns — the dead make poor houseguests.\n\nBattle-Cry of the Fallen (Cost: 2 Actions): The Shaman calls three named ancestors simultaneously. All allied Orcs within 40ft immediately lose any Shaken or Fatigued conditions and gain +2 To-Hit for 2 turns. This is the equivalent of the Shaman screaming at the top of its voice in a language only the host and the dead understand.\n\nBone-Cage (TN 11, Casting Cost: 2 Actions): The Shaman raises bone fragments from nearby dead — Orc, enemy, it does not matter — and drives them into a 10ft radius around a target point within 60ft. All creatures in the radius take 2d10 + 20 piercing damage and must surpass Agility TN 10 + Resist bonus or gain 1 Bleeding condition from the bone shrapnel. Once per encounter.`},
{name:`Orc: Green Tide Grunt`,size:`Medium`,type:`Humanoid (Orc)`,tier:`Minion`,tierColor:`#607080`,desc:`Before an Orc earns their scars and bulks up into a frontline terror, they start as Grunts. Smaller, leaner, and constantly bullied by their larger kin, Grunts form the rushing, chaotic vanguard of the Green Tide. They are clad in the rusted, discarded scraps of previous campaigns and wield crudely sharpened choppers. Individually, a Grunt is a sloppy, reckless combatant who relies on wild swings rather than martial discipline. However, they are rarely encountered alone; they swarm the battlefield in shouting, spit-flying mobs, eager to kill a hero and claim the gear needed to elevate their rank in the warband.`,agl:2,awa:1,cha:0,int:0,phy:4,wil:3,move:10,ap:2,def:5,wmArmor:10,wmBS:5,wmDP:10,wounds:25,focus:`0`,reroll:0,luck:0,meleeHit:`+1`,meleeDmg:`+8`,meleeHeal:`0`,rangeHit:`+1`,rangeDmg:`+4`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`5-20`,gear:`Rusted Chopper, Splintered Wood Shield, Stolen Trinkets.`,meleeDetail:`Rusted Chopper`,rangeDetail:`Crude Spear or Rock`,abilities:`Passive Traits\nMob Bravery: The Grunt is a coward when isolated. If it is not standing within 15 feet of at least one other allied Orc, it suffers a negative modifier to its Willpower(-1) tests. However, when adjacent to an allied Orc, it automatically gains Advantage on checks made to resist the Shaken condition.\n\nExpendable Fodder: The Grunt is completely worthless to the warband's hierarchy. When a Grunt is killed, it does not trigger any morale checks or panic in allied Orcs. In fact, larger Orcs can move freely through a Grunt's space by physically shoving them aside.\n\nReckless Charge: When the Grunt uses a Movement action to move at least 15 feet directly toward a target, its first Melee attack that turn deals an additional 3 Slashing Damage due to its wild momentum.\n\nAction-Based Abilities\nWild Hack (Melee Cost: 1 Action): A sloppy, wide swing with its rusted chopper. Make a Melee attack (+1 To-Hit). If successful, it deals 1d10 + 8 Slashing Damage.\n\nShield Bash (Melee Cost: 1 Action): The Grunt thrusts its splintered wooden shield forward to create space. Make a Melee attack (+1 To-Hit). On a hit, it deals 3 Bludgeoning Damage and physically pushes the target 5 feet away.\n\nScavenger's Throw (Range Cost: 1 Action): The Grunt hurls whatever is handy—a jagged rock, a broken spear, or a handful of dirt. Make a Ranged attack (+1 To-Hit). On a hit, it deals 1d10 + 4 Bludgeoning Damage and the target is mildly distracted, giving the next allied Orc to attack them Advantage on their To-Hit roll.`},
{name:`Orc: Green Tide Vanguard`,size:`Large`,type:`Orc / Warrior`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Vanguard is not the strongest Orc in the war-host. It is the one who volunteered to be at the front — which in Orcish culture is not a statement of courage so much as a statement of priority. The Vanguard wants to fight. It wants to fight first. The fact that being first also means absorbing the initial response is not a deterrent — it is, in its estimation, exactly the point. The Vanguard is the reason the Chieftain's armour stays clean in the opening minutes.`,agl:4,awa:4,cha:3,int:2,phy:12,wil:6,move:13,ap:2,def:16,wmArmor:5,wmBS:2,wmDP:2,wounds:70,focus:`+1/3`,reroll:3,luck:0,meleeHit:`+1`,meleeDmg:`+12`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`+12`,rangeHeal:`1d10+20`,castHit:`0`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`None`,mob:`1`,gear:`1`,meleeDetail:`War-cleaver (2H), Heavy Iron-plate (battlefield salvage), Iron Shield`,rangeDetail:`War-cleaver (Two-Handed)`,abilities:`Passive Traits\nIron Front: The Vanguard cannot be moved backward by knockback effects, Prone-inducing attacks, or positioning abilities while it still has 1 or more AP remaining. It has set itself. Moving it requires dealing with that first.\n\nBlood Welcome: When the Vanguard takes 15 or more wounds from a single hit, it gains 1 AP on its next turn (maximum +1 per turn from this ability). The host expected this. So did the Vanguard.\n\nBattle-Hardened: Immune to the Shaken condition.\n\nAction-Based Abilities\nCleave (Melee Cost: 2 Actions): A sweeping two-handed strike. Make a Melee attack (+12 To-Hit) against the primary target for 1d10 + 20 damage. If the attack hits, make a second attack at +8 To-Hit against any adjacent enemy — the follow-through is part of the intention.\n\nShield Charge (Melee Cost: 2 Actions): The Vanguard drives forward with its shield. Move up to 10ft in a straight line and make a Melee attack (+12 To-Hit) against any target in its path for 1d10 + 15 damage. On a hit, the target must surpass Physique TN 9 + Resist bonus or be knocked Prone and pushed 5ft backward.`},
{name:`Orc: The Green Tide Vanguard`,size:`Large`,type:`Humanoid (Orc)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The backbone of the "Green Tide," the Orc is a hulking, broad-shouldered humanoid with moss-colored skin, protruding tusks, and a temperament built for eternal warfare. Classified as a Medium creature, they lack the massive size multipliers of Ogres, but they make up for it with sheer aggressive tenacity. An Orc does not retreat; they view every scar as a badge of honor and every broken blade as a challenge to kill with their bare hands. They are the perfect middle-ground combatant—sturdier than a human and far more violent.`,agl:4,awa:6,cha:2,int:1,phy:9,wil:6,move:10,ap:3,def:6,wmArmor:15,wmBS:8,wmDP:12,wounds:45,focus:`0`,reroll:0,luck:0,meleeHit:`+3`,meleeDmg:`+14/+30(2H)`,meleeHeal:`0`,rangeHit:`+1`,rangeDmg:`+12`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`2-6`,gear:`Battered Iron Cleaver, Spiked Knuckles, Scrap Armor`,meleeDetail:`Iron Cleaver`,rangeDetail:`Bows`,abilities:`Passive Traits\nBare-Knuckle Brawler: If the Orc is disarmed or its weapon is broken, it does not suffer the standard penalties for fighting unarmed. Its Unarmed strikes deal 1d10 + 12 Bludgeoning Damage due to its spiked knuckles and raw 9 Physical strength.\n\nBattle-Hardened: The Orc’s thick skin and dense bone structure grant them a natural resistance to physical trauma. They gain a +2 bonus to their Physical Armor mitigation against any non-magical bludgeoning or slashing attacks.\n\nRelentless Fury: When an Orc is reduced to below 15 of its Total Wounds, it enters a state of primal rage. It ignores the effects of the Stunned condition and gains a +2 bonus to all Melee +To-Hit rolls until it is slain.\n\nGreen Tide Synergy: Orcs fight better in a frenzy of their own kind. For every other friendly Orc within 10 feet, the Orc gains a cumulative +1 bonus to its Willpower (up to a maximum of +4) as the collective bloodlust drowns out fear.\n\nAction-Based Abilities\nBrutal Headbutt (Melee - Cost: 1 Action): Often used when locked in close quarters, the Orc slams its thick skull into the opponent’s face. This attack deals +14 damage and requires the target to surpass Physique TN 9 + Resist bonus or suffer 1 Stunned condition.\n\nBlack-Iron Great Ax (Melee - Cost: 2 Actions): Reaching for the massive blade strapped to its back, the Orc delivers a crushing overhead split. Because this is a 2-Handed weapon, dealing a massive 1d10 +30 damage.\n\nGuttural Roar (Cost: 1 Action): The Orc beats its chest and unleashes a deafening war cry. All enemies within 15 feet must surpass Willpower TN 6 + Resist bonus or suffer the Dazed condition for 1 round, their ears ringing from the sheer volume.\n\nJagged Cleaver (Melee - Cost: 1 Action): The Orc swings a heavy, single-edged blade made of crude pig-iron. This 1-Handed strike leverages the Orc's high Physique to deal 1d10 + 14 damage. On an unmodified 10, the jagged edge inflicts 1 Bleeding condition.`},
{name:`Owlbear: The Silent Ravager`,size:`Large`,type:`Monstrosity`,tier:`Elite`,tierColor:`#b45309`,desc:`A furious, lumbering mass of feathers, fur, and muscle. It hunts with eerie silence in the dark, closing the distance before unleashing a flurry of armor-rending claws and a bone-crushing beak. A terrifying, heavily muscled apex predator, the Owlbear combines the crushing physical strength of a bear with the silent ferocity and acute senses of a giant owl. Because it is Large, its physical capabilities are significantly multiplied, allowing it to snap the spines of forest intruders as easily as dry kindling.`,agl:5,awa:6,cha:0,int:1,phy:9,wil:4,move:17,ap:3,def:4,wmArmor:9,wmBS:19,wmDP:20,wounds:90,focus:`0`,reroll:1,luck:0,meleeHit:`+4`,meleeDmg:`+24`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-2`,gear:`None`,meleeDetail:`Armor-Rending Claws / Bone-Crushing Beak`,rangeDetail:`None`,abilities:`Passive Traits:\nArmor-Rending: The Owlbear's claws are designed to peel bark and bone. Any time it rolls a Critical Hit with a Melee attack, it permanently reduces the target’s DM-Arm (Armor Mitigation) by 3 as it shreds through their protection.\n\nFrenzied Bloodlust: When the Owlbear is reduced below half of its total Wounds (45), it flies into a rage. Its Melee To-Hit increases to +1, and it ignores 1 point of Armor Mitigation on all targets it strikes.\n\nSilent Approach: Despite its massive size, its owl-like feathers absorb sound. The Owlbear's first attack in any combat encounter gains a +3 To-Hit bonus if it moved at least 20 ft from a flanking or hidden position.\n\nAction Based Abilities\nCrushing Beak (Cost: 1 Action): A devastating bite aimed at a vital area. Make a Melee attack (+4 To-Hit). If successful, it deals 24 Piercing Damage and ignores 5 points of the target's DM-Arm.\n\nTearing Flurry (Melee Cost: 2): A coordinated assault of swiping claws and a snapping beak. Deals normal 1d10 + 24 Melee damage and forces the target to make a Physique(8) Test. On a failure, the target gains 1 Bleeding condition.\n\nCrushing Bear Hug - (Melee Cost: 1): Can only be used on a target struck by the Tearing Flurry in the same turn. The Owlbear grapples the target, automatically dealing 2x Physique damage (18) and rendering the target Prone and Grappled.\n\nPiercing Screech - (Area Cost: 1): Unleashes a deafening, terrifying hoot-roar. All enemies within 30 ft must make a Willpower(7) Test or suffer 1 Stunned condition and be Deafened (Disadvantage on communication/awareness) for 2 turns.`},
{name:`Pegasus: The Star-Fire Mount`,size:`Large`,type:`Celestial (Beast)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A majestic, winged equine radiating celestial energy. Highly prized as a mount for pure-hearted champions, the Pegasus uses its Large size not for sheer brutality, but for unmatched aerial mobility and divine defensive capabilities. Born from sea foam and star-fire, the Pegasus is a creature of absolute grace. In combat, it is a blur of white feathers and flashing hooves, capable of breaking enemy lines from above before carrying its rider to safety.`,agl:9,awa:5,cha:3,int:2,phy:4,wil:6,move:`23/53F`,ap:3,def:8,wmArmor:6,wmBS:20,wmDP:25,wounds:74,focus:`+2/6`,reroll:2,luck:3,meleeHit:`+3`,meleeDmg:`+18`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1`,gear:`Pearlescent Coat, (or Celestial Barding if equipped by a rider)`,meleeDetail:`Flashing Hooves`,rangeDetail:`None`,abilities:`Passive Traits\nWind Rider: If the Pegasus flies at least 40 ft before attacking, its Melee To-Hit increases by +1 and its Defense increases by +2 against all Ranged attacks for the remainder of the round.\n\nAura of Purity: As a celestial being, it naturally wards off darkness. Allies (and its rider) within 30 feet of the Pegasus gain a +2 bonus to their DM-B/S (Damage Mitigation - Bless/Spell) and are immune to Fear conditions.\n\nEthereal Grace: The Pegasus is immune to all falling damage, ignores all difficult ground terrain, and does not trigger ground-based traps or pressure plates even when walking.\n\nAction Based Abilities\nFlashing Hooves (Cost: 1 Action): A rapid, rearing strike with its front hooves. Make a Melee attack (+3 To-Hit). If successful, it deals 1d10 + 18 Bludgeoning Damage.\n\nGalopping Escape - (Movement Cost: 1): The Pegasus instantly disengages from melee combat without triggering free strikes from enemies. It immediately flies up to 45 ft away, carrying its rider safely out of the fray.\n\nSoaring Dive (Movement/Melee Cost: 2): The Pegasus folds its wings and drops like a stone, striking with its front hooves. Deals normal 1d10 + 18 Melee damage. If the target is Medium or smaller, they must make a Physique(12) Test or take 1 Stunned condition and be knocked Prone.\n\nStar-Fire Flare (Cost: 1 Action): The Pegasus rears back and flares its wings, emitting a blinding flash of celestial light. All enemies within a 15-foot radius must surpass Agility TN 9 + Resist bonus to cover their eyes or suffer the Blinded condition for 1 round.`},
{name:`Pit Fiend: General of the Damned`,size:`Giant`,type:`Fiend (Devil / Boss)`,tier:`Boss`,tierColor:`#b91c1c`,desc:`The ultimate general of the infernal armies. A towering, winged monstrosity of hardened scales and roaring hellfire. As a Giant-sized creature with incredibly high Intellect, Willpower, and Physique, it dominates both physical combat and dark magic seamlessly. Wrapped in a cloak of literal hellfire and wielding a massive mace forged from the souls of the damned, the Pit Fiend is a master of dark strategy and brutal subjugation. It does not just kill; it conquers. To face a Pit Fiend is to stand against the organized, inevitable march of Hell itself.`,agl:3,awa:5,cha:6,int:18,phy:12,wil:9,move:`23/40F`,ap:4,def:13,wmArmor:30,wmBS:25,wmDP:`Immune`,wounds:266,focus:`+3/9`,reroll:2,luck:1,meleeHit:`+6`,meleeDmg:`+40/+90(2H)`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+5`,castDmg:`+36`,castHeal:`0`,castType:`Wizardry`,fear:`9`,mob:`1`,gear:`Hell-Forged Plate, The Scourge Mace, Cloak of Hellfire`,meleeDetail:`Scourge Mace Strike (+3)`,rangeDetail:`None`,abilities:`Passive Traits\nAura of the Inferno: The air around the Pit Fiend is superheated. Any enemy that ends its turn within 15 feet of the Fiend automatically takes 10 Fire Damage. The Fiend itself is completely immune to Fire and Poison damage.\n\nCloak of Hellfire (Aura): The Pit Fiend is wreathed in literal, roaring hellfire. Any creature that ends its turn within 15 feet of the Fiend, or successfully strikes it with a Melee weapon, automatically takes 10 Fire Damage.\n\nDiabolical Mind: With a 18 Intellect and 9 Willpower, the Pit Fiend is immune to all Charm, Fear, and Mind-Altering conditions. Furthermore, any spell cast at it with a To-Cast roll of less than 5 automatically fizzles out.\n\nLord of the Pit: Allied Fiends or Cultists within 60 feet gain a +2 bonus to their Melee To-Hit and share the Pit Fiend's Fear immunity, driven by their absolute terror of their master.\n\nAction Based Abilities\nExecutioner's Toll (Melee Cost: 1 Action): A brutal, calculated swing with its massive mace. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 40 Bludgeoning/Necrotic Damage. If this attack drops a target to 0 damage, their soul is instantly pulled into the mace, healing the Fiend for 20 damage.\n\nHellfire Mace (Melee Cost: 2 Actions): A crushing blow with its massive weapon. Deals normal 1d10 + 90 Melee damage. On an unmodified To-Hit roll of 9 or 10, the target must make a Physique(10) Save or gain 1 Stunned condition and 1 Bleeding condition.\n\nWord of Damnation(TN10) (Casting Cost: Actions 2): Speaks a word of pure dark magic at a target within 100 feet. The target must make a Willpower(13) Test. On a failure, they take 2d10 + 36 Casting damage, and the Pit Fiend heals for 5 damage as it leeches their life force.\n\nInfernal Command - (Area/Summon Cost: 3): Tears open a momentary rift to the hellscape. The Pit Fiend summons 1d10 Lesser Devils (use standard Imp or Cultist stats) to immediate adjacent spaces. These summoned creatures can act on the next turn.`},
{name:`Pit Hulk: Underworld Gladiator`,size:`Enormous`,type:`Fiend (Monstrosity)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A grotesque mountain of scarred muscle and iron chains bred exclusively for the infernal fighting arenas. To truly showcase the devastating impact of the Enormous size class, this creature trades the magical utility of the Pit Fiend for raw, unadulterated physical obliteration. A bloated, lumbering engine of violence. Its skin is a patchwork of thick scar tissue and embedded iron. It swings lengths of shattered arena chains like whips, pulverizing anything stupid enough to stand in its shadow. It knows no strategy, no magic, and no mercy—only the roar of the arena and the crunch of bone.`,agl:2,awa:6,cha:0,int:1,phy:18,wil:12,move:40,ap:3,def:9,wmArmor:30,wmBS:15,wmDP:`Immune`,wounds:532,focus:`0`,reroll:0,luck:0,meleeHit:`+5`,meleeDmg:`+50`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`8`,mob:`1`,gear:`A grotesque mountain of scarred muscle and iron chains bred exclusively for the infernal fighting arenas. To truly showcase the devastating impact of the Enormous size class, this creature trades the magical utility of the Pit Fiend for raw, unadulterated physical obliteration. A bloated, lumbering engine of violence. Its skin is a patchwork of thick scar tissue and embedded iron. It swings lengths of shattered arena chains like whips, pulverizing anything stupid enough to stand in its shadow. It knows no strategy, no magic, and no mercy—only the roar of the arena and the crunch of bone`,meleeDetail:`Massive Chain Whips`,rangeDetail:``,abilities:`Passive Traits\nNumb to the Pain: The Pit Hulk has endured so much punishment that it ignores all secondary damage from Bleeding, Disease, or Poison conditions.\n\nUnstoppable Colossus: Because of its Enormous size, it completely ignores Prone, Stunned, and Knockback effects from any creature of size Large or smaller.\n\nMeat Hooked: Whenever the Pit Hulk rolls an unmodified 8, 9, or 10 on a Melee To-Hit, its heavy chains wrap around the target. The target is instantly Grappled and pulled into an adjacent square.\n\nAction Based Abilities\nChain Sweep (Area Cost: 1): Swings its massive chains in a 30 ft arc. All enemies in the arc must make an Agility(1d10 + to-hit) Test or take 70 damage and be knocked Prone.\n\nLumbering Stomp (Cost: 1 Action): The bloated fiend raises a massive, iron-shod foot and slams it into the earth. All enemies within 15 feet of the Hulk must pass an Agility(1d10 + to-hit) test or take 20 Bludgeoning Damage and fall Prone from the localized earthquake.\n\nPulverizing Slam (Melee Cost: 3): Brings both massive chained fists down on a single target. Make a single To-Hit roll. If it connects, it deals double its massive Melee damage 1d10 + 100 damage and permanently shatters the target's equipped shield or weapon, if non-magical.\n\nRoar of the Blood Pit (Area Cost: 1): Beats its own chest and releases a guttural, terrifying roar. All enemies within 40 ft must make a Willpower(8) Test. On a failure, they are Shaken (Disadvantage on all To-Hit and Casting rolls) for 2 turns.`},
{name:`Plague Rat Swarm`,size:`Large`,type:`Swarms`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A seething, biting, chittering carpet of diseased rodents. They do not fight with tactics or strategy; they simply overwhelm by sheer numbers, tearing at armor gaps, climbing up legs, and spreading infectious filth.\n\n"Individually weak, but collectively a nightmare. A Rat Swarm moves as a single, fluid entity. Weapons that pierce or slash are largely ineffective against a tide of a thousand bodies. They must be burned, blasted, or crushed to be truly destroyed."\n\n`,agl:6,awa:5,cha:0,int:0,phy:1,wil:4,move:13,ap:3,def:3,wmArmor:0,wmBS:5,wmDP:`Immune`,wounds:50,focus:`0`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`100+`,gear:`None`,meleeDetail:`Swarming Bites (+2)`,rangeDetail:`None`,abilities:`Passive Traits\nSwarm Anatomy: The Swarm operates by completely different physical rules. It is utterly immune to the Grappled, Prone, and Paralyzed conditions. It takes half damage from all single-target Piercing or Slashing attacks, but possesses a severe vulnerability to Area-of-Effect attacks (like a fire spell or explosive), taking double damage from those sources.\n\nAmorphous Mass: The swarm can move through any gap or space large enough for a single rat. It completely ignores the Prone, Stunned, and Grappled conditions, and it cannot be flanked.\n\nSuffocating Presence: Any enemy that starts its turn sharing a space with the Rat Swarm automatically takes 5 Piercing Damage and suffers Disadvantage on all Ranged and Casting attacks due to rats constantly climbing up their legs.\n\nAction-Based Abilities\nDevouring Wash (Melee Cost: 1 Action): The Swarm thrashes violently. Make a Melee attack (+2 To-Hit) against every creature currently sharing a space with the Swarm. On a hit, it deals 1d10 + 10 Piercing Damage, and the target must surpass Physique TN 5 + Resist bonus or gain the Infected condition.\n\nSurge (Melee Cost: 2 Actions): The Swarm moves up to its full Movement speed in a straight line, rolling directly through enemy spaces. Any creature it passes through must surpass Agility TN 6 + Resist bonus or be knocked Prone and take 1d10 + 20 Piercing Damage as the rats scramble over them.\n\nCling and Gnaw (Cost: 1 Action): The rats attempt to physically weigh down a target. Make a Melee attack (+2 To-Hit) against one target sharing its space. On a hit, the target becomes Slowed (halving their movement speed) until they use an Action to physically brush the biting vermin off their armor.`},
{name:`Pyreborn Cinder-Djinn: The Loom-Bound`,size:`Large`,type:`Elemental (Pyreborn)`,tier:`Elite`,tierColor:`#b45309`,desc:`A spectacular fusion of Pyreborn metallurgy and raw elemental fury. By permanently binding their soul to the 'Loom' of fire, these warriors sacrifice their lower body to become a hovering pillar of sentient magma and flame. Its upper half is built of thick, corded muscle and charred-obsidian skin, adorned with heavy bronze bracers and collars. Its lower half tapers into a roaring cyclone of pure, surging flame that allows it to glide effortlessly across the battlefield. In its hands, it wields two impossibly huge, glowing-hot scimitars that slice through armor like butter. A Cinder-Djinn does not march to war; it flows, turning the battlefield into an inescapable oven.`,agl:6,awa:4,cha:2,int:3,phy:9,wil:5,move:`30/F`,ap:3,def:7,wmArmor:15,wmBS:10,wmDP:`Immune`,wounds:95,focus:`+2/6`,reroll:4,luck:5,meleeHit:`+4`,meleeDmg:`+23`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+5`,castDmg:`+16`,castHeal:`0`,castType:`None`,fear:``,mob:`1-3`,gear:`Dual Oversized Glowing Scimitars, Bronze Bracers.`,meleeDetail:`Oversized Scimitars`,rangeDetail:`None`,abilities:`Passive Traits\nMagma Cyclone: Because it hovers on a pillar of flame, the Cinder-Djinn completely ignores difficult terrain, ground-based traps, and the effects of deep water (though water produces blinding steam). Any creature that starts its turn adjacent to the Djinn takes 5 Fire Damage from the ambient heat.\n\nDual-Wielding Deflection: While wielding both of its oversized scimitars, the Cinder-Djinn can use its weapons to actively parry. It gains a permanent +1 to its Defense against all Melee attacks.\n\nElemental Core: The Djinn is completely immune to Fire damage and the Burning condition. However, it possesses a severe vulnerability to Cold damage, taking double damage from all frost or ice-based attacks as its obsidian skin fractures under thermal shock.\n\nAction-Based Abilities\nSearing Slash (Melee Cost: 1 Action): A brutal, sweeping strike with one of its glowing scimitars. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 23 Slashing/Fire Damage.\n\nScissor Cleave (Melee Cost: 2 Actions): The Djinn crosses both massive blades and shears them outward in a devastating executioner's strike. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 45 Slashing/Fire Damage, and the target's DM-Arm is ignored by 5 points as the molten metal melts through their plate.\n\nCyclone Dash (Cost: 1 Action): The Djinn surges forward on its pillar of flame. It moves up to 30 feet in a straight line without triggering defensive counter-attacks. Any enemy the Djinn passes adjacent to during this movement must surpass Agility TN 8 + Resist bonus or gain the Burning condition(1d10 damage).`},
{name:`Pyreborn Kin(Sun-Forged)`,size:`Medium`,type:`Humanoid (Pyreborn)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Pyreborn are the ultimate survivalists of the extreme. Culturally, they are the world’s greatest smiths and pyromancers, viewing fire not as a destroyer, but as the "Loom" of reality. Encased in heat-treated bronze and obsidian that would cook a normal human alive, they advance with the steady, unstoppable momentum of a lava flow. A Sun-Forged warrior does not dodge or retreat; they simply march forward, trusting their master-crafted armor to shatter enemy blades while they reduce the opposition to ash and slag.`,agl:2,awa:4,cha:1,int:3,phy:6,wil:9,move:17,ap:3,def:7,wmArmor:15,wmBS:10,wmDP:25,wounds:45,focus:`+1/3`,reroll:1,luck:0,meleeHit:`+4`,meleeDmg:`+10/+25(2H)`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+5`,castDmg:`+12`,castHeal:`0`,castType:`None`,fear:``,mob:`2-5`,gear:`Heat-Treated Bronze Armor, Obsidian Macem, Pyromancer's Focus`,meleeDetail:`Obsidian Mace`,rangeDetail:`None`,abilities:`Passive Traits\nSun-Forged: The Pyreborn Warrior is completely immune to all Fire and Heat-based damage. Furthermore, any spell or attack that utilizes Fire heals the Warrior for half the Wounds it would normally deal.\n\nMomentum of the Magma: Slow to start, but impossible to stop. The Warrior is immune to the Knockback and Prone conditions from any creature of Large size or smaller.\n\nTempered Weapons: The Pyreborn's mastery of the Loom means their weapons are always kept at a super-heated threshold. Their Melee attacks ignore 2 points of the target's DM-Arm (Armor Mitigation) as the heated obsidian melts through standard mail.\n\nAction-Based Abilities\nBreath of the Loom (Cost: 2 Actions): The Sun-Forged channels their innate pyromancy, unleashing a wave of roaring flame from their gauntlet. All enemies within a 15-foot cone must pass an Agility(d10+4) test or take 1d10 + 20 Fire Damage and gain the Burning condition.\n\nObsidian Greathammer (Melee Cost: 2): A devastating, heavy swing with a two-handed weapon. Deals normal 1d10 + 25 Melee damage. If the Warrior rolls an unmodified 9 or 10 on the To-Hit, the immense weight of the blow forces the target to make a Physique(6) Save or gain 1 Stunned condition.\n\nSearing Grasp (Melee Cost: 1): The Warrior drops one hand from its hammer and grabs the target with its superheated bronze gauntlet. Deals 1d10 Fire Damage. The target must make an Agility(6) Test or be Grappled, taking an additional 1d10 Fire Damage at the start of each of the Warrior's turns until they break free with a Physique vs surpass Physique TN 7 + Resist bonus.\n\nIgnite the Loom(TN7) (Casting/Area Cost: 1): The Warrior drags its obsidian hammer across its bronze armor, showering the area in a wave of pyromantic sparks. All enemies in a 15 ft cone must make an Agility Save or take 1d10 + 12 Fire Damage and gain 1 Bleeding (Burn) condition.`},
{name:`Pyreborn Thrall: The Living Supernova`,size:`Medium`,type:`Humanoid (Pyreborn)`,tier:`Minion`,tierColor:`#607080`,desc:`The Ember-Thralls are Pyreborn who have undergone the "Ritual of the Great Burn." Their skin has been systematically charred until it is as hard and brittle as anthracite, and their internal heat is so intense that they are perpetually wreathed in flickering, orange-red flames. They carry no shields and wear no armor, for they believe that to cover their burning spirit is a sin. In battle, they move with a frantic, twitchy energy, often lashing themselves with chains of heated bronze to keep their "inner fire" stoked. They don't seek to survive; they seek to be consumed. When an Ember-Thrall charges, they aren't just looking for a kill—they are looking to turn themselves into a human supernova.`,agl:6,awa:4,cha:1,int:0,phy:2,wil:5,move:17,ap:3,def:4,wmArmor:5,wmBS:10,wmDP:20,wounds:20,focus:`0`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+7`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`3`,mob:`3-10`,gear:`Heated Bronze Chains`,meleeDetail:`Thrashing Bronze Chains`,rangeDetail:`None`,abilities:`Passive Traits\nThe Human Supernova: When the Ember-Thrall is reduced to 0 damage by any means (or by its own Action), it instantly detonates. All creatures within a 15-foot radius must surpass Agility TN 6 + Resist bonus or take 20 Fire Damage and be violently knocked Prone. On a success, they take half damage and remain standing.\n\nWreathed in Flame: The Thrall's body is dangerously hot. Any creature that hits the Ember-Thrall with an Unarmed strike, or Grapples it, automatically takes 5 Fire Damage.\n\nMasochistic Zeal: The Ember-Thrall is completely immune to the Shaken and Charmed conditions. Furthermore, any time the Thrall takes Wounds but is not killed, its Movement speed increases by 10 feet for its next turn as the pain fuels its sprint.\n\nAction-Based Abilities\nScorched Lash (Melee Cost: 1 Action): A wild, frantic swing with its heated bronze chains. Make a Melee attack (+2 To-Hit) with a 10-foot reach. If successful, it deals 1d10 + 7 Fire Damage.\n\nStoke the Fire (Melee Cost: 1 Action): The Thrall violently whips its own back with the heated chains, voluntarily taking 2 damage. In exchange, its inner fire surges, granting it Advantage on its next Melee attack and expanding its "Human Supernova" detonation radius by 5 feet.\n\nThe Great Burn (Cost: 2 Actions): The Ember-Thrall actively forces its own core to go critical. The Thrall instantly dies, automatically triggering its "Human Supernova" passive trait exactly where it stands.`},
{name:`Pyreborn: Ember-Warrior`,size:`Medium`,type:`Humanoid / Pyreborn`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Pyreborn Ember-Warrior carries verath gems crystallising through the skin of their forearms — visible as amber-orange lights beneath the surface that brighten when their temperature rises. They are the Ashlands' standard fighters, shaped by a culture that treats fire as a relationship rather than a resource. They do not fear heat. They do not fear burning. They find the concept that other peoples find fire threatening to be faintly bewildering, the way a fish might be bewildered by the concept of drowning.`,agl:6,awa:5,cha:5,int:4,phy:9,wil:6,move:15,ap:2,def:15,wmArmor:3,wmBS:2,wmDP:4,wounds:50,focus:`+1/3`,reroll:2,luck:0,meleeHit:`+1`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`+10`,rangeHeal:`1d10+16`,castHit:`0`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`None`,mob:`—`,gear:`1`,meleeDetail:`Verath-Forged Warblade, Ashlands half-plate (heat-treated), Thermal Ward (passive gem effect)`,rangeDetail:`Verath-Forged Warblade (One-Handed) — blade holds heat`,abilities:`Passive Traits\nVerath Resonance: The Ember-Warrior is immune to fire and heat damage of all kinds. Cold and ice-based attacks deal +2 damage per hit as the temperature differential disrupts the gem resonance.\n\nHeat-Forged: When the Ember-Warrior takes 10 or more wounds from a single hit, their verath gems flare. Their next melee attack deals an additional 1d10 fire damage as the heat vents through the blade. This is involuntary — a reflex, not a choice.\n\nAshlands Endurance: Immune to the Fatigued condition. Pyreborn do not exhaust in their home environment's conditions.\n\nAction-Based Abilities\nVerath Strike (Melee Cost: 1 Action): A standard strike channelling gem-heat through the blade. Make a Melee attack (+10 To-Hit) for 1d10 + 16 damage. The target must surpass Physique TN 7 + Resist bonus or gain 1 Burning condition — losing 1d10 damage per turn for 2 turns.\n\nSolar Surge (Melee Cost: 2 Actions): The warrior drives heat through their body into a single devastating strike. Make a Melee attack (+10 To-Hit) for 2d10 + 20 damage. This attack ignores 4 points of the target's DM-Armour — the heat transfers through metal without caring about its arrangement. Usable once per encounter.`},
{name:`Pyreborn: Vein-Caller`,size:`Medium`,type:`Humanoid / Pyreborn`,tier:`Elite`,tierColor:`#b45309`,desc:`The Vein-Callers are the Pyreborn who hear the Titan. Most Pyreborn sense it as warmth, as the background heat of their ancestry. The Vein-Callers hear it as voice — not language, but intent, the vast geological pressure of something immense and barely sleeping pressing against the underside of the world. They channel that signal into their casting and the result is fire that behaves as though it has a destination it chose before it was summoned. The Birn Uluhm wants them. The Vein-Callers understand what that means. They have prepared accordingly.`,agl:5,awa:7,cha:6,int:6,phy:6,wil:11,move:13,ap:3,def:14,wmArmor:2,wmBS:5,wmDP:3,wounds:85,focus:`+2/6`,reroll:0,luck:3,meleeHit:`+2`,meleeDmg:`+8`,meleeHeal:`1`,rangeHit:`1`,rangeDmg:`+6`,rangeHeal:`1d10+10`,castHit:`0`,castDmg:`+14`,castHeal:`2d10+24`,castType:`Shaman`,fear:`Shamanism`,mob:`—`,gear:`1`,meleeDetail:`Verath-Core Focus Staff, Ashlands ceremonial armour, Titan-resonance crystals (×3)`,rangeDetail:`Verath-Core Staff (2H)`,abilities:`Passive Traits\nTitan's Frequency: The Vein-Caller hears the Titan's pulse. It is immune to Aakzad frequency-based abilities and the Resonant Drone aura — the Aakzad frequency and the Titan frequency are the same signal, and the Vein-Caller knows both sides of the conversation.\n\nVerath Immunity: Fully immune to fire and heat damage. Cold deals +2 damage per hit.\n\nThe Waking Signal (Aura): Allied Pyreborn within 40ft gain +2 to all Willpower tests and +1 to all Physique tests while the Vein-Caller is conscious — the Titan's signal steadies those attuned to it.\n\nAction-Based Abilities\nTerra-Pulse (TN 9, Casting Cost: 2 Actions): The Vein-Caller drives a pulse of Titan-frequency into the ground. Make a Casting attack (+14 To-Hit) targeting a 15ft radius within 60ft. All creatures in the radius must surpass Physique TN 9 + Resist bonus or take 2d10 + 20 fire/seismic damage and be knocked Prone as the ground itself answers the call.\n\nVein-Sight (Cost: 1 Action): The Vein-Caller reads the Titan's signal. For 2 turns, it can sense all living creatures within 100ft regardless of cover, darkness, or invisibility — the Titan-frequency passes through everything. During this time its casting attacks gain Advantage.\n\nGeothermal Surge (TN 12, Casting Cost: 3 Actions): Once per encounter. The Vein-Caller opens a direct channel to the Titan for one catastrophic moment. A column of superheated stone and fire erupts in a 10ft radius anywhere within 80ft. All creatures in the column take 4d10 + 30 fire/physical damage and must surpass Agility TN 12 + Resist bonus or gain Burning (1d10/turn, 3 turns) and Prone conditions. The Vein-Caller takes 1d10 damage from the feedback — the Titan does not distinguish between caller and target.`},
{name:`Rat Ogre: The Alchemical Abomination`,size:`Large`,type:`Vermin`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A grotesque, alchemically mutated horror of the deep sewers, the Rat Ogre is a towering, hunched monstrosity of hyper-developed muscle, patchy diseased fur, and rusted scrap metal violently bolted directly into its flesh. Standing at eight feet tall but fighting with a feral, scrambling gait, it possesses the raw, overwhelming Large (Lg) mass of an Ogre combined with the twitchy, predatory speed of a starving rat. Driven completely mad by its own unnatural growth, it thrashes wildly through subterranean tunnels, destroying anything in its path.`,agl:6,awa:4,cha:0,int:0,phy:9,wil:5,move:20,ap:3,def:7,wmArmor:13,wmBS:9,wmDP:`Immune`,wounds:215,focus:`0`,reroll:0,luck:0,meleeHit:`+5`,meleeDmg:`+30/+60(2H)`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1-3`,gear:`Rusted Scrap Grafts, Alchemical Tubes/Injectors.`,meleeDetail:`Scavenged Metal Blades / Feral Claws`,rangeDetail:`Throwing Object/Rock`,abilities:`Passive Traits\nDiseased Grafts: Any creature that takes Melee damage from the Rat Ogre must surpass Physique TN 6 + Resist bonus or gain the Infected condition, taking 5 unmitigable damage at the start of their next turn due to the filth and rust.\n\nFeral Senses: Its hyper-developed snout and twitching whiskers allow it to navigate and hunt in total darkness. It ignores all To-Hit and Defense penalties associated with fighting in low light or absolute pitch-black environments.\n\nFilth-Born: Having been born and mutated in the absolute worst alchemical runoff and raw sewage, the Rat Ogre is completely immune to all Disease and Poison conditions.\n\nWarp-Spasm: When the Rat Ogre is reduced to less than half of its Total Wounds, its alchemically altered blood boils. It immediately gains +1 Action per turn, but suffers a -2 penalty to its Defense as it abandons all self-preservation to tear its enemies apart.\n\nAction-Based Abilities\nRusted Warp-Cleaver (Melee - Cost: 2 Actions): Wielding a massive, jagged slab of rusted iron bolted to a sewer pipe, the Rat Ogre delivers a frenzied, sweeping chop. This 2-Handed heavy strike is fueled by its massive Physique and multiplied by its Large size, dealing a devastating 1d10 + 60 damage. On an unmodified 9 or 10, the rusted metal inflicts 1 Bleeding condition.\n\nRabid Snapping Bite (Melee - Cost: 1 Action): Lunging forward with its elongated, foam-flecked snout, the beast clamps down with yellowed incisors. This 1-Handed natural attack deals 1d10 + 30 damage. The victim must surpass Physique TN 7 + Resist bonus or immediately suffer 1 Disease condition from the horrific bacteria coating its teeth.\n\nSewer Grate Toss (Range - Cost: 1 Action): Ripping an iron grate or chunk of masonry from the tunnel walls, it hurls the heavy debris with terrifying speed. Combining its Agility and its Physique, multiplied by its size, this thrown projectile deals 1d10 + +30 blunt damage on impact.`},
{name:`Ratman Brood-Guard`,size:`Medium`,type:`Humanoid (Beastkin)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The elite soldier caste of the ratmen burrows. While the Scavengers rely on sheer numbers and surprise, the Vanguards are disciplined, well-fed, and heavily armored. Standing taller and broader than their scavenging kin, the Vanguards are the true military force of the ratmen. Clad in scavenged, rust-pitted chainmail and wielding heavy, jagged halberds, they hold the line in the claustrophobic depths. They are ruthless, organized, and fiercely loyal to their brood-mothers, forming deadly phalanxes in the narrow tunnels of the underworld that break the momentum of invading forces.`,agl:3,awa:2,cha:1,int:0,phy:6,wil:5,move:14,ap:4,def:6,wmArmor:10,wmBS:10,wmDP:`Immune`,wounds:35,focus:`+1/3`,reroll:0,luck:0,meleeHit:`+3`,meleeDmg:`+13`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`4-8`,gear:`Scavenged Chainmail, Heavy Rusted Halberd`,meleeDetail:`Heavy Rusted Halberd`,rangeDetail:``,abilities:`Passive Traits\nFilth-Born: The Vanguard is completely immune to all Disease and Poison conditions. Any creature that successfully hits the Vanguard with an unarmed strike or natural weapon must make a Physique(6) Save or gain 1 Disease condition.\n\nPhalanx of the Depths: When standing adjacent to at least one other Ratman Vanguard, their interlocking halberds create a defensive wall. They gain a +2 bonus to their Defense against Melee attacks and cannot be flanked.\n\nPolearm Reach: Because of their long halberds, the Vanguard can make Melee attacks against targets up to 10 feet away. If an enemy moves into this 10-foot reach, the Vanguard may use a Reaction to immediately make one free Melee attack against them to halt their advance\n\nAction-Based Abilities\nBrace the Line (Melee Cost: 1 Action): The Vanguard locks its boots into the earth and points its halberd forward. Until the start of its next turn, its Defense increases by 2. Any enemy that successfully damages the Vanguard with a Melee attack from within 5 feet automatically takes 8 Piercing Damage from the braced blade.\n\nImpaling Thrust - (Melee Cost: 2): A focused, brutal thrust designed to punch through armor. Deals normal 1d10 + 13 Melee damage. If the To-Hit roll is an unmodified 9 or 10, the jagged blade tears on the way out, inflicting 2 Bleeding conditions on the target.\n\nSweeping Cleave - (Area Cost: 1): Swings the heavy halberd in a wide, knee-high arc. All enemies in a 10 ft frontal arc must make an Agility(8) Test or take half Melee damage (7) and be knocked Prone.\n\nCommand the Vermin - (Area Cost: 1): Barks a harsh, chittering order. All lesser Ratmen (Scavengers) or Rat Swarms within 30 ft gain a +1 bonus to their next To-Hit roll, emboldened by the Vanguard's presence.`},
{name:`Ratman Scavenger: The Filth-Born`,size:`Medium`,type:`Humanoid (Beastkin)`,tier:`Minion`,tierColor:`#607080`,desc:`Twisted, bipedal rodents that infest the deep sewers and forgotten caverns beneath civilized cities. Operating in the shadows, they rely on quick strikes, overwhelming numbers, and the virulent diseases they carry to wear down stronger opponents. Hunched and twitchy, the Ratman is a survivor of the deepest filth. Clad in stitched-together scrap leather and wielding rusted, filth-encrusted blades, they are cowards when alone but viciously bold when attacking in a pack. They do not fight with honor; they fight to survive.`,agl:6,awa:5,cha:2,int:0,phy:1,wil:4,move:13,ap:3,def:3,wmArmor:3,wmBS:5,wmDP:`Immune`,wounds:13,focus:`0`,reroll:1,luck:1,meleeHit:`+1`,meleeDmg:`+4`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+6`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`4-15`,gear:`Stitched Leather, Rusted Shiv, Pouch of Filth`,meleeDetail:`Rusted Shiv`,rangeDetail:`Throwing Darts`,abilities:`Passive Traits\nFilth-Born: The Ratman is completely immune to all Disease and Poison conditions. Any creature that successfully hits the Ratman with an unarmed strike or natural weapon (like a bite) must make a Physique(6) Test or gain 1 Disease condition.\n\nPack Cowardice: A Ratman's bravery is tied entirely to its swarm. While adjacent to at least one allied Ratman, it gains Advantage on all Melee To-Hit rolls. However, if a Ratman starts its turn without an ally within 15 feet, it must surpass Willpower TN 7 + Resist bonus or use its turn to immediately flee\n\nSwarm Tactics: If two or more Ratmen are engaged in melee with the same target, they all gain Advantage on their Melee To-Hit rolls and bypass 2 points of the target's Armor Mitigation (DM-Arm) by finding gaps in the plating.\n\nSkittering Evasion: The Ratman can move through the spaces of enemy creatures without penalty, provided the enemy is at least Medium size. They ignore difficult terrain penalties in subterranean environments.\n\nAction-Based Abilities\nTetanus Shank (Cost: 1 Action): The Ratman lunges with its filth-encrusted blade. Make a Melee attack (+1 To-Hit). On a hit, it deals 1d10 + 4 Piercing Damage, and the target must surpass Physique TN 5 + Resist bonus or gain the Infected condition, suffering 5 unmitigable damage at the start of their next 2 turns\n\nShatter-Vial - (Ranged/Area) Cost: 2 Actions): Throws a stolen, haphazardly crafted alchemical vial up to 40 ft. It bursts in a 10 ft radius. All creatures in the area must make an Agility(6) Test or take 2d10 Acid Damage and gain 1 Blind condition, gaining disadvantage for all actions for 1 turn as the noxious fumes burn their eyes.\n\nCoward's Retreat - (Movement Cost: 1): The Ratman instantly disengages from melee combat, taking no free strikes from adjacent enemies, and moves its full Move speed (50 ft) toward the nearest shadows, grating, or cover.`},
{name:`Red Dragon: The World-Ender`,size:`Titanic`,type:`Dragon`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A titan of muscle and crimson scales thick as castle walls. Its breath is a mixture of sulfur and liquid flame, and a constant heat shimmer surrounds its body, making the air ripple like a desert mirage. Its horns are a crown of jagged obsidian, and its eyes glow with the white-hot intensity of a forge. Red Dragons are famously arrogant, viewing all of creation as their rightful hoard and "lesser races" as temporary stewards of their gold. When a Red Dragon takes flight, the sky turns the color of blood, and the temperature for miles around begins to climb.`,agl:5,awa:8,cha:12,int:6,phy:21,wil:9,move:`33/80F`,ap:3,def:9,wmArmor:25,wmBS:20,wmDP:`Immune`,wounds:600,focus:`+3/9`,reroll:2,luck:1,meleeHit:`+7`,meleeDmg:`+60`,meleeHeal:`0`,rangeHit:`+6`,rangeDmg:`+50`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`10`,mob:`1`,gear:`The greatest hoard of gold and magical artifacts in the known world`,meleeDetail:`Obsidian Horns & Titanic Claws`,rangeDetail:`Liquid Flame`,abilities:`Passive Traits\nThe Heat Shimmer (Mirage): The constant, rippling heat surrounding the dragon bends light and warps trajectories. Any Ranged attack (arrows, bolts, thrown weapons) made against the dragon automatically suffers Disadvantage. Furthermore, any enemy starting their turn within 30 feet of the dragon takes 10 Fire Damage just from the ambient, suffocating heat.\n\nCastle-Wall Scales: The dragon's hide is practically impenetrable to mundane weapons. If a physical Melee attack fails to deal more than 10 damage (after mitigation is applied), the weapon simply bounces off the crimson scales, dealing 0 damage instead.\n\nSupreme Arrogance: The dragon views mortals as mere snacks. It is completely immune to the Charmed, Shaken, and Taunted conditions. However, its greed dictates its targeting: it will always prioritize attacking the player carrying the highest-tier magical item or the most gold, aiming to reclaim its "rightful hoard."\n\nAction-Based Abilities\nLiquid Flame Exhalation (Range Cost: 2 Actions): The dragon unleashes a 100-foot cone of sulfurous, sticky liquid fire. Make a Ranged attack (+6 To-Hit). On a hit, targets take 1d10 + 50 Fire Damage and gain 2 Burning conditions. The liquid flame sticks to the environment, turning the entire blast zone into severe Difficult Terrain that deals 20 Fire Damage to anyone walking through it for the rest of the combat.\n\nMeteor Dive (Melee Cost: 3 Action): The dragon takes to the blood-red sky and crashes down on a target like a comet. It moves up to 60 feet (ignoring terrain) and makes a Melee attack (+7 To-Hit). If successful, it deals 2d10 + 130 damage, and the sheer seismic impact knocks every other enemy within a 20-foot radius Prone.\n\nObsidian Crown Sweep (Melee Cost: 2 Actions): A brutal, dismissive swipe with its jagged horns. Make a Melee attack (+7 To-Hit) against all targets in a 20-foot frontal arc. If successful, targets take half damage, 1d10 + 30 and are violently thrown 30 feet backward, potentially taking environmental collision damage.`},
{name:`Riding Horse: Traveler's Companion`,size:`Large`,type:`Beast`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The unsung hero of the civilized world, the Riding Horse is the backbone of travel, trade, and communication. Unlike their heavier, armor-clad Warhorse cousins, riding horses are bred for endurance, speed, and a smooth gait. They are highly intelligent for beasts and fiercely loyal to a gentle rider, but their instincts remain tied to survival. When the scent of a troll hits the wind or a fireball shatters the night, a Riding Horse’s primary directive is to run. They are not combatants; they are the reliable, swift engines that ensure adventurers live to see the next town.`,agl:9,awa:6,cha:2,int:1,phy:5,wil:4,move:23,ap:3,def:5,wmArmor:5,wmBS:5,wmDP:15,wounds:60,focus:`+1/3`,reroll:1,luck:3,meleeHit:`+2`,meleeDmg:`+12/+20`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-30`,gear:`Riding Saddle, Bit & Bridle, Saddlebags`,meleeDetail:`Panicked Hooves`,rangeDetail:`None`,abilities:`Passive Traits\nPrey's Vision: Because a horse's eyes are set on the sides of its head, it has a massive field of vision. The Riding Horse cannot be flanked or surprised by mundane stealth unless the attacker is directly underneath or directly behind it in its small blind spot.\n\nFlight Response: When the horse takes any damage or fails a surpass Willpower TN 7 + Resist bonus against a Fear effect, it immediately gains a positive modifier to its Agility checks and Movement speed for the remainder of the encounter as adrenaline floods its system.\n\nBeast of Burden: The horse's Physical stat is perfectly tuned for hauling. It ignores Movement penalties from carrying heavy loads or encumbered riders, making it the perfect pack animal.\n\nAction-Based Abilities\nBolt! (Cost: 2 Actions): The horse gives into panic and focuses entirely on escape. It immediately moves up to double its normal Movement speed of 70 away from the nearest source of danger.\n\nPanicked Kick (Melee Cost: 1 Action): If cornered, the horse lashes out blindly with its rear hooves. Make a Melee attack (+2 To-Hit). On a hit, it deals 1d10 + 20 Bludgeoning Damage and physically pushes the target 5 feet back.\n\nRearing Hooves (Melee Cost: 1 Action): The horse rears up on its hind legs and strikes downward with its front hooves. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 12 Bludgeoning Damage. If this attack scores a Critical Hit, the target is knocked Prone.`},
{name:`Seraphim: The Six-Winged Arbiter`,size:`Giant`,type:`Celestial (Boss)`,tier:`Boss`,tierColor:`#b91c1c`,desc:`The Seraphim are the burning ones, the highest echelon of the celestial host. Descending from the heavens on six wings of pure, blinding light, they are the wrath of the divine made manifest. They wield greatswords forged from the heart of dying stars and wield Religion blessings with unparalleled potency. To the righteous, they are beacons of absolute salvation; to the wicked, daemonic, or undead, they are the ultimate arbiters of destruction. To stand before a Seraphim is to be weighed instantly against the cosmic scales of justice.`,agl:5,awa:6,cha:18,int:4,phy:12,wil:9,move:`20/60F`,ap:3,def:8,wmArmor:25,wmBS:35,wmDP:`Immune`,wounds:285,focus:`+5/15`,reroll:2,luck:2,meleeHit:`+5`,meleeDmg:`+40/+90(2H)`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+6`,castDmg:`+50`,castHeal:`+20`,castType:`Faith`,fear:`6`,mob:`1`,gear:`he Star-Forged Greatsword, Seamless Celestial Plate`,meleeDetail:`Star-Forged Greatsword`,rangeDetail:`None`,abilities:`Passive Traits\nArbiter of Destruction: The Seraphim naturally disrupts dark magic. Its Melee and Casting attacks completely ignore the DM-Arm and DM-B/S of any Undead, Fiend, or heavily mutated target, carving through their unnatural defenses as if they weren't there.\n\nBlinding Radiance (Aura): The Seraphim is a living sun. Any creature that ends its turn within 20 feet of the Seraphim takes 10 Radiant Damage. If the creature is Undead or a Fiend, it takes 20 Radiant Damage instead and must surpass Agility TN 9 + Resist bonus or gain the Blinded condition.\n\nFirmament Wings: The Seraphim’s six wings are semi-ethereal constructs of force and light. When the Seraphim is successfully struck by a ranged or spell attack, the wings reflexively pulse, reflecting half of the mitigated damage back at the attacker as a beam of searing light.\n\nSupernova Martyrdom: A Seraphim leaves no corpse. If reduced to 0 damage, its celestial core instantly destabilizes. All gravity in a 60-foot radius reverses, pulling all enemies 10 feet toward the Seraphim. At the start of the next turn, the Seraphim detonates, dealing 10d10 + 50 absolute damage to everything in the radius and leaving only a crater of scorched, permanently consecrated earth.\n\nAction-Based Abilities\nSever the Veil (Cost: 3 Actions): The Seraphim strikes the very fabric of reality with its greatsword, tearing open a temporary rift to the celestial plane. This releases a devastating shockwave of holy fire in a 60-foot cone. All enemies in the cone suffer 4d10 + 60 damage and must surpass Physique TN 9 + Resist bonus or be knocked prone. Daemons and Undead caught in the blast take double damage and are pulled 20 feet toward the rift.\n\nJudgment's Gaze (Cost: 2 Actions): The Seraphim locks eyes with a single target within 100 feet, forcing them to experience the cosmic weight of all their past sins simultaneously. The target must pass a severe Willpower(9) test. If they fail, they immediately suffer 3 Stunned conditions (paralyzing them) and take d10 damage for every sentient creature they have killed in the past month (or a flat 5d10 + 30 damage if tracking kills is too difficult).\n\nMeteor Strike (Cost: 3 Actions): The Seraphim launches itself high into the air and crashes down at a target location up to 150 feet away like a falling star. Any enemy within a 20-foot radius of the impact takes 3d10 + 40 damage and catches fire. Any friendly creature within the impact zone is instead infused with celestial haste, gaining +1 Action on their next turn and being instantly cured of any Bleed or Poison conditions.\n\nSupernova Cleave (Melee Cost: 2 Actions): A flawless, devastating arc with the star-forged greatsword. Make a Melee attack (+5 To-Hit) with a 15-foot reach. If successful, it deals 1d10 + 90 Slashing/Radiant Damage.\n\nWord of Salvation(TN10) (Casting Cost: 1 Action): The Seraphim speaks a single, resonant note of divine law. Target up to three allied creatures within 60 feet. Make a Casting attack (+5 To-Hit). On a hit, all negative conditions (Bleeding, Poisoned, Paralyzed, Shaken) are instantly purged from the targets, and they heal 20 damage.`},
{name:`Shade Crow: The Hollow-Gourd`,size:`Medium`,type:`Monstrosity (Plant / Shade)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`Standing roughly 6 feet tall, the Shade Crow is an unnervingly thin creature. Its body is composed of blackened, vine-like tendons wrapped around a skeletal frame that feels more like brittle wood than bone. It moves with a terrifying, silent twitchiness. Their hands are their most distinctive feature: elongated, multi-jointed "spiny fingers" that move with a life of their own, designed specifically to thread through the gaps of a knight's visor or the joints in heavy armor. To fight a Shade Crow in full plate is to lock yourself in an iron coffin and hand it the key.`,agl:9,awa:6,cha:1,int:4,phy:3,wil:5,move:17,ap:4,def:5,wmArmor:7,wmBS:10,wmDP:`Immune`,wounds:35,focus:`+2/6`,reroll:2,luck:1,meleeHit:`+4`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+15`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1-3`,gear:`None. Relies entirely on its body.`,meleeDetail:`Multi-Jointed Spiny Fingers`,rangeDetail:`Can hurl splintered shards of its own blackened wood body up to 40ft for 15 damage.`,abilities:`Passive Traits\nArmor Threading: The Shade Crow’s multi-jointed fingers are perfectly adapted to bypass defenses. All of its melee attacks ignore 2 points of Damage Mitigation provided by worn armor (target uses only natural mitigation).\n\nHollow Anatomy: Because its body is a hollow cage of dry vines and wood, it does not have vital organs. It is immune to the Bleeding condition, and piercing weapons deal half damage to it. However, because of its brittle, dry nature, it takes double damage from all bludgeoning and Fire-based attacks.\n\nShadow-Meld: When in dim light, darkness, or heavy foliage, the blackened vines of its body absorb light. It becomes nearly invisible, granting enemies Disadvantage on To-Hit rolls against it until it makes an attack or enters a brightly lit area.\n\nAction-Based Abilities\nGourd-Seed Spite (Cost: 2 Actions): The creature's "head" splits open, expelling a cloud of jagged, cursed seeds in a 15-foot cone. All enemies in the cone take 2d10 + 10 damage. Those damaged must surpass Willpower TN 7 + Resist bonus; on a failure, the seeds burrow into their skin, causing agonizing hallucinations and inflicting 1 level of Exhaustion as shadow-magic floods their nervous system.\n\nTendon Snare (Range Cost: 1 Action): The Shade Crow detaches a long, whip-like tendon of blackened vine from its own body and lashes it at a target's legs up to 20 feet away. If it hits, the target takes no damage but their Movement is immediately reduced to 0 until the end of their next turn unless they spend an action to physically cut or tear the vine away.\n\nSiphoning Grapple (Melee Cost: 2 Actions): The Crow threads its fingers deep into the target's armor and attempts to lock them in place. Make an Agility vs. Agility check against a target. On a success, the target is Grappled, and the Crow siphons their vitality, dealing 15 unmitigable Piercing Damage and healing itself for 10 damage.\n\nVisor Pierce (Melee Cost: 1 Action): A lightning-fast strike aimed at an exposed gap. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 10 Piercing Damage. If this attack rolls a 10, it strikes an eye or vital artery, dealing double damage and applying the Blinded condition for 1 round.`},
{name:`Siberian Tiger: The Ghost of the Taiga`,size:`Large`,type:`Beast / Animal`,tier:`Elite`,tierColor:`#b45309`,desc:`A titan among felines, stretching up to 11 feet in length. Its fur is a thick, luxurious coat of orange-gold, broken by obsidian stripes that act as perfect camouflage against the vertical shadows of a winter forest. Despite its massive size, it moves with a terrifying, liquid silence, its paws acting like natural snowshoes. Often revered as a forest spirit or guardian, it hunts with cold, calculated efficiency. An encounter usually begins and ends before the prey realizes they are hunted—a sudden blur of orange, a paralyzing roar, and claws that effortlessly shear through chainmail.`,agl:5,awa:6,cha:3,int:1,phy:9,wil:4,move:20,ap:3,def:8,wmArmor:10,wmBS:10,wmDP:15,wounds:110,focus:`+3/9`,reroll:2,luck:1,meleeHit:`+4`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`3`,mob:`1-2`,gear:`None`,meleeDetail:`Massive Claws & Fangs`,rangeDetail:`None`,abilities:`Passive Traits\nGhost of the Taiga: The tiger's striped coat and padded paws make it the ultimate forest stalker. It gains automatic Advantage on all Stealth tests in forested, snowy, or tall-grass environments. Additionally, its natural "snowshoe" paws allow it to completely ignore movement penalties from deep snow, ice, or uneven woodland terrain.\n\nArmor-Shearing Claws: The tiger's claws are thick, razor-sharp, and backed by immense weight. Any melee attack made by the Tiger automatically ignores the first 5 points of a target's Armor Damage Mitigation, treating chainmail and leather as if it were bare flesh.\n\nPredator's Momentum: If the Tiger moves at least 20 feet in a straight line toward a target before making a melee attack, the sheer kinetic force of its mass grants it Advantage on the To-Hit roll, and a successful hit automatically knocks the target Prone, if large size or smaller.\n\nAction-Based Abilities\nThunderous Roar (Cost: 2 Actions): The Tiger unleashes a primal, bone-rattling roar. All enemies within a 40-foot radius must pass a severe Willpower(7) test. On a failure, the sheer terror of the sound paralyzes them, inflicting 1 Stunned condition and causing them to drop whatever they are currently holding in their hands.\n\nThe Ghost's Blur (Melee Cost: 1 Action): The Tiger lashes out with a lightning-fast swipe of its massive paws. Make a Melee attack (+6 To-Hit). If successful, it deals normal 1d10 + 25 melee damage and instantly inflicts 1 Bleeding condition. The Tiger can then immediately move up to 15 feet away without triggering any free attacks from the engaged target.\n\nJugular Crush (Melee Cost: 2 Actions): The Tiger's signature killing blow, used only when its prey is vulnerable. This action can only be used against a target that is currently Prone or Stunned. Make a Melee attack (+4 To-Hit). If successful, it deals 3d10 + 25 damage. If this attack reduces the target to 0 damage, the Tiger instantly regains 1 Action as it seamlessly pivots to its next victim.`},
{name:`Silver Dragon: The Winter Sage`,size:`Enormous`,type:`Dragon (Elemental/Arcane)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A breathtaking sight with scales like polished plate mail and a crest resembling a regal, spiked crown. Their slender bodies are built for soaring through high-altitude winds rather than raw brawling. A permanent chill of winter air and ozone surrounds them. Silver Dragons have a genuine fascination with mortal history, living among humans as sages, kings, or bards, hoarding artifacts for the stories attached to them. When they take to the sky, it is to protect the balance of the world. They prefer to end a fight without bloodshed, utilizing surgical strikes and freezing mist to de-escalate conflicts, backed by an absolute mastery of wizardry.`,agl:12,awa:3,cha:9,int:18,phy:4,wil:5,move:`27/80F`,ap:3,def:6,wmArmor:25,wmBS:35,wmDP:30,wounds:380,focus:`+3/9`,reroll:2,luck:2,meleeHit:`+4`,meleeDmg:`+30`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+45`,rangeHeal:`0`,castHit:`+5`,castDmg:`+28`,castHeal:`0`,castType:`Wizardry`,fear:`5`,mob:`1`,gear:`ften carries magical artifacts, rings, or historical relics worn as jewelry`,meleeDetail:`Surgical Talons`,rangeDetail:`The Chill of Justice`,abilities:`Passive Traits\nPacifying Aura (Winter & Ozone): The permanent chill surrounding the dragon acts as a natural de-escalator. Any enemy starting their turn within 30 feet of the Dragon must surpass Willpower TN 9 + Resist bonus. On a failure, they lose any Enraged or Frenzied conditions and gain the Lethargic condition, reducing their Movement and Agility by half.\n\nMaster of the Arcane: The Silver Dragon requires no somatic or material components to cast spells, utilizing its massive 18 Intelligence. Furthermore, when the Dragon casts a spell, it may freely choose to deal non-lethal Wounds, instantly rendering targets unconscious at 0 damage rather than killing them.\n\nSurgical Evasion: Because of its immense 12 Agility, any Ranged or Melee attack that misses the Dragon triggers an immediate, free Movement action for the Dragon to reposition up to 30 feet in the air without triggering counter-attacks.\n\nAction-Based Abilities\nBreath Weapon: Sub-Zero Mist (Cost: 2 Actions): The Dragon exhales a billowing, 60-foot cone of freezing mist and ozone. All targets in the area must surpass Physical TN 10 + Resist bonus against the Dragon's Casting To-Hit (+4). On a failure, they take 1d10 + 45 Cold Damage and are Frozen (Stunned) in a layer of thick ice until they are broken out. On a success, they take half damage and are not frozen.\n\nArcane Severance(TN7) (Casting Cost: 1 Action): The Dragon utilizes a surgical strike of pure magic to disarm a conflict. Target one creature within 60 feet. Make a Casting attack (+4 To-Hit). If successful, the target's weapon is telekinetically thrown 20 feet away, or their active magical buffs are instantly dispelled.\n\nGale-Force Buffet (Cost: 1 Action): The Dragon snaps its massive wings, generating a localized hurricane. All enemies within 20 feet must surpass Agility TN 12 + Resist bonus or take 15 Bludgeoning Damage and be violently knocked Prone, effectively ending a melee skirmish without shedding blood.`},
{name:`Skeleton (Lesser Undead)`,size:`Medium`,type:`Undead`,tier:`Minion`,tierColor:`#607080`,desc:`The most common and lowly foot soldiers of the necromantic legions. They are the animated, fleshless remains of fallen warriors, stripped of all humanity, memory, and hesitation. Bound together by dark magic rather than muscle or sinew, they march in terrifying, silent unison. Armed with the rusted, pitted weapons they were buried with, they exist only to overwhelm the living through sheer numbers and tireless persistence.`,agl:2,awa:4,cha:0,int:1,phy:3,wil:6,move:8,ap:2,def:5,wmArmor:6,wmBS:3,wmDP:`Immune`,wounds:25,focus:`0`,reroll:0,luck:0,meleeHit:`+1`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`+1`,rangeDmg:`+8`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`3`,mob:`5-20`,gear:`Rusted Shortsword or Spear, Rotting Wooden Shield, Rusted Shortbow.`,meleeDetail:`Rusted Weapons.`,rangeDetail:`Decaying Shortbow. Fires brittle arrows up to 60ft`,abilities:`Passive Traits\nMarrowless Frame: Being nothing but animated bone, the Skeleton is completely immune to the Bleeding, Disease, and Poison conditions. Furthermore, Piercing weapons (like spears, rapiers, or arrows) simply pass through the gaps in their ribs, dealing only half damage. However, Blunt/Crushing weapons (like maces or warhammers) shatter their fragile frames, dealing double damage.\n\nMindless Automaton: The Skeleton has no nervous system, brain, or sense of self-preservation. It is completely immune to all psychological effects, including Fear, Charm, and Mind-Control. It also cannot be inflicted with the Stunned condition from physical pain or trauma.\n\nNecromantic Resonance: When a Skeleton is reduced to 0 damage and shatters, the dark magic binding it is violently released. Any allied Undead spellcaster (like a Necromancer or Lich) within 30 feet immediately absorbs this residual magic, healing for 1d10 damage.\n\nAction-Based Abilities\nSwarm the Living (Cost: 1 Action): Skeletons are programmed to drag down their prey through sheer numbers. If the Skeleton makes a melee attack against a target that is currently engaged in melee with at least one other allied Skeleton, it gains Advantage and +1 on its To-Hit roll.\n\nGrasping Bone (Melee Cost: 1 Action): The Skeleton drops its weapon and lunges forward with both bony hands, attempting to grab onto the armor or limbs of its target. Make a melee attack (+1 To-Hit). If successful, it deals 0 damage, but the target is Grappled, reducing their Movement to 0. A target must spend 1 Action to physically shatter or pry the skeletal hands off to break free. Make a Physique vs surpass Physique TN 7 + Resist bonus to break fee.\n\nShatter-Spike (Melee Cost: 2 Actions): The Skeleton violently snaps off one of its own ribs or arm bones to use as an improvised, jagged dagger. It makes a desperate melee lunge (+1 To-Hit). If successful, the jagged bone splinters inside the target, dealing 2d10 + 10 damage and causing 1 Bleeding condition. Using this ability permanently reduces the Skeleton's own maximum damage by 5.`},
