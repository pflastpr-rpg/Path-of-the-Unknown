corrosive. Any creature that successfully damages the Jabberslythe with an Unarmed strike or a Grapple automatically takes 5 damage of Acid/Poison damage.\n\nAction-Based Abilities\nParalytic Tongue Lash (Melee Cost: 1 Action): The beast whips out its long, dripping tongue. Make a Melee attack (+4 To-Hit) with a 15-foot reach. If successful, it deals 1d10 + 18 Bludgeoning Damage. The target must also surpass Physical TN 9 + Resist bonus or gain the Paralyzed condition until the end of their next turn due to the slime.\n\nThe Unmaking Gaze (Cost: 2 Actions): The beast focuses its cluster-eyes on a single target whose mind is already fracturing. Target one enemy suffering from the Madness condition. Make a Charisma vs. Willpower check. On a success, the target takes 30 unmitigable Psychic Damage as their mind begins to physically hemorrhage.\n\nTwitchy Trample (Cost: 1 Action): The Jabberslythe surges forward with its bloated bulk. The creature moves up to its full Ground speed. Any creature Size Medium or smaller in its path must surpass Agility TN 8 + Resist bonus or be knocked Prone and take 20 Bludgeoning Damage.`},
{name:`Knight of the Ruined Order (Dread Knight)`,size:`Medium`,type:`Undead (Hero)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`Dread Knights were once heroic crusaders who fell to corruption, their souls bound to their armor by dark necromancy long after their bodies turned to dust. They do not feel pain, fatigue, or pity. They are a vanguard of terror, projecting an aura of unnatural cold and soul-crushing dread. A Dread Knight rarely rushes into combat; it walks with slow, inevitable purpose, letting the sheer psychological weight of its presence break the minds of its enemies before its blade ever swings. It is a towering, imposing figure entirely encased in blackened, heavily pitted plate armor. There is no flesh visible beneath the visor—only a swirling vortex of freezing, spectral-blue mist and two piercing points of hateful light. Its armor is draped in the tattered, frost-rimed remnants of a once-noble tabard. In its gauntlets, it wields a massive, two-handed executioner's sword that trails a freezing black vapor.`,agl:1,awa:5,cha:9,int:2,phy:6,wil:15,move:10,ap:4,def:8,wmArmor:20,wmBS:25,wmDP:`Immune`,wounds:80,focus:`+2/6`,reroll:4,luck:0,meleeHit:`+5`,meleeDmg:`+20/+35`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`+6`,rangeHeal:`0`,castHit:`+4`,castDmg:`+12`,castHeal:`0`,castType:`Necromantic`,fear:`6`,mob:`1`,gear:`Pitted Black Plate, Tattered Frost-Rimed Tabard, Executioner's Sword`,meleeDetail:`Frost-Rimed Executioner's Sword`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nHollow Armor: The Knight has no physical body beneath its armor, only a swirling vortex of spectral-blue mist. It is completely immune to the Bleeding and Poisoned conditions. Furthermore, critical hits from Piercing weapons deal only normal damage, as the weapon simply passes through the mist inside the plate.\n\nAura of the Grave: The ground freezes around its sabatons, and the air grows thick with the chill of the grave. Any living creature that starts its turn within 20 feet of the Knight must pass a surpass Willpower TN 7 + Resist bonus against the Knight's staggering Charisma. On a failure, they gain the Shaken condition and their Movement speed is halved by the unnatural cold.\n\nInevitable Advance: The Dread Knight cannot be rushed or staggered. It is completely immune to being knocked Prone, physically pushed, or having its Movement speed reduced by any effect other than its own slow gait.\n\nAction-Based Abilities\nExecutioner's Toll (Melee Cost: 2 Actions): A devastating, textbook swing of the massive sword. Make a Melee attack (+5 To-Hit). If successful, it deals 1d10 +35 Slashing/Cold Damage. If this attack reduces a target to 0 damage, the Knight immediately regains 1 Action as the target's life force is snuffed out.\n\nVaporous Cleave (Melee Cost: 2 Actions): The Knight drags its blade along the frozen ground before unleashing a wide, upward sweeping arc. Make a Melee attack (+5 To-Hit) against up to three adjacent enemies. On a hit, it deals 1d10 + 35 Slashing Damage and inflicts the Slowed condition as the freezing black vapor clings to their armor.\n\nGaze of the Ruined (Cost: 1 Action): The Knight stops and focuses the two piercing points of hateful light directly on a target's eyes. Make a Charisma vs. Willpower check. On a success, the target's mind momentarily breaks; they drop whatever they are holding and lose their next Action, overwhelmed by despair.`},
{name:`Kobold: The Warren Menace`,size:`Small`,type:`Humanoid (Reptilian)`,tier:`Minion`,tierColor:`#607080`,desc:`Standing no taller than a human child, the Kobold is a scaly, reptilian humanoid with a snout resembling a small dragon and eyes that gleam with nervous, malicious energy. What they lack in physical strength and bravery, they more than make up for in sheer numbers, ruthless cunning, and an almost unnatural talent for engineering traps. They are rarely found alone, preferring the dark, cramped tunnels of their warrens where they can ambush intruders from the shadows before scattering into the crevices. Entering a Kobold den is incredibly dangerous, as every corridor is filled with tripwires, pit traps, and falling rocks.`,agl:5,awa:4,cha:0,int:6,phy:0,wil:2,move:10,ap:3,def:6,wmArmor:0,wmBS:5,wmDP:15,wounds:8,focus:`+1/3`,reroll:1,luck:1,meleeHit:`+1`,meleeDmg:`+4`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+6`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`5-50`,gear:`Crude Shiv, Sling, Caltrops, Pouch of Trap Mechanisms`,meleeDetail:`Crude Shiv`,rangeDetail:`Sling or throwing dagger`,abilities:`Passive Traits\nWarren Crawler: The Kobold treats all difficult terrain in subterranean environments as normal terrain. Furthermore, they can squeeze through tiny crevices and gaps that Medium or larger creatures cannot enter.\n\nSafety in Numbers: The Kobold is a coward at heart. If an allied Kobold is killed within 15 feet of it, it must pass a surpass Willpower TN 7 + Resist bonus (which it will likely fail with a 2) or immediately use its next turn to flee. However, while outnumbering an enemy at least 2-to-1 in melee, it gains Advantage and +1 To-Hit on all attack rolls.\n\nTrapmaster's Step: Kobolds are perfectly attuned to their own warrens. They are completely immune to triggering their own traps and automatically succeed on checks made to spot traps set by others.\n\nAction-Based Abilities\nScurry and Shank (Melee Cost: 1 Action): The Kobold darts forward, stabs, and immediately retreats. Make a Melee attack (+1 To-Hit). If successful, it deals 1d10 + 4 Piercing Damage, and the Kobold may instantly move up to 10 feet away without triggering a defensive counter-attack.\n\nSling-Stone (Range Cost: 1 Action): The Kobold hurls a jagged rock from a safe distance. Make a Ranged attack (+3 To-Hit) up to 40 feet. On a hit, it deals 1d10 + 6 Bludgeoning Damage.\n\nSpring the Trap! (Cost: 2 Actions): The Kobold pulls a hidden lever, cuts a tripwire, or drops a rigged payload on an area within 30 feet. All enemies within a 10-foot radius of the target zone must surpass Agility TN 6 + Resist bonus or take 15 Bludgeoning/Piercing Damage from falling rocks or spiked logs.`},
{name:`Kraken: The Abyssal Titan`,size:`Titanic`,type:`Monstrosity (Aquatic/Titan)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A nightmare of the deep, the Kraken is a monstrosity of writhing tentacles, crushing beaks, and eyes the size of galleons. Existing as a Titanic class entity, its sheer mass warps the battlefield. Its hide is thick enough to snap harpoons, and its immense strength can drag entire warships into the abyss. It does not simply fight its enemies; it acts as a natural disaster, overwhelming them with impossible reach and devastating, sweeping blows. To face the Kraken is to fight the ocean itself.`,agl:4,awa:5,cha:1,int:3,phy:21,wil:6,move:`7/53S`,ap:12,def:9,wmArmor:35,wmBS:30,wmDP:`Immune`,wounds:800,focus:`+2/6`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+40/+60`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`10`,mob:`1`,gear:`None`,meleeDetail:`Colossal Tentacles`,rangeDetail:`None`,abilities:`Passive Traits\nSiege Monster: The Kraken's attacks bypass all standard Armor Mitigation when striking ships, buildings, or fortifications. It deals double damage to any inanimate structure. Due to its Titanic mass, it is entirely immune to being Grappled, pushed, or knocked Prone by anything smaller than another Titan.\n\nImpossible Reach: The Kraken's massive tentacles allow it to make melee attacks against any target up to 100 feet away from its central body.\n\nLord of the Depths: The Kraken is immune to Cold damage and the effects of crushing deep-water pressure. It breathes water natively and treats underwater combat as normal terrain, while most mortals suffer severe penalties.\n\nAction-Based Abilities\nSweeping Tentacle (Cost: 3 Actions): A massive tentacle sweeps across the deck of a ship. Make a Melee attack (+4 To-Hit). If successful, it deals 2d10 + 60 Bludgeoning Damage. (With 12 Actions, the Kraken can unleash a horrifying barrage of these strikes across the entire party).\n\nCrush and Drag (Cost: 2 Actions): A tentacle attempts to wrap around a target. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 40 Bludgeoning Damage and the target is automatically Grappled. The Kraken immediately pulls the target 50 feet closer to its gaping beak.\n\nGalleon-Crusher Beak (Melee Cost: 3 Actions): The Kraken bites down on a target currently Grappled by a tentacle. Make a Melee attack (+4 To-Hit). On a hit, it deals a staggering 3d10 + 80 Piercing Damage, instantly shattering armor and bone.`},
{name:`Krox: Swamp Behemoth`,size:`Giant`,type:`Monstrosity (Reptilian)`,tier:`Boss`,tierColor:`#b91c1c`,desc:`Towering at over sixteen feet tall and thick with overlapping slabs of dense, reptilian muscle, the Krox is a true Giant utilized by the Lizardmen to break enemy lines and shatter fortifications. They are not particularly intelligent, often needing to be heavily chained and directed by smaller Skinks or Chieftains between battles. Once unleashed, however, they become a mindless, walking natural disaster of thrashing tails, snapping jaws, and devastating sweeps from crude, massive weapons. To stand before a charging Krox is to invite being crushed into the mud, a fate many armored knights have suffered when underestimating the sheer kinetic force of the swamp's heaviest hitters.`,agl:2,awa:5,cha:1,int:0,phy:15,wil:9,move:20,ap:3,def:6,wmArmor:30,wmBS:10,wmDP:25,wounds:265,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+40/+80(2H)`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1`,gear:`Crude Stone Maul, Massive Shackles/Chains.`,meleeDetail:`Crude Stone Maul`,rangeDetail:`Hurl debris and rock`,abilities:`Passive Traits\nSiege Juggernaut: The Krox is a living siege engine. Its melee attacks bypass standard Armor Mitigation when striking inanimate structures, gates, or fortifications, dealing double damage. It is completely immune to being physically pushed, Grappled, or knocked Prone by creatures of Large size or smaller.\n\nMindless Bloodlust: Without a Skink handler within 30 feet to direct it, the Krox automatically gains the Frenzied condition. It becomes immune to Fear and Charm, but must use its actions to attack the nearest creature (friend or foe) to the best of its ability.\n\nAquatic Behemoth: The Krox treats water and deep mud as normal terrain, completely ignoring movement penalties in swamp environments.\n\nAction-Based Abilities\nShattering Sweep (Melee Cost: 2 Actions): The Krox swings its massive stone maul in a wide, horizontal arc. All creatures within a 20-foot cone must pass an Agility(d10+to-hit) test. On a failure, they take 1d10 + 40 Bludgeoning Damage and are violently knocked Prone.\n\nThrashing Tail (Melee Cost: 1 Action): The creature violently spins, slamming its heavy tail into a target behind or beside it. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 25 Bludgeoning Damage and physically pushes the target 15 feet away.\n\nJaws of the Behemoth (Melee Cost: 1 Action): The Krox drops its weapon or attacks with its free hand, lunging forward to snap its massive crocodilian jaws. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 35 Piercing Damage, and the target is automatically Grappled.`},
{name:`Ledger-Devil: The Soul-Contractor`,size:`Giant`,type:`Fiend / Devil`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A Ledger-Devil is a tall, unnervingly thin Giant dressed in robes made of layered, yellowed parchment—each sheet a contract signed in blood. They have long, multi-jointed fingers perpetually stained with ink, and carry a massive, iron-bound book known as the "Tome of Arrears." Their eyes are replaced by two magnifying lenses fused to their skull, allowing them to see the "debt-weight" of any soul. They find physical combat vile and inefficient. Instead, they fight by imposing metaphysical rules, using verbal traps and "The Fine Print" to paralyze heroes and turn the party's own abilities into liabilities. To them, your life is a loan, and they have come to collect.`,agl:5,awa:8,cha:9,int:15,phy:4,wil:12,move:27,ap:3,def:7,wmArmor:20,wmBS:30,wmDP:`Immune`,wounds:250,focus:`+3/9`,reroll:3,luck:0,meleeHit:`0`,meleeDmg:`0`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+6`,castDmg:`+40`,castHeal:`0`,castType:`Wizardry`,fear:`7`,mob:`1`,gear:`he Tome of Arrears, Robes of the Damned`,meleeDetail:`Special Abilities`,rangeDetail:`Verbal Traps & Fines`,abilities:`Passive Traits\nThe Fine Print (Aura of Liability): The Ledger-Devil dictates the rules of engagement. Any time a player within 60 feet attempts to cast a spell, use a magical item, or trigger a special combat ability, they must first surpass Willpower TN 9 + Resist bonus or pay a "tax." If they fail, they instantly take 1d10 Psychic Damage before the ability activates, as the Devil cites a breach of universal contract.\n\nVile Inefficiency: The Devil despises physical altercations. Any non-magical Melee attack made against the Ledger-Devil has its Wounds halved automatically, as the kinetic energy is absorbed by the dense, blood-signed parchment of his robes.\n\nDebt-Weight Vision: The magnifying lenses fused to his skull see the exact sins and weaknesses of the party. The Ledger-Devil completely ignores any defensive buffs (like magical shields, evasive stances, or cover) when making a Casting attack.\n\nAction-Based Abilities\nCease and Desist(TN6) (Casting Cost: 1 Action): The Devil speaks a binding legal injunction. Make a Casting attack (+6 To-Hit) against a target within 50 feet. If successful, it deals no Wounds, but the target is Silenced and Stunned for 1 round—metaphysically paralyzed by the weight of infernal bureaucracy. A Willpower(15) test is allowed to resist the effects.\n\nForeclosure of the Soul(TN13) (Casting Cost: 2 Actions): The Devil reads an extraction clause from the Tome of Arrears. Make a Casting attack (+6 To-Hit) against a target. On a hit, it deals 2d10 + 40 Necrotic Damage. If this attack reduces a player to 0 damage, their soul is instantly bound to a page in the Tome, preventing any form of resurrection until the book is destroyed.\n\nRedistribution of Assets(TN7) (Cost: 1 Action): The Devil exploits a loophole in the party's healing magic. He targets one player who has received healing or a buff this combat. That player must pass a severe Willpower(12) test; on a failure, the healing/buff is instantly stripped from them and granted to the Ledger-Devil or one of his summoned minions instead.`},
{name:`Lesser Daemon: The Warp-Skitterer`,size:`Medium`,type:`Fiend / Daemonic`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`Lesser Daemons are the jagged glass of the chaotic realms. They rarely have a stable physical form, often appearing as a nauseating mix of spindly limbs, too many eyes, and mouths that open in places they shouldn't. They don't walk so much as they "glitch" through reality, moving in terrifying, jerky bursts of speed. They are driven by an overwhelming hunger to drag the order of the mortal world back into the screaming maw of the void. Weak alone, in a "muttering swarm" they can overwhelm seasoned veterans through sheer sensory overload.`,agl:6,awa:5,cha:0,int:2,phy:4,wil:3,move:13,ap:3,def:7,wmArmor:10,wmBS:20,wmDP:`Immune`,wounds:35,focus:`+1/3`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+15`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+3`,castDmg:`+10`,castHeal:`0`,castType:`Wizardry`,fear:`5`,mob:`1-10`,gear:`Random`,meleeDetail:`agged Limbs & Mismatched Mouths`,rangeDetail:`None`,abilities:`Passive Traits\nPsychic Static (Aura): Their constant gibbering and the way they warp light makes it incredibly difficult for mortals to aim. Any Ranged attack or Casting roll made by a player within 15 feet of a Warp-Skitterer automatically suffers Disadvantage.\n\nThe Muttering Swarm: They feed off the chaotic energy of their kin. If a Warp-Skitterer makes a Melee attack against a target that is currently engaged with at least one other Daemon, the Skitterer gains Advantage on the attack roll and deals an additional +10 damage on a hit.\n\nHysterical Aggression: They will gladly impale themselves just to get close enough to bite. If a player successfully hits the Daemon with a Melee weapon, the Daemon may use its Reaction to violently pull itself further down the weapon's shaft. The Daemon takes the Wounds, but instantly makes a Melee attack (+4 To-Hit) against the attacker in return.\n\nAction-Based Abilities\nGlitch-Step (Cost: 1 Action): The Daemon does not walk; it stutters through reality. It instantly Disengages from melee combat without triggering free attacks of opportunity and teleports up to 20 feet to an unoccupied space it can see.\n\nFrantic Rend (Melee Cost: 1 Action): A hysterical flurry of claws and teeth. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 15 damage and the target gains 1 Bleeding condition as the jagged limbs tear flesh.\n\nSensory Overload(TN10) (Cost: 2 Actions): The assorted mouths on the Daemon's body all scream in unison, broadcasting raw void-static. Make a Casting attack (+3 To-Hit) against all enemies within 10 feet. On a hit, targets take 1d10 + 10 Psychic Damage and must surpass Willpower TN 6 + Resist bonus or drop any weapons they are currently holding as their hands instinctively fly to their ears.`},
{name:`Lesser Treant: The Grove-Warden`,size:`Large`,type:`Plant / Elemental`,tier:`Elite`,tierColor:`#b45309`,desc:`Long before a Treant grows to the towering, earth-shaking heights of the ancient forest lords, they serve as Grove-Wardens. These young, ambulatory trees are roughly the size and shape of a mature oak or weeping willow. They lack the complex, slow-spoken wisdom of their elders, operating instead on a primal, instinctual drive to protect the borders of their sacred groves. When at rest, they are indistinguishable from standard flora. But when an intruder brings an axe or a torch into their domain, the roots tear free from the earth, and the heavy branches swing with the crushing force of a falling timber.`,agl:0,awa:3,cha:2,int:1,phy:5,wil:4,move:17,ap:3,def:6,wmArmor:25,wmBS:10,wmDP:`Immune`,wounds:100,focus:`+1/3`,reroll:1,luck:1,meleeHit:`+2`,meleeDmg:`+15`,meleeHeal:`0`,rangeHit:`+1`,rangeDmg:`+10`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`3`,mob:`1-4`,gear:`None`,meleeDetail:`Knotted Wooden Fists`,rangeDetail:`Hurled Debris/Hardened Sap/Rocks`,abilities:`Passive Traits\nFalse Canopy: When the Lesser Treant remains motionless, it is entirely indistinguishable from a normal tree. It automatically gains Advantage on any check made to ambush or surprise intruders who enter its grove.\n\nIron Bark: The dense wood of the Treant turns away glancing blows. It is highly resistant to Piercing damage (arrows, spears), taking half damage from these sources. However, it possesses a severe vulnerability to Fire, taking double damage from all flame-based attacks.\n\nDeep Roots: While standing on natural earth, soil, or grass, the Treant cannot be physically pushed, dragged, or knocked Prone by any creature of Size Large or smaller.\n\nAction-Based Abilities\nTimber Sweep (Melee Cost: 1 Action): The Treant swings a heavy, knotted branch. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 15 Bludgeoning Damage and pushes the target 5 feet backward.\n\nEntangling Roots (Cost: 2 Actions): The Treant plunges its hands into the soil, causing roots to violently erupt beneath a target within 20 feet. The target must surpass Agility TN 7 + Resist bonus or gain the Grappled and Restrained conditions as the roots bind their legs to the earth.\n\nSticky Sap (Cost: 1 Action): The Treant hurls a glob of hardened, incredibly sticky sap at a nearby enemy. Make a Ranged attack (+1 To-Hit) up to 25 feet. On a hit, the target takes no Wounds, but their weapon or boots become coated, inflicting the Slowed condition until they use an Action to pry the sap off.`},
{name:`Lich: The Eternal Weaver`,size:`Medium`,type:`Undead (Hero / Boss)`,tier:`Elite`,tierColor:`#b45309`,desc:`A Lich is a skeletal figure of terrifying elegance. They do not shuffle or groan; they glide with a predatory, cold grace. Their bones are often reinforced with gold filigree or etched with thousands of microscopic runes. They dress in the finery of a long-dead age—heavy silks and furs that have turned to grey cobwebs over the centuries. The air around a Lich is physically heavy, tasting of ozone and old dust. They don't just "cast" spells; they weave the ambient energy of the graveyard into physical reality. A single gesture from a Lich can command a hundred corpses to rise, or cause the blood in a living man's veins to turn to ice. They are patient, calculating, and utterly devoid of empathy, viewing the living as nothing more than raw materials for their eternal experiments.`,agl:4,awa:6,cha:9,int:21,phy:2,wil:12,move:14,ap:4,def:10,wmArmor:15,wmBS:40,wmDP:`Immune`,wounds:90,focus:`+4/12`,reroll:3,luck:2,meleeHit:`+3`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+7`,castDmg:`+38`,castHeal:`0`,castType:`Necromantic`,fear:`9`,mob:`1`,gear:`Rune-etched Phylactery Jewelry, Ancient Silks, Staff of the Weaver`,meleeDetail:`Quarterstaff or other weapon`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nAura of the Heavy Grave: The air within 30 feet of the Lich is choked with ozone, dust, and supernatural gravity. Any living creature that starts its turn in this aura has its Movement speed halved and cannot utilize any Agility-based evasive abilities.\n\nMaster of the Lair: A Lich is a supreme summoner of the dead. A Lich automatically doubles the number of raised unhallow if residing in their lair.\n\nUndead Constitution: Being an animated corpse, the Lich is entirely immune to the Bleeding, Disease, and Poison conditions.\n\nUnholy Aura: The Lich constantly radiates an aura of dread. Any living creature that begins its turn within 30 feet of the Lich must surpass Willpower TN [opposing stat] + Resist bonus or suffer a -2 penalty to their next action.\n\nAction-Based Abilities\nArise, My Materials(TN7) (Casting Cost: 1 Action): The Lich weaves ambient energy into the soil. It instantly summons 1d10+1 Lesser Skeletons or Zombies from the surrounding earth in unoccupied spaces within 40 feet. These summons act immediately on the Lich's initiative.\n\nBone Shrapnel Detonation(TN7) (Casting Cost: 1 Action): The Lich points a bony finger at a fallen corpse or one of its own skeletal minions, infusing it with unstable dark magic until it violently explodes in a 15-foot area. Any creature caught in the blast suffers 1d10 + 38 piercing damage. If they fail an Agility(9) test, the jagged bone fragments cause 1 Bleeding condition.\n\nGaze of the Endless Void(TN12) (Casting Cost: 3 Actions): The Lich channels the absolute nothingness of the grave into a single, terrifying glare. This is a heavy, concentrated spell that rips into the target's mind. The victim suffers 4d10 + 38 absolute damage. Furthermore, the target must surpass Willpower TN 12 + Resist bonus or suffer 2 Stunned conditions as their mind is temporarily shattered by a glimpse into the abyss.\n\nOzone Singularity(TN13) (Casting Cost: 2 Actions): The Lich condenses the heavy, static air into a collapsing void. Target a 20-foot radius anywhere within 80 feet. All creatures in the area must make a surpass Physique TN 7 + Resist bonus against the Lich's Casting To-Hit total. On a failure, they take 4d10 +38 Bludgeoning/Necrotic Damage and are violently pulled 10 feet toward the center of the singularity. On a success, they take half damage and are not moved.\n\nSoul-Seer's Siphon(TN12) (Casting Cost: 2 Actions): A tether of crackling, necrotic green energy connects the Lich to its victim, aggressively draining their life force. The target suffers 2d10 + 38 damage. The Lich then absorbs the stolen vitality, healing itself for half of the total damage dealt. The victim must surpass Physique TN 9 + Resist bonus or have their movement speed halved on their next turn due to sheer lethargy.`},
{name:`Lizardman`,size:`Medium`,type:`LIzardman`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`Standing roughly seven feet tall and built like a brick wall of muscle and scales, the Lizardman is a terrifying apex predator of the marshlands. Classified as a Medium (Med) creature, they rely on pure, unadulterated Physique rather than magical size multipliers. Their thick, crocodilian hides deflect glancing blows, and their powerful tails and jaws make them deadly even if disarmed. They fight with a primal, rhythmic brutality that easily overwhelms lighter infantry.\n\nIn combat, they are "patient predators." They can stand perfectly still for hours in a swamp, appearing as nothing more than a mossy log, before exploding into a blur of bronze-tipped spears and crushing jaws. They favor weapons made from obsidian, bone, and "Great-Croc" leather—materials that do not rust in the humid rot of their homes. To a Lizardman, honor is found in the efficiency of the kill; they do not waste breath on threats or boasts.`,agl:6,awa:5,cha:2,int:1,phy:9,wil:10,move:12,ap:3,def:8,wmArmor:16,wmBS:10,wmDP:18,wounds:80,focus:`0`,reroll:0,luck:0,meleeHit:`+3`,meleeDmg:`+14/+32(2H)`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+14`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`3-12`,gear:`Chain Armor with Shield`,meleeDetail:`1H Ax or Mace`,rangeDetail:`Throwing - Javelin/Spear`,abilities:`Passive Traits\nCold-Blooded: The Lizardman thrives in sweltering jungles and murky swamps, ignoring all difficult terrain penalties in these environments. However, if struck by Ice magic or exposed to freezing environments, they suffer a -2 penalty to their Agility characteristic.\n\nPredator's Lungs: They can hold their breath underwater for up to an hour and suffer absolutely no penalties to their movement speed or melee To-Hit rolls while fighting fully submerged in water.\n\nThick Scaled Hide: Their natural crocodilian scales function as built-in armor, providing a permanent +3 to their Defense and significant base physical wound mitigation before any shields or skills are even applied.\n\nAction-Based Abilities\nSavage Bite (Melee Cost: 1 Action): The Lizardman snaps its massive, tooth-filled maw shut on an enemy. This brutal 1-Handed strike deals an automatic +16 damage. If the attack roll is an unmodified 10, the target's flesh is torn, causing 1 Bleeding condition.\n\nBrutal Tail Sweep (Melee Cost: 3 Actions): Pivoting sharply, the Lizardman uses its thick, muscular tail as a massive bludgeoning weapon. Because this acts as a 2-Handed heavy impact attack, the damage is doubled. It hits a tight arc, dealing 2d10 + 32 damage to the target. The victim must pass an surpass Agility TN 7 + Resist bonus or instantly suffer the Prone condition.\n\nSwamp Hunter's Javelin (Range Cost: 1 Action): Rearing back, the Lizardman hurls a heavy, barbed spear. As a thrown weapon, it combines half of their Agility and half of their Physique for the damage calculation, resulting in a heavy +14 damage on impact.`},
{name:`Lizardman Chieftain: The Apex`,size:`Large`,type:`Humanoid (Reptilian / Hero)`,tier:`Elite`,tierColor:`#b45309`,desc:`Deep in the suffocating heat of the ancient swamps, the Apex Chieftain rules by overwhelming biological supremacy. Standing over nine feet tall—a massive, hulking mutation compared to their kin—their scales are thick, scarred, and faded to a dull, iron-like grey. They wear the skulls of rival predators as trophies and wield massive weapons carved from bone and jagged obsidian. An Apex Chieftain fights with the terrifying, explosive economy of motion belonging to a giant crocodile. They are cold, calculating, and capable of tearing an armored knight in half or shattering a shield wall with a single swing.`,agl:3,awa:9,cha:5,int:2,phy:15,wil:6,move:20,ap:4,def:9,wmArmor:20,wmBS:15,wmDP:30,wounds:125,focus:`+1/3`,reroll:2,luck:3,meleeHit:`+5`,meleeDmg:`+34/+60`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+22`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1`,gear:`Skulls of the Fallen, Massive Obsidian Macuahuitl (Serrated Club), Bone Harpoons`,meleeDetail:`Obsidian Macuahuitl`,rangeDetail:`Bone Harpoon`,abilities:`Passive Traits\nApex Command: The sheer presence of the Chieftain bolsters its kin. Any friendly Lizardmen within 50 feet gain a +1 bonus to their +To-Hit rolls and become completely immune to Fear.\n\nCold-Blooded: The Chieftain thrives in sweltering jungles and murky swamps, ignoring all difficult terrain penalties in these environments. If struck by Ice magic or exposed to freezing environments, they suffer a -2 penalty to their Agility characteristic.\n\nPredator's Lungs: They can hold their breath underwater for up to an hour and suffer absolutely no penalties to their movement speed or melee To-Hit rolls while fighting fully submerged.\n\nSwamp Ambush: The Chieftain treats water, deep mud, and thick underbrush as normal terrain. If the Chieftain begins its turn submerged in water, its first attack that round automatically gains Advantage and deals additional damage.\n\nAction-Based Abilities\nBlood-Curdling Bellow (Tactical Cost: 1 Action): The Chieftain unleashes a primal, guttural roar. All enemy creatures within 60 feet must surpass Willpower TN 8 + Resist bonus or suffer 1 Stunned condition as terror grips them.\n\nDeath Roll (Melee Cost: 2 Actions): The Chieftain drops its weapon, lunges, and attempts to bite and twist a target. Make a Melee attack (+5 To-Hit). On a hit, it deals 1d10 + 25 Piercing Damage and the target is automatically Grappled and knocked Prone. If this is performed in water, the target also begins drowning. Make a Physique vs surpass Physique TN 7 + Resist bonus in order to break free in your turn.\n\nTyrant's Halberd (Melee Cost: 2 Actions): The Chieftain swings a massive, two-handed Obsidian Macuahuitl (+5 To-Hit). Powered by its immense Physique and magnified by its Large size, this devastating sweep hits a wide arc and deals a crushing 1d10 + 60 damage. If the attack roll is an unmodified 10, the target must surpass Physique TN 9 + Resist bonus or suffer the Prone condition.\n\nSpined Behemoth Javelin (Range Cost: 1 Action): Heaving a massive spear carved from the rib of a swamp beast, the Chieftain hurls it with terrifying velocity. This heavy thrown weapon deals 1d10 + 22 damage on impact, pinning smaller enemies to the ground on a natural 10.`},
{name:`Magma-Caller (The Vein-Witch)`,size:`Medium`,type:`Pyreborn / Caster`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`"A sight of terrible beauty, often older than the Vanguards. Her skin is almost entirely translucent in places, revealing the brilliant, flowing copper-gold of her 'Sun-Blood' beneath. Wearing robes of woven asbestos-fiber and obsidian plates, she carries a Core-Staff tipped with a smoking 'Primordial Spark.' In battle, she is slow and stationary, acting as a literal 'Hearth' for her people, reshaping the battlefield by raising walls of cooling slag and opening fissures that spew toxic gases. To a Magma-Caller, the enemy is not a person, but an 'impurity' in the landscape that must be smelted away."\n\n(Often guarded by Thralls or Warriors)`,agl:6,awa:4,cha:5,int:15,phy:3,wil:9,move:13,ap:4,def:6,wmArmor:7,wmBS:10,wmDP:10,wounds:42,focus:`+4/12`,reroll:2,luck:1,meleeHit:`+2`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+6`,castDmg:`+37`,castHeal:`0`,castType:`Wizardry`,fear:``,mob:`1`,gear:`Woven Asbestos Robes, Core-Staff (Primordial Spark)`,meleeDetail:`Core-Staff Strike (+2)`,rangeDetail:`None`,abilities:`Passive Traits\nThe Living Hearth: The Magma-Caller is the spiritual and literal fire of her people. Allied Pyreborn within 30 ft gain +2 to their DM-B/S (Damage Mitigation - Bless/Spell) and add +2 to their Melee damage from the ambient, empowering heat. She is completely immune to Fire and Heat damage.\n\nSun-Blood Spatter: Her translucent skin barely contains her superheated copper-gold blood. Anytime she suffers Melee damage, her skin ruptures, spraying the attacker with boiling fluid. The attacker instantly takes 6 Fire Damage and gains 1 Bleeding (Burn) condition.\n\nSmelt the Impurity: Her pyromancy burns so intensely that it melts physical defenses. Her spells automatically ignore the first 5 points of a target's DM-Blessing/Spells.\n\nActions\nPrimordial Spark(TN7) - (Casting Cost: 1): Points her Core-Staff, unleashing a concentrated beam of white-hot energy. Deals normal 1d10 + 37 Casting damage. On an unmodified 9 or 10 on the To-Cast roll, the target's armor fuses, permanently reducing their DM-Arm by 1 for the remainder of the battle.\n\nFissure of Toxic Slag(TN10) - (Casting/Area Cost: 2): Tears the ground open in a 30 ft line directly in front of her. Enemies caught in the path must make an Agility(8) Test or take 1d10 + 37 Casting damage and become trapped in the rapidly cooling slag, reducing their Movement to 0 for 1 turn. The fissure remains as a permanent line of impassable difficult terrain.\n\nVent the Core(TN11) - (Area Cost: 2): Releases a massive, hissing cloud of toxic, superheated volcanic gas in a 20 ft radius around herself. All enemies in the cloud must make a Physique(12) Test or take half her Casting damage 1d10 + 19 and gain the Poisoned condition, suffering 1d10 damage at the start of their next 2 turns from scorched lungs.`},
{name:`Malakor, The Monarch of Midnight`,size:`Enormous`,type:`Shadow / Cosmic Entity`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Malakor is a gargantuan, terrifyingly elegant figure standing nearly 25 feet tall. His body is a shifting column of absolute darkness, possessing six slender, elongated arms ending in obsidian needles. He wears the "Crown of Cold Starlight"—shards of a dead sun that pulse with a rhythmic, pale light. He does not speak; he broadcasts his thoughts directly into the minds of those nearby, a sensation described as "frozen liquid pouring into the ears." He views the material world as a flickering candle that must be snuffed out.`,agl:5,awa:12,cha:4,int:6,phy:18,wil:9,move:27,ap:4,def:7,wmArmor:30,wmBS:40,wmDP:25,wounds:780,focus:`+1/3`,reroll:4,luck:3,meleeHit:`+9`,meleeDmg:`+160`,meleeHeal:`0`,rangeHit:`+10`,rangeDmg:`+65`,rangeHeal:`0`,castHit:`+10`,castDmg:`+25`,castHeal:`0`,castType:`Wizardry`,fear:`9`,mob:`1`,gear:`Crown of Cold Starlight (Cosmic Artifact)`,meleeDetail:`Obsidian Needle Fingers (Six Arms). Strikes deal a base of 160 damage.`,rangeDetail:`Cold Starlight Shards. Can project beams of freezing void energy up to 100ft.`,abilities:`Passive Traits\nDistance is a Lie: Malakor does not physically walk, run, or trigger attacks of opportunity when moving. Whenever he uses his Movement, he simply ceases to be in his current location and "is" in his new location, stepping through the shadows. He completely ignores all difficult terrain, walls, and magical barriers unless they explicitly block teleportation.\n\nFrozen Liquid Telepathy: Malakor constantly broadcasts his oppressive, alien will into the minds of his enemies. Any hostile creature starting its turn within 80 feet of Malakor must pass a surpass Willpower TN 7 + Resist bonus. On a failure, the sheer mental agony causes them to lose 1 Action for that turn and suffer Disadvantage on any spellcasting attempts.\n\nCrown of Cold Starlight: The shards of the dead sun upon his head cast a pale, rhythmic light that snuffs out warmth and life. Within a 120-foot radius of Malakor, all healing effects (potions, blessings, regenerative traits) are reduced by half. Furthermore, any Fire-based attacks directed at him have their total wounds halved as the cold starlight devours the heat.\n\nAction-Based Abilities\nObsidian Flurry (Melee Cost: 2 Actions): Utilizing his six slender arms, Malakor unleashes a terrifying barrage of needle-like strikes. He makes three separate melee attacks that can be divided among any targets within his reach. These strikes seek the absolute weakest points in physical matter; they completely ignore all Damage Mitigation from worn armor (using only the target's natural mitigation) and inflict 1 Bleeding condition per successful hit.\n\nSnuff the Candle (Casting Cost: 2 Actions): Malakor points a single obsidian finger at a target within 100 feet, attempting to extinguish their life force like a flickering flame. The target must pass a severe Physique(15) test. On a failure, they take 5d10 + 60 cosmic damage, and their immediate 15-foot radius is plunged into absolute, magical Blackout for 1 turn, blinding them to the outside world.\n\nMonarch's Eclipse (Cost: 4 Actions): Malakor expands his shifting body, causing the column of darkness to violently explode outward and consume the battlefield. A 100-foot radius around him is plunged into suffocating, crushing shadows for 2 turns. While the Eclipse is active, Malakor heals 3d10 + 40 damage at the start of his turn, and all enemies caught inside the darkness suffer 2d10 damage at the start of their turns as the shadows actively try to tear their physical forms apart.`},
{name:`Manticore`,size:`Giant`,type:`Wild Beast`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A blasphemous fusion of beasts, the Manticore possesses the muscular body of a massive dire lion, the leathery wings of a dragon, and a grotesque, almost human-like face boasting three rows of razor-sharp teeth. Protruding from its hindquarters is a segmented, chitinous scorpion tail dripping with caustic black venom. As a Large (Lg) creature, it uses its immense physical power and flight to isolate and destroy prey, savoring the terror it inflicts just as much as the flesh it consumes.`,agl:9,awa:5,cha:4,int:3,phy:15,wil:6,move:`23/53F`,ap:3,def:9,wmArmor:14,wmBS:6,wmDP:19,wounds:250,focus:`+1/3`,reroll:2,luck:1,meleeHit:`+6`,meleeDmg:`+24`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+22`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`4`,mob:`1-2`,gear:`Random`,meleeDetail:`Bite, Claw, Tail, Special Abilities`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nWinged Terror: The Manticore is a natural flyer. While airborne, it ignores all ground-based difficult terrain and gains a +1 bonus to its Defense against standard melee attacks from ground-bound enemies.\n\nScent of Blood: It can smell open wounds from up to a mile away. If any creature within 100 feet is suffering from a Bleeding condition, the Manticore gains advantage on all Awareness tests to track or locate them.\n\nFrightful Presence: The grotesque, human-like face and unnatural roars of the Manticore are deeply unsettling. Any living creature that begins its turn within 40 feet must pass a surpass Willpower TN 7 + Resist bonus or suffer a -1 penalty to their +To-Hit rolls due to fear.\n\nAction-Based Abilities\nTriple-Rowed Maw (Melee Cost: 1 Action): The Manticore lunges forward, sinking its three rows of jagged teeth into its prey. Fueled by its high Physique and magnified by its Large size, this bite deals a devastating +24 damage. On an unmodified 10, it tears the flesh, inflicting 2 Bleeding conditions.\n\nCaustic Tail Sting (Melee Cost: 1 Action): Whipping its scorpion tail overhead in a blindingly fast strike, it pierces armor with ease, dealing +24 damage. The victim must pass a surpass Physique TN 7 + Resist bonus or instantly suffer 1 Poison condition, taking additional damage each turn.\n\nVolley of Spikes (Range Cost: 2 Actions): With a violent snap of its tail, the Manticore launches a spread of heavy, venomous chitin spikes. Treating this as a thrown weapon, it combines half its Agility and half its Physique, multiplied by its size, to deal +22 piercing damage.`},
{name:`Medusa: The Gorgon Queen`,size:`Medium`,type:`Monstrosity (Cursed Humanoid)`,tier:`Elite`,tierColor:`#b45309`,desc:`Once a figure of enchanting beauty, the Medusa is a creature warped by ancient, spiteful magic. Her lower half is the thick, muscular tail of a massive viper, propelling her silently across the stone floors of her ruined lairs. Where hair once flowed, a writhing nest of venomous serpents hisses and strikes at any who draw near. She is a master of isolation, using her terrifying gaze to freeze her prey in place before filling them with arrows and venom. To fight her is to fight your own instincts, as looking upon her face spells eternal doom.`,agl:9,awa:3,cha:15,int:5,phy:2,wil:6,move:12,ap:4,def:8,wmArmor:8,wmBS:15,wmDP:`Immune`,wounds:85,focus:`+3/9`,reroll:2,luck:4,meleeHit:`+4`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`+4`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`Wizardry`,fear:`4`,mob:`1`,gear:`Ancient Recurve Bow, Quiver of Barbed Arrows`,meleeDetail:`Serpent Hair / Constricting Tail`,rangeDetail:`Shortbow`,abilities:`Passive Traits\nAura of Stone: The air around the Medusa feels cold and heavy. Enemies beginning their turn within 30 feet of her suffer a -1 penalty to their Agility characteristic as their joints stiffen.\n\nSlithering Evasion: The Medusa's serpentine lower half allows her to move with unnatural fluidity. She ignores movement penalties in swamps, ruins, and sandy terrain, and her erratic movements grant a +2 bonus to her Defense against ranged attacks.\n\nToxic Blood: Her veins run with pure venom. She is completely immune to the Poison and Disease conditions. Any creature that scores an unmodified 10 on a melee attack against her takes a splash of acidic blood, suffering D10 wounds.\n\nThe Petrifying Gaze (Aura): If a creature starts its turn within 40 feet of the Medusa and is not actively averting its eyes (fighting blind), it must pass a surpass Willpower TN 7 + Resist bonus against her staggering 15 Charisma. On a failure, the creature gains the Paralyzed condition as their skin begins to calcify. If they fail this check twice in a single encounter, they are permanently turned to stone.\n\nAction-Based Abilities\nVenomous Viper Strike (Melee - Cost: 1 Action): The serpents writhing upon her head lash out with blinding speed. This 1-Handed attack, dealing a quick 1d10 +10 damage. The victim must surpass Physique TN 10 + Resist bonus or immediately suffer 1 Poison condition.\n\nSerpentine Shortbow (Range - Cost: 1 Action): Drawing a sleek, bone-carved bow, she fires a jagged, black-fletched arrow. Relying on her high Agility, (+4 To-Hit) this ranged attack deals 1d10 + 20 piercing damage. This jagged arrow head is drenched in her blood, is struck make a Physique(11) test or suffer additonal 2d10 poison damage.\n\nViper's Coil (melee Cost: 2 Actions): The Medusa lunges with her massive tail to crush an enemy. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 20 Bludgeoning Damage and the target is Grappled and Restrained. While restrained this way, the target is forced to look at her, automatically triggering her Petrifying Gaze trait on her next turn.`},
{name:`Midnight-Hound (Shadow Stalker)`,size:`Large`,type:`Shadow / Beast`,tier:`Elite`,tierColor:`#b45309`,desc:`The Gloom-Tracker\nA terrifying distortion of a canine form. Standing nearly 4 feet at the shoulder, their bodies are elongated and hairless, covered in skin like wet, black leather. Lacking eyes entirely, their skull is a sleek, armored plate of bone. They hunt via sensitive, vibrating pits that detect the "heat" of a soul and the vibration of a heartbeat. They don't growl; instead, they emit a synchronized, low-frequency hum felt deep in the marrow, hunting with liquid precision to bleed their prey dry.`,agl:9,awa:6,cha:3,int:1,phy:5,wil:4,move:27,ap:3,def:7,wmArmor:10,wmBS:8,wmDP:15,wounds:85,focus:`+1/3`,reroll:1,luck:1,meleeHit:`+2`,meleeDmg:`+20`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`3`,mob:`1d8+2`,gear:`None`,meleeDetail:`Jagged Maw. Strikes deal a base of 60 damage `,rangeDetail:`None`,abilities:`Passive Traits\nSoul-Scent & Tremorsense: Because the Hound has no eyes, it is completely immune to all visual illusions, blinding effects, and gaze attacks. Instead, it tracks the heat of a soul and the thumping of a heartbeat. Invisibility and magical darkness are completely useless against it. The only way to hide from a Midnight-Hound is to magically stop your own heart or suppress your soul's signature.\n\nLiquid Pack-Tactics: The hounds move with synchronized, hive-mind-like precision. If a Midnight-Hound is adjacent to an ally Hound, they both gain Advantage on their To-Hit rolls. Furthermore, they can move through each other's spaces without colliding or suffering movement penalties, weaving around prey like black water.\n\nBone-Plated Skull: The top and front of the Hound's head is a solid, sloped plate of armored bone. Any physical ranged attacks (arrows, bolts) targeting the Hound from the front have a 50% chance to seamlessly glance off the armor plate, dealing exactly 0 damage.\n\nAction-Based Abilities\nThe Bleed (Melee Cost: 1 Action): A specialized, darting bite aimed explicitly at the hamstrings and heels of fleeing prey. Make a melee attack at +2 To-Hit. Instead of dealing full damage, this attack deals half damage (+10 damage), but instantly inflicts 2 Bleeding conditions. Additionally, the target's Movement speed is halved on their next turn.\n\nMarrow Hum (Cost: 2 Actions): The Hound vibrates its throat and chest cavity, emitting a low-frequency hum that bypasses hearing and directly shakes the bones of nearby prey. All enemies within a 30-foot radius must surpass Physique TN 9 + Resist bonus. On a failure, the vibrating agony causes them to suffer 1 Fatigued condition, and they lose 1 Action on their next turn as their muscles violently cramp.\n\nDrag Down (Melee Cost: 2 Actions): The Hound leaps, attempting to clamp its jaws onto a target's limb or throat to pin them for the rest of the pack. Make a melee attack; if successful, it deals normal 1d10 + 60 Melee damage and the target must immediately pass a severe Physique(8) test. If the target fails, they are violently pulled to the ground, gaining the Prone condition, and are considered Grappled by the Hound, unable to use movement actions until they break the Hound's grip.`},
{name:`Mimic: The False-Object`,size:`Medium`,type:`Aberration / Shapeshifter`,tier:`Elite`,tierColor:`#b45309`,desc:`In the Power of Three, Mimics are not just monsters; they are highly specialized subterranean shapeshifters that have evolved to prey specifically on the greed of adventurers. Composed of a dense, muscle-like matter, they perfectly mimic the texture, temperature, and appearance of wood, stone, or metal. In its resting state, a Mimic is indistinguishable from a mundane object—a treasure chest, a heavy door, or a section of floor. When it strikes, the "wood" splits into a jagged, tooth-lined maw and a long, adhesive tongue lashes out. Its surface is coated in a natural adhesive called "Limb-Glue," making it nearly impossible to pull away once you've made contact.`,agl:11,awa:14,cha:2,int:8,phy:10,wil:14,move:8,ap:3,def:8,wmArmor:30,wmBS:10,wmDP:25,wounds:90,focus:`+1/3`,reroll:1,luck:1,meleeHit:`+5`,meleeDmg:`+30`,meleeHeal:`0`,rangeHit:`+4`,rangeDmg:`+25`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1`,gear:`None`,meleeDetail:`Splintering Maw.`,rangeDetail:`Adhesive Tongue. Shoots up to 30ft`,abilities:`Passive Traits\nPerfect False-Object: While the Mimic remains motionless, its disguise is absolute. It is completely immune to visual detection or any Awareness tests meant to spot hidden creatures. The only way to reveal a Mimic without touching it is through magical detection of life/aberrations, or by damaging it. If a player touches the Mimic while unaware, the Mimic automatically gains a free Surprise round before Initiative is rolled.\n\nLimb-Glue Anatomy: The Mimic secretes a powerful, magical adhesive. Any creature that touches the Mimic with their bare hands (such as trying to open a chest or door) is instantly Grappled (Movement reduced to 0). Furthermore, any Melee attacks made against the Mimic with a physical weapon require the attacker to pass a surpass Physique TN 7 + Resist bonus after damage is resolved; on a failure, the weapon becomes stuck to the Mimic and cannot be used until the attacker spends an Action to rip it free.\n\nAmorphous Density: Because it lacks a true skeletal structure, the Mimic is immune to the Prone condition and takes half damage from falling or crushing traps.\n\nAction-Based Abilities\nGreed's Punishment (Cost: 1 Action): This action can only be used as a reaction when a target physically touches the Mimic's disguised form. The Mimic instantly snaps open its jagged maw, automatically hitting the touching target for normal damage (30) and inflicting 1 Bleeding condition as the "wood" splinters into their flesh. The target remains stuck via Limb-Glue.\n\nAdhesive Tongue Lash (Casting Cost: 1 Action): The Mimic spits out a long, muscular tongue coated in glue. Make a Ranged attack (+4 To-Hit) against a target within 30 feet. If successful, it deals 25 damage, and the target is Grappled. The Mimic can then immediately pull the target up to 15 feet directly toward its waiting maw.\n\nThe Masticator (Melee Cost: 2 Actions): The Mimic attempts to chew on a target currently stuck to it via Limb-Glue or its tongue. Make a Melee attack with Advantage (+8 To-Hit). If successful, it deals 2d10 + 30 damage. If the target is wearing armor, the Mimic's acidic saliva and grinding wooden teeth permanently reduce the target's Armor Mitigation by 2.`},
{name:`Minotaur: The Labyrinthine Terror`,size:`Large`,type:`Monstrosity`,tier:`Elite`,tierColor:`#b45309`,desc:`A towering monstrosity standing over ten feet tall, the Minotaur possesses the heavily muscled body of a giant and the ferocious head of a primordial bull. As a Large creature, the Minotaur moves with a terrifying, thundering momentum that belies its sheer bulk. They are rarely found in the open, preferring to stalk the shadowed corridors of ancient ruins, catacombs, and cursed labyrinths where their prey has no room to escape. A Minotaur does not just kill; it demolishes, using massive weapons and its own thick-skulled horns to batter victims into unrecognizable pulp.`,agl:4,awa:6,cha:2,int:0,phy:9,wil:5,move:20,ap:3,def:5,wmArmor:18,wmBS:10,wmDP:25,wounds:140,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+27/+54(2H)`,meleeHeal:`0`,rangeHit:`+4`,rangeDmg:`+21`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`4`,mob:`1-4`,gear:`Massive Rust-Pitted Greataxe, Iron Nose Ring`,meleeDetail:`Massive Greataxe / Horns`,rangeDetail:`Throwing Weapon`,abilities:`Passive Traits\nClaustrophobic Hunter: The Minotaur excels in tight spaces. While fighting in indoor corridors, catacombs, or alleys no wider than 15 feet, it gains a permanent +1 to its Defense as it uses its massive bulk to completely block the passage.\n\nLabyrinthine Recall: The Minotaur possesses a supernatural sense of direction. It can perfectly recall any path it has traveled and is completely immune to magical effects that cause confusion, spatial displacement, or maze-like entrapment.\n\nUnstoppable Momentum: If the Minotaur moves at least 15 feet in a straight line before making a melee attack, it gains a +2 bonus to its +To-Hit roll and ignores the first 3 points of the target's physical armor mitigation.\n\nThick-Hided Brute: The dense muscle and matted fur covering the Minotaur grant it an exceptional resistance to pain. It is completely immune to the Bleeding condition from standard slashing weapons.\n\nAction-Based Abilities\nShattering Greataxe (Melee - Cost: 2 Actions): Wielding a monstrous, rusted iron greataxe, the Minotaur delivers a horrific, sweeping blow. As a 2-Handed weapon multiplied by its Large size, this devastating strike deals a massive +54 damage. If the target attempts to block with a shield, the shield is shattered on an unmodified 9 or 10.\n\nGore and Toss (Melee Cost: 2 Actions): The Minotaur lowers its head and drives its thick horns upward into a target. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 40 Piercing Damage, and the target must surpass Physique TN 9 + Resist bonus or be violently tossed 15 feet backward and knocked Prone.\n\nGoring Charge (Melee - Cost: 1 Action): Lowering its head, the Minotaur rams its blood-stained horns into a target. This natural attack deals a brutal 1d10 +27 damage. The sheer force of the impact requires the victim to surpass Physique TN 10 + Resist bonus or immediately suffer the Prone and Stunned conditions.\n\nDeafening Bellow (Tactical - Cost: 1 Action): Beating its chest, the Minotaur unleashes a guttural, terrifying roar that echoes through the corridors. All enemy creatures within a 40-foot radius must surpass Willpower TN 12 + Resist bonus or suffer a -2 penalty to their Defense and Agility until the end of their next turn as panic sets in.`},
{name:`Moss-Revenant`,size:`Medium`,type:`Undead`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A tragic and horrifying fusion of death and parasitic nature, the Moss Revenant is the animated corpse of a fallen warrior, completely overtaken by a sentient, necrotic swamp flora. Existing as a Medium (Med) creature, it moves with a slow, deliberate, and unnerving stiffness. Beneath its rusted, waterlogged armor, its muscles and veins have been entirely replaced by thick, pulsing vines and dense green moss. It feels no pain, possesses no fear, and relentlessy pursues the living to use their corpses as fertilizer for the dark swamp.`,agl:4,awa:6,cha:0,int:2,phy:5,wil:9,move:7,ap:3,def:7,wmArmor:10,wmBS:15,wmDP:`Immune`,wounds:80,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+16`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1`,gear:`Rusted chain/Plate Armor`,meleeDetail:`1H BroadSword & Shield`,rangeDetail:`None`,abilities:`Passive Traits\nUndead Flora: As an animated fusion of corpse and plant, the Revenant is entirely immune to the Bleeding, Disease, and Poison conditions.\n\nVerdant Regeneration: The parasitic moss constantly knits severed limbs and crushed bone back together. The Revenant regenerates D10 wounds at the start of its turn as long as it is standing on natural soil or swamp water. Taking Fire damage halts this regeneration for one turn.\n\nTinder-Dry Vulnerability: Despite its damp environment, the necrotic moss reacts violently to high heat. The Revenant takes double damage from all Fire-based magic and weaponry.\n\nAction-Based Abilities\nWaterlogged Broadsword (Melee - Cost: 1 Action): The Revenant swings a heavily rusted, notched blade with single-minded, mechanical force. Relying on the pure, unyielding strength of its vine-muscles, this 1-Handed attack deals a flat +16 damage. If the attack roll is an unmodified 10, the rusted blade shatters non-magical shields.\n\nStrangling Vines (Melee - Cost: 2 Actions): Extending a thick cluster of thorny vines from its chest and forearms, the Revenant attempts to crush its prey. This heavy grapple deals +16 damage, and the target must surpass Agility TN 7 + Resist bonus or immediately suffer the Prone and Stunned conditions as the vines anchor them to the earth.\n\nNecrotic Spore Cough (Tactical / AoE - Cost: 1 Action): The creature's jaw unhinges, releasing a 15-foot cloud of choking, glowing green spores. Any living creature caught in the cloud must surpass Physique TN 10 + Resist bonus or suffer 1 Poison condition and have their line of sight heavily obscured for their next turn.`},
{name:`Mountain Giant: The Earth-Shaker`,size:`Enormous`,type:`Giant / Elemental`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Dwarfing their Hill Giant kin, Mountain Giants are walking geographical features. Standing upwards of 40 feet tall, their skin is heavily calcified, resembling jagged granite crags interwoven with thick, root-like veins. They do not wear armor; they simply allow the earth and stone to fuse with their flesh. Sluggish but apocalyptically powerful, they smell of ozone, crushed minerals, and deep-earth dampness, wielding uprooted monoliths as casually as a man wields a club.`,agl:1,awa:6,cha:0,int:2,phy:18,wil:12,move:27,ap:3,def:8,wmArmor:30,wmBS:20,wmDP:`Immune`,wounds:450,focus:`+1/3`,reroll:1,luck:0,meleeHit:`+6`,meleeDmg:`+40/+100(2H)`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+40`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`8`,mob:`1`,gear:`Uprooted Stone Monolith`,meleeDetail:`Stone Monolith`,rangeDetail:`Hurled Crag`,abilities:`Passive Traits\nTectonic Footing: The Mountain Giant is quite literally rooted to the earth. It is completely immune to the Prone, Knockback, Grappled, and Restrained conditions. Furthermore, any ground within 60 feet of the giant becomes severe Difficult Terrain as the earth splinters and shifts under its sheer weight.\n\nGranite Carapace: Blades simply chip against its calcified flesh. Any physical Melee attack that deals Slashing or Piercing Damage has its damage halved before it even reaches the Giant's massive 30 Armor Mitigation.\n\nGranite Hide: Non-magical weapons that roll a Critical Failure (1 on the d10) when striking the Giant's Defense immediately shatter against its stone-like flesh.\n\nTremorsense: Smelling of ozone and deep-earth dampness, the Giant tracks its prey through the soil. It completely ignores visibility penalties from darkness, fog, or invisibility as long as the target is touching the ground within 120 feet.\n\nAction-Based Abilities\nAvalanche Stomp (Cost: 1 Action): The Giant raises a massive, rocky foot and brings it down on a specific target area. Make a Melee attack (+6 To-Hit) targeting a 10-foot radius. On a hit, it deals 1d10 + 40 Bludgeoning Damage to anyone caught underneath.\n\nMonolith Sweep (Melee Cost: 2 Actions): The Giant casually swings its massive stone pillar. Make a Melee attack (+6 To-Hit) with a 30-foot reach. If successful, it deals 1d10 + 100 Bludgeoning Damage. Targets struck must pass a severe Agility(10) test or be launched 30 feet through the air, taking additional falling damage.\n\nGeological Upheaval (Cost: 2 Actions): The Giant slams both fists into the earth, triggering a catastrophic shockwave. All ground-bound enemies within a 60-foot radius must surpass Physique TN 11 + Resist bonus. On a failure, they take 4d10 + 40 Bludgeoning Damage, are knocked Prone, and become Deafened by the booming thunder of cracking bedrock.\n\nCrag Bombardment (Range Cost: 2 Action): The Giant rips a massive chunk of granite from its own calcified body or the surrounding earth and hurls it. Make a Ranged attack (+2 To-Hit) against a 20-foot radius area up to 100 feet away. On a hit, it deals 1d10 + 40 Bludgeoning Damage to all targets in the zone.`},
{name:`Mummy High Priest: The Scroll-Keeper`,size:`Medium`,type:`Undead (Caster)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`While the sovereign mummies act as unstoppable juggernauts of physical force, the High Priests were the architects of the ancient burial rites. In undeath, they are physically frail, their bones brittle and their linens turning to dust. However, their minds remain perfectly preserved libraries of forbidden necromancy. They do not wield heavy khopeshes; they hover slightly above the tomb floor, surrounded by orbiting, glowing papyrus scrolls. A Mummy High Priest rarely engages in melee, preferring to summon scarab swarms, resurrect fallen tomb robbers, and utter words of withering that turn flesh to ash from across the room.`,agl:1,awa:4,cha:6,int:9,phy:2,wil:5,move:10,ap:3,def:4,wmArmor:8,wmBS:20,wmDP:`Immune`,wounds:45,focus:`+2/6`,reroll:2,luck:1,meleeHit:`0`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+25`,castHeal:`+15`,castType:`Necromantic`,fear:``,mob:``,gear:`Staff of the Jackal, Orbiting Papyrus Scrolls`,meleeDetail:`Staff of the Jackal`,rangeDetail:`None`,abilities:`Passive Traits\nAegis of the Scrolls: The High Priest is surrounded by ancient papyrus scrolls that automatically intercept incoming fire. The first Ranged attack that successfully hits the High Priest each round is automatically negated, turning the intercepting scroll to ash.\n\nFunerary Wards: Any enemy that successfully deals Melee damage to the High Priest immediately takes 5 unmitigable Necrotic Damage as the dark magic holding the mummy's bones together lashes out at the attacker.\n\nTinder-Dry: Without the heavy, hardened resin of the brute mummies, this frail caster is incredibly flammable. The High Priest possesses a severe vulnerability to Fire, taking double damage from all flame-based attacks.\n\nAction-Based Abilities\nPharaoh's Decree(TN8) (Cast - Cost: 2 Actions): The creature unhinges its jaw, releasing a soundless, terrifying magical scream that reverberates directly in the minds of its enemies. This heavy cast deals 1d10 + +25 damage of pure necrotic energy to a single target. The victim must surpass Willpower TN 9 + Resist bonus or suffer 2 Stunned conditions as their mind is temporarily trapped in total darkness.\n\nWord of Withering(TN7) (Casting Cost: 1 Action): The Priest utters a single, guttural syllable of an ancient language. Target one creature within 60 feet. Make a Casting attack (+4 To-Hit). On a hit, it deals 1d10 + 25 Necrotic Damage, and the target must surpass Willpower TN 8 + Resist bonus or gain the Weakened condition(1/2 damage dealt) until the end of their next turn.\n\nScarab Swarm(TN10) (Casting Cost: 2 Actions): The Priest points its staff, summoning a localized plague. A 15-foot radius area within 40 feet instantly fills with flesh-eating scarabs. All enemies in the zone must surpass Agility TN 10 + Resist bonus or take 20 Piercing Damage and suffer the Blinded condition for 1 round.\n\nCommand the Dust(TN6) (Casting Cost: 1 Action): The High Priest weaves magic into the tomb floor. It instantly resurrects 1 + 1d10 fallen Lesser Undead (such as skeletons or zombies) within 30 feet, or it heals a single allied Brute Mummy for 15 damage.`},
{name:`Mummy: The Cursed Sovereign`,size:`Medium`,type:`Undead`,tier:`Elite`,tierColor:`#b45309`,desc:`Awakened from a millennial slumber, the Mummy is a terrifying testament to ancient burial rites and forbidden necromancy. Existing as a Medium creature, it is entirely wrapped in hardened, resin-soaked linens and adorned with tarnished, cursed gold. It does not sprint or charge; instead, it marches with a slow, terrifying inevitability. The true horror of the Mummy lies not just in its supernatural physical strength, but in the potent, rotting curses that radiate from its desiccated form. To breathe the air around it is to feel your lungs fill with tomb dust and your lifeforce begin to wither.`,agl:2,awa:4,cha:9,int:3,phy:6,wil:5,move:12,ap:3,def:5,wmArmor:10,wmBS:15,wmDP:`Immune`,wounds:85,focus:`+2/6`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+18`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`Necromantic`,fear:`7`,mob:`1-3`,gear:`Tarnished Gold Adornments, Cursed Khopesh (Hooked Sword)`,meleeDetail:`Supernatural Slam / Cursed Khopesh`,rangeDetail:`Breath`,abilities:`Passive Traits\nUndead Constitution: As an animated, preserved corpse devoid of blood or organs, the Mummy is entirely immune to the Bleeding, Disease, and Poison conditions.\n\nDesiccated Form: The centuries-old, dried linens and alchemical resins that preserve the creature make it incredibly flammable. The Mummy takes double damage from all Fire-based magic and weaponry.\n\nRotting Aura (The Millennial Curse): The Mummy’s 9 Charisma radiates a lethal curse. Any living creature that ends its turn within 10 feet of the Mummy must pass a surpass Willpower TN 7 + Resist bonus or suffer the Weakened condition, instantly halving their Physical stat and Melee damage for their next turn as their muscles temporarily wither.\n\nAction-Based Abilities\nBreath of the Tomb (Range Cost: 2 Actions): The Mummy unhinges its jaw and exhales a 15-foot cone of choking tomb dust and flesh-eating scarabs. All enemies in the area must surpass Physique TN 7 + Resist bonus or take 1d10 + 20 Piercing/Necrotic Damage and gain the Blinded condition for 1 round as their eyes and lungs fill with grit.\n\nDesiccating Slam (Melee Cost: 1 Action): A brutal, heavy-handed strike. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 18 Bludgeoning Damage. If this attack deals damage, the Mummy heals 5 damage as it siphons the moisture and vitality from the target's flesh.\n\nGaze of the Sovereign (Cost: 1 Action): The Mummy locks its hollow, glowing eye sockets onto a target within 30 feet. Make a Charisma vs. Willpower check. On a success, the target's mind is overwhelmed by millennial dread; they drop whatever they are holding and gain the Paralyzed condition until the end of their next turn.\n\nKhopesh of the Sands (Melee - Cost: 2 Actions): Drawing a massive, crescent-shaped ceremonial blade, the Mummy executes a heavy, two-handed executioner's swing. This devastating strike doubles its unnatural strength to deal an uncompromising 1d10 + 32 damage. The target must surpass Physique TN 9 + Resist bonus or be knocked Prone by the sheer force of the blow.\n\nRotting Grasp (Melee - Cost: 1 Action): The Mummy reaches out with a decaying, heavily bandaged hand, channeling the physical weight of centuries. This relentless 1-Handed strike crushes armor and bone, dealing a +18 damage. If the attack roll is an unmodified 10, the dark magic clinging to its hands inflicts 1 Disease condition, bypassing normal immunities.`},
{name:`Mycelian Veil-Stalker`,size:`Medium`,type:`Mushroom-Folk (Elite)`,tier:`Lore`,tierColor:`#607080`,desc:`Silent caretakers of the Weald. They communicate through vibrations and 'download' the memories of any traveler they touch.`,agl:6,awa:5,cha:2,int:3,phy:4,wil:6,move:10,ap:4,def:4,wmArmor:5,wmBS:10,wmDP:0,wounds:45,focus:`2`,reroll:1,luck:0,meleeHit:`+6`,meleeDmg:`1d10+4`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1d6`,gear:`Fungal Spores`,meleeDetail:`Toxic Touch`,rangeDetail:`None`,abilities:`Passive Traits\nHallucinogenic Cloud: A passive 10ft aura; any non-Mycelian must fail a Willpower (7) test or become Confused (+1 AP cost for all actions).\n\nVibrational Sense: The creature senses movement through the mycelial network and ignores all penalties from Darkness or Blindness.\n\nFungal Regrowth: While standing on natural soil, the Veil-Stalker regains 5 damage at the start of its turn.\n\nAction-Based Abilities\nPsychedelic Touch (1 Action): Melee +6. On a hit, the target's mind is scrambled. They must swap their Agility and Intellect stats for 1 turn.\n\nSpore-Step (1 Action): The stalker melts into the ground and emerges 30ft away near any other visible mushrooms.\n\nInfest (TN 7 - 2 Actions): Releases spores into a target's lungs. Target takes 1d10 Poison damage each turn until they pass a Resist test.`},
{name:`Nightmare Butcher (Shadow Stalker)`,size:`Large`,type:`Shadow / Monstrosity`,tier:`Elite`,tierColor:`#b45309`,desc:`The Sightless Carver\nDeep in the most gore-stained corners of the wild or the lightless damp of urban slaughterhouses dwells the Nightmare Butcher. A grotesque masterpiece of anatomical horror, it is a towering, four-armed mass of slab-like muscle. Its face is a smooth, sloping expanse of pale, scarred flesh with no eyes. Its primary arms grip rusted cleavers with bone-crushing strength, while secondary tentacle-like appendages snake out from its ribs to pin prey. Despite its bulk, it moves in nauseating, fluid silence, sliding through shadows like spilled oil.`,agl:5,awa:4,cha:0,int:0,phy:9,wil:3,move:17,ap:4,def:6,wmArmor:15,wmBS:10,wmDP:20,wounds:125,focus:`+2/6`,reroll:1,luck:1,meleeHit:`+3`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`6`,mob:`1-3`,gear:`Twin Rusted Cleavers / Pitted Axes.`,meleeDetail:`Cleaver Chop. Strikes`,rangeDetail:`None`,abilities:`Passive Traits\nScent of Copper & The Thumping Drum: The Butcher has no eyes, rendering it completely immune to visual illusions, magical darkness, and blinding effects. It "sees" through tremorsense and the smell of blood. If a creature has a beating heart or is currently suffering from a Bleeding condition, they cannot gain the benefits of Stealth or Invisibility against the Butcher within 100 feet.\n\nAbyssal Stealth (Spilled Oil): Despite its towering bulk, the Butcher makes absolutely no sound when it moves. It can slide seamlessly through the shadows, allowing it to move through spaces occupied by other creatures without penalty. If it initiates combat from darkness, enemies suffer Disadvantage on their Initiative rolls.\n\nAsymmetrical Anatomy: Because its secondary rib-tentacles operate independently of its primary cleaver-wielding arms, the Butcher does not suffer any penalties for fighting multiple opponents. It can maintain a grapple on up to two different targets while still swinging its cleavers at full strength.\n\nAction-Based Abilities\nTentacle Snare (Melee Cost: 1 Action): The Butcher lashes out with the fluid, prehensile appendages. Make a melee attack (+3 To-Hit) with a 10-foot reach. If successful, this deals no Wounds, but the target is instantly Grappled. A grappled target has their Movement reduced to 0, and the Butcher can freely drag them along as it moves.\n\nThe Silent Chop (Melee Cost: 1 Action): The Butcher brings its rusted cleavers down in a brutal, quiet arc. Make a melee attack (+3 To-Hit). If successful, it deals normal 1d10 + 25 damage. If the target is currently Grappled by the Butcher's tentacles, the Butcher gains Advantage on this attack and automatically inflicts 1 Bleeding condition as it saws into the pinned meat.\n\nMeat-Grinder Maelstrom (Melee Cost: 3 Actions): The Butcher spins its massive frame, lashing out with rusted axes, cleavers, and grasping tentacles in a whirlwind of gore. The Butcher makes a single +3 To-Hit roll, applying the result against the Defense of all enemies within 10 feet. Any enemy hit suffers 2d10 + 60 damage, is pushed 5 feet away, and suffers 1 Bleeding condition. This violently severs any grapples it currently holds, tossing the carved victims aside.`},
{name:`Nightmare Spider: The Umbral Steed`,size:`Large`,type:`Shadow / Beast (Mount)`,tier:`Elite`,tierColor:`#b45309`,desc:`A masterpiece of dark biology and sinister engineering. Its exoskeleton is polished to a mirror-like obsidian finish, heavily fitted with "Light-Eater Armor"—delicate plates of void-forged metal that hum with a low psychic frequency. Its padded feet are perfectly silent, allowing this massive beast to trot across marble floors or cavern ceilings without a single sound. It perceives the Ethereal Plane, tracking prey through solid walls, and spins razor-thin, psychic silk that cuts like cold piano wire rather than trapping like normal webbing.`,agl:6,awa:9,cha:4,int:3,phy:5,wil:4,move:20,ap:3,def:7,wmArmor:15,wmBS:25,wmDP:30,wounds:125,focus:`+2/6`,reroll:2,luck:1,meleeHit:`+3`,meleeDmg:`+20`,meleeHeal:`0`,rangeHit:`+4`,rangeDmg:`+25`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`6`,mob:`1`,gear:`Light-Eater Armor (Provides stealth and spell mitigation).`,meleeDetail:`Ethereal Fangs`,rangeDetail:`Psychic Piano-Wire Silk. Shoots razor-thin strands up to 60ft`,abilities:`Passive Traits\nEthereal Sight: The Nightmare Spider's vision naturally overlaps the Material and Ethereal planes. It can see perfectly through solid walls, doors, and obstacles up to 60 feet away. It is completely immune to Invisibility, illusions, and magical darkness, making it the ultimate tracker.\n\nLight-Eater Plating: The void-forged armor it wears actively drinks in ambient light. In dim light or darkness, the spider and its rider practically cease to exist visually, granting them automatic Advantage on all Stealth tests and imposing Disadvantage on any Ranged attacks made against them.\n\nSilent Skitter: Despite its massive size and heavy armor, its specialized padded feet make absolutely zero sound. It never triggers sound-based traps, tremorsense, or alarms. It can carry a rider at full Movement speed across ceilings and vertical walls without making a single click or scraping noise.\n\nAction-Based Abilities\nPiano-Wire Snare (Range Cost: 1 Action): The spider shoots a strand of razor-thin, psychically charged silk at a target within 60 feet. Make a Ranged attack (+4 To-Hit). If successful, it deals normal 1d10 + 25 range damage. The wire wraps around the target's limbs; if the target moves more than 5 feet on their next turn, the wire slices into them, immediately inflicting 2 Bleeding conditions and 1d10 damage before snapping.\n\nEthereal Lunge (Cost: 2 Actions): The spider shifts its fangs partially into the Ethereal Plane right before it strikes, bypassing physical matter entirely. Make a Melee attack (+3 To-Hit). If successful, it deals normal 1d10 + 20 melee damage and completely ignores all of the target's Damage Mitigation from physical armor or shields (using only their natural/magical mitigation).\n\nPsychic Resonance Hum (Cost: 1 Action): The spider vibrates the void-metal plates of its armor, emitting a concentrated burst of psychic feedback. All enemies within a 20-foot radius must surpass Willpower TN 10 + Resist bonus. On a failure, they suffer 1 Stunned condition and take 2d10 psychic damage as the high-frequency hum scrambles their senses and disrupts their balance.`},
{name:`Ogre`,size:`Large`,type:`Hmanoid`,tier:`Elite`,tierColor:`#b45309`,desc:`A mountain of grotesque fat, matted hair, and slab-like muscle, the Ogre is driven by a single, overriding instinct: an insatiable, endless hunger. Standing nearly ten feet tall, it easily falls into the Large (Lg) size category. While they lack the tactical cunning of a Minotaur or the martial discipline of a Lizardman Chieftain, Ogres are walking siege engines of pure, blunt force. They do not wear forged armor, relying instead on rolls of thick, leathery blubber that easily swallow the blades of standard swords.`,agl:1,awa:4,cha:2,int:0,phy:9,wil:6,move:16,ap:3,def:5,wmArmor:20,wmBS:10,wmDP:30,wounds:150,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+27/+54(2H)`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+21`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`3`,mob:`1-5`,gear:`Uprooted Tree Trunk / Massive Splintered Club`,meleeDetail:`Massive Club`,rangeDetail:`Throwing Debris/Rocks`,abilities:`Passive Traits\nFrenzied Hunger: The scent of fresh blood drives the Ogre into a feeding frenzy. If an enemy within 30 feet suffers a Bleeding condition, the Ogre gains a +2 bonus to its Movement and +To-Hit rolls as it recklessly charges toward its next meal.\n\nIron Stomach: An Ogre will eat absolutely anything, from rotting carrion to rusted metal armor. Because of this horrific diet, they are completely immune to ingested poisons and any Disease conditions.\n\nMomentum of the Maw: The Ogre treats all characters of Size Medium or smaller as difficult terrain, meaning it can simply walk through their spaces by making an opposed Physical check to shove them aside.\n\nThick Blubber: The dense layers of fat and gristle beneath the Ogre's skin act as exceptional natural mitigation. They ignore the first 3 points of damage from any standard piercing or blunt weapon attack.\n\nAction-Based Abilities\nBelly Slam (Melee Cost: 1 Action): The Ogre surges forward and weaponizes its own grotesque mass. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 20 Bludgeoning Damage and the target must surpass Agility TN 7 + Resist bonus or be violently knocked Prone and flattened under its weight.\n\nDevour (Melee Cost: 2 Actions): The Ogre grabs a Prone or Grappled target and attempts to take a massive bite out of them. Make a Melee attack (+6 To-Hit). On a hit, it deals 35 Piercing Damage. If this deals damage, the Ogre immediately heals 15 damage as it consumes the fresh meat.\n\nUprooted Tree (Melee - Cost: 2 Actions): Wielding a massive, splintered log or a crude club made of stone and iron bands, the Ogre brings it down with devastating, uncontrolled force. As a 2-Handed weapon multiplied by its Large size, this catastrophic slam deals 1d10 + 54 damage. Any target struck by this must surpass Physique TN 10 + Resist bonus or instantly be knocked Prone and suffer 1 Stunned condition.\n\nBone-Snapping Bite (Melee - Cost: 1 Action): Dropping its weapon or grabbing a target with one massive hand, the Ogre attempts to take a massive bite out of its prey. This natural attack deals 1d10 + 20 damage. If the attack roll is an unmodified 10, the sheer trauma of the bite inflicts 2 Bleeding conditions.\n\nHeave Debris (Range - Cost: 1 Action): Digging its massive, filth-caked fingers into the earth, the Ogre rips up a boulder or a chunk of masonry and hurls it. Calculating its half-Agility and half-Physique, multiplied by its Large size, this heavy projectile deals 1d10 +21 damage on impact.`},
