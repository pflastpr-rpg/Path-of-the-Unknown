 "The World-Splitter" into the ground, detonating the tectonic pressure within his stripes. All enemies within a 100 ft radius must make a Physique(14) Save. On a failure, they take 4d10 + 25 Casting damage, are knocked Prone, and are pushed 30 feet away from him by the shockwave.\n\nOn All Fours - (Movement/Melee Cost: 1): Vulkan-Kahn drops to all fours, becoming a blurring streak of white-hot fire. He dashes up to 250 feet in a straight line, passing directly through enemies. Any creature in his path must make an Agility(15) Test or take 1d10 +25 damage (half his normal melee output) and gain 2 Bleeding conditions.\n\nRoar of the Loom (Cost: 1 Action): He rears up on his hind legs and unleashes a roar that sounds like the earth splitting open. All enemies within an 80-foot cone must pass a surpass Willpower TN 7 + Resist bonus against his 9 Charisma or suffer the Paralyzed condition for 1 round, their nervous systems completely overwhelmed by the sonic pressure.\n\nWorld-Splitter Cleave - (Melee Cost: 2): A sweeping strike with his Star-Iron Halberd. Deals normal 1d10 + 50 Melee damage. If the target survives, their armor is instantly melted and destroyed, reducing their DM-Arm to 0, if non-magical, for the remainder of the encounter.`},
{name:`Warrior Chaos (Iron-Bound)`,size:`Medium`,type:`Humanoid (Corrupted)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The faceless foot soldiers of the dark gods. Where the Champion is a singular engine of destruction that shatters the line, the Iron-Bound are the unyielding anvil that holds it. Encased in crude, heavy iron armor and driven by endless bloodlust, they have traded their humanity for unnatural strength and resilience. They march in lockstep, an unthinking, unfeeling tide of spikes, thick shields, and rusted axes. They do not strategize, and they do not retreat; they simply advance, hacking away at the enemy until the battlefield is drowned in blood.`,agl:0,awa:3,cha:1,int:0,phy:6,wil:4,move:12,ap:3,def:5,wmArmor:15,wmBS:10,wmDP:20,wounds:35,focus:`+1/3`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+15`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`4-8`,gear:`Rusted Battleaxe, Heavy Iron-Bound Shield, Crude Plate`,meleeDetail:`Rusted Battleaxe, Iron-Bound Shield`,rangeDetail:``,abilities:`Passive Traits\nThe Iron Tide: An Iron-Bound warrior's strength is its formation. While standing adjacent to at least one allied Iron-Bound, it gains a +1 to its Defense and becomes completely immune to the Shaken condition.\n\nCrude Resilience: Because they feel no pain, the Iron-Bound ignore the first 5 damage of any non-magical Piercing or Slashing attack, shrugging off glancing blows that would cripple a normal man.\n\nHeavy Footing: Due to the sheer weight of their armor and mutated mass, they are immune to being physically pushed or knocked Prone by Melee attacks from Medium or smaller creatures.\n\nAction-Based Abilities\nBrutal Hack (Melee Cost: 1 Action): A straightforward, heavy swing with their rusted axe. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 15 Slashing Damage.\n\nShield Bash (Melee Cost: 1 Action): The warrior steps forward and violently shoves its heavy iron-bound shield into the target. Make a Melee attack (+2 To-Hit). On a hit, it deals 4 Bludgeoning Damage, and the target must pass a surpass Physique TN 7 + Resist bonus or be violently knocked Prone.\n\nLock the Line (Melee Cost: 1 Action): The warrior locks its shield with its neighbors. Until the start of its next turn, all Melee and Ranged attacks made against this warrior suffer Disadvantage.`},
{name:`Warrior of Chaos (Champion)`,size:`Medium`,type:`Humanoid (Corrupted)`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A towering monolith of dark iron, spiked plate, and unholy devotion. The Champion Warrior of Chaos has surrendered their humanity to the dark gods, gaining unnatural strength and resilience in return. They do not feel pain, they do not tire, and they march across the battlefield like a walking slaughterhouse. Where the human soldier holds the line, the Chaos Warrior shatters it. Beneath the horned helm, there is no longer a man—only an empty, bloodthirsty vessel driven by the whispering will of ruin.`,agl:2,awa:5,cha:4,int:3,phy:12,wil:6,move:14,ap:4,def:9,wmArmor:25,wmBS:20,wmDP:`Immune`,wounds:200,focus:`+2/6`,reroll:2,luck:0,meleeHit:`+5`,meleeDmg:`+30(2H)`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1`,gear:`Hell-Forged Greatsword, Fused Spiked Plate`,meleeDetail:`Hell-Forged Greatsword`,rangeDetail:`None`,abilities:`Passive Traits\nBattle-Ready: Through extensive slaughter, they can confront up to 3 enemies in melee combat simultaneously without those enemies gaining an advantage to-hit, and they gain a passive +1 Melee Wound bonus.\n\nSpiked Monolith: The Warrior's armor is designed to punish those who get close. Any enemy that successfully strikes the Champion with an Unarmed attack, or Grapples them, automatically takes 8 Piercing Damage from the jagged, barbed plate.\n\nUnholy Resilience: The dark gods do not allow their champion to fall easily. The Warrior is completely immune to the Shaken, Charmed, and Fatigued conditions. If an attack would reduce them to 0 damage, they may roll a Willpower(7+) test; on a success, they drop to 1 Wound instead and keep fighting.\n\nAction-Based Abilities\nBerzerker (Melee: Cost 1 Action): With ferocious but decisive strikes, the warrior loses any disadvantage on to-hit rolls for this turn. A successful strike causes normal 1d10 + 30 damage plus an additional d10. On an unmodified 10, they deal normal plus 2d10 additional damage.\n\nBoon of Ruin (Cost: 2 Actions): The Champion pauses to offer a bloody tribute to the dark gods. By actively destroying a fallen corpse on the battlefield (or sacrificing 5 of their own Wounds), the Champion's weapon erupts in dark energy, granting them Advantage on all Melee To-Hit rolls and +10 damage to all damage dealt until the end of their next turn.\n\nExecutioner's Cleave (Cost: 1 Action): A brutal, tactical swing with the dark iron greatsword. Make a Melee attack (+5 To-Hit). If successful, it deals 1d10 + 30 Slashing/Necrotic Damage and ignores 5 points of the target's DM-Arm.\n\nImpact (Melee Cost 2 Actions): Gripping their 2H weapon, they rear back with a powerful swing to stun their opponent. A successful hit deals normal 1d10 + 30 + 2x Physique(24) wounds, and causes 1 Stunned condition.`},
{name:`Werewolf: The Sun-Sentry`,size:`Large`,type:`Lycanthrope (Blood-Bound)`,tier:`Elite`,tierColor:`#b45309`,desc:`Unlike wild lycanthropes that shift with the lunar cycle, the Sun-Sentry is a werewolf bound by vampiric blood-magic. Permanently locked in a towering, 9-foot bipedal hybrid form, their sole purpose is to serve as the daytime protectors for slumbering vampires. They possess thick, matted fur that deflects blades, and musculature dense enough to crush a knight's helmet with a single bite. They do not fear the sun; they embrace it, standing guard over crypts and shadowed manors, relying on their supernatural senses to tear apart vampire hunters long before they can reach the master's coffin.`,agl:4,awa:6,cha:2,int:1,phy:9,wil:3,move:20,ap:3,def:5,wmArmor:15,wmBS:10,wmDP:40,wounds:110,focus:`+1/3`,reroll:2,luck:1,meleeHit:`+4`,meleeDmg:`+20`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1-4`,gear:`None`,meleeDetail:`Crushing Jaws / Rending Claws`,rangeDetail:`None`,abilities:`Passive Traits\nSilver Anathema: The Lycanthrope's ultimate weakness. Any attack made with a Silver weapon completely ignores the Werewolf's Armor Mitigation (dealing damage directly to Wounds). Furthermore, if the Werewolf takes damage from a Silver weapon, its Lycanthropic Vigor is entirely disabled for the rest of the round.\n\nLycanthropic Vigor: The beast's cursed blood rapidly knits flesh back together. At the start of its turn, if it has not taken damage from a Silver weapon in the previous round, it automatically heals 1d10 damage.\n\nScent of the Hunter: The Sun-Sentry has been magically engineered to detect threats to its master. It has automatic Advantage on any Awareness tests to detect sneaking enemies, and it can perfectly track invisible creatures within 60 feet by the scent of their sweat and heartbeat. It cannot be surprised.\n\nAction-Based Abilities\nBlood-Maddened Howl (Cost: 2 Actions): The Werewolf unleashes a terrifying, deafening howl that rattles the courage of anyone nearby. All enemies within a 40-foot radius must surpass Willpower TN 9 + Resist bonus. On a failure, they are inflicted with 1 Fatigued condition (as the adrenaline violently leaves their system in terror) and suffer Disadvantage on their next attack roll. If the Werewolf uses this while it is currently below half its maximum damage, the howl also summons 1d10 mundane wolves from the surrounding wilderness to join the fight on the next round.\n\nHelmet-Crushing Bite (Melee Cost: 1 Action): The werewolf locks its jaws onto a vital area. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 20 Piercing Damage and completely ignores 5 points of the target's DM-Arm as the teeth puncture steel.\n\nProtector's Intercept (Melee Cost: 1 Action): This ability can be triggered at any time during an enemy's turn. If an enemy declares a physical attack against an allied creature (or an object, like the Vampire's coffin) within 30 feet, the Werewolf can instantly cross the distance, physically throwing itself in the way. The Werewolf takes the damage instead, and if the attacker is within melee range, the Werewolf immediately gets a free retaliation Melee attack (+4 To-Hit).\n\nSavage Disembowelment (Melee Cost: 2 Actions): The Werewolf lunges to tear into the softest parts of its prey. Make a Melee attack (+4 To-Hit). If successful, it deals normal 1d10 + 20 Melee damage, and the target must pass a severe Physique(11) test. On a failure, the target suffers 2 Bleeding conditions and drops whatever is in their hands as they clutch their ruined torso.`},
{name:`White Dragon: The Blizzard Stalker`,size:`Giant`,type:`Dragon / Beast`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Unlike its scheming, manipulative cousins, the White Dragon is a creature of pure, feral instinct. It is a savage apex predator of the frozen wastes, driven by hunger and territorial rage rather than a desire for gold or dominion. Its scales are the color of packed snow and glacial ice, allowing it to vanish completely into a whiteout. It hunts like a massive, winged leopard, clinging to sheer ice walls or burrowing under deep snow to ambush prey, tearing them apart before they even realize the blizzard has teeth.\n\nMove: 50 Ground / 40 Burrow (Ice) / 80 Flight`,agl:6,awa:9,cha:4,int:2,phy:15,wil:5,move:`33/53F`,ap:3,def:7,wmArmor:20,wmBS:16,wmDP:`Immune`,wounds:350,focus:`+2/6`,reroll:2,luck:1,meleeHit:`+6`,meleeDmg:`+35`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`6`,mob:`1`,gear:`The frozen, half-eaten corpses of past adventurers`,meleeDetail:`Rending Claws & Fangs`,rangeDetail:`Sub-Zero Gale`,abilities:`Passive Traits\nSnow-Blind Stalker: The White Dragon ignores all visibility penalties from blizzards, fog, or darkness. Furthermore, it ignores Movement penalties on ice or deep snow, and can climb sheer vertical ice walls.\n\nFeral Bloodlust: Fighting entirely on emotion, if the White Dragon takes any Wounds during a round, it flies into a rage, automatically gaining Advantage on its first Melee attack during its next turn.\n\nIcebound Camouflage: When partially submerged in snow or pressed against a glacier, the dragon is effectively invisible. If it initiates combat from this state, it automatically wins the Initiative tie and its first attack completely ignores the target's Shield mitigation.\n\nAction-Based Abilities\nGlacier Pounce (Melee Cost: 1 Action): The dragon leaps directly onto its prey. It moves up to 40 feet and makes a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 35 damage, and the target is forcefully knocked Prone and Grappled beneath its massive claws.\n\nSub-Zero Gale (Range Cost: 2 Actions): The dragon exhales a roaring, 40-foot cone of absolute-zero ice shards. Make a Ranged attack (+5 To-Hit). On a hit, targets take 3d10 + 20 Cold Damage and have their Movement speed reduced to 0 on their next turn.\n\nThrashing Tail (Melee Cost: 1 Action): Operating on pure instinct to clear its flanks, the dragon violently thrashes its heavy tail. Make a Melee attack (+6 To-Hit) against all enemies behind or beside the dragon. On a hit, targets take half damage 1d10 + 18) and are thrown 15 feet away.`},
{name:`Wight Grave Knight: The Crypt-Commander`,size:`Medium`,type:`Undead (Commander)`,tier:`Elite`,tierColor:`#b45309`,desc:`“The eyes aren't feral; they are focused. It parries your strike not by instinct, but by memory. It remembers how you were taught to fight, and it remembers why those techniques fail against the dead.” A Grave Knight is a terrifying sight: a tall, skeletal figure clad in ancient, blackened plate armor etched with glowing necromantic runes. A tattered, burial-stained cloak flows behind them like smoke. Their helmet, often crowned with rusted iron spikes, houses two pinpricks of icy blue balefire that flicker with malevolent intelligence. While the Grave Guard skeletons they command are formidable, the Warden is the catalyst that makes them invincible. They carry a Warden’s Glaive or a heavy Soul-Mace, which they use to direct their troops with rhythmic, silent commands. They are the keepers of the gate between life and death, and they take their "watch" very personally.`,agl:1,awa:4,cha:3,int:5,phy:9,wil:6,move:10,ap:3,def:12,wmArmor:20,wmBS:25,wmDP:`Immune`,wounds:85,focus:`+2/6`,reroll:1,luck:1,meleeHit:`+5`,meleeDmg:`+28(2H)`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`7`,mob:`1`,gear:`Blackened Rune Plate, Warden's Glaive (or Soul-Mace)`,meleeDetail:`Warden's Glaive`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nCrypt-Commander (Aura): The Warden is the catalyst of the undead line. All allied Undead within 30 feet of the Knight gain a +1 bonus to their Melee To-Hit and completely ignore the Turn Undead or Shaken conditions as long as the Knight remains standing.\n\nLife-Siphon Blade: Every time the Wight deals damage to a living target’s Wounds, it regains 5 damage as it drinks the escaping life force.\n\nMartial Memory: The Wight studies and remembers mortal techniques in real-time. If an enemy attacks the Grave Knight with the exact same Melee or Ranged weapon twice in a row, the attacker automatically suffers Disadvantage on the second strike (and all subsequent strikes with that weapon) as the Knight perfectly predicts and parries the blow.\n\nRune-Etched Bones: The creature is completely immune to Necrotic damage. Furthermore, because it is a skeletal entity beneath the armor, it takes half damage from all Piercing weapons (arrows and spears simply pass through the empty ribs).\n\nAction-Based Abilities\nBlackened Strike (Melee Cost: 2 Actions): Type: Melee Attack. Effect: Deals 2d10 + 28 damage. If this attack hits, the target must surpass Willpower TN 10 + Resist bonus check or suffer -3 to their next Attack Roll as the cold of the grave numbs their limbs.\n\nExecutioner's Parry (Melee Cost: 1 Action / Reaction): The Knight can hold 1 Action to use as a Reaction. When struck by a Melee attack, it rolls a Physical test against the attacker's To-Hit. On a success, the Knight takes zero damage, effortlessly parrying the blow, and immediately deals 10 unmitigable Slashing Damage in a riposte.\n\nSilent Directive (Cost: 1 Action): The Knight strikes the butt of its glaive against the earth. Up to three allied Undead within 40 feet may immediately use a Reaction to move up to half their speed without triggering counter-attacks, allowing the Knight to flawlessly reposition the battle line.\n\nWarden's Cleave (Cost: 2 Actions): A textbook, disciplined strike with the heavy glaive. Make a Melee attack (+5 To-Hit) with a 10-foot reach. If successful, it deals 1d10 + 28 Slashing/Necrotic Damage.`},
{name:`Wither-Walker: The Blighted Sylvan`,size:`Giant`,type:`Plant / Undead`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A Wither-Walker stands 18 to 22 feet tall, appearing as a skeletal, humanoid tree. Its bark is a sickly, charcoal grey, weeping a thick, black sap that smells of ozone and vinegar. Its "leaves" are clusters of jagged obsidian shards and dried, razor-sharp briars. Moving with a slow, agonizing creak like a door being forced off its hinges, they are the ultimate "Attrition" bosses. They view all flesh-beings as parasites, turning the environment so toxic that victims simply collapse from exhaustion, ready to be mulched and fed to the dying forest.`,agl:4,awa:6,cha:2,int:1,phy:9,wil:15,move:12,ap:3,def:7,wmArmor:25,wmBS:30,wmDP:`Immune`,wounds:300,focus:`+2/6`,reroll:2,luck:1,meleeHit:`+6`,meleeDmg:`+40`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+40`,rangeHeal:`0`,castHit:`+5`,castDmg:`+35`,castHeal:`0`,castType:`Necromantic`,fear:`7`,mob:`1`,gear:`None`,meleeDetail:`Obsidian-Briar Boughs`,rangeDetail:`Volatile Sap-Glob. Hurls globs of acidic sap up to 60ft`,abilities:`Passive Traits\nAura of the Blight: The Wither-Walker constantly radiates a suffocating, toxic miasma smelling of vinegar and ozone. Any enemy starting their turn within 30 feet of the Walker must pass a severe Physique(10) test. On a failure, they gain 1 Poison condition and 1 Fatigued condition as the toxic air burns their lungs and saps their stamina.\n\nWeeping Black Sap: The Walker’s charcoal bark constantly oozes thick, highly acidic sap. Any Melee attack made against the Walker with a physical weapon causes the sap to splash. The attacker automatically takes 1d10 Acid Damage, and non-magical weapons suffer a permanent -1 to their damage output as the acid immediately begins eating the metal or wood.\n\nPetrified Undead Anatomy: As a fusion of dead wood and necromancy, the Walker is immune to Bleeding and takes only half damage from Piercing weapons. However, because its sap is highly volatile (smelling of ozone), any Fire-based attacks that hit the Walker deal double damage, but also cause the sap to explode, dealing 2d10 Fire Damage to anyone within 10 feet of the Walker.\n\nAction-Based Abilities\nObsidian-Briar Sweep (Melee Cost: 2 Actions): The Walker sweeps its massive, razor-sharp arms in a 20-foot frontal arc. It makes a single To-Hit roll (+6) against the Defense of all targets in the area. Anyone hit takes normal 1d10 + 40 melee damage and must surpass Agility TN 6 + Resist bonus or suffer 2 Bleeding conditions as the obsidian leaves flay their armor.\n\nFlesh into Mulch (Melee Cost: 2 Actions): The Walker attempts to grab an exhausted victim to feed the roots. Make a Melee attack (+6 To-Hit). If successful, it deals no immediate damage, but the target is Grappled and lifted into the Walker's blighted, open trunk. At the start of the Walker's next turn, if the target has not broken free, they take 3d10 + 40 Acid Damage, and the Walker heals Wounds equal to the damage dealt as it digests them.\n\nRoots of Attrition (Casting Cost: 2 Actions): The Walker violently plunges its arms into the ground, causing blackened, necrotic roots to erupt beneath up to 3 different targets within 60 feet. Make a Casting roll (+8 To-Cast). If successful, the targets take 1d10 + 35 Necrotic Damage, have their Movement reduced to 0 for their next turn, and immediately lose 1 Focus or Reroll point (target's choice) as the roots drain their mental resolve.`},
{name:`Woodland Spirit`,size:`Medium`,type:`Elemental (Plant)`,tier:`Minion`,tierColor:`#607080`,desc:`A Spiny Bark Sprite looks more like a sentient bundle of kindling than a living creature. Their bodies are composed of knotted, iron-hard heartwood, with sharp, thorn-like protrusions acting as both armor and weaponry. Faded brown leaves and patches of grey lichen cling to their limbs, providing perfect camouflage against the autumn floor or the trunks of dying trees. They are fiercely territorial and possess a hive-like intelligence. When one Sprite is threatened, the entire grove awakens. They don't speak in words, but in the sound of rubbing branches and the snap of dry twigs. To a traveler, they are nearly invisible until the moment the "vines" start to pull at their ankles.`,agl:6,awa:4,cha:0,int:0,phy:1,wil:2,move:14,ap:3,def:5,wmArmor:5,wmBS:10,wmDP:`Immune`,wounds:20,focus:`0`,reroll:0,luck:1,meleeHit:`+2`,meleeDmg:`+5`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`Druidism`,fear:`0`,mob:`3-5`,gear:`None`,meleeDetail:`Iron-Thorn Protrusions`,rangeDetail:`Darts, Wood Splinters`,abilities:`Passive Traits\nPerfect Camouflage: When standing perfectly still against a tree trunk or within autumn foliage, the Sprite is indistinguishable from the environment. They automatically gain Advantage on all Ambush attacks against unsuspecting targets.\n\nHive-Mind of the Grove: The Sprites share a collective consciousness. If one Sprite is aware of a hidden enemy, all Sprites within 60 feet are instantly aware. They cannot be successfully flanked as long as another Sprite has line of sight.\n\nTinder-Dry: Because their bodies are composed of dried leaves and kindling, they possess a severe, lethal vulnerability to Fire. Any Fire damage they take completely ignores their DM-Arm and deals double damage.\n\nAction-Based Abilities\nNeedle Strike (Melee Cost: 1 Action): A sudden, vicious jab with their thorn-like limbs. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 5 Piercing Damage.\n\nGuerrilla Fade (Cost: 1 Action): The Sprite instantly scuttles backward into the brush. It moves up to 15 feet without triggering any defensive or counter-attacks, allowing it to seamlessly merge back into the treeline after striking.\n\nRoot Cage (Cost: 2 Actions): The Sprite channels the grove's energy to manipulate the environment. Target one enemy within 30 feet. The ground beneath them animates, and the target must surpass Agility TN 6 + Resist bonus or gain the Restrained condition as heavy roots wrap around their ankles. They remain trapped until they use an Action to physically break the roots.`},
{name:`Wraith: The Hollow-Champion`,size:`Medium`,type:`Undead / Incorporeal`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A Wraith appears as a tall, hooded silhouette of tattered, midnight-colored robes. Where a face should be, there is only an endless, swirling vacuum of smoke and two freezing white pinpricks of light. They carry the "Echo" of the weapon they wielded in life—a blade made of solidified shadow that doesn't cut the flesh so much as it severs the soul's connection to the body. They drift through solid stone walls and iron doors as if they were mist. The air around them drops to sub-zero temperatures, misting breath and withering plants. They do not just kill; they consume. A victim slain by a Wraith leaves no corpse for resurrection—their soul is pulled into the Wraith's hollow chest to fuel its dark power.`,agl:9,awa:5,cha:12,int:3,phy:4,wil:6,move:27,ap:3,def:8,wmArmor:0,wmBS:40,wmDP:`Immune`,wounds:65,focus:`+2/6`,reroll:2,luck:0,meleeHit:`+5`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+5`,castDmg:`+30`,castHeal:`0`,castType:`Necromantic`,fear:`8`,mob:`1-2`,gear:`The "Echo" Blade (Solidified Shadow Weapon)`,meleeDetail:`Echo Blade (Targets the soul, not the body)`,rangeDetail:`None`,abilities:`Passive Traits\nAura of the Grave-Chill: The Wraith projects a 20-foot aura of sub-zero temperatures. Any living creature that starts its turn within this aura takes 1d10 Cold Damage and must surpass Willpower TN 10 + Resist bonus or suffer 1 Fatigued condition as the freezing air literally saps the warmth from their blood.\n\nConsume the Soul: The most terrifying mechanic in the Wraith's arsenal. If the Wraith reduces a target to 0 damage, it does not just kill them; it sucks their soul into its hollow chest. The Wraith instantly heals to its maximum damage. Furthermore, the slain target cannot be revived by normal resurrection magic—their soul is trapped. The party must destroy the Wraith within 24 hours to release the soul, or the party member is permanently erased from existence.\n\nIncorporeal Entity: The Wraith has no physical body. It takes only half damage from all non-magical physical weapons. It is completely immune to the Grappled, Prone, Bleeding, Poison, and Disease conditions. It can move its full Movement speed through solid walls, closed doors, and other creatures without penalty.\n\nSub-Zero Vacuum (Aura): The Wraith drains the ambient heat from the world. Any living creature that ends its turn within 15 feet of the Wraith takes 5 Cold Damage and suffers a -1 penalty to their Agility as frost rimes their armor and joints.\n\nAction-Based Abilities\nDissipate (Cost: 1 Action): The Wraith breaks apart into a cloud of freezing black smoke and instantly teleports up to 40 feet to an unoccupied space it can see, ignoring all defensive or counter-attacks.\n\nHollow Siphon(TN11) (Casting Cost: 2 Actions): The Wraith reaches out with a spectral, freezing hand to drain the life force of a target within 30 feet. Make a Casting roll (+5 To-Cast). If successful, it deals 1d10 + 30 Necrotic Damage. The target permanently loses 1 point of Willpower until they complete a long rest, and the Wraith heals Wounds equal to the damage dealt.\n\nPhase-Step Retreat (Cost: 1 Action): The Wraith instantly drops its physical manifestation, becoming pure smoke. It Disengages from all melee combat without triggering any free attacks, and instantly moves up to 30 feet directly through the nearest floor, ceiling, or wall, placing a solid barrier between itself and the party to wait for its cooldowns.\n\nSever the Soul (Melee Cost: 1 Action): The Wraith swings its Echo Blade, aiming not for armor, but for the spirit. Make a Melee attack (+6 To-Hit). If successful, it deals normal 1d10 + 25 melee damage. Because the blade passes directly through physical matter, this attack completely ignores all Armor Damage Mitigation (using only the target's natural or magical mitigation).`},
{name:`Wyvern: The Sky-Scourge`,size:`Giant`,type:`Monstrosity (Reptilian / Aerial)`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A colossal reptilian predator with two powerful, clawed legs and a pair of vast, leathery wings serving as its forelimbs. Bred to a staggering Giant size, these specific Wyverns are exclusively claimed by Orc Warbosses as their personal mounts. Its most feared feature is its long, prehensile tail ending in a jagged, chitinous stinger dripping with a viscous, purple neurotoxin. It perfectly embodies the Orcish philosophy: loud, violent, and relentless. It dive-bombs enemy ranks, crushing entire phalanxes beneath its staggering mass, allowing the Warboss upon its back to shatter the survivor's morale. Its scent—rotting meat and acrid chemicals—is the terrifying herald of an approaching war-host.`,agl:9,awa:5,cha:2,int:1,phy:15,wil:6,move:`20/60F`,ap:3,def:`6/8F`,wmArmor:25,wmBS:10,wmDP:35,wounds:265,focus:`+1/3`,reroll:1,luck:0,meleeHit:`+4`,meleeDmg:`+50`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1`,gear:`Bolted Iron Barding, Spiked Orcish Howdah (Riding Harness).`,meleeDetail:`Neurotoxic Stinger / Crushing Talons`,rangeDetail:`None`,abilities:`Passive Traits\nAcrid Herald: The Wyvern absolutely reeks of rotting meat and chemical toxins. Any enemy that starts its turn within 20 feet of the Wyvern must surpass Physique TN 6 + Resist bonus or suffer 1 Fatigued condition from gagging on the foul stench, giving them Disadvantage on their next attack roll.\n\nAerial Launch: The Wyvern can use its powerful legs to vault directly into the air. It can Disengage from melee combat and launch into flight without triggering any free attacks of opportunity from engaged enemies.\n\nDive-Bomber's Momentum: If the Wyvern flies at least 30 feet directly downward toward a target before making a melee attack, it turns its massive weight into a weapon. It gains Advantage on its To-Hit roll, and a successful hit automatically bypasses the first 10 points of the target's Armor Mitigation.\n\nPrehensile Tail: The Wyvern’s stinger is incredibly long and dextrous. Its Melee attacks with the stinger have a 15-foot reach, allowing it to execute targets while hovering just out of sword-range, protecting its rider from melee reprisal.\n\nAction-Based Abilities\nThe Sky-Crush (Melee Cost: 2 Actions): The Wyvern utilizes its signature dive-bomb maneuver. The Wyvern crashes into a 15-foot radius area on the ground. Make a single To-Hit roll (+4) against the Defense of all enemies in the impact zone. Anyone hit takes 2d10 + 50 melee damage and is violently knocked Prone and Stunned as the air is driven from their lungs by the beast's breastplate.\n\nNeurotoxic Execution (Melee Cost: 1 Action): The Wyvern whips its prehensile tail around to sting a survivor. This attack gains Advantage if used against a Prone or Stunned target. Make a Melee attack (+4 To-Hit). If successful, it deals half normal 1d10 + 25 damage, but injects a massive dose of purple neurotoxin. The target must pass a severe Physique(13) test or suffer 3 Poison conditions and become Paralyzed (Movement 0, Actions 0) for 1 round as their nervous system completely shuts down.\n\nSavage Talon Toss (Melee Cost: 1 Action): The Wyvern attempts to grab a target in its talons and fling them aside to isolate the weakest prey. Make a Melee attack (+4 To-Hit). If successful, it deals normal 1d10 + 50 melee damage and the target is physically thrown 15 feet in a direction of the GM's choosing, taking an additional 1d10 blunt damage upon landing.`},
{name:`Xaver: The Glass-Spined Stalker`,size:`Medium`,type:`Monstrosity (Hybrid / Skirmisher)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Xaver is a hexapedal mammalian-reptilian hybrid. It has the lean, powerful body of a cheetah, but is covered in flexible, diamond-hard scales that act like fiber optics, seamlessly bending light around its body. Its most striking feature is the row of crystalline spines running down its back, capable of vibrating at frequencies that shatter glass and eardrums alike. It doesn't hunt with scent or sight in the traditional sense; it "sees" through Photonic Resonance, detecting the minute light distortions caused by the movement of living souls. When a Xaver is about to strike, its spines glow with a prismatic light, and the air around it begins to hum with high-frequency energy.`,agl:9,awa:6,cha:2,int:1,phy:4,wil:5,move:27,ap:4,def:7,wmArmor:20,wmBS:15,wmDP:20,wounds:60,focus:`+1/3`,reroll:2,luck:1,meleeHit:`+4`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-3`,gear:`None`,meleeDetail:`Prismatic Claws & Fangs`,rangeDetail:`Resonant Spine-Burst. Shoots a focused beam of sonic energy up to 60ft`,abilities:`Passive Traits\nPhotonic Resonance: The Xaver does not rely on normal vision. It detects the soul-light and movement of living beings. It is completely immune to the Blinded condition, magical darkness, and visual illusions. Furthermore, no living creature can benefit from Invisibility or Stealth while within 100 feet of the Xaver—it sees them perfectly.\n\nFiber-Optic Camouflage: The Xaver's diamond scales passively bend light around its body. Whenever the Xaver is not taking an Action, it is completely Invisible. Any Ranged attacks made against it while it is moving suffer Disadvantage. However, the moment it prepares to strike, its spines glow, briefly dropping the invisibility until its turn ends.\n\nHexapedal Sprint: The Xaver ignores all difficult terrain modifiers for rubble, underbrush, and steep inclines, effortlessly using its six legs to maintain its blistering 40 Movement speed.\n\nAction-Based Abilities\nThe Humming Pounce (Melee Cost: 2 Actions): The Xaver sprints up to 30 feet and launches itself at a target. Make a Melee attack (+5 To-Hit). If successful, it deals normal 1d10 + 25 melee damage. If the Xaver started this attack while Invisible, the sudden prismatic flash blinds the target's defenses, automatically bypassing all of the target's Armor Mitigation for this strike.\n\nShatter-Frequency (Cost: 2 Actions): The Xaver arches its back, and its crystalline spines violently vibrate, emitting a devastating sonic wave in a 30-foot radius. All enemies in the area must pass a severe Willpower(11) test. On a failure, they take 3d10 + 20 Sonic Damage, gain 1 Stunned condition (from ruptured eardrums), and any fragile glass items they are carrying (like health potions or vials) instantly shatter and are destroyed.\n\nPrismatic Flay (Melee Cost: 1 Action): The Xaver unleashes a flurry of strikes with its six clawed limbs. Make a Melee attack (+5 To-Hit). If successful, it deals normal 1d10 + 25 damage and the target must surpass Agility TN 8 + Resist bonus or suffer 2 Bleeding conditions as the diamond-hard claws effortlessly shred through leather and flesh.`},
{name:`Xochitonal: The Guardian of the Sun-Blood`,size:`Enormous`,type:`Mythical / Reptilian`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A titan-class reptile, easily 40 feet long, with scales possessing the texture and diamond-hardness of obsidian. Its skin is etched with glowing, turquoise Aztec-style glyphs that pulse with the rhythm of a dying sun. Xochitonal does not just guard a physical place, but a cosmic barrier; to pass it is to cross from life into the eternal dark. As a leader, it possesses a hive-mind connection to all cold-blooded creatures in its vicinity. It commands the very water around it, turning rivers into crushing fists, and its dreaded "Soul-Anchor" bite tethers a victim's spirit to the earth, ensuring they can neither flee the battle nor be resurrected if they fall.`,agl:3,awa:4,cha:5,int:6,phy:18,wil:12,move:`27/53S`,ap:3,def:10,wmArmor:50,wmBS:40,wmDP:60,wounds:850,focus:`+3/9`,reroll:3,luck:2,meleeHit:`+8`,meleeDmg:`+65`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+6`,castDmg:`+40`,castHeal:`0`,castType:`Druidism`,fear:`8`,mob:`1`,gear:`None`,meleeDetail:`Obsidian Jaws & Titan Tail`,rangeDetail:`None`,abilities:`Passive Traits\nCold-Blooded Hive-Mind: Xochitonal projects a telepathic command aura over all reptiles, amphibians, and serpentine beasts within a 1-mile radius. In combat, any allied cold-blooded creature within 100 feet of Xochitonal gains automatic Advantage on all their To-Hit rolls, and Xochitonal can perceive the battlefield perfectly through their eyes.\n\nWarden of the Threshold: As a cosmic guardian, Xochitonal cannot be banished, teleported, or moved against its will by any magical or physical force. It is completely immune to mind-altering effects (like Charm or Fear) and ignores any environmental penalties associated with water or mud.\n\nSun-Blood Glyphs: The turquoise glyphs etched into its obsidian scales pulse with intense thermal energy. Any Melee attack made against Xochitonal with a physical weapon causes the glyphs to flare, instantly dealing 1d10 Fire Damage back to the attacker and passively illuminating any Invisible or Stealthed enemies within 30 feet.\n\nAction-Based Abilities\nThe Soul-Anchor Bite (Melee Cost: 2 Actions): The most feared mechanic in Xochitonal's arsenal. Make a Melee attack (+8 To-Hit). If successful, it deals normal 1d10 + 165 melee damage. The massive obsidian teeth physically tether the victim's soul to the ground they are standing on. The target is permanently inflicted with the Soul-Anchored condition: they cannot move more than 30 feet from the spot they were bitten, they cannot use teleportation magic to flee, and if they are reduced to 0 damage while anchored, their soul is instantly pulled into the eternal dark, making them completely immune to all resurrection magic short of a divine wish.\n\nCrushing River-Fist(TN12) (Casting Cost: 2 Actions): Xochitonal commands the very water of its domain to rise up and strike. Make a Casting roll (+6 To-Cast) against up to 3 different targets within 100 feet. On a success, the water forms massive, pressurized fists that crash down, dealing 1d10 + 40 Bludgeoning Damage. Targets hit must pass a severe Physique(11) test or be knocked Prone and gain 1 Stunned condition from the sheer weight of the river.\n\nDeath-Roll Annihilation (Cost: 2 Actions): This brutal execution move can only be used on a target that is currently Prone or Grappled. Xochitonal bites down and violently spins its 40-foot body. Make a Melee attack (+8 To-Hit). If successful, it deals 3d10 + 65 damage, instantly shreds any physical armor the target is wearing (permanently reducing their Armor Mitigation to 0 for the remainder of the battle), and inflicts 2 Bleeding conditions.`},
{name:`Yeti: The Blizzard-Stalker`,size:`Large`,type:`Monstrosity / Beast`,tier:`Elite`,tierColor:`#b45309`,desc:`Standing 9 to 11 feet tall, the Yeti is a mountain of corded muscle covered in thick, matted white fur. It doesn't just survive the deadly cold of the high peaks; it weaponizes it. To a Yeti, a blinding blizzard is the perfect hunting ground. They are incredibly territorial and possess a primal, cruel cunning—often burying themselves in snowdrifts to ambush travelers, or using their deafening roars to trigger localized avalanches that crush entire caravans beneath tons of ice.`,agl:4,awa:5,cha:3,int:2,phy:9,wil:6,move:17,ap:3,def:7,wmArmor:10,wmBS:10,wmDP:25,wounds:120,focus:`+1/3`,reroll:1,luck:1,meleeHit:`+4`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`4`,mob:`1-2`,gear:`None. Relies on massive fists and environmental debris.`,meleeDetail:`Simian Fists & Fangs`,rangeDetail:`Hurled Ice Chunks. Throws heavy debris up to 60ft`,abilities:`Passive Traits\nGhost of the Glacier: The Yeti is completely immune to Cold/Ice damage and all weather-related Movement penalties (deep snow, slick ice, etc.). Furthermore, its pristine white fur provides perfect camouflage. When in a snowy environment, the Yeti gains automatic Advantage on all Stealth tests, and any Ranged attacks made against it from further than 30 feet suffer Disadvantage due to the optical illusion of the snow blending with its fur.\n\nHypothermic Grip: The Yeti's body temperature is supernaturally cold to the touch. Any creature that is currently Grappled by the Yeti automatically suffers 1d10 Cold Damage and 1 Fatigued condition at the start of their turn as the beast's freezing fur rapidly saps their body heat.\n\nSnowdrift Ambush: The Yeti can use 1 Action to perfectly bury itself in deep snow. While buried, it is completely undetectable by non-magical means. If an enemy walks within 10 feet of the buried Yeti, it can instantly erupt from the snow, gaining a free Surprise Action before Initiative is rolled.\n\nAction-Based Abilities\nSavage Pummel (Melee Cost: 1 Action): The Yeti brings its massive, heavy fists down like sledgehammers. Make a Melee attack (+4 To-Hit). If successful, it deals normal 1d10 + 25 melee damage, and the target must pass a severe Physique(11) test or suffer 1 Stunned condition from the sheer concussive force of the blow.\n\nWhiteout Roar (Cost: 2 Actions): The Yeti beats its chest and unleashes a deafening roar that literally calls the storm down. A 40-foot radius around the Yeti instantly becomes a howling vortex of snow and wind for 1 round. All enemies within the radius are permanently Blinded to anything further than 5 feet away while inside the storm, and must surpass Willpower TN 8 + Resist bonus or drop their weapons as they cover their ears against the deafening noise.\n\nThe Spine-Breaker (Melee Cost: 2 Actions): The Yeti attempts to grab an enemy in a horrifying bear-hug. Make a Melee attack (+4 To-Hit). If successful, the target is Grappled and lifted off the ground. The Yeti deals 2d10 + 25 damage as it violently compresses the target's ribcage. If the target is wearing physical armor, the sheer pressure buckles the metal, permanently reducing the target's Armor Mitigation by 5.`},
{name:`Yuan-ti Abomination: The Serpent-Blooded`,size:`Large`,type:`Monstrosity / Serpent`,tier:`Elite`,tierColor:`#b45309`,desc:`Sitting at the terrifying apex of their rigid caste system, Abominations are massive hybrids possessing humanoid torsos and the lower bodies of colossal serpents. Biologically incapable of feeling traditional human emotions like love, fear, or remorse, they operate on a cold, intellectual scale of "benefit versus cost." They prefer the "whisper over the fang," using poison, suggestion magic, and political subversion to topple kingdoms from the inside. When they are finally forced onto the battlefield, they strike with surgical precision, executing their enemies with unblinking, sociopathic efficiency.`,agl:5,awa:9,cha:3,int:12,phy:4,wil:6,move:17,ap:3,def:9,wmArmor:10,wmBS:30,wmDP:40,wounds:110,focus:`+2/6`,reroll:3,luck:1,meleeHit:`+3`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`+4`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`+5`,castDmg:`+30`,castHeal:`0`,castType:`Wizardry`,fear:`5`,mob:`1`,gear:`asterwork Scimitar (Coated in venom), Ornate Gold/Emerald Jewelry`,meleeDetail:`Scimitar & Fangs`,rangeDetail:`Venom Spit. Shoots a concentrated stream of acid/venom up to 40ft`,abilities:`Passive Traits\nThe Emotionless Void: Because the Yuan-ti are biologically incapable of empathy or fear, they are completely immune to the Charmed, Fear, and Taunted conditions. Any illusion or spell that relies on manipulating the target's emotions automatically fails against them.\n\nSerpent's Thermoreception: The Abomination has heat-sensing pits along its jawline. It perceives the thermal signatures of living creatures, allowing it to see perfectly in magical darkness and completely ignore Invisibility as long as the invisible creature emits body heat.\n\nSurgical Precision: The Yuan-ti never wastes an opening. Any time the Abomination makes an attack against a target that is currently suffering from Poison, Stunned, or Grappled, its attacks automatically bypass half of the target's Armor Mitigation.\n\nAction-Based Abilities\nThe Whisper Over the Fang(TN11) (Casting Cost: 2 Actions): The Yuan-ti's eyes flash with a hypnotic, prismatic light as it speaks a soothing, magically laced command into a target's mind. Make a Casting roll (+5 To-Cast) against the Willpower of a target within 60 feet. On a success, the target's mind is subverted: they must use their Reaction (or their very next turn) to make a full physical attack against their closest ally, dealing an additional 2d10 psychic damage from the mental violation.\n\nNeurotoxic Strike (Melee Cost: 1 Action): The Abomination lashes out with its venom-coated scimitar or fangs. Make a Melee attack (+3 To-Hit). If successful, it deals normal 1d10 + 25 damage and the target must pass a severe Physique(11) test. On a failure, they suffer 2 Poison conditions and become Blinded by the neurotoxin for 1 round, making them easy prey for the rest of the serpent brood.\n\nCrushing Coils (Melee Cost: 1 Action): The Abomination whips its massive serpentine lower body around a target. Make a Melee attack (+8 To-Hit). If successful, the target takes 2d10 + 20 damage and is Grappled (Movement reduced to 0). While a target is Grappled this way, the Yuan-ti can use a free action at the start of its subsequent turns to automatically squeeze them for 2d10 crushing damage as long as the hold isn't broken.`},

s Physique TN 12 or be dragged 10ft closer to the core. Flying creatures are unaffected.\n\nActive Abilities\nThe Great Exhale (3 AP): Once per encounter, the Eye of the World releases a catastrophic outward blast of compressed air. All creatures within 80ft take 5d10 damage ignoring all non-magical Damage Mitigation and are thrown 40ft from the Eye, landing Prone. Structures within 40ft take full damage. The Eye cannot use this ability two turns in a row.\nDevour (2 AP): The Eye attempts to pull a single creature within 30ft into its vacuum core. Target must pass Physique TN 16 + Resist bonus or be drawn in — taking 4d10 damage per turn while inside, immune to rescue. A second Physique TN 16 test at the start of each turn allows escape. While Devoured, the target cannot act.\nEye of Calm (Passive): Any creature that reaches the absolute centre of the Eye (within 5ft of the vacuum core) takes no damage from the Lord itself — the Eye is silent, motionless, and utterly still. What waits in the calm is up to the DM.`},

let activeFilters = new Set();
let casterOnly    = false;
let currentMonster= null;
let pinnedMonster = null;
let compareMode   = false;
let filtered      = [...MONSTERS];
const artCache    = {};
const ART_DIR     = 'bestiary-art/';
const ART_EXTS    = ['jpg','jpeg','png','webp'];

// ══════════════════════════════════════════════ TIER
function tierFromWounds(w) {
  const n = parseInt(String(w).split(/[-\/]/)[0]) || 0;
  if (n <= 30)  return {tier:'Minion',    color:getComputedStyle(document.documentElement).getPropertyValue('--minion').trim()};
  if (n <= 80)  return {tier:'Skirmisher',color:getComputedStyle(document.documentElement).getPropertyValue('--skirmisher').trim()};
  if (n <= 150) return {tier:'Elite',     color:getComputedStyle(document.documentElement).getPropertyValue('--elite').trim()};
  if (n <= 300) return {tier:'Boss',      color:getComputedStyle(document.documentElement).getPropertyValue('--boss').trim()};
  return {tier:'Legendary',color:getComputedStyle(document.documentElement).getPropertyValue('--legendary').trim()};
}

function resistFromTier(tier) {
  switch(tier) {
    case 'Minion':     return {resist: 0, turn: 1};
    case 'Skirmisher': return {resist: 1, turn: 2};
    case 'Elite':      return {resist: 2, turn: 3};
    case 'Boss':       return {resist: 3, turn: 4};
    case 'Legendary':  return {resist: 5, turn: 6};
    default:           return {resist: 0, turn: 0};
  }
}

// ══════════════════════════════════════════════ FILTERS
function toggleTier(tier) {
  if(activeFilters.has(tier)) activeFilters.delete(tier); else activeFilters.add(tier);
  document.getElementById('f-'+tier).classList.toggle('active',activeFilters.has(tier));
  applyFilters();
}
function toggleCaster() {
  casterOnly=!casterOnly;
  document.getElementById('f-caster').classList.toggle('active',casterOnly);
  applyFilters();
}
function clearFilters() {
  activeFilters.clear(); casterOnly=false;
  document.getElementById('search-input').value='';
  ['Minion','Skirmisher','Elite','Boss','Legendary'].forEach(t=>document.getElementById('f-'+t).classList.remove('active'));
  document.getElementById('f-caster').classList.remove('active');
  applyFilters();
}
function applyFilters() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  filtered = MONSTERS.filter(m => {
    if(q && !m.name.toLowerCase().includes(q) && !m.type.toLowerCase().includes(q)) return false;
    if(activeFilters.size>0 && !activeFilters.has(m.tier)) return false;
    if(casterOnly && (!m.castType||m.castType==='—'||m.castType==='None')) return false;
    return true;
  });
  renderList();
}

// ══════════════════════════════════════════════ LIST
function shortName(n) { return n.split(':')[0].trim(); }

function renderList() {
  const panel = document.getElementById('list-panel');
  const count = document.getElementById('list-count');
  count.textContent = filtered.length+' / '+MONSTERS.length+' CREATURES';
  document.getElementById('hdr-count').textContent = filtered.length+' CREATURES';
  const existing = panel.querySelectorAll('.list-item,.no-results');
  existing.forEach(e=>e.remove());
  if(!filtered.length){
    const nr=document.createElement('div'); nr.className='no-results'; nr.textContent='No creatures found';
    panel.appendChild(nr); return;
  }
  filtered.forEach(m=>{
    const div=document.createElement('div');
    const isPinned = pinnedMonster===m;
    div.className='list-item'+(currentMonster===m?' active':'')+(isPinned?' pinned':'');
    div.innerHTML=`<div class="li-dot" style="background:${m.tierColor}"></div><div class="li-name">${shortName(m.name)}</div><div class="li-size">${m.size}</div>`;
    div.onclick=()=>selectMonster(m,div);
    panel.appendChild(div);
  });
}

// ══════════════════════════════════════════════ ABILITIES PARSER
function parseAbilities(raw) {
  const sections={passive:[],action:[],reaction:[]};
  let current='passive';
  const lines=(raw||'').split('\n').map(l=>l.trim()).filter(Boolean);
  for(const line of lines){
    if(line.length<=40 && !line.includes('(') && !line.includes(':')){
      const ll=line.toLowerCase();
      if(ll.includes('passive')){current='passive';continue;}
      if(ll.includes('reaction')){current='reaction';continue;}
      if(ll.includes('action')||ll.includes('active')){current='action';continue;}
    }
    if(line.length>2) sections[current].push(line);
  }
  return sections;
}

function abilityHTML(sections) {
  let html='';
  const defs=[{key:'passive',label:'Passive Traits',cls:'passive'},{key:'action',label:'Actions',cls:'action'},{key:'reaction',label:'Reactions',cls:'reaction'}];
  for(const {key,label,cls} of defs){
    if(!sections[key].length) continue;
    html+=`<div class="ability-section ${cls}"><div class="ability-section-head">${label}</div>`;
    sections[key].forEach(line=>{html+=`<div class="ability-entry ${cls}">${line}</div>`;});
    html+='</div>';
  }
  return html;
}

// ══════════════════════════════════════════════ CARD RENDER
function renderCard(m, compareWith) {
  const abilities = parseAbilities(m.abilities);

  // Build compare class for a stat cell
  function cmpClass(field, invert=false) {
    if(!compareWith) return '';
    const a=parseFloat(String(m[field]).replace(/[^0-9.\-]/g,''));
    const b=parseFloat(String(compareWith[field]).replace(/[^0-9.\-]/g,''));
    if(isNaN(a)||isNaN(b)) return '';
    const better = invert ? a<b : a>b;
    const worse  = invert ? a>b : a<b;
    return better?' sc-better':worse?' sc-worse':'';
  }
  function cmpAtk(field) {
    if(!compareWith) return '';
    const a=parseFloat(String(m[field]).replace(/[^0-9.\-]/g,''));
    const b=parseFloat(String(compareWith[field]).replace(/[^0-9.\-]/g,''));
    if(isNaN(a)||isNaN(b)) return '';
    return a>b?' ct-better':a<b?' ct-worse':'';
  }

  const nameSub   = m.name.includes(':') ? `<div class="mc-name-sub">${m.name.split(':').slice(1).join(':').trim()}</div>` : '';
  const castTag   = (m.castType&&m.castType!=='—'&&m.castType!=='None') ? `<span class="mc-tag cast">✦ ${m.castType}</span>` : '';
  const fearTag   = (m.fear&&m.fear!=='—') ? `<span class="mc-tag fear">FEAR ${m.fear}</span>` : '';
  const loreHTML  = (m.desc&&m.desc!=='—') ? `<div class="mc-lore">${m.desc}</div>` : '';
  const gearHTML  = (m.gear&&m.gear!=='—') ? `<div class="gear-box"><span class="gl">Gear &amp; Equipment</span>${m.gear}</div>` : '';
  const abilHtml  = (m.abilities&&m.abilities!=='—') ? `<div class="mc-abilities">${abilityHTML(abilities)}</div>` : '';

  const meleeRow = (m.meleeHit!=='—'||m.meleeDmg!=='—') ? `<tr class="${cmpAtk('meleeDmg')}"><td class="ct-lbl">Melee</td><td class="ct-val hit">${m.meleeHit}</td><td class="ct-val dmg">${m.meleeDmg}</td><td class="ct-val heal">${m.meleeHeal!=='—'?m.meleeHeal:'—'}</td><td class="ct-detail">${m.meleeDetail!=='—'?m.meleeDetail:''}</td></tr>` : '';
  const rangeRow = (m.rangeHit!=='—'||m.rangeDmg!=='—') ? `<tr class="${cmpAtk('rangeDmg')}"><td class="ct-lbl">Ranged</td><td class="ct-val hit">${m.rangeHit}</td><td class="ct-val dmg">${m.rangeDmg}</td><td class="ct-val heal">${m.rangeHeal!=='—'?m.rangeHeal:'—'}</td><td class="ct-detail">${m.rangeDetail!=='—'?m.rangeDetail:''}</td></tr>` : '';
  const castRow  = (m.castHit!=='—'||m.castDmg!=='—')   ? `<tr class="${cmpAtk('castDmg')}"><td class="ct-lbl">${(m.castType&&m.castType!=='—'&&m.castType!=='None')?m.castType:'Cast'}</td><td class="ct-val hit">${m.castHit}</td><td class="ct-val dmg">${m.castDmg}</td><td class="ct-val heal">${m.castHeal!=='—'?m.castHeal:'—'}</td><td class="ct-detail"></td></tr>` : '';

  const isPinned = pinnedMonster===m;
  const isCompare = !!compareWith;
  const cardClass = isCompare ? 'monster-card compare-card' : 'monster-card';

  const pinLabel = isPinned ? '&#x1F4CC; Pinned' : '&#x1F4CC; Pin';
  const pinCls   = isPinned ? 'mc-btn pin pinned' : 'mc-btn pin';
  const actionsHTML = isCompare ? '' : (
    '<div class="mc-actions">' +
    '<button class="mc-btn tracker" data-action="tracker">&#x2694; Tracker</button> ' +
    '<button class="' + pinCls + '" data-action="pin">' + pinLabel + '</button> ' +
    '<button class="mc-btn" data-action="edit">&#x270E; Edit</button> ' +
    '<button class="mc-btn" data-action="print">&#x2399; Print</button>' +
    '</div>'
  );

// ══════════════════════════════════════════════ SELECT
function selectMonster(m, el) {
  currentMonster=m;
  document.querySelectorAll('.list-item').forEach(li=>li.classList.remove('active'));
  if(el) el.classList.add('active');
  renderDetail();
}

function attachCardListeners() {
  // No-op: event delegation handles all card button clicks
  // See the delegated listener on #detail-panel at init
}

function renderDetail() {
  if(!currentMonster) return;
  const panel = document.getElementById('detail-panel');
  const cmpWith = (compareMode && pinnedMonster && pinnedMonster !== currentMonster) ? pinnedMonster : null;
  panel.innerHTML = renderCard(currentMonster, cmpWith);
  if(compareMode) panel.classList.add('comparing');
  attachCardListeners();
  if(compareMode && pinnedMonster && pinnedMonster !== currentMonster) {
    renderCompare();
  } else {
    renderArtSlot(currentMonster, 'mc-art-slot');
    setupArtDrop('mc-art-slot', currentMonster.name);
  }
}

// ══════════════════════════════════════════════ COMPARE
function toggleCompare() {
  compareMode=!compareMode;
  const btn=document.getElementById('compare-toggle');
  const cPanel=document.getElementById('compare-panel');
  const dPanel=document.getElementById('detail-panel');
  const mainLayout=document.getElementById('main-layout');
  btn.classList.toggle('active',compareMode);
  btn.textContent = compareMode ? '✕ COMPARE OFF' : '⚔ COMPARE';
  mainLayout.classList.toggle('compare-active', compareMode);
  // Let CSS handle display via compare-active class
  cPanel.style.display = '';
  dPanel.classList.toggle('comparing', compareMode);
  renderDetail();
}

function togglePin() {
  if(pinnedMonster===currentMonster){
    pinnedMonster=null;
  } else {
    pinnedMonster=currentMonster;
    if(!compareMode) toggleCompare();
  }
  renderList();
  renderDetail();
}

function clearPin() {
  pinnedMonster=null;
  renderList();
  renderDetail();
  document.getElementById('compare-content').innerHTML='<div class="detail-empty" style="height:300px;"><div class="de-rune" style="font-size:32pt;">📌</div><div class="de-text">Pin a monster first</div></div>';
}

function renderCompare() {
  if(!pinnedMonster) return;
  const content = document.getElementById('compare-content');
  const panel = document.getElementById('detail-panel');
  // Set both cards HTML first, then load art
  content.innerHTML = renderCard(pinnedMonster, currentMonster);
  panel.innerHTML = renderCard(currentMonster, pinnedMonster);
  panel.classList.add('comparing');
  attachCardListeners();
  // Load art after both cards are in DOM
  renderArtSlot(pinnedMonster, 'cmp-art-slot');
  renderArtSlot(currentMonster, 'mc-art-slot');
  setupArtDrop('cmp-art-slot', pinnedMonster.name);
  setupArtDrop('mc-art-slot', currentMonster.name);
}

// ══════════════════════════════════════════════ ART
function slugify(name){return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}

function renderArtSlot(m, slotId) {
  const slot=document.getElementById(slotId);
  if(!slot) return;
  if(artCache[m.name]){
    slot.innerHTML=`<img src="${artCache[m.name]}"><button class="art-clear" onclick="clearArt(event,'${m.name}','${slotId}')">✕ REMOVE</button>`;
    return;
  }
  const base=ART_DIR+slugify(m.name);
  const base2=ART_DIR+m.name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  const base3=ART_DIR+m.name.toLowerCase().split('').map(c=>/[a-z0-9]/.test(c)?c:'_').join('').replace(/^_+/,'');
  const bases=[base,base2,base3];
  let baseIdx=0,extIdx=0;
  function tryNext(){
    if(extIdx>=ART_EXTS.length){
      extIdx=0; baseIdx++;
      if(baseIdx>=bases.length){
        slot.innerHTML=`<input type="file" accept="image/*" onchange="loadArt(event,'${m.name}','${slotId}')" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%"><div class="mc-art-label"><div class="al-icon">🖼</div><div class="al-text">CLICK TO ADD ART</div><div class="al-sub">${base}.png</div></div>`;
        return;
      }
    }
    const img=new Image();
    img.onload=()=>{slot.innerHTML=`<img src="${img.src}"><button class="art-clear" onclick="clearArt(event,'${m.name}','${slotId}')">✕ REMOVE</button>`;};
    img.onerror=tryNext;
    img.src=bases[baseIdx]+'.'+ART_EXTS[extIdx++];
  }
  tryNext();
}
function triggerArtUpload(){const f=document.getElementById('mc-art-slot')?.querySelector('input[type=file]');if(f)f.click();}
function loadArtFile(file,name,slotId){
  if(!file||!file.type.startsWith('image/')) return;
  const reader=new FileReader();
  reader.onload=e=>{artCache[name]=e.target.result; renderArtSlot({name},slotId);};
  reader.readAsDataURL(file);
}

function setupArtDrop(slotId,name){
  const slot=document.getElementById(slotId);
  if(!slot) return;
  slot.addEventListener('dragover',e=>{e.preventDefault();slot.style.outline='3px dashed #B8860B';slot.style.outlineOffset='−2px';});
  slot.addEventListener('dragleave',()=>{slot.style.outline='';});
  slot.addEventListener('drop',e=>{
    e.preventDefault();
    slot.style.outline='';
    const file=e.dataTransfer.files[0];
    if(file) loadArtFile(file,name,slotId);
  });
}
function loadArt(event,name,slotId){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{artCache[name]=e.target.result; renderArtSlot({name},slotId);};
  reader.readAsDataURL(file);
}
function clearArt(e,name,slotId){
  e.stopPropagation(); delete artCache[name];
  const m=MONSTERS.find(x=>x.name===name);
  if(m) renderArtSlot(m,slotId);
}

function sendToTracker() {
  if(!currentMonster) return;
  const m=currentMonster;
  const wVal=parseInt(String(m.wounds).split(/[-\/]/)[0])||50;
  const fpM=String(m.focus).match(/\+?(\d+)\/(\d+)/);
  const pkg={
    identity:{name:shortName(m.name),race:m.type,size:m.size},
    combatStats:{
      wTotal:wVal, apTotal:parseInt(m.ap)||2,
      fpBase:fpM?parseInt(fpM[2]):0,
      initiative:parseInt(m.agl)||0, defense:parseInt(m.def)||0,
      movement:parseInt(m.move)||0,
      meleeHit1:m.meleeHit!=='—'?m.meleeHit:0, meleeDmg1:m.meleeDmg!=='—'?m.meleeDmg:0,
      rangeHit1:m.rangeHit!=='—'?m.rangeHit:null, rangeDmg1:m.rangeDmg!=='—'?m.rangeDmg:null,
      castHit:m.castHit!=='—'?m.castHit:null, castDmg:m.castDmg!=='—'?m.castDmg:null,
      castHeal:m.castHeal!=='—'?m.castHeal:null,
      wmArmor:parseInt(m.wmArmor)||0, wmBless:parseInt(m.wmBS)||0, wmDispoi:parseInt(m.wmDP)||0,
    },
    notes:`Fear:${m.fear} | Focus:${m.focus} | Mob:${m.mob}`,
    isNPC:true,
  };
  const blob=new Blob([JSON.stringify(pkg,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=shortName(m.name).replace(/[^a-z0-9]/gi,'_')+'.pou';
  a.click(); URL.revokeObjectURL(url);
  const btn=document.querySelector('.mc-btn.tracker');
  if(btn){const orig=btn.textContent; btn.textContent='✓ Downloaded'; setTimeout(()=>btn.textContent=orig,2000);}
}

    fields.forEach(f=>vals.push(f?m[f]||'':''));
    return {values:vals};
  }),null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='Clean_Bestiary.rpgb';a.click();URL.revokeObjectURL(url);
}

function importData(event) {
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(Array.isArray(data)){
        // Check if it's the new format (objects with named keys) or old (values array)
        if(data[0]?.name!==undefined){
          // New format — direct assign
          MONSTERS.length=0; data.forEach(m=>MONSTERS.push(m));
        } else if(data[0]?.values){
          // Old .rpgb format — map values
          MONSTERS.length=0;
          data.forEach(entry=>{
            const v=entry.values||[];
            const g=(i,d='—')=>(v[i]&&v[i]!==''&&v[i]!=='0')?v[i]:d;
            const wounds=g(17,'50');
            const t=tierFromWounds(wounds);
            MONSTERS.push({name:g(0),size:g(1),type:g(2),tier:t.tier,tierColor:t.color,
              desc:g(4),agl:g(5),awa:g(6),cha:g(7),int:g(8),phy:g(9),wil:g(10),
              move:g(11),ap:g(12),def:g(13),wmArmor:g(14),wmBS:g(15),wmDP:g(16),
              wounds,focus:g(18),reroll:g(19),luck:g(20),
              meleeHit:g(21),meleeDmg:g(22),meleeHeal:g(23),
              rangeHit:g(24),rangeDmg:g(25),rangeHeal:g(26),
              castHit:g(27),castDmg:g(28),castHeal:g(29),castType:g(30),
              fear:g(31),mob:g(32),gear:g(33),meleeDetail:g(34),rangeDetail:g(35),
              abilities:g(36,'—'),
            });
          });
        }
        filtered=[...MONSTERS]; applyFilters();
        alert(`Loaded ${MONSTERS.length} creatures.`);
      }
    }catch(err){alert('Import failed: '+err.message);}
  };
  reader.readAsText(file);
  event.target.value='';
}

// ══════════════════════════════════════════════ INIT
// Delegation — walk up from click target to find data-action
function handleCardClick(e) {
  let el = e.target;
  while(el && el !== document.body) {
    if(el.dataset && el.dataset.action) {
      const action = el.dataset.action;
      if(action === 'tracker') sendToTracker();
      else if(action === 'pin')  togglePin();
      else if(action === 'edit') editMonster();
      else if(action === 'print') window.print();
      e.stopPropagation();
      return;
    }
    el = el.parentElement;
  }
}

document.getElementById('detail-panel').addEventListener('click', handleCardClick);

applyFilters();
</script>
