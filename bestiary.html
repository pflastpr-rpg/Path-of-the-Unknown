{name:`Displacer Beast: The Phase-Stalker`,size:`Medium`,type:`Monstrosity / Beast`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A predatory masterpiece of illusion. A sleek, six-legged feline with obsidian fur, it is constantly surrounded by a shimmering haze. This isn't magic it casts, but a biological property of its hide that bends light, making the beast appear to be several feet away from its actual position. It stalks its prey from the shadows, using its unnatural geometry and twin spiked tentacles to tear apart its victims before they even know where to swing their swords.`,agl:9,awa:8,cha:2,int:1,phy:6,wil:5,move:27,ap:4,def:7,wmArmor:10,wmBS:15,wmDP:10,wounds:45,focus:`+1/3`,reroll:0,luck:0,meleeHit:`+3`,meleeDmg:`+20`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`4`,mob:`1-2`,gear:`None`,meleeDetail:`Barbed Tentacles & Claws`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nThe Displacement Haze: The biological light-bending of its hide is always active. Any Melee or Ranged attack targeting the Displacer Beast automatically suffers Disadvantage. If the beast is inflicted with the Stunned or Unconscious conditions, this passive biological function shuts down until it recovers.\n\nPhantom Afterimage: If an attacker misses a Melee attack against the Displacer Beast (meaning they struck the illusion), the beast can instantly use its Reaction to shift up to 5 feet into an unoccupied space without triggering free attacks of opportunity.\n\nSix-Legged Stability: Its unnatural anatomy grants it perfect balance. It is completely immune to the Prone condition and ignores all Movement penalties associated with natural difficult terrain like thick mud or dense underbrush.\n\nAction-Based Abilities\nSpiked Tentacle Whip (Melee Cost: 2 Actions): The beast lashes out with the heavy, barbed tentacles extending from its shoulders. Make a Melee attack (+3 To-Hit). This attack has a 10-foot reach, allowing the beast to strike from behind the safety of its illusion. If successful, it deals 1d10 + 20 damage and inflicts 1 Bleeding condition.\n\nPhase-Pounce (Melee Cost: 2 Actions): The beast closes the gap in a terrifying blur. It moves up to 30 feet and makes a Melee attack (+2 To-Hit). On a hit, it deals 2d10 + 20 damage, and the target is automatically Grappled by the tentacles, dragged adjacent to the beast's gnashing jaws.\n\nShimmering Retreat (Cost: 1 Action): Knowing when to reposition, the beast instantly Disengages from melee combat. It moves up to 20 feet away, leaving a static, perfectly realistic illusion of itself in its former space. The next Ranged attack or single-target spell that passes through that space automatically hits the illusion instead of any actual targets, destroying the fake image.`},
{name:`Dog - War: The Loyal Anchor`,size:`Medium`,type:`Beast`,tier:`Minion`,tierColor:`#607080`,desc:`A true War Dog is a mountain of corded muscle and scarred leather. Usually of a mastiff or wolfhound lineage, these beasts are outfitted with spiked collars and light leather or chain barding. They don't bark at shadows; they wait for the command to tear the throat out of whatever is lurking within them. In a world of magic and monsters, the War Dog serves as a grounded anchor. Their nose can smell a Shaman’s ozone or a Daemon's rot long before a human eye sees a flicker in the treeline. They aren't just pets; they are tactical partners that prioritize their master's life above their own.`,agl:5,awa:9,cha:1,int:2,phy:8,wil:7,move:20,ap:3,def:6,wmArmor:7,wmBS:5,wmDP:5,wounds:25,focus:`+1/3`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-3`,gear:`Spiked Collar, Leather/Chain Barding`,meleeDetail:`Crushing Jaws`,rangeDetail:`None`,abilities:`Passive Traits\nUnwavering Morale: The War Dog is immune to fear, panic, and psychic rout effects as long as its designated Master (or an allied player) is conscious and within line of sight. It will gladly stand in a wall of fire if commanded to hold the line.\n\nThe Sensory Anchor: The dog cannot be ambushed. If an enemy attempts to use Stealth or magical Invisibility within 30 feet, the War Dog automatically pinpoints their exact location by scent, pointing them out to its allies and completely stripping the enemy of any unseen Advantage.\n\nTactical Partner: The War Dog understands flanking and crossfires instinctively. It automatically gains Advantage on its Melee attack rolls if its Master (or an ally) is engaged in melee combat with the same target.\n\nAction-Based Abilities\nThe Lockdown (Melee Cost: 2 Actions): The dog uses its sheer mass to pin an enemy, preventing them from reaching the backline casters. It lunges up to 15 feet and makes a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 10 damage, and the target is knocked Prone and securely Grappled. The target cannot move until they spend an Action to physically wrestle the dog off them. The target must be of medium size or less to be pinned.\n\nThroat Tear (Melee Cost: 1 Action): A vicious, finishing bite on a pinned target. Make a Melee attack (+4 To-Hit), suffering 1d10 + 10 damage. If this attack targets an enemy that is currently Prone or Grappled, it automatically inflicts 1 Bleeding condition and deals an additional +10 damage.\n\nIntercepting Lunge (Cost: 1 Action): Prioritizing its master's life above its own, the dog instantly Disengages from its current fight without triggering free attacks of opportunity. It moves up to 25 feet to place itself directly between an allied character and an approaching enemy, acting as a living shield.`},
{name:`Dwarf: Kel Thurum Militiaman ("Iron Joe")`,size:`Medium`,type:`Humanoid`,tier:`Minion`,tierColor:`#607080`,desc:`Not every Dwarf is a runed-plate elite. "Iron Joe" is the backbone of Kel Thurum: the miner, the mason, the brewer, and the smith. Drafted into the local militia when danger threatens the lower gates, they march to war in thick leather aprons, iron caps, and whatever heavy tool they were just using. They lack the flawless tactical discipline of the Royal Guard, but they make up for it with sheer, blue-collar stubbornness, callous-thick skin, and a complete refusal to back down from a fight—especially if they've already had a pint.`,agl:-1,awa:0,cha:0,int:1,phy:5,wil:6,move:8,ap:3,def:4,wmArmor:10,wmBS:5,wmDP:10,wounds:25,focus:`0`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+5/+10(2H)`,meleeHeal:`0`,rangeHit:`+1`,rangeDmg:`+1`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`3-12`,gear:`Mining Pick, Blacksmith Hammer, Leather Apron, Iron Flask`,meleeDetail:`Heavy Work Tools`,rangeDetail:`Crossbow`,abilities:`Passive Traits\nBlue-Collar Vigor: "Iron Joe" is used to 14-hour shifts in the mines. He is completely immune to the Fatigued condition, and cannot be forced to drop his equipped weapon by physical or magical means (his grip is like a vice).\n\nShield-Brother Rabble: They might not be trained soldiers, but they look out for each other. If a \n"Iron-Joe" Dwarf is standing adjacent to at least one other allied Dwarf, they automatically gain +1 to their Defense and Advantage on Willpower tests against Fear.\n\nStubborn as Stone: Despite his negative Agility, his low center of gravity makes him remarkably hard to topple. Any physical attack or ability that attempts to knock "Iron Joe" Prone automatically suffers Disadvantage if of equal size or smaller.\n\nAction-Based Abilities\nThe Knee-Capper (Melee Cost: 2 Actions): A brutal, low-swinging chop with a pickaxe aimed at the shins. Make a Melee attack (+2 To-Hit). If successful, it deals 10 damage and the target's Movement is reduced by half on their next turn.\n\nTavern Haymaker (Cost: 2 Actions): A massive, telegraphed, wild swing. Make a Melee attack (+2 To-Hit). On a hit, it deals 1d10 + 15 Bludgeoning Damage and violently shoves the target 5 feet backward. If this attack misses, "Iron Joe" loses his balance and stumbles 5 feet forward.\n\nLiquid Courage (Cost: 1 Action): The Dwarf takes a massive swig from his iron hip-flask. He instantly recovers 5 damage and gains 1 temporary Focus point, but takes a -1 penalty to his Awareness for the rest of the encounter due to the inebriation.`},
{name:`Dwarf: The Living Stone (Kel Thurum Defender)`,size:`Medium`,type:`Hmanoid`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A masterpiece of compact power. Standing a head shorter than a man but weighing just as much, they are built of broad shoulders and thick, weathered skin. Their beards are braided with gold and iron, telling the tale of their lineage. To a Dwarf, the world is a series of things to be built, mined, or defended. Hailing from the capital city of Kel Thurum, they possess a "hard mind"—a stubbornness bordering on the supernatural. They are the ultimate survivors, thriving in the dark, airless depths.\n\nThese are the elite guard hailing from Kel Thurum, the Dwarven Capital City.`,agl:1,awa:5,cha:4,int:6,phy:8,wil:9,move:10,ap:3,def:7,wmArmor:15,wmBS:10,wmDP:20,wounds:45,focus:`0`,reroll:1,luck:1,meleeHit:`+4`,meleeDmg:`+13`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`2-6`,gear:`Kel Thurum Forge-Hammer, Heavy Iron Shield, Runed Plate Armor`,meleeDetail:`Kel Thurum Forge-Hammer`,rangeDetail:`Crossbow`,abilities:`Passive Traits\nThe Unshakable Anvil: As long as the Dwarf's feet are planted on solid stone or earth, they cannot be moved against their will. They are completely immune to being knocked Prone, pushed backward, by any creature its size or smaller.\n\nMaster of the Forge (Sundering): The Dwarf knows exactly where the structural weakness in an enemy's armor is. Any time the Dwarf successfully deals damage to a target with a Melee attack, they permanently reduce that target's Armor Mitigation by 3 as they crush joints and shatter plating.\n\nThe Hard Mind: The Dwarf’s stubbornness acts as a mental fortress. They automatically gain Advantage on all Willpower tests to resist being Charmed, Shaken, or magically manipulated.\n\nAction-Based Abilities\nStructural Strike (Melee Cost: 1 Action): A devastating, precise hammer blow aimed at equipment rather than flesh. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 13 damage. If the target is currently wielding a physical shield, the shield immediately loses 1 tier of effectiveness (or shatters completely if it is non-magical).\n\nHold the Doorway (Cost: 2 Actions): The Dwarf plants their feet, locks their shield, and becomes a living wall. Until the start of their next turn, their Defense becomes a 9 against frontal attacks. Furthermore, if an adjacent ally is targeted by a physical Melee attack, the Dwarf can automatically intercept the blow, forcing the attack to roll against the Dwarf's Defense instead.\n\nOath of Kel Thurum (Cost: 1 Action): The Dwarf touches a braided iron charm in their beard, swearing an oath against a specific enemy. For the remainder of the combat encounter, the Dwarf automatically gains Advantage on all Melee To-Hit rolls against that specific target, but suffers a -10 Movement penalty if they try to walk away from them.`},
{name:`Earth-Maw`,size:`Titanic`,type:`Beast / Primordial`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A subterranean leviathan that consumes entire fortresses.\n\n"A continent-shifting worm with three concentric rings of grinding teeth. It does not battle heroes; it alters the geography they stand on."`,agl:4,awa:9,cha:1,int:3,phy:21,wil:15,move:53,ap:3,def:9,wmArmor:12,wmBS:15,wmDP:24,wounds:2000,focus:`0`,reroll:0,luck:0,meleeHit:`+8`,meleeDmg:`+160`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`10`,mob:`1`,gear:`Bedrock Scales (Natural Armor)`,meleeDetail:`Tri-Ring Crush (Treats as 2H)`,rangeDetail:`None`,abilities:`Passive Traits\nGeologic Mass: Immune to all knockdown, push, or pull effects. Its sheer size means it takes no extra damage from standard Bleed conditions.\n\nSwallow Whole: Any successful melee hit that rolls an unmodified 10 automatically swallows a Medium or smaller target, inflicting 20 Acid Damage per turn until the target cuts their way out.\n\nTremorsense: The Earth-Maw's Awareness of 10 allows it to detect the exact location of anything touching the ground within 500 feet, ignoring invisibility.\n\nActions\nTectonic Slam (Melee Cost: 2): Slams its body onto the battlefield. All creatures within 100 ft must make an Agility(12) Save or take half of its Melee damage (80) and be knocked Prone.\n\nDevour (Melee Cost: 1): Standard Melee attack using the 160 Wound damage profile.\n\nSubmerge (Cost: 3): Dives beneath the earth, gaining full cover and healing 3d10 damage while preparing to erupt beneath the party on the next turn.`},
{name:`Efreeti: The Sultan of Ash`,size:`Giant`,type:`Elemental / Genie`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A towering, muscular genie standing over 12 feet tall. Their skin is the color of polished bronze or weathered basalt, and their hair manifests as flickering, violet-black flames. They are adorned in silks that never ash and jewelry forged from liquid, glowing "Sun-Gold." They are masters of the Cruel Contract, preferring to enslave rather than kill, binding souls to toil in volcanic mines. In combat, they are arrogant and theatrical, wielding massive scimitars and commanding the very smoke in the air to choke the life out of their enemies.`,agl:2,awa:4,cha:8,int:5,phy:9,wil:15,move:`20/40F`,ap:3,def:7,wmArmor:15,wmBS:20,wmDP:5,wounds:250,focus:`+2/6`,reroll:2,luck:4,meleeHit:`+6`,meleeDmg:`+40(2H)`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+5`,castDmg:`+20`,castHeal:`0`,castType:`Wizardry`,fear:`5`,mob:`1-2`,gear:`The Sun-Gold Scimitar, Silks of the Inner Planes`,meleeDetail:`Sun-Gold Scimitar`,rangeDetail:`None`,abilities:`Passive Traits\nThe Smoldering Court (Aura of Smoke): The Efreeti commands the air itself. A 30-foot radius around the Sultan is perpetually filled with thick, choking volcanic smoke. This area counts as partial concealment (imposing Disadvantage on Ranged attacks targeting him). Any enemy starting their turn in the smoke takes 5 Fire Damage and cannot regain Focus.\n\nLiquid Sun-Gold: His jewelry and weapons are forged of impossibly hot, liquid metal. Any time the Sultan successfully strikes a target with his Melee attack, or is struck by a non-magical Melee weapon, the liquid gold splashes. The target (or attacker) automatically gains 1 Burning condition (1d10 damage).\n\nThe Cruel Contract: The Sultan does not kill; he collects. If a player is reduced to 0 damage by the Efreeti, they do not die. Instead, their soul is instantly bound by an infernal contract. They are stabilized at 1 Wound, but become permanently Charmed and must fight their allies until the Efreeti is defeated or the contract is magically broken.\n\nAction-Based Abilities\nTheatrical Cleave (Melee Cost: 2 Actions): A sweeping, arrogant strike with the massive scimitar. Make a Melee attack (+6 To-Hit) against up to two adjacent targets. If successful, it deals 1d10 +40 damage, and the sheer force of the blow knocks the targets 10 feet backward.\n\nAsh-Choke(TN11) (Casting Cost: 2 Actions): The Efreeti clenches his fist, forcing the smoke in the air directly into his enemies' lungs. Make a Casting attack (+5 To-Hit) against all enemies within 30 feet. On a hit, it deals 2d10 + 20 Fire/Asphyxiation damage, and targets are completely Silenced (unable to speak or cast verbal spells) for 1 round as they violently cough up ash.\n\nKneel Before the Sultan(TN7) (Casting Cost: 1 Action): Weaponizing his 15 Willpower, he commands absolute submission. Make a Casting attack (+5 To-Hit) against one target within 50 feet. If successful, it deals no Wounds, but the target must instantly drop to the ground (Prone) and is completely Stunned for 1 round, overwhelmed by the genie's dominant aura. A Willpower(12) test is allowed to ignore the effects.`},
{name:`Elder Verdantus`,size:`Giant`,type:`Ancient Treant (Arch-Guardian)`,tier:`Lore`,tierColor:`#607080`,desc:`The Chronicler of Leaves. His bark is etched with the history of the world in ancient runes. He is a living library of the Great Prismatic Event.`,agl:1,awa:8,cha:6,int:8,phy:15,wil:10,move:3,ap:4,def:3,wmArmor:45,wmBS:20,wmDP:0,wounds:450,focus:`5`,reroll:2,luck:1,meleeHit:`+8`,meleeDmg:`3d10+15`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+8`,castDmg:`0`,castHeal:`20`,castType:`Faith`,fear:`10`,mob:`1`,gear:`Ancient Runes`,meleeDetail:`Crushing Limbs`,rangeDetail:`None`,abilities:`Passive Traits\nAura of Serenity: Any creature starting its turn within 60ft must pass a Willpower (9) test or lose all hostile intent for 1 turn.\n\nRooted Wisdom: Verdantus is a permanent part of the forest and is immune to being pushed, tripped, or moved against his will.\n\nPhotosynthetic Regrowth: As long as it is daylight or magic light is present, Verdantus regains 10 damage at the start of every turn.\n\nAction-Based Abilities\nWhispers of the Weald (1 Action): Shares a fragment of ancient lore. The target ally gains a +1 bonus to their next three rolls.\n\nEntangling Roots (TN 8 - 2 Actions): Verdantus commands the earth to rise. Target is Grappled (Def 0) and must pass a surpass Physique TN 7 + Resist bonus to break free.\n\nSeismic Slam (3 Actions): Verdantus strikes the ground. All enemies within 20ft must pass an surpass Agility TN 7 + Resist bonus or fall Prone and take 3d10 damage.`},
{name:`Elf: Thalasien Conscript`,size:`Medium`,type:`Humanoid`,tier:`Minion`,tierColor:`#607080`,desc:`Not every resident of the silver-leafed city is an ancient, stoic blademaster. The conscripts are the artisans, poets, and youths—Elves who have barely seen their fiftieth autumn—drafted into the militia when dire threats approach. They possess the natural, weightless grace and sharp eyes of their fey bloodline, but they are fragile and entirely unaccustomed to the brutal realities of war. Armed with simple hunting bows and ceremonial daggers, they fight with desperate, trembling speed rather than cold precision.`,agl:6,awa:5,cha:0,int:1,phy:0,wil:2,move:12,ap:3,def:4,wmArmor:4,wmBS:5,wmDP:5,wounds:15,focus:`0`,reroll:0,luck:0,meleeHit:`+1`,meleeDmg:`+5`,meleeHeal:`0`,rangeHit:`+1`,rangeDmg:`+10`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:``,gear:`Silverwood Hunting Bow, Ceremonial Dagger, Silk Tunic`,meleeDetail:`Ceremonial Dagger`,rangeDetail:`Hunting Bow`,abilities:`Passive Traits\nFey Blood: Despite their lack of training, ancient magic still runs in their veins. They are completely immune to magical sleep.\n\nFleet-Footed Panic: Their natural instinct when hurt is to run. If the Conscript takes any Wounds during a round, they instantly gain a free, out-of-turn Reaction to move up to 15 feet directly away from the source of the damage, ignoring Difficult Terrain.\n\nUnconditioned Frame: Because their Physical stat is exactly 0, they struggle to absorb heavy kinetic impacts. If a Conscript is hit by a Melee attack that deals Bludgeoning Damage (like a hammer or club), they automatically fail any test to remain standing and are knocked Prone.\n\nAction-Based Abilities\nTrembling Strike (Cost: 1 Action): A desperate, wild slash with a short blade. Make a Melee attack (+1 To-Hit). If successful, it deals 1d10 + 5 Slashing Damage.\n\nHunting Volley (Cost: 1 Action): The Elf nocks an arrow and fires at the closest threat. Make a Ranged attack (+1 To-Hit) against a target up to 60 feet away. If successful, it deals 1d10 + 10 Piercing Damage.\n\nDesperate Evasion (Cost: 1 Action): The Conscript focuses entirely on survival, ducking and weaving. Until the start of their next turn, their Defense is increased to a 6, but they cannot make free attacks of opportunity while cowering.`},
{name:`Elf: Thalasien Elite Guard`,size:`Medium`,type:`Humanoid`,tier:`Minion`,tierColor:`#607080`,desc:`Hailing from the pristine, silver-leafed city of Thalasien, these elite guards are the pinnacle of martial grace. Clad in lightweight, gilded armor that moves like silk, they wield curved glaives and longbows with terrifying, cold precision. They don't block; they deflect. They don't march; they glide. They are stoic and utterly silent on duty, communicating through subtle hand signs. To face a Thalasien Elite Guard is to fight the wind itself—sharp, sudden, and seemingly untouchable.`,agl:9,awa:8,cha:1,int:5,phy:2,wil:6,move:12,ap:3,def:7,wmArmor:10,wmBS:15,wmDP:10,wounds:30,focus:`0`,reroll:2,luck:1,meleeHit:`+3`,meleeDmg:`+15(2H)`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+12`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-4`,gear:`Thalasien Curved Glaive, Silverwood Longbow, Gilded Leaf-Armor`,meleeDetail:`Thalasien Glaive.`,rangeDetail:`Silverwood Longbow`,abilities:`Passive Traits\nUnearthly Grace: The Elf is a master of their environment. They completely ignore all Movement penalties from Difficult Terrain. Furthermore, any time they are subjected to an surpass Agility TN 7 + Resist bonus to avoid a trap or an area-of-effect spell (like a Fireball), they automatically take 0 damage on a success, rather than half.\n\nPerfect Parry: The Elf uses their enemy's momentum against them. If an attacker targets the Elf with a Melee attack and misses their 7 Defense, the Elf can immediately use a Reaction to take a free 5-foot step in any direction without triggering attacks of opportunity.\n\nFey Trance: Decades of mental discipline make their minds an impenetrable fortress. They are completely immune to magical sleep, and any attempt to inflict the Charmed or Taunted conditions on them automatically fails.\n\nAction-Based Abilities\nFlurry of Leaves (Melee Cost: 2 Actions): A blindingly fast combination of strikes. Make a Melee attack (+3 To-Hit). If successful, it deals 1d10 + 15 Slashing Damage, and the Elf may immediately make a free Ranged attack (+3 To-Hit) with a throwing dagger against a secondary target within 15 feet for 10 damage.\n\nSilverwood Volley (Range Cost: 2 Actions): The Elf draws and fires two arrows in the blink of an eye. Make two Ranged attacks (+3 To-Hit) against the same or different targets within 80 feet. Each successful hit deals 1d10 + 12 Piercing Damage.\n\nFluid Posture (Cost: 1 Action): The Elf shifts into a purely defensive, evasive kata. Until the start of their next turn, their Defense becomes an 8, and all Ranged attacks made against them suffer Disadvantage as they blur out of the way of projectiles.`},
{name:`Essence Scryer`,size:`Medium`,type:`Monster`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Scryer is not made of flesh. It is a series of interlocking, moving crystalline plates that form a shifting sphere about the size of a human torso.\n\nThe Material: The crystal isn't clear; it is an oily, iridescent black, like polished obsidian that refracts light in an unnatural way (chromatic aberration).\n\nThe "Eye": In the very center of the sphere, where the plates don't quite meet, is a perfect vacuum. Suspended within that void is a core of swirling, cyan-white energy. This is not a biological pupil; it is a stabilized arcane singularity. It doesn't look at you; it stares through you.\n\nThe Scryer is Hovering. It ignores difficult terrain (rubble, water, pits) and can maintain an altitude of up to 30 ft.`,agl:14,awa:12,cha:1,int:9,phy:2,wil:8,move:13,ap:4,def:13,wmArmor:2,wmBS:15,wmDP:10,wounds:50,focus:`+1/3`,reroll:1,luck:1,meleeHit:`0`,meleeDmg:`0`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+35`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-3`,gear:`None`,meleeDetail:`None`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nUnblinking Awareness: The Scryer has 360-degree vision. It cannot be flanked, and any Stealth checks made within 50Ft of the Scryer suffer a -5 penalty.\n\nPhase Blink: Once per turn, if a melee attack misses the Scryer, it may immediately teleport up to 15Ft in any direction as a free reaction.\n\nLogical Superiority: The Scryer’s attacks ignore all non-magical Damage Mitigation (Armor). It strikes at the "essence," not the plate.\n\nActions\nGaze of Dissolution (2 Actions): Type: Ranged Attack (Range: 60Ft). Effect: d10 + range wound bonus. If the target has a magical item, the damage is increased by +5 as the beam "feeds" on the item’s energy.\n\nReality Anchor (2 Actions):Type: Debuff / Crowd Control. Contested Willpower check. Effect: On a success, the target is "Anchored." Their Agility is treated as 1 for the next turn, and they cannot take any Movement actions.\n\nShatter Perception (4 Actions - Full Turn): Type: Area of Effect (25Ft Burst). Effect: Every creature in the burst takes 20 Mental Damage and must spend 1 extra Action for every move they make during their next turn (e.g., your Fighter’s sword swing would cost 3 Actions instead of 2).`},
{name:`Fey Nymph: The Grove-Warden`,size:`Medium`,type:`Fey / Spirit`,tier:`Minion`,tierColor:`#607080`,desc:`Hauntingly beautiful spirits bound to sacred pools, ancient glades, or deep forest springs. To look upon a Nymph is to feel a sudden, aching despair mixed with overwhelming devotion. They wear gowns of woven starlight, spun water, or autumn leaves, their forms possessing an unearthly, flawless grace. They are fiercely protective of their domain and view mortal trespassers as crude, destructive beasts. A Nymph does not fight with brute force; she fights with blinding beauty, elemental magic, and treacherous charms that turn a tightly-knit adventuring party against each other in seconds.\n\nElemental Wrath & Fey Charm`,agl:7,awa:6,cha:9,int:5,phy:1,wil:8,move:20,ap:3,def:4,wmArmor:0,wmBS:30,wmDP:`Immune`,wounds:30,focus:`+1/3`,reroll:2,luck:2,meleeHit:`0`,meleeDmg:`0`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+25`,castHeal:`0`,castType:`Druidism`,fear:``,mob:``,gear:`None`,meleeDetail:`None`,rangeDetail:`None`,abilities:`Passive Traits\nUnearthly Grace (Sanctuary): The Nymph’s beauty is a weapon. Any enemy that attempts to target the Nymph with an attack or hostile spell must first pass a severe Willpower(8) test. On a failure, they are overcome by her beauty, their attack is completely canceled (wasting the Action), and they cannot target her until the start of their next turn.\n\nOne with the Grove: The Nymph can step through a living tree or a pool of water and instantly emerge from another tree or pool within 60 feet without spending an Action (once per turn). She completely ignores all natural Difficult Terrain.\n\nAura of Awe: The air around the Nymph is thick with fey magic. Any enemy that begins their turn within 30 feet of the Nymph must surpass Charisma TN 9 + Resist bonus or gain Disadvantage on all attacks for the round, their hands shaking with the desire to protect her rather than harm her.\n\nAction-Based Abilities\nBlinding Beauty (Cost: 2 Actions): The Nymph drops her magical veil, revealing the true, unfiltered magnitude of her fey nature. All enemies within a 40-foot radius that can see her must pass a severe Willpower(11) test. On a failure, they take 25 Psychic/Radiant Damage and are permanently Blinded until magically cured, their mortal eyes burned out by her perfection.\n\nFey-Kissed Devotion(TN8) (Cost: 1 Action): She whispers a command wrapped in enchanting magic. Target one enemy within 60 feet. Make a Casting attack (+4 To-Hit). If successful, the target is Charmed. On their next turn, the Charmed target MUST use their Actions to move toward and attack their closest ally, shouting about how they must protect the Grove-Warden. A Willpower(12) test is allowed to resist the spell effects.\n\nGrasping Roots (Cost: 1 Action): The Nymph commands the earth to defend her. Target up to two enemies within 40 feet. They must surpass Agility TN 8 + Resist bonus or take 15 Bludgeoning Damage and become Restrained as thick, thorny vines erupt from the soil to pin them in place.`},
{name:`Fimir Witch Queen: The Meargh`,size:`Large`,type:`Humanoid / Spellcaster`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`Standing nearly 8 feet tall when fully upright, the Witch Queen is a haunting figure of bog-born majesty. Unlike the bald warriors of her clan, she is unique for the long, lank hair that hangs from her scalp like rotting willow strands. Her skin is a pale, sickly olive, stretched over a barrel-chested frame that possesses immense hidden strength. Her most striking feature is a single, oversized milk-white eye that glows with an inner, baleful light. She rarely carries a traditional weapon, instead clutching a gnarled staff of petrified bog-wood adorned with human fingerbones and "power of 3" resonance stones. Surrounded by a clinging, sentient mist that moves at her command, she appears more like a ghost than a physical creature.`,agl:1,awa:7,cha:2,int:8,phy:5,wil:9,move:12,ap:4,def:6,wmArmor:9,wmBS:20,wmDP:`Immune`,wounds:50,focus:`+2/6`,reroll:2,luck:1,meleeHit:`+3`,meleeDmg:`+7/+15(2H)`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`+6`,rangeHeal:`0`,castHit:`+5`,castDmg:`+35`,castHeal:`+6`,castType:`Shaman`,fear:`5`,mob:`1`,gear:`Gnarled Staff of Petrified Bog-Wood, Resonance Stones`,meleeDetail:`Petrified Bog-Wood Staff`,rangeDetail:`Hexes & Miasma`,abilities:`Passive Traits\nSentient Shroud: The Witch Queen is constantly enveloped in a clinging, living mist. All Ranged physical attacks made against her suffer Disadvantage. Furthermore, any enemy that begins their turn adjacent to the Meargh takes 5 Cold Damage as the mist actively tries to freeze their lungs.\n\nPower of Three (Resonance): The Fimir are bound to the sacred number three. At the start of the Witch Queen's turn, she generates 1 "Resonance Point" (up to a maximum of 3). She can spend these points to empower her Relics or her spells.\n\nBaleful Milk-White Eye: The Meargh's oversized eye grants her absolute True Sight up to 60 feet. She automatically succeeds on tests to see through illusions, invisibility, and magical obscuration.\n\nAction-Based Abilities\nBog-Wood Smite (Melee Cost: 2 Actions): She swings her gnarled, bone-adorned staff with immense hidden strength. Make a Melee attack (+3 To-Hit). If successful, it deals 1d10 + 15 Bludgeoning Damage, and she instantly generates 1 additional Resonance Point from the kinetic impact.\n\nCurse of the Drowning Lung(TN9) (Cost: 2 Actions): The Witch Queen locks her baleful eye onto a target and fills their lungs with swamp water. Make a Casting attack (+5 To-Hit) against a target within 40 feet. On a hit, it deals 1d10 + 35 Magic/Cold Damage, and the target is Silenced for 1 round. (Spend 3 Resonance: This spell hits up to 3 different targets simultaneously).\n\nCommand the Mist (Cost: 1 Action): The Meargh directs her sentient fog to violently reposition an enemy. Target one creature within 30 feet. They must surpass Physique TN 8 + Resist bonus or be physically dragged 15 feet in any direction by the living fog, potentially into hazardous terrain or the waiting clubs of her Fen-Ghul warriors.`},
{name:`Fimir: The Bog-Grunt`,size:`Medium`,type:`Humanoid / Monstrosity`,tier:`Minion`,tierColor:`#607080`,desc:`The younger, less magically developed kin of the Fen-Ghuls. They are still massive, hunchbacked brutes with saurian tails, but they lack the deep, primal connection to The Mists. Unable to conjure thick fog banks themselves, they instead lurk in naturally occurring swamp miasma or follow in the wake of a Fen-Ghul's conjured storms. Armed with crude driftwood clubs and their own heavy tails, they are simple-minded, aggressive shock-troops. Their jaundiced skin constantly weeps a slippery, toxic bile, making them incredibly difficult to pin down in a melee brawl.`,agl:0,awa:1,cha:-1,int:0,phy:6,wil:4,move:10,ap:3,def:5,wmArmor:8,wmBS:5,wmDP:`Immune`,wounds:24,focus:`0`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+6/+12(2H)`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`1`,mob:`2-10`,gear:`Heavy Driftwood Club`,meleeDetail:`Driftwood Club & Tail`,rangeDetail:`None`,abilities:`Passive Traits\nSlippery Bile: The constant excretion of toxic slime makes them nearly impossible to hold. The Bog-Grunt is completely immune to the Grappled and Restrained conditions from physical sources (like nets or wrestling). Any player who attempts an unarmed strike against the Grunt takes 2 Poison Damage from the skin contact.\n\nSwamp-Tread: They are perfectly adapted to their miserable homes. They completely ignore Movement penalties from mud, deep water, and swamp-based Difficult Terrain.\n\nMist-Parasite: While they cannot conjure the magical fog, they thrive in it. If a Bog-Grunt is standing within the Conjured Fog Bank of an allied Fen-Ghul (or natural heavy fog), they automatically gain Advantage on Willpower tests to resist Fear or Intimidation, emboldened by the concealment.\n\nAction-Based Abilities\nCrude Bash (Melee Cost: 2 Actions): A heavy, overhead swing with a driftwood club or a sweeping tail strike. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 12 Bludgeoning Damage.\n\nYellow Phlegm (Range Cost: 1 Action): The Grunt snorts and spits a concentrated glob of bile. Make a Ranged attack against a target within 15 feet. On a hit, it deals 5 Poison Damage and the target must surpass Physique TN 5 + Resist bonus or gain the Blinded condition for 1 round as the slime burns their eyes.\n\nLumbering Charge (Cost: 2 Actions): The Grunt lowers its head and barrels forward. It moves up to 20 feet in a straight line and immediately makes a Melee attack (+2 To-Hit). If this attack hits, it deals 1d10 + 15 Bludgeoning Damage and the target is knocked Prone.`},
{name:`Fimir: The Fen-Ghul`,size:`Medium`,type:`Humanoid / Monstrosity`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A massive, hunchbacked humanoid with a singular, baleful eye and a thick, saurian tail ending in a heavy bone club. Their skin is a sickly, jaundiced yellow or mossy green, always slick with a layer of toxic bile. Lacking noses, they possess a slit-like maw that exhales a constant, freezing yellow mist. Biologically tied to The Mists, they are rarely seen in direct sunlight, choosing instead to travel within magical fog banks they conjure themselves. To encounter a Fimir is to first lose your sense of direction, hear the wet thwump of a tail-club, and finally see a single, glowing eye peering through the haze just before the end.`,agl:3,awa:6,cha:1,int:5,phy:9,wil:8,move:12,ap:3,def:7,wmArmor:10,wmBS:8,wmDP:`Immune`,wounds:45,focus:`0`,reroll:1,luck:0,meleeHit:`+4`,meleeDmg:`+15/+25(2H)`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+15`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`Shaman`,fear:`4`,mob:`1-6`,gear:`Rusted Swamp-Blade (Optional), Bone Tail-Club`,meleeDetail:`Bone Tail-Club, Rusted Swamp-Blade(+25/2H)`,rangeDetail:`Throwing Weapon`,abilities:`Passive Traits\nConjured Fog Bank: The Fimir is constantly surrounded by a 30-foot radius of thick, magical yellow fog. This area is considered Heavily Obscured (Total Concealment) to all non-Fimir, imposing Disadvantage on all Ranged attacks fired into or through the fog. The fog moves with the Fimir and extinguishes normal torches.\n\nToxic Bile Slick: The creature's skin is a weapon. Any enemy that attempts to Grapple the Fimir, or successfully hits it with an unarmed strike, automatically takes 5 Poison Damage and gains 1 Poisoned condition. Furthermore, the Fimir automatically succeeds on checks to escape grapples or nets.\n\nBaleful Cyclops Eye: The Fimir's singular eye is adapted to The Mists. It completely ignores all visual penalties caused by fog, smoke, dim light, or magical darkness, allowing it to see its prey perfectly while remaining totally hidden.\n\nAction-Based Abilities\nTail-Club Thwump (Cost: 1 Action): The Fimir spins, bringing its heavy saurian tail around in a brutal arc. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 15 Bludgeoning Damage. The target must surpass Physique TN 8 + Resist bonus or be violently knocked Prone into the swamp water.\n\nFreezing Yellow Exhalation (Range Cost: 2 Actions): The Fimir opens its slit-like maw, exhaling a concentrated blast of its toxic mist. Make a Ranged attack (+2 To-Hit) against a 15-foot cone. On a hit, targets take 2d10 + 15 Cold/Poison Damage, and their Movement is reduced by half on their next turn as the freezing bile seizes their joints.\n\nMist-Gilde Ambush (Cost: 1 Action): The Fimir weaponizes its environment. As long as it is within its Conjured Fog Bank, it can move up to 20 feet completely silently, ignoring Difficult Terrain and never triggering attacks of opportunity.`},
{name:`Fire Giant: The Forge-Father`,size:`Giant`,type:`Giant / Elemental`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A massive humanoid standing 18 to 20 feet tall, with skin the color of cooled basalt and hair that glows like smoldering embers. Their bodies are built like heavy-duty anvils—broad, dense, and seemingly immovable. They are almost never seen without their "Singe-Plate" armor, massive slabs of black iron bolted directly into their flesh or held by thick, heat-resistant chains. They live in the hearts of volcanoes, crafting weapons for gods and titans. In battle, they move with a heavy, rhythmic deliberation. They don't rush; they advance like a wall of lava, wielding weapons so hot they can slice through stone walls as if they were warm wax.`,agl:2,awa:8,cha:5,int:7,phy:15,wil:8,move:27,ap:3,def:9,wmArmor:30,wmBS:20,wmDP:`Immune`,wounds:420,focus:`+2/6`,reroll:2,luck:1,meleeHit:`+6`,meleeDmg:`+40/+70`,meleeHeal:`0`,rangeHit:`+4`,rangeDmg:`+60`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`6`,mob:`1-2`,gear:`Singe-Plate Armor, Magma-Forged Greatsword or Cinder-Maul`,meleeDetail:`Magma-Forged Weapon`,rangeDetail:`Hurling chunks of molten slag`,abilities:`Passive Traits\nSinge-Plate Integration: The giant's armor is bolted into its flesh, making it impossible to disarm or sunder. Any melee attacker who successfully hits the Fire Giant with a non-reach weapon takes 10 Fire Damage instantly from the radiating heat of the black iron plates.\n\nMaster Smith's Edge: The Forge-Father's weapons cut through stone like warm wax. All of the Fire Giant's Melee attacks completely ignore the first 5 points of a target's Armor Mitigation and deal double damage to environmental cover, shields, and structures.\n\nWall of Lava: The giant is built like a heavy-duty anvil. It is completely immune to the Knockback, Prone, and Grappled conditions from any creature smaller than Giant size, and it ignores all Difficult Terrain caused by rubble, fire, or magma.\n\nAction-Based Abilities\nCinder-Maul Strike (Melee Cost: 1 Action): A brutal, calculated overhead swing. Make a Melee attack (+6 To-Hit) with a 15-foot reach. If successful, it deals 1d10 + 40 Bludgeoning/Fire Damage, and the target's armor (if non-magical) loses 10 Damage Mitigation for the rest of the encounter as it melts and buckles.\n\nSlag Cleave (Melee Cost: 3 Actions): The Giant sweeps its Magma-Forged Greatsword in a massive horizontal arc. Make a Melee attack (+6 To-Hit) against up to three adjacent targets within its reach. On a hit, it deals 1d10 + 70 Slashing/Fire Damage and applies 2 Burning conditions to each struck target.\n\nEruption Stomp (Cost: 1 Action): The Giant brings its massive, iron-shod boot down with the force of a tectonic shift. All enemies within 30 feet must surpass Agility TN 12 + Resist bonus or be knocked Prone and take 20 Bludgeoning Damage from the resulting localized earthquake.`},
{name:`Fire Snake: The Ember-Viper`,size:`Large`,type:`Elemental / Beast`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`An Ember-Viper looks like a river of liquid gold given form and hunger. Its scales are interlocking plates of cooling obsidian that glow with a fierce, internal orange light. Instead of a rattle, its tail ends in a cluster of porous volcanic stones that hiss and spark, filling the air with a sulfurous haze. They don't leave footprints—they leave scorch marks. They can "melt" into pools of lava or hide within the smoke of a campfire, waiting for the perfect moment to strike. When they do, they wrap their molten bodies around their prey, turning their victim’s own armor into a pressurized oven.`,agl:9,awa:6,cha:1,int:2,phy:8,wil:5,move:20,ap:3,def:7,wmArmor:15,wmBS:10,wmDP:`Immune`,wounds:75,focus:`+1/3`,reroll:1,luck:0,meleeHit:`+4`,meleeDmg:`+30`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-3`,gear:`None`,meleeDetail:`Obsidian Fangs & Molten Coils`,rangeDetail:`None`,abilities:`Passive Traits\nSmoke & Magma Camouflage: The Ember-Viper can "melt" into its surroundings. While within smoke, fire, or lava, the Viper is considered Invisible. Furthermore, it leaves no tracks other than scorch marks, completely ignoring Movement penalties for rocky or volcanic Difficult Terrain.\n\nThe Pressurized Oven: The Viper turns a target's defense into a death trap. Any enemy that is currently Grappled by the Ember-Viper automatically takes 15 Fire Damage at the start of their turn. If the target is wearing medium or heavy metal armor, this damage ignores Damage Mitigation as the armor itself cooks them alive.\n\nSulfurous Rattle: The porous volcanic stones on its tail constantly hiss and spark. The area within 10 feet of the Viper is filled with a choking, sulfurous haze. Any enemy starting their turn in this aura must surpass Physique TN 6 + Resist bonus or become Fatigued from the toxic fumes.\n\nAction-Based Abilities\nObsidian Strike (Melee Cost: 1 Action): The snake lunges with fangs of superheated glass. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 30 Piercing/Fire Damage, and the target's Damage Mitigation from armor is temporarily reduced by 3 for the rest of the encounter as the metal warps.\n\nMolten Coil (Melee Cost: 2 Actions): The Viper attempts to wrap its liquid-gold body around its prey. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 20 Bludgeoning Damage, and the target is instantly Grappled and Restrained, subjecting them to The Pressurized Oven passive on their next turn. Make a physique vs surpass physique TN 7 + Resist bonus on the next turn in an attempt to break free.\n\nCinder Spray (Cost: 1 Action): The Viper violently whips its tail, scattering the hissing volcanic stones. All enemies in a 15-foot cone must surpass Agility TN 8 + Resist bonus or take 15 Fire Damage and be Blinded for 1 round by the sparking ash.`},
{name:`Flesh Golem: The Galvanized Horror`,size:`Large`,type:`Construct`,tier:`Elite`,tierColor:`#b45309`,desc:`A grotesque masterpiece of mismatched anatomy, the Flesh Golem is a mountain of stitched-together muscle and bone. Standing eight feet tall and nearly four feet wide, its skin is a patchwork of pale, grey, and sallow tones held together by thick black surgical thread and rusted iron rivets. Copper rods protrude from its neck and spine, acting as conductors for the lightning that serves as its soul. It smells of formaldehyde and ozone, its every movement accompanied by the audible groaning of over-strained muscle. It is not raised; it is assembled and galvanized.`,agl:5,awa:7,cha:1,int:2,phy:9,wil:8,move:14,ap:3,def:6,wmArmor:10,wmBS:15,wmDP:`Immune`,wounds:100,focus:`0`,reroll:1,luck:0,meleeHit:`+4`,meleeDmg:`+30`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`6`,mob:`1-2`,gear:`None`,meleeDetail:`Hammer-like Fists`,rangeDetail:`None`,abilities:`Passive Traits\nGalvanized Absorption: Lightning is its lifeblood. The Flesh Golem is completely immune to Lightning damage. Whenever it is hit by a Lightning attack, it instead heals 15 damage and instantly gains +1 Action on its next turn as the copper rods surge with energy.\n\nFormaldehyde Stench: The golem is saturated in preserving chemicals. Any living creature that starts its turn adjacent to the Golem must surpass Physique TN 8 + Resist bonus or gain the Nauseated condition (Disadvantage on all rolls) for 1 round.\n\nBerserk Fracture: If the Golem takes Fire damage or its Wounds drops below 30%, the binding energy becomes unstable. The Golem must surpass Willpower TN 11 + Resist bonus or enter a Berserk state, attacking the nearest living creature with Advantage on all Melee attacks but losing its ability to distinguish friend from foe.\n\nAction-Based Abilities\nOverstrained Slam (Melee Cost: 1 Action): The Golem brings its massive, stitched fists down with a sickening groan of muscle. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 30 Bludgeoning Damage and the target must pass a severe surpass Physique TN 7 + Resist bonus or be knocked Prone.\n\nCopper-Rod Discharge (Cost: 2 Actions): The Golem vents excess electrical energy through its rivets. All enemies within a 10-foot radius must make an Agility(9) test. On a failure, they take 20 Lightning Damage and are Stunned (Movement reduced to 0 and cannot take Reactions) until the start of their next turn.\n\nStitched Grip & Crush (Melee Cost: 1 Action): The Golem grabs a target with its trunk-like arms. Make a Melee attack (+4 To-Hit). On a hit, the target is Grappled and Restrained. The Golem can use its next Action to deal an automatic 30 Bludgeoning Damage to the grabbed target as it crushes their ribs.`},
{name:`Frost Giant: The Ice-Raider`,size:`Giant`,type:`Giant / Elemental`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Towering at 22 feet, the Frost Giant is a hulking monolith of glacial ice and corded, pale muscle. Draped in the heavy pelts of slain megafauna and wearing armor crafted from unmelting, diamond-hard permafrost, they emerge from the blizzards like walking avalanches. Their eyes are solid, pupilless orbs of pale blue, and their breath spills from their lungs as a thick, freezing fog. They view the world as a battlefield where only the "Hardened" survive. A blizzard is not a storm to be feared, but a cloak to be worn. Masters of the "Glacial Siege," they use their incredible strength to trigger avalanches or hurl boulders coated in permafrost that shatter like shrapnel upon impact.`,agl:4,awa:5,cha:2,int:7,phy:15,wil:9,move:27,ap:3,def:8,wmArmor:25,wmBS:20,wmDP:`Immune`,wounds:400,focus:`+1/3`,reroll:2,luck:1,meleeHit:`+6`,meleeDmg:`+50`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+40`,rangeHeal:`0`,castHit:``,castDmg:``,castHeal:``,castType:`None`,fear:`6`,mob:`1-2`,gear:`Megafauna Pelts, Permafrost Armor, True-Ice Greataxe or Mammoth-Bone Club`,meleeDetail:`True-Ice Weapon`,rangeDetail:`Hurling permafrost boulders with siege-engine accuracy`,abilities:`Passive Traits\nCloak of the Blizzard: The Frost Giant uses storms as camouflage. They are completely immune to vision penalties from snow, fog, or blizzards. Furthermore, if the Giant is fighting in a snowy environment, it constantly projects a 30-foot aura of freezing fog that grants it Concealment, imposing Disadvantage on all Ranged attacks directed at it.\n\nAvalanche Stride: The giant walks through mountains as easily as open fields. It completely ignores all Difficult Terrain caused by ice, deep snow, or rubble. Because of its massive footing, it is completely immune to the Prone and Knockback conditions from any creature smaller than Giant size.\n\nDiamond-Hard Permafrost: The ice armor is harder than steel and destroys lesser weapons. If a player strikes the Frost Giant with a non-magical melee weapon and fails to overcome its 25 Armor Mitigation, the weapon takes a permanent -1 penalty to its damage output as the metal becomes brittle and cracks from the supernatural cold.\n\nAction-Based Abilities\nGlacial Cleave (Melee Cost: 1 Action): The Giant swings a massive weapon of true-ice. Make a Melee attack (+6 To-Hit) with a 15-foot reach. If successful, it deals 1d10 + 50 Slashing/Cold Damage.\n\nPermafrost Shrapnel (Range Cost: 2 Actions): The Giant hurls a massive boulder coated in unmelting ice. Make a Ranged attack (+5 To-Hit) against a primary target up to 80 feet away. On a hit, it deals 1d10 + 40 Bludgeoning Damage. Regardless of whether the attack hits or misses the primary target, the boulder shatters on impact into a 15-foot radius burst. All creatures in the burst must surpass Agility TN 11 + Resist bonus or take 30 Piercing/Cold Damage from the flying shrapnel.\n\nBreath of the Megafauna (Cost: 1 Action): The Giant exhales the freezing fog from its lungs in a concentrated 30-foot cone. All enemies caught in the blast must surpass Physique TN 12 + Resist bonus. On a failure, they gain 1 Fatigued condition and have their Movement reduced by half on their next turn due to the biting cold seizing their joints.`},
{name:`Gelatinous Cube: The Dungeon Janitor`,size:`Large`,type:`Ooze / Aberration`,tier:`Elite`,tierColor:`#b45309`,desc:`A 10-foot cube of shimmering, translucent protoplasm. These are mindless organisms that drift silently through dungeon corridors, "cleaning" the floors of organic matter, bones, and discarded gear. Nearly invisible in low light, the only way to spot one is often to notice the floating "leftovers" of its previous meals—swords, coins, and skulls—suspended mid-air within its body. It does not hunt; it simply sweeps, absorbing anything foolish enough to stand in its path.`,agl:5,awa:6,cha:2,int:1,phy:9,wil:8,move:4,ap:3,def:7,wmArmor:25,wmBS:10,wmDP:`Immune`,wounds:90,focus:`0`,reroll:0,luck:0,meleeHit:`+3`,meleeDmg:`+20`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1`,gear:`Random Undigested Loot (1d6 Gold Coins, a rusty dagger, a dwarven skull).`,meleeDetail:`Acidic Pseudopod`,rangeDetail:`None`,abilities:`Passive Traits\nTransparent Ambusher: The Cube is nearly invisible in dim light or darkness. If the Cube has not yet moved or attacked this round, any player entering its line of sight must pass a severe surpass Awareness TN 7 + Resist bonus. On a failure, the player doesn't see the Cube until they physically walk directly into it, automatically suffering the effects of the Engulf ability.\n\nAmorphous Hallway-Blocker: The Cube perfectly fills a standard 10x10 dungeon corridor. It is completely immune to the Prone, Knockback, Flanked, and Bleeding conditions. You cannot move past it or through it without being digested.\n\nAnesthetic Slime: The outer layer of the Cube is coated in a paralyzing numbing agent. Any target that takes Melee damage from the Cube must surpass Physique TN 8 + Resist bonus or have their Movement reduced to 0 on their next turn as their muscles seize.\n\nAction-Based Abilities\nPseudopod Lash (Melee Cost: 1 Action): The Cube extrudes a wobbly tentacle of acid. Make a Melee attack (+3 To-Hit) against an adjacent target. If successful, it deals 1d10 + 20 Acid/Bludgeoning Damage.\n\nEngulf (Cost: 2 Actions): The Cube simply flows forward to occupy an enemy's space. Target one adjacent creature. That creature must make an Agility(9) test. On a failure, they are pulled inside the Cube. An engulfed target is Grappled, Restrained, and Silenced (cannot breathe or cast verbal spells). At the start of the Cube's turn, any engulfed targets automatically take 20 Acid Damage.\n\nDigestive Pulse (Cost: 1 Action): The Cube churns its internal acids. It deals an immediate 15 Acid Damage to any targets currently Engulfed within it.`},
{name:`Ghast (The Bone-Snapper)`,size:`Large`,type:`Undead`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A Ghoul eats because it is hungry. A Ghast eats because it enjoys the sound of bone snapping. Towering over standard ghouls, this Large monstrosity is a cruel, calculated predator with elongated, muscular limbs and an unnaturally wide jaw. It doesn't just skitter; it stalks, watching your formation with wicked intelligence to find the one person who looks tired. It delights in psychological terror just as much as the physical kill, using its explosive leaping ability to bypass armored defenders and land directly on the party's most vulnerable member.`,agl:9,awa:5,cha:1,int:3,phy:6,wil:4,move:17,ap:4,def:7,wmArmor:9,wmBS:10,wmDP:`Immune`,wounds:75,focus:`+1/3`,reroll:0,luck:0,meleeHit:`+3`,meleeDmg:`+20`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`6`,mob:`1-2`,gear:`None`,meleeDetail:`Bone-Snapping Jaws & Rending Claws`,rangeDetail:`None`,abilities:`Passive Traits\nLeaper: The Ghast's leg muscles are coiled springs of necrotic energy. It can jump 20 feet horizontally as part of a Move action. This jump ignores all Difficult Terrain and allows it to pass directly over the heads of enemy frontline defenders without triggering free attacks of opportunity.\n\nStalker of the Tired: The Ghast instinctively targets weakness. It automatically gains Advantage on all Melee To-Hit rolls against targets that currently have the Fatigued, Prone, or Bleeding conditions, or any target below 50% of their maximum Health.\n\nGrave-Stench: The creature exudes a horrific, cloying aura of rot. Any living creature that begins its turn within 10 feet of the Ghast must pass a severe Physique(6) test. On a failure, they spend 1 Action violently retching and gain 1 Poisoned condition.\n\nAction-Based Abilities\nBone-Snapping Bite (Melee Cost: 2 Actions): The Ghast unhinges its jaw to crush a limb. Make a Melee attack (+3 To-Hit). If successful, it deals 1d10 + 20 Piercing/Bludgeoning Damage. The target must pass a severe surpass Physique TN 7 + Resist bonus or suffer a broken bone, reducing their Movement by half until magically healed.\n\nParalyzing Slash (Melee Cost: 1 Action): The Ghast's claws are coated in a specialized, necrotizing venom. Make a Melee attack (+3 To-Hit). If successful, it deals 1d10 + 20 Slashing Damage and the target must surpass Willpower TN 5 + Resist bonus or become Paralyzed (unable to move or take Actions) until the end of their next turn.\n\nSavor the Snap (Cost: 2 Actions): The Ghast targets a Paralyzed or Prone enemy. It automatically hits (no To-Hit roll required) and deals 40 damage. The sickening sound of the execution forces all allies of the target within 30 feet to make a surpass Willpower TN 7 + Resist bonus or gain 1 Shaken condition.`},
{name:`Ghost: The Restless Spirit`,size:`Medium`,type:`Undead / Incorporeal`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A translucent, glowing apparition bound to the mortal plane by unfinished business, sudden trauma, or a terrible curse. They appear as shifting, faded echoes of who they were in life, often bearing the gruesome phantom damage of their demise. They do not walk; they drift silently, bringing an unnatural, bone-deep chill wherever they roam. A Ghost doesn't care about your heavy plate armor or your physical strength—it bypasses the flesh entirely to strike directly at the soul.`,agl:7,awa:6,cha:2,int:5,phy:1,wil:9,move:10,ap:3,def:8,wmArmor:0,wmBS:20,wmDP:`Immune`,wounds:35,focus:`+1/3`,reroll:1,luck:0,meleeHit:`+4`,meleeDmg:`+15`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+10`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`7`,mob:`1-4`,gear:`None`,meleeDetail:`Spectral Touch`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nIncorporeal Form: The Ghost can pass freely through solid objects, walls, and other creatures. It is completely immune to the Grappled, Prone, and Restrained conditions. Furthermore, any non-magical physical attack that successfully hits the Ghost automatically has its total Wounds reduced to 0 (the weapon simply passes through the mist).\n\nLife-Sense: The Ghost does not see with eyes. It tracks the soul. It can perfectly detect living creatures through walls and solid cover up to 60 feet away, and it ignores all visual penalties from magical darkness or smoke.\n\nUnnatural Chill: The ambient temperature plummets in the Ghost's presence. Any living creature that starts its turn within 15 feet of the Ghost loses 1 Focus point and has its Movement reduced by 5 feet as the supernatural frost seeps into their joints.\n\nAction-Based Abilities\nGrave Touch (Melee Cost: 1 Action): The Ghost reaches its translucent hand directly into a target's chest. Make a Melee attack (+4 To-Hit). If successful, it deals 15 Cold/Necrotic Damage. Because this attack targets the soul, it completely ignores the target's Armor Mitigation.\n\nPoltergeist Throw (Range Cost: 1 Action): The Ghost weaponizes its Willpower to violently hurl a loose object (a chair, a rock, a loose weapon). Make a Ranged attack (+3 To-Hit) against a target within 30 feet. On a hit, it deals 1d10 + 10 Bludgeoning or Piercing Damage, depending on the object.\n\nHorrifying Visage (Cost: 2 Actions): The Ghost drops its mundane appearance to reveal the gruesome, terrifying reality of its death. All living enemies within 30 feet that can see the Ghost must pass a severe Willpower(10) test. On a failure, they take 15 Psychic Damage and gain the Shaken condition, forcing them to move away from the Ghost on their next turn.`},
{name:`Ghoul (The Grave-Feaster)`,size:`Medium`,type:`Undead`,tier:`Minion`,tierColor:`#607080`,desc:`A gaunt, wiry humanoid with skin like stretched, grey parchment. They are deceptively strong, their muscles corded and dense from a diet of mineral-rich marrow. Their most terrifying features are elongated, multi-jointed fingers ending in filth-encrusted claws, and a jaw that can unhinge to reveal rows of needle-like teeth. They carry the "Stench of the Pit"—a cloying, sweet smell of decay. Unlike mindless zombies, Ghouls are cunning; they won't charge a line of shields. They linger in the rafters of a tomb or the shadows of a sewer, waiting to paralyze a straggler and drag them into the darkness to be eaten alive.`,agl:6,awa:4,cha:-1,int:1,phy:5,wil:0,move:14,ap:3,def:3,wmArmor:5,wmBS:5,wmDP:`Immune`,wounds:20,focus:`0`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`3`,mob:`4-20`,gear:`None`,meleeDetail:`Filth-Encrusted Claws & Needle-Teeth`,rangeDetail:`None`,abilities:`Passive Traits\nClimber: The Ghoul's elongated fingers allow it to move across walls and ceilings at its full 30 Movement speed without needing to make Agility tests. It can freely hang upside down while making Melee attacks.\n\nStench of the Pit: A cloying, sweet smell of decay precedes them. Any living creature that starts its turn within 10 feet of one or more Ghouls must surpass Physique TN 5 + Resist bonus or suffer Disadvantage on all Awareness and Intelligence tests for the round as the smell induces severe nausea.\n\nCunning Opportunist: The Grave-Feaster knows how to exploit an isolated target. If the Ghoul attacks an enemy that has no conscious allies within 10 feet of them, or an enemy that is Prone or Paralyzed, the Ghoul automatically gains Advantage on its Melee To-Hit rolls.\n\nAction-Based Abilities\nFilth-Encrusted Scratch (Melee Cost: 1 Action): A swipe with bacteria-ridden claws. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 10 Slashing Damage and the target must surpass Physique TN 5 + Resist bonus or become Paralyzed (unable to move or take Actions) until the start of their next turn.\n\nUnhinged Bite (Melee Cost: 1 Action): The Ghoul bites down with rows of needle-like teeth. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 10 Piercing Damage. If the target is Paralyzed, this attack automatically hits (no roll required) and heals the Ghoul for 5 damage as it gorges on the fresh meat.\n\nDrag into the Dark (Cost: 1 Action): The Ghoul grabs a Paralyzed or Prone target and scuttles away. The Ghoul moves up to 15 feet (including up walls or ceilings), physically carrying the target into its space. The target remains in the Ghoul's grasp until they break free.`},
{name:`Giant Ape: The Silverback Titan`,size:`Giant`,type:`Beast / Primordial`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Deep within the uncharted, primordial jungles rules the Silverback Titan. Standing over twenty feet tall when fully upright, this ancient apex predator is fiercely territorial and highly intelligent. Its body is corded with impossibly dense muscle and covered in coarse, iron-grey hair thick enough to turn away arrows. It does not hunt for sport; it hunts to eliminate threats to its domain. The Titan fights with brutal, sweeping strikes that shatter trees and crush armor, using the jungle itself as a weapon by ripping up boulders and trunks to hurl at distant interlopers.`,agl:6,awa:4,cha:2,int:7,phy:15,wil:8,move:`27/20C`,ap:3,def:9,wmArmor:20,wmBS:20,wmDP:20,wounds:380,focus:`+1/3`,reroll:2,luck:0,meleeHit:`+5`,meleeDmg:`+40`,meleeHeal:`0`,rangeHit:`+4`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`6`,mob:`1`,gear:`None`,meleeDetail:`Colossal Fists`,rangeDetail:`Hurled Jungle Debris`,abilities:`Passive Traits\nIron-Grey Pelage: The Titan's thick fur acts as natural armor against projectiles. All non-magical Ranged attacks (arrows, bolts, throwing axes) automatically suffer Disadvantage to wound.\n\nJungle Arsenal: The Titan can weaponize its environment. It can uproot trees or tear chunks of bedrock from the earth without spending an Action. Furthermore, its Ranged attacks deal "Siege Damage," inflicting double damage to environmental structures, walls, or vehicles.\n\nApex Unstoppable: Due to its immense size and strength, the Silverback Titan is completely immune to the Prone, Grappled, and Restrained conditions from any creature smaller than Giant size. It also completely ignores all Movement penalties from jungle or forest Difficult Terrain.\n\nAction-Based Abilities\nTree-Shattering Slam (Melee Cost: 2 Actions): The Titan brings two massive fists crashing down. Make a Melee attack (+5 To-Hit). If successful, it deals 2d10 + 60 Bludgeoning Damage, and the target must surpass Physique TN 12 + Resist bonus or be violently knocked 20 feet backward and rendered Prone.\n\nColossal Hurl (Range Cost: 2 Actions): The Ape rips a massive boulder or tree trunk from the ground and hurls it across the battlefield. Make a Ranged attack (+5 To-Hit) targeting a 15-foot radius area up to 80 feet away. On a hit, all enemies in the zone take 3d10 + 20 Bludgeoning Damage and are pinned under the debris (Movement reduced to 0 until they use an Action to free themselves).\n\nTerritorial Chest-Beat (Cost: 1 Action): The Titan rises to its full 20-foot height, unleashing a deafening, primordial roar while beating its chest. All enemies within 60 feet must surpass Willpower TN 10 + Resist bonus or become Shaken and Deafened for 1 round, suffering a -2 penalty to their Defense due to the sheer terror of the display.`},
{name:`Giant Rat: The Sewer-Scourge`,size:`Large`,type:`Beast / Monstrosity`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A bloated, man-sized rodent that thrives in the darkest, dampest corners of civilization. The Giant Rat possesses coarse, wiry fur matted with sewer filth and blood, and a hairless, whip-like tail thick as a ship's mooring line. Driven by perpetual hunger and malice, their eyes reflect a sickly yellow in the torchlight, and their rusted-iron incisors can gnaw through solid oak and bone alike. The most dangerous aspect of a Giant Rat is its Tainted Blood. Their veins pulse with a black, viscous fluid that is a cocktail of every plague known to the underworld. When wounded, they don't just bleed; they spray a pressurized mist of infection that can rot leather and blister skin on contact.`,agl:9,awa:8,cha:1,int:2,phy:7,wil:5,move:23,ap:3,def:6,wmArmor:7,wmBS:6,wmDP:`Immune`,wounds:55,focus:`0`,reroll:1,luck:1,meleeHit:`+4`,meleeDmg:`+21`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`1`,mob:`2-10`,gear:`None`,meleeDetail:`Rusted-Iron Incisors`,rangeDetail:`None`,abilities:`Passive Traits\nTainted Blood Spray: The rat's circulatory system is a pressurized biological weapon. Any time the Giant Rat takes Slashing or Piercing Damage from a Melee attack, it sprays a mist of black, toxic fluid. The attacker must surpass Agility TN 8 + Resist bonus or take 10 Acid/Poison Damage. If the attacker fails the test, their non-magical armor also loses 1 Damage Mitigation as the acidic blood rots the leather and rusts the iron.\n\nSewer-Skulker: The Scourge is perfectly adapted to its miserable environment. It completely ignores all Movement penalties from water, mud, or sludge, and its yellow eyes grant it perfect vision in total darkness.\n\nVermin Swarm Tactics: The Scourge knows how to overwhelm struggling prey. The Giant Rat automatically gains Advantage on its Melee To-Hit rolls against any target that is adjacent to another conscious Giant Rat, or any target that has the Prone condition.\n\nAction-Based Abilities\nIron-Incisor Bite (Melee Cost: 1 Action): The rat lunges, sinking its rusted-iron teeth into the target. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 21 Piercing Damage. If the target is wearing a shield, the rat can choose to deal 0 damage to the target and instead permanently destroy the shield by gnawing through the wood and metal.\n\nMooring-Line Tail Whip (Melee Cost: 1 Action): The rat spins, sweeping its thick, hairless tail across the ground. Make a Melee attack (+4 To-Hit) against up to two adjacent enemies. On a hit, it deals 15 Bludgeoning Damage and the targets must surpass Physique TN 8 + Resist bonus or be knocked Prone.\n\nRabid Gnaw (Cost: 2 Actions): The rat pins a Prone target and frenzies. It automatically hits (no To-Hit roll required) and deals 30 Piercing/Poison Damage. The target immediately gains 1 Poisoned condition and 1 Bleeding condition from the filthy bites.`},
{name:`Giant Spider: The Grave-Weaver`,size:`Large`,type:`Beast / Monstrosity`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A carriage-sized nightmare of chittering mandibles and bristling, barbed hairs. The Giant Spider dwells in lightless caverns and ancient, overgrown forests, spinning webs strong enough to ensnare a galloping horse. Its eight multifaceted eyes gleam with a cold, predatory intelligence, and venom constantly drips from its jagged, iron-hard fangs. It brings the creeping, visceral horror of the unseen ambush to the battlefield, turning the environment itself into a lethal, sticky snare.`,agl:9,awa:8,cha:1,int:5,phy:7,wil:2,move:16,ap:3,def:6,wmArmor:10,wmBS:9,wmDP:30,wounds:65,focus:`0`,reroll:1,luck:0,meleeHit:`+4`,meleeDmg:`+21`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1-2`,gear:`Random`,meleeDetail:`Iron-Hard Fangs`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nWeb-Sense & Master Climber: The Grave-Weaver ignores all Movement penalties for climbing, allowing it to rest perfectly upside down on ceilings. Furthermore, while in contact with its web, it knows the exact, pinpoint location of any other creature touching the web, completely ignoring magical invisibility or darkness.\n\nBarbed Carapace: The spider is covered in jagged, irritating hairs. Any creature that successfully strikes the spider with an unarmed Melee attack, or attempts to Grapple it, automatically takes 5 Piercing/Poison Damage and must pass a surpass Physique TN 7 + Resist bonus or become Blinded for 1 round by the loose hairs.\n\nAmbush Predator: If the Grave-Weaver attacks a target that has the Restrained, Prone, or Surprised condition, the spider's Melee attacks automatically deal Maximum damage (no rolling for damage) as it accurately strikes the vital organs.\n\nAction-Based Abilities\nIron-Fang Lunge (Melee Cost: 1 Action): The spider sinks its dripping mandibles into its prey. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 21 Piercing/Poison Damage. The target must pass a Physique((8) test or gain the Paralyzed condition for 1 round as the venom locks their muscles.\n\nEnsnaring Grave-Silk (Range Cost: 2 Actions): The spider rears back and sprays a thick, sticky net of silk. Make a Ranged attack (+3 To-Hit) against a target up to 40 feet away. On a hit, the target takes no Wounds but is instantly Restrained and anchored to the floor (Movement becomes 0). The target must use an Action and surpass Physical TN 9 + Resist bonus on their turn to tear the web apart.\n\nHoist the Kill (Cost: 1 Action): The spider grabs a Paralyzed or Restrained target and effortlessly drags them. The spider moves up to its full 24 Movement speed (including straight up a wall or tree), carrying the target into its space to separate them from their allies.`},
{name:`Gnoll: The Flesh-Render`,size:`Medium`,type:`Humanoid / Beastkin`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The standard Gnoll raider — stripped down to the essentials of what makes the pack work. Not the hungriest, not the strongest, not the smartest. The one that showed up, kept showing up, and learned through accumulated survival exactly how much pressure to apply before backing off and letting someone else take the wound. They fight as a pair or a pack. Alone, they test and retreat. In groups of three or more, they stop testing.`,agl:7,awa:6,cha:2,int:2,phy:7,wil:4,move:15,ap:2,def:14,wmArmor:2,wmBS:0,wmDP:0,wounds:35,focus:`+1/3`,reroll:1,luck:0,meleeHit:`+1`,meleeDmg:`+8`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`+8`,rangeHeal:`1d10+12`,castHit:`0`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`None`,mob:`—`,gear:`1`,meleeDetail:`Gnoll Bone-Cleaver, Scraps of hide armor`,rangeDetail:`Gnoll Bone-Cleaver (One-Handed)`,abilities:`Passive Traits\nBlood Scent: Gains Advantage on all tracking and awareness tests against any target currently Bleeding.\n\nPack Tactics: When attacking a target currently engaged by at least one other allied Gnoll, the Flesh-Render gains Advantage on its To-Hit roll. This is not courage — it is arithmetic.\n\nCoward's Threshold: If the Flesh-Render takes damage that drops it below 15 damage and it is not adjacent to at least one allied Gnoll, it immediately uses its Reaction to Disengage and retreats at full movement speed toward the nearest allied Gnoll. It will not voluntarily fight alone.\n\nAction-Based Abilities\nRending Bite (Melee Cost: 1 Action): The Gnoll abandons the weapon for a moment and goes for the throat. Make a Melee attack (+8 To-Hit) for 1d10 + 10 damage. On a hit, the target must surpass Physique TN 7 + Resist bonus or gain 1 Bleeding condition from the jagged bite wound.\n\nHarrying Strike (Melee Cost: 2 Actions): A rapid combination — blade then shoulder then teeth. Make a Melee attack (+8 To-Hit) for 1d10 + 12 damage. On a hit, the target must surpass Agility TN 8 + Resist bonus or be knocked Prone as the Gnoll drives into them low and hard.`},
{name:`Gnoll: The Packmaster`,size:`Medium`,type:`Humanoid / Beastkin`,tier:`Elite`,tierColor:`#b45309`,desc:`The Packmaster did not become the Packmaster by being the strongest Gnoll in the pack. That position goes to the ones who die proving it. The Packmaster survived by being the one smart enough to let the strong ones exhaust themselves, then step into the vacuum with something the dead leader never had: a plan. They are lean, scarred, and permanently calculating — their ears track sound from three directions simultaneously, their eyes are cataloguing the battlefield geometry while their voice is directing the pack. Where the Scavenger operates on hunger, the Packmaster operates on efficiency, and the pack follows because efficiency keeps more of them alive to eat again tomorrow.`,agl:7,awa:9,cha:5,int:6,phy:8,wil:7,move:16,ap:3,def:17,wmArmor:3,wmBS:3,wmDP:2,wounds:110,focus:`+2/6`,reroll:2,luck:0,meleeHit:`+2`,meleeDmg:`+14`,meleeHeal:`0`,rangeHit:`1`,rangeDmg:`+14`,rangeHeal:`1d10+22`,castHit:`0`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`None`,mob:`—`,gear:`1`,meleeDetail:`Serrated Pack-Blade, Bone-Tooth Javelin x3, Territorial Fetish (grants Pack Tactics aura)`,rangeDetail:`Serrated Pack-Blade (One-Handed)`,abilities:`Passive Traits\nBlood Scent: Gains Advantage on all Awareness and Tracking tests against any creature currently Bleeding or below half damage.\n\nPack Commander (Aura 40ft): Allied Gnolls within 40ft gain +2 To-Hit and +1 AP per turn as long as the Packmaster is alive and conscious. The moment the Packmaster falls, all allied Gnolls must surpass Willpower TN 8 + Resist bonus or become Shaken for 2 turns.\n\nTerritorial Memory: The Packmaster knows every exit, choke point, and elevated position in any terrain it has passed through once. It cannot be surprised. It cannot be flanked by conventional means — it already knew you were coming.\n\nSurvivor's Calculus: If the Packmaster would drop to 0 damage, it immediately uses a free Reaction to Disengage and moves its full movement away from the source of the damage. It will not fight to the death unless cornered with no viable escape route. It has survived this long by knowing the difference.\n\nAction-Based Abilities\nCoordinated Strike (Melee Cost: 2 Actions): The Packmaster signals and strikes simultaneously. Make a Melee attack (+14 To-Hit). On a hit, deal 1d10 + 22 damage. Additionally, choose one allied Gnoll within 30ft — it may immediately make a free Melee attack against the same target as a Reaction, regardless of its current AP.\n\nRun the Flanks (Cost: 1 Action): The Packmaster issues a rapid tactical command. Up to 3 allied Gnolls within 40ft may immediately move up to half their movement speed as a Reaction. This movement does not cost them AP.\n\nPriority Cull (Ranged Cost: 2 Actions): The Packmaster hurls a bone javelin at the most dangerous target on the field — specifically the target with the highest current Wounds or most recently cast a spell. Make a Ranged attack (+12 To-Hit) for 1d10 + 12 damage. On a hit, the target must surpass Physique TN 9 + Resist bonus or gain 1 Bleeding condition — the javelin is serrated specifically for this purpose.`},
{name:`Gnoll: The Scavenger of the Wastes`,size:`Medium`,type:`Humanoid (Beastkin)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A bipedal nightmare with the unsettling features of a hyena, the Wasteland Gnoll stands roughly the height of an average human. They are wiry, heavily muscled scavengers clad in patchwork armor stitched from rusted steel and cured hides. Operating in ruthless, giggling packs, they do not fight for honor or territory; they fight because the scent of blood demands it. They are brutal frontline raiders, notorious for running down exhausted prey and leaving nothing but splintered bone in their wake.`,agl:9,awa:8,cha:1,int:2,phy:7,wil:5,move:14,ap:3,def:6,wmArmor:5,wmBS:5,wmDP:15,wounds:35,focus:`0`,reroll:1,luck:0,meleeHit:`+4`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+15/+12`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:``,gear:`Scavenged Rusted Cleaver, Patchwork Hide Armor`,meleeDetail:`Rusted Cleaver.`,rangeDetail:`Javelin or Short Bow`,abilities:`Passive Traits\nBlood Scent: The Gnoll gains an immediate Advantage on Awareness tests when tracking or locating any creature that currently has the Bleeding condition or is below its maximum Wound Threshold.\n\nPack Tactics: When attacking a target currently engaged by at least one other allied creature, the Gnoll automatically gains +3 damage to successful Melee strikes sensing an easy kill.\n\nCarrion Gut: The creature’s physiology is adapted to the wastes. It is completely immune to the Poisoned condition if the source is ingested, and immune to all non-magical Diseases.\n\nAction-Based Abilities\nScavenger's Cleave (Cost: 1 Action): The Gnoll hacks wildly with its rusted weapon. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 11 Slashing Damage. If the Gnoll scores a Critical Hit, the target gains 1 Bleeding condition.\n\nSavage Bite (Melee Cost: 2 Actions): The Gnoll lunges with snapping jaws. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 15 Piercing Damage. This attack ignores up to 3 points of the target's DM-Arm (Armor Mitigation) if the target is Grappled or Prone.\n\nUnnerving Cackle (Cost: 1 Action): The Gnoll unleashes a manic, echoing laugh that unsettles the soul. All enemies within 30 feet must surpass Willpower TN 6 + Resist bonus. On a failure, they gain the Stunned condition until the end of their next turn, overwhelmed by the disorienting noise.`},
{name:`Goblin Shaman: The Cave-Whisperer`,size:`Small`,type:`Humanoid / Spellcaster`,tier:`Minion`,tierColor:`#607080`,desc:`The Cave Goblin Shaman is the dark, pulsating heart of the subterranean swarm. While standard goblins are driven by hunger and malice, the Shaman is guided by the whispers of ancient, restless cave spirits. Physically weak and frail, they rely entirely on their terrifying mental fortitude and deep connection to the metaphysical realm to dominate their tribe. Draped in bone charms that act as magical focal points, the air around them permanently smells of copper and ozone. When threatened, they vanish into a cloud of toxic green mist, reappearing across the cavern only to summon blood-drenched totems that drive their lesser kin into a frenzied, unkillable state.`,agl:2,awa:4,cha:-1,int:5,phy:0,wil:6,move:12,ap:3,def:5,wmArmor:3,wmBS:12,wmDP:`Immune`,wounds:20,focus:`+1/3`,reroll:2,luck:1,meleeHit:`+1`,meleeDmg:`+6`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+18`,castHeal:`+9`,castType:`Shaman`,fear:``,mob:`1-2`,gear:`Ancestral Bone Charms, Ritual Dagger`,meleeDetail:`Bone Staff (2H) `,rangeDetail:`Spiritual Venom`,abilities:`Passive Traits\nOzone Aura: The air around the Shaman crackles with volatile magic. Any enemy that successfully strikes the Shaman with a Melee attack automatically takes 5 Lightning Damage from the static backlash.\n\nHeart of the Swarm: As long as the Shaman is conscious and on the battlefield, all allied Goblins within 60 feet are completely immune to the Shaken and Charmed conditions.\n\nFrail but Guarded: The Shaman uses its metaphysical connection to protect its fragile body. The Shaman may use its Willpower stat (6) in place of its Physical stat (0) when making tests to resist being knocked Prone, Grappled, or Poisoned.\n\nAction-Based Abilities\nSpiritual Venom(TN6) (Casting Cost: 1 Action): The Shaman channels the malice of the cave spirits into a concentrated bolt of green energy. Make a Casting attack (+4 To-Hit) against a target within 40 feet. On a hit, it deals 1d10 + 185 Necrotic/Poison Damage, and the target must surpass Willpower TN 9 + Resist bonus or gain 1 Poisoned condition as the venom attacks their soul.\n\nBlood-Drenched Totem(TN10)(Casting Cost: 2 Actions): The Shaman hurls a cluster of bone charms that embed into the ground, creating a Blood-Totem with 10 damage. While the Totem is active, any allied Goblin within 30 feet of it gains the Frenzied condition (Advantage on all Melee attacks) and cannot be reduced below 1 damage. The players must physically destroy the Totem to break the unkillable state.\n\nToxic Mist Step (Cost: 1 Action): When threatened, the Shaman vanishes. The Shaman instantly teleports up to 30 feet to an unoccupied space it can see. The space the Shaman left behind is filled with a 10-foot cloud of toxic green mist for 1 round; any enemy entering or starting their turn in the mist takes 10 Poison Damage.`},
