<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thrice-Marked — Bestiary</title>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════ TOKENS */
:root {
  --blood:   #8B1010;
  --blood2:  #b01818;
  --gold:    #8a6a1a;
  --gold2:   #c9a030;
  --ink:     #0e0a04;
  --parch:   #faf3e0;
  --parch2:  #f0e4c0;
  --parch3:  #ddc898;
  --iron:    #1a1208;
  --iron2:   #2a1e10;
  --purple:  #3D1A6E;
  --minion:     #607080;
  --skirmisher: #a16207;
  --elite:      #b45309;
  --boss:       #b91c1c;
  --legendary:  #7c3aed;
  --f-head: 'Grenze Gotisch', serif;
  --f-body: 'IM Fell English', serif;
  --f-label:'Cinzel', serif;
  --f-deco: 'Cinzel Decorative', serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--f-body);background:#1a1208;color:var(--ink);font-size:14.0pt;line-height:1.55;display:flex;flex-direction:column;}

/* ══════════════════════════════════════════════ HEADER */
.site-header{background:var(--iron);border-bottom:3px solid var(--gold);padding:0 20px;display:flex;align-items:center;gap:16px;height:54px;flex-shrink:0;position:relative;}
.site-header::after{content:'';position:absolute;bottom:-6px;left:0;right:0;height:3px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--blood),transparent);}
.site-title{font-family:var(--f-deco);font-size:14.0pt;color:var(--gold2);letter-spacing:2px;white-space:nowrap;}
.site-title span{color:var(--blood);font-family:var(--f-label);font-size:8.5pt;letter-spacing:4px;display:block;margin-bottom:-4px;}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
.hdr-btn{font-family:var(--f-label);font-size:8.5pt;letter-spacing:1px;padding:5px 12px;border:1px solid rgba(154,123,47,0.4);background:transparent;color:var(--gold2);cursor:pointer;transition:all 0.15s;text-transform:uppercase;white-space:nowrap;}
.hdr-btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold);}
.hdr-btn.blood{border-color:rgba(139,26,26,0.5);color:#e08080;}
.hdr-btn.blood:hover{background:var(--blood);color:var(--parch);}
.hdr-count{font-family:var(--f-label);font-size:8.5pt;color:rgba(154,123,47,0.5);letter-spacing:2px;}

/* ══════════════════════════════════════════════ SEARCH */
.search-bar{background:var(--iron);border-bottom:3px solid var(--blood);padding:9px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0;}
.search-bar input[type=text]{flex:1 1 180px;background:rgba(255,255,255,0.07);border:1px solid rgba(154,123,47,0.35);color:var(--parch);font-family:var(--f-body);font-size:12.0pt;padding:5px 11px;outline:none;}
.search-bar input::placeholder{color:rgba(240,230,200,0.25);}
.search-bar input:focus{border-color:var(--gold2);}
.f-btn{font-family:var(--f-label);font-size:7pt;letter-spacing:1.5px;padding:4px 10px;border:1px solid rgba(154,123,47,0.3);background:transparent;color:rgba(154,123,47,0.75);cursor:pointer;transition:all 0.15s;text-transform:uppercase;white-space:nowrap;}
.f-btn:hover{background:rgba(154,123,47,0.15);}
.f-btn.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}
.f-btn.t-minion.active    {background:var(--minion);    border-color:var(--minion);    color:#fff;}
.f-btn.t-skirmisher.active{background:var(--skirmisher);border-color:var(--skirmisher);color:#fff;}
.f-btn.t-elite.active     {background:var(--elite);     border-color:var(--elite);     color:#fff;}
.f-btn.t-boss.active      {background:var(--boss);      border-color:var(--boss);      color:#fff;}
.f-btn.t-legendary.active {background:var(--legendary); border-color:var(--legendary); color:#fff;}
.f-sep{width:1px;height:18px;background:rgba(154,123,47,0.2);}

/* ══════════════════════════════════════════════ LAYOUT */
.main{display:flex;flex:1;overflow:hidden;}
.main.compare-active .detail-panel{flex:1;min-width:0;}
.main.compare-active .compare-panel{flex:1;min-width:0;display:flex;flex-direction:column;}

/* ══════════════════════════════════════════════ LIST */
.list-panel{width:270px;flex-shrink:0;background:var(--iron);border-right:3px solid var(--blood);overflow-y:auto;display:flex;flex-direction:column;}
.list-panel::-webkit-scrollbar{width:4px;}
.list-panel::-webkit-scrollbar-thumb{background:rgba(154,123,47,0.35);}
.list-count{font-family:var(--f-label);font-size:7pt;letter-spacing:2px;color:rgba(154,123,47,0.45);padding:8px 12px;border-bottom:1px solid rgba(154,123,47,0.12);flex-shrink:0;text-transform:uppercase;}
.list-item{padding:10px 12px;border-bottom:1px solid rgba(0,0,0,0.25);cursor:pointer;transition:background 0.1s;display:flex;align-items:center;gap:8px;}
.list-item:hover{background:rgba(154,123,47,0.1);}
.list-item.active{background:var(--parch);border-left:4px solid var(--blood);padding-left:8px;}
.list-item.active .li-name{color:var(--ink);}
.list-item.active .li-size{color:rgba(26,18,8,0.45);}
.list-item.pinned .li-name::after{content:' 📌';font-size:9.0pt;}
.li-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.li-name{font-family:var(--f-label);font-size:9.5pt;letter-spacing:0.5px;line-height:1.3;flex:1;min-width:0;color:var(--parch2);}
.li-size{font-size:8.5pt;color:rgba(240,230,200,0.3);font-style:italic;white-space:nowrap;}
.no-results{padding:24px;text-align:center;font-family:var(--f-label);font-size:8.5pt;letter-spacing:2px;color:rgba(154,123,47,0.3);text-transform:uppercase;}

/* ══════════════════════════════════════════════ DETAIL */
.detail-panel{flex:1;overflow-y:auto;background:#1e180e;}
/* compact styles merged above */
.detail-panel::-webkit-scrollbar{width:5px;}
.detail-panel::-webkit-scrollbar-thumb{background:rgba(154,123,47,0.25);}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;opacity:0.2;}
.de-rune{font-size:56pt;color:var(--gold);}
.de-text{font-family:var(--f-label);font-size:10.0pt;letter-spacing:4px;color:var(--gold);text-transform:uppercase;}

/* ══════════════════════════════════════════════ COMPARE MODE */
.compare-panel{flex:1;min-width:0;overflow-y:auto;background:#1a1409;border-left:3px solid var(--blood);max-height:100%;display:none;}
.compare-panel::-webkit-scrollbar{width:4px;}
.compare-panel::-webkit-scrollbar-thumb{background:rgba(139,26,26,0.35);}
.compare-header{background:var(--blood);color:var(--parch);font-family:var(--f-label);font-size:9.0pt;letter-spacing:3px;text-transform:uppercase;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;}
.compare-header button{background:transparent;border:1px solid rgba(240,230,200,0.4);color:var(--parch2);font-family:var(--f-label);font-size:7pt;letter-spacing:1px;padding:3px 10px;cursor:pointer;text-transform:uppercase;}
.compare-header button:hover{background:rgba(240,230,200,0.15);}

/* ══════════════════════════════════════════════ MONSTER CARD */
.monster-card{background:var(--parch);max-width:920px;margin:20px auto;box-shadow:0 8px 60px rgba(0,0,0,0.85), 0 0 0 2px var(--parch3), 0 0 0 4px rgba(10,6,2,0.8);border-top:5px solid var(--blood);}
.monster-card.compare-card{margin:0;max-width:none;box-shadow:none;}

/* ── COMPACT COMPARE MODE ── */
/* ── shared compact selector for BOTH compare cards ── */
.compare-card,
.detail-panel.comparing .monster-card {
  --cmp-name: 17pt;
  --cmp-attr: 14pt;
}
.compare-card .mc-header,
.detail-panel.comparing .monster-card .mc-header{padding:10px 14px 8px;}
.compare-card .mc-name,
.detail-panel.comparing .monster-card .mc-name{font-size:17pt;}
.compare-card .mc-name-sub,
.detail-panel.comparing .monster-card .mc-name-sub{font-size:9pt;}
.compare-card .mca-v,
.detail-panel.comparing .monster-card .mca-v{font-size:14pt;}
.compare-card .mca-l,
.detail-panel.comparing .monster-card .mca-l{font-size:5.5pt;}
.compare-card .mc-attr,
.detail-panel.comparing .monster-card .mc-attr{padding:4px 6px;min-width:36px;}
.compare-card .mc-lore,
.detail-panel.comparing .monster-card .mc-lore{display:none;}
.compare-card .mc-stat-cell,
.detail-panel.comparing .monster-card .mc-stat-cell{padding:6px 3px;}
.compare-card .sc-lbl,
.detail-panel.comparing .monster-card .sc-lbl{font-size:6pt;}
.compare-card .sc-val,
.detail-panel.comparing .monster-card .sc-val{font-size:14pt;}
.compare-card .mc-stat-cell.wounds .sc-val,
.detail-panel.comparing .monster-card .mc-stat-cell.wounds .sc-val{font-size:18pt;}
.compare-card .mc-combat-table,
.detail-panel.comparing .monster-card .mc-combat-table{font-size:9.5pt;}
.compare-card .ct-val,
.detail-panel.comparing .monster-card .ct-val{font-size:13pt;padding:4px 6px;}
.compare-card .ct-lbl,
.detail-panel.comparing .monster-card .ct-lbl{font-size:7pt;padding:5px 6px;}
.compare-card .ability-entry,
.detail-panel.comparing .monster-card .ability-entry{padding:6px 10px;font-size:10pt;margin-bottom:4px;}
.compare-card .ability-section-head,
.detail-panel.comparing .monster-card .ability-section-head{font-size:7pt;margin-bottom:6px;}
.compare-card .mc-abilities,
.detail-panel.comparing .monster-card .mc-abilities{padding:12px 14px;}
.compare-card .mc-actions,
.detail-panel.comparing .monster-card .mc-actions{display:none;}
.compare-card .mc-meta,
.detail-panel.comparing .monster-card .mc-meta{margin-top:5px;}
.compare-card .mc-tag,
.detail-panel.comparing .monster-card .mc-tag{font-size:6pt;padding:2px 6px;}

/* Header */
.mc-header{background:var(--iron);padding:18px 26px 14px;border-bottom:4px solid var(--blood);position:relative;overflow:hidden;}
.mc-header::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(154,123,47,0.03) 40px,rgba(154,123,47,0.03) 41px);}
.mc-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.mc-header-left{flex:1;min-width:0;position:relative;}
.mc-header-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0;}
.mc-tier-banner{font-family:var(--f-label);font-size:8.5pt;letter-spacing:4px;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:7px;}
.mc-tier-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.mc-name{font-family:var(--f-head);font-size:28pt;line-height:1.0;color:#fff8ee;text-shadow:0 1px 3px rgba(0,0,0,0.6);}
.mc-name-sub{font-family:var(--f-body);font-style:italic;font-size:13.0pt;color:rgba(240,230,200,0.5);margin-top:2px;}
.mc-meta{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center;}
.mc-tag{font-family:var(--f-label);font-size:7pt;letter-spacing:1.5px;padding:2px 9px;border:1px solid rgba(154,123,47,0.38);color:rgba(154,123,47,0.85);text-transform:uppercase;}
.mc-tag.size{border-color:rgba(100,160,210,0.45);color:rgba(140,200,240,0.85);}
.mc-tag.cast{border-color:rgba(139,26,26,0.55);color:rgba(220,100,100,0.9);}
.mc-tag.fear{border-color:rgba(139,26,26,0.45);color:rgba(200,80,80,0.9);}
.mc-attrs-strip{display:flex;gap:3px;align-items:stretch;}
.mc-attr{background:rgba(255,255,255,0.06);border:1px solid rgba(154,123,47,0.18);padding:6px 10px;text-align:center;min-width:48px;}
.mc-attr-sep{width:1px;background:rgba(154,123,47,0.22);margin:0 2px;}
.mca-l{font-family:var(--f-label);font-size:6.5pt;letter-spacing:1px;color:rgba(232,217,176,0.7);display:block;margin-bottom:3px;text-transform:uppercase;}
.mca-v{font-family:var(--f-head);font-size:20pt;color:#fff8ee;display:block;line-height:1;font-weight:900;}
.mc-actions{display:flex;gap:6px;flex-wrap:wrap;}
.mc-btn{font-family:var(--f-label);font-size:7pt;letter-spacing:1px;padding:5px 12px;border:1px solid rgba(154,123,47,0.38);background:rgba(154,123,47,0.08);color:var(--gold2);cursor:pointer;transition:all 0.15s;text-transform:uppercase;}
.mc-btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold);}
.mc-btn.tracker{border-color:rgba(139,26,26,0.45);background:rgba(139,26,26,0.1);color:#e08080;}
.mc-btn.tracker:hover{background:var(--blood);color:var(--parch);}
.mc-btn.pin{border-color:rgba(154,123,47,0.6);color:var(--gold2);}
.mc-btn.pin.pinned{background:var(--gold);color:var(--ink);}

/* Stat band */
.mc-stat-block{background:var(--parch2);border-bottom:3px solid var(--ink);}
.mc-stat-row{display:grid;grid-template-columns:repeat(8,1fr);border-bottom:1px solid var(--parch3);}
.mc-stat-cell{padding:11px 6px;text-align:center;border-right:1px solid var(--parch3);}
.mc-stat-cell:last-child{border-right:none;}
.sc-lbl{font-family:var(--f-label);font-size:7pt;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);opacity:0.75;font-weight:900;display:block;margin-bottom:4px;}
.sc-val{font-family:var(--f-head);font-size:20pt;color:var(--ink);font-weight:900;display:block;line-height:1;}
.mc-stat-cell.wounds .sc-val{color:var(--blood);font-size:26pt;font-weight:900;}
.mc-stat-cell.focus .sc-val{color:var(--gold);}
.mc-stat-cell.wm{background:rgba(61,26,110,0.05);}
.mc-stat-cell.wm .sc-lbl{color:var(--purple);font-size:6pt;}
/* Compare highlights */
.sc-better{background:rgba(46,90,46,0.12)!important;}
.sc-worse {background:rgba(139,26,26,0.1)!important;}
.sc-better .sc-val{color:#2d6a2d!important;}
.sc-worse  .sc-val{color:var(--blood)!important;}

/* Combat table row */
.mc-combat-row{}
.mc-combat-table{width:100%;border-collapse:collapse;font-size:12.0pt;}
.mc-combat-table thead tr{background:var(--iron);}
.ct-h,.ct-h-type,.ct-h-detail{font-family:var(--f-label);font-size:7pt;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);padding:6px 10px;text-align:left;white-space:nowrap;}
.ct-h{text-align:center;}
.ct-h-type{width:85px;}
.mc-combat-table tbody tr{border-bottom:1px solid var(--parch3);}
.mc-combat-table tbody tr:last-child{border-bottom:none;}
.mc-combat-table tbody tr:hover{background:rgba(154,123,47,0.05);}
.ct-lbl{font-family:var(--f-label);font-size:9.0pt;letter-spacing:1px;text-transform:uppercase;color:var(--blood);padding:8px 10px;white-space:nowrap;}
.ct-val{font-family:var(--f-head);font-size:17pt;text-align:center;padding:5px 10px;line-height:1;}
.ct-val.hit{color:var(--gold);}
.ct-val.dmg{color:var(--blood);}
.ct-val.heal{color:#2a7a2a;}
.ct-detail{font-style:italic;font-size:11.0pt;color:rgba(26,18,8,0.48);padding:8px 10px;}
/* Compare combat */
.ct-better{background:rgba(46,90,46,0.1);}
.ct-worse {background:rgba(139,26,26,0.08);}

/* Lower body */
.mc-body{display:grid;grid-template-columns:220px 1fr;}
.mc-art{background:rgba(42,32,16,0.06);border:2px dashed rgba(154,123,47,0.3);margin:18px 12px 18px 18px;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;height:210px;transition:background 0.2s;flex-shrink:0;align-self:start;}
.mc-art:hover{background:rgba(154,123,47,0.08);}
.mc-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.mc-art input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.mc-art{transition:outline 0.15s;}
.mc-art-label{display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;text-align:center;}
.mc-art-label .al-icon{font-size:20pt;opacity:0.22;}
.mc-art-label .al-text{font-family:var(--f-label);font-size:7pt;letter-spacing:2px;color:var(--gold);opacity:0.45;}
.mc-art-label .al-sub{font-family:var(--f-label);font-size:6pt;letter-spacing:1px;color:var(--gold);opacity:0.25;margin-top:2px;}
.mc-art .art-clear{display:none;position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.6);color:#fff;border:none;cursor:pointer;font-size:8.5pt;padding:3px 8px;font-family:var(--f-label);z-index:2;}
.mc-art:hover .art-clear{display:block;}

.mc-lore-col{padding:18px 22px 22px 12px;border-left:2px solid var(--parch2);}
.mc-lore{padding:13px 16px;background:rgba(42,32,16,0.05);border-left:5px solid var(--gold);border-right:1px solid var(--gold);font-style:italic;font-size:12.5pt;line-height:1.65;color:var(--ink);margin-bottom:14px;position:relative;}
.mc-lore::before{content:'"';position:absolute;top:-5px;left:9px;font-size:30pt;color:var(--gold);opacity:0.28;pointer-events:none;font-family:var(--f-head);line-height:1;}
.gear-box{margin-bottom:12px;background:rgba(154,123,47,0.06);border:1px solid rgba(154,123,47,0.26);padding:10px 13px;font-size:12.0pt;color:var(--ink);line-height:1.5;}
.gear-box .gl{font-family:var(--f-label);font-size:7pt;letter-spacing:2px;color:var(--gold);display:block;margin-bottom:5px;text-transform:uppercase;}
.mc-abilities{}
.ability-section{margin-top:16px;}
.ability-section-head{font-family:var(--f-label);font-size:9.5pt;letter-spacing:2px;text-transform:uppercase;font-weight:900;padding-bottom:5px;margin-bottom:9px;border-bottom:2px solid;display:flex;align-items:center;gap:7px;}
.ability-section-head::before{content:'';display:inline-block;width:12px;height:2px;}
.ability-section.passive .ability-section-head{color:var(--gold);border-color:var(--gold);}
.ability-section.passive .ability-section-head::before{background:var(--gold);}
.ability-section.action  .ability-section-head{color:var(--blood);}
.ability-section.action  .ability-section-head::before{background:var(--blood);}
.ability-section.reaction .ability-section-head{color:var(--purple);border-color:var(--purple);}
.ability-section.reaction .ability-section-head::before{background:var(--purple);}
.ability-entry{padding:10px 14px;margin-bottom:7px;font-size:12.5pt;line-height:1.65;color:#0e0a04;background:rgba(42,32,16,0.05);border-left:4px solid rgba(154,123,47,0.5);}
.ability-entry.passive {border-left-color:var(--gold);background:rgba(154,123,47,0.05);}
.ability-entry.action  {border-left-color:var(--blood);background:rgba(139,16,16,0.06);}
.ability-entry.reaction{border-left-color:var(--purple);background:rgba(61,26,110,0.06);}

/* ══════════════════════════════════════════════ ADD MONSTER MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--parch);max-width:800px;width:95%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 60px rgba(0,0,0,0.8);}
.modal-header{background:var(--iron);padding:16px 24px;border-bottom:3px solid var(--blood);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-family:var(--f-head);font-size:20pt;color:var(--parch);}
.modal-close{background:transparent;border:1px solid rgba(154,123,47,0.4);color:var(--gold2);font-family:var(--f-label);font-size:9.0pt;letter-spacing:1px;padding:5px 12px;cursor:pointer;text-transform:uppercase;}
.modal-close:hover{background:var(--gold);color:var(--ink);}
.modal-body{padding:24px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.form-grid.wide{grid-template-columns:1fr;}
.form-grid.three{grid-template-columns:1fr 1fr 1fr;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-family:var(--f-label);font-size:8.5pt;letter-spacing:1.5px;text-transform:uppercase;color:var(--blood);}
.form-group input,.form-group select,.form-group textarea{
  background:rgba(42,32,16,0.06);border:1px solid var(--parch3);
  font-family:var(--f-body);font-size:12.0pt;color:var(--ink);
  padding:6px 10px;outline:none;width:100%;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);}

.form-section-head{font-family:var(--f-label);font-size:9.0pt;letter-spacing:2px;text-transform:uppercase;color:var(--gold);padding:5px 0;margin:4px 0;border-bottom:1px solid rgba(154,123,47,0.25);}
.modal-footer{padding:16px 24px;border-top:2px solid var(--parch2);display:flex;gap:10px;justify-content:flex-end;}
.btn-save{font-family:var(--f-label);font-size:10.0pt;letter-spacing:1px;padding:9px 24px;background:var(--blood);color:var(--parch);border:none;cursor:pointer;text-transform:uppercase;}

.btn-cancel{font-family:var(--f-label);font-size:10.0pt;letter-spacing:1px;padding:9px 24px;background:transparent;color:var(--ink);border:1px solid var(--parch3);cursor:pointer;text-transform:uppercase;}

<body>

<header class="site-header">
  <div class="site-title"><span>BLOOD AND PURPOSE</span>Bestiary</div>
  <div class="header-actions">
    <button class="hdr-btn" onclick="location.href='index.html'" style="border-color:rgba(139,16,16,0.5);color:#e08080;">🏠 Hub</button>
    <span class="hdr-count" id="hdr-count">188 CREATURES</span>
    <button class="hdr-btn" onclick="openAddMonster(true)">+ ADD MONSTER</button>
    <button class="hdr-btn" onclick="exportData()">⬇ EXPORT</button>
    <label class="hdr-btn" style="cursor:pointer;">⬆ IMPORT<input type="file" accept=".rpgb,.json" onchange="importData(event)" style="display:none"></label>
    <button class="hdr-btn blood" id="compare-toggle" onclick="toggleCompare()">⚔ COMPARE</button>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="Search by name or type…" oninput="applyFilters()">
  <div class="f-sep"></div>
  <button class="f-btn t-minion"      onclick="toggleTier('Minion')"      id="f-Minion">⬤ MINION</button>
  <button class="f-btn t-skirmisher"  onclick="toggleTier('Skirmisher')"  id="f-Skirmisher">⬤ SKIRMISHER</button>
  <button class="f-btn t-elite"       onclick="toggleTier('Elite')"       id="f-Elite">⬤ ELITE</button>
  <button class="f-btn t-boss"        onclick="toggleTier('Boss')"        id="f-Boss">⬤ BOSS</button>
  <button class="f-btn t-legendary"   onclick="toggleTier('Legendary')"   id="f-Legendary">⬤ LEGENDARY</button>
  <div class="f-sep"></div>
  <button class="f-btn" onclick="toggleCaster()" id="f-caster">✦ CASTERS</button>
  <button class="f-btn" onclick="clearFilters()" style="border-color:rgba(139,26,26,0.4);color:rgba(200,80,80,0.7)">✕ CLEAR</button>
</div>

<div class="main" id="main-layout">
  <div class="list-panel" id="list-panel">
    <div class="list-count" id="list-count">Loading…</div>
  </div>
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty"><div class="de-rune">⚔</div><div class="de-text">Select a Creature</div></div>
  </div>
  <div class="compare-panel" id="compare-panel" style="display:none;">
    <div class="compare-header">
      <span>📌 PINNED COMPARISON</span>
      <button onclick="clearPin()">✕ CLEAR PIN</button>
    </div>
    <div id="compare-content"><div class="detail-empty" style="height:300px;"><div class="de-rune" style="font-size:32pt;">📌</div><div class="de-text">Pin a monster first</div></div></div>
  </div>
</div>

<!-- ADD MONSTER MODAL -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">New Creature</div>
      <button class="modal-close" onclick="closeModal()">✕ Cancel</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>Name</label><input id="f-name" placeholder="Full creature name"></div>
        <div class="form-group"><label>Subtitle (after colon)</label><input id="f-subtitle" placeholder="The Mountain-Heart"></div>
      </div>
      <div class="form-grid three">
        <div class="form-group"><label>Size</label>
          <select id="f-size"><option>Tiny</option><option>Small</option><option selected>Medium</option><option>Large</option><option>Giant</option><option>Enormous</option><option>Titanic</option></select>
        </div>
        <div class="form-group"><label>Type / Category</label><input id="f-type" placeholder="Humanoid (Orc)"></div>
        <div class="form-group"><label>Casting Discipline</label>
          <select id="f-cast"><option value="None">None</option><option>Faith</option><option>Wizardry</option><option>Druidism</option><option>Shamanism</option><option>Ki</option></select>
        </div>
      </div>
      <div class="form-grid wide"><div class="form-group"><label>Description / Lore</label><textarea id="f-desc" rows="3"></textarea></div></div>

      <div class="form-section-head">Characteristics</div>
      <div class="form-grid" style="grid-template-columns:repeat(6,1fr)">
        <div class="form-group"><label>Agl</label><input id="f-agl" type="number" value="5"></div>
        <div class="form-group"><label>Awa</label><input id="f-awa" type="number" value="5"></div>
        <div class="form-group"><label>Cha</label><input id="f-cha" type="number" value="5"></div>
        <div class="form-group"><label>Int</label><input id="f-int" type="number" value="5"></div>
        <div class="form-group"><label>Phy</label><input id="f-phy" type="number" value="5"></div>
        <div class="form-group"><label>Wil</label><input id="f-wil" type="number" value="5"></div>
      </div>

      <div class="form-section-head">Combat Stats</div>
      <div class="form-grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="form-group"><label>Wounds</label><input id="f-wounds" type="number" value="30"></div>
        <div class="form-group"><label>Defense</label><input id="f-def" type="number" value="6"></div>
        <div class="form-group"><label>Act Points</label><input id="f-ap" type="number" value="3"></div>
        <div class="form-group"><label>Move</label><input id="f-move" type="number" value="20"></div>
        <div class="form-group"><label>Focus</label><input id="f-focus" value="—"></div>
        <div class="form-group"><label>Fear</label><input id="f-fear" value="—"></div>
        <div class="form-group"><label>Reroll</label><input id="f-reroll" value="—"></div>
        <div class="form-group"><label>Luck</label><input id="f-luck" value="—"></div>
      </div>

      <div class="form-section-head">Damage Mitigation</div>
      <div class="form-grid three">
        <div class="form-group"><label>DM Armour</label><input id="f-wma" value="—"></div>
        <div class="form-group"><label>DM Bless/Spell</label><input id="f-wmbs" value="—"></div>
        <div class="form-group"><label>DM Disease/Poison</label><input id="f-wmdp" value="—"></div>
      </div>

      <div class="form-section-head">Attacks</div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr 1fr 1.5fr">
        <div class="form-group"><label>Type</label><div style="padding:6px 0;font-family:var(--f-label);font-size:8pt;color:var(--blood);">MELEE</div></div>
        <div class="form-group"><label>To-Hit</label><input id="f-mhit" value="—"></div>
        <div class="form-group"><label>Wounds</label><input id="f-mdmg" value="—"></div>
        <div class="form-group"><label>Heal</label><input id="f-mheal" value="—"></div>
        <div class="form-group"><label>Weapon / Detail</label><input id="f-mdetail" value="—"></div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr 1fr 1.5fr">
        <div class="form-group"><label>&nbsp;</label><div style="padding:6px 0;font-family:var(--f-label);font-size:8pt;color:var(--blood);">RANGED</div></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-rhit" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-rdmg" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-rheal" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-rdetail" value="—"></div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr 1fr 1.5fr">
        <div class="form-group"><label>&nbsp;</label><div style="padding:6px 0;font-family:var(--f-label);font-size:8pt;color:var(--blood);">CASTING</div></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-chit" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-cdmg" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-cheal" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-cdetail" placeholder="Discipline" value="—"></div>
      </div>

      <div class="form-section-head">Gear &amp; Abilities</div>
      <div class="form-grid wide"><div class="form-group"><label>Gear / Equipment</label><textarea id="f-gear" rows="2"></textarea></div></div>
      <div class="form-grid wide"><div class="form-group"><label>Special Abilities (use "Passive Traits", "Action-Based Abilities", "Reaction" as section headers)</label><textarea id="f-abilities" rows="8"></textarea></div></div>
      <div class="form-grid wide"><div class="form-group"><label>Mob / XP / Loot</label><input id="f-mob" value="—"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="modal-save-btn" onclick="window._editingMonster ? updateMonster(window._editingMonster) : saveNewMonster()">Save Creature</button>
    </div>
  </div>
</div>

{name:`AakZad Crypt Priest: The Architect of Bone-Frequency`,size:`Medium`,type:`Construct/Biomechanical`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`While the AakZad soldiers are engines of war, the Crypt Priest is the cold, calculating intelligence that keeps their mechanical hearts beating. Draped in tattered, oil-stained vestments smelling of ozone and ancient dust, the Priest’s body is a terrifying fusion of skeletal remains, humming brass gears, and glowing filaments. It does not breathe; it vibrates. By manipulating the "Spirit-Echo"—the resonant frequency of the void—it tunes reality itself to shatter stone or knit metal to bone. When it speaks, it bypasses the ears, vibrating a grinding stone melody directly into the listener's marrow.`,agl:5,awa:9,cha:8,int:11,phy:3,wil:12,move:13,ap:4,def:7,wmArmor:7,wmBS:20,wmDP:`Immune`,wounds:65,focus:`+1/3`,reroll:2,luck:0,meleeHit:`+2`,meleeDmg:`+8`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+35`,castHeal:`+17`,castType:`Faith`,fear:`0`,mob:`1`,gear:`The Tuning Staff (A heavy brass rod topped with a glowing, vibrating filament)`,meleeDetail:`The Tuning Staff`,rangeDetail:`None`,abilities:`Passive Traits\nBiomechanical: The Priest is a construct of dead bone and alien machinery. It does not breathe, making it immune to suffocation and gas-based attacks. It is completely immune to the Poison, Disease, Bleeding, Charmed, and Fear conditions.\n\nResonant Shielding (Aura): The Priest treats the battlefield like an instrument, maintaining the "harmonic" of its legion. The Priest projects a 30-foot aura of shimmering, vibrating air. All allied AakZad units within this aura (including the Priest) gain a +5 to their Armor Mitigation, and any Ranged weapon attacks (arrows, bolts, bullets) made against them automatically suffer Disadvantage as the kinetic barrier deflects the projectiles.\n\nAction-Based Abilities\nDiscordant Hum(TN7) (Casting Cost: 1 Action): The Priest emits a frequency that t ilities\nSickly-Green Cleave (Melee Cost: 3 Actions): The Giant swings its massive, vibrating arm-cleavers in a devastating 20-foot frontal arc, leaving a blinding trail of necrotic light. It makes a single To-Hit roll against the Defense of all targets in the area. Anyone hit takes normal 1d10 + 50 damage and is violently pushed 15 feet backward. The trail of green light lingers in the air until the Gaiant's next turn; any creature moving through that space automatically takes 2d10 Necrotic Damage.\n\nVibrating Sunder (Melee Cost: 2 Action): The Giant brings a single cleaver straight down like a guillotine. Make a Melee attack (+3 To-Hit). If successful, it deals 2d10 + 50 damage. The sheer vibrating force of the impact forces the target to pass a severe Physique(11) test. On a failure, their physical weapon or shield is violently shattered from their hands and rendered useless for the rest of the encounter. If magical, then the shield is dropped and target must expend 1 action to retrieve it.\n\nOverclocked Thrash (Melee Cost: 2 Actions): This ability can only be triggered if the Giant is below half its maximum damage. The green filaments glow blindingly bright as the Giant overrides its own safety protocols. It makes two rapid Melee attacks (+3 To-Hit), but the violent exertion causes the Giant to automatically take 3d10 damage to its own health pool as its necrotized muscles begin to tear apart from the strain.`},
{name:`Aakzad Phalanx-Guard`,size:`Large`,type:`Alien-Undead (Aakzad Elite)`,tier:`Lore`,tierColor:`#607080`,desc:`One of the ten glowing green-eyed sentinels released from the Shamanic prison. These skeletal warriors move with cold, terrifying military precision.`,agl:3,awa:6,cha:1,int:4,phy:10,wil:8,move:10,ap:3,def:15,wmArmor:20,wmBS:15,wmDP:0,wounds:85,focus:`2`,reroll:1,luck:0,meleeHit:`+6`,meleeDmg:`1d10+10`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`8`,mob:`1d6`,gear:`Obsidian Greatshield`,meleeDetail:`Heavy Void-Blade`,rangeDetail:`None`,abilities:`Passive Traits\nBiomechanical: The Phalanx-Guard is a construct of dead bone and alien machinery. It is immune to Poison, Disease, Bleeding, and Fear.\n\nRelentless Phalanx (Aura): The Guard provides +2 to Armor Mitigation for every other allied Aakzad unit within 5 feet of it.\n\nKinetic Redirection: When using a shield, a successful Defend roll against a melee attack allows the Guard to immediately push the attacker 5 feet back.\n\nAction-Based Abilities\nShield Bash (1 Action): The Guard slams its obsidian shield into a target. Melee +6 To-Hit. If successful, target takes 1d10+10 damage and is knocked back 10 feet.\n\nDefensive Wall (1 Action): The Guard locks its stance. Until the start of its next turn, it gains +5 to its Defense and Mitigation, but its movement is reduced to 0.\n\nVoid-Cleave (2 Actions): The Guard swings its blade in a wide arc. All enemies within a 5-foot arc must pass an surpass Agility TN 7 + Resist bonus or take 2d10 damage, ignoring non-magical Armor.`},

r heartbeat is forcibly slowed to match the machines' cold rhythm.\n\nAction-Based Abilities\nMolecular Cleave (Melee Cost: 2 Actions): The Warrior strikes with its humming, serrated polearm. Make a Melee attack (+2 To-Hit). If successful, it deals normal 1d10 + 18 damage. Because the blade vibrates at a frequency that shatters molecular bonds, this attack automatically bypasses half of the target's Armor Mitigation.\n\nThermal Vent (Cost: 1 Action): The Warrior expands its chest plates, violently purging the buildup of heat from its internal biomechanical engine. All adjacent enemies within 5 feet must surpass Agility TN 7 + Resist bonus or take 2d10 Fire/Necrotic Damage and be pushed 5 feet backward by the blast of oily steam. Using this ability also instantly cures the Warrior of any Cold/Ice-based Movement penalties or conditions.\n\nPhalanx Lock (Cost: 2 Actions): The Warrior interlocks its calcified geometry with an adjacent allied Aakzad unit, forming a seamless wall of vibrating bone. Until its next turn, the Warrior's Defense increases by +2, its Armor Mitigation increases by +5, and it gains a free Reaction to perform a Molecular Cleave against the first enemy that moves into its melee range.`},
{name:`AakZad: Biomechanical Harvester`,size:`Large`,type:`Construct/Biomechanical)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A terrifying fusion of two souls into one biomechanical engine of war. The AakZad appears as a centauroid nightmare; the "rider" is fused at the waist into a ribcage of reinforced alien alloy, while the "beast" possesses far too many joints. They share a singular consciousness, linked by a glowing necrotic-green or violet pulse that acts as their nervous system. They do not charge like living horses—they scuttle up walls, pivot 180 degrees in a fraction of a second, and move with a disturbing, multi-limbed fluidity that completely ignores the traditional physics of momentum.`,agl:4,awa:6,cha:2,int:5,phy:8,wil:10,move:20,ap:3,def:7,wmArmor:15,wmBS:15,wmDP:`Immune`,wounds:45,focus:`0`,reroll:0,luck:0,meleeHit:`+3`,meleeDmg:`+10/+21(2H)`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+15`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`0`,mob:`1-5`,gear:`Fused Harvesting Scythe, Necrotic-Tether Harpoons.`,meleeDetail:`lloy Scythe & Scuttling Claws`,rangeDetail:`Necrotic Harpoon. Hurls an alloy tether up to 60ft`,abilities:`Passive Traits\nInertia Nullification: The AakZad completely ignores the laws of physical momentum. It can Disengage from melee combat, pivot, and move its full 30 Movement speed without triggering any free attacks of opportunity from engaged enemies. Furthermore, it takes zero falling damage, as its multi-jointed legs instantly absorb the kinetic impact.\n\nSpider-Cavalry: The AakZad treats vertical walls, sheer cliffs, and even ceilings as normal terrain. It can charge up the side of a watchtower or hang upside down from a cavern roof without needing to make any Agility checks to maintain its grip.\n\nSingular Consciousness: Because the rider and mount share a fused soul and a biomechanical nervous system, the AakZad is incredibly resistant to mental manipulation. It is completely immune to the Charmed and Fear conditions.\n\nAction-Based Abilities\nReaping Charge (Melee Cost: 2 Actions): The AakZad sprints in a straight line (along the ground, a wall, or a ceiling) up to its maximum Movement (60 ft), holding its fused scythe outward. It makes a single Melee attack (+3 To-Hit) that is compared against the Defense of every enemy in its path. Anyone hit takes normal 1d10 + 20 mounted damage and suffers 1 Bleeding condition.\n\nTether and Drag (Range Cost: 1 Action): The AakZad fires a harpoon connected to its glowing, necrotic nervous system. Make a Ranged attack (+2 To-Hit) against a target up to 60 feet away. If successful, it deals 1d10 + 15 damage and the target is Grappled. On its next turn, if the tether isn't broken, the AakZad can use its movement to drag the grappled player across the battlefield with it.\n\nCore-Pulse Overload (Cost: 1 Action): The AakZad intentionally surges the violet/necrotic energy through its alloy ribcage, releasing a shockwave of localized radiation. All enemies within 10 feet must pass a severe Physique(10) test or take 2d10 + 15 Necrotic Damage and gain 1 Fatigued condition as the alien energy saps their strength.`},
{name:`Abomination`,size:`Giant`,type:`Undead / Monstrosity`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Abomination is a towering, nauseating monument to forbidden sorcery. It is not born, but "knotted" together from a chaotic mass of necrotized muscle and jagged bone shards harvested from a dozen different corpses. It hums with a sickly green necromantic tether—a visible, pulsing vein of emerald light that serves as a secondary nervous system, allowing it to instantly re-knit severed limbs and seal gaping damage in seconds. It does not think, feel, or tire. It wields its massive, rusted cleavers with the unstoppable, rhythmic momentum of a slaughterhouse machine, turning the battlefield into a literal charnel house.`,agl:4,awa:5,cha:1,int:1,phy:14,wil:7,move:17,ap:3,def:5,wmArmor:6,wmBS:9,wmDP:`Immune`,wounds:350,focus:`0`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+45`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`9`,mob:`1`,gear:`usted Slaughterhouse Cleavers (Fused to its hands)`,meleeDetail:`The Rusted Cleavers`,rangeDetail:`None`,abilities:`Passive Traits\nThe Emerald Tether (Hyper-Regeneration): The glowing green vein of necromantic magic makes the Titan incredibly resilient. At the start of its turn, the Titan automatically heals 2d10 damage and re-knits any severed limbs or shattered joints. However, if the Titan took any Holy or Radiant Damage in the previous round, the emerald light flickers and dies—this regeneration does not trigger for that turn.\n\nMonument of Dead Flesh: As a chaotic mass of necrotized muscle, the Titan has no vital organs. It is completely immune to the Poison, Disease, Bleeding, Charmed, and Fear conditions. Additionally, Piercing weapons (like arrows and rapiers) simply get stuck in its dead meat, dealing exactly half damage.\n\nSlaughterhouse Momentum: The Titan cannot be knocked Prone, Stunned, or forcefully moved by any physical attack. It marches forward with the terrifying, rhythmic inevitability of a machine.\n\nAction-Based Abilities\nCharnel-House Cleave (Melee Cost: 2 Actions): The Titan swings its massive rusted cleavers in a brutal, sweeping 15-foot arc. It makes a single To-Hit roll (+2) against the Defense of all targets in the area. Anyone hit takes normal 1d10 + 45 damage and must surpass Physique TN 10 + Resist bonus. On a failure, the rusted, jagged metal inflicts 2 Bleeding conditions and 1 Disease condition (preventing them from receiving magical healing until cured).\n\nThe Butcher's Block (Melee Cost: 1 Action): A devastating single-target overhead strike. Make a Melee attack (+2 To-Hit). If successful against a target that is currently Bleeding, this attack automatically gains Advantage and deals 2d10 + 45 damage, permanently denting their physical armor (reducing their Armor Mitigation by 2).\n\nNecrotic Rupture (Reaction): The Titan uses the magic holding it together as a weapon. If a player rolls a Critical Hit against the Titan, the blow severs a pocket of the pulsing green tether. The Titan instantly sprays highly pressurized, acidic embalming fluid in a 10-foot radius. All enemies in the radius must surpass Agility TN 11 + Resist bonus or take 2d10 Acid Damage.`},
{name:`Aethon, The World-Breaker`,size:`Titanic`,type:`Titan / Elemental`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Aethon is a "Terra-Titan," standing nearly 100 feet tall as a walking mountain of jagged obsidian and glowing mantle. He wears no armor; the crust of the earth is his skin. Fused to his arm by cooled magma is a weapon that is actually the spire of a long-forgotten cathedral. Titans operate on a scale far beyond the Agility pillar—they do not dodge, they simply endure. Aethon views the world as unfinished clay, finding the "order" of the Celestials and the "contracts" of the Hells to be offensive clutter on his canvas. When Aethon moves, the map of the world literally changes.`,agl:4,awa:9,cha:18,int:7,phy:21,wil:15,move:53,ap:5,def:8,wmArmor:80,wmBS:60,wmDP:`Immune`,wounds:1850,focus:`+4/12`,reroll:2,luck:1,meleeHit:`+6`,meleeDmg:`+120`,meleeHeal:`0`,rangeHit:`+4`,rangeDmg:`+80`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`10`,mob:`1`,gear:`The Earth's Crust (Skin), Magma-Fused Cathedral Spire (Improvised Titanic Weapon).`,meleeDetail:`Cathedral Spire Sweep`,rangeDetail:`Tectonic Boulder Toss. Rips chunks of the earth to hurl up to 200ft`,abilities:`Passive Traits\nBeyond Agility (Endurance): Aethon operates on a scale where traditional combat rules fail. He is completely immune to the Prone, Stunned, Grappled, Bleeding, and Poison conditions. He cannot be moved, pushed, or knocked back by any force less than a localized meteor strike. Attacks against his Defense of 5 are practically guaranteed to hit; the challenge is overcoming his immense 80 Armor Mitigation.\n\nTerraforming Strides: Aethon does not walk on the battlefield; he is the battlefield. Every time he moves, the ground he steps on is permanently shattered and turned into a pool of molten rock. Any space Aethon walks through becomes severe difficult terrain that inflicts 2d10 Fire Damage to anyone ending their turn there.\n\nThe World's Crust: Aethon is made of solid stone and magma. He takes only half damage from all physical slashing and piercing weapons, as swords and arrows simply chip away at his obsidian skin without hitting anything vital. He takes normal damage from massive blunt/crushing weapons, and double damage from high-tier Water/Ice magic.\n\nAction-Based Abilities\nCathedral Sweep (Melee Cost: 2 Actions): Aethon sweeps the magma-fused cathedral spire across the battlefield in a massive 60-foot horizontal arc. He makes a single To-Hit roll (+8) against the Defense of every creature and structure in the arc. Anyone hit takes normal damage (120) and is violently thrown 30 feet backward. Any mortal-made buildings or walls caught in this sweep are instantly annihilated.\n\nTectonic Stomp (Cost: 1 Action): Aethon brings his foot down with apocalyptic force. All creatures within a 100-foot radius of Aethon must pass a severe Agility(14) test. On a failure, the localized earthquake knocks them Prone and inflicts 3d10 blunt damage. The violent shaking also immediately destroys all active localized spell-zones (like protective wards or magical walls) on the ground.\n\nMantle Eruption (Cost: 4 Actions): Aethon flexes his colossal musculature, intentionally cracking his own obsidian skin to release the pressurized, glowing mantle beneath. A 40-foot radius around him is flooded with a tidal wave of liquid magma. All creatures in the zone must pass a severe Physique(18) test. On a failure, they take 6d10 + 100 Fire Damage and their non-magical armor/weapons instantly begin to melt (permanently losing half their effectiveness). On a success, they take half damage. Aethon himself heals 4d10 damage from the release of geological pressure.`},
{name:`Archangel`,size:`Giant`,type:`Celestial / Divine`,tier:`Elite`,tierColor:`#b45309`,desc:`An Archangel stands roughly 14 feet tall, appearing as a flawless humanoid figure composed of luminous platinum. They do not wear physical armor; their very presence acts as an impenetrable barrier. They possess four wings resembling stained glass, refracting the sun into blinding geometric patterns. They carry no physical weapons, often keeping their hands folded in prayer or raised in absolute authority. Their power comes from their throat—a vibrating resonance of "Holy Frequency." They do not cast spells; they issue Decrees that the universe is forced to obey. When they speak, the ground trembles, and mortal souls instinctively drop to their knees.`,agl:3,awa:7,cha:19,int:16,phy:3,wil:20,move:`40F`,ap:3,def:7,wmArmor:0,wmBS:30,wmDP:`Immune`,wounds:150,focus:`+4/12`,reroll:3,luck:5,meleeHit:`0`,meleeDmg:`0`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+8`,castDmg:`+60`,castHeal:`0`,castType:`Faith`,fear:`8`,mob:`1`,gear:`None`,meleeDetail:`Special Abilities`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nLuminous Platinum Presence: Because the Archangel's body is composed of flawless, dense light, it cannot be harmed by mundane means. It is completely immune to all non-magical physical weapons. Even magical physical weapons deal only half damage. It is immune to the Grappled, Prone, Poison, Disease, and Bleeding conditions.\n\nStained-Glass Refraction: The Archangel's four wings constantly bend the ambient light. Any enemy that attempts to make a Ranged attack against the Archangel from further than 15 feet away suffers Disadvantage, as the geometric light patterns create blinding optical illusions.\n\nThe Weight of Purity: The Archangel's very existence suppresses the unholy. Any Undead or Daemon that starts its turn within 40 feet of the Archangel automatically suffers 1d10 Radiant Damage and loses 1 Action for that turn as their dark magic violently boils inside them.\n\nAction-Based Abilities\nDecree of Subjugation (Cost: 2 Actions): The Archangel speaks a single, vibrating syllable of cosmic law. All enemies within a 60-foot radius must pass a severe Willpower(15) test. On a failure, their souls are forced into submission: they take 60 Sonic/Radiant Damage, are instantly knocked Prone, and cannot spend Actions to stand back up until the Archangel moves or ends the Decree on a subsequent turn.\n\nDecree of Eradication(TN11) (Casting Cost: 2 Actions): The Archangel points a single, flawless finger at a target within 80 feet and speaks a word of unmaking. Make a Casting roll (+8 To-Cast). If successful, it deals 2d10 + 60 Radiant Damage. This attack completely ignores all Armor Mitigation and automatically destroys any active magical spell - shields, walls, or wards the target is hiding behind.\n\nDecree of Silence(TN8) (Casting Cost: 1 Action): The Archangel dictates the rules of engagement. Make a Casting roll (+8 To-Cast) against a target within 60 feet. On a success, the target is completely Silenced and muted. They cannot cast spells with verbal components, communicate with their team, or use any abilities that require speech or sound until they surpass Willpower TN 11 + Resist bonus at the end of their turn to break the holy lock.`},
{name:`Ash-Blight Dragon: The Extinction Event`,size:`Enormous`,type:`Dragon / Primordial`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Ash-Blight Dragon is not merely a predator; it is a localized extinction event. Older than recorded history, these colossal wyrms make their lairs in shattered volcanoes and dead lands—environments they actively create. The dragon's internal heat is so intense that the very air around it turns to superheated white ash. It does not negotiate or hoard gold; it hoards absolute dominion. Its colossal frame is armored in jagged scales resembling cooled obsidian, glowing with a molten orange heartbeat from within. To face an Ash-Blight Dragon is to fight the raw, unchained fury of the earth.`,agl:5,awa:8,cha:12,int:7,phy:18,wil:15,move:`40/80F`,ap:3,def:9,wmArmor:40,wmBS:30,wmDP:`Immune`,wounds:600,focus:`+1/3`,reroll:2,luck:0,meleeHit:`+6`,meleeDmg:`+60`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+40`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`9`,mob:`1`,gear:`None. It incinerates anything it touches`,meleeDetail:`Obsidian Claws & Jaws`,rangeDetail:`Pitch-Black Fire`,abilities:`Passive Traits\nStorm of White Ash: The dragon is perpetually wreathed in a blinding, superheated ash storm. Any non-magical Ranged attacks targeting the dragon automatically suffer Disadvantage. Furthermore, any enemy starting their turn within 30 feet of the beast takes 1d10 Fire Damage and must surpass Physique TN 8 + Resist bonus or suffer 1 Fatigued condition from choking on the air.\n\nObsidian Siege Plating: Its scales shatter standard weapons on impact. If a physical Melee attack fails to beat the dragon's Defense of 9 or fails to deal more than 30 damage (after mitigation), the attacker's weapon violently shatters, becoming permanently destroyed (magical weapons lose 1 tier of effectiveness instead).\n\nIncinerate the Weave: The dragon's internal heat destroys latent magic. Any player attempting to cast a spell within 60 feet of the dragon must spend an additional Focus point (or take 10 Fire Damage) simply to force the magic to manifest through the superheated air.\n\nAction-Based Abilities\nAsh-Blight Breath (Range Cost: 2 Actions): The dragon unhinges its jaws, unleashing a terrifying vortex of pitch-black, magic-consuming fire. Make a Ranged attack (+5 To-Hit) against a 60-foot cone. On a hit, it deals 1d10 + 40 Fire/Necrotic Damage. Additionally, the black fire instantly incinerates any active magical buffs, shields, or enchantments on the targets, stripping them completely.\n\nHurricane Wings (Range Cost: 1 Action): The dragon beats its vast, powerfully corded wings, generating a blast of superheated wind. Make a Ranged attack (+5 To-Hit) against all enemies in a 40-foot frontal arc. On a hit, targets take half damage 1d10 + 20 and are violently blown 30 feet backward, landing Prone.\n\nMolten Crush (Melee Cost: 1 Action): The dragon brings its massive, obsidian-plated mass down on a target. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 60 damage. If the target is currently Prone, the sheer weight ignores 50% of the target's Armor Mitigation.`},
{name:`Banshee: The Keening Void`,size:`Medium`,type:`Undead / Incorporeal`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`"The wind does not howl in these moors; it weeps. And when that weeping turns to a rhythmic, soul-piercing keening, you do not run. To hear the Banshee is to know that your thread has already been cut." A Banshee appears as a luminous, ethereal silhouette of a woman draped in tattered burial silks that float as if submerged in water. Her skin is the color of bruised moonlight, stretched thin over a face frozen in agonizing sorrow. Her sunken, lidless eyes are voids of swirling gray mist, and her hair flows like white stringy smoke, defying gravity. When she prepares to strike, her jaw unhinges to reveal a huge, gaping mouth—a dark abyss from which her supernatural voice erupts.`,agl:6,awa:5,cha:8,int:3,phy:2,wil:9,move:20,ap:3,def:7,wmArmor:0,wmBS:30,wmDP:`Immune`,wounds:35,focus:`+3/9`,reroll:1,luck:1,meleeHit:`0`,meleeDmg:`0`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+6`,castDmg:`+30`,castHeal:`0`,castType:`Necromantic`,fear:`7`,mob:`1`,gear:`Tattered, floating burial silks.`,meleeDetail:`None`,rangeDetail:`None`,abilities:`Passive Traits\nEthereal Silks: As an incorporeal entity, the Banshee takes only half damage from all non-magical physical weapons. She is completely immune to the Grappled, Prone, Bleeding, Poison, and Disease conditions. She can drift through solid stone walls, locked doors, and other creatures as if they were mist.\n\nThe Cut Thread: The Banshee knows whose time has come. At the start of the encounter, the Banshee fixates on the party member with the lowest current Wounds. All of her To-Cast rolls against that specific target automatically gain Advantage, and she completely ignores any cover or line-of-sight penalties when targeting them.\n\nEchoes of Sorrow: Because her body is made of "bruised moonlight" and mist, any physical Melee attack that successfully strikes her causes the attacker's weapon to pass through her freezing form. The attacker immediately takes 1d10 Cold Damage from the chilling contact.\n\nAction-Based Abilities\nThe Soul-Piercing Keening(TN11) (Casting Cost: 2 Actions): The Banshee's jaw unhinges into a dark abyss, unleashing a rhythmic, devastating shriek in a 40-foot cone. Make a Casting roll (+6 To-Cast) against all enemies in the area. On a success, targets take 2d10 + 30 Sonic/Necrotic Damage. They must also surpass Willpower TN 12 + Resist bonus or suffer 1 Fatigued condition and become Shaken (unable to willingly move closer to her) as their soul trembles.\n\nGrasp of the Grave (Casting Cost: 1 Action): The Banshee reaches out a translucent, glowing hand toward a target within 30 feet. Make a Casting roll (+6 To-Cast). If successful, it deals 40 Necrotic Damage. The target's Movement is instantly halved for their next turn as the ethereal cold seeps into their marrow.\n\nMist-Step Fade (Cost: 1 Action): Driven by her fractured focus, the Banshee instantly dissolves into stringy, gray smoke. She immediately Disengages from all melee combat without triggering any free attacks and teleports up to 30 feet away to an unoccupied space she can see, resetting her position to continue her mournful weeping from afar.`},
{name:`Basilisk: The Stone-Gazer`,size:`Large`,type:`Fantasy Lizard`,tier:`Boss`,tierColor:`#b91c1c`,desc:`"The first thing you'll notice is the silence. No birds, no insects—just a garden of statues, frozen in expressions of absolute terror. If you feel a hot, chemical breath on your ankles, it's already too late." The Basilisk is a low-slung, heavy-bodied reptilian predator with eight powerful legs that allow it to scale cavern walls with terrifying speed. Its mottled, toxic green scales shimmer with a poisonous, oily sheen, and a jagged crimson crest crowns its head. Its most lethal feature is its pale, glowing yellow eyes, which project a primordial magical force capable of turning blood to silt and flesh to flint in a matter of seconds.`,agl:5,awa:7,cha:2,int:4,phy:9,wil:8,move:20,ap:3,def:6,wmArmor:15,wmBS:15,wmDP:`Immune`,wounds:160,focus:`+2/6`,reroll:1,luck:1,meleeHit:`+3`,meleeDmg:`+20`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+25`,castHeal:`0`,castType:`Shaman`,fear:`4`,mob:`1-2`,gear:`None`,meleeDetail:`Toxic Jaws`,rangeDetail:`None`,abilities:`Passive Traits\nEight-Legged Scuttler: The Basilisk treats completely vertical cavern walls and ceilings as normal terrain. It can climb and hang upside down effortlessly without making any Agility checks, making it a terrifying ambush predator from above.\n\nOily, Toxic Sheen: The Basilisk's mottled green scales secrete a highly corrosive poison. Any time an attacker successfully hits the Basilisk with a physical melee weapon, the attacker must surpass Agility TN 7 + Resist bonus or immediately take 1d10 Acid Damage as the toxic sheen splashes back onto them.\n\nAvert Your Eyes: At the start of their turn, any player within 40 feet of the Basilisk can declare they are "Averting their Eyes." Doing so gives them automatic Disadvantage on all To-Hit and To-Cast rolls against the Basilisk for that round, but completely immunizes them from the beast's Flesh to Flint ability.\n\nAction-Based Abilities\nFlesh to Flint(TN9) (Casting Cost: 2 Actions): The Basilisk locks its pale, glowing yellow eyes onto a target within 40 feet who has not averted their eyes. Make a Casting roll (+4 To-Cast). If successful, it deals 25 Transmutation damage as the victim's blood turns to silt. The target must pass a severe Willpower(12) test. On a failure, they are inflicted with the Petrifying condition (their Movement is permanently reduced to 0, and they lose 1 Action per turn). If a target with the Petrifying condition fails a second surpass Willpower TN 7 + Resist bonus on a subsequent turn, they are permanently turned to solid stone until magically cured.\n\nChemical Plume(TN10) (Casting Cost: 2 Actions): The Basilisk exhales a searing cloud of chemical breath in a 15-foot cone at ankle-level. All enemies in the area must surpass Physique TN 11 + Resist bonus. On a failure, they take 2d10 + 25 Acid/Poison Damage, gain 1 Poison condition, and are temporarily Blinded for their next turn as the fumes burn their eyes.\n\nAmbush Snap (Melee Cost: 1 Action): A brutal, lunging bite used when dropping from the ceiling. Make a Melee attack (+3 To-Hit). If successful, it deals normal 1d10 + 20 damage and the target is Grappled in the Basilisk's heavy jaws, unable to move away from the creature's deadly gaze on their next turn.`},
{name:`Beastman Shaman: The Horned Oracle`,size:`Medium`,type:`Humanoid / Beastman`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`While a typical Beastman relies on a rusted axe and raw sinew, the Shaman finds power in the rot of the woods and the alignment of blood-moons. Draped in molted furs, clattering bone charms, and smelling of wet dog and ozone, they serve as the spiritual anchors of the warband. They don't "study" magic; they seize it like a predator catching prey. Their rituals are loud, messy, and involve the rhythmic beating of hooves against the earth to churn up the "Old Winds"—the raw, unfiltered essence of nature's spite.\n\nCasting Details - The Old Winds`,agl:5,awa:7,cha:1,int:12,phy:9,wil:8,move:14,ap:4,def:6,wmArmor:10,wmBS:20,wmDP:15,wounds:65,focus:`+3/9`,reroll:1,luck:1,meleeHit:`+3`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+5`,rangeHeal:`0`,castHit:`+6`,castDmg:`+30`,castHeal:`+10`,castType:`Shaman`,fear:``,mob:`1`,gear:`Clattering Bone Staff, Molted Furs, Blood-Moon Charms`,meleeDetail:`Bone Staff`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nRot of the Woods (Aura): Fungi, grasping roots, and mold rapidly bloom wherever the Shaman's hooves touch the earth. The ground within a 20-foot radius of the Shaman is permanently considered Difficult Terrain for all non-Beastman creatures, halving their Movement speed and forcing Agility tests to sprint.\n\nThe Old Winds (Messy Magic): The Shaman's magic is violently unfiltered. Whenever the Shaman successfully casts a spell, the surrounding environment reacts; the sudden change in atmospheric pressure causes any enemy within 10 feet of the Shaman to automatically take 1d10 blunt damage from churning earth, flying debris, and ozone backlash.\n\nPredator's Seizure: Seizing magic like a wolf catching prey, the Shaman is highly opportunistic. The Shaman automatically gains Advantage on all Casting To-Hit rolls against targets that are currently suffering from the Blinded, Prone, or Poison conditions.\n\nAction-Based Abilities \nBlood-Moon Spores(TN9) (Casting Cost: 1 Action): The Shaman crushes a bone charm, releasing a 20-foot cloud of toxic, rust-colored spores up to 40 feet away. The cloud obscures all vision (blocking line-of-sight) and persists until the Shaman's next turn. Any enemy entering or starting their turn in the cloud must surpass Physique TN 9 + Resist bonus or become Blinded and suffer 1 Poison condition.\n\nGrasping Roots(TN8) (Casting Cost: 2 Actions): The Shaman slams its staff into the dirt. Make a Casting roll (+6 To-Cast) against a target within 50 feet. If successful, animated, rotting vines erupt from the soil, dealing 2d10 + 30 Nature damage. The target is Grappled (Movement 0) and perfectly set up for the Beastman frontline.\n\nSacrifice and Surge(TN11) (Casting Cost: 2 Actions): The Shaman's desperate, spiteful trump card. The Shaman draws on the life force of an adjacent allied Beastman (or nearby living flora), dealing 20 damage to them to heal itself for 20 damage. The Shaman then immediately unleashes a devastating Lightning Call in a 40-foot line. Make a Casting roll (+6 To-Cast) against all targets in the line. On a success, it deals an overcharged 3d10 + 30 Lightning Damage.`},
{name:`Beastman Warrior: The Horned Grunt`,size:`Medium`,type:`Humanoid / Beastman`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A nightmare of muscle, coarse fur, and jagged iron. Standing a head taller than most men and significantly wider, they are built for the "crush." They don't fight with the discipline of a soldier or the grace of a duelist; they fight with the desperate, explosive energy of a cornered predator that has finally broken free. In battle, they are a wall of noise—bleating, roaring, and the rhythmic clatter of hooves on stone. They despise civilization, taking perverse joy in hacking down stone monuments and burning silk`,agl:6,awa:5,cha:1,int:2,phy:9,wil:7,move:13,ap:3,def:8,wmArmor:7,wmBS:8,wmDP:20,wounds:35,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+10/18(2H)`,meleeHeal:`0`,rangeHit:`+1`,rangeDmg:`+9`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`10-30`,gear:`Scavenged Iron Plate, Jagged Rusted Cleaver, Throwing Hatchet.`,meleeDetail:`Jagged Cleaver`,rangeDetail:`Hurled Hatchet`,abilities:`Passive Traits \nThe Herd Mentality: Beastmen draw terrifying confidence from the smell of their kin's sweat and the sound of the Bray-horn. If a Beastman Warrior starts its turn within 15 feet of at least two other conscious Beastmen, it gains Advantage on all Willpower tests and its Melee attacks deal an additional +3 damage as the "meat-grinder" engages.\n\nRelentless Pursuit (Scent of Blood): Once they catch a scent, they will run until their lungs burn. If any enemy within 60 feet is currently suffering from a Bleeding condition, the Beastman's Movement speed increases by +15Ft when moving directly toward that target, and it completely ignores all Movement penalties from Difficult Terrain during the chase.\n\nDespiser of Stone: Taking perverse joy in destroying civilization, the Beastman's attacks deal double damage to any physical structures, barricades, magical stone walls, and constructs (like Golems). They will aggressively sunder player shields if given the chance.\n\nAction-Based Abilities \nThe Crush (Melee Cost: 2 Actions): The Beastman launches itself with the explosive energy of a cornered predator. It moves up to its Movement speed in a straight line and makes a Melee attack (+4 To-Hit). If it hits, the target takes 1d10 + 18 damage and must surpass Physique TN 9 + Resist bonus or be violently knocked Prone by the sheer mass of the charge.\n\nJagged Butcher (Melee Cost: 1 Action): A brutal, wild swing with its rusted cleaver. Make a Melee attack (+4 To-Hit). If this attack hits a target that is currently Prone, it automatically inflicts 1 Bleeding condition as the jagged iron tears through armor.\n\nWall of Noise (Cost: 1 Action): The Beastman beats its chest and unleashes a terrifying, bleating roar. It chooses one allied Beastman within 30 feet. That ally immediately gets to use its Reaction to move 15 feet toward the nearest bleeding or fleeing enemy, keeping the relentless pressure on the party.`},
{name:`Beastman: Greater Gore Beast`,size:`Giant`,type:`Aberration / Monstrosity`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`"It does not simply eat; it consumes the very concept of life. When you see the multiple limbs threshing the air and the ribcage that splits open like a second, jagged mouth, you realize that nature didn't create this—it's a wound in reality that has learned how to walk." The Gore Beast is a towering, nightmarish fusion of muscle and bone, standing nearly 15 feet tall. Its body is a knotted mass of scarred, flayed flesh. It possesses four primary limbs: two massive, trunk-like arms ending in obsidian claws, and two smaller, sickle-like appendages used for delicate evisceration. Its head is a terrifying eyeless skull-dome with a vertical maw. Most unsettling is its hollow thoracic cavity—a jagged "rib-gate" that clamps shut to pull victims into its internal digestive acidic pits.`,agl:7,awa:9,cha:1,int:0,phy:18,wil:12,move:23,ap:3,def:8,wmArmor:15,wmBS:10,wmDP:20,wounds:380,focus:`0`,reroll:2,luck:0,meleeHit:`+6`,meleeDmg:`+30/60(2H)`,meleeHeal:`0`,rangeHit:`+4`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`Wizardry`,fear:`6`,mob:`1`,gear:`None`,meleeDetail:`Obsidian Trunks & Sickles`,rangeDetail:`Bone Shrapnel`,abilities:`Passive Traits \nWound in Reality: The Gore Beast does not belong in this world, and the universe passively degrades around it. Any living creature that starts its turn within 20 feet of the Gore Beast regain Wounds by half whether by magical, potion or physical means.\n\nFlayed Titan Anatomy: Because its body is a chaotic, stitched-together mass of externalized organs and scarred meat, the Gore Beast has no discernible weak points. It is completely immune to Critical Hits (they deal normal damage) and the Bleeding condition.\n\nJagged Thorax (Reactive Hunger): The split, hollow ribcage operates with an autonomous, predatory reflex completely separate from the beast's main skull. Whenever an enemy successfully lands a Melee attack against the Gore Beast from an adjacent space, the jagged, bone-needle ribs violently snap shut on the attacker's overextended weapon or arm. The attacker automatically suffers 1d10 Piercing/Acid Damage from the crunching bone and corrosive internal bile. This makes close-quarters combat against the beast an absolute, unavoidable meat-grinder.\n\nAction-Based Abilities \nSickle Evisceration (Melee Cost: 1 Action): The beast lashes out with its smaller, razor-sharp secondary arms. Make a Melee attack (+6 To-Hit). If successful, it deals half damage 1d10 + 30 but automatically severs the straps of the target's armor, permanently reducing their Armor Mitigation by 2.\n\nObsidian Trunk Smash (Melee Cost: 2 Actions): The beast brings its massive primary arms down like falling trees. Make a Melee attack (+6 To-Hit). If successful, it deals 2d10 + 60 damage and the target is violently knocked Prone and Stunned for 1 round.\n\nSeismic Meat-Stomp (melee Cost: 3 Actions): The Gore Beast lifts a massive, scarred foot and drives it into the earth with terrifying force. A 20-foot radius around the Beast violently shatters. All enemies in the area must pass a severe Agility(12) test. On a failure, they take 3d10 + 30 Bludgeoning Damage and are violently knocked Prone. Any target that is already Prone before the stomp takes double damage as they are crushed into the dirt like an insect.\n\nReality Vomit (Range Cost: 2 Actions): Utilizing its Ranged To-Hit (+4), the beast forcefully expels a stream of anti-life acid from its primary maw up to 40 feet away. Targets hit take 3d10 + 20 Acid Damage and gain 2 Poison conditions.`},
{name:`Beholder-Kin: The Eye-Tyrant`,size:`Large`,type:`Aberration`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Beholder is a floating orb of xenophobic madness. It views itself as the pinnacle of evolution and all other life as a disgusting mistake to be erased. It is the ultimate "anti-meta" monster, designed to completely shut down the party's strongest abilities. It does not fight you physically; it calculates your exact strategy and dismantles it with a terrifying array of alien eye-rays and an overwhelming anti-magic presence.`,agl:2,awa:6,cha:5,int:9,phy:1,wil:7,move:20,ap:3,def:8,wmArmor:10,wmBS:20,wmDP:30,wounds:75,focus:`+2/6`,reroll:2,luck:1,meleeHit:`+1`,meleeDmg:`+4`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+40`,castHeal:`0`,castType:`Wizardry`,fear:`6`,mob:`1`,gear:`None`,meleeDetail:`Special Abilities`,rangeDetail:`Special Abilities`,abilities:`Passive Traits \nThe Anti-Magic Cone: The Eye-Tyrant's massive central eye projects a 60-foot cone of suppressed reality. At the start of its turn, it decides which direction the eye faces. Any player inside that cone is completely Silenced (cannot cast spells), and any active magical buffs, auras, or magical weapon properties they possess are temporarily disabled while they remain in the cone.\n\n360-Degree Paranoia: Because of its writhing crown of eyestalks, the Tyrant can never be caught off guard. It is completely immune to the Blinded condition, cannot be Flanked by melee attackers, and completely negates any Advantage players might gain from attacking out of Stealth.\n\nXenophobic Levitation: The Eye-Tyrant never touches the dirt of the lesser races. It is immune to all ground-based traps, spells, and Difficult Terrain. Furthermore, it takes zero Wounds from falling, simply arresting its momentum telekinetically.\n\nAction-Based Abilities \nRay of Exhaustion(TN6) (Casting Cost: 1 Action): The Tyrant targets the party's physical powerhouse. Make a Casting roll (+4 To-Cast) against a target within 60 feet. On a hit, it deals no Wounds, but the target instantly gains 2 Fatigued conditions and loses half their Movement on their next turn as the ray saps their will to live.\n\nTelekinetic Reposition(TN7) (Casting Cost: 1 Action): The Tyrant takes control of the battlefield. It targets one enemy within 60 feet. The target must surpass Willpower TN 9 + Resist bonus or be violently thrown 20 feet in any direction the Tyrant chooses (including into hazards or directly out of melee range), taking 1d10 + 15 blunt damage upon landing.\n\nDisintegration Beam(TN12) (Casting Cost: 2 Actions): The ultimate punisher. Make a Casting roll (+4 To-Cast) against a single target within 40 feet. If successful, it deals an agonizing 3d10 + 40 Aberrant damage. If this attack misses, or if the target uses a physical shield/barricade to block it, the object used as cover is instantly reduced to fine gray dust.`},
{name:`Bin Uluhm Engineer Overseer: The Iron Tyrant`,size:`Medium`,type:`Humanoid / Artificer`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Engineer Overseers are the dark architects of Bin Uluhm. Encased in bulky, steam-hissing volcanic exoskeletons, they rarely walk when they can ride a mechanized walker or simply lumber forward on pneumatic leg-braces. They possess a terrifying intellect dedicated entirely to the art of mass destruction and subjugation. They do not fight with mere swords; they wield explosive alchemy, pneumatic hammers, and clockwork horrors. To them, the lives of their slaves and soldiers are merely resources to be spent testing a new weapon.`,agl:1,awa:5,cha:2,int:9,phy:6,wil:8,move:8,ap:3,def:7,wmArmor:20,wmBS:10,wmDP:25,wounds:75,focus:`+1/3`,reroll:2,luck:2,meleeHit:`+4`,meleeDmg:`+30`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`0`,mob:`1`,gear:`Pneumatic Forge-Hammer, Shoulder-Mounted Magma Mortar, Volcanic Exoskeleton`,meleeDetail:`Pneumatic Forge-Hammer`,rangeDetail:`Voild-Rifle`,abilities:`Passive Traits\nCruel Efficiency: The Overseer demands perfection from his forces. If an allied Bin Uluhm Dwarf or slave within 30 feet misses an attack, the Overseer can instantly use his Reaction to vent a jet of scalding steam at them, dealing 5 Fire Damage to the ally but forcing the attack to be rerolled with Advantage.\n\nVolcanic Exoskeleton: The Overseer is immune to the Burning and Poisoned conditions. Furthermore, because he is mostly encased in machinery, any Critical Hit scored against him by a physical weapon only deals normal damage, as the attacker merely severs a pneumatic hose or dents a cog rather than striking a vital organ.\n\nVolatile Munitions: All of the Overseer's weapons are laced with explosive black-powder or magma. His Melee and Ranged attacks completely ignore physical shields, blasting right through the block and dealing full Wounds to the defender.\n\nAction-Based Abilities\nPneumatic Overdrive (Melee Cost: 1 Action): The Overseer triggers the pistons in his hammer for a devastating strike. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 30 damage, and the sheer kinetic force knocks the target 10 feet backward and inflicts 1 Stunned condition from the concussive shockwave.\n\nDeploy Crawling Mine (Range Cost: 2 Actions): The Overseer throws a mechanized, spider-like bomb onto the battlefield. The Mine has 10 Hit Points and acts on Initiative Count 0. It will scurry up to 30 feet toward the nearest player and detonate, dealing 2d10 + 20 Fire/Piercing Damage to everyone in a 10-foot radius.\n\nMagma Mortar (Range Cost: 2 Actions): He fires a glob of cooling magma from his shoulder cannon. Make a Ranged attack (+3 To-Hit) against a target within 40 feet. On a hit, it deals 2d10 + 25 Fire Damage, and the target's Movement is halved on their next turn as the magma rapidly hardens into heavy slag around their boots.`},
{name:`Black Dragon: The Rot-Lord`,size:`Giant`,type:`Dragon / Monstrosity`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Black Dragon is visually distinct for its sunken, skull-like face. Its skin has receded around its snout, giving it a permanent, skeletal grin. Its horns curve forward like a crown of blackened bone, and its scales are dull, matte black, designed to absorb the dim light of the marsh. They are the masters of ambushes. A Black Dragon doesn't roar a challenge; it waits submerged in a pool of acid-filled muck, breathing through its nostrils like a crocodile, until its prey is waist-deep. They find joy in the "Slow Kill," often letting a victim crawl away just so they can track the scent of their melting flesh through the trees.`,agl:5,awa:12,cha:4,int:7,phy:15,wil:8,move:`27/33S`,ap:3,def:9,wmArmor:25,wmBS:20,wmDP:`Immune`,wounds:306,focus:`+2/6`,reroll:2,luck:1,meleeHit:`+6`,meleeDmg:`+40`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+40`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`8`,mob:`1`,gear:`Random`,meleeDetail:`Skeletal Jaws & Bone-Crown`,rangeDetail:`Melting Acid`,abilities:`Passive Traits\nCrocodilian Ambush: As long as the Black Dragon is submerged in water or deep mud, it is virtually invisible, absorbing all light. It automatically gains Advantage on Stealth checks to initiate combat. If it attacks a target from submerged Stealth, the attack cannot be dodged or parried, and automatically Grapples the victim on a hit.\n\nThe Slow Kill: The dragon delights in suffering. It automatically gains Advantage on all Melee attacks against any target that is currently suffering from a Bleeding, Poisoned, or Acid condition. Furthermore, it can track the scent of these conditions flawlessly, making it impossible for wounded players to hide from it.\n\nMatte-Black Scales: The dull, light-absorbing nature of its hide makes it incredibly difficult to target from afar in its natural habitat. While in dim light, fog, or darkness, the dragon cannot be targeted by Ranged or Casting attacks from further than 30 feet away.\n\nAction-Based Abilities\nEruption from the Muck (Melee Cost: 1 Action): The dragon bursts from the bog, snapping its skull-like jaws. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 40 normal damage and the target is instantly Grappled. The sheer force of the displacement knocks all other enemies within 15 feet Prone.\n\nBreath of the Rot-Lord (Range Cost: 3 Actions): The dragon exhales a concentrated stream of highly corrosive, black acid. Make a Ranged attack (+5 To-Hit) against all targets in a 60-foot line. On a hit, targets take 3d10 + 40 Acid Damage, and their armor is permanently degraded (losing 5 points of Damage Mitigation). Targets also gain 1 Poisoned/Acid condition.\n\nThe Drowning Drag (Cost: 1 Action): The dragon violently pulls a Grappled target back into the acidic water with it. The dragon moves up to 25 feet (taking the target with it). The target takes 30 Bludgeoning Damage from the crushing jaws and must immediately begin rolling against your game's Drowning/Suffocation mechanics.`},
{name:`Blight Elf: Pale-Weald Archer`,size:`Medium`,type:`Humanoid / Blight Elf`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The raiders sent north are not the best of the Pale Weald — they are the ones expendable enough to risk on the crossing and capable enough to return with what was asked. The Archer is the operational core of every Blight Elf incursion: patient to the point of geological stillness, accurate with a bow that has been strung with something that does not snap in cold weather, and entirely uninterested in the moral dimensions of what they are doing. They have a quota. They intend to meet it. They intend to come home.`,agl:9,awa:10,cha:3,int:5,phy:5,wil:7,move:19,ap:2,def:16,wmArmor:2,wmBS:3,wmDP:0,wounds:40,focus:`+2/6`,reroll:0,luck:0,meleeHit:`+1`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`1`,rangeDmg:`+6`,rangeHeal:`1d10+8`,castHit:`0`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`None`,mob:`—`,gear:`1`,meleeDetail:`Pale-Weald Recurve Bow, Pale Weald Extract (×3 doses applied to arrows), Short-blade`,rangeDetail:`Short-blade (emergency only)`,abilities:`Passive Traits\nThe Cold Profession: Blight Elf Archers do not become Shaken from combat, from witnessing allies fall, or from Fear effects generated by anything below Boss tier. They are working. Work does not pause for feelings.\n\nQuota Priority: The Archer always knows which target on the battlefield represents the highest value to the Pale Weald's objectives — typically casters, healers, or anyone carrying visible magical items. It will prioritise that target unless doing so is tactically suicidal.\n\nPale Weald Extract (Passive): The first three successful ranged hits in any encounter apply Lesser Poison (1d10 damage/turn, surpass Physique TN 7 + Resist bonus each turn to end). The Archer carries exactly enough extract for one engagement. No more.\n\nAction-Based Abilities\nPrecision Shot (Ranged Cost: 2 Actions): A deliberate, placed shot at a specific joint or gap in armour. Make a Ranged att
