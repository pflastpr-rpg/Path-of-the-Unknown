{name:`Goblin: The Night-Cutter`,size:`Small`,type:`Humanoid / Goblinoid`,tier:`Minion`,tierColor:`#607080`,desc:`A Night-Cutter stands roughly 3 to 4 feet tall, with a wiry, lean body and skin the color of bruised plums or stagnant moss. Their oversized ears constantly twitch, catching the slightest sound of approaching footsteps, and their wide, needle-toothed mouths are usually twisted into a mocking grin. They are never found alone; where there is one, ten more lurk in the shadows. Clad in "Scrap-Plate" made from hammered pot lids and rusted chain, they wield jagged, filth-coated blades and "Boom-Pots" filled with unstable alchemical sludge. They value winning over honor, and will scatter the moment a fight turns against them—only to return minutes later with reinforcements.`,agl:6,awa:5,cha:-1,int:4,phy:0,wil:0,move:12,ap:3,def:4,wmArmor:5,wmBS:3,wmDP:10,wounds:12,focus:`0`,reroll:0,luck:1,meleeHit:`+1`,meleeDmg:`+6`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+7`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`5-50`,gear:`crap-Plate, Jagged Filth-Shank, 1d3 Boom-Pots`,meleeDetail:`Jagged Filth-Shank`,rangeDetail:`Boom-Pot`,abilities:`Passive Traits\nStrength in the Shadows: A Night-Cutter fights dirty. They automatically gain Advantage on all To-Hit rolls as long as there is at least one conscious allied Goblin adjacent to their target.\n\nTwitching Ears: Their massive ears act like radar. Night-Cutters are completely immune to the Surprised condition and cannot be flanked by conventional stealth.\n\nCoward’s Retreat: If a Night-Cutter takes damage that drops its Wounds below 50% (6 damage or less), it immediately uses a free Reaction to Disengage (preventing attacks of opportunity) and moves its full 18 Movement speed directly away from the source of the damage, screaming for help.\n\nAction-Based Abilities\nFilth-Shank (Melee Cost: 1 Action): The goblin violently stabs at an enemy's exposed joints. Make a Melee attack (+1 To-Hit). If successful, it deals 1d10 + 6 Piercing Damage, and the target must surpass Physique TN 6 + Resist bonus or gain 1 Poisoned condition from the rusty, feces-coated blade.\n\nBoom-Pot Lob (Range Cost: 2 Actions): The goblin lights the fuse on an unstable alchemical sludge-pot and hurls it. Make a Ranged attack (+2 To-Hit) targeting a specific square up to 30 feet away. The pot explodes in a 10-foot radius. All creatures in the blast zone must surpass Agility TN 6 + Resist bonus or take 15 Fire/Acid Damage. (Note: Goblins do not care about friendly fire and will happily catch their allies in the blast).\n\nScuttle & Hide (Cost: 1 Action): The goblin leverages its tiny size. It may move up to 15 feet and immediately gain Total Concealment if it ends its movement behind cover or in dim light.`},
{name:`Gold Dragon: The Aureate Sovereign`,size:`Titanic`,type:`Dragon / Celestial`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A majestic, serpentine titan covered in scales of actual organic metal, harder than any forged steel. Their heads are feline and regal, featuring long, flowing whiskers that crackle with static energy and a mane of metallic hair. They act as the "Final Arbiters" of the world. Famous for walking among mortals, they often spend centuries as humble scholars or advisors before revealing their gargantuan, radiant nature to enforce cosmic balance. If a war threatens to unbalance reality, an Aureate Sovereign descends to impose a magical treaty—or incinerate both sides.`,agl:3,awa:6,cha:7,int:15,phy:21,wil:8,move:`27/80F`,ap:4,def:9,wmArmor:45,wmBS:35,wmDP:`Immune`,wounds:800,focus:`+4/12`,reroll:3,luck:2,meleeHit:`+7`,meleeDmg:`+70`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+50`,rangeHeal:`0`,castHit:`+5`,castDmg:`+40`,castHeal:`0`,castType:`Wizardry`,fear:`11`,mob:`1`,gear:`The accumulated knowledge and artifacts of a dozen fallen empires`,meleeDetail:`Feline Jaws & Golden Talons`,rangeDetail:`Sovereign's Incineration`,abilities:`Passive Traits\nMortal Guise: The Sovereign can shapeshift into a medium-sized humanoid (usually a humble scholar or aged advisor) at will. While in this form, it retains its 15 Intelligence and 8 Willpower, but its Physical and Defense stats drop to mortal levels. It can revert to its Titanic true form as a free Reaction, instantly shattering the guise in a blinding flash of golden light.\n\nAura of the Arbiter: The dragon's presence enforces cosmic law. The area within 120 feet of the Sovereign is an absolute Zone of Truth; no creature can knowingly speak a lie. Furthermore, any enemy attempting to cast a hostile spell within this aura must surpass Willpower TN 10 + Resist bonus, or the spell instantly fizzles and their Action is wasted.\n\nOrganic Metal Carapace: The dragon's scales are harder than forged steel. The Sovereign is completely immune to all non-magical Slashing and Piercing damage. Any mundane weapon that strikes the dragon shatters on impact.\n\nAction-Based Abilities\nSovereign’s Strike (Cost: 1 Actions): The dragon sweeps its massive golden claws or snaps its feline jaws. Make a Melee attack (+7 To-Hit) with a 40-foot reach. If successful, it deals 1d10 + 70 Slashing/Piercing Damage, and the target is knocked Prone and Restrained beneath the titan's claws.\n\nStatic Whisker Lash (Cost: 3 Actions): The dragon whips its crackling, energy-infused whiskers across the battlefield. Target up to three enemies within 150 feet. They must pass a severe Agility(12) test or take 1d10 + 50 Lightning Damage and become Stunned (lose their next Action) from the electrical shock to their nervous system.\n\nIncinerate the Imbalance (Range Cost: 4 Actions): The Sovereign opens its maw and unleashes a localized sun. Make a Ranged attack (+5 To-Hit) against a massive 90-foot cone. On a hit, all targets take 6d10 + 50 Radiant/Fire Damage. This breath weapon instantly disintegrates any environmental cover, magical barriers, or structures, leaving behind only smooth, glowing glass.`},
{name:`Gorathi Lord: The World-Root`,size:`Enormous`,type:`Elemental Lord (Earth)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Lord of Earth is a gargantuan entity that resembles a mountain range forged into a sentient, humanoid shape. Its body is composed of ultra-dense "Singularity Granite" and pulsating obsidian, held together by a core of molten gold and raw crystalline power. Its head is a jagged peak of indestructible quartz with eyes like twin suns burning within the deep crust. Where the Air Lord is erratic and swift, the Earth Lord is inevitable. It is the master of Gravitational Law. To stand in its presence is to feel your own bones creak under doubled gravity. It is the absolute authority on stability—it can turn a raging sea to solid salt or a fortress to liquid sand with a single thought.`,agl:4,awa:5,cha:7,int:8,phy:18,wil:12,move:27,ap:3,def:9,wmArmor:35,wmBS:20,wmDP:`Immune`,wounds:650,focus:`+2/6`,reroll:3,luck:2,meleeHit:`+6`,meleeDmg:`+60`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`Druidism`,fear:`8`,mob:`1`,gear:`Special`,meleeDetail:`Singularity Fists`,rangeDetail:`Gravitational Crush`,abilities:`Passive Traits\nGravitational Law (Doubled Gravity): The World-Root dictates the physics around it. The area within 60 feet of the Lord is subjected to doubled gravity. Any enemy starting their turn in this aura instantly takes 10 Bludgeoning Damage as their bones creak, and their Movement is permanently halved. Flying within this aura is completely impossible.\n\nAbsolute Stability: The Lord cannot be moved, altered, or debuffed against its will. It is completely immune to all forced movement, teleportation, Prone, Stunned, and polymorph/transmutation effects.\n\nSingularity Granite: Weapons that strike the World-Root are subjected to the intense gravitational pull of its hide. If a physical Melee attack fails to deal more than 10 damage (after mitigation is applied), the attacker's weapon is instantly caught in the gravitational field, requiring an Action and a severe surpass Physique TN 7 + Resist bonus to rip it free before it can be used again.\n\nAction-Based Abilities\nTectonic Obliteration (Melee Cost: 1 Action): The Lord brings a molten-gold infused fist down upon the battlefield. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 60 damage, and the sheer force of the impact triggers a localized earthquake, forcing everyone within 20 feet of the target to surpass Agility TN 12 + Resist bonus or fall Prone.\n\nTransmute to Liquid Sand (Range Cost: 3 Actions): The Lord weaponizes its alchemical authority to swallow its enemies. It targets a 20-foot radius of ground within 60 feet. Make a Ranged attack (+5 To-Hit) against all enemies in the zone. On a hit, the ground turns to liquid sand; targets take 3d10 + 20 damage and are instantly Grappled and Restrained, buried up to their chests.\n\nGravitational Crush (Range Cost: 1 Action): The World-Root simply looks at a target and increases their personal gravity tenfold. Make a Ranged attack (+5 To-Hit) against a single target within 60 feet. If successful, it deals 1d10 + 30 Force/Bludgeoning Damage, completely ignoring the target's equipped armor mitigation as the damage comes from the target's own collapsing weight.`},
{name:`Gorathi: The Mountain-Heart`,size:`Giant`,type:`Elemental (Earth)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A Greater Earth Elemental is not merely formed from rock; it is bedrock given catastrophic motion. These titans are composed of entire ranges of obsidian, iron, and granite, forged over millennia by intense geothermal pressures. Its face is a blocky mask of smooth stone with deep eye sockets glowing with the orange light of a geothermal core. Where a standard Elemental is merely heavy, the Greater variant is gravity itself. They are fused with large, pulsating emerald geodes—their "Mountain-Heart"—that anchor their sentience and generate a localized gravitational field. In its wake, forests are pushed aside, the ground is pulverized, and loose rocks fall upward.`,agl:2,awa:5,cha:4,int:7,phy:15,wil:8,move:20,ap:3,def:9,wmArmor:30,wmBS:20,wmDP:`Immune`,wounds:400,focus:`0`,reroll:2,luck:0,meleeHit:`+6`,meleeDmg:`+40`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`0`,mob:`1`,gear:`None`,meleeDetail:`Tectonic Fists`,rangeDetail:`Gravitational Debris`,abilities:`Passive Traits\nGravitational Inescapability: The Mountain-Heart alters the gravity around it. The area within 40 feet of the elemental is considered extreme Difficult Terrain as loose rocks and debris float upward. Any flying creatures that enter this aura instantly have their flight speed reduced to 0 and crash to the ground. Furthermore, any enemy trying to move away from the elemental must spend 2 feet of Movement for every 1 foot traveled.\n\nBedrock Juggernaut: The elemental is completely immune to the Prone, Stunned, and Knockback conditions. It automatically destroys any environmental structures (trees, walls, towers) simply by walking through them, turning them to pulverized dust.\n\nGeothermal Rupture: The intense heat of its core makes it immune to Fire damage. If a player scores a Critical Hit against the elemental with a Melee weapon, they crack the obsidian shell, causing a sudden burst of liquid magma that deals 15 Fire Damage directly back to the attacker.\n\nAction-Based Abilities\nTectonic Pulverize (Melee Cost: 1 Action): The titan brings a massive, obsidian fist down upon the earth. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 40 Bludgeoning Damage. If the target is wielding a non-magical weapon or shield, it is instantly shattered by the impact.\n\nReverse Gravity (Cost: 3 Actions): The Mountain-Heart pulses with blinding emerald light, reversing gravity in a 30-foot cylinder anywhere within 60 feet. Every target in the cylinder must surpass Agility TN 10 + Resist bonus or "fall" 40 feet straight up into the air, hovering helplessly until the end of the elemental's next turn, at which point gravity normalizes and they slam back into the pulverized ground, taking massive falling damage (4d10 + 10) and landing Prone.\n\nGeode Pulse (Range Cost: 1 Action): The elemental fires a concentrated beam of gravitational and geothermal energy from its chest. Make a Ranged attack (+5 To-Hit) against a single target within 60 feet. On a hit, it deals 1d10 + 20 Force/Fire Damage and violently pulls the target 20 feet directly toward the elemental.`},
{name:`Gorathi: The Rubble-Clod`,size:`Medium`,type:`Elemental (Earth)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A chaotic, barely held-together amalgamation of loose dirt, jagged rocks, and torn roots. It lacks the deliberate humanoid shape of its larger kin, appearing more like a rolling, shambling mound of animated debris. It is completely mindless and moves with a sluggish, dragging gait, leaving a trail of mud and gravel in its wake. It doesn't strategize or understand formations; it simply lumbers forward and clumsily tries to bury whatever is in front of it.`,agl:-1,awa:3,cha:0,int:0,phy:6,wil:4,move:10,ap:2,def:5,wmArmor:10,wmBS:5,wmDP:`Immune`,wounds:35,focus:`0`,reroll:1,luck:0,meleeHit:`+2`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`+1`,rangeDmg:`+5`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`0`,mob:`1-4`,gear:`None`,meleeDetail:`Clumsy Debris Slam`,rangeDetail:`None`,abilities:`Passive Traits\nAmorphous Clod: Because it is just a held-together pile of dirt, it doesn't have vital organs. The Rubble-Clod is completely immune to the Bleeding condition and takes no extra damage from Critical Hits (the attacker merely knocks away a harmless chunk of stone).\n\nMud-Tether: Its dragging, muddy form ruins the terrain. Any space the Rubble-Clod currently occupies, or has walked through on its previous turn, is automatically considered Difficult Terrain for any non-Earth elementals.\n\nClumsy Mass: Due to its -1 Agility, it automatically fails any test to avoid being knocked Prone. However, because it has no true anatomy, standing back up from Prone costs it 0 Actions (it simply shifts its center of mass).\n\nAction-Based Abilities\nDebris Slam (Melee Cost: 1 Action): The creature simply falls forward or swings a heavy clump of roots. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 10 Bludgeoning Damage.\n\nFling Mud (Range Cost: 1 Action): The elemental tears off a piece of its own body and hurls it. Make a Ranged attack (+1 To-Hit) against a target within 20 feet. On a hit, it deals 1d10 +5 damage and the target is Blinded until they spend an Action to wipe the thick mud from their eyes.\n\nSinkhole (Cost: 2 Actions): The Rubble-Clod violently collapses its own form to trap an enemy. It targets an adjacent enemy. That enemy must surpass Agility TN 4 + Resist bonus or become Grappled and Restrained as the elemental turns into a localized pit of quicksand around their legs. The elemental cannot use Debris Slam while maintaining this grapple.`},
{name:`Gorathi: The Stone Vanguard`,size:`Large`,type:`Elemental (Earth)`,tier:`Elite`,tierColor:`#b45309`,desc:`A massive, bi-pedal construct composed of ancient granite and deep-vein ore. Unlike lesser forms, the Vanguard has a rough, deliberate humanoid shape. Its "face" is a blocky mask of smooth stone with two eyes glowing with the intense, orange light of a geothermal core. It moves with a terrifying, crushing rhythm—a slow but unstoppable stride that pulverizes the ground beneath its feet. It doesn't just block enemies; it seeks to turn them into pulp.`,agl:1,awa:5,cha:2,int:6,phy:9,wil:7,move:14,ap:3,def:8,wmArmor:20,wmBS:10,wmDP:`Immune`,wounds:100,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+20`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`0`,mob:`1-4`,gear:`None`,meleeDetail:`Granite Fists`,rangeDetail:`None`,abilities:`Passive Traits\nThe Unstoppable Stride: The Vanguard's mass is absolute. It is completely immune to the Prone, Grappled, and Knockback conditions to creatures of similar size. Furthermore, it ignores all Difficult Terrain, simply pulverizing obstacles, traps, and underbrush into flat dust as it walks over them.\n\nSiege Construct: Built to break fortifications, the Vanguard deals double damage to any physical shields, environmental cover (walls, boulders, doors), and stationary structures.\n\nTremorsense: The geothermal core in its head allows it to perfectly track the vibrations of anything touching the ground. It completely ignores visual penalties from darkness, fog, or invisibility as long as its target is standing on the earth within 60 feet.\n\nAction-Based Abilities\nPulverizing Slam (Cost: 1 Action): A deliberate, crushing blow from a granite fist. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 +20 Bludgeoning Damage. If this attack targets an enemy wielding a shield, the shield immediately loses 1 tier of effectiveness.\n\nTectonic Stomp (Melee Cost: 2 Actions): The Vanguard brings its massive foot down, weaponizing its own weight. Make a Melee attack (+4 To-Hit) against all targets within a 10-foot radius. On a hit, targets take 1d10 + 20 damage and are violently knocked Prone by the seismic shockwave.\n\nGeothermal Vent (Range Cost: 3 Actions): The Vanguard opens the plates on its "face," venting the intense heat of its core. Make a Ranged attack (+2 To-Hit) in a 30-foot line. On a hit, targets take 2d10 + 20 Fire Damage and their armor becomes superheated, causing them to take 5 Fire Damage at the start of their next turn.`},
{name:`Grabzug the Skull-Crusher`,size:`Large`,type:`Ork Boss (Greenskin)`,tier:`Elite`,tierColor:`#b45309`,desc:`A mountain of green muscle and jagged iron. He stands nearly nine feet tall, his skin a patchwork of battle scars and tribal tattoos. He carries 'The Divider,' a colossal rusted cleaver, and wears the stolen family heirloom as a trophy on his belt.`,agl:2,awa:5,cha:6,int:3,phy:12,wil:9,move:12,ap:4,def:9,wmArmor:9,wmBS:6,wmDP:7,wounds:120,focus:`+2/6`,reroll:2,luck:3,meleeHit:`+6`,meleeDmg:`+35`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:``,gear:`+2 Scavaged Plate`,meleeDetail:`"The Divider" (Colossal Cleaver),`,rangeDetail:`Throwing Axes`,abilities:`Passive Traits\nBoss Frenzy: When Grabzug drops below 30 damage, he enters a blood-mad frenzy. He gains +5 to all Damage but his Defense drops to 7.\n\nHeirloom Resonance: While Grabzug possesses the stolen relic, he gains Regeneration: 5. He heals 5 damage at the start of every one of his turns.\n\nUnstoppable Momentum (Passive): Grabzug ignores movement penalties. He cannot be "Pinned" or "Slowed" by non-magical means.\n\n\nAction Based Abilities\nIron-Grip Toss (Melee Cost 1 Action)\nGrabzug drops one hand from his cleaver, seizes a nearby "puny" foe by the throat, and hurls them into their allies.Target must be Medium size or smaller and within 5 feet.Grabzug rolls Melee (+6) vs. the target’s Defense.On a success, the target is launched 15 feet in a direction of Grabzug's choosing. The thrown target takes 10 damage (flat damage) and is Prone. If the target is thrown into another player, that player must pass an Agility (Grabzug to-hit roll) Test. On a failure, they also take 10 damage and are knocked Prone.\n\nSkullsmasher’s Roar (Cost 1 Action): Grabzug lets out a deafening war cry. All enemies within 10 feet must pass a surpass Willpower TN 7 + Resist bonus. On failure, they suffer a -2 penalty to accuracy for 1 round.\n\n`},
{name:`Grand Arcanist of the Third Order`,size:`Medium`,type:`Humanoid / Spellcaster (Hero)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A legendary spell-weaver who has synchronized their mind across three different planes of magic. Clad in the intricate, floating vestments of the Third Order, their eyes hum with raw, contained cosmic energy. They carry no blades or armor, viewing physical combat as a crude relic of lesser minds. A Grand Arcanist does not merely cast spells; they unravel and rewrite the physics of the battlefield. When they unleash their power, the air screams, and their spells hit with the apocalyptic kinetic force of a siege engine without them ever lifting a physical weapon.`,agl:2,awa:7,cha:6,int:9,phy:1,wil:8,move:20,ap:4,def:5,wmArmor:5,wmBS:25,wmDP:10,wounds:45,focus:`+5/15`,reroll:3,luck:4,meleeHit:`+3`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+35`,castHeal:`0`,castType:`Wizardry`,fear:``,mob:`1`,gear:`estments of the Third Order, Tri-Planar Focus Amulet`,meleeDetail:`Staff Strike`,rangeDetail:`Siege-Force Spells`,abilities:`Passive Traits\nSiege-Weaver: The Arcanist's spells carry terrifying kinetic mass. All Casting attacks made by the Arcanist deal double damage to environmental cover, non-magical shields, and physical structures, shattering them into shrapnel.\n\nPlanar Synchronization: The Arcanist exists slightly out of phase with physical reality. Any non-magical Ranged attack (like arrows or bolts) has a flat 50% chance to pass harmlessly through them. Furthermore, they are completely immune to the Silenced condition, able to cast spells purely through thought.\n\nArchmage’s Rebuttal: The Arcanist casually dismantles rival magic. If targeted by a hostile spell, the Arcanist can use a free Reaction to make a Willpower(15) test. On a success, the hostile spell is instantly countered (negated), and the Arcanist absorbs the dissipated mana, granting them +1 Action on their next turn.\n\nAction-Based Abilities\nTri-Planar Lance(TN7) (Casting Cost: 1 Action): The Arcanist fires a concentrated beam of solid kinetic magic. Make a Casting attack (+4 To-Hit) against a target within 80 feet. If successful, it deals 1d10 + 35 Force Damage. The target must pass a severe Physique(8) test or be violently knocked 20 feet backward and rendered Prone.\n\nArcane Singularity(TN10) (Casting Cost: 2 Actions): The Arcanist collapses the gravity in a specific zone. Target a 20-foot radius area up to 100 feet away. Make a Casting attack (+4 To-Hit). On a hit, all targets inside take 3d10 + 35 Force Damage. Any enemy within 15 feet of the outside edge of the zone must surpass Agility TN 6 + Resist bonus or be violently dragged into the center of the singularity.\n\nDimensional Fold(TN6) (Casting Cost: 1 Action): Rather than walking, the Arcanist folds space. They instantly teleport up to 60 feet to an unoccupied space they can see. The space they left behind detonates with a localized vacuum; any enemy adjacent to their starting position takes 10 Force Damage and is Deafened for 1 round.`},
{name:`Grave Wolf: The Earthen Sentinel`,size:`Medium`,type:`Undead / Beast`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Grave Wolf is the reanimated remnant of a hunting hound or wild wolf, twisted by dark magic to serve as an eternal sentinel for crypts and burying grounds. They are gaunt and horrifying; patches of matted, rotting fur cling to exposed ribs and jagged bone, and pale, green balefire burns in their empty eye sockets. They do not hunt for meat, but for the warmth of the living. They are known to burrow silently through the loose soil of graveyards, erupting from the earth to drag interlopers down into the dark.\n\nMove 30 Ground / 20 Burrow`,agl:9,awa:8,cha:1,int:2,phy:7,wil:5,move:`20/13B`,ap:3,def:6,wmArmor:6,wmBS:10,wmDP:`Immune`,wounds:35,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`4`,mob:`1-6`,gear:`None`,meleeDetail:`Necrotic Fangs`,rangeDetail:`None`,abilities:`Passive Traits\nGrave-Digger (Tremorsense): The Grave Wolf ignores Movement penalties when traveling through mud, loose earth, or graveyard soil. While burrowed, it possesses perfect Tremorsense up to 50 feet, allowing it to track moving targets above ground without needing to see them.\n\nCold-Blooded Pack Tactics: The hounds hunt with perfectly synchronized malice. A Grave Wolf automatically gains Advantage on its Melee To-Hit rolls if at least one allied Grave Wolf is adjacent to its target.\n\nBalefire Vision: The green flames in their sockets pierce the gloom. The wolf ignores all visual penalties from fog, non-magical darkness, and magical darkness.\n\nAction-Based Abilities\nErupting Ambush (Melee Cost: 1 Action): Can only be used while Burrowed. The Grave Wolf bursts from the earth beneath a target's feet. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 10 Piercing Damage, and the target must surpass Agility TN 5 + Resist bonus or be knocked Prone.\n\nLock-Jaw Lunge (Melee Cost: 1 Action): The wolf snaps its necrotic jaws shut on a limb. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 10 Piercing/Necrotic Damage. If the target is Prone, this attack automatically applies the Grappled condition as the hound refuses to let go.\n\nDrag into the Dark (Cost: 1 Action): The wolf violently hauls a Grappled target away from their allies. The wolf moves up to 20 feet, physically dragging the target with it into an open grave or away from the party's defensive line.`},
{name:`Greater Daemon: The Herald of Ruin`,size:`Enormous`,type:`Fiend / Daemonic`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Standing over 30 feet tall, the Herald of Ruin is a towering nightmare of jagged obsidian horns, rippling crimson muscle, and tattered, leathery wings that blot out the sun. It wields an Abyssal Greatblade forged from the agonizing souls of the damned, and hellfire constantly bleeds from its eyes and maw. It does not merely destroy cities; it corrupts the very geometry of the world around it. The sky boils into a bruised, toxic purple in its presence, and the earth turns to scorched glass beneath its hooves. To face the Herald is to stare directly into the abyss and watch it smile back.`,agl:4,awa:5,cha:12,int:7,phy:15,wil:9,move:`20/40F`,ap:3,def:8,wmArmor:30,wmBS:30,wmDP:`Immune`,wounds:650,focus:`+3/9`,reroll:3,luck:0,meleeHit:`+6`,meleeDmg:`+40/+90(2H)`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`Wizardry`,fear:`10`,mob:`1`,gear:`Abyssal Greatblade, Whip of Anguish`,meleeDetail:`Abyssal Greatblade`,rangeDetail:`Hellfire Orb`,abilities:`Passive Traits\nAura of the Abyss: The Herald passively corrupts the world. The area within 60 feet of the Daemon is choked with sulfur and necrotic ash. Any living creature that starts its turn in this radius takes 10 Necrotic Damage and cannot regain Wounds (healing magic completely fails) until they leave the aura.\n\nWings of the Apocalypse: The Daemon's massive, tattered wings generate hurricane-force winds. Any enemy smaller than Enormous that attempts to Move or Dash toward the Daemon must pass a severe Physique(12) test or be violently pushed 15 feet backward by the downdraft, ending their movement.\n\nSoul-Forged Carapace: The Daemon's hide is anathema to mortal steel. The Herald is completely immune to non-magical Melee attacks. Furthermore, any non-magical weapon that strikes the Daemon instantly melts into slag and is permanently destroyed.\n\nAction-Based Abilities\nCleaver of the Damned (Melee Cost: 2 Actions): The Daemon swings its gargantuan, screaming blade. Make a Melee attack (+6 To-Hit) with a 30-foot reach. If successful, it deals 1d10 + 90 Slashing/Necrotic Damage. The target must surpass Willpower TN 10 + Resist bonus or gain 1 Shaken condition as the screaming souls trapped in the blade assault their mind.\n\nWord of Ruin (Cost: 3 Actions): The Herald speaks a single, forbidden syllable of Abyssal speech. All enemies within a 100-foot radius must pass a severe Willpower(11) test. On a failure, they take 4d10 + 20 Psychic Damage, instantly drop any weapons they are holding, and fall Prone, physically forced to grovel before the Daemon's majesty.\n\nHellfire Eruption (Range Cost: 2 Action): The Daemon opens its maw and vomits a sphere of black fire. Make a Ranged attack (+5 To-Hit) against a 20-foot radius area up to 80 feet away. On a hit, all targets in the zone take 1d10 + 30 Fire/Necrotic Damage, and the ground in that area becomes permanently ablaze, treating it as lethal Difficult Terrain for the rest of the encounter.`},
{name:`Green Dragon: The Verdant Overlord`,size:`Giant`,type:`Dragon / Monstrosity`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A masterpiece of camouflage and serpentine grace. Its scales are a shifting mosaic of emerald, moss, and forest shadow, covered in actual lichen and ferns. A pervasive scent of pine resin and chlorine follows it like a shroud. Unlike their red cousins who burn what they cannot own, Green Dragons prefer to dominate. They are master gaslighters, keeping a court of "servants"—forest-folk, elves, or sprites—coerced into worshiping them. They don't just breathe poison; they breathe control. They use the forest as a weapon, leading adventurers into bogs and thickets before beginning the fight with honeyed words to sow discord among the party.\n\n(Always accompanied by 2 + 1d10 charmed "Servants" acting as meat shields)\n`,agl:4,awa:8,cha:2,int:9,phy:15,wil:5,move:`27/53F`,ap:3,def:7,wmArmor:20,wmBS:25,wmDP:`Immune`,wounds:450,focus:`+3/9`,reroll:3,luck:3,meleeHit:`+6`,meleeDmg:`+40`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`+5`,castDmg:`+20`,castHeal:`+15`,castType:`Druidism`,fear:`6`,mob:`1`,gear:`The plundered magical artifacts of a hundred manipulated heroes.`,meleeDetail:`Serpentine Claws & Fangs`,rangeDetail:`Chlorine Gas Breath`,abilities:`Passive Traits\nMaster of Terrain: The Green Dragon's domain is an extension of its will. It completely ignores all Movement penalties associated with dense forests, bogs, and magical thorns. Furthermore, any player moving more than 10 feet on their turn within the dragon's lair must pass an surpass Agility TN 7 + Resist bonus or become Restrained by suddenly shifting vines and roots.\n\nThe Verdant Court (Meat Shields): The dragon is never truly alone. If a player targets the dragon with a successful Melee or Ranged attack, the dragon can use its Reaction to force one of its charmed "Servants" to step into the attack's path, taking all the Wounds and effects instead.\n\nScent of Pine and Chlorine: The dragon constantly exhales a localized toxic haze. Any enemy that ends its turn within 15 feet of the dragon automatically loses 1 Focus point and suffers 5 Poison Damage as the fumes slowly burn their lungs and cloud their mind.\n\nAction-Based Abilities\nSow Discord(TN11) (Casting Cost: 2 Actions): The dragon speaks a honeyed, deeply personal lie to a target within 60 feet. Make a Casting attack (+5 To-Hit). If successful, it deals no Wounds, but the target is Charmed into a paranoid frenzy. On their next turn, the target must use their first Action to make a basic Melee or Ranged attack against their nearest ally. A Willpower(13) test is allowed to resist the spell effects.\n\nChlorine Exhalation (Range Cost: 2 Actions): The dragon exhales a dense, rolling cloud of toxic green mist. Make a Ranged attack (+5 To-Hit) against all targets in a 40-foot cone. On a hit, targets take 3d10 + 30 Poison/Acid Damage and instantly gain the Blinded and Poisoned conditions as the gas melts their eyes and floods their bloodstream.\n\nSerpentine Drag (Melee Cost: 1 Action): The dragon slithers out of the canopy to snatch a victim. It moves up to 20 feet, bypassing all terrain, and makes a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 40 damage, and the target is Grappled and dragged directly into a nearby environmental hazard (like a briar patch or deep bog water).`},
{name:`Griffon: The Alpine Apex`,size:`Large`,type:`Beast / Monstrosity`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Griffon is the undisputed king of the mountain peaks, a terrifying but majestic fusion of a golden eagle and a tawny lion. Possessing a massive wingspan and razor-sharp talons capable of piercing plate armor, they are brutal ambush predators that strike from the sun. They are fiercely territorial and proudly untamable, viewing anyone who enters their alpine hunting grounds as either a threat to their nest or their next meal. They do not fight fair; they rely on blinding dives, snatching their prey into the sky before the victim's allies can even draw their swords.\n`,agl:9,awa:8,cha:1,int:2,phy:7,wil:6,move:`20/40F`,ap:3,def:5,wmArmor:9,wmBS:5,wmDP:10,wounds:80,focus:`0`,reroll:1,luck:2,meleeHit:`+4`,meleeDmg:`+21`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-3`,gear:`Random`,meleeDetail:`Rending Talons & Beak`,rangeDetail:`None`,abilities:`Passive Traits\nDeath from Above: The Griffon uses gravity as a weapon. If the Griffon spends its movement flying at least 30 feet straight down toward a target before making a Melee attack, that attack automatically gains Advantage and ignores the target's first 3 points of Armor Mitigation due to the sheer kinetic force of the dive.\n\nSun-Blind Ascent: The Griffon instinctively positions itself with the sun behind it. Any enemy attempting to target the Griffon with a Ranged or Casting attack while it is flying above them suffers Disadvantage due to the blinding glare.\n\nUnbroken Pride: The Griffon refuses to be cowed by lesser creatures. It is completely immune to the Shaken and Taunted conditions from any creature that is not Giant or Titanic in size.\n\nAction-Based Abilities\nSwooping Pounce (Melee Cost: 1 Action): The Griffon crashes into its prey, claws first. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 21 Slashing Damage. If the target is Medium or smaller, they are instantly Grappled and knocked Prone beneath the beast's paws.\n\nExecutioner’s Beak (Melee Cost: 1 Action): The Griffon snaps its razor-sharp beak down on a helpless target. Make a Melee attack (+4 To-Hit). If this attack targets an enemy that is Grappled by the Griffon, it automatically hits (no roll required) and deals 1d10 + 21 Piercing Damage as it tears through armor and flesh.\n\nGale Buffet (Cost: 2 Actions): The Griffon aggressively beats its massive wings, creating a localized hurricane. All enemies in a 20-foot cone must pass a severe Agility(7) test. On a failure, they take 15 Bludgeoning Damage, are violently pushed 15 feet backward, and are knocked Prone.`},
{name:`Grizzly Bear: The Forest Monarch`,size:`Large`,type:`Beast`,tier:`Elite`,tierColor:`#b45309`,desc:`A mountain of fur, muscle, and territorial rage. Standing nearly ten feet tall when reared on its hind legs, the Grizzly Bear is the ultimate terrestrial predator. They are not mindless killers, but they are possessive of their domain and settle every dispute with overwhelming violence. A Grizzly doesn't just bite; it crushes. Their claws are like iron spikes, and their hide is thick enough to turn away all but the most determined strikes. To encounter "Old Mossback" in the wild is to realize that humans are very low on the local food chain.`,agl:5,awa:6,cha:1,int:2,phy:9,wil:8,move:17,ap:3,def:7,wmArmor:10,wmBS:10,wmDP:30,wounds:105,focus:`+2/6`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+22`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`3`,mob:`1`,gear:`None`,meleeDetail:`Claws & Jaws`,rangeDetail:`None`,abilities:`Passive Traits\nTerritorial Berserker: The Grizzly grows more dangerous as it bleeds. For every 20 damage the Bear has lost, it gains a cumulative +1 to its Melee damage (damage), representing its desperate, adrenaline-fueled rage.\n\nThick-Skulled Resilience: The Bear’s physiology is built for brawling. It is completely immune to the Stunned and Dazed conditions. Furthermore, any Critical Hit against the Bear is treated as a normal hit unless the attacker uses a Piercing weapon.\n\nCrushing Weight: The Grizzly is a master of the "Bear Hug." The Bear automatically gains Advantage on any check to maintain or escape a Grapple.\n\nAction-Based Abilities\nMaul (Melee Cost: 1 Action): The Bear swipes with claws like iron harrows. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 22 Slashing Damage. If the Bear has Advantage on this roll, the target also gains 1 Bleeding condition.\n\nBone-Crusher Bite (Melee Cost: 2 Actions): The Bear sinks its teeth into a limb and shakes. Make a Melee attack (+4 To-Hit). On a hit, it deals 40 Piercing/Bludgeoning Damage. If the target is Medium or smaller, they are instantly Grappled and Restrained in the Bear’s jaws.\n\nIntimidating Roar (Cost: 1 Action): The Bear rears onto its hind legs and unleashes a deafening, chest-shaking roar. All enemies within 30 feet must surpass Willpower TN 7 + Resist bonus. On a failure, they gain the Shaken condition and must use their next Action to move away from the Bear.`},
{name:`Half-Ogre: The Pit-Bred Bruiser`,size:`Large`,type:`Humanoid (Giant-Kin)`,tier:`Elite`,tierColor:`#b45309`,desc:`A brutal crossbreed combining human cunning with the raw, terrifying mass of an ogre. Often raised in underground fighting pits or outlaw mercenary camps, they stand 8 to 9 feet tall, characterized by thick, sloping brows, jutting underbites, and heavily scarred, leathery skin. They are significantly smarter than full-blooded ogres but possess enough of their giant-kin heritage to effortlessly rip a man's arm from its socket. In the grim underworlds and mercenary companies, a Half-Ogre is a terrifying asset. They serve as enforcers, shock troops, and warlord bodyguards, clad in scavenged, mismatched iron plate and wielding weapons far too heavy for a normal human to lift.`,agl:2,awa:4,cha:1,int:0,phy:6,wil:5,move:``,ap:3,def:5,wmArmor:10,wmBS:5,wmDP:15,wounds:100,focus:`0`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+12/+18`,meleeHeal:`0`,rangeHit:`+1`,rangeDmg:`+10`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:``,gear:`Iron-Banded Greatclub, Scavenged Scrap-Plate, Signature Iron Gut-Plate`,meleeDetail:`Iron-Banded Greatclub`,rangeDetail:`Rock Thrower`,abilities:`Passive Traits\nUnyielding Mass: Because of its Large size and immense density, the Half-Ogre cannot be physically pushed, Grappled, or knocked Prone by Melee attacks from Medium or smaller creatures.\n\nPit-Hardened: The Bruiser is used to taking a beating. It possesses a natural resistance to blunt trauma, taking half damage from all non-magical Bludgeoning weapons.\n\nReach of the Brute: The Half-Ogre's elongated arms and massive weapon grant it a natural 10-foot reach in melee combat, allowing it to strike over the heads of standard human infantry.\n\nAction-Based Abilities\nSkull-Cracker Swing (Melee Cost: 1 Action): A straightforward, brutal overhead slam. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 18 Bludgeoning Damage. If this attack rolls a Critical Hit(10), the target's helmet (or shield) is shattered, and they gain the Dazed condition.\n\nGut-Check Shove (Cost: 1 Action): The Half-Ogre lowers its shoulder and drives its iron gut-plate directly into an enemy. Make a Melee attack (+2 To-Hit). On a hit, it deals 1d10 + 12 Bludgeoning Damage, and the target is violently pushed 15 feet backward.\n\nThe Ragdoll Toss (Cost: 2 Actions): The brute reaches out to grab a compromised target. Make a Melee attack (+2 To-Hit) against a Medium or smaller creature. On a hit, the target takes 10 Bludgeoning Damage as they are hoisted into the air, and the Half-Ogre throws them up to 20 feet in any direction. The target takes standard fall 2d10 damage upon landing and gains the Prone condition.`},
{name:`Halfling: The Slip-Step`,size:`Small`,type:`Humanoid`,tier:`Minion`,tierColor:`#607080`,desc:`The Halfling: The Slip-Step\nStanding roughly three feet tall, Halflings are diminutive, quick-footed folk often underestimated by the larger races of the world. What they lack in raw physical might, they make up for with astonishing agility, sharp senses, and an uncanny, almost supernatural well of luck. They tend to wear practical, earth-toned clothing and padded leather, moving with a silent grace that makes them exceptional scouts, thieves, or ambushers.\n\n`,agl:6,awa:4,cha:3,int:1,phy:0,wil:2,move:8,ap:3,def:5,wmArmor:3,wmBS:3,wmDP:10,wounds:15,focus:`0`,reroll:2,luck:4,meleeHit:`+2`,meleeDmg:`+5`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+12`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`3-15`,gear:`Leather, shield`,meleeDetail:`dagger, short sword`,rangeDetail:`Sling`,abilities:`Passive Traits\nSupernatural Luck: The Halfling is favored by fate. If an enemy lands a Critical Hit against the Halfling, the Halfling can spend 1 Luck point (out of their pool of 4) to force the enemy to reroll the attack completely. Additionally, they automatically pass the first surpass Agility TN 7 + Resist bonus they are forced to make in any combat encounter.\n\nSilent Grace: The Slip-Step moves without making a sound. They permanently possess Advantage on all Stealth checks, and they completely ignore Movement penalties from natural Difficult Terrain (like mud, underbrush, or loose scree).\n\nUnderfoot Evasion: A Halfling knows how to fight giants. They gain a +2 bonus to their Defense (bringing it to an effective 7) against any Melee attack made by a creature of Large size or greater, easily ducking under the sweeping, clumsy blows.\n\nAction-Based Abilities\nAchilles Strike (Cost: 1 Action): The Halfling targets the vulnerable joints of a larger foe. Make a Melee attack (+2 To-Hit). If successful, it deals 51d10 + 5 Piercing Damage, and the target's Movement is reduced by half on their next turn as their knee or ankle buckles.\n\nDistracting Ricochet (Range Cost: 1 Action): The Halfling fires a sling bullet with impossible geometry. Make a Ranged attack (+2 To-Hit) against a target up to 40 feet away. On a hit, it deals 1d10 + 12 Bludgeoning Damage. Whether it hits or misses, the bullet ricochets, granting the next allied attack against that target Advantage.\n\nVanish into the Leaves (Cost: 1 Action): The Halfling utilizes their size and earth-toned clothing. They may move up to 15 feet and instantly gain the Concealed condition, making it impossible to target them with Ranged attacks or Spells until they reveal themselves or move into the open.`},
{name:`Halfling: The Thornwarden`,size:`Small`,type:`Humanoid / Halfling`,tier:`Elite`,tierColor:`#b45309`,desc:`The Thornwarden has been in the same district, the same valley, the same three square miles, for longer than most of the kingdoms around it have existed. It knows every informant, every patrol route, every guard shift, every face that does not belong. It knows the oral history of every bloodstain on every stone. It decided, at some point that it does not discuss, that knowing things is insufficient and that action is occasionally required. The transition from observer to operator happened quietly and was complete before anyone thought to notice it had begun. The Thornwarden is not angry. It is final.`,agl:10,awa:12,cha:7,int:9,phy:5,wil:9,move:13,ap:3,def:19,wmArmor:3,wmBS:3,wmDP:2,wounds:90,focus:`+3/9`,reroll:2,luck:0,meleeHit:`+2`,meleeDmg:`+14`,meleeHeal:`2`,rangeHit:`2`,rangeDmg:`+12`,rangeHeal:`1d10+16`,castHit:`0`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`None`,mob:`—`,gear:`1`,meleeDetail:`Twin Thornblades (matched short-swords), Compact shortbow, Warden's cloak (treated for concealment), Thorn-poison (×5 doses)`,rangeDetail:`Twin Thornblades — dual wield, +1 To-Hit bonus when both hit same target in one turn`,abilities:`Passive Traits\nTwo Decades of Observation: The Thornwarden cannot be surprised. It has already considered that you might come. It made a plan. Additionally, it gains Advantage on all Awareness, Perception, and Tracking tests — it has been paying attention for a very long time.\n\nHalfling's Claim: The Thornwarden is defending something specific — a community, a district, a set of people that the larger world has repeatedly failed to protect. While doing so, it cannot be affected by Fear or Shaken conditions, and its Luck pool increases by 2 (included above).\n\nThe Space Between: The Thornwarden moves through melee without triggering free attacks. It occupies the gaps. Larger creatures cannot exploit reach or flanking against it — it is never where their geometry assumes it will be.\n\nThorn-Poison: Any creature hit by the Thornwarden's melee attacks has a 50% chance of being exposed to Thorn-Poison — surpass Physique TN 8 + Resist bonus or gain Lesser Poison (1d10 damage/turn until test passed at TN 7 each turn).\n\nAction-Based Abilities\nTwin Fade (Melee Cost: 2 Actions): Two strikes, one motion. Make two Melee attacks (+12 To-Hit each) against the same target for 1d10 + 14 damage each. If both land, the target must surpass Agility TN 10 + Resist bonus or become Disarmed — the Thornwarden removed their weapon during the second pass. They noticed on the third.\n\nSilent Account (Ranged Cost: 2 Actions): A shot placed with the precision of someone who has been watching the target move for twenty minutes. Make a Ranged attack (+14 To-Hit) for 1d10 + 16 damage. This attack ignores the target's DM-Armour entirely — the arrow was placed before the target finished deciding where to stand.\n\nVanish (Cost: 1 Action): The Thornwarden steps into any available shadow, crowd, or terrain feature and becomes completely hidden until it chooses to act or is revealed by magical detection. While hidden, its next attack gains Advantage and deals +1d10 bonus damage.`},
{name:`Harpy: Siren of the Canyons`,size:`Medium`,type:`Monstrosity (Avian)`,tier:`Minion`,tierColor:`#607080`,desc:`From a distance, their voices weave a tragic, hypnotic lullaby that echoes through the canyons, compelling travelers to step just a little closer to the cliff's edge. Up close, the illusion shatters. A Harpy is a vile, stench-ridden fusion of a feral humanoid and a scavenging bird of prey. They have hollow bones, filthy, razor-sharp talons, and eyes completely devoid of empathy. They do not fight fair; they lure, they swoop, they bleed their prey, and they let gravity do the rest of the work.`,agl:6,awa:5,cha:9,int:0,phy:1,wil:2,move:`8/27F`,ap:3,def:4,wmArmor:1,wmBS:10,wmDP:29,wounds:21,focus:`+1/3`,reroll:0,luck:0,meleeHit:`+3`,meleeDmg:`+15`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`3`,mob:`2-5`,gear:`Filth-crusted talons, jagged bone daggers.`,meleeDetail:`Filthy Talons.`,rangeDetail:`Sonic Shriek`,abilities:`Passive Traits\nHollow Bones: The Harpy is incredibly light, allowing for flight, but highly vulnerable to crushing blows. Any Bludgeoning damage dealt to the Harpy automatically gains a positive modifier to the final damage total.\n\nHit and Run: If the Harpy moves at least 20 feet in the air before making a melee attack, it does not trigger any defensive counter-attacks or reactions from the target when it flies away.\n\nGravity's Ally: The Harpy gains Advantage on checks made to grapple, push, or drag a target if they are currently adjacent to a cliff, pit, or deadly drop.\n\nAction-Based Abilities\nSiren's Lullaby (Cost: 2 Actions): The Harpy sings its tragic melody, utilizing its massive Charisma. All enemies within 60 feet must surpass Willpower TN 6 + Resist bonus against the Harpy's Casting To-Hit (+3). On a failure, they are Charmed and must use their movement on their next turn to walk toward the Harpy, even if it leads them into danger.\n\nSwooping Talons (Melee Cost: 1 Action): The Harpy dives and slashes. Make a Melee attack (+3 To-Hit). If successful, it deals 6 Slashing Damage and inflicts a Bleeding condition as the filthy claws rake the flesh.\n\nSnatch and Drop (Melee Cost: 1 Action): If the Harpy has a target Grappled, it attempts to lift them into the air (contested Physique vs. Agility(6) check). If successful, it ascends and immediately releases the target, inflicting falling damage based on the height.`},
{name:`Havenspire City Watchman`,size:`Medium`,type:`Humanoid (Human)`,tier:`Minion`,tierColor:`#607080`,desc:`The First Line\nWhile the Elite Guard protect the capital's VIPs and fortresses, the City Watchmen walk the muddy streets, patrol the outer walls, and keep the peace in the bustling markets. They are lightly armored in chain shirts and padded leather, wearing the crisp white and gold tabards of Havenspire. Armed with standard-issue spears and wooden shields, they rely on numbers, basic training, and a sharp eye. A single Watchman is rarely a lethal threat to a seasoned adventurer, but they are never truly alone. Their greatest weapon is the brass signal whistle around their neck.`,agl:1,awa:6,cha:0,int:0,phy:4,wil:2,move:10,ap:3,def:5,wmArmor:10,wmBS:5,wmDP:8,wounds:15,focus:`0`,reroll:0,luck:0,meleeHit:`+2`,meleeDmg:`+8`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`4-10`,gear:`Havenspire Tabard, Chain Shirt, Wooden Shield, City Spear, Brass Signal Whistle`,meleeDetail:`City Spear`,rangeDetail:`light crossbow`,abilities:`Passive Traits\nThe City's Eyes: The Watchman's Awareness peak makes them difficult to ambush. They automatically gain Advantage on any check made to spot hidden enemies or detect traps in an urban environment.\n\nBasic Shield Wall: While standing adjacent to at least one other allied City Watchman, both guards gain a +1 modifier to their Defense.\n\nUrban Tracker: The Watchman knows the capital's streets intimately. They ignore all movement penalties caused by difficult urban terrain, such as thick crowds, narrow alleys, or market stalls.\n\nAction-Based Abilities\nSpear Thrust (Cost: 1 Action): A basic, textbook thrust with their polearm. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 8 Piercing Damage.\n\nSubdue / Pommel Strike (Melee Cost: 1 Action): The Guard attempts to arrest rather than kill. Make a Melee attack (+2 To-Hit). On a hit, it deals only 3 Bludgeoning Damage, but the target must surpass Physical TN 4 + Resist bonus or gain the Dazed condition.\n\nSound the Alarm! (Cost: 1 Action): The Watchman blows their brass signal whistle. The piercing sound echoes for blocks. All allies within earshot immediately gain a positive modifier to their Initiative/Awareness. If the encounter lasts for more than 3 rounds after the whistle is blown, 1+1d10 additional Watchmen will arrive as reinforcements.`},
{name:`Havenspire Elite Guard`,size:`Medium`,type:`Humanoid (Human)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The capital city of Havenspire does not entrust its safety to mere mercenaries or peasant militias. The Elite Guard are the finest soldiers the realm has to offer, hand-picked for their physical prowess and unwavering loyalty. Clad in gleaming, interlocking plate armor forged in the capital's grand foundries, they are striking figures of authority. They fight with a cold, calculated precision, utilizing heavy tower shields and masterwork longswords. They are not mindless monsters or savage raiders; they are professional sentinels whose sole purpose is to hold the line, protect the city's VIPs, and pacify threats with methodical, overwhelming defense.`,agl:2,awa:4,cha:1,int:2,phy:6,wil:5,move:10,ap:3,def:9,wmArmor:20,wmBS:10,wmDP:10,wounds:35,focus:`+1/3`,reroll:2,luck:2,meleeHit:`+4`,meleeDmg:`+14`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+6`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`2-5`,gear:`Havenspire Full Plate, Tower Shield, Capital Longsword, Heavy Crossbow`,meleeDetail:`Capital Longsword`,rangeDetail:`Short Bow or Crossbow`,abilities:`Passive Traits\nSworn Protector: The Elite Guard is trained to be an unyielding barrier. If an adjacent ally (or VIP) is targeted by a physical attack, the Guard can automatically redirect the attack to themselves, forcing the attacker to roll against the Guard's massive Defense (9) instead.\n\nCapital Forged: The metallurgy of Havenspire is legendary. The Guard's armor and weapons are immune to being shattered, sundered, or degraded by standard, non-magical abilities or corrosive slimes.\n\nPhalanx Wall: While standing adjacent to another Elite Guard, both guards gain immunity to being flanked and cannot be physically pushed or knocked Prone by creatures Size Large or smaller.\n\nAction-Based Abilities\nSentinel's Strike (Melee Cost: 1 Action): A clean, textbook swing with the longsword. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 14 Slashing Damage.\n\nShield Bash (Melee Cost: 1 Action): The Guard steps forward and slams their heavy tower shield into the target. Make a Melee attack (+4 To-Hit). On a hit, it deals 10 Bludgeoning Damage and the target must surpass Physical TN 6 + Resist bonus or be knocked Prone.\n\nHold the Gate (Melee Cost: 2 Actions): The Guard digs their heels in and raises their shield into a perfect defensive posture(+1). Until the start of their next turn, any enemy that makes a Melee attack against the Guard and misses immediately triggers a free, automatic counter-attack from the Guard's longsword.`},
{name:`Hill Giant: The Ravenous Mountain`,size:`Giant`,type:`Giant / Humanoid`,tier:`Boss`,tierColor:`#b91c1c`,desc:`Standing around 16 feet tall, the Hill Giant is a lumbering, gluttonous force of nature. What they lack in the refined elemental majesty of their kin, they make up for in sheer, brutish mass. Draped in "Trophy-Garbs"—crude patchwork clothing made from wagon canvases, farmhouse thatch, and animal hides—they are driven by an endless, ravenous hunger. Smelling of sweat, dirt, and raw meat, they bring the terrifying, unpredictable violence of a starving predator to the battlefield. Their primary weapon is a "Great-Thumper": a whole uprooted tree or a massive boulder lashed to a log, swung with a primal, earth-shaking momentum that can turn a fortified village into a crater in minutes.`,agl:2,awa:4,cha:0,int:1,phy:9,wil:6,move:20,ap:3,def:5,wmArmor:18,wmBS:10,wmDP:25,wounds:250,focus:`0`,reroll:1,luck:0,meleeHit:`+4`,meleeDmg:`+40/+80(2H)`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1-2`,gear:`Trophy-Garbs, Great-Thumper (Uprooted Tree)`,meleeDetail:`Great-Thumper`,rangeDetail:`Hurling unshaped rocks or dead livestock`,abilities:`Passive Traits\nGluttonous Rage: The Hill Giant fights with the desperate violence of a starving animal. If the Giant's Health drops below 50%, it instantly enters a rage. While enraged, it gains Advantage on all Melee To-Hit rolls, but all attacks made against the Giant also gain Advantage as it completely Abandons its defense to secure a meal.\n\nStarving Momentum: If the Hill Giant is moving toward an enemy that has the Bleeding condition, or an enemy that is visibly carrying rations or livestock, the Giant completely ignores all Difficult Terrain penalties and gains +30Ft to its Movement speed for that turn.\n\nUnstoppable Mass: Due to its immense 16-foot height and weight, the Giant is completely immune to being knocked Prone, Grappled, or physically displaced by creatures of Medium size or smaller.\n\nAction-Based Abilities\nGreat-Thumper Sweep (Melee Cost: 3 Action): The Giant swings its massive uprooted tree like a baseball bat. Make a Melee attack (+6 To-Hit) with a 15-foot reach against up to two adjacent targets. If successful, it deals 1d10 + 80 Bludgeoning Damage, and targets must surpass Physique TN 10 + Resist bonus or be hurled 15 feet backward.\n\nCrater Smash (Melee Cost: 1 Action): An overhead, earth-shattering strike against a single target. Make a Melee attack (+4 To-Hit). If successful, it deals 40 Bludgeoning Damage. If the Giant rolls a Critical Hit, the target is Stunned until the end of their next turn from the sheer kinetic impact.\n\nCrude Bombardment (Range Cost: 1 Action): The Giant rips a chunk of earth, a boulder, or a piece of a ruined building from the ground and hurls it. Make a Ranged attack (+3 To-Hit) against a target up to 60 feet away. On a hit, it deals 1d10 + 30 Bludgeoning Damage.\n\nMid-Battle Snack (Melee Cost: 2 Actions): The Giant attempts to grab a weakened target and stuff them into its mouth. Target one Prone or Grappled enemy within 10 feet. The Giant makes a Melee attack (+4 To-Hit). If it hits, it deals 80 Piercing Damage from its massive, crooked teeth, and the Giant instantly heals 40 damage as it consumes the flesh.`},
{name:`Hippogryph: The Crag-Steed`,size:`Large`,type:`Monstrosity (Avian/Equine)`,tier:`Elite`,tierColor:`#b45309`,desc:`The Hippogryph commands the skies with the unblinking, predatory gaze of a giant raptor and the muscular, tearing power of a warhorse's hindquarters. Feared by travelers and knights alike, it is a master of the skies that plummets from the clouds like a feathered anvil. It tears through armor as easily as aged parchment and possesses a wild, unbroken spirit that refuses to be tamed by anything short of legendary magic. A Hippogryph features the head, wings, and foreclaws of a giant hawk, seamlessly transitioning into the powerful hindquarters and tail of a horse. In the wild, they are known for their "Storm-Gallop"—a behavior where herds race along the edge of mountain thunderstorms to catch the updrafts. Their feathers favor earthy tones like chestnut, steel-grey, or dapple-white, allowing them to blend into the rocky high-altitude terrain they call home.`,agl:9,awa:5,cha:1,int:2,phy:4,wil:6,move:`20/40F`,ap:3,def:5,wmArmor:15,wmBS:15,wmDP:12,wounds:120,focus:`+1/3`,reroll:1,luck:2,meleeHit:`+4`,meleeDmg:`+27/+40`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`4`,mob:`3-8`,gear:`Random`,meleeDetail:`Raking Foreclaws & Beak`,rangeDetail:`None`,abilities:`Passive Traits\nFeathered Anvil: The Hippogryph turns gravity into a weapon. If the Hippogryph dives or moves at least 30 feet downward toward a target before making a melee attack, that attack automatically gains the Armor-Piercing(+3DM) quality, tearing through steel like parchment.\n\nUnbroken Spirit: The creature's mind is wildly independent. It is completely immune to the Charmed or Shaken conditions unless the source is of a Legendary or Master-level magical tier.\n\nStorm-Gallop: The Hippogryph treats severe weather (high winds, heavy rain, snow) as an advantage rather than a hindrance, completely ignoring any movement penalties associated with difficult atmospheric terrain.\n\nAction-Based Abilities\nPlummeting Strike (Melee Cost: 2 Actions): The Hippogryph folds its wings and drops from the sky. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 40 Piercing Damage. If this attack benefits from Feathered Anvil, the target must also surpass Physical TN 6 + Resist bonus or be knocked Prone from the sheer kinetic impact.\n\nRaptor's Rake (Melee Cost: 1 Action): The creature lashes out with its front talons. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 +27 Slashing Damage.\n\nEquine Kick (Melee Cost: 1 Action): If a target is behind or flanking the Hippogryph, it can unleash a brutal kick with its powerful hindquarters. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 27 Bludgeoning Damage and physically pushes the target 10 feet back.`},
{name:`Hobgoblin Phalanx Leader`,size:`Medium`,type:`Humanoid (Goblinoid)`,tier:`Minion`,tierColor:`#607080`,desc:`For a Goblinoid - The Iron Elite\nHobgoblins are the martial elite of their kind. They stand roughly as tall as a human but possess a much broader, denser muscular frame. Their skin ranges from a dark, leathery orange to a deep iron-red. They are rarely seen without their equipment; a Hobgoblin’s social standing is dictated by the quality of their kit and the discipline of their unit. The Phalanx Leader wears a well-oiled coat of banded mail and carries a long-reaching halberd, allowing them to coordinate their troops from behind a line of shields while still delivering devastating strikes.`,agl:2,awa:4,cha:0,int:1,phy:5,wil:9,move:13,ap:3,def:6,wmArmor:5,wmBS:10,wmDP:10,wounds:28,focus:`0`,reroll:0,luck:0,meleeHit:`+3`,meleeDmg:`+14`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+9`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`5-20`,gear:`Well-Oiled Banded Mail, 2-Handed Serrated Halberd, Unit Standard/Banner`,meleeDetail:`Serrated Halberd, Short Sword`,rangeDetail:`Short Bow, Javelin`,abilities:`Passive Traits\nPhalanx Discipline: The Hobgoblin gains a permanent Advantage on Defense(+1) as long as it is standing adjacent to at least one allied creature. Furthermore, it is completely immune to the Shaken condition as long as its unit remains unbroken.\n\nReach Mastery: The Halberd allows the Hobgoblin to strike from the second rank. It can make melee attacks against targets up to 10 feet away. Attacks made at this distance do not trigger defensive reactions or counter-attacks from targets armed with standard (5-foot) weapons.\n\nArmor Conditioning: Accustomed to the weight and joints of their kit, critical Hits scored against the Hobgoblin do not bypass its DM-Arm (Armor Mitigation) unless the attacker is specifically using an Armor-Piercing weapon.\n\nAction-Based Abilities\nSerrated Sweep (Cost: 2 Actions): A wide, knee-level swing with the halberd. The Hobgoblin may target up to two adjacent enemies within its 10-foot reach. Make a separate Melee attack (+3 To-Hit) for each. On a hit, it deals 1d10 + 14 Slashing Damage and inflicts 1 Bleeding condition.\n\nHold the Line! (Cost: 1 Action): The Leader barks a brutal, guttural command. All allies within 30 feet immediately gain a positive modifier to their DM-Arm(+2) until the start of the Leader's next turn.\n\nPunishing Thrust (Melee Cost: 1 Action): A brutal forward thrust with the halberd's top spike. Make a Melee attack (+3 To-Hit) with a 10-foot reach. On a hit, it deals 1d10 + 14 Piercing Damage. If the target moved toward the Hobgoblin on their last turn (charging), this attack deals double damage(+28) by using the enemy's momentum against them.`},
{name:`Human Cultist: The Fractured Soul`,size:`Medium`,type:`Humanoid (Chaos-Touched)`,tier:`Minion`,tierColor:`#607080`,desc:`A Cultist rarely looks like a monster at first glance. They wear heavy, layered robes of deep crimson or soot-black to hide the "Chaos-Marks" blooming across their skin—veins that pulse with violet light or patches of scales that feel like cold iron. Their eyes are often bloodshot and wide, dilated by a constant state of religious euphoria or shivering terror. They are tactical fanatics. Unlike disciplined soldiers, a Cultist fights with a terrifying disregard for their own safety. They view their bodies as mere vessels to be used and discarded. In battle, they carry jagged, ritual daggers and "Censer-Flails" that leak hallucinogenic smoke, preferring to die in a burst of chaotic energy rather than face the silence of a world without their dark patrons.`,agl:5,awa:2,cha:1,int:3,phy:4,wil:6,move:11,ap:2,def:4,wmArmor:4,wmBS:12,wmDP:10,wounds:25,focus:`0`,reroll:1,luck:0,meleeHit:`+2`,meleeDmg:`+10/+12Flail`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`+10`,rangeHeal:`0`,castHit:`+1`,castDmg:`+18`,castHeal:`0`,castType:`Wizardry`,fear:``,mob:`3-30`,gear:`Heavy Robes, Jagged Ritual Dagger, Censer-Flail.`,meleeDetail:`Censer-Flail / Jagged Dagger`,rangeDetail:`Throwing Daggers`,abilities:`Passive Traits\nReckless Abandon: The Cultist completely ignores self-preservation. When attacking this way, they automatically gain Advantage on their Melee To-Hit rolls, but any attack directed at the Cultist also gains Advantage, reflecting their refusal to defend themselves.\n\nVessel of Chaos: The Cultist's body is barely containing the dark magic within. When the Cultist is reduced to 0 damage, their Chaos-Marks violently rupture. All creatures within 10 feet must surpass Agility TN 5 + Resist bonus or take 10 points of unmitigable magical damage from the bursting violet energy.\n\nFanatical Mind: Driven by pure religious ecstasy, the Cultist is entirely immune to the Shaken, Charmed, and Dazed conditions.\n\nAction-Based Abilities\nCenser-Flail Sweep (Cost: 1 Action): The Cultist swings their heavy, smoking flail. Make a Melee attack (+2 To-Hit). On a hit, it deals 1d10 + 12 Bludgeoning Damage.\n\nHallucinogenic Cloud (Cost: 2 Actions): The Cultist violently spins their Censer-Flail, filling a 15-foot radius with thick, noxious smoke. All non-cultists in the area must surpass Willpower TN 6 + Resist bonus. On a failure, they suffer the Confused condition, struggling to distinguish friend from foe through the mind-altering haze.\n\nBlood Sacrifice (Melee Cost: 1 Action): The Cultist drags their jagged dagger across their own arm or chest. The Cultist immediately takes 5 damage of unmitigable damage, but their next Melee or Casting attack automatically results in a Critical Hit if it connects, fueled by the blood magic.`},
{name:`Hydra: The Ever-Hungry`,size:`Giant`,type:`Monstrosity (Reptilian)`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A Hydra is a mountain of reptilian muscle, covered in slick, swamp-stained scales that range from deep charcoal to sickly bile-green. Its most terrifying feature is, of course, its multiple heads—each mounted on a long, serpentine neck that can move with the speed of a striking cobra. Each head possesses its own rudimentary intelligence, allowing the beast to track, snap at, and swallow multiple foes simultaneously. They radiate a thick, musk-like stench of rot and stagnant water. To fight a Hydra is to enter a race against time; the creature is famously difficult to kill because its blood is supercharged with regenerative mutagens. If a head is severed, the stump cauterizes and splits almost instantly, sprouting two more aggressive, hungrier versions of the original.`,agl:3,awa:5,cha:0,int:2,phy:6,wil:4,move:23,ap:9,def:5,wmArmor:25,wmBS:15,wmDP:35,wounds:250,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+36`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`7`,mob:`1`,gear:`None`,meleeDetail:`Snapping Jaws`,rangeDetail:`None`,abilities:`Passive Traits\nRegenerative Mutagens: At the start of the Hydra's turn, it automatically heals 15 damage. If the Hydra takes Fire or Acid damage, this regeneration is paused until the end of its next turn.\n\nCut One, Two Shall Rise: When the Hydra suffers a Critical Hit from a Slashing weapon, one of its heads is severed. The stump immediately cauterizes and sprouts two new heads. For every head severed, the Hydra gains +1 Action to its maximum Act stat.\n\nSwamp Stench: The creature radiates a thick musk of rot and stagnant water. Any enemy that starts its turn within 15 feet must surpass Willpower TN 7 + Resist bonus or suffer the Nauseated condition, applying a negative modifier to their physical and combat rolls.\n\nAction-Based Abilities\nCobra Strike (Melee Cost: 1 Action): One of the heads darts forward with blinding speed. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 20 Piercing Damage. (With 9 Actions, the Hydra can distribute these strikes across the entire party).\n\nRend and Tear (Melee Cost: 2 Actions): Two heads coordinate to rip a single target apart. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 24 Slashing Damage, and the target gains 1 Bleeding condition.\n\nDevour (Cost: 3 Actions): A head attempts to swallow a Medium or smaller target whole. Make a contested Physical vs. Agility check. If the Hydra wins, the target is swallowed, taking 10 points of unmitigable Acid damage each round until they deal 20 damage to the gullet from the inside, forcing the head to regurgitate them.`},
{name:`Ice Troll: The Glacial Behemoth`,size:`Large`,type:`Monstrosity (Troll)`,tier:`Elite`,tierColor:`#b45309`,desc:`Indigenous to the highest, most unforgiving glacial peaks, the Ice Troll is a terrifying adaptation of the troll lineage. Standing 10 feet tall, its pale blue skin is thick and leathery, pierced by jagged shards of true-ice that grow directly out of its bones. It does not bleed liquid blood; it bleeds a sub-zero slush that flash-freezes upon hitting the air. When an Ice Troll is wounded, it doesn't just knit its flesh back together—it pulls the ambient moisture from the air to pack its wounds with solid ice, making it harder to kill the longer a battle lasts.`,agl:2,awa:4,cha:0,int:1,phy:9,wil:5,move:17,ap:3,def:6,wmArmor:18,wmBS:10,wmDP:30,wounds:130,focus:`+1/3`,reroll:1,luck:1,meleeHit:`+4`,meleeDmg:`+25/+40`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1-3`,gear:`None. Relies on its environment and physical form`,meleeDetail:`rue-Ice Claws`,rangeDetail:`Hurled Ice Boulders`,abilities:`Passive Traits\nGlacial Regeneration: At the start of the Troll's turn, it heals 10 damage by pulling ambient moisture into its injuries. Every time this happens, the newly formed ice grants the Troll a permanent, cumulative +2 to its DM-Arm (Armor Mitigation) for the rest of the encounter. If the Troll takes Fire damage, this regeneration (and the armor boost) is paused until the end of its next turn.\n\nFlash-Freeze Blood: When the Troll suffers a Critical Hit from a Melee weapon, its sub-zero slush blood erupts. The attacker must surpass Agility TN 7 + Resist bonus or have their weapon temporarily frozen to the Troll's body, requiring an Action and a Physical(9) test to wrench it free.\n\nJagged Carapace: Any creature that successfully Grapples the Troll, or hits it with an Unarmed strike, immediately takes 10 Piercing/Cold Damage from the true-ice shards protruding from its bones.\n\nAction-Based Abilities\nShattering Swipe (Melee Cost: 1 Action): A brutal backhand with an ice-crusted fist. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 25 Slashing/Cold Damage.\n\nImpale and Freeze (Melee Cost: 2 Actions): The Troll attempts to grab a target and crush them against its jagged chest. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 40 Piercing Damage, and the target is Grappled. While Grappled, the target takes 10 unmitigable Cold Damage at the start of their turn.\n\nSub-Zero Bellow (Cost: 1 Action): The Troll unleashes a roaring blast of freezing air and icy spittle. All enemies within a 15-foot cone must surpass Physical TN 9 + Resist bonus. On a failure, they suffer the Slowed condition, halving their movement speed and Agility on their next turn due to the biting cold.`},
{name:`Iron Golem: The Vault-Warden`,size:`Large`,type:`Construct / Elemental`,tier:`Elite`,tierColor:`#b45309`,desc:`A masterwork of both metallurgy and high-level sorcery. Unlike shifting clay or stitched flesh, the Iron Golem is a singular, rigid object given life by a bound elemental spirit. It is often used to guard the inner sanctums of archmages or the treasure vaults of lost civilizations. Standing ten feet tall and weighing several tons, the golem is a hulking humanoid shape of polished, dark-iron plates. Its joints hiss with steam and arcane pressure as it moves, and its featureless iron face is set in a permanent, stoic mask. It carries no weapons, for its fists are heavy enough to crush a horse, and it exudes a constant, metallic tang of ozone and heated metal.`,agl:4,awa:5,cha:1,int:2,phy:9,wil:6,move:13,ap:3,def:8,wmArmor:25,wmBS:10,wmDP:`Immune`,wounds:125,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+28`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`7`,mob:`1-2`,gear:`None`,meleeDetail:`Iron Fists`,rangeDetail:`None`,abilities:`Passive Traits\nFurnace Absorption: The elemental spirit bound within the golem thrives on extreme heat. The Iron Golem is completely immune to Fire damage. Whenever it is subjected to a Fire attack, it absorbs the energy, healing 15 damage and instantly curing itself of any Slowed or Fatigued conditions.\n\nUnstoppable Mass: Weighing several tons, the Iron Golem cannot be moved against its will. It is completely immune to the Knockback, Prone, Grappled, and Restrained conditions from any creature smaller than Giant size.\n\nArcane Iron Carapace: Normal weapons simply bounce off its chassis. All non-magical Melee attacks that deal Slashing or Piercing damage have their Wounds reduced to 0 before Armor Mitigation is even calculated.\n\nAction-Based Abilities\nHorse-Crushing Slam (Cost: 1 Action): The Golem steps forward and delivers a piston-driven punch. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 28 Bludgeoning Damage. If the target is wearing heavy armor, the sheer force of the blow dents the metal, reducing the target's Damage Mitigation by 3 for the rest of the encounter.\n\nToxic Arcane Vent (Cost: 2 Actions): The Golem releases the built-up ozone and arcane pressure from its internal furnace. It exhales a 15-foot cone of blinding, poisonous gas. All enemies in the cone must pass a severe Physique(8) test or take 25 Poison/Fire Damage and become Poisoned for 1 round.\n\nJuggernaut Stride (Cost: 1 Action): The Golem simply walks through its enemies. It moves up to its full 20 Movement speed in a straight line, freely entering the spaces of smaller creatures. Any creature whose space it enters must surpass Agility TN 7 + Resist bonus or take 15 Bludgeoning Damage and be pushed 5 feet out of the Golem's path.`},
{name:`Iron-Minotaur: The Blood-Gorgon`,size:`Medium`,type:`Monstrosity (Mutant / Brute)`,tier:`Elite`,tierColor:`#b45309`,desc:`A horrifying mutation of giant-kin and dark alchemy, the Iron-Minotaur is built for pure, unstoppable slaughter. Standing over ten feet tall, its flesh is fused with dark iron, and its very skeletal structure is composed of metallic bone that regularly protrudes through its heavily scarred skin. Most terrifyingly, it possesses four massive, heavily muscled arms, each gripping a crude, rusted cleaver or battleaxe. Driven entirely by a supernatural blood-greed, the Gorgon does not tire and does not retreat. It wades into the thickest phalanxes, its four arms working like a mechanical meat-grinder, turning disciplined formations into a spray of red mist.`,agl:4,awa:2,cha:0,int:1,phy:9,wil:5,move:14,ap:3,def:6,wmArmor:25,wmBS:10,wmDP:30,wounds:125,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+12/+30`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1`,gear:``,meleeDetail:`Crude Chain-Linked Flail`,rangeDetail:`None`,abilities:`Passive Traits\nRune-Forged Carapace: The cursed iron plates bolted into the creature's flesh by the smiths of Birn Uluhm offer near-impenetrable defense. The Iron-Minotaur possesses an innate 15 points of DM-Arm (Armor Mitigation). However, attackers can choose to target the exposed joints by taking a -3 penalty to their To-Hit roll; a successful hit in this manner ignores all DM-Arm.\n\nFurnace Blood: The creature is kept alive by a literal furnace of dark magic burning within its chest. It is completely immune to Fire and Heat-based damage. Furthermore, any enemy that starts its turn adjacent to the Iron-Minotaur takes 5 Fire Damage from the radiating heat and scalding steam.\n\nUnstoppable Momentum: Pain is a distant memory, replaced entirely by the agonizing drive of its dark machinery. The Iron-Minotaur is immune to the Staggered, Stunned, and Shaken conditions. Attempts to Grapple or knock the creature Prone are automatically resisted unless the attacker passes a surpass Physique TN 7 + Resist bonus against the Iron-Minotaur's 9 Physique.\n\nAction-Based Abilities\nQuake Strike (Melee Cost: 1 Action): Raising its massive, jagged iron weapon, the beast brings its full unnatural weight crashing down onto the ground. Make a Melee attack (+4 To-Hit). If successful, it deals 30 Bludgeoning Damage. Additionally, the ground shatters in a 10-foot radius around the target, turning the area into difficult terrain.\n\nVent Slag (Cost: 1 Action): The Iron-Minotaur violently purges toxic buildup from its internal furnace. It targets a 15-foot cone in front of it. All targets within the cone must surpass Physique TN 9 + Resist bonus against the beast's 9 Physique. On a failure, they take 1d10 + 12 Fire Damage and gain the Blinded and Choking conditions (suffering a -2 to all tests) for one turn. On a success, they take half damage and avoid the conditions.\n\nEngine-Buster Charge (Cost: 2 Actions): The beast lowers its horns and barrels forward in a straight line up to 40 feet. It makes a single Melee attack (+4 To-Hit) against the first target in its path. On a hit, it deals 1d10 + 30 Piercing/Bludgeoning Damage, and the target is violently pushed back 10 feet and gains the Prone condition. If the charge hits a solid structure, the structure takes double damage.`},
{name:`Jabberslythe: The Unmaking Gaze`,size:`Giant`,type:`Aberration / Monstrosity`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A Jabberslythe is a massive, bloated creature with skin that looks like wet, warty leather. It possesses a pair of tattered, moth-like wings that shouldn't be able to lift its bulk, yet it moves with a sickening, twitchy grace. Its face is a nightmare of cluster-eyes and a long, prehensile tongue that drips with paralytic slime. What makes the Jabberslythe truly unique is its "Aura of Insanity." To look upon the creature is to feel one’s mind fracture. It doesn't roar; it emits a constant, wet burbling and a series of high-pitched clicks that sound like a thousand insects dying at once. Animals flee in terror, and even the bravest knights often find themselves weeping or laughing hysterically instead of drawing their swords when the beast nears.`,agl:6,awa:5,cha:15,int:3,phy:9,wil:4,move:`20/33F`,ap:3,def:5,wmArmor:40,wmBS:16,wmDP:20,wounds:375,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+30/+18`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`8`,mob:`1`,gear:`None`,meleeDetail:`Prehensile Slime-Tongue & Crushing Bulk`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nAura of Insanity: The Jabberslythe’s primary weapon is its presence. Any enemy that starts its turn within 40 feet of the beast must pass a surpass Willpower TN 7 + Resist bonus against a punishing difficulty based on the beast's 15 Charisma. On a failure, the target suffers the Madness condition: they must roll a d10. (1-5: They fall Prone, weeping uncontrollably and losing their turn; 6-10: They laugh hysterically and must make a melee attack against the nearest creature, friend or foe).\n\nSickening Grace: Because the creature moves in unpredictable, jittery bursts, it gains a permanent Advantage on Defense(+2) against Ranged attacks.\n\nToxic Biology: The creature's blood and saliva are highly
