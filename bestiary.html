{name:`Skink: The Swamp Ambusher`,size:`Small`,type:`Humanoid (Reptilian)`,tier:`Minion`,tierColor:`#607080`,desc:`Standing barely four feet tall, the Skink is a lithe, crested reptilian darting through the jungle canopy and murky waters. What they lack in the robust strength of their larger kin, they make up for with cunning and sheer speed. They are the eyes and ears of the Lizardman warband, utilizing guerrilla tactics, poisoned weapons, and the treacherous swamp terrain to whittle down enemies before the heavy hitters arrive. A Skink rarely fights fair; they strike from the high branches with blowguns or hurl barbed javelins from the deep reeds, using the toxic flora of their home to lethal effect.`,agl:6,awa:5,cha:2,int:4,phy:1,wil:3,move:14,ap:3,def:5,wmArmor:2,wmBS:5,wmDP:15,wounds:10,focus:`+1/3`,reroll:1,luck:2,meleeHit:`+0`,meleeDmg:`+1`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+6`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`4-10`,gear:`Blowgun, Venom-Dipped Darts, Barbed Javelin`,meleeDetail:`Barbed Javelin (Used in melee)`,rangeDetail:`Blowpipe`,abilities:`Passive Traits\nCanopy Crawler: The Skink possesses a climbing speed equal to its normal Movement speed. They can move freely across branches, sheer walls, and ceilings without penalty, automatically gaining Advantage on stealth checks when elevated.\n\nSwamp Skirmisher: The Skink treats deep water and thick underbrush as normal terrain. Furthermore, if a Skink makes a Ranged attack while obscured by foliage, its position is not automatically revealed.\n\nHit and Fade: If the Skink successfully damages an enemy with a Melee or Ranged attack, its Movement speed is increased by 10 feet until the end of its turn, allowing it to easily retreat out of counter-attack range.\n\nAction-Based Abilities\nVenom-Dipped Dart (Range Cost: 2 Actions): The Skink fires a dart from the shadows. Make a Ranged attack (+3 To-Hit). On a hit, it deals only 1d10 + 6 Piercing Damage, but the target must surpass Physique TN 6 + Resist bonus or gain the Poisoned condition, taking 5 unmitigable damage at the start of their next 2 turns.\n\nJavelin Toss (Range Cost: 1 Action): A swift throw of a light spear. Make a Ranged attack (+3 To-Hit). On a hit, it deals 1d10 + 6 Piercing Damage.\n\nDarting Strike (Melee Cost: 1 Action): If cornered, the Skink stabs frantically with its javelin. Make a Melee attack (+0 To-Hit). If successful, it deals 4 Piercing Damage and the Skink immediately shifts 5 feet backward without triggering a defensive reaction.`},
{name:`Solathi Lord: Sol-Invictus`,size:`Enormous`,type:`Elemental Lord (Fire)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A gargantuan entity composed of "White-Hot Singularity Plasma" and swirling, dark magma pressurized into solid armor. Its core is a hyper-concentrated diamond-blue geode, pulsing with celestial-level heat. Its face is a blocky mask of smooth, dark stone with intense eyes glowing with fierce blue light. It moves with a terrifying, rhythmic thud—a slow but unstoppable stride that melts the ground into vitrified glass. Voluminous, blazing flame-whips of orange, red, and blue fire lash from its massive hands, while dense plumes of black and gray smoke erupt from its fissures. Its presence is a walking supernova that consumes the very atmosphere. Sol-Invictus does not just attack; it initiates a Total Thermal Event to vaporize all opposition and unmake local geography.`,agl:4,awa:7,cha:8,int:5,phy:18,wil:12,move:53,ap:3,def:9,wmArmor:30,wmBS:25,wmDP:`Immune`,wounds:550,focus:`+2/6`,reroll:3,luck:2,meleeHit:`+6`,meleeDmg:`+60`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+50`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`10`,mob:`1`,gear:`Random`,meleeDetail:`Celestial Flame-Whips`,rangeDetail:`Total Thermal Event`,abilities:`Passive Traits\nAtmospheric Consumption: Sol-Invictus breathes the very oxygen out of the air. Any enemy starting their turn within 60 feet of the Lord must pass a severe Physique(10) test. On a failure, they suffer 15 Asphyxiation damage and are Silenced (unable to speak or cast verbal spells) as the air is ripped from their lungs to feed the supernova.\n\nVitrified Wake: Every step it takes melts the ground. The entire battlefield within 60 feet is permanently turned into cracked lava glass, treating it as extreme Difficult Terrain. Any non-flying character that moves more than 10 feet on their turn takes 10 Fire/Slashing Damage from the jagged, superheated glass.\n\nPressurized Magma Armor: Standard weapons simply melt against its solid magma plating. Any physical Melee attack that fails to beat its 9 Defense or fails to overcome its 30 Armor Mitigation causes the attacker's weapon to instantly lose 1 tier of effectiveness (or shatter if non-magical) due to the intense, diamond-blue thermal heat.\n\nAction-Based Abilities\nCelestial Flame-Whip (Melee Cost: 2 Actions): The Lord lashes out with voluminous extensions of orange, red, and blue fire. Make a Melee attack (+6 To-Hit) with a massive 30-foot reach. If successful, it deals 1d10 + 60 Fire Damage. The target is instantly pulled 15 feet closer to the Lord and gains 2 Burning conditions(2d10 damage).\n\nTotal Thermal Event (Range Cost: 3 Actions): Sol-Invictus opens its blocky stone mask, unleashing the hyper-concentrated power of its blue geode core. Make a Ranged attack (+5 To-Hit) against a massive 80-foot cone. On a hit, targets take 4d10 + 50 Fire/Radiant Damage. The blast completely vaporizes all non-magical cover, water sources, and environmental structures in its path.\n\nMaelstrom of Smoke (Cost: 1 Action): The Lord forcibly vents the dense black and gray smoke from its fissures. A 40-foot radius around the Lord becomes heavily obscured (Total Concealment). All enemies caught in the smoke are instantly Blinded until they can move out of the cloud, making them easy prey for the Flame-Whips.`},
{name:`Solathi: The Cinder Lord`,size:`Giant`,type:`Elemental Lord (Fire)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A primeval architect of the Elemental Plane of Fire. It appears as a fifty-foot-tall humanoid silhouette composed of blinding, white-hot plasma encased in a shifting shell of semi-solid volcanic glass. Its eyes are twin supernovas, and its voice is the sound of a mountain collapsing into a furnace. Every step it takes melts stone into glass, and its breath is a pyroclastic flow that incinerates anything short of legendary dragon-scale armor. It is not just a fire; it is the death of a landscape.`,agl:8,awa:4,cha:5,int:2,phy:15,wil:9,move:`40/60F`,ap:3,def:7,wmArmor:29,wmBS:25,wmDP:`Immune`,wounds:450,focus:`+1/3`,reroll:2,luck:0,meleeHit:`+6`,meleeDmg:`+160`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+40`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-2`,gear:`None`,meleeDetail:`Plasma Lashes`,rangeDetail:`Pyroclastic Flow`,abilities:`Passive Traits\nGlass-Maker Aura: Every step the Cinder Lord takes turns stone to glass. Any ground within 40 feet of the Lord becomes severe Difficult Terrain. At the end of the Lord's turn, any non-flying enemy within this radius takes 15 Fire Damage and their Armor Mitigation is reduced by 5 as their gear begins to melt and warp.\n\nShifting Volcanic Shell: The Lord is protected by brittle but superheated glass. If a physical Melee attack successfully deals damage to the Lord, the glass shatters, dealing 10 Fire/Slashing Damage back to the attacker. Furthermore, the Lord is completely immune to the Grappled and Restrained conditions.\n\nSupernova Gaze: To look upon the Cinder Lord is to invite blindness. Any player character that starts their turn within 60 feet of the Lord and has line-of-sight must surpass Willpower TN 10 + Resist bonus. On a failure, they are Blinded for 1 round.\n\nAction-Based Abilities\nPyroclastic Exhalation (Range Cost: 3 Actions): The Lord unhinges its silhouette, exhaling a 100-foot cone of white-hot ash and gas. Make a Ranged attack (+5 To-Hit). On a hit, targets take 1d10 + 40 Fire Damage and 2 Burning conditions. This ash lingers for 3 rounds, creating a zone of total concealment that deals 10 Fire Damage to anyone inside.\n\nCrystalline Whip (Cost: 1 Action): The Lord lashes out with an arm of semi-solid glass and plasma. Make a Melee attack (+6 To-Hit) against a single target within 30 feet. On a hit, it deals 1d10 + 45 damage. If the target is reduced to 50% Health or less by this attack, they are Stunned as the glass shards embed in their flesh.\n\nMountain-Collapse Resonance (Cost: 1 Action): The Cinder Lord speaks with the voice of a dying mountain. All enemies within 50 feet must surpass Physique TN 9 + Resist bonus. On a failure, they take 30 Sonic/Fire Damage and are knocked Prone and Deafened for 1 round by the overwhelming resonance.`},
{name:`Solathi: The Ember-Sprite`,size:`Medium`,type:`Elemental (Fire)`,tier:`Minion`,tierColor:`#607080`,desc:`A flickering, waist-high manifestation of living heat. It doesn't have a solid form, appearing instead as a dancing core of white-hot plasma surrounded by a shifting body of orange and red flames. It moves with a frantic, crackling energy, leaving scorched footprints and a trail of black soot wherever it glides. Unlike other elementals, the Ember-Sprite is hyper-aggressive; it views everything organic as fuel. It emits a constant sound like a roaring hearth, and the air around it shimmers with a heat haze that makes its exact movements difficult to track.`,agl:6,awa:1,cha:-1,int:0,phy:0,wil:4,move:12,ap:3,def:5,wmArmor:0,wmBS:5,wmDP:`Immune`,wounds:18,focus:`0`,reroll:0,luck:0,meleeHit:`+1`,meleeDmg:`+10`,meleeHeal:`0`,rangeHit:`+1`,rangeDmg:`+12`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`0`,mob:`1-10`,gear:`None`,meleeDetail:`Scorching Touch`,rangeDetail:`Spitting a glob of plasma up to 50Ft`,abilities:`Passive Traits\nHeat Mirage: The shimmering air around the sprite warps light and trajectory. All non-magical Ranged attacks made against the Ember-Sprite automatically suffer Disadvantage.\n\nInsubstantial Plasma: Because its Physical stat is exactly 0, normal weapons pass right through its flames. Any physical Melee or Ranged attack that successfully hits the sprite automatically has its Wounds halved. However, any Cold or Water-based attacks deal double damage to it.\n\nOrganic Fuel-Hunger: The sprite becomes exponentially more dangerous when it finds tinder. Any time the Ember-Sprite successfully deals damage to a target that is primarily organic (flesh, leather armor, wood, or plant-matter), the target automatically gains 1 Burning condition.\n\nAction-Based Abilities\nScorching Touch (Melee Cost: 1 Action): The sprite lashes out to consume its prey. Make a Melee attack (+1 To-Hit). If successful, it deals 1d10 + 10 Fire Damage.\n\nFrantic Flicker (Cost: 1 Action): The sprite instantly darts up to 20 feet without triggering attacks of opportunity. It leaves a trail of white-hot embers in every square it passes through. Any enemy stepping into these squares takes 5 Fire Damage.\n\nFeed the Hearth (Cost: 2 Actions): The sprite latches onto a target to rapidly consume their organic gear. Make a Melee attack (+1 To-Hit). If successful, it deals 15 Fire Damage and the sprite instantly heals 5 damage as it absorbs the heat of the burning material.`},
{name:`Solathi: The Solar Core`,size:`Large`,type:`Elemental (Fire)`,tier:`Elite`,tierColor:`#b45309`,desc:`A primeval force of nature, often manifesting near active volcanoes or summoned to incinerate fortresses. Standing around 15 feet tall, it is a towering humanoid shape composed of roiling white and orange flames. Its "skin" is a shifting shell of semi-solid magma that constantly cracks to reveal a blinding, spinning solar core within. It does not walk; it flows like a lava current, melting the ground into glass with every step. To stand near it makes your skin blister and your breath catch as the air itself becomes a searing liquid.`,agl:8,awa:5,cha:1,int:2,phy:9,wil:6,move:17,ap:3,def:7,wmArmor:10,wmBS:15,wmDP:`Immune`,wounds:85,focus:`0`,reroll:1,luck:1,meleeHit:`+4`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`0`,mob:`1-4`,gear:`None`,meleeDetail:`Dripping Magma Lashes`,rangeDetail:`Special Abilities`,abilities:`Passive Traits\nThe Glass-Walker: The elemental melts the ground it walks on. Any space the Fire Elemental occupies or moves through is instantly turned into superheated, molten glass. This creates severe Difficult Terrain. Any non-flying enemy that starts their turn on or moves through this glass takes 10 Fire Damage and their movement speed is halved.\n\nBlinding Magma Shell: Striking the creature is inherently dangerous. If a player successfully hits the elemental with a physical Melee attack, the magma shell cracks, splashing the attacker with liquid fire for 5 Fire Damage. Additionally, if the attacker rolls a Critical Hit, the blinding white light of the core flashes, instantly Blinding the attacker for 1 round.\n\nSearing Liquid Air: The ambient temperature around the elemental is lethal. Any enemy starting their turn within 15 feet of the elemental must surpass Physique TN 8 + Resist bonus or suffer 1 Fatigued condition from heatstroke and dehydration.\n\nAction-Based Abilities\nMagma Lash (Melee Cost: 1 Action): The elemental swings a dripping, whip-like arm of magma. Make a Melee attack (+4 To-Hit) against a target up to 15 feet away. If successful, it deals 1d10 + 25 Fire/Slashing Damage, and the target gains 1 Burning condition (1d10 damage).\n\nSolar Flare Burst (Range Cost: 2 Actions): The elemental intentionally forces its spinning white core to vent. Make a Ranged attack (+3 To-Hit) against all targets in a 20-foot radius. On a hit, targets take 2d10 + 20 Fire/Radiant Damage, and are pushed 10 feet backward by the concussive thermal shockwave.\n\nLava Current (Cost: 1 Action): The elemental momentarily collapses its humanoid shape into a rushing wave of magma, moving up to 30 feet in a straight line. It can freely pass through enemy spaces during this movement. Any enemy it passes through automatically takes 15 Fire Damage and must surpass Agility TN 8 + Resist bonus or fall Prone.`},
{name:`Sphinx: The Chronos-Guardian`,size:`Giant`,type:`(Celestial / Boss)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Sphinx is a majestic and terrifying fusion: the massive, powerful body of a desert lion, the expansive wings of a great eagle, and the stoic, noble face of a human sovereign. Their eyes don't just see your physical form; they see the threads of your past and the possibilities of your future. A Sphinx doesn't merely ask a question; it imposes a psychic lock on your reality, unwriting the actions of the weak-willed and forcing them to relive failing moments until they are erased from the timeline. To draw your blade against a Sphinx is to fight time itself.`,agl:3,awa:6,cha:5,int:18,phy:12,wil:9,move:`27/53F`,ap:4,def:8,wmArmor:25,wmBS:35,wmDP:30,wounds:330,focus:`+3/9`,reroll:5,luck:5,meleeHit:`+5`,meleeDmg:`+40`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+5`,castDmg:`+50`,castHeal:`0`,castType:`Wizardry`,fear:`8`,mob:``,gear:`None`,meleeDetail:`Mythical Lion Claws`,rangeDetail:`None`,abilities:`Passive Traits\nThreads of Foresight: Because the Sphinx can see the immediate future, it cannot be Surprised or Flanked. Furthermore, any enemy attacking the Sphinx with a physical Melee or Ranged weapon must roll their To-Hit with Disadvantage, as the Sphinx has already seen the trajectory of the blow and adjusted its stance.\n\nThe Psychic Lock: Any enemy that starts its turn within 60 feet of the Sphinx must surpass Willpower TN 9 + Resist bonus. On a failure, their reality is anchored; they cannot use any Movement actions this turn, forced to stand entirely still while their mind fights the lock.\n\nRiddle's Resonance: The Sphinx's voice is a magical conduit. Any time the Sphinx speaks or asks a riddle, its Charisma modifier acts as a passive aura. Any enemy within 60 feet cannot benefit from Inspire, Focus, or any Morale-boosting effects while in its presence, as their minds are weighed down by its sovereign authority.\n\nAction-Based Abilities\nPounce of the Sovereign (Melee Cost: 2 Actions): The Sphinx leaps up to 40 feet to crash into a target with its massive lion body. Make a melee attack (+5 To-Hit). If successful, it deals normal 1d10 + 90 damage and the target must surpass Physique TN 10 + Resist bonus or gain the Prone and Grappled conditions. If this attack is used against a target that is currently suffering from The Psychic Lock, the attack automatically hits and deals an additional 2d10 damage as they are ripped from their time-loop by the physical trauma.\n\nThe Psychic Lock (Cost: 2 Actions): The Sphinx fixes its sovereign gaze on a target within 80 feet and speaks a riddle of their own timeline. The target must pass a severe Willpower(11) test. If they fail, they are psychically locked in a time-loop: they immediately suffer 4 Stunned conditions (losing their next turn). Furthermore, the Sphinx literally "unwrites" the target's timeline—any Wounds that the target inflicted upon the Sphinx during the previous round are instantly healed by the Sphinx.\n\nTemporal Displacement Buffet(TN13) (Casting Cost: 2 Actions): The Sphinx beats its expansive eagle wings, unleashing a 40-foot cone of chronal wind and golden sand. Make a Casting roll (+8 To-Cast) against all enemies in the cone. On a success, they take 3d10 + 40 temporal damage. In addition, time slows down drastically for them: affected targets lose 1 Action on their next turn and have their Movement halved.\n\nThe Chronos Riddle(TN9) (Casting Cost: 2 Actions): The Sphinx projects a reality-warping paradox directly into the minds of its enemies. A 40-foot radius area within 80 feet becomes a zone of fractured time. All enemies in the zone must surpass Intelligence TN 10 + Resist bonus or take 40 Psychic Damage and gain the Dazed and Slowed conditions as they are forced to mentally relive their most painful failures.`},
{name:`Stone Golem: The Monolith Warden`,size:`Giant`,type:`Construct / Elemental`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Forged not in a foundry, but carved directly from the heart of a mountain or the pillars of a forgotten temple, the Stone Golem is a towering, 20-foot-tall humanoid shape composed of solid, rune-carved granite. It does not hiss with steam; instead, its joints grind with the deafening sound of shifting tectonic plates. Overgrown with centuries of moss and creeping vines, it acts as a silent, eternal sentinel. It has no need for weapons; its fists are heavy enough to cave in a fortress gate. Its featureless stone face is set in a permanent, stoic mask that never shows fatigue, pain, or mercy.`,agl:1,awa:5,cha:2,int:4,phy:15,wil:6,move:20,ap:3,def:9,wmArmor:30,wmBS:15,wmDP:`Immune`,wounds:450,focus:`0`,reroll:0,luck:0,meleeHit:`+6`,meleeDmg:`+40`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-2`,gear:`None`,meleeDetail:`Granite Fists`,rangeDetail:`Hurled Rubble`,abilities:`Passive Traits\nImmutable Form: The magic that binds the Stone Golem is absolute. It is completely immune to any spell or effect that would alter its form (such as Petrification or Polymorph) and cannot be magically teleported against its will.\n\nMagical Inertia: The Golem's ancient stone acts as a grounding rod for hostile magic. Any spell cast directly at the Golem that deals Fire, Cold, or Lightning damage automatically has its total Wounds halved before applying to Damage Mitigation.\n\nTectonic Mass: The Giant-sized Monolith Warden is completely immune to the Knockback, Prone, Grappled, and Restrained conditions from any creature smaller than Giant size. It ignores all Movement penalties for moving through non-magical Difficult Terrain, crushing obstacles into dust as it walks.\n\nAction-Based Abilities\nFortress-Breaker Slam (Melee Cost: 1 Action): The Golem brings down a fist the size of a wagon. Make a Melee attack (+6 To-Hit) with a 15-foot reach. If successful, it deals 1d10 + 40 Bludgeoning Damage. If this attack targets a door, wall, or environmental cover, it deals double damage, instantly obliterating it.\n\nRune of Slowing (Cost: 2 Actions): The ancient glyphs carved into its chest flare with suppressing magic. All enemies within a 30-foot radius must surpass Willpower TN 9 + Resist bonus. On a failure, they gain the Slowed condition for 1 round (their Movement is halved, and they lose 1 Action on their next turn) as time itself seems to grind to a halt around the titan.\n\nAvalanche Stride (Melee Cost: 1 Action): The Golem uses its massive weight to trample its foes. It moves up to its full 30 Movement speed in a straight line, freely entering the spaces of smaller creatures. Any creature whose space it enters must surpass Agility TN 8 + Resist bonus or take 40 Bludgeoning Damage and be knocked Prone.`},
{name:`Storm Giant: The Tempest-Lord`,size:`Titanic`,type:`Giant / Elemental Boss`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Standing an impossible 50 feet tall, the Storm Giant is the living embodiment of a world-ending tempest. Their skin resembles the bruised, churning purple-black of a supercell, and their eyes burn like exploding stars. Clad in armor forged from the hearts of dying thunderheads and wielding a greatsword that arcs with the power to split continents, they do not merely command storms—they are the storm. They are philosophers of the sky, spending decades predicting the future through the stars. But if their mountain is threatened, they descend with the fury of a hurricane, using the atmosphere itself as a blade. To stand in their shadow is to stand at the edge of the apocalypse.`,agl:3,awa:5,cha:7,int:9,phy:21,wil:15,move:`40/80F`,ap:4,def:8,wmArmor:50,wmBS:35,wmDP:`Immune`,wounds:750,focus:`+3/9`,reroll:3,luck:1,meleeHit:`+7`,meleeDmg:`+60/+120(2H)`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+70`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`10`,mob:`1`,gear:`Thunderhead Armor, Continent-Splitter Greatsword`,meleeDetail:`Continent-Splitter`,rangeDetail:`Supercell Bolt`,abilities:`Passive Traits\nPhilosopher’s Foresight: Having spent decades predicting the future, the Tempest-Lord cannot be Surprised, automatically wins Initiative ties, and forces any attacker rolling a Critical Hit against him to re-roll and take the lower result.\n\nEye of the Supercell: The area within 120 feet of the Giant is a Category 5 hurricane. All non-magical Ranged attacks automatically fail (the wind tears the arrows away). Any enemy attempting to fly within this radius is instantly violently grounded, taking falling damage.\n\nThunderhead Recoil: His armor is made of dying clouds and raw static. Any Melee attack that strikes the Giant triggers a recoil of lightning, instantly dealing 15 Lightning Damage back to the attacker and pushing them 5 feet backward.\n\nAction-Based Abilities\nContinent-Splitter (Melee Cost: 2 Actions): The Giant swings a greatsword that arcs with apocalyptic power. Make a Melee attack (+7 To-Hit) with a 40-foot reach. If successful, it deals 1d10 + 120 Slashing/Lightning Damage, and completely destroys any non-magical cover, shields, or structures in the weapon's path.\n\nAtmospheric Guillotine (Range Cost: 2 Actions): The Tempest-Lord uses the atmosphere itself as a blade, condensing air pressure into a razor-sharp wave. Make a Ranged attack (+5 To-Hit) in a 60-foot line. On a hit, targets take 1d10 + 70 Force/Slashing Damage and are knocked Prone.\n\nWrath of the Exploding Star (Cost: 4 Actions): The Giant spends his entire Titanic turn to unleash the cosmic power of his burning eyes. A 100-foot radius around the Giant is bombarded with devastating celestial lightning. All enemies must pass a severe Agility(15) test. On a failure, they take 5d10 + 50 Lightning/Radiant Damage and are permanently Blinded and Deafened by the sheer magnitude of the blast.`},
{name:`Succubus Matriarch: The Lust-Queen`,size:`Large`,type:`Fiend (Demon)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Matriarch stands nearly 8 feet tall, possessing an otherworldly, shifting beauty that adapts to the deepest desires of whoever looks upon her. Her skin is a soft, bruised violet, and her wings are covered in a fine, velvet-like down that absorbs light. She wears jewelry made of "Frozen Tears"—gems formed from the sorrow of those she has betrayed. She views physical combat as a desperate, last-resort failure. In battle, she is a blurring phantom of motion and psychic pressure, turning your own subconscious and allies against you until you are entirely isolated and broken.`,agl:9,awa:4,cha:12,int:6,phy:5,wil:15,move:14,ap:4,def:5,wmArmor:10,wmBS:30,wmDP:35,wounds:75,focus:`+3/9`,reroll:3,luck:3,meleeHit:`+6`,meleeDmg:`+35`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+45`,castHeal:`0`,castType:`Wizardry`,fear:`7`,mob:`1`,gear:`Frozen Tear Jewelry`,meleeDetail:`Desperate Rake, Velvet-Down Wings & Claws`,rangeDetail:`None`,abilities:`Passive Traits\nAura of Frozen Tears: The sorrowful gems she wears emit a 30-foot aura of profound, crushing emotional despair. Any enemy within this radius completely loses the benefits of any Morale bonuses, Inspire actions, or Focus points. Furthermore, healing spells cast within this radius only heal for half their normal amount, as the target's will to live is actively suppressed.\n\nPhantom Motion: She moves with a blurring, unnatural grace. The Matriarch never triggers free attacks or attacks of opportunity when moving out of melee range, and she can move seamlessly through spaces occupied by other creatures without penalty.\n\nShifting Visage of Desire: The Matriarch's face and form constantly shift to reflect the deepest subconscious desires of the person looking at her. Any enemy attempting to target her with a Melee or Ranged attack must first surpass Willpower TN 12 + Resist bonus. On a failure, they suffer Disadvantage on the To-Hit roll because their mind actively fights their body's attempt to harm her.\n\nAction-Based Abilities\nEcstatic Agony(TN12) (Casting Cost: 1 Action): The Matriarch touches a target's mind, flooding their nervous system with a conflicting mix of extreme pleasure and agonizing pain. Make a Casting roll (+4 To-Cast). If successful, it deals 1d10 + 45 psychic damage. The target must pass a severe Willpower(12) test or become Charmed for 1 turn. While Charmed this way, they cannot willingly move away from the Matriarch and will actively step in front of the next physical attack aimed at her.\n\nPhantom Step (Cost: 1 Action): The Matriarch blurs into a cloud of violet mist, instantly teleporting up to 30 feet to an unoccupied space she can see. If she teleports adjacent to a Charmed ally, she heals 10 damage by passively siphoning their devotion.\n\nThe Velvet Puppeteer(TN11) (Casting Cost: 2 Actions): This is her ultimate tool of betrayal. She locks eyes with a target within 60 feet. Make a Casting roll (+4 To-Cast) directly against the target's Willpower defense. On a success, she forcefully overtakes their nervous system. The Matriarch immediately forces the target to make one free Melee or Ranged attack against another target of her choice, using the victim's own stats, weapons, and bonuses.\n\nWeaponize the Subconscious(TN13) (Casting Cost: 2 Actions): The Matriarch rips a dark secret or hidden resentment from a target's mind and broadcasts it telepathically to the rest of the party. The target must pass a severe Willpower(15) test. If they fail, they suffer 2 Stunned conditions as their mind reels from the exposure, and all allied creatures within 30 feet of the target take 2d10 + 20 psychic damage from the mental shockwave of the revelation.`},
{name:`Tidalborn Lord: The Drowned Throne`,size:`Colossal`,type:`Elemental Lord (Water)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Drowned Throne is not a creature that emerged from the sea — it is the reason certain seas are considered cursed. A colossal, semi-permanent vortex of black ocean water spanning hundreds of feet, its core is a crushing column of absolute pressure at the bottom of which sits a throne of compacted ship wreckage, drowned armour, and crushed stone — the accumulated weight of everything the deep has ever claimed. It does not move quickly. It does not need to. The ocean moves around it, and everything eventually flows toward a drain.`,agl:12,awa:12,cha:5,int:10,phy:10,wil:20,move:45,ap:4,def:13,wmArmor:0,wmBS:65,wmDP:`Immune`,wounds:620,focus:`+6/18`,reroll:3,luck:5,meleeHit:`+6`,meleeDmg:`+75`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+55`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`10`,mob:`1`,gear:`None`,meleeDetail:`The Weight of the Deep: A crushing two-armed slam that hits all creatures in a 25ft arc for 4d10 + melee bonus damage. Targets must pass Physique TN 16 or be knocked Prone and pulled 20ft toward the Throne's core.`,rangeDetail:`Tide of Ruin: A wall of pressurised black water launched at a 40ft line for 5d10 + range bonus damage. All targets in the line must pass Physique TN 16 or be knocked Prone and Stunned for 1 turn.`,abilities:`Passive Traits\nLord of the Drowned: All other Tidalborn within 500ft of the Drowned Throne are treated as Inspired — they gain +2 To-Hit, +2 Defense, and cannot be Stunned or Feared while the Lord is present.\nAbsolute Pressure (Aura): Any creature that starts its turn within 80ft of the Throne must pass Physique TN 14 or take 2d10 damage as the pressure field crushes inward. Armour provides no protection against this effect.\nThe Inevitable Pull: Any creature within 60ft of the Throne that is knocked Prone is immediately dragged 20ft toward the core as a free action — no save.\nAbyssal Immunity: The Drowned Throne takes only half damage from all non-magical attacks. It is immune to all conditions. Magical fire deals normal damage but is extinguished immediately on contact.\n\nActive Abilities\nThe Drowning (3 AP): Once per encounter, the Throne releases a catastrophic inward surge. All creatures within 100ft must pass Physique TN 18 or be pulled 40ft toward the core and take 6d10 damage ignoring all Damage Mitigation as pressure detonates around them. On a success, targets still take 3d10 damage and are pulled 15ft.\nThe Throne Rises (Passive): If the Drowned Throne reaches 0 damage above water, it does not die — it submerges. If the encounter takes place near a body of water large enough to submerge in, the Throne retreats to the deep and cannot be pursued by non-aquatic creatures. It returns at full wounds after 24 hours.`},
{name:`Tidalborn: The Abyssal Maw`,size:`Huge`,type:`Elemental (Water)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Abyssal Maw is not water that thinks — it is the deep ocean that has decided to walk. A towering vortex of black seawater standing thirty feet at its crest, its form is a permanent whirlpool centred on a crushing vacuum core that pulls everything toward it. Debris, bodies, and shattered stone orbit it in a slow spiral before being dragged inward and crushed. It does not pursue prey so much as create conditions that make prey come to it. Its intelligence is tidal: patient, inevitable, absolute.`,agl:10,awa:6,cha:2,int:5,phy:8,wil:12,move:35,ap:3,def:10,wmArmor:0,wmBS:35,wmDP:`Immune`,wounds:380,focus:`+3/9`,reroll:3,luck:4,meleeHit:`+5`,meleeDmg:`+45`,meleeHeal:`0`,rangeHit:`+4`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`7`,mob:`1`,gear:`None`,meleeDetail:`Crushing Tide: A massive wave-strike that hits all creatures in a 15ft arc for 3d10 + melee bonus damage. Targets must pass Physique TN 12 or be knocked Prone and pushed 20ft back.`,rangeDetail:`Depth Charge: Launches a ball of hyper-pressurised water at a single target for 3d10 + range bonus damage. On a natural 10 To-Hit, the pressure detonates inside armour — the target loses 10 Damage Mitigation (Armour) until the end of the encounter.`,abilities:`Passive Traits\nThe Pull of the Deep: Any creature that starts its turn within 50ft of the Abyssal Maw must pass Physique TN 10 or be dragged 15ft closer. Flying creatures are unaffected. Creatures already in melee range are automatically grappled — Physique TN 12 to break free.\nAbyssal Body: The Maw takes only half damage from all non-magical attacks. It is immune to Prone, Grappled, Bleeding, Stunned, and Burning conditions.\nPressure Field: The area within 30ft of the Maw is treated as deep water for movement purposes — movement costs double AP. Non-aquatic creatures that end their turn in this aura take 1d10 damage as the pressure bears down on their bodies.\n\nActive Abilities\nSwallow (3 AP): The Maw attempts to engulf a single Large or smaller creature within melee range. Target must pass Physique TN 14 or be Swallowed — taking 3d10 damage per turn while inside and unable to act. A Physique TN 14 test at the start of each turn allows escape. The Maw may only Swallow one creature at a time.`},
{name:`Tidalborn: The Crushing Current`,size:`Large`,type:`Elemental (Water)`,tier:`Elite`,tierColor:`#b45309`,desc:`A Tidalborn of significant mass and purpose — a churning column of saltwater and pressurised brine standing roughly twelve feet tall, moving with deceptive speed for its size. Its form is vaguely humanoid when stationary, two vast arms of churning water raised like waves about to break, but it loses all shape when it charges — becoming a horizontal wall of pressurised water that hits like a landslide. It thinks in simple terms: pressure, depth, current. It understands enough to position itself between prey and escape routes.`,agl:7,awa:4,cha:0,int:2,phy:4,wil:7,move:24,ap:3,def:7,wmArmor:0,wmBS:20,wmDP:`Immune`,wounds:90,focus:`+1/3`,reroll:2,luck:3,meleeHit:`+3`,meleeDmg:`+22`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+18`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`1-3`,gear:`None`,meleeDetail:`Pressure Slam: A focused jet of water slams into the target for 2d10 + melee bonus damage. Target must pass Physique TN 9 or suffer 1 Stunned condition as the pressure detonates against armour.`,rangeDetail:`Brine Lance: A pressurised spike of saltwater fired at range for 2d10 + range bonus damage. Ignores 5 points of Armour Mitigation — the water finds the gaps.`,abilities:`Passive Traits\nFluid Form: The Crushing Current takes only half damage from all non-magical Piercing, Slashing, and Bludgeoning attacks. It is immune to Prone, Grappled, and Bleeding conditions.\nDrag Under: Any target the Current hits in melee must pass Physique TN 9 or have their movement speed halved on their next turn as water floods their armour and gear.\nDouse: Any magical fire effect within 20ft of the Current is suppressed for 1 turn at the start of the Current's turn. Solathi within 30ft take 1d10 damage per turn from proximity.`},
{name:`Tidalborn: The Ripple`,size:`Small`,type:`Elemental (Water)`,tier:`Minion`,tierColor:`#607080`,desc:`The Ripple is the smallest and most common manifestation of water given will — a knee-high, translucent orb of agitated brine that skitters across surfaces with a wet slapping sound. It lacks true intelligence but possesses a predatory instinct for anything warm. Its body is perpetually in motion, surface tension rippling in irregular patterns as it lurches toward prey. It cannot speak, reason, or coordinate — it simply pursues heat and moisture, drawn to living creatures like a droplet toward a drain.`,agl:5,awa:2,cha:0,int:0,phy:0,wil:3,move:18,ap:2,def:4,wmArmor:0,wmBS:8,wmDP:`Immune`,wounds:22,focus:`0`,reroll:1,luck:2,meleeHit:`+2`,meleeDmg:`+8`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:``,mob:`4-10`,gear:`None`,meleeDetail:`Surge: A crashing wave of pressurised water slams into a single target for 1d10 + melee bonus damage. Targets must pass Physique TN 5 or be knocked Prone.`,rangeDetail:`0`,abilities:`Passive Traits\nAmorphous Brine: The Ripple has no solid body. It is immune to Bleeding, Prone, Grappled, and Stunned conditions. Non-magical Piercing and Slashing weapons deal half damage as blades pass through the water form.\nSeep: The Ripple can move through gaps as small as half an inch — under doors, through grates, around armour joints. It cannot be blocked by physical barriers that are not watertight.\nExtinguish: Contact with the Ripple automatically extinguishes non-magical flames on a touched target or surface.`},
{name:`Treant: The Elder-Bark`,size:`Enormous`,type:`Plant (Elemental / Boss)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A Treant stands nearly 30 feet tall, its "skin" a thick, gnarled armor of iron-hard bark covered in layers of ancient moss and lichen. Its arms are massive boughs capable of sweeping aside a line of knights like autumn leaves, and its legs are trunk-like pillars that leave deep craters in the earth with every step. Generally peaceful, meditative beings, they possess a "Slow-Burning Rage." When a forest is desecrated, the Treant awakens, and its wrath is as unstoppable as a mudslide. They don't just fight; they mobilize the environment itself, commanding the very brush and roots to rise up and strangle the invaders.`,agl:1,awa:6,cha:4,int:5,phy:18,wil:15,move:20,ap:3,def:12,wmArmor:25,wmBS:30,wmDP:`Immune`,wounds:400,focus:`+4/12`,reroll:2,luck:2,meleeHit:`+6`,meleeDmg:`+50`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`+4`,castDmg:`+40`,castHeal:`+20`,castType:`Druidism`,fear:`7`,mob:`1`,gear:`None`,meleeDetail:`Massive Boughs`,rangeDetail:`Uprooted Boulders/Trees`,abilities:`Passive Traits\nIron-Bark Anatomy: The Treant is a massive construct of dense living wood. It is completely immune to the Bleeding and Poison conditions. Piercing weapons (like arrows, spears, or rapiers) simply get stuck in its bark, dealing exactly half damage. However, it is highly vulnerable to Fire; any Fire-based attacks that bypass its Armor Mitigation deal double damage.\n\nDeep Roots: As long as the Treant is standing on natural earth, it cannot be knocked Prone, physically moved, or teleported against its will by any mortal force. Furthermore, at the start of its turn, it draws nutrients from the soil, automatically healing 2d10 + 20 damage.\n\nSlow-Burning Rage: The Treant's fury escalates as the forest (or itself) is harmed. For every 50 damage the Elder-Bark loses, it permanently gains +1 to its Melee To-Hit and its Movement increases by 10 feet as its sluggishness burns away into violent frenzy.\n\nAction-Based Abilities\nAutumn Sweeper (Melee Cost: 2 Actions): The Treant swings its massive, bough-like arms in a brutal 180-degree arc in front of it. It makes a single To-Hit roll (+6) applied against the Defense of up to 4 targets in the arc. Anyone hit takes normal 1d10 + 45 damage, is violently pushed 20 feet backward, and must surpass Physique TN 13 + Resist bonus or be knocked Prone.\n\nEarth-Crater Stomp (Melee Cost: 1 Action): The Elder-Bark raises a pillar-like leg and brings it down with the force of a mudslide. Make a Melee attack (+4 To-Hit) against a single target. On a hit, it deals 1d10 + 50 Bludgeoning Damage. If the target survives, they are driven directly into the earth and gain the Paralyzed condition until they can dig themselves out.\n\nReclaim the Soil(TN10) (Casting Cost: 2 Actions): The Treant commands the surrounding environment to consume the intruders. Massive, thorny roots erupt from the ground in a 60-foot radius around the Treant. The entire area becomes severe difficult terrain. Any enemy starting their turn in this zone must surpass Agility TN 10 + Resist bonus or become Grappled by the roots (Movement 0) and take 2d10 crushing damage as the earth tries to pull them under.\n\nTimber Toss (Range Cost: 1 Action): The Treant reaches down, easily uproots a fully grown tree or a massive boulder, and hurls it across the battlefield. Make a Ranged attack (+2 To-Hit) at a target up to 120 feet away. If successful, it deals 1d10 + 30 damage. If this attack misses, the projectile shatters on the ground, dealing 2d10 shrapnel damage to anyone within 10 feet of the impact zone.`},
{name:`Treant: The Grove-Warden`,size:`Giant`,type:`Plant (Elemental)`,tier:`Boss`,tierColor:`#b91c1c`,desc:`Standing roughly 20 feet tall, the Grove-Warden is the steadfast defender of the forest borders. While they lack the apocalyptic, slow-burning rage of the Elder-Barks, these animated oaks and pines are brutal, unyielding sentinels. Their bark is thick and grooved, serving as a natural armor that splinters swords and blunts axes. They are not prone to sudden mobilization; rather, they stand perfectly still for decades, blending seamlessly into the treeline until an intruder strikes the first blow. Once provoked, they unleash heavy, crushing sweeps with their massive boughs to pulp the threat into fertilizer.`,agl:1,awa:5,cha:4,int:3,phy:9,wil:6,move:17,ap:3,def:6,wmArmor:20,wmBS:15,wmDP:`Immune`,wounds:200,focus:`+1/3`,reroll:1,luck:1,meleeHit:`+4`,meleeDmg:`+28`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+20`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`4`,mob:`1-3`,gear:`None`,meleeDetail:`Massive Boughs`,rangeDetail:`Can hurl large rocks or heavy deadwood`,abilities:`Passive Traits\nDeep-Rooted: Because of its immense weight and wooden physiology, the Warden is completely immune to being pushed, Grappled, or knocked Prone by any creature of Large size or smaller.\n\nTimber Hide: The Warden's bark is exceptionally thick. It gains resistance (takes half damage) from all non-magical Piercing and Bludgeoning weapons. However, it possesses a severe vulnerability to Fire, taking double damage from all flame-based attacks as its dry foliage ignites.\n\nFalse Canopy: While the Treant stands completely still in a forested environment, it is visually indistinguishable from a normal, mundane tree. It automatically gains Advantage on checks made to ambush intruders.\n\nAction-Based Abilities\nCrushing Branch (Melee Cost: 1 Action): A straightforward, heavy swing with a massive wooden arm. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 28 Bludgeoning Damage.\n\nUprooting Sweep (Melee Cost: 2 Actions): The Treant drags a heavy branch across the ground in a wide arc. All enemies within a 15-foot cone must surpass Agility TN 7 + Resist bonus. On a failure, they take 1d10 + 28 Bludgeoning Damage and are violently knocked Prone.\n\nSplintering Grasp (Cost: 1 Action): The Treant attempts to crush a target within its massive hands. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 15 Bludgeoning Damage and the target is Grappled. While Grappled in this way, the target takes an automatic 10 Bludgeoning Damage at the start of their turn from the sheer pressure.`},
{name:`Tri-Horned Siege Beast`,size:`Giant`,type:`Beast (Prehistoric)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Living Ram\nA towering, prehistoric juggernaut bred specifically to shatter fortified gates and break the morale of entrenched armies. It features a massive, front-heavy bone crest and three forward-facing horns of unbreakable bone. Because of its Giant size, its physical damage and wound pool are exponentially multiplied, making it a walking catastrophe on the battlefield. It is completely devoid of tactical nuance; it is pointed at a target by its beastmasters, enraged, and set loose. When the Siege Beast charges, the earth violently trembles, and the only viable`,agl:2,awa:4,cha:0,int:1,phy:15,wil:5,move:23,ap:3,def:6,wmArmor:20,wmBS:15,wmDP:25,wounds:375,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+24`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1`,gear:`Iron Chains, Beastmaster's Harness`,meleeDetail:`Unbreakable Horns`,rangeDetail:`None`,abilities:`Passive Traits\nSiege-Breaker: The beast's horns are designed to shatter fortifications. It deals double damage to all inanimate objects, structures, gates, and barricades. Furthermore, if the Beast strikes a target wielding a Shield, the Shield is instantly destroyed.\n\nUnstoppable Mass: Because of its Giant size and quadrupedal stance, the Siege Beast is completely immune to being Grappled, pushed, or knocked Prone by any creature of Large size or smaller. It can walk freely through the spaces of Medium or smaller creatures.\n\nFrontal Bone Crest: The massive frill of bone protecting its head makes it incredibly resilient from the front. The beast gains a permanent +2 to its Defense against any Ranged or Melee attacks originating from directly in front of it.\n\nAction-Based Abilities\nJuggernaut Charge (Cost: 2 Actions): The beast lowers its head and thunders forward. It moves up to 35 in a straight line. Any creature in its path must make an Agility(8) test against its Physical To-Hit. On a failure, they take 1d10 + 45 Piercing/Bludgeoning Damage, are launched 15 feet to the side, and knocked Prone.\n\nGore and Toss (Melee Cost: 1 Action): The beast violently jerks its head upward to skewer a target. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 45 Piercing Damage, and if the target is Medium or smaller, they are violently thrown 20 feet backward by the toss.\n\nEarthshaking Stomp (Cost: 1 Action): The juggernaut rears up and slams its massive front legs into the earth. All enemies within a 20-foot radius must surpass Agility TN 7 + Resist bonus or take 15 Bludgeoning Damage and fall Prone due to the localized tremor.`},
{name:`Triad Weaver (Arcane)`,size:`Medium`,type:`Fey / Caster`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`"Three minds, three voices, one devastating will. The Triad Weaver does not cast spells sequentially; it casts them simultaneously, pulling from three different dimensions of magic at once to shatter the minds and bodies of its foes."`,agl:3,awa:4,cha:2,int:6,phy:1,wil:5,move:20,ap:3,def:12,wmArmor:4,wmBS:8,wmDP:3,wounds:33,focus:`+3/9`,reroll:3,luck:3,meleeHit:`+1`,meleeDmg:`+4`,meleeHeal:`0`,rangeHit:`+3`,rangeDmg:`+12`,rangeHeal:`0`,castHit:`+8`,castDmg:`+24`,castHeal:`+3`,castType:`Wizardry`,fear:`3`,mob:`1-3`,gear:`Tri-woven Robes, Staff of the Third Eye`,meleeDetail:`Tri-Strike Staff (+1)`,rangeDetail:`None`,abilities:`Passive Traits\nTriple Mind: The Weaver is immune to Mind-Altering, Charming, and Illusion effects. It rolls all Awareness/Perception checks with Advantage because three minds are always watching.\n\nHarmonic Warding: Any incoming spell damage is automatically reduced by 3. If a spell deals an exact multiple of 3 in damage, the spell is entirely absorbed and converted into +1 Focus.\n\nHovering Step: The Weaver floats 3 feet off the ground, ignoring difficult terrain, ground-based traps, and leaving no tracks or sound.\n\nActions\nTriumvirate Blas(TN6) - Casting Cost: 2: Fires 3 arcane bolts at up to 3 different targets. Make 3 separate casting attacks. Each successful hit deals 1d10 + 24 Casting bonus damage.\n\nTriangle of Binding(TN8) - Casting Cost: 2: Connects 3 enemies in a glowing ethereal triangle. Targets must make a Willpower(6) Save. On a failure, they are Paralyzed for 1 round and share any damage dealt to the other bound targets.\n\nTrifold Restoration(TN7) - Casting Cost: 2): Heals up to 3 allies. Each ally restores 1d10 + Casting heal bonus damage and is cleansed of 1 negative condition.`},
{name:`Troll: The Mire-Brute`,size:`Large`,type:`Monstrosity (Giant-Kin)`,tier:`Elite`,tierColor:`#b45309`,desc:`The Mire-Brute is a hulking, foul-smelling abomination that makes its home in stagnant swamps, abandoned sewers, or under rotting bridges. Standing over 10 feet tall, its body is disproportionate, with massive, elongated arms that drag along the ground and a hunched back covered in pustules. Its rubbery, grey-green flesh seethes with hyper-cellular regeneration; you can literally watch its wounds knit back together and severed limbs twitch as they try to reattach. It reeks of copper, rotting meat, and stomach acid, driven by a metabolism that requires it to constantly consume living flesh just to fuel its violently regenerating cells.`,agl:3,awa:5,cha:0,int:1,phy:9,wil:6,move:17,ap:3,def:6,wmArmor:18,wmBS:10,wmDP:40,wounds:135,focus:`0`,reroll:1,luck:1,meleeHit:`+4/+6`,meleeDmg:`+30`,meleeHeal:`0`,rangeHit:`+2`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1-5`,gear:`Relies on its claws and environment.`,meleeDetail:`Filthy Claws & Bite`,rangeDetail:`Hurled Filth/Boulders`,abilities:`Passive Traits\nHyper-Cellular Regeneration: The Troll’s signature terrifying trait. At the start of its turn, the Troll automatically heals 1d10 damage and instantly removes 1 Bleeding condition. However, if the Troll took any Fire or Acid Damage during the previous round, its regenerating cells are cauterized, and this ability does not trigger for that turn.\n\nPutrid Blood-Spatter: The Troll's veins are pumped full of highly toxic, acidic sludge. Any time the Troll is struck by a melee attack that deals Piercing or Slashing damage, it violently bleeds on the attacker. The attacker must surpass Agility TN 9 + Resist bonus or immediately take 1d10 Acid Damage and gain 1 Poison condition (1d10 damage) as the filth gets in their eyes and lungs. (Blunt/Crushing weapons bypass this trait).\n\nRubbery Anatomy: Because its flesh and bones are constantly mutating and somewhat soft, the Troll is highly resistant to concussive force. It takes only half damage from all physical Blunt/Crushing weapons (maces, hammers, staves), but takes normal damage from Slashing/Piercing weapons.\n\nAction-Based Abilities\nFeral Rending (Melee Cost: 1 Action): The Troll lashes out with its massive, dirty claws. Make a Melee attack (+4 To-Hit). If successful, it deals normal 1d10 + 30 melee damage. Because its claws are caked in rotting meat, the target must pass a severe Physique(8) test or suffer 1 Disease condition, halving their healing received until cured.\n\nCorrosive Regurgitation (Range Cost: 2 Actions): The Troll violently empties its highly acidic stomach contents in a 20-foot cone. All enemies in the cone must surpass Agility TN 8 + Resist bonus. On a failure, they take 3d10 + 20 Acid Damage, and the acid begins eating their gear—permanently reducing the target's Armor Mitigation by 5. On a success, they take half damage and their armor is spared.\n\nDismembering Bearhug (Melee Cost: 2 Actions): The Troll attempts to grab an enemy in both of its massive arms and literally squeeze the life out of them. Make a Melee attack (+6 To-Hit). If successful, the target is Grappled and Prone. If the Troll uses this ability on a target that is already Grappled from a previous turn, it deals 2d10 + 50 damage and automatically inflicts 2 Bleeding conditions as it begins to pull their limbs from their sockets.\n\nFrenzied Thrash (Melee Cost: 3 Action): The brute flails wildly, turning its body into a blender of muscle and claw. The Troll makes a Melee attack (+4 To-Hit) against all targets within its 10-foot reach. On a hit, targets take 1d10 + 18 Slashing Damage and are pushed 5 feet away.`},
{name:`True Dragon: The Calamity of Ages`,size:`Enormous`,type:`Dragon / Deity`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Unlike the animalistic Wyvern, a True Dragon is an elemental deity in physical form. They are ancient, arrogant, and possess a hoard of knowledge and gold that can destabilize entire kingdoms. They do not merely live in the world; they shape its geography and its history. To fight a True Dragon is to fight a fundamental force of nature with the intellect of a thousand scholars.`,agl:4,awa:5,cha:9,int:12,phy:18,wil:8,move:`23/67F`,ap:3,def:7,wmArmor:25,wmBS:20,wmDP:`Immune`,wounds:650,focus:`+2/6`,reroll:3,luck:1,meleeHit:`+6`,meleeDmg:`+60`,meleeHeal:`0`,rangeHit:`+5`,rangeDmg:`+40`,rangeHeal:`0`,castHit:`+5`,castDmg:`+30`,castHeal:`0`,castType:`Wizardry`,fear:`8`,mob:`1`,gear:`he accumulated wealth, secrets, and artifacts of lost civilizations.`,meleeDetail:`Deity's Claws & Jaws`,rangeDetail:`Calamity Breath`,abilities:`Passive Traits\nOmniscient Arrogance: Thanks to its 12 Intelligence, the True Dragon already knows everything about the heroes. It automatically knows the highest and lowest stats, current Hit Points, and exact magical loadouts of every character on the battlefield. It uses this information to ruthlessly exploit their weakest saves.\n\nElemental Embodiment: The True Dragon chooses one Element (Fire, Cold, Lightning, Acid) at the start of combat. It becomes completely immune to that Element, and any Ranged or Casting attacks it makes completely ignore the players' Damage Mitigation/Resistances against that chosen Element.\n\nThe Weight of Ages: The sheer physical and magical pressure it exerts is suffocating. Any Ranged attack (like an arrow or thrown spear) loses all kinetic energy as it approaches the dragon, completely failing to deal damage unless the attacker spends 1 Focus point to push the projectile through the pressure field.\n\nAction-Based Abilities\nBreath of the Calamity (Range Cost: 2 Actions): The dragon exhales pure, unadulterated elemental destruction. Make a Ranged attack (+5 To-Hit) against a massive 80-foot cone. On a hit, targets take 1d10 + 40 damage of the dragon's chosen element. The sheer force of the blast permanently destroys all non-magical cover (trees, boulders, walls) in the area.\n\nWord of Ruin(TN10) (Casting Cost:  Actions): Weaponizing its ancient knowledge, the dragon speaks a forgotten word of unmaking. Make a Casting attack (+5 To-Hit) against one target within 60 feet. On a hit, it deals 2d10 + 30 Psychic Damage, and the target's strongest equipped magical item is temporarily deactivated/suppressed for 1 full round.\n\nTectonic Strike (Melee Cost: 1 Action): The dragon simply brings a massive claw down upon the earth. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 60 damage. Regardless of if the attack hits or misses, the impact causes the ground within a 20-foot radius to rupture, instantly becoming severe Difficult Terrain.`},
{name:`Tyrannosaurus Rex: The Apex Maw`,size:`Giant`,type:`(Prehistoric / Reptilian)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The undisputed tyrant of the primeval jungles. A towering, bipedal predator stretching over forty feet from snout to tail, the Tyrannosaurus Rex is an engine of pure, uncompromising meat-eating aggression. It moves with a terrifying, ground-eating stride, crashing through ancient trees as if they were dry weeds. Its massive skull is lined with serrated teeth the size of daggers, driven by jaw muscles capable of crushing solid steel. To hear the deep, chest-rattling boom of its roar is to know you have stepped off the top of the food chain.`,agl:4,awa:9,cha:3,int:0,phy:15,wil:6,move:23,ap:3,def:5,wmArmor:25,wmBS:10,wmDP:30,wounds:350,focus:`+1/3`,reroll:1,luck:1,meleeHit:`+4`,meleeDmg:`+35`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`6`,mob:`1`,gear:`None`,meleeDetail:`Bone-Crushing Jaws, Tail`,rangeDetail:`None`,abilities:`Passive Traits\nBlood Scent: The T-Rex becomes a flawless tracker the moment blood is spilled. If any creature within 100 feet is suffering from Wounds or the Bleeding condition, the T-Rex automatically gains Advantage on all Awareness checks to find them and Advantage on its Melee To-Hit rolls against them.\n\nColossal Stride: The beast treats dense jungle underbrush, deep mud, and water as normal terrain. Due to its Giant size, it cannot be physically pushed, Grappled, or knocked Prone by Medium or smaller creatures, and it can simply walk through their spaces.\n\nArmor-Piercing Bite: The sheer kinetic force of the Tyrant's jaws bypasses standard defenses. All Melee attacks made by the T-Rex ignore 5 points of the target's DM-Arm (Armor Mitigation) as the teeth punch clean through plate metal.\n\nAction-Based Abilities\nTyrant's Snap (Melee Cost: 1 Action): A lightning-fast, devastating lunge with its massive jaws. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 35 Piercing/Slashing Damage.\n\nThrash and Pin (Melee Cost: 2 Actions): The T-Rex bites down on a target and violently shakes its massive head. Make a Melee attack (+4 To-Hit). On a hit, it deals 45 Piercing Damage, and the target is violently slammed into the earth, gaining the Grappled and Prone conditions.\n\nDeafening Bellow (Cost: 1 Action): The beast fills its massive lungs and unleashes a chest-rattling roar. All enemies within a 60-foot cone must surpass Willpower TN 9 + Resist bonus or suffer the Shaken condition, their primal instincts forcing them to drop their weapons and flee.`},
{name:`Umber-Hulk: The Chitinous Delver`,size:`Large`,type:`Monstrosity (Subterranean)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A horrific fusion of ape-like musculature and dense, beetle-like chitin. Compressed into a terrifyingly heavy man-sized frame, the Umber-Hulk is the ultimate subterranean ambush predator. Its arms end in massive, diamond-hard claws capable of shearing through solid granite like wet clay. However, its most dreaded feature is its face: a cluster of four glowing, multifaceted eyes that project a localized psychic distortion. Those who lock eyes with the beast find their spatial reasoning shattered, leaving them wandering aimlessly or swinging at phantoms while the Hulk closes in for the kill.`,agl:1,awa:4,cha:5,int:0,phy:9,wil:2,move:`17/BG`,ap:3,def:6,wmArmor:25,wmBS:10,wmDP:30,wounds:75,focus:`0`,reroll:0,luck:0,meleeHit:`+4`,meleeDmg:`+22/+35`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1-2`,gear:`None`,meleeDetail:`Stone-Borer Claws`,rangeDetail:`None`,abilities:`Passive Traits\nThe Alien Gaze: The Umber-Hulk's four compound eyes scramble the mortal mind. Any enemy that starts its turn within 30 feet and has line of sight to the Hulk's face must pass a surpass Willpower TN 7 + Resist bonus against the Hulk's 5 Charisma. On a failure, the target gains the Dazed condition, and the target's Movement is forced in a random direction (determined by the Game Master) for that turn.\n\nTremorsense: The creature's 4 Awareness is tied to the earth. It completely ignores magical darkness, invisibility, and visual illusions as long as its target is touching the ground within 60 feet.\n\nTunnel-Borer: The Hulk burrows through solid rock, leaving behind a 5-foot wide permanent tunnel. Because its claws are designed to crush granite, any Melee attack it makes completely ignores 5 points of the target's DM-Arm (Armor Mitigation).\n\nAction-Based Abilities\nChitinous Rake (Melee Cost: 1 Action): A brutal, heavy swipe with its massive claws. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 22 Slashing/Bludgeoning Damage.\n\nMandible Crush (Melee Cost: 2 Actions): The Hulk attempts to bite a target cleanly in half. Target an enemy suffering from the Dazed or Prone condition. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 35 Piercing Damage, and the target is violently pinned in the creature's jaws, gaining the Grappled condition.\n\nSubterranean Eruption (Cost: 1 Action): If the Umber-Hulk is currently burrowed beneath the earth, it violently erupts into an unoccupied space on the surface. Any adjacent enemies must surpass Agility TN 7 + Resist bonus or take 10 Bludgeoning Damage from the flying stone and be violently knocked Prone.`},
{name:`Umbra-Witch: The Void-Weaver`,size:`Medium`,type:`Monstrosity (Shadow / Caster)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A tall, slender figure draped in "Living Silk"—a flowing garment woven from the captured shadows of executed enemies. Her skin is a translucent, porcelain white, pulsing with veins of liquid, pitch-black ink. Viewing the physical world as dirty and its inhabitants as "unworthy," she glides an inch above the earth. Lacking physical weapons, she wields a floating Shadow-Loom of obsidian needles to stitch localized pockets of void and mind-breaking illusions. She is a master of "The Mirror Game," a psychological torment that turns a hero's own memories and shadow against them, unmaking their sanity thread by thread.\n\nSometimes accompanied by mindless thralls made from the husks of past victims`,agl:4,awa:5,cha:2,int:12,phy:1,wil:6,move:17,ap:4,def:6,wmArmor:10,wmBS:35,wmDP:20,wounds:45,focus:`+3/9`,reroll:3,luck:2,meleeHit:`0`,meleeDmg:`+4`,meleeHeal:`0`,rangeHit:`+6`,rangeDmg:`+30`,rangeHeal:`0`,castHit:`+5`,castDmg:`+45`,castHeal:`0`,castType:`Wizardry`,fear:`5`,mob:`1`,gear:`Floating Shadow-Loom, Obsidian Needles`,meleeDetail:`Will use magical abilities or flee if engaged.`,rangeDetail:`Obsidian Loom Needles`,abilities:`Passive Traits\nUnworthy Earth (Hover): Because she glides an inch above the ground, the Umbra-Witch is completely immune to all ground-based traps, pressure plates, tremorsense (rendering her invisible to Midnight-Hounds if they ever turned on her), and localized ground-spells (like Earthquake or Mud Wall).\n\nLiving Silk Shroud: The captured shadows she wears have a will of their own and actively move to protect her fragile porcelain body. Any normal Ranged attacks (arrows, bolts, throwing axes) directed at her suffer Disadvantage on the To-Hit roll, as the shadows reach out to swat the projectiles from the air.\n\nInk-Stitched Veins: She lacks warm blood. If she takes Wounds from a slashing or piercing melee attack, the pressurized pitch-black ink in her veins sprays outward. Any enemy within 5 feet of her when she is struck must surpass Agility TN 10 + Resist bonus or suffer 1d10 acid/shadow damage and be temporarily blinded until they wipe the ink from their eyes.\n\nAction-Based Abilities\nThe Mirror Game (Casting Cost: 2 Actions): The Witch plucks a dark memory from a target's mind within 80 feet, weaving it into a terrifying, lifelike hallucination. The target must pass a severe Willpower(16) test. If they fail, they are convinced an ally or a loved one is attacking them. They immediately suffer the Stunned condition and take 4d10 + 45 psychic damage as their mind breaks under the psychological torture.\n\nPuppet Master (Melee Cost: 1 Action): She plucks the strings of a victim's mind. Target one enemy suffering from the Shaken or Dazed condition. Make a Casting attack (+4 To-Hit) against their Willpower. On a hit, the Witch takes total control of the target's shadow, physically forcing the hero to immediately make one free Melee attack against an adjacent ally of the Witch's choice.\n\nStitch the Shadow (Casting Cost: 2 Action): The Witch flicks her fingers, sending obsidian needles flying at a target's feet up to 60 feet away. Make a Casting roll (+8 To-Cast). If successful, she deals 2d10 + 20 damage, and the target's shadow is literally stitched to the floor. The target's Movement is reduced to 0 until they spend an Action to physically tear their shadow free (which causes an additional 1d10 damage to themselves).\n\nVoid-Pocket Evasion (Casting Cost: 2 Actions): The Witch weaves a localized pocket of the void and steps into it. She instantly teleports up to 50 feet away to any location she can see. When she vanishes, the void pocket violently collapses, creating an implosion. Any enemy within 10 feet of where she was standing takes 3d10 damage and is pulled 5 feet toward the center of the implosion.`},
{name:`Umbric-Flayer (Shadow Stalker)`,size:`Medium`,type:`Monstrosity (Shadow)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A nightmare of emaciated efficiency. They are roughly man-sized, but their skeletal frame is composed of an obsidian-like shadow material that is both unnaturally light and impossibly dense. Their limbs are elongated and disjointed, ending in signature raking claws that are longer than their own forearms. They move in eerie, silent bursts of speed, using their terrifying reach to flay armor and flesh alike while their Midnight-Hound brethren keep the prey pinned. To face an Umbric-Flayer is to fight a living guillotine made of smoke and glass.`,agl:9,awa:5,cha:1,int:3,phy:6,wil:4,move:17,ap:3,def:6,wmArmor:12,wmBS:25,wmDP:10,wounds:45,focus:`+1/3`,reroll:1,luck:1,meleeHit:`+4/+6`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`0`,castDmg:`0`,castHeal:`0`,castType:`None`,fear:`5`,mob:`1-5`,gear:`Relies entirely on its natural obsidian body.`,meleeDetail:`Disjointed Raking Claws`,rangeDetail:`None`,abilities:`Passive Traits\nBlood Frenzy: The Reaper's obsidian claws are highly reactive to spilled life force. If the Reaper attacks a target that is currently suffering from a Bleeding condition, it gains Advantage on its To-Hit rolls.\n\nElongated Reach: Because its limbs are disproportionately long and end in massive, forearm-length claws, the Reaper has a melee reach of 10 feet. This allows it to safely strike from behind a frontline of Midnight-Hounds without stepping into standard melee range itself.\n\nParadoxical Density: The obsidian-like material of its skeleton is both impossibly dense and unnaturally light. It completely ignores the first 10 damage of any non-magical physical attack that hits it. Furthermore, because it is so light, it never triggers pressure plates, leaves no footprints, and makes absolutely no sound when it walks, granting it Advantage on all Stealth or Surprise attempts.\n\nShadow-Burst Evasion: Because of its 9 Agility, the Flayer never triggers defensive or counter-attacks when moving out of an enemy's melee range. It can effortlessly slip through gaps in a frontline formation.\n\nAction-Based Abilities\nFlaying Rake (Melee Cost: 2 Action): The Reaper sweeps its massive claws in a brutal arc. Make a melee attack (+6 To-Hit). If successful, it deals normal 1d10 + 25 damage, and the sheer density of the claws actively shreds the target's defenses, permanently reducing the target's Armor Mitigation by 1 for the rest of the encounter (this effect stacks with multiple hits).\n\nUmbric Impalement (Melee Cost: 2 Actions): The Reaper lunges with terrifying speed, attempting to drive both of its elongated claws directly through a target's torso. Make a melee attack at +4 To-Hit. If successful, it deals 2d10 + 25 damage. The target is instantly inflicted with 2 Bleeding conditions and is considered Grappled, pinned on the end of the Reaper's claws until they can break free with a Physique vs surpass Physique TN 7 + Resist bonus.\n\nShadow-Step Evisceration (Cost: 2 Actions): The Reaper merges its lightweight frame with the shadows, instantly teleporting up to 30 feet to appear directly in the blind spot of an enemy. Make a melee attack (+6 To-Hit) that completely ignores the target's worn Armor Mitigation. If the target is already Bleeding, the shock of the sudden, brutal strike forces them to surpass Physique TN 8 + Resist bonus or immediately suffer a Stunned condition.`},
{name:`Unicorn: The Pure-Point`,size:`Large`,type:`Celestial (Beast)`,tier:`Elite`,tierColor:`#b45309`,desc:`A Unicorn appears as a horse of impossible perfection, radiating a soft, silver-white luminescence. Its coat feels like spun silk, and its hooves do not touch the ground, pressing against the air millimeters above it and leaving glowing floral patterns in their wake. Its most striking feature is the Spiral Horn (the Alicorn), a weapon made of solidified moonlight that can pierce through illusions and physical armor with equal ease. While gentle with the innocent, a Unicorn becomes a terrifying avatar of wrath when facing Undead, Daemons, or those with blackened hearts. It does not speak, projecting a calm, psychic presence that acts as a natural truth-detector.`,agl:5,awa:6,cha:12,int:10,phy:4,wil:9,move:27,ap:3,def:12,wmArmor:10,wmBS:35,wmDP:`Immune`,wounds:85,focus:`+4/12`,reroll:3,luck:6,meleeHit:`+4`,meleeDmg:`+25`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+6`,castDmg:`+35`,castHeal:`+30`,castType:`Faith`,fear:``,mob:`1`,gear:`None`,meleeDetail:`The Alicorn`,rangeDetail:`None`,abilities:`Passive Traits\nThe Pure-Point (Armor & Illusion Piercing): The Unicorn's Alicorn is made of solidified moonlight that cuts through falsehoods. The Unicorn's Melee attacks completely ignore all Armor Mitigation provided by physical armor, shields, or magical barriers (using only the target's natural bodily mitigation). Furthermore, its mere presence shatters falsehoods; any active illusion, invisibility, or magical disguise within 60 feet of the Unicorn is instantly and permanently dispelled.\n\nAir-Treading Hooves: Because its hooves float millimeters above the ground, the Unicorn ignores all difficult terrain, leaves no physical tracks (only temporary glowing floral patterns), and cannot trigger pressure plates, ground traps, or tremorsense. It can even walk seamlessly across the surface of deep water or thin air for short gaps.\n\nWrath of the Innocent (Light-Soul): The Unicorn is the ultimate bane of corruption. Whenever it attacks a target classified as Undead, Daemon, or any creature currently inflicted with a Curse or Disease, the Unicorn gains automatic Advantage on its To-Hit and To-Cast rolls, and all resulting Wounds are doubled.\n\nAction-Based Abilities\nAvatar of Wrath(TN9) (Casting Cost: 2 Actions): The Unicorn rears back, its horn erupting in a blinding flash of silver-white star-fire. All enemies within a 20-foot radius must surpass Agility TN 10 + Resist bonus or take 25 Radiant Damage and gain the Blinded condition for 1 round.\n\nMoonlight Charge (Melee Cost: 2 Actions): The Unicorn lowers its Alicorn and charges in a straight line up to its maximum Movement (40). Make a Melee attack (+4 To-Hit) against the first target in its path. If successful, it deals 2d10 + 25 damage. If the target is a corrupted creature (Undead/Daemon) or has a "blackened heart" (decided by the GM), the sheer radiant trauma forces them to pass a severe Willpower(16) test or suffer 2 Stunned conditions.\n\nPsychic Truth-Detector (Cost: 1 Action): The Unicorn pulses a wave of calming, revealing psychic energy in a 40-foot radius. Any enemy caught in the radius must surpass Willpower TN 10 + Resist bonus or lose their hostility, dropping their weapons and instantly losing 1 Action on their next turn. Simultaneously, this pure light washes over all allies in the radius, instantly curing them of any Fear, Charm, or Poison conditions.\n\nSilver-Light Banishment(TN10) (Casting Cost: 2 Actions): The Unicorn rears back, and its Alicorn flares with blinding, concentrated starlight in a 30-foot cone. Make a Casting roll (+8 To-Cast) against all enemies in the cone. On a success, they take 3d10 + 35 Radiant Damage and are permanently Blinded until magically cured. Undead and Daemons caught in this blast must pass a severe surpass Willpower TN 7 + Resist bonus or be instantly banished back to the grave or their home plane.`},
{name:`Vampire: The Crimson Lord`,size:`Medium`,type:`Undead (Apex Predator)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Crimson Lord is not a mindless, rotting corpse, but a terrifying apex predator wrapped in the guise of aristocratic perfection. Pale, impossibly graceful, and possessing a gaze that can paralyze a charging knight, the Vampire views mortals as nothing more than cattle and fine wine. They move in blurs of unnatural speed, capable of shifting their physical form into mist to evade blows. In combat, they do not just seek to kill; they seek to subjugate, charm, and drain their victims dry, using the party's own blood to knit their undead flesh back together. To fight a Crimson Lord is to realize you have willingly walked into a slaughterhouse dressed as a ballroom.`,agl:12,awa:6,cha:9,int:3,phy:5,wil:3,move:17,ap:4,def:9,wmArmor:10,wmBS:15,wmDP:`Immune`,wounds:65,focus:`+3/9`,reroll:2,luck:2,meleeHit:`+4/+6`,meleeDmg:`+15/+40`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+4`,castDmg:`+30`,castHeal:`0`,castType:`Necromantic`,fear:`7`,mob:`1`,gear:`Aristocratic Garb, Master-Crafted Rapier, Signet Ring, Vials of Vitae`,meleeDetail:`Master-Crafted Rapier, Crimson Claws`,rangeDetail:`None`,abilities:`Passive Traits\nUndead Anatomy & Sunlight Aversion: As a creature of the night, the Vampire is completely immune to the Poison and Disease conditions. However, they take double damage from any Radiant, Holy, or Fire-based attacks. If the Vampire starts its turn in direct sunlight (or magical equivalent), it suffers 2d10 damage and loses 1 Action for that turn.\n\nMist-Step Evasion: When the Vampire moves, it temporarily dissolves into a cloud of crimson mist. It never triggers free attacks or attacks of opportunity when moving out of melee range, and it can move through physical obstacles like iron grates, arrow slits, or even spaces occupied by other creatures without any movement penalty.\n\nBlood-Frenzy Regeneration: The Vampire is vitalized by the scent of fresh blood. If the Vampire starts its turn within 30 feet of any creature currently suffering from a Bleeding condition, the Vampire automatically heals 2d10 + 10 damage as it draws the ambient life force through the air.\n\nThe Crimson Gaze: Any enemy that starts its turn within 30 feet and has line of sight to the Vampire must pass a surpass Willpower TN 7 + Resist bonus against the Vampire's Charisma. On a failure, they gain the Charmed condition, viewing the Vampire as an awe-inspiring sovereign and becoming unable to target them with hostile actions.\n\nAction-Based Abilities\nFlawless Lunge (Melee Cost: 1 Action): A blurring, textbook strike with their rapier. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 15 Piercing Damage and ignores 5 points of the target's DM-Arm.\n\nPredator's Gaze(TN9) (Casting Cost: 2 Actions): The Vampire locks eyes with a target within 40 feet, attempting to completely dominate their will. Make a Casting roll (+4 To-Cast) against the target's Willpower defense. If successful, the target is Charmed. On their next turn, the Charmed target must use their movement to walk directly toward the Vampire and immediately drop any weapons they are holding.\n\nSever the Artery (Melee Cost: 2 Action): A blindingly fast swipe of elongated, hardened fingernails. Make a Melee attack (+5 To-Hit). If successful, it deals normal 1d10 + 15 melee damage and bypasses half of the target's Armor Mitigation. The target automatically suffers 1 Bleeding condition.\n\nThe Crimson Kiss (Melee Cost: 2 Actions): The Vampire's signature feeding maneuver. This attack can only be used on a target that is currently Grappled, Stunned, or Charmed. Make a Melee attack (+6 To-Hit). If successful, the Vampire sinks its fangs into the victim, dealing 3d10 + 30 damage. The Vampire instantly heals Wounds equal to the damage dealt, and the victim permanently loses 1 point of Physique until they complete a long rest.`},
{name:`Vulkan-Kahn`,size:`Giant`,type:`Divine Guardian (Pyreborn Ally)`,tier:`Lore`,tierColor:`#607080`,desc:`Magical giants appearing as majestic tigers capable of walking upright. Worshipped by the Pyreborn, they are protectors of the brass cities until their feral instincts take over.`,agl:5,awa:7,cha:8,int:6,phy:14,wil:12,move:13,ap:4,def:4,wmArmor:30,wmBS:25,wmDP:0,wounds:350,focus:`4`,reroll:3,luck:2,meleeHit:`+9`,meleeDmg:`3d10+12`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+8`,castDmg:`0`,castHeal:`15`,castType:`Faith`,fear:`12`,mob:`1`,gear:`Gilded Plate`,meleeDetail:`Sun-Forged Spear`,rangeDetail:`None`,abilities:`Passive Traits\nDivine Presence (Aura): All allied Pyreborn units within 40ft gain +2 to Willpower and are immune to the Fear condition.\n\nMolten Fur: Any creature that hits the Vulkan-Kahn with a melee attack takes 2d10 fire damage as the god's fur superheats upon contact.\n\nApex Instinct: The Vulkan-Kahn gains a +5 bonus to Initiative and cannot be surprised or flanked.\n\nAction-Based Abilities\nSolar Roar (TN 8 - 2 Actions): A thunderous, magical roar that mimics the sun's birth. All enemies within 30ft must pass a surpass Willpower TN 7 + Resist bonus or be Stunned for 1 turn.\n\nBrass Strike (1 Action): A heavy melee strike with a sun-forged spear. Deals 3d10+12 damage and ignites the target (5 Burn damage per turn).\n\nThe Ancestral Shift (3 Actions): The Vulkan-Kahn reverts to its feral, four-legged form. For 3 turns, it loses its Spear and Armor, but its Movement doubles, it gains 2 extra Actions per turn, and its melee attacks gain 'Advantage 1' as it strikes with tooth and claw.`},
{name:`Vulkan-Kahn (The First Forge)`,size:`Enormous`,type:`Elemental (Pantheon Boss)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`: A god-like entity of the Pyreborn pantheon. Vulkan-Kahn stands nearly 30 feet tall when bipedal. He is a terrifying fusion of feline elegance and volcanic raw power. His fur is not hair, but a dense mesh of white-hot needles that shimmer like burning silk. His black stripes are actually deep fissures in his hide, pulsing with the rhythmic glow of a tectonic heart. To the Pyreborn, he is the "First Forge," the being from whom all heat originated. He bridges the gap between the Enormous and Titanic scale, combining the terrifying agility of an apex feline predator with the apocalyptic damage multipliers of a world-ending boss.`,agl:18,awa:5,cha:4,int:3,phy:12,wil:6,move:30,ap:4,def:8,wmArmor:25,wmBS:25,wmDP:25,wounds:450,focus:`+4/12`,reroll:3,luck:2,meleeHit:`+6`,meleeDmg:`+50`,meleeHeal:`0`,rangeHit:`0`,rangeDmg:`0`,rangeHeal:`0`,castHit:`+6`,castDmg:`+22`,castHeal:`0`,castType:`None`,fear:`9`,mob:`1`,gear:`"The World-Splitter" (Star-Iron Halberd)`,meleeDetail:`The World-Splitter, Tectonic Claws`,rangeDetail:`None`,abilities:`Passive Traits\nThe First Forge: Vulkan-Kahn is the literal origin of heat. He is entirely immune to Fire, Magma, and Heat damage. Furthermore, any enemy that strikes him with a melee attack takes 2d10 Fire Damage immediately from his shimmering, white-hot needle fur.\n\nFeline Elegance: Despite his Titanic size, his 18 Agility allows him to ignore the standard penalties of his mass. He cannot be flanked, ignores all difficult terrain, and never triggers traps. He takes no falling damage.\n\nTectonic Heart: The rhythmic pulsing of his fissures regulates his god-like form. At the start of every turn, he automatically cures himself of all negative conditions (Bleeding, Poison, Disease, Stunned, Prone) and restores 10 damage.\n\nActions\nEruption of the Forge(12) - (Casting/Area Cost: 3): Vulkan-Kahn slams the butt of
