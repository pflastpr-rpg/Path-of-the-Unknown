<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronTithe — Atlas of the Known World</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        :root {
            --parchment: #eaddc5;
            --iron: #2c2c2c;
            --blood: #8a0303;
            --gold: #b89b5e;
            --ink: #1a1a1a;
            --font-hand: 'Georgia', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            font-family: Arial, sans-serif;
            color: var(--parchment);
            overflow: hidden;
        }

        .world-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            padding: 20px;
            height: 100vh;
        }

        /* MAP SECTION */
        .map-section {
            position: relative;
            background: var(--iron);
            border: 4px solid var(--gold);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            overflow: auto;
        }

        /* BUG FIX: zoom-controls must be sticky inside the scrollable map-section,
           and width:fit-content + pointer-events:none on the container prevents
           the invisible bar from blocking map clicks across the full row. */
        .zoom-controls {
            position: sticky;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: inline-flex;
            gap: 5px;
            width: fit-content;
            pointer-events: none;
        }
        .zoom-controls button {
            pointer-events: all;
            background: rgba(0,0,0,0.85);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 12px;
            font-family: var(--font-hand);
            font-size: 10pt;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .zoom-controls button:hover { background: var(--blood); color: #fff; border-color: #fff; }
        .zoom-controls button.active-mode {
            background: var(--blood); color: #fff; border-color: #fff;
            animation: btn-pulse 1.5s infinite;
        }
        @keyframes btn-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(138,3,3,0.7); }
            50%      { box-shadow: 0 0 0 8px rgba(138,3,3,0); }
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: auto;
            transition: width 0.3s ease-in-out;
        }
        /* BUG FIX: img pointer-events:none so image drag doesn't swallow click coords */
        .map-wrapper img {
            width: 100%; height: auto; display: block;
            pointer-events: none; user-select: none;
        }
        .map-wrapper.placing-pin { cursor: crosshair; }

        /* PINS */
        .map-pin {
            position: absolute;
            width: 18px; height: 18px;
            background: var(--blood);
            border: 2px solid var(--gold);
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(138,3,3,0.8);
            animation: pulse 2s infinite;
            transition: transform 0.2s ease, background 0.2s ease;
            z-index: 5;
        }
        .map-pin:hover { transform: translate(-50%,-50%) scale(1.4); background: #ff1a1a; z-index: 10; }
        .map-pin.custom-pin {
            background: var(--gold); border-color: var(--parchment);
            box-shadow: 0 0 10px rgba(184,155,94,0.8);
        }
        .map-pin.custom-pin:hover { background: #ffe0a0; }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(138,3,3,0.7); }
            70%  { box-shadow: 0 0 0 15px rgba(138,3,3,0); }
            100% { box-shadow: 0 0 0 0 rgba(138,3,3,0); }
        }

        /* LORE PANEL */
        .lore-section {
            background: #111;
            border: 4px solid var(--iron);
            border-radius: 8px;
            padding: 20px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .lore-header {
            font-size: 21pt; font-weight: 900;
            color: var(--gold);
            border-bottom: 2px solid var(--blood);
            padding-bottom: 10px; margin-bottom: 14px;
            text-transform: uppercase; text-align: center;
            flex-shrink: 0;
        }
        .lore-content {
            background: var(--parchment); color: var(--ink);
            padding: 16px; border: 2px solid var(--iron); border-radius: 4px;
            flex-grow: 1; font-family: var(--font-hand);
            font-size: 13pt; line-height: 1.6; overflow-y: auto;
        }
        .lore-stat-box {
            background: rgba(138,3,3,0.1); border-left: 4px solid var(--blood);
            padding: 10px; margin-top: 12px; font-size: 11pt; font-weight: bold;
        }
        .lore-notes-box {
            background: rgba(184,155,94,0.1); border-left: 4px solid var(--gold);
            padding: 10px; margin-top: 12px; font-size: 11pt; font-style: italic;
            white-space: pre-wrap; word-break: break-word;
        }
        .lore-actions {
            display: flex; gap: 8px; margin-top: 12px; flex-shrink: 0;
        }
        .lore-actions button {
            flex: 1; padding: 8px;
            font-family: var(--font-hand); font-size: 10pt; font-weight: bold;
            cursor: pointer; border-radius: 4px;
            border: 1px solid var(--gold); background: rgba(0,0,0,0.7);
            color: var(--gold); text-transform: uppercase; transition: all 0.2s;
        }
        .lore-actions button:hover { background: var(--blood); color: #fff; border-color: #fff; }
        .lore-actions button.delete-btn { border-color: var(--blood); color: #ff6666; }
        .lore-actions button.delete-btn:hover { background: #5a0000; color: #fff; }

        .back-to-hub {
            display: inline-block; background: #000; color: var(--gold);
            font-family: var(--font-hand); font-size: 11pt; font-weight: bold;
            text-decoration: none; text-transform: uppercase;
            padding: 8px 12px; border: 1px solid var(--gold); border-radius: 4px;
            margin-bottom: 12px; align-self: flex-start; flex-shrink: 0;
            transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        .back-to-hub:hover { background: var(--blood); color: var(--parchment); border-color: var(--parchment); }

        /* MODAL */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); z-index: 1000;
            align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #1a1a1a; border: 3px solid var(--gold); border-radius: 8px;
            padding: 28px; width: 520px; max-width: 95vw;
            box-shadow: 0 0 40px rgba(184,155,94,0.3);
            display: flex; flex-direction: column; gap: 14px;
        }
        .modal-box h2 {
            font-family: var(--font-hand); font-size: 17pt; color: var(--gold);
            text-transform: uppercase; border-bottom: 1px solid var(--blood); padding-bottom: 8px;
        }
        .modal-box label {
            font-size: 9pt; font-weight: bold; text-transform: uppercase;
            color: var(--gold); letter-spacing: 0.5px; display: block; margin-bottom: 4px;
        }
        .modal-box input[type="text"], .modal-box textarea {
            width: 100%; background: #0d0d0d; color: var(--parchment);
            border: 1px solid var(--iron); border-radius: 4px;
            padding: 8px 10px; font-family: var(--font-hand); font-size: 11pt; resize: vertical;
        }
        .modal-box input[type="text"]:focus, .modal-box textarea:focus {
            outline: none; border-color: var(--gold);
        }
        .modal-box textarea { min-height: 75px; }
        .modal-box textarea.tall { min-height: 110px; }
        .modal-btn-row {
            display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px;
        }
        .modal-btn-row button {
            padding: 9px 22px; font-family: var(--font-hand); font-size: 10pt;
            font-weight: bold; text-transform: uppercase; cursor: pointer;
            border-radius: 4px; border: 1px solid var(--gold);
            background: rgba(0,0,0,0.6); color: var(--gold); transition: all 0.2s;
        }
        .modal-btn-row button:hover { background: var(--blood); color: #fff; border-color: #fff; }
        .modal-btn-row button.cancel-btn { border-color: var(--iron); color: #aaa; }
        .modal-btn-row button.cancel-btn:hover { background: #333; color: #fff; border-color: #fff; }
        .coord-display { font-size: 9pt; color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="world-container">

    <!-- MAP -->
    <div class="map-section" id="map-section">
        <div class="zoom-controls">
            <button onclick="adjustZoom(50)">➕ Zoom In</button>
            <button onclick="adjustZoom(-50)">➖ Zoom Out</button>
            <button onclick="resetZoom()">↺ Reset</button>
            <button id="place-pin-btn" onclick="togglePlaceMode()">📍 Add Location</button>
            <button onclick="exportPositions()" style="background:rgba(184,134,11,0.15);border-color:rgba(184,134,11,0.5);color:var(--gold);">📋 Export Positions</button>
        </div>
        <div class="map-wrapper" id="zoomable-map" onclick="handleMapClick(event)">
            <img src="RPG-World.jpg" alt="Atlas of the Known World" id="map-img">
            <!-- Pins rendered by JS -->
        </div>
    </div>

    <!-- LORE PANEL -->
    <div class="lore-section">
        <a href="index.html" class="back-to-hub">⮜ Return to Main Hub</a>
        <div class="lore-header" id="lore-title">The Known World</div>
        <div class="lore-content">
            <div id="lore-desc">Welcome to the Atlas. Select a pulsing marker on the map to access geographical records, regional threats, and local inhabitants.</div>
            <div id="lore-stats" class="lore-stat-box" style="display:none;"></div>
            <div id="lore-notes" class="lore-notes-box" style="display:none;"></div>
        </div>
        <div class="lore-actions" id="lore-actions" style="display:none;">
            <button onclick="openEditModal(currentRegionId)">✏️ Edit Location</button>
            <button class="delete-btn" onclick="deleteLocation(currentRegionId)">🗑 Delete Pin</button>
        </div>
    </div>
</div>

<!-- EDITOR MODAL -->
<div class="modal-overlay" id="editor-modal">
    <div class="modal-box">
        <h2 id="modal-title">New Location</h2>
        <div>
            <label>Location Name</label>
            <input type="text" id="ed-name" placeholder="e.g. The Shattered Keep">
        </div>
        <div>
            <label>Description</label>
            <textarea class="tall" id="ed-desc" placeholder="Geographical, cultural, or historical details…"></textarea>
        </div>
        <div>
            <label>Encounter &amp; Hazard Notes</label>
            <textarea id="ed-stats" placeholder="Primary Encounters: …&#10;Hazard: …"></textarea>
        </div>
        <div>
            <label>Session Notes <span style="color:#666;font-weight:normal;">(ongoing GM observations)</span></label>
            <textarea id="ed-notes" placeholder="Add session notes, discoveries, party history here…"></textarea>
        </div>
        <p class="coord-display" id="ed-coords"></p>
        <div class="modal-btn-row">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button onclick="saveLocationFromModal()">💾 Save Location</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// BASE LORE — always present, restored on every load
// ============================================================
const BASE_LORE = {
    rysahm: {

    },

        desc: "A sprawling network of mountain strongholds built on a single premise: the city outlasts the individual. Every citizen is militia. Every miner has spilled blood. Deep beneath the lowest tier, a sealed shaft is watched around the clock by a permanent silent militia — the rhythmic scratching from the other side has not stopped in four hundred years.",

    blight: {
        title: "Land of Blight", top: 80.83, left: 42.75,

    oakhaven: {

    },
    kel_thurum_deep: {
        title: "The Sealed Shaft (Kel Thurum)", top: 34.05, left: 66.74,
        desc: "Not on any official Dwarven map. A permanent militia watches the sealed stone. The scratching has not stopped in four centuries. The High Kings have never confirmed what is on the other side. The militia does not require confirmation.",

    coldbarrow: {
        title: "Coldbarrow — Ashwalker Seat", top: 18.89, left: 70.56,
        desc: "The closest thing the northern peoples have to a city — three thousand souls in winter, five thousand when the fishing fleets return. Built into a cliff face, each level carved deeper into the rock over centuries. Governed by the Three-Bench Council: warriors, fleet captains, and Skalds, with the Skalds holding a veto they have used twice. Both times they prevented a war. Jarl Brynn Haldvoss has held the bench for nineteen years — she is missing the last two fingers of her right hand, lost in a negotiation that went wrong before the negotiations were technically over. She negotiated the settlement anyway.",

        stats: "Primary Encounters: Orc Warbands, Wandering Spirits\nHazard: Open Spirit Channel — Shamans and Ki users feel persistent unease within 1 mile",

let worldLore     = {};

let pendingCoords = null;
let currentZoom   = 100;
const STORAGE_KEY = 'bap_world_lore';

// ============================================================
// INIT
// ============================================================
function init() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) {}

    worldLore = {};

    // Base entries: always start from BASE_LORE, overlay saved edits/notes on top
    for (const [id, base] of Object.entries(BASE_LORE)) {
        worldLore[id] = Object.assign({}, base, {
            desc:  (saved[id]?.desc  ?? base.desc),
            stats: (saved[id]?.stats ?? base.stats),
            notes: (saved[id]?.notes ?? base.notes),
        });
    }

    // Custom (GM-added) entries
    for (const [id, entry] of Object.entries(saved)) {
        if (!BASE_LORE[id]) worldLore[id] = entry;
    }

    renderAllPins();
}

// ============================================================
// STORAGE
// ============================================================
function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(worldLore));
}

// ============================================================
// PINS
// ============================================================
function renderAllPins() {
    document.querySelectorAll('.map-pin').forEach(p => p.remove());
    for (const [id, data] of Object.entries(worldLore)) addPinToMap(id, data);
}

function showToast(msg) {
    let t = document.getElementById('world-toast');
    if (!t) {
        t = document.createElement('div');
        t.id = 'world-toast';
        t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(10,10,14,0.95);color:var(--gold);font-family:Cinzel,serif;font-size:8pt;letter-spacing:2px;padding:10px 20px;border:1px solid rgba(184,134,11,0.4);z-index:9999;pointer-events:none;transition:opacity 0.4s;';
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.style.opacity = '0', 2000);
}

function addPinToMap(id, data) {
    const pin = document.createElement('div');
    pin.className = 'map-pin' + (data.base ? '' : ' custom-pin');
    pin.style.top  = data.top  + '%';
    pin.style.left = data.left + '%';
    pin.title = data.title;
    pin.dataset.id = id;

    // ── DRAG TO REPOSITION ──────────────────────────────────
    let dragMoved = false;
    let startX, startY, startTop, startLeft;

    pin.addEventListener('mousedown', e => {
        if (placingPin) return;
        e.preventDefault();
        e.stopPropagation();
        dragMoved = false;
        const map = document.getElementById('zoomable-map');
        const rect = map.getBoundingClientRect();
        startX    = e.clientX;
        startY    = e.clientY;
        startTop  = parseFloat(pin.style.top);
        startLeft = parseFloat(pin.style.left);
        pin.style.cursor   = 'grabbing';
        pin.style.zIndex   = '1000';
        pin.style.animation = 'none';

        function onMove(ev) {
            const dx = ev.clientX - startX;
            const dy = ev.clientY - startY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
            if (!dragMoved) return;
            pin.style.top  = Math.min(99, Math.max(1, startTop  + (dy / rect.height) * 100)) + '%';
            pin.style.left = Math.min(99, Math.max(1, startLeft + (dx / rect.width)  * 100)) + '%';
        }

        function onUp() {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup',  onUp);
            pin.style.cursor    = 'pointer';
            pin.style.zIndex    = '';
            pin.style.animation = '';
            if (dragMoved) {
                worldLore[id].top  = parseFloat(pin.style.top);
                worldLore[id].left = parseFloat(pin.style.left);
                saveToStorage();
                showToast('📍 ' + data.title + ' repositioned');
            }
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup',  onUp);
    });

    // Touch drag
    pin.addEventListener('touchstart', e => {
        if (placingPin) return;
        e.stopPropagation();
        const touch = e.touches[0];
        dragMoved = false;
        const map = document.getElementById('zoomable-map');
        const rect = map.getBoundingClientRect();
        startX    = touch.clientX;
        startY    = touch.clientY;
        startTop  = parseFloat(pin.style.top);
        startLeft = parseFloat(pin.style.left);

        function onTouchMove(ev) {
            const t = ev.touches[0];
            const dx = t.clientX - startX;
            const dy = t.clientY - startY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) { dragMoved = true; ev.preventDefault(); }
            if (!dragMoved) return;
            pin.style.top  = Math.min(99, Math.max(1, startTop  + (dy / rect.height) * 100)) + '%';
            pin.style.left = Math.min(99, Math.max(1, startLeft + (dx / rect.width)  * 100)) + '%';
        }

        function onTouchEnd() {
            pin.removeEventListener('touchmove', onTouchMove);
            pin.removeEventListener('touchend',  onTouchEnd);
            if (dragMoved) {
                worldLore[id].top  = parseFloat(pin.style.top);
                worldLore[id].left = parseFloat(pin.style.left);
                saveToStorage();
                showToast('📍 ' + data.title + ' repositioned');
            }
        }

        pin.addEventListener('touchmove', onTouchMove, { passive: false });
        pin.addEventListener('touchend',  onTouchEnd);
    }, { passive: true });

    pin.addEventListener('click', e => {
        e.stopPropagation();
        if (!placingPin && !dragMoved) loadLore(id);
    });

    document.getElementById('zoomable-map').appendChild(pin);
}

// ============================================================
// ZOOM
// ============================================================
function adjustZoom(amount) {
    currentZoom = Math.min(400, Math.max(100, currentZoom + amount));
    document.getElementById('zoomable-map').style.width = currentZoom + '%';
}
function resetZoom() {
    currentZoom = 100;
    document.getElementById('zoomable-map').style.width = '100%';
}

// ============================================================
// LORE PANEL
// ============================================================
function loadLore(regionId) {
    const data = worldLore[regionId];
    if (!data) return;
    currentRegionId = regionId;

    document.getElementById('lore-title').innerText = data.title;
    document.getElementById('lore-desc').innerHTML  = (data.desc  || '').replace(/\n/g,'<br>');

    const statsBox = document.getElementById('lore-stats');
    if (data.stats && data.stats.trim()) {
        statsBox.innerHTML = data.stats.replace(/\n/g,'<br>');
        statsBox.style.display = 'block';
    } else {
        statsBox.style.display = 'none';
    }

    const notesBox = document.getElementById('lore-notes');
    if (data.notes && data.notes.trim()) {
        notesBox.textContent   = data.notes;
        notesBox.style.display = 'block';
    } else {
        notesBox.style.display = 'none';
    }

    document.getElementById('lore-actions').style.display = 'flex';
}

function clearLorePanel() {
    currentRegionId = null;
    document.getElementById('lore-title').innerText = 'The Known World';
    document.getElementById('lore-desc').innerText  = 'Welcome to the Atlas. Select a pulsing marker on the map to access geographical records, regional threats, and local inhabitants.';
    document.getElementById('lore-stats').style.display  = 'none';
    document.getElementById('lore-notes').style.display  = 'none';
    document.getElementById('lore-actions').style.display = 'none';
}

// ============================================================
// PIN PLACEMENT
// ============================================================
function togglePlaceMode() {
    placingPin = !placingPin;
    const btn     = document.getElementById('place-pin-btn');
    const wrapper = document.getElementById('zoomable-map');
    if (placingPin) {
        btn.classList.add('active-mode');
        btn.textContent = '✖ Cancel Placement';
        wrapper.classList.add('placing-pin');
    } else {
        btn.classList.remove('active-mode');
        btn.textContent = '📍 Add Location';
        wrapper.classList.remove('placing-pin');
    }
}

function handleMapClick(e) {
    if (!placingPin) return;
    const wrapper = document.getElementById('zoomable-map');
    const rect    = wrapper.getBoundingClientRect();
    pendingCoords = {
        top:  parseFloat(((e.clientY - rect.top)  / rect.height * 100).toFixed(2)),
        left: parseFloat(((e.clientX - rect.left) / rect.width  * 100).toFixed(2))
    };
    togglePlaceMode();
    openNewModal(pendingCoords);
}

// ============================================================
// MODAL
// ============================================================
function openNewModal(coords) {
    document.getElementById('modal-title').innerText = 'New Location';
    document.getElementById('ed-name').value  = '';
    document.getElementById('ed-desc').value  = '';
    document.getElementById('ed-stats').value = '';
    document.getElementById('ed-notes').value = '';
    document.getElementById('ed-coords').innerText = `Pin position: ${coords.top}% top, ${coords.left}% left`;
    document.getElementById('editor-modal').classList.add('open');
}

function openEditModal(regionId) {
    const data = worldLore[regionId];
    if (!data) return;
    pendingCoords = { top: data.top, left: data.left, editId: regionId };
    document.getElementById('modal-title').innerText  = 'Edit Location';
    document.getElementById('ed-name').value          = data.title || '';
    document.getElementById('ed-desc').value          = data.desc  || '';
    document.getElementById('ed-stats').value         = data.stats || '';
    document.getElementById('ed-notes').value         = data.notes || '';
    document.getElementById('ed-coords').innerText    = `Pin position: ${data.top}% top, ${data.left}% left`;
    document.getElementById('editor-modal').classList.add('open');
}

function closeModal() {
    document.getElementById('editor-modal').classList.remove('open');
    pendingCoords = null;
}

function saveLocationFromModal() {
    const name = document.getElementById('ed-name').value.trim();
    if (!name) { alert('Please enter a location name.'); return; }

    const isEdit   = pendingCoords?.editId;
    const regionId = isEdit ? pendingCoords.editId : 'loc_' + Date.now();

    worldLore[regionId] = {
        title: name,
        desc:  document.getElementById('ed-desc').value.trim(),
        stats: document.getElementById('ed-stats').value.trim(),
        notes: document.getElementById('ed-notes').value.trim(),
        top:   pendingCoords.top,
        left:  pendingCoords.left,
        base:  isEdit ? (worldLore[regionId]?.base || false) : false
    };

    saveToStorage();
    renderAllPins();
    closeModal();
    loadLore(regionId);
}

function deleteLocation(regionId) {
    if (!worldLore[regionId]) return;
    const isBase = worldLore[regionId].base;
    const label  = isBase ? 'this base location' : `"${worldLore[regionId].title}"`;
    if (!confirm(`Delete ${label}? This cannot be undone.`)) return;

    delete worldLore[regionId];
    saveToStorage();
    renderAllPins();
    clearLorePanel();
}

// Close modal on overlay backdrop click
document.getElementById('editor-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

window.onload = init;

// ============================================================
// EXPORT POSITIONS
// ============================================================
function exportPositions() {
    // Build a summary of all current pin positions
    const lines = [];
    for (const [id, data] of Object.entries(worldLore)) {
        lines.push(`    ${id}: { top: ${data.top.toFixed(2)}, left: ${data.left.toFixed(2)} },  // ${data.title}`);
    }
    const output = lines.join('\n');

    // Show in a modal overlay
    let modal = document.getElementById('export-modal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'export-modal';
        modal.style.cssText = [
            'position:fixed;inset:0;background:rgba(2,7,14,0.92);z-index:9999',
            'display:flex;flex-direction:column;align-items:center;justify-content:center',
            'padding:32px;font-family:Cinzel,serif'
        ].join(';');
        modal.innerHTML = `
            <div style="background:#0a0a0f;border:1px solid rgba(184,134,11,0.3);max-width:720px;width:100%;padding:32px;">
                <div style="font-size:10pt;letter-spacing:3px;color:var(--gold);margin-bottom:8px;text-transform:uppercase;">Export Pin Positions</div>
                <div style="font-size:9pt;color:rgba(240,226,192,0.5);font-family:'Crimson Pro',serif;margin-bottom:20px;letter-spacing:0;">
                    Copy this and paste it to your developer to update BASE_LORE coordinates permanently.
                </div>
                <textarea id="export-textarea" style="
                    width:100%;height:300px;background:#06060a;
                    border:1px solid rgba(184,134,11,0.2);color:rgba(240,226,192,0.8);
                    font-family:monospace;font-size:8.5pt;padding:14px;
                    resize:vertical;line-height:1.6;
                " readonly></textarea>
                <div style="display:flex;gap:12px;margin-top:16px;justify-content:flex-end;">
                    <button onclick="copyExport()" style="
                        background:var(--blood);border:none;color:var(--parchment);
                        font-family:Cinzel,serif;font-size:8pt;letter-spacing:2px;
                        padding:10px 24px;cursor:pointer;text-transform:uppercase;
                    ">Copy to Clipboard</button>
                    <button onclick="document.getElementById('export-modal').style.display='none'" style="
                        background:transparent;border:1px solid rgba(184,134,11,0.3);
                        color:rgba(240,226,192,0.5);font-family:Cinzel,serif;font-size:8pt;
                        letter-spacing:2px;padding:10px 24px;cursor:pointer;text-transform:uppercase;
                    ">Close</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }

    document.getElementById('export-textarea').value = output;
    modal.style.display = 'flex';
}

function copyExport() {
    const ta = document.getElementById('export-textarea');
    ta.select();
    document.execCommand('copy');
    showToast('✓ Positions copied to clipboard');
}

</script>
</body>
