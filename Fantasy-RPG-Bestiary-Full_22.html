<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood and Purpose — Bestiary</title>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════ TOKENS */
:root {
  --blood:   #8B1010;
  --blood2:  #b01818;
  --gold:    #8a6a1a;
  --gold2:   #c9a030;
  --ink:     #0e0a04;
  --parch:   #faf3e0;
  --parch2:  #f0e4c0;
  --parch3:  #ddc898;
  --iron:    #1a1208;
  --iron2:   #2a1e10;
  --purple:  #3D1A6E;
  --minion:     #607080;
  --skirmisher: #a16207;
  --elite:      #b45309;
  --boss:       #b91c1c;
  --legendary:  #7c3aed;
  --f-head: 'Grenze Gotisch', serif;
  --f-body: 'IM Fell English', serif;
  --f-label:'Cinzel', serif;
  --f-deco: 'Cinzel Decorative', serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--f-body);background:#1a1208;color:var(--ink);font-size:14.0pt;line-height:1.55;display:flex;flex-direction:column;}

/* ══════════════════════════════════════════════ HEADER */
.site-header{background:var(--iron);border-bottom:3px solid var(--gold);padding:0 20px;display:flex;align-items:center;gap:16px;height:54px;flex-shrink:0;position:relative;}
.site-header::after{content:'';position:absolute;bottom:-6px;left:0;right:0;height:3px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--blood),transparent);}
.site-title{font-family:var(--f-deco);font-size:14.0pt;color:var(--gold2);letter-spacing:2px;white-space:nowrap;}
.site-title span{color:var(--blood);font-family:var(--f-label);font-size:8.5pt;letter-spacing:4px;display:block;margin-bottom:-4px;}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
.hdr-btn{font-family:var(--f-label);font-size:8.5pt;letter-spacing:1px;padding:5px 12px;border:1px solid rgba(154,123,47,0.4);background:transparent;color:var(--gold2);cursor:pointer;transition:all 0.15s;text-transform:uppercase;white-space:nowrap;}
.hdr-btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold);}
.hdr-btn.blood{border-color:rgba(139,26,26,0.5);color:#e08080;}
.hdr-btn.blood:hover{background:var(--blood);color:var(--parch);}
.hdr-count{font-family:var(--f-label);font-size:8.5pt;color:rgba(154,123,47,0.5);letter-spacing:2px;}

/* ══════════════════════════════════════════════ SEARCH */
.search-bar{background:var(--iron);border-bottom:3px solid var(--blood);padding:9px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0;}
.search-bar input[type=text]{flex:1 1 180px;background:rgba(255,255,255,0.07);border:1px solid rgba(154,123,47,0.35);color:var(--parch);font-family:var(--f-body);font-size:12.0pt;padding:5px 11px;outline:none;}
.search-bar input::placeholder{color:rgba(240,230,200,0.25);}
.search-bar input:focus{border-color:var(--gold2);}
.f-btn{font-family:var(--f-label);font-size:7pt;letter-spacing:1.5px;padding:4px 10px;border:1px solid rgba(154,123,47,0.3);background:transparent;color:rgba(154,123,47,0.75);cursor:pointer;transition:all 0.15s;text-transform:uppercase;white-space:nowrap;}
.f-btn:hover{background:rgba(154,123,47,0.15);}
.f-btn.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}
.f-btn.t-minion.active    {background:var(--minion);    border-color:var(--minion);    color:#fff;}
.f-btn.t-skirmisher.active{background:var(--skirmisher);border-color:var(--skirmisher);color:#fff;}
.f-btn.t-elite.active     {background:var(--elite);     border-color:var(--elite);     color:#fff;}
.f-btn.t-boss.active      {background:var(--boss);      border-color:var(--boss);      color:#fff;}
.f-btn.t-legendary.active {background:var(--legendary); border-color:var(--legendary); color:#fff;}
.f-sep{width:1px;height:18px;background:rgba(154,123,47,0.2);}

/* ══════════════════════════════════════════════ LAYOUT */
.main{display:flex;flex:1;overflow:hidden;}
.main.compare-active .detail-panel{flex:1;min-width:0;}
.main.compare-active .compare-panel{flex:1;min-width:0;display:flex;flex-direction:column;}

/* ══════════════════════════════════════════════ LIST */
.list-panel{width:270px;flex-shrink:0;background:var(--iron);border-right:3px solid var(--blood);overflow-y:auto;display:flex;flex-direction:column;}
.list-panel::-webkit-scrollbar{width:4px;}
.list-panel::-webkit-scrollbar-thumb{background:rgba(154,123,47,0.35);}
.list-count{font-family:var(--f-label);font-size:7pt;letter-spacing:2px;color:rgba(154,123,47,0.45);padding:8px 12px;border-bottom:1px solid rgba(154,123,47,0.12);flex-shrink:0;text-transform:uppercase;}
.list-item{padding:10px 12px;border-bottom:1px solid rgba(0,0,0,0.25);cursor:pointer;transition:background 0.1s;display:flex;align-items:center;gap:8px;}
.list-item:hover{background:rgba(154,123,47,0.1);}
.list-item.active{background:var(--parch);border-left:4px solid var(--blood);padding-left:8px;}
.list-item.active .li-name{color:var(--ink);}
.list-item.active .li-size{color:rgba(26,18,8,0.45);}
.list-item.pinned .li-name::after{content:' 📌';font-size:9.0pt;}
.li-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.li-name{font-family:var(--f-label);font-size:9.5pt;letter-spacing:0.5px;line-height:1.3;flex:1;min-width:0;color:var(--parch2);}
.li-size{font-size:8.5pt;color:rgba(240,230,200,0.3);font-style:italic;white-space:nowrap;}
.no-results{padding:24px;text-align:center;font-family:var(--f-label);font-size:8.5pt;letter-spacing:2px;color:rgba(154,123,47,0.3);text-transform:uppercase;}

/* ══════════════════════════════════════════════ DETAIL */
.detail-panel{flex:1;overflow-y:auto;background:#1e180e;}
/* compact styles merged above */
.detail-panel::-webkit-scrollbar{width:5px;}
.detail-panel::-webkit-scrollbar-thumb{background:rgba(154,123,47,0.25);}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;opacity:0.2;}
.de-rune{font-size:56pt;color:var(--gold);}
.de-text{font-family:var(--f-label);font-size:10.0pt;letter-spacing:4px;color:var(--gold);text-transform:uppercase;}

/* ══════════════════════════════════════════════ COMPARE MODE */
.compare-panel{flex:1;min-width:0;overflow-y:auto;background:#1a1409;border-left:3px solid var(--blood);max-height:100%;display:none;}
.compare-panel::-webkit-scrollbar{width:4px;}
.compare-panel::-webkit-scrollbar-thumb{background:rgba(139,26,26,0.35);}
.compare-header{background:var(--blood);color:var(--parch);font-family:var(--f-label);font-size:9.0pt;letter-spacing:3px;text-transform:uppercase;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;}
.compare-header button{background:transparent;border:1px solid rgba(240,230,200,0.4);color:var(--parch2);font-family:var(--f-label);font-size:7pt;letter-spacing:1px;padding:3px 10px;cursor:pointer;text-transform:uppercase;}
.compare-header button:hover{background:rgba(240,230,200,0.15);}

/* ══════════════════════════════════════════════ MONSTER CARD */
.monster-card{background:var(--parch);max-width:920px;margin:20px auto;box-shadow:0 8px 60px rgba(0,0,0,0.85), 0 0 0 2px var(--parch3), 0 0 0 4px rgba(10,6,2,0.8);border-top:5px solid var(--blood);}
.monster-card.compare-card{margin:0;max-width:none;box-shadow:none;}

/* ── COMPACT COMPARE MODE ── */
/* ── shared compact selector for BOTH compare cards ── */
.compare-card,
.detail-panel.comparing .monster-card {
  --cmp-name: 17pt;
  --cmp-attr: 14pt;
}
.compare-card .mc-header,
.detail-panel.comparing .monster-card .mc-header{padding:10px 14px 8px;}
.compare-card .mc-name,
.detail-panel.comparing .monster-card .mc-name{font-size:17pt;}
.compare-card .mc-name-sub,
.detail-panel.comparing .monster-card .mc-name-sub{font-size:9pt;}
.compare-card .mca-v,
.detail-panel.comparing .monster-card .mca-v{font-size:14pt;}
.compare-card .mca-l,
.detail-panel.comparing .monster-card .mca-l{font-size:5.5pt;}
.compare-card .mc-attr,
.detail-panel.comparing .monster-card .mc-attr{padding:4px 6px;min-width:36px;}
.compare-card .mc-lore,
.detail-panel.comparing .monster-card .mc-lore{display:none;}
.compare-card .mc-stat-cell,
.detail-panel.comparing .monster-card .mc-stat-cell{padding:6px 3px;}
.compare-card .sc-lbl,
.detail-panel.comparing .monster-card .sc-lbl{font-size:6pt;}
.compare-card .sc-val,
.detail-panel.comparing .monster-card .sc-val{font-size:14pt;}
.compare-card .mc-stat-cell.wounds .sc-val,
.detail-panel.comparing .monster-card .mc-stat-cell.wounds .sc-val{font-size:18pt;}
.compare-card .mc-combat-table,
.detail-panel.comparing .monster-card .mc-combat-table{font-size:9.5pt;}
.compare-card .ct-val,
.detail-panel.comparing .monster-card .ct-val{font-size:13pt;padding:4px 6px;}
.compare-card .ct-lbl,
.detail-panel.comparing .monster-card .ct-lbl{font-size:7pt;padding:5px 6px;}
.compare-card .ability-entry,
.detail-panel.comparing .monster-card .ability-entry{padding:6px 10px;font-size:10pt;margin-bottom:4px;}
.compare-card .ability-section-head,
.detail-panel.comparing .monster-card .ability-section-head{font-size:7pt;margin-bottom:6px;}
.compare-card .mc-abilities,
.detail-panel.comparing .monster-card .mc-abilities{padding:12px 14px;}
.compare-card .mc-actions,
.detail-panel.comparing .monster-card .mc-actions{display:none;}
.compare-card .mc-meta,
.detail-panel.comparing .monster-card .mc-meta{margin-top:5px;}
.compare-card .mc-tag,
.detail-panel.comparing .monster-card .mc-tag{font-size:6pt;padding:2px 6px;}

/* Header */
.mc-header{background:var(--iron);padding:18px 26px 14px;border-bottom:4px solid var(--blood);position:relative;overflow:hidden;}
.mc-header::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(154,123,47,0.03) 40px,rgba(154,123,47,0.03) 41px);}
.mc-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.mc-header-left{flex:1;min-width:0;position:relative;}
.mc-header-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0;}
.mc-tier-banner{font-family:var(--f-label);font-size:8.5pt;letter-spacing:4px;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:7px;}
.mc-tier-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.mc-name{font-family:var(--f-head);font-size:28pt;line-height:1.0;color:#fff8ee;text-shadow:0 1px 3px rgba(0,0,0,0.6);}
.mc-name-sub{font-family:var(--f-body);font-style:italic;font-size:13.0pt;color:rgba(240,230,200,0.5);margin-top:2px;}
.mc-meta{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center;}
.mc-tag{font-family:var(--f-label);font-size:7pt;letter-spacing:1.5px;padding:2px 9px;border:1px solid rgba(154,123,47,0.38);color:rgba(154,123,47,0.85);text-transform:uppercase;}
.mc-tag.size{border-color:rgba(100,160,210,0.45);color:rgba(140,200,240,0.85);}
.mc-tag.cast{border-color:rgba(139,26,26,0.55);color:rgba(220,100,100,0.9);}
.mc-tag.fear{border-color:rgba(139,26,26,0.45);color:rgba(200,80,80,0.9);}
.mc-attrs-strip{display:flex;gap:3px;align-items:stretch;}
.mc-attr{background:rgba(255,255,255,0.06);border:1px solid rgba(154,123,47,0.18);padding:6px 10px;text-align:center;min-width:48px;}
.mc-attr-sep{width:1px;background:rgba(154,123,47,0.22);margin:0 2px;}
.mca-l{font-family:var(--f-label);font-size:6.5pt;letter-spacing:1px;color:rgba(232,217,176,0.7);display:block;margin-bottom:3px;text-transform:uppercase;}
.mca-v{font-family:var(--f-head);font-size:20pt;color:#fff8ee;display:block;line-height:1;font-weight:900;}
.mc-actions{display:flex;gap:6px;flex-wrap:wrap;}
.mc-btn{font-family:var(--f-label);font-size:7pt;letter-spacing:1px;padding:5px 12px;border:1px solid rgba(154,123,47,0.38);background:rgba(154,123,47,0.08);color:var(--gold2);cursor:pointer;transition:all 0.15s;text-transform:uppercase;}
.mc-btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold);}
.mc-btn.tracker{border-color:rgba(139,26,26,0.45);background:rgba(139,26,26,0.1);color:#e08080;}
.mc-btn.tracker:hover{background:var(--blood);color:var(--parch);}
.mc-btn.pin{border-color:rgba(154,123,47,0.6);color:var(--gold2);}
.mc-btn.pin.pinned{background:var(--gold);color:var(--ink);}

/* Stat band */
.mc-stat-block{background:var(--parch2);border-bottom:3px solid var(--ink);}
.mc-stat-row{display:grid;grid-template-columns:repeat(8,1fr);border-bottom:1px solid var(--parch3);}
.mc-stat-cell{padding:11px 6px;text-align:center;border-right:1px solid var(--parch3);}
.mc-stat-cell:last-child{border-right:none;}
.sc-lbl{font-family:var(--f-label);font-size:7pt;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);opacity:0.75;font-weight:900;display:block;margin-bottom:4px;}
.sc-val{font-family:var(--f-head);font-size:20pt;color:var(--ink);font-weight:900;display:block;line-height:1;}
.mc-stat-cell.wounds .sc-val{color:var(--blood);font-size:26pt;font-weight:900;}
.mc-stat-cell.focus .sc-val{color:var(--gold);}
.mc-stat-cell.wm{background:rgba(61,26,110,0.05);}
.mc-stat-cell.wm .sc-lbl{color:var(--purple);font-size:6pt;}
/* Compare highlights */
.sc-better{background:rgba(46,90,46,0.12)!important;}
.sc-worse {background:rgba(139,26,26,0.1)!important;}
.sc-better .sc-val{color:#2d6a2d!important;}
.sc-worse  .sc-val{color:var(--blood)!important;}

/* Combat table row */
.mc-combat-row{}
.mc-combat-table{width:100%;border-collapse:collapse;font-size:12.0pt;}
.mc-combat-table thead tr{background:var(--iron);}
.ct-h,.ct-h-type,.ct-h-detail{font-family:var(--f-label);font-size:7pt;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);padding:6px 10px;text-align:left;white-space:nowrap;}
.ct-h{text-align:center;}
.ct-h-type{width:85px;}
.mc-combat-table tbody tr{border-bottom:1px solid var(--parch3);}
.mc-combat-table tbody tr:last-child{border-bottom:none;}
.mc-combat-table tbody tr:hover{background:rgba(154,123,47,0.05);}
.ct-lbl{font-family:var(--f-label);font-size:9.0pt;letter-spacing:1px;text-transform:uppercase;color:var(--blood);padding:8px 10px;white-space:nowrap;}
.ct-val{font-family:var(--f-head);font-size:17pt;text-align:center;padding:5px 10px;line-height:1;}
.ct-val.hit{color:var(--gold);}
.ct-val.dmg{color:var(--blood);}
.ct-val.heal{color:#2a7a2a;}
.ct-detail{font-style:italic;font-size:11.0pt;color:rgba(26,18,8,0.48);padding:8px 10px;}
/* Compare combat */
.ct-better{background:rgba(46,90,46,0.1);}
.ct-worse {background:rgba(139,26,26,0.08);}

/* Lower body */
.mc-body{display:grid;grid-template-columns:220px 1fr;}
.mc-art{background:rgba(42,32,16,0.06);border:2px dashed rgba(154,123,47,0.3);margin:18px 12px 18px 18px;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;height:210px;transition:background 0.2s;flex-shrink:0;align-self:start;}
.mc-art:hover{background:rgba(154,123,47,0.08);}
.mc-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.mc-art input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.mc-art-label{display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;text-align:center;}
.mc-art-label .al-icon{font-size:20pt;opacity:0.22;}
.mc-art-label .al-text{font-family:var(--f-label);font-size:7pt;letter-spacing:2px;color:var(--gold);opacity:0.45;}
.mc-art-label .al-sub{font-family:var(--f-label);font-size:6pt;letter-spacing:1px;color:var(--gold);opacity:0.25;margin-top:2px;}
.mc-art .art-clear{display:none;position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.6);color:#fff;border:none;cursor:pointer;font-size:8.5pt;padding:3px 8px;font-family:var(--f-label);z-index:2;}
.mc-art:hover .art-clear{display:block;}

.mc-lore-col{padding:18px 22px 22px 12px;border-left:2px solid var(--parch2);}
.mc-lore{padding:13px 16px;background:rgba(42,32,16,0.05);border-left:5px solid var(--gold);border-right:1px solid var(--gold);font-style:italic;font-size:12.5pt;line-height:1.65;color:var(--ink);margin-bottom:14px;position:relative;}
.mc-lore::before{content:'"';position:absolute;top:-5px;left:9px;font-size:30pt;color:var(--gold);opacity:0.28;pointer-events:none;font-family:var(--f-head);line-height:1;}
.gear-box{margin-bottom:12px;background:rgba(154,123,47,0.06);border:1px solid rgba(154,123,47,0.26);padding:10px 13px;font-size:12.0pt;color:var(--ink);line-height:1.5;}
.gear-box .gl{font-family:var(--f-label);font-size:7pt;letter-spacing:2px;color:var(--gold);display:block;margin-bottom:5px;text-transform:uppercase;}
.mc-abilities{}
.ability-section{margin-top:16px;}
.ability-section-head{font-family:var(--f-label);font-size:9.5pt;letter-spacing:2px;text-transform:uppercase;font-weight:900;padding-bottom:5px;margin-bottom:9px;border-bottom:2px solid;display:flex;align-items:center;gap:7px;}
.ability-section-head::before{content:'';display:inline-block;width:12px;height:2px;}
.ability-section.passive .ability-section-head{color:var(--gold);border-color:var(--gold);}
.ability-section.passive .ability-section-head::before{background:var(--gold);}
.ability-section.action  .ability-section-head{color:var(--blood);}
.ability-section.action  .ability-section-head::before{background:var(--blood);}
.ability-section.reaction .ability-section-head{color:var(--purple);border-color:var(--purple);}
.ability-section.reaction .ability-section-head::before{background:var(--purple);}
.ability-entry{padding:10px 14px;margin-bottom:7px;font-size:12.5pt;line-height:1.65;color:#0e0a04;background:rgba(42,32,16,0.05);border-left:4px solid rgba(154,123,47,0.5);}
.ability-entry.passive {border-left-color:var(--gold);background:rgba(154,123,47,0.05);}
.ability-entry.action  {border-left-color:var(--blood);background:rgba(139,16,16,0.06);}
.ability-entry.reaction{border-left-color:var(--purple);background:rgba(61,26,110,0.06);}

/* ══════════════════════════════════════════════ ADD MONSTER MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--parch);max-width:800px;width:95%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 60px rgba(0,0,0,0.8);}
.modal-header{background:var(--iron);padding:16px 24px;border-bottom:3px solid var(--blood);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-family:var(--f-head);font-size:20pt;color:var(--parch);}
.modal-close{background:transparent;border:1px solid rgba(154,123,47,0.4);color:var(--gold2);font-family:var(--f-label);font-size:9.0pt;letter-spacing:1px;padding:5px 12px;cursor:pointer;text-transform:uppercase;}
.modal-close:hover{background:var(--gold);color:var(--ink);}
.modal-body{padding:24px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.form-grid.wide{grid-template-columns:1fr;}
.form-grid.three{grid-template-columns:1fr 1fr 1fr;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-family:var(--f-label);font-size:8.5pt;letter-spacing:1.5px;text-transform:uppercase;color:var(--blood);}
.form-group input,.form-group select,.form-group textarea{
  background:rgba(42,32,16,0.06);border:1px solid var(--parch3);
  font-family:var(--f-body);font-size:12.0pt;color:var(--ink);
  padding:6px 10px;outline:none;width:100%;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);}

<header class="site-header">
  <div class="site-title"><span>PATH OF THE UNKNOWN</span>Bestiary</div>

    <span class="hdr-count" id="hdr-count">188 CREATURES</span>

<div class="search-bar">

  <button class="f-btn t-skirmisher"  onclick="toggleTier('Skirmisher')"  id="f-Skirmisher">⬤ SKIRMISHER</button>
  <button class="f-btn t-elite"       onclick="toggleTier('Elite')"       id="f-Elite">⬤ ELITE</button>
  <button class="f-btn t-boss"        onclick="toggleTier('Boss')"        id="f-Boss">⬤ BOSS</button>
  <button class="f-btn t-legendary"   onclick="toggleTier('Legendary')"   id="f-Legendary">⬤ LEGENDARY</button>
  <div class="f-sep"></div>
  <button class="f-btn" onclick="toggleCaster()" id="f-caster">✦ CASTERS</button>

<div class="main" id="main-layout">
  <div class="list-panel" id="list-panel">
    <div class="list-count" id="list-count">Loading…</div>
  </div>
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty"><div class="de-rune">⚔</div><div class="de-text">Select a Creature</div></div>
  </div>
  <div class="compare-panel" id="compare-panel" style="display:none;">

  </div>
</div>

<!-- ADD MONSTER MODAL -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">New Creature</div>
      <button class="modal-close" onclick="closeModal()">✕ Cancel</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>Name</label><input id="f-name" placeholder="Full creature name"></div>
        <div class="form-group"><label>Subtitle (after colon)</label><input id="f-subtitle" placeholder="The Mountain-Heart"></div>
      </div>
      <div class="form-grid three">
        <div class="form-group"><label>Size</label>
          <select id="f-size"><option>Tiny</option><option>Small</option><option selected>Medium</option><option>Large</option><option>Giant</option><option>Enormous</option><option>Titanic</option></select>
        </div>
        <div class="form-group"><label>Type / Category</label><input id="f-type" placeholder="Humanoid (Orc)"></div>
        <div class="form-group"><label>Casting Discipline</label>
          <select id="f-cast"><option value="None">None</option><option>Faith</option><option>Wizardry</option><option>Druidism</option><option>Shamanism</option><option>Ki</option></select>

      <div class="form-grid wide"><div class="form-group"><label>Description / Lore</label><textarea id="f-desc" rows="3"></textarea></div></div>

        <div class="form-group"><label>Awa</label><input id="f-awa" type="number" value="5"></div>
        <div class="form-group"><label>Cha</label><input id="f-cha" type="number" value="5"></div>
        <div class="form-group"><label>Int</label><input id="f-int" type="number" value="5"></div>
        <div class="form-group"><label>Phy</label><input id="f-phy" type="number" value="5"></div>
        <div class="form-group"><label>Wil</label><input id="f-wil" type="number" value="5"></div>
      </div>

      <div class="form-section-head">Combat Stats</div>
      <div class="form-grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="form-group"><label>Wounds</label><input id="f-wounds" type="number" value="30"></div>
        <div class="form-group"><label>Defense</label><input id="f-def" type="number" value="6"></div>
        <div class="form-group"><label>Act Points</label><input id="f-ap" type="number" value="3"></div>
        <div class="form-group"><label>Move</label><input id="f-move" type="number" value="20"></div>
        <div class="form-group"><label>Focus</label><input id="f-focus" value="—"></div>
        <div class="form-group"><label>Fear</label><input id="f-fear" value="—"></div>
        <div class="form-group"><label>Reroll</label><input id="f-reroll" value="—"></div>
        <div class="form-group"><label>Luck</label><input id="f-luck" value="—"></div>
      </div>

      <div class="form-section-head">Wound Mitigation</div>
      <div class="form-grid three">
        <div class="form-group"><label>WM Armour</label><input id="f-wma" value="—"></div>
        <div class="form-group"><label>WM Bless/Spell</label><input id="f-wmbs" value="—"></div>
        <div class="form-group"><label>WM Disease/Poison</label><input id="f-wmdp" value="—"></div>
      </div>

      <div class="form-section-head">Attacks</div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr 1fr 1.5fr">
        <div class="form-group"><label>Type</label><div style="padding:6px 0;font-family:var(--f-label);font-size:8pt;color:var(--blood);">MELEE</div></div>
        <div class="form-group"><label>To-Hit</label><input id="f-mhit" value="—"></div>
        <div class="form-group"><label>Wounds</label><input id="f-mdmg" value="—"></div>
        <div class="form-group"><label>Heal</label><input id="f-mheal" value="—"></div>
        <div class="form-group"><label>Weapon / Detail</label><input id="f-mdetail" value="—"></div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr 1fr 1.5fr">
        <div class="form-group"><label>&nbsp;</label><div style="padding:6px 0;font-family:var(--f-label);font-size:8pt;color:var(--blood);">RANGED</div></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-rhit" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-rdmg" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-rheal" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-rdetail" value="—"></div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr 1fr 1.5fr">
        <div class="form-group"><label>&nbsp;</label><div style="padding:6px 0;font-family:var(--f-label);font-size:8pt;color:var(--blood);">CASTING</div></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-chit" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-cdmg" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-cheal" value="—"></div>
        <div class="form-group"><label>&nbsp;</label><input id="f-cdetail" placeholder="Discipline" value="—"></div>
      </div>

      <div class="form-section-head">Gear &amp; Abilities</div>
      <div class="form-grid wide"><div class="form-group"><label>Gear / Equipment</label><textarea id="f-gear" rows="2"></textarea></div></div>
      <div class="form-grid wide"><div class="form-group"><label>Special Abilities (use "Passive Traits", "Action-Based Abilities", "Reaction" as section headers)</label><textarea id="f-abilities" rows="8"></textarea></div></div>
      <div class="form-grid wide"><div class="form-group"><label>Mob / XP / Loot</label><input id="f-mob" value="—"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="modal-save-btn" onclick="window._editingMonster ? updateMonster(window._editingMonster) : saveNewMonster()">Save Creature</button>
    </div>
  </div>
</div>

Atmospheric Lockdown: The Sky-Reaper dominates the space around it. The area within 30 feet of the elemental is considered severe Difficult Terrain due to hurricane-force winds. Any enemy that ends their turn within this radius must surpass Physique TN 10 + Resist bonus or take 10 Bludgeoning Wounds from the crushing barometric pressure and flying debris.

Amorphous Storm-Front: The creature is a living cloud. It is completely immune to the Prone, Grappled, and Bleeding conditions. Additionally, standard Ranged physical attacks (arrows, thrown weapons) are instantly shredded by the winds, automatically dealing 0 Wounds.

The Eye of the Storm: While the outer winds pulverize melee attackers, the center is a vacuum. The Sky-Reaper never suffers penalties or Disadvantage when making Ranged lightning attacks against distant targets, even if it is currently engaged in melee combat.

Action-Based Abilities
Pulverizing Vortex (Melee Cost: 2 Actions): The elemental grinds the air around its base. Make a Melee attack (+6 To-Hit) against all targets within 15 feet. If successful, targets take half Wounds, 1d10 +20 and are violently sucked 10 feet closer to the elemental, ensuring they cannot escape the Atmospheric Lockdown.

Tectonic Funnel-Whip (Melee Cost: 2 Action): It lashes out with a funnel capable of lifting a stone house. Make a Melee attack (+6 To-Hit) against a single target. On a hit, it deals 1d10 + 40 Wounds. The target is hurled 30 feet straight up into the air and immediately takes standard falling damage(3d10) when they hit the ground, landing Prone.

Jagged Internal Lightning(TN11) (Range Cost: 2 Actions): The Sky-Reaper targets the casters or archers hiding outside its wind zone. Make a Ranged attack (+5 To-Hit) against up to two distant targets. On a hit, targets take 3d10 + 25 Lightning Wounds and gain 1 Stunned condition from the deafening thunderclap.`},
{name:`Ash-Blight Dragon: The Extinction Event`,size:`Enormous`,type:`Dragon / Primordial`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Ash-Blight Dragon is not merely a predator; it is a localized extinction event. Older than recorded history, these colossal wyrms make their lairs in shattered volcanoes and dead lands—environments they actively create. The dragon's internal heat is so intense that the very air around it turns to superheated white ash. It does not negotiate or hoard gold; it hoards absolute dominion. Its colossal frame is armored in jagged scales resembling cooled obsidian, glowing with a molten orange heartbeat from within. To face an Ash-Blight Dragon is to fight the raw, unchained fury of the earth.`,agl:`5`,awa:`8`,cha:`12`,int:`7`,phy:`18`,wil:`15`,move:`60/120F`,ap:`3`,def:`9`,wmArmor:`40`,wmBS:`30`,wmDP:`Immune`,wounds:`600`,focus:`+1/3`,reroll:`2`,luck:`—`,meleeHit:`+6`,meleeDmg:`+60`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+40`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`9`,mob:`1`,gear:`None. It incinerates anything it touches`,meleeDetail:`Obsidian Claws & Jaws`,rangeDetail:`Pitch-Black Fire`,abilities:`Passive Traits
Storm of White Ash: The dragon is perpetually wreathed in a blinding, superheated ash storm. Any non-magical Ranged attacks targeting the dragon automatically suffer Disadvantage. Furthermore, any enemy starting their turn within 30 feet of the beast takes 1d10 Fire Wounds and must surpass Physique TN 8 + Resist bonus or suffer 1 Fatigued condition from choking on the air.

Obsidian Siege Plating: Its scales shatter standard weapons on impact. If a physical Melee attack fails to beat the dragon's Defense of 9 or fails to deal more than 30 Wounds (after mitigation), the attacker's weapon violently shatters, becoming permanently destroyed (magical weapons lose 1 tier of effectiveness instead).

Incinerate the Weave: The dragon's internal heat destroys latent magic. Any player attempting to cast a spell within 60 feet of the dragon must spend an additional Focus point (or take 10 Fire Wounds) simply to force the magic to manifest through the superheated air.

Action-Based Abilities
Ash-Blight Breath (Range Cost: 2 Actions): The dragon unhinges its jaws, unleashing a terrifying vortex of pitch-black, magic-consuming fire. Make a Ranged attack (+5 To-Hit) against a 60-foot cone. On a hit, it deals 1d10 + 40 Fire/Necrotic Wounds. Additionally, the black fire instantly incinerates any active magical buffs, shields, or enchantments on the targets, stripping them completely.

Hurricane Wings (Range Cost: 1 Action): The dragon beats its vast, powerfully corded wings, generating a blast of superheated wind. Make a Ranged attack (+5 To-Hit) against all enemies in a 40-foot frontal arc. On a hit, targets take half Wounds 1d10 + 20 and are violently blown 30 feet backward, landing Prone.

Molten Crush (Melee Cost: 1 Action): The dragon brings its massive, obsidian-plated mass down on a target. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 60 Wounds. If the target is currently Prone, the sheer weight ignores 50% of the target's Armor Mitigation.`},
{name:`Basilisk: The Stone-Gazer`,size:`Large`,type:`Fantasy Lizard`,tier:`Boss`,tierColor:`#b91c1c`,desc:`"The first thing you'll notice is the silence. No birds, no insects—just a garden of statues, frozen in expressions of absolute terror. If you feel a hot, chemical breath on your ankles, it's already too late." The Basilisk is a low-slung, heavy-bodied reptilian predator with eight powerful legs that allow it to scale cavern walls with terrifying speed. Its mottled, toxic green scales shimmer with a poisonous, oily sheen, and a jagged crimson crest crowns its head. Its most lethal feature is its pale, glowing yellow eyes, which project a primordial magical force capable of turning blood to silt and flesh to flint in a matter of seconds.`,agl:`5`,awa:`7`,cha:`2`,int:`4`,phy:`9`,wil:`8`,move:`30`,ap:`3`,def:`6`,wmArmor:`15`,wmBS:`15`,wmDP:`Immune`,wounds:`160`,focus:`+2/6`,reroll:`1`,luck:`1`,meleeHit:`+3`,meleeDmg:`+20`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+4`,castDmg:`+25`,castHeal:`—`,castType:`Shaman`,fear:`4`,mob:`1-2`,gear:`None`,meleeDetail:`Toxic Jaws`,rangeDetail:`None`,abilities:`Passive Traits
Eight-Legged Scuttler: The Basilisk treats completely vertical cavern walls and ceilings as normal terrain. It can climb and hang upside down effortlessly without making any Agility checks, making it a terrifying ambush predator from above.

Oily, Toxic Sheen: The Basilisk's mottled green scales secrete a highly corrosive poison. Any time an attacker successfully hits the Basilisk with a physical melee weapon, the attacker must surpass Agility TN 7 + Resist bonus or immediately take 1d10 Acid Wounds as the toxic sheen splashes back onto them.

Avert Your Eyes: At the start of their turn, any player within 40 feet of the Basilisk can declare they are "Averting their Eyes." Doing so gives them automatic Disadvantage on all To-Hit and To-Cast rolls against the Basilisk for that round, but completely immunizes them from the beast's Flesh to Flint ability.

Action-Based Abilities
Flesh to Flint(TN9) (Casting Cost: 2 Actions): The Basilisk locks its pale, glowing yellow eyes onto a target within 40 feet who has not averted their eyes. Make a Casting roll (+4 To-Cast). If successful, it deals 25 Transmutation Wounds as the victim's blood turns to silt. The target must pass a severe Willpower(12) test. On a failure, they are inflicted with the Petrifying condition (their Movement is permanently reduced to 0, and they lose 1 Action per turn). If a target with the Petrifying condition fails a second surpass Willpower TN 7 + Resist bonus on a subsequent turn, they are permanently turned to solid stone until magically cured.

Chemical Plume(TN10) (Casting Cost: 2 Actions): The Basilisk exhales a searing cloud of chemical breath in a 15-foot cone at ankle-level. All enemies in the area must surpass Physique TN 11 + Resist bonus. On a failure, they take 2d10 + 25 Acid/Poison Wounds, gain 1 Poison condition, and are temporarily Blinded for their next turn as the fumes burn their eyes.

Ambush Snap (Melee Cost: 1 Action): A brutal, lunging bite used when dropping from the ceiling. Make a Melee attack (+3 To-Hit). If successful, it deals normal 1d10 + 20 Wounds and the target is Grappled in the Basilisk's heavy jaws, unable to move away from the creature's deadly gaze on their next turn.`},
{name:`Beastman Warrior: The Horned Grunt`,size:`Medium`,type:`Humanoid / Beastman`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A nightmare of muscle, coarse fur, and jagged iron. Standing a head taller than most men and significantly wider, they are built for the "crush." They don't fight with the discipline of a soldier or the grace of a duelist; they fight with the desperate, explosive energy of a cornered predator that has finally broken free. In battle, they are a wall of noise—bleating, roaring, and the rhythmic clatter of hooves on stone. They despise civilization, taking perverse joy in hacking down stone monuments and burning silk`,agl:`6`,awa:`5`,cha:`1`,int:`2`,phy:`9`,wil:`7`,move:`20`,ap:`3`,def:`8`,wmArmor:`7`,wmBS:`8`,wmDP:`20`,wounds:`35`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+4`,meleeDmg:`+10/18(2H)`,meleeHeal:`—`,rangeHit:`+1`,rangeDmg:`+9`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`10-30`,gear:`Scavenged Iron Plate, Jagged Rusted Cleaver, Throwing Hatchet.`,meleeDetail:`Jagged Cleaver`,rangeDetail:`Hurled Hatchet`,abilities:`Passive Traits 
The Herd Mentality: Beastmen draw terrifying confidence from the smell of their kin's sweat and the sound of the Bray-horn. If a Beastman Warrior starts its turn within 15 feet of at least two other conscious Beastmen, it gains Advantage on all Willpower tests and its Melee attacks deal an additional +3 Wounds as the "meat-grinder" engages.

Relentless Pursuit (Scent of Blood): Once they catch a scent, they will run until their lungs burn. If any enemy within 60 feet is currently suffering from a Bleeding condition, the Beastman's Movement speed increases by +15Ft when moving directly toward that target, and it completely ignores all Movement penalties from Difficult Terrain during the chase.

Despiser of Stone: Taking perverse joy in destroying civilization, the Beastman's attacks deal double Wounds to any physical structures, barricades, magical stone walls, and constructs (like Golems). They will aggressively sunder player shields if given the chance.

Action-Based Abilities 
The Crush (Melee Cost: 2 Actions): The Beastman launches itself with the explosive energy of a cornered predator. It moves up to its Movement speed in a straight line and makes a Melee attack (+4 To-Hit). If it hits, the target takes 1d10 + 18 Wounds and must surpass Physique TN 9 + Resist bonus or be violently knocked Prone by the sheer mass of the charge.

Jagged Butcher (Melee Cost: 1 Action): A brutal, wild swing with its rusted cleaver. Make a Melee attack (+4 To-Hit). If this attack hits a target that is currently Prone, it automatically inflicts 1 Bleeding condition as the jagged iron tears through armor.

Wall of Noise (Cost: 1 Action): The Beastman beats its chest and unleashes a terrifying, bleating roar. It chooses one allied Beastman within 30 feet. That ally immediately gets to use its Reaction to move 15 feet toward the nearest bleeding or fleeing enemy, keeping the relentless pressure on the party.`},
{name:`Beholder-Kin: The Eye-Tyrant`,size:`Large`,type:`Aberration`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Beholder is a floating orb of xenophobic madness. It views itself as the pinnacle of evolution and all other life as a disgusting mistake to be erased. It is the ultimate "anti-meta" monster, designed to completely shut down the party's strongest abilities. It does not fight you physically; it calculates your exact strategy and dismantles it with a terrifying array of alien eye-rays and an overwhelming anti-magic presence.`,agl:`2`,awa:`6`,cha:`5`,int:`9`,phy:`1`,wil:`7`,move:`30`,ap:`3`,def:`8`,wmArmor:`10`,wmBS:`20`,wmDP:`30`,wounds:`75`,focus:`+2/6`,reroll:`2`,luck:`1`,meleeHit:`+1`,meleeDmg:`+4`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+4`,castDmg:`+40`,castHeal:`—`,castType:`Wizardry`,fear:`6`,mob:`1`,gear:`None`,meleeDetail:`Special Abilities`,rangeDetail:`Special Abilities`,abilities:`Passive Traits 
The Anti-Magic Cone: The Eye-Tyrant's massive central eye projects a 60-foot cone of suppressed reality. At the start of its turn, it decides which direction the eye faces. Any player inside that cone is completely Silenced (cannot cast spells), and any active magical buffs, auras, or magical weapon properties they possess are temporarily disabled while they remain in the cone.

360-Degree Paranoia: Because of its writhing crown of eyestalks, the Tyrant can never be caught off guard. It is completely immune to the Blinded condition, cannot be Flanked by melee attackers, and completely negates any Advantage players might gain from attacking out of Stealth.

Xenophobic Levitation: The Eye-Tyrant never touches the dirt of the lesser races. It is immune to all ground-based traps, spells, and Difficult Terrain. Furthermore, it takes zero Wounds from falling, simply arresting its momentum telekinetically.

Action-Based Abilities 
Ray of Exhaustion(TN6) (Casting Cost: 1 Action): The Tyrant targets the party's physical powerhouse. Make a Casting roll (+4 To-Cast) against a target within 60 feet. On a hit, it deals no Wounds, but the target instantly gains 2 Fatigued conditions and loses half their Movement on their next turn as the ray saps their will to live.

Telekinetic Reposition(TN7) (Casting Cost: 1 Action): The Tyrant takes control of the battlefield. It targets one enemy within 60 feet. The target must surpass Willpower TN 9 + Resist bonus or be violently thrown 20 feet in any direction the Tyrant chooses (including into hazards or directly out of melee range), taking 1d10 + 15 blunt Wounds upon landing.

Disintegration Beam(TN12) (Casting Cost: 2 Actions): The ultimate punisher. Make a Casting roll (+4 To-Cast) against a single target within 40 feet. If successful, it deals an agonizing 3d10 + 40 Aberrant Wounds. If this attack misses, or if the target uses a physical shield/barricade to block it, the object used as cover is instantly reduced to fine gray dust.`},
{name:`Black Dragon: The Rot-Lord`,size:`Giant`,type:`Dragon / Monstrosity`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Black Dragon is visually distinct for its sunken, skull-like face. Its skin has receded around its snout, giving it a permanent, skeletal grin. Its horns curve forward like a crown of blackened bone, and its scales are dull, matte black, designed to absorb the dim light of the marsh. They are the masters of ambushes. A Black Dragon doesn't roar a challenge; it waits submerged in a pool of acid-filled muck, breathing through its nostrils like a crocodile, until its prey is waist-deep. They find joy in the "Slow Kill," often letting a victim crawl away just so they can track the scent of their melting flesh through the trees.`,agl:`5`,awa:`12`,cha:`4`,int:`7`,phy:`15`,wil:`8`,move:`40/50S`,ap:`3`,def:`9`,wmArmor:`25`,wmBS:`20`,wmDP:`Immune`,wounds:`306`,focus:`+2/6`,reroll:`2`,luck:`1`,meleeHit:`+6`,meleeDmg:`+40`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+40`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`8`,mob:`1`,gear:`Random`,meleeDetail:`Skeletal Jaws & Bone-Crown`,rangeDetail:`Melting Acid`,abilities:`Passive Traits
Crocodilian Ambush: As long as the Black Dragon is submerged in water or deep mud, it is virtually invisible, absorbing all light. It automatically gains Advantage on Stealth checks to initiate combat. If it attacks a target from submerged Stealth, the attack cannot be dodged or parried, and automatically Grapples the victim on a hit.

The Slow Kill: The dragon delights in suffering. It automatically gains Advantage on all Melee attacks against any target that is currently suffering from a Bleeding, Poisoned, or Acid condition. Furthermore, it can track the scent of these conditions flawlessly, making it impossible for wounded players to hide from it.

Matte-Black Scales: The dull, light-absorbing nature of its hide makes it incredibly difficult to target from afar in its natural habitat. While in dim light, fog, or darkness, the dragon cannot be targeted by Ranged or Casting attacks from further than 30 feet away.

Action-Based Abilities
Eruption from the Muck (Melee Cost: 1 Action): The dragon bursts from the bog, snapping its skull-like jaws. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 40 normal Wounds and the target is instantly Grappled. The sheer force of the displacement knocks all other enemies within 15 feet Prone.

Breath of the Rot-Lord (Range Cost: 3 Actions): The dragon exhales a concentrated stream of highly corrosive, black acid. Make a Ranged attack (+5 To-Hit) against all targets in a 60-foot line. On a hit, targets take 3d10 + 40 Acid Wounds, and their armor is permanently degraded (losing 5 points of Wound Mitigation). Targets also gain 1 Poisoned/Acid condition.

The Drowning Drag (Cost: 1 Action): The dragon violently pulls a Grappled target back into the acidic water with it. The dragon moves up to 25 feet (taking the target with it). The target takes 30 Bludgeoning Wounds from the crushing jaws and must immediately begin rolling against your game's Drowning/Suffocation mechanics.`},
{name:`Blue Dragon: The Storm of the Dunes`,size:`Enormous`,type:`Dragon`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A Blue Dragon is a magnificent and terrifying sight. Its scales are the deep, iridescent blue of a desert sky at midnight, polished to a mirror-sheen by the abrasive sands. A singular, massive horn projects from its snout—a lightning rod for the static energy that constantly hums through its body. They are patient hunters, burying themselves beneath the sand for days until a caravan passes overhead, erupting in a shower of glass and electricity. They possess an immense ego and a particular obsession with gems (especially sapphires), often sparing a "lesser being" if offered a worthy tribute.`,agl:`5`,awa:`8`,cha:`15`,int:`7`,phy:`18`,wil:`12`,move:`40/90F`,ap:`3`,def:`9`,wmArmor:`30`,wmBS:`20`,wmDP:`Immune`,wounds:`550`,focus:`+2/6`,reroll:`3`,luck:`1`,meleeHit:`+6`,meleeDmg:`+60`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+30`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`8`,mob:`1`,gear:`A massive hoard buried deep beneath the desert`,meleeDetail:`The Lightning Horn & Claws`,rangeDetail:`Chain Lightning`,abilities:`Passive Traits
The Living Lightning Rod: Static electricity constantly hums through the dragon's body. Any time a player successfully hits the Blue Dragon with a metal Melee weapon, the kinetic impact discharges the static, instantly dealing 1d10 Lightning Wounds back to the attacker.

Dune Ambusher: When buried beneath the sand, the dragon is entirely undetectable by non-magical means. It automatically gains Advantage on its Initiative roll. When it erupts from the sand, the superheated lightning fuses the ground in a 40-foot radius into jagged glass, turning the battlefield into severe Difficult Terrain that causes Bleed 1d10 damage if fallen upon.

The Sapphire Tribute: The dragon's immense ego is its only real weakness. As an Action, a player can hold up a gemstone of significant value and grovel. The dragon must pass a surpass Willpower TN 7 + Resist bonus; if it fails, its ego wins out, and it will spend its next turn demanding the gem and conversing rather than attacking that specific player. Sapphires impose Disadvantage on the dragon's surpass Willpower TN 7 + Resist bonus to resist.

Action-Based Abilities
Eruption of the Storm (Melee Cost: 3 Actions): The dragon bursts from its sandy grave. It makes a Melee attack (+6 To-Hit) against every target within a 30-foot radius. On a hit, targets take 1d10 + 60 Wounds, are violently thrown 20 feet backward, and are knocked Prone amidst the newly formed glass.

Midnight Sky Beam (Range Cost: 2 Actions): The dragon lowers its massive horn and unleashes a concentrated beam of static energy. Make a Ranged attack (+5 To-Hit) against a 100-foot line. On a hit, it deals 4d10 + 30 Lightning Wounds, and targets are completely Deafened and Stunned for 1 round from the thunderclap.

Arrogant Pin (Melee Cost: 1 Action): The dragon slams a claw down on a single target to demand its tribute. Make a Melee attack (+6 To-Hit). If successful, it deals half Wounds 1d10 + 30, but the target is Grappled and Restrained under the sheer weight of the beast, completely unable to move until the dragon lifts its claw.`},
{name:`Bog Octopuss (Silt Lurker)`,size:`Giant`,type:`Beast / Monstrosity`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A master of camouflage, its skin mimics the texture of wet moss, decaying logs, and oily peat. It doesn't swim so much as it "drifts" through the mud, using eight muscular tentacles to pull itself along the swamp floor or hang from low cypress branches. Unlike its oceanic cousins, it secretes a thick, paralytic mucus to "marinate" prey. It is the silent killer of the marsh—one moment you’re stepping on a log, the next, you’re being dragged into the dark, anaerobic depths. It prefers to strike from total concealment, waiting for the heaviest member of the party to walk over it before erupting in a whirlwind of suction cups and slime.`,agl:`11`,awa:`9`,cha:`2`,int:`5`,phy:`12`,wil:`7`,move:`26W/12L`,ap:`3`,def:`6`,wmArmor:`20`,wmBS:`20`,wmDP:`30`,wounds:`320`,focus:`+2/6`,reroll:`1`,luck:`—`,meleeHit:`+6`,meleeDmg:`+50`,meleeHeal:`—`,rangeHit:`+4`,rangeDmg:`+20`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1`,gear:`None`,meleeDetail:`Suction-Cup Tentacles`,rangeDetail:`Special Abilities`,abilities:`Passive Traits
Perfect Peat Camouflage: As long as the Bog Octopus is submerged in mud or resting against a cypress tree, it is entirely indistinguishable from the environment. It automatically gains Advantage on Stealth checks. If it attacks a target who has not detected it, that attack gains Advantage and automatically Grapples the target on a hit.

Paralytic Mucus: The creature's skin constantly secretes a numbing slime. Any time an enemy successfully hits the Bog Octopus with an unarmed strike, or starts their turn Grappled by it, the enemy must surpass Physique TN 12 + Resist bonus or suffer 1 Poison condition and lose half their Movement speed as their limbs go numb.

Anaerobic Drag (Drown Mechanics): The Silt Lurker does not fight fair. If the Octopus has a target Grappled, it can use its innate Movement to drag that target directly underwater or deep into the thick mud. Once submerged, the target cannot speak or cast spells with verbal components, and they immediately begin suffering from Drowning/Suffocation rules.

Action-Based Abilities
Eruption of Suction Cups (Melee Cost: 2 Actions): The Octopus bursts from concealment, lashing out with massive tentacles. It makes a Melee attack (+6 To-Hit) against up to two targets within 15 feet. If successful, it deals normal 1d10 + 50 Wounds, and the targets are violently pulled into spaces adjacent to the Octopus and Grappled.

Marinate the Prey (Range Cost: 1 Action): The Octopus forcefully expels a thick glob of paralytic mucus at a target within 30 feet. Make a Ranged attack (+4 To-Hit). If successful, it deals 1d10 +20 Acid/Poison Wounds, and the target is completely Stunned for 1 round as their nervous system locks up.

Drag to the Depths (Cost: 1 Action): The Octopus tightens its grip on a Grappled target and violently crushes them. The target automatically takes 2d10 + 30 Bludgeoning Wounds. If the Octopus and the target are submerged in the mud/water, the target instantly loses 1 additional round of their held breath (accelerating the drowning process).`},
{name:`Bone Giant: The Amalgamation`,size:`Giant`,type:`Undead / Construct`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The ultimate weapon of a master necromancer. It is not a resurrected creature, but an amalgamation—a golem of death constructed from the fused skeletons of hundreds of humans, horses, and beasts. The bones are lashed together by thick, glowing sinews of sickly-green necromantic energy, and inside its hollow ribcage, a localized storm of trapped souls swirls like a vortex. It wears no armor; its outer layer of fused skulls and femurs acts as a hardened carapace. It moves with a jerky, unnatural rhythm, but its sheer stride length makes it terrifyingly fast. Wielding an uprooted graveyard mausoleum pillar on chains, it exists only to smash castle gates and crush armored formations into dust.`,agl:`5`,awa:`7`,cha:`2`,int:`1`,phy:`15`,wil:`9`,move:`40`,ap:`3`,def:`8`,wmArmor:`25`,wmBS:`20`,wmDP:`Immune`,wounds:`400`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+5`,meleeDmg:`+50`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`+20`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`8`,mob:`1`,gear:`Uprooted Mausoleum Pillar with Chains`,meleeDetail:`Mausoleum Pillar Greatclub`,rangeDetail:`Chunks of Graveyard Stone`,abilities:`Passive Traits
Amalgamation of Death: Because it is a golem made of hundreds of corpses rather than a single undead entity, standard "Turn Undead" or banishing spells are highly ineffective. It automatically succeeds on Willpower tests to resist being turned, commanded, or frightened. Additionally, it takes no extra damage from Critical Hits, as it has no vital organs or singular structural weak point.

Chorus of the Damned: The vortex of trapped souls in its ribcage is an overwhelming hazard. Any living creature that starts its turn within 30 feet of the Giant takes 10 Psychic/Necrotic Wounds from the wailing spirits and is Deafened.

Siege Engine: The Bone Giant is built to reduce fortresses to dust. It deals double Wounds to all environmental structures, walls, vehicles, and physical shields. It ignores Movement penalties for walking through difficult terrain, as it simply crushes the obstacles beneath its massive feet.

Action-Based Abilities
Mausoleum Sweep (Cost: 2 Actions): The Giant swings its massive stone pillar in a brutal, horizontal arc. Make a Melee attack (+5 To-Hit) against up to two adjacent targets. On a hit, it deals 1d10 + 50 Bludgeoning Wounds. Targets struck must pass a severe Physique(12) test or be violently hurled 30 feet backward, landing Prone.

Vortex Vent (Range Cost: 2 Actions): The Giant forcibly opens its ribcage, unleashing a torrent of the screaming souls trapped within. Make a Ranged attack (+3 To-Hit) in a 60-foot cone. On a hit, targets take 3d10 + 20 Necrotic Wounds and gain 1 Stunned condition as the spectral hands tear at their life-force.

Unnatural Trample (Cost: 1 Action): The Giant uses its terrifyingly fast stride to crush the frontline. It moves up to its full 60-foot Movement speed in a straight line, passing freely through the spaces of any smaller creatures. Any enemy whose space it moves through must surpass Agility TN 10 + Resist bonus or take 30 Bludgeoning Wounds from its colossal, skeletal feet.`},
{name:`Cave Spider: The Jagged-Ambusher`,size:`Medium`,type:`Beast / Monstrosity`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A Cave Spider is roughly the size of a squat human or a large wolf, but its eight spindly, multi-jointed legs give it a much wider footprint. Its thorax is covered in jagged, calcified plates that perfectly mimic the texture of wet stalactites or jagged limestone. They do not build massive, visible webs; instead, they spin nearly invisible, high-tension "trip-wires" across cave floors and narrow corridors. They are patient stalkers, preferring to drop from the ceiling to deliver a single, paralyzing bite before retreating into the shadows to let the toxin do its gruesome work.`,agl:`9`,awa:`7`,cha:`1`,int:`2`,phy:`6`,wil:`5`,move:`35`,ap:`3`,def:`7`,wmArmor:`20`,wmBS:`10`,wmDP:`30`,wounds:`40`,focus:`+2/6`,reroll:`1`,luck:`1`,meleeHit:`+4`,meleeDmg:`+15`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`+10`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`5`,mob:`1-4`,gear:`Calcified Plating (Natural Armor)`,meleeDetail:`Paralyzing Fangs`,rangeDetail:`High-Tension Silk. Shoots invisible trip-wires up to 40ft`,abilities:`Passive Traits
Stalactite Camouflage: When clinging to a rocky ceiling or wall and remaining motionless, the Cave Spider is virtually indistinguishable from a jagged limestone formation. It automatically gains Advantage on any Stealth checks to initiate an ambush, and enemies suffer Disadvantage on Awareness checks to spot it in the dark.

High-Tension Trip-Wires: At the start of the encounter, the Cave Spider has already laid invisible silk trip-wires in the immediate 30-foot area. Whenever an enemy uses a Move action to travel more than 10 feet through this zone, they must surpass Agility TN 9 + Resist bonus or violently trip, falling Prone and ending their Movement for that turn.

Ceiling Scuttler: The Cave Spider completely ignores all difficult terrain modifiers for climbing. It can move at its full speed of 40 across sheer walls and ceilings, and takes zero falling damage if it intentionally drops onto a target.

Action-Based Abilities
The Jagged Drop (Melee Cost: 1 Action): The spider releases its grip on the ceiling and plummets onto an unsuspecting target. It moves up to 20 feet vertically and makes a Melee attack (+3 To-Hit). If successful, it deals 1d10 + 25 Wounds, and the sheer weight of its calcified thorax knocks the target Prone.

Paralyzing Bite (Melee Cost: 2 Actions): The spider's signature execution tool. Make a Melee attack (+3 To-Hit) against a target. If successful, it deals 1d10 + 15 Wounds, and the target must pass a severe Physique(10) test. On a failure, the venom takes hold—inflicting 1 Poison condition (1d10 wounds) and the Stunned condition for 1 round.

Scuttle to the Shadows (Cost: 1 Action): Adhering to its hit-and-run nature, the spider instantly Disengages from melee combat without triggering any free attacks of opportunity. It can immediately move up to 20 feet, preferably up a wall or into a narrow crevice, to let its venom do the work.`},
{name:`Chaos Dwarf: The Slag-Drudge`,size:`Medium`,type:`Humanoid / Corrupted`,tier:`Minion`,tierColor:`#6b7280`,desc:`The lowest of the low in the Bin Uluhm hierarchy. While the Taskmasters wield cruel whips and the Overseers build mighty machines, the Slag-Drudges are the miserable, soot-covered laborers who shovel the magma and haul the volatile black-powder. They are barely treated better than the slaves, clad in literal scrap iron and cooled slag strapped to their burned skin. They are half-blind from the forge-glare, deafened by industry, and fight out of sheer, terrified desperation and malicious spite.`,agl:`-1`,awa:`—`,cha:`-2`,int:`—`,phy:`6`,wil:`5`,move:`12`,ap:`3`,def:`4`,wmArmor:`8`,wmBS:`—`,wmDP:`10`,wounds:`20`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+2`,meleeDmg:`+12`,meleeHeal:`—`,rangeHit:`+1`,rangeDmg:`+5`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`3-18`,gear:`usty Slag-Shovel, Unstable Black-Powder Flask, Scrap Iron.`,meleeDetail:`Rusty Slag-Shovel`,rangeDetail:`Hot Cinders`,abilities:`Passive Traits
Strength in Misery: The Slag-Drudge is far more afraid of its boss than it is of the players. If a Slag-Drudge is standing within 30 feet of an allied Bin Uluhm Taskmaster or Overseer, it automatically gains Advantage on its Melee To-Hit rolls out of sheer terror of missing.

Spiteful Demise: They carry unstable flasks of mining powder on their belts. When a Slag-Drudge is reduced to 0 Wounds, it spitefully detonates the flask. Every creature (friend or foe) within 5 feet must surpass Agility TN 5 + Resist bonus or take 10 Fire Wounds from the blast.

Ash-Blind: Having spent their entire lives staring into magma vents, they are completely immune to the Blinded condition and ignore all visibility penalties caused by smoke or ash.

Action-Based Abilities
Shovel Strike (Cost: 1 Action): A desperate, heavy swing with a crude mining tool. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 12 Bludgeoning/Slashing Wounds.

Hot Cinder Toss (Range Cost: 1 Action): The Drudge reaches into its apron and throws a handful of burning slag. Make a Ranged attack (+1 To-Hit) against a target within 15 feet. On a hit, it deals 5 Fire Wounds and the target gains 1 Burning condition.

Cowardly Scramble (Cost: 1 Action): The Drudge drops to all fours to escape. It moves up to 15 feet. This movement completely ignores Difficult Terrain and does not trigger free attacks of opportunity.`},
{name:`Cherubim: The Iron-Beast`,size:`Giant`,type:`Celestial / Construct`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A Cherubim is a massive, four-legged entity standing 18 feet tall, its body forged from a living alloy of celestial bronze and iron. It possesses four distinct wings covered in thousands of flickering, golden eyes that see into every spectrum of existence—infrared, magical, and moral. Its most unsettling feature is its head, which continuously rotates to reveal four distinct faces: the Man (Wisdom), the Lion (Might), the Ox (Endurance), and the Eagle (Agility). Depending on which face is currently forward, the Cherubim’s fighting style shifts instantly. They are the ultimate "Living Weapon," designed to guard the gates of reality from anything that would dare approach the High Seat.`,agl:`5`,awa:`8`,cha:`4`,int:`7`,phy:`12`,wil:`15`,move:`30/40F`,ap:`3`,def:`9/11F`,wmArmor:`25/50`,wmBS:`30`,wmDP:`Immune`,wounds:`320`,focus:`+2/6`,reroll:`2`,luck:`3`,meleeHit:`+6/+8`,meleeDmg:`+35/+55`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+4`,castDmg:`+20`,castHeal:`—`,castType:`Faith`,fear:`6`,mob:`1`,gear:`None (It is the weapon)`,meleeDetail:`Brazen Hooves & Wings`,rangeDetail:`Special Abilities`,abilities:`Passive Traits
Omniscient Wings: Covered in thousands of golden eyes, the Cherubim perceives the absolute truth of the battlefield. It is immune to the Blinded condition, ignores all forms of invisibility or magical darkness, and can never be Flanked.

Living Alloy: The Cherubim’s body is immune to mundane weaponry. Any physical attacks made with non-magical, non-adamantine weapons deal exactly half Wounds (before mitigation is applied) and have their armor sundering effects completely ignored.

The Fourfold Visage: At the start of the Cherubim's turn, its massive head violently rotates to reveal a new face, fundamentally altering its combat loop for that round:

Face of the Lion (Might): Its Melee To-Hit becomes an overwhelming +8, and all Melee Wounds are increased by +20.

Face of the Ox (Endurance): Its Armor Mitigation doubles to 50, and it becomes completely immune to being knocked Prone or moved.

Face of the Eagle (Agility): It unfolds its wings, gaining a Flight speed of 80 feet, and its Defense increases to 11 while airborne.

Face of the Man (Wisdom): It projects an aura of divine law. Any enemy attempting to cast a spell within 60 feet must surpass Willpower TN 12 + Resist bonus, or the spell fizzles and is wasted.

Action-Based Abilities 
Judgment of the Hoof (Melee Cost: 1 Action): The Cherubim rears up and brings its celestial bronze hooves down on a target. Make a Melee attack (+6 To-Hit, modified by Visage). If successful, it deals normal 1d10 + 35 Wounds and permanently shatters the target's physical shield, if non-magical.

Searing Gaze(TN9) (Casting Cost: 2 Actions): The thousands of eyes on its wings flare with blinding, infrared light. Make a Casting attack (+4 To-Hit) against a target within 40 feet. On a hit, it deals 2d10 + 20 Radiant Wounds, and the target is permanently Marked. The Cherubim's melee attacks automatically gain Advantage against Marked targets.

Gatekeeper's Banishment (Melee Cost: 2 Actions): The Cherubim strikes the earth, unleashing a shockwave of moral and magical energy in a 20-foot radius. All enemies caught in the blast must surpass Physique TN 12 + Resist bonus or take 3d10 + 35 Radiant Wounds and be violently thrown 15 feet away, landing Prone. Summoned creatures or undead hit by this blast take double Wounds.`},
{name:`Chlorofel Thorn-Wolf`,size:`Medium`,type:`Plant-Beast (Scout)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`Predatory plant-animal hybrids that blend perfectly into the vibrant colors of the Weald. They are the 'invisible' hunters of the forest canopy.`,agl:`7`,awa:`4`,cha:`1`,int:`2`,phy:`6`,wil:`3`,move:`20`,ap:`4`,def:`5`,wmArmor:`8`,wmBS:`—`,wmDP:`—`,wounds:`35`,focus:`1`,reroll:`1`,luck:`—`,meleeHit:`+5`,meleeDmg:`1d10+4`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`1d10+5`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1d10`,gear:`Needle Fur`,meleeDetail:`Serrated Bite`,rangeDetail:`Needle-Spray`,abilities:`Passive Traits
Photosynthetic Camouflage: The wolf gains Advantage on all Agility tests to hide while in the brush of the Chromatic Weald.

Needle Fur: Any creature striking the wolf with a melee attack takes 1d10-3 automatic piercing damage from the pine-needle coat.

Pack Tactics: The wolf gains a +1 To-Hit bonus for every other Chlorofel creature currently engaged with the same target.

Action-Based Abilities
Needle-Spray (1 Action): Ranged +5. The wolf shakes its coat, firing needles in a 15ft cone. Deals 1d10+5 wounds and causes 1 Bleeding condition.

Serrated Bite (2 Actions): If the hit is successful, the wolf latches on with hooked teeth. Target is Grappled (Def 0).

Floral Scent (TN 6 - 1 Action): The wolf releases an alluring aroma. Target must pass a surpass Willpower TN 7 + Resist bonus or be Stunned for 1 turn.`},
{name:`Clay Golem: The Tomb Guardian`,size:`Large`,type:`Construct / Elemental`,tier:`Elite`,tierColor:`#b45309`,desc:`Clay Golems are not merely statues; they are semi-liquid constructs of primordial clay imbued with a fragment of a spirit. Standing nearly ten feet tall, the golem has a disproportionately large upper body with long, trunk-like arms. Its head is a featureless dome, save for a single glowing glyph etched into its forehead. Its surface is perpetually damp and shifting. Unlike stone or iron golems, the clay version is disturbingly silent, its footsteps making a soft "thud-squelch" sound on the stone floors of the tombs it protects. When struck, the clay doesn't shatter; it ripples like water, sealing the wound almost as quickly as it is made.`,agl:`5`,awa:`6`,cha:`1`,int:`2`,phy:`9`,wil:`8`,move:`18`,ap:`3`,def:`7`,wmArmor:`12`,wmBS:`15`,wmDP:`Immune`,wounds:`95`,focus:`—`,reroll:`1`,luck:`—`,meleeHit:`+4`,meleeDmg:`+25`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`5`,mob:`1-2`,gear:`None`,meleeDetail:`Trunk-like Arms`,rangeDetail:`None`,abilities:`Passive Traits
Rippling Clay (Self-Sealing): Mundane weapons get stuck in its body or pass through harmlessly. Any physical Melee attack that deals Slashing or Piercing Wounds has its total damage cut in half before Armor Mitigation is even applied. Furthermore, the Golem is completely immune to the Bleeding and Fatigued conditions.

Silent Squelch: Despite being 10 feet tall, the Clay Golem makes virtually no sound. It automatically succeeds on Agility tests to move silently, granting it Advantage on its opening attacks against a party that is relying solely on hearing to navigate a dungeon.

Berserk Degradation: If the glowing glyph on its forehead takes targeted magic damage, or the Golem's Health drops below 20%, the binding spirit fractures. The Golem enters a mindless Frenzy, attacking the closest creature (friend or foe) with Advantage on all To-Hit rolls, completely ignoring any defensive tactics.

Action-Based Abilities
Trunk-Arm Slam (Cost: 1 Action): The Golem brings down a massive, mud-caked fist. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 25 Bludgeoning Wounds, and the target must surpass Physique TN 8 + Resist bonus or be knocked Prone.

Smothering Embrace (Melee Cost: 2 Actions): The Golem attempts to absorb a target into its semi-liquid chest. Target one adjacent enemy. Make a Melee attack (+4 To-Hit). On a hit, it deals 20 Bludgeoning Wounds, and the target is pulled into the clay. The target is instantly Grappled, Restrained, and Silenced (unable to breathe or cast verbal spells). They take 10 Suffocation Wounds at the start of their turn until they use an Action to break free.

Glyph of Sluggishness (Cost: 1 Action): The glyph on the Golem's featureless dome flares with ancient curse magic. All enemies within a 20-foot radius must surpass Willpower TN 7 + Resist bonus. On a failure, their Movement speed is reduced by half on their next turn, and they cannot use Reactions, replicating the heavy, dragging sensation of wading through deep mud.`},
{name:`Crimson Tri-Mantis`,size:`Large`,type:`Beast / Insectoid`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A blood-red apex predator standing 12 feet tall. Its three bladed forelimbs move so fast they create a whistling vacuum in the air before they strike. It does not stalk prey slowly; it waits in absolute, terrifying stillness before erupting into a blur of crimson and severing limbs before the victim even hears the sound of the air tearing.`,agl:`9`,awa:`6`,cha:`1`,int:`2`,phy:`8`,wil:`5`,move:`40`,ap:`3`,def:`7`,wmArmor:`9`,wmBS:`8`,wmDP:`30`,wounds:`80`,focus:`+2/6`,reroll:`1`,luck:`1`,meleeHit:`+4`,meleeDmg:`+20/+30`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1-2`,gear:`Razor Chitin`,meleeDetail:`Tri-Bladed Forelimbs`,rangeDetail:`None`,abilities:`Passive Traits
Vacuum Strikes: The sheer speed of the Mantis's forelimbs warps the air pressure around the blades. Its Melee attacks completely ignore the Armor Mitigation provided by physical shields, and players cannot use the "Parry" reaction to deflect its blows, as the vacuum simply pulls their weapons out of alignment.

Compound Omnivision: The Tri-Mantis's massive, multifaceted eyes process movement in a 360-degree arc. It is completely immune to the Blinded and Flanked conditions, and attackers can never gain Advantage from striking it from behind or from Stealth.

Crimson Stillness: Despite being bright red, it perfectly mimics bloody detritus or specific crimson flora in its environment. If it remains completely motionless, it gains Advantage on Stealth checks. If it attacks a target who hasn't detected it, it automatically wins the Initiative tie for that round.

Action-Based Abilities
Whistling Cleave (Melee Cost: 1 Action): A blindingly fast slash with one of its bladed arms. Make a Melee attack (+4 To-Hit). If successful, it deals normal 1d10 + 20 Wounds and automatically inflicts 1 Bleeding condition as the razor-edge surgically parts flesh.

Vacuum Guillotine (Melee Cost: 2 Actions): The Mantis strikes with two blades simultaneously, crossing them like scissors to create a localized barometric drop. Make a Melee attack (+4 To-Hit). If successful, it deals 2d10 + 30 Wounds, and the target is Deafened and Stunned for 1 round as the sudden vacuum pops their eardrums and stuns their nervous system.

Predator's Vault (Cost: 1 Action): Relying on its powerful hind legs, the Mantis instantly Disengages from melee combat without triggering free attacks of opportunity. It leaps up to 30 feet in any direction (including vertically). Upon landing, any adjacent enemy must surpass Agility TN 9 + Resist bonus or be knocked Prone by the sheer force of the impact.`},
{name:`Daemon Lord: The Abyssal Strategist`,size:`Large`,type:`Fiend / Daemonic`,tier:`Elite`,tierColor:`#b45309`,desc:`Standing between 8 and 10 feet tall, the Daemon Lord possesses an aura of dark majesty that is almost physical, forcing even the most chaotic spirits to bow. Forged from the soul-stuff of fallen heroes, his armor is immaculate, and he carries a blade that can sever a soul with a scratch. When he speaks, reality itself tries to obey. He does not merely lead through strength, but through a supreme, cold intellect that views the mortal realms as a chessboard. To him, a Greater Daemon is simply an expensive, violent siege engine to be deployed and discarded.`,agl:`2`,awa:`1`,cha:`8`,int:`9`,phy:`6`,wil:`8`,move:`20/30F`,ap:`3`,def:`7`,wmArmor:`20`,wmBS:`30`,wmDP:`Immune`,wounds:`110`,focus:`+4/12`,reroll:`3`,luck:`1`,meleeHit:`+5`,meleeDmg:`+45(2H)`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+4`,castDmg:`+32`,castHeal:`—`,castType:`Wizardry`,fear:`7`,mob:`1`,gear:`oul-Forged Plate, The Abyssal Greatsword`,meleeDetail:`Abyssal Greatsword`,rangeDetail:`None`,abilities:`Passive Traits
Aura of Dark Majesty: The Lord's presence suppresses hope. Enemies within 30 feet of him cannot gain Advantage on any attack rolls, regardless of flanking or stealth. Additionally, any allied Daemons within this aura gain +5 to their Wounds dealt as they are driven to impress their master.

The Duelist King: If forced into a 1v1 engagement (meaning no other allies or enemies are adjacent to him and his target), his strikes sever the soul. Any target he hits in a 1v1 cannot be healed by magical means for 1 full round. Furthermore, he completely ignores the Flanked condition, smoothly pivoting to parry.

Master's Guard: Because he relies on flawless parrying rather than dodging, any Melee attack that fails to beat his Defense of 7 results in the attacker being smoothly deflected and pushed 5 feet backward, ruining their positioning.

Action-Based Abilities
The Voice of Ruin(TN7) (Casting Cost: 1 Action): He speaks a command that reality forces mortals to obey. Make a Casting attack (+4 To-Hit) against a target within 40 feet. On a hit, it deals no Wounds, but the target must instantly use their Reaction to move up to 15 feet in a direction of the Lord's choosing (forcing them into traps, off cliffs, or away from the healer).

Flawless Riposte (Melee Cost: 2 Actions): The Lord executes a breathtakingly precise sword technique. Make a Melee attack (+5 To-Hit). If successful, it deals normal 1d10 + 45 Wounds and the target is violently Disarmed. Make a Physique vs surpass Physique TN 7 + Resist bonus. if failed, their weapon is knocked 10 feet away, and they gain 1 Stunned condition from the agonizing shock to their nerves.

Grand Commander's Edict(TN12) (Casting Cost: 1 Action): The Lord points his blade, directing the flow of battle. He chooses one player; immediately, any allied Daemon on the battlefield may use its Reaction to move its full speed toward that player and make a single Melee attack. If the Lord has no allies currently alive, this Action instead summons 1d10 Lesser Daemons to the edges of the battlefield.`},
{name:`Dark Elf: Noktorian Gutter-Blade`,size:`Medium`,type:`Humanoid`,tier:`Minion`,tierColor:`#6b7280`,desc:`The bottom feeders of the Obsidian Chasm. While the Night-Blades are elite assassins, the Gutter-Blades are the desperate street-rats, scavengers, and disposable pawns of Noktorian society. Wrapped in soot-stained rags and wielding chipped, rusted shivs, they lurk in the darkest crevices of the subterranean city. They are underfed, uneducated, and entirely devoid of loyalty. They fight like cornered vermin—striking only when they have overwhelming numbers, using dirty tricks, and fleeing at the first sign of genuine danger.`,agl:`6`,awa:`5`,cha:`—`,int:`—`,phy:`—`,wil:`—`,move:`18`,ap:`3`,def:`4`,wmArmor:`5`,wmBS:`3`,wmDP:`10`,wounds:`14`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+2`,meleeDmg:`+6`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`+4`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`4-12`,gear:`usted Shiv, Pouch of Blinding Spores, Soot-Stained Rags`,meleeDetail:`Rusted Shiv`,rangeDetail:`Pocket Spores, Throwing Dagger`,abilities:`Passive Traits
Chasm Vermin: The Gutter-Blades are entirely at home in the pitch black. They ignore all penalties for dim light or darkness. Furthermore, if a Gutter-Blade makes a Melee attack against a target that is already engaged with at least two other allied Gutter-Blades, they automatically gain Advantage on the To-Hit roll (Pack Tactics).

Craven Flight: Their instinct is self-preservation above all else. If a Gutter-Blade takes any Wounds, or if they witness an allied Dark Elf die within 15 feet of them, they immediately use a Reaction to Disengage and move 15 feet away, scurrying up the nearest wall if possible.

Crude Toxin: They don't have access to refined neurotoxins, so they smear their shivs with whatever venomous centipede ichor they can find. Any time a Gutter-Blade scores a Critical Hit with a Melee attack, the crude venom seeps in, applying 1 Poisoned condition to the target.

Action-Based Abilities
Gut-Stab (Melee Cost: 1 Action): A desperate, upward thrust with a rusty blade. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 +6 Piercing Wounds.

Pocket Spores (Range Cost: 1 Action): The Elf reaches into their rags and hurls a handful of bioluminescent fungal spores at a target's face. Make a Ranged attack against a target within 10 feet. On a hit, it deals no Wounds, but the target is Blinded for 1 round as the glowing powder burns their eyes.

Scurry (Cost: 1 Action): The Gutter-Blade drops to all fours, moving up to 30 feet. During this movement, they can climb vertical surfaces or hang from ceilings at their full movement speed without needing to make Agility tests.`},
{name:`Deer(Stag): Ghost of the Deep Woods`,size:`Medium`,type:`Beast`,tier:`Minion`,tierColor:`#6b7280`,desc:`The Deer is the ghost of the deep woods. While often viewed as mere prey by the more aggressive inhabitants of the forest, the Deer is a master of evasion and sensory awareness. A mature Stag, with its crown of jagged antlers and powerful, spring-like musculature, can be quite formidable when cornered or during the "rutting" season. They are the first to know when danger enters the grove. Some druidic circles believe the eldest Stags act as vessels for the forest's own spirit, guiding travelers away from danger—or leading the unworthy into the heart of a briar patch.`,agl:`9`,awa:`8`,cha:`4`,int:`1`,phy:`7`,wil:`5`,move:`30`,ap:`3`,def:`6`,wmArmor:`5`,wmBS:`10`,wmDP:`10`,wounds:`20`,focus:`+1/3`,reroll:`1`,luck:`1`,meleeHit:`+2`,meleeDmg:`+15`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1-5`,gear:`None`,meleeDetail:`Hammering Hooves & Antlers`,rangeDetail:`None`,abilities:`Passive Traits
Ghost of the Woods: The Stag leaves almost no tracks. It automatically gains Advantage on all Stealth checks while in a forest environment, and players suffer Disadvantage on any Awareness or Tracking checks trying to locate the herd.

Hyper-Sensory Alarm: The Deer is the first to know when danger approaches. It is completely immune to being ambushed or surprised. If combat breaks out, the Deer automatically wins all Initiative ties.

Spring-Loaded Bound: The Stag ignores all Movement penalties associated with natural difficult terrain (like dense underbrush, mud, or shallow streams). It can leap up to 15 feet over obstacles or gaps without needing a running start.

Action-Based Abilities
Startled Dash (Cost: 1 Action): The Deer's primary survival instinct. It instantly Disengages from melee combat without triggering any free attacks of opportunity and uses its full Movement (50 feet) to sprint away from the nearest threat.

The Desperate Kick (Melee Cost: 2 Actions): If cornered, the Stag rears up and uses its hooves like hammers. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 15 Wounds, permanently shatters the target's equipped physical shield, and the target must pass a severe surpass Physique TN 7 + Resist bonus or suffer 1 Stunned condition from cracked ribs.

Rutting Charge (Cost: 2 Actions): The Stag lowers its crown of jagged antlers and charges. It moves up to 30 feet in a straight line and makes a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 15 Piercing Wounds and violently knocks the target Prone.`},
