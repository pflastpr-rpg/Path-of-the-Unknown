{name:`Displacer Beast: The Phase-Stalker`,size:`Medium`,type:`Monstrosity / Beast`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A predatory masterpiece of illusion. A sleek, six-legged feline with obsidian fur, it is constantly surrounded by a shimmering haze. This isn't magic it casts, but a biological property of its hide that bends light, making the beast appear to be several feet away from its actual position. It stalks its prey from the shadows, using its unnatural geometry and twin spiked tentacles to tear apart its victims before they even know where to swing their swords.`,agl:`9`,awa:`8`,cha:`2`,int:`1`,phy:`6`,wil:`5`,move:`40`,ap:`4`,def:`7`,wmArmor:`10`,wmBS:`15`,wmDP:`10`,wounds:`45`,focus:`+1/3`,reroll:`—`,luck:`—`,meleeHit:`+3`,meleeDmg:`+20`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`4`,mob:`1-2`,gear:`None`,meleeDetail:`Barbed Tentacles & Claws`,rangeDetail:`Special Abilities`,abilities:`Passive Traits
The Displacement Haze: The biological light-bending of its hide is always active. Any Melee or Ranged attack targeting the Displacer Beast automatically suffers Disadvantage. If the beast is inflicted with the Stunned or Unconscious conditions, this passive biological function shuts down until it recovers.

Phantom Afterimage: If an attacker misses a Melee attack against the Displacer Beast (meaning they struck the illusion), the beast can instantly use its Reaction to shift up to 5 feet into an unoccupied space without triggering free attacks of opportunity.

Six-Legged Stability: Its unnatural anatomy grants it perfect balance. It is completely immune to the Prone condition and ignores all Movement penalties associated with natural difficult terrain like thick mud or dense underbrush.

Action-Based Abilities
Spiked Tentacle Whip (Melee Cost: 2 Actions): The beast lashes out with the heavy, barbed tentacles extending from its shoulders. Make a Melee attack (+3 To-Hit). This attack has a 10-foot reach, allowing the beast to strike from behind the safety of its illusion. If successful, it deals 1d10 + 20 Wounds and inflicts 1 Bleeding condition.

Phase-Pounce (Melee Cost: 2 Actions): The beast closes the gap in a terrifying blur. It moves up to 30 feet and makes a Melee attack (+2 To-Hit). On a hit, it deals 2d10 + 20 Wounds, and the target is automatically Grappled by the tentacles, dragged adjacent to the beast's gnashing jaws.

Shimmering Retreat (Cost: 1 Action): Knowing when to reposition, the beast instantly Disengages from melee combat. It moves up to 20 feet away, leaving a static, perfectly realistic illusion of itself in its former space. The next Ranged attack or single-target spell that passes through that space automatically hits the illusion instead of any actual targets, destroying the fake image.`},
{name:`Dwarf: Kel Thurum Militiaman ("Iron Joe")`,size:`Medium`,type:`Humanoid`,tier:`Minion`,tierColor:`#6b7280`,desc:`Not every Dwarf is a runed-plate elite. "Iron Joe" is the backbone of Kel Thurum: the miner, the mason, the brewer, and the smith. Drafted into the local militia when danger threatens the lower gates, they march to war in thick leather aprons, iron caps, and whatever heavy tool they were just using. They lack the flawless tactical discipline of the Royal Guard, but they make up for it with sheer, blue-collar stubbornness, callous-thick skin, and a complete refusal to back down from a fight—especially if they've already had a pint.`,agl:`-1`,awa:`—`,cha:`—`,int:`1`,phy:`5`,wil:`6`,move:`12`,ap:`3`,def:`4`,wmArmor:`10`,wmBS:`5`,wmDP:`10`,wounds:`25`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+2`,meleeDmg:`+5/+10(2H)`,meleeHeal:`—`,rangeHit:`+1`,rangeDmg:`+1`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`3-12`,gear:`Mining Pick, Blacksmith Hammer, Leather Apron, Iron Flask`,meleeDetail:`Heavy Work Tools`,rangeDetail:`Crossbow`,abilities:`Passive Traits
Blue-Collar Vigor: "Iron Joe" is used to 14-hour shifts in the mines. He is completely immune to the Fatigued condition, and cannot be forced to drop his equipped weapon by physical or magical means (his grip is like a vice).

Shield-Brother Rabble: They might not be trained soldiers, but they look out for each other. If a 
"Iron-Joe" Dwarf is standing adjacent to at least one other allied Dwarf, they automatically gain +1 to their Defense and Advantage on Willpower tests against Fear.

Stubborn as Stone: Despite his negative Agility, his low center of gravity makes him remarkably hard to topple. Any physical attack or ability that attempts to knock "Iron Joe" Prone automatically suffers Disadvantage if of equal size or smaller.

Action-Based Abilities
The Knee-Capper (Melee Cost: 2 Actions): A brutal, low-swinging chop with a pickaxe aimed at the shins. Make a Melee attack (+2 To-Hit). If successful, it deals 10 Wounds and the target's Movement is reduced by half on their next turn.

Tavern Haymaker (Cost: 2 Actions): A massive, telegraphed, wild swing. Make a Melee attack (+2 To-Hit). On a hit, it deals 1d10 + 15 Bludgeoning Wounds and violently shoves the target 5 feet backward. If this attack misses, "Iron Joe" loses his balance and stumbles 5 feet forward.

Liquid Courage (Cost: 1 Action): The Dwarf takes a massive swig from his iron hip-flask. He instantly recovers 5 Wounds and gains 1 temporary Focus point, but takes a -1 penalty to his Awareness for the rest of the encounter due to the inebriation.`},
{name:`Earth Elemental (Greater)The Mountain-Heart`,size:`Giant`,type:`Elemental / Construct`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A Greater Earth Elemental is not merely formed from rock; it is bedrock given catastrophic motion. These titans are composed of entire ranges of obsidian, iron, and granite, forged over millennia by intense geothermal pressures. Its face is a blocky mask of smooth stone with deep eye sockets glowing with the orange light of a geothermal core. Where a standard Elemental is merely heavy, the Greater variant is gravity itself. They are fused with large, pulsating emerald geodes—their "Mountain-Heart"—that anchor their sentience and generate a localized gravitational field. In its wake, forests are pushed aside, the ground is pulverized, and loose rocks fall upward.`,agl:`2`,awa:`5`,cha:`4`,int:`7`,phy:`15`,wil:`8`,move:`30`,ap:`3`,def:`9`,wmArmor:`30`,wmBS:`20`,wmDP:`Immune`,wounds:`400`,focus:`—`,reroll:`2`,luck:`—`,meleeHit:`+6`,meleeDmg:`+40`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+20`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1`,gear:`None`,meleeDetail:`Tectonic Fists`,rangeDetail:`Gravitational Debris`,abilities:`Passive Traits
Gravitational Inescapability: The Mountain-Heart alters the gravity around it. The area within 40 feet of the elemental is considered extreme Difficult Terrain as loose rocks and debris float upward. Any flying creatures that enter this aura instantly have their flight speed reduced to 0 and crash to the ground. Furthermore, any enemy trying to move away from the elemental must spend 2 feet of Movement for every 1 foot traveled.

Bedrock Juggernaut: The elemental is completely immune to the Prone, Stunned, and Knockback conditions. It automatically destroys any environmental structures (trees, walls, towers) simply by walking through them, turning them to pulverized dust.

Geothermal Rupture: The intense heat of its core makes it immune to Fire damage. If a player scores a Critical Hit against the elemental with a Melee weapon, they crack the obsidian shell, causing a sudden burst of liquid magma that deals 15 Fire Wounds directly back to the attacker.

Action-Based Abilities
Tectonic Pulverize (Melee Cost: 1 Action): The titan brings a massive, obsidian fist down upon the earth. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 40 Bludgeoning Wounds. If the target is wielding a non-magical weapon or shield, it is instantly shattered by the impact.

Reverse Gravity (Cost: 3 Actions): The Mountain-Heart pulses with blinding emerald light, reversing gravity in a 30-foot cylinder anywhere within 60 feet. Every target in the cylinder must surpass Agility TN 10 + Resist bonus or "fall" 40 feet straight up into the air, hovering helplessly until the end of the elemental's next turn, at which point gravity normalizes and they slam back into the pulverized ground, taking massive falling damage (4d10 + 10) and landing Prone.

Geode Pulse (Range Cost: 1 Action): The elemental fires a concentrated beam of gravitational and geothermal energy from its chest. Make a Ranged attack (+5 To-Hit) against a single target within 60 feet. On a hit, it deals 1d10 + 20 Force/Fire Wounds and violently pulls the target 20 feet directly toward the elemental.`},
{name:`Earth Elemental Lord: The World-Root`,size:`Enormous`,type:`Elemental Lord`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Lord of Earth is a gargantuan entity that resembles a mountain range forged into a sentient, humanoid shape. Its body is composed of ultra-dense "Singularity Granite" and pulsating obsidian, held together by a core of molten gold and raw crystalline power. Its head is a jagged peak of indestructible quartz with eyes like twin suns burning within the deep crust. Where the Air Lord is erratic and swift, the Earth Lord is inevitable. It is the master of Gravitational Law. To stand in its presence is to feel your own bones creak under doubled gravity. It is the absolute authority on stability—it can turn a raging sea to solid salt or a fortress to liquid sand with a single thought.`,agl:`4`,awa:`5`,cha:`7`,int:`8`,phy:`18`,wil:`12`,move:`40`,ap:`3`,def:`9`,wmArmor:`35`,wmBS:`20`,wmDP:`Immune`,wounds:`650`,focus:`+2/6`,reroll:`3`,luck:`2`,meleeHit:`+6`,meleeDmg:`+60`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+30`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`Druid`,fear:`8`,mob:`1`,gear:`Special`,meleeDetail:`Singularity Fists`,rangeDetail:`Gravitational Crush`,abilities:`Passive Traits
Gravitational Law (Doubled Gravity): The World-Root dictates the physics around it. The area within 60 feet of the Lord is subjected to doubled gravity. Any enemy starting their turn in this aura instantly takes 10 Bludgeoning Wounds as their bones creak, and their Movement is permanently halved. Flying within this aura is completely impossible.

Absolute Stability: The Lord cannot be moved, altered, or debuffed against its will. It is completely immune to all forced movement, teleportation, Prone, Stunned, and polymorph/transmutation effects.

Singularity Granite: Weapons that strike the World-Root are subjected to the intense gravitational pull of its hide. If a physical Melee attack fails to deal more than 10 Wounds (after mitigation is applied), the attacker's weapon is instantly caught in the gravitational field, requiring an Action and a severe surpass Physique TN 7 + Resist bonus to rip it free before it can be used again.

Action-Based Abilities
Tectonic Obliteration (Melee Cost: 1 Action): The Lord brings a molten-gold infused fist down upon the battlefield. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 60 Wounds, and the sheer force of the impact triggers a localized earthquake, forcing everyone within 20 feet of the target to surpass Agility TN 12 + Resist bonus or fall Prone.

Transmute to Liquid Sand (Range Cost: 3 Actions): The Lord weaponizes its alchemical authority to swallow its enemies. It targets a 20-foot radius of ground within 60 feet. Make a Ranged attack (+5 To-Hit) against all enemies in the zone. On a hit, the ground turns to liquid sand; targets take 3d10 + 20 Wounds and are instantly Grappled and Restrained, buried up to their chests.

Gravitational Crush (Range Cost: 1 Action): The World-Root simply looks at a target and increases their personal gravity tenfold. Make a Ranged attack (+5 To-Hit) against a single target within 60 feet. If successful, it deals 1d10 + 30 Force/Bludgeoning Wounds, completely ignoring the target's equipped armor mitigation as the damage comes from the target's own collapsing weight.`},
{name:`Earth-Maw`,size:`Titanic`,type:`Beast / Primordial`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A subterranean leviathan that consumes entire fortresses.

"A continent-shifting worm with three concentric rings of grinding teeth. It does not battle heroes; it alters the geography they stand on."`,agl:`4`,awa:`9`,cha:`1`,int:`3`,phy:`21`,wil:`15`,move:`80`,ap:`3`,def:`9`,wmArmor:`12`,wmBS:`15`,wmDP:`24`,wounds:`2000`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+8`,meleeDmg:`+160`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`10`,mob:`1`,gear:`Bedrock Scales (Natural Armor)`,meleeDetail:`Tri-Ring Crush (Treats as 2H)`,rangeDetail:`None`,abilities:`Passive Traits
Geologic Mass: Immune to all knockdown, push, or pull effects. Its sheer size means it takes no extra damage from standard Bleed conditions.

Swallow Whole: Any successful melee hit that rolls an unmodified 10 automatically swallows a Medium or smaller target, inflicting 20 Acid Wounds per turn until the target cuts their way out.

Tremorsense: The Earth-Maw's Awareness of 10 allows it to detect the exact location of anything touching the ground within 500 feet, ignoring invisibility.

Actions
Tectonic Slam (Melee Cost: 2): Slams its body onto the battlefield. All creatures within 100 ft must make an Agility(12) Save or take half of its Melee Wounds (80) and be knocked Prone.

Devour (Melee Cost: 1): Standard Melee attack using the 160 Wound damage profile.

Submerge (Cost: 3): Dives beneath the earth, gaining full cover and healing 3d10 Wounds while preparing to erupt beneath the party on the next turn.`},
{name:`Elder Verdantus`,size:`Giant`,type:`Ancient Treant (Arch-Guardian)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`The Chronicler of Leaves. His bark is etched with the history of the world in ancient runes. He is a living library of the Great Prismatic Event.`,agl:`1`,awa:`8`,cha:`6`,int:`8`,phy:`15`,wil:`10`,move:`5`,ap:`4`,def:`3`,wmArmor:`45`,wmBS:`20`,wmDP:`—`,wounds:`450`,focus:`5`,reroll:`2`,luck:`1`,meleeHit:`+8`,meleeDmg:`3d10+15`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+8`,castDmg:`—`,castHeal:`20`,castType:`Faith`,fear:`10`,mob:`Boss`,gear:`Ancient Runes`,meleeDetail:`Crushing Limbs`,rangeDetail:`None`,abilities:`Passive Traits
Aura of Serenity: Any creature starting its turn within 60ft must pass a Willpower (9) test or lose all hostile intent for 1 turn.

Rooted Wisdom: Verdantus is a permanent part of the forest and is immune to being pushed, tripped, or moved against his will.

Photosynthetic Regrowth: As long as it is daylight or magic light is present, Verdantus regains 10 Wounds at the start of every turn.

Action-Based Abilities
Whispers of the Weald (1 Action): Shares a fragment of ancient lore. The target ally gains a +1 bonus to their next three rolls.

Entangling Roots (TN 8 - 2 Actions): Verdantus commands the earth to rise. Target is Grappled (Def 0) and must pass a surpass Physique TN 7 + Resist bonus to break free.

Seismic Slam (3 Actions): Verdantus strikes the ground. All enemies within 20ft must pass an surpass Agility TN 7 + Resist bonus or fall Prone and take 3d10 Wounds.`},
{name:`Elf: Thalasien Elite Guard`,size:`Medium`,type:`Humanoid`,tier:`Minion`,tierColor:`#6b7280`,desc:`Hailing from the pristine, silver-leafed city of Thalasien, these elite guards are the pinnacle of martial grace. Clad in lightweight, gilded armor that moves like silk, they wield curved glaives and longbows with terrifying, cold precision. They don't block; they deflect. They don't march; they glide. They are stoic and utterly silent on duty, communicating through subtle hand signs. To face a Thalasien Elite Guard is to fight the wind itself—sharp, sudden, and seemingly untouchable.`,agl:`9`,awa:`8`,cha:`1`,int:`5`,phy:`2`,wil:`6`,move:`18`,ap:`3`,def:`7`,wmArmor:`10`,wmBS:`15`,wmDP:`10`,wounds:`30`,focus:`—`,reroll:`2`,luck:`1`,meleeHit:`+3`,meleeDmg:`+15(2H)`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`+12`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1-4`,gear:`Thalasien Curved Glaive, Silverwood Longbow, Gilded Leaf-Armor`,meleeDetail:`Thalasien Glaive.`,rangeDetail:`Silverwood Longbow`,abilities:`Passive Traits
Unearthly Grace: The Elf is a master of their environment. They completely ignore all Movement penalties from Difficult Terrain. Furthermore, any time they are subjected to an surpass Agility TN 7 + Resist bonus to avoid a trap or an area-of-effect spell (like a Fireball), they automatically take 0 Wounds on a success, rather than half.

Perfect Parry: The Elf uses their enemy's momentum against them. If an attacker targets the Elf with a Melee attack and misses their 7 Defense, the Elf can immediately use a Reaction to take a free 5-foot step in any direction without triggering attacks of opportunity.

Fey Trance: Decades of mental discipline make their minds an impenetrable fortress. They are completely immune to magical sleep, and any attempt to inflict the Charmed or Taunted conditions on them automatically fails.

Action-Based Abilities
Flurry of Leaves (Melee Cost: 2 Actions): A blindingly fast combination of strikes. Make a Melee attack (+3 To-Hit). If successful, it deals 1d10 + 15 Slashing Wounds, and the Elf may immediately make a free Ranged attack (+3 To-Hit) with a throwing dagger against a secondary target within 15 feet for 10 Wounds.

Silverwood Volley (Range Cost: 2 Actions): The Elf draws and fires two arrows in the blink of an eye. Make two Ranged attacks (+3 To-Hit) against the same or different targets within 80 feet. Each successful hit deals 1d10 + 12 Piercing Wounds.

Fluid Posture (Cost: 1 Action): The Elf shifts into a purely defensive, evasive kata. Until the start of their next turn, their Defense becomes an 8, and all Ranged attacks made against them suffer Disadvantage as they blur out of the way of projectiles.`},
{name:`Fey Nymph: The Grove-Warden`,size:`Medium`,type:`Fey / Spirit`,tier:`Minion`,tierColor:`#6b7280`,desc:`Hauntingly beautiful spirits bound to sacred pools, ancient glades, or deep forest springs. To look upon a Nymph is to feel a sudden, aching despair mixed with overwhelming devotion. They wear gowns of woven starlight, spun water, or autumn leaves, their forms possessing an unearthly, flawless grace. They are fiercely protective of their domain and view mortal trespassers as crude, destructive beasts. A Nymph does not fight with brute force; she fights with blinding beauty, elemental magic, and treacherous charms that turn a tightly-knit adventuring party against each other in seconds.

Elemental Wrath & Fey Charm`,agl:`7`,awa:`6`,cha:`9`,int:`5`,phy:`1`,wil:`8`,move:`30`,ap:`3`,def:`4`,wmArmor:`—`,wmBS:`30`,wmDP:`Immune`,wounds:`30`,focus:`+1/3`,reroll:`2`,luck:`2`,meleeHit:`—`,meleeDmg:`—`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+4`,castDmg:`+25`,castHeal:`—`,castType:`Druid`,fear:`—`,mob:`—`,gear:`None`,meleeDetail:`None`,rangeDetail:`None`,abilities:`Passive Traits
Unearthly Grace (Sanctuary): The Nymph’s beauty is a weapon. Any enemy that attempts to target the Nymph with an attack or hostile spell must first pass a severe Willpower(8) test. On a failure, they are overcome by her beauty, their attack is completely canceled (wasting the Action), and they cannot target her until the start of their next turn.

One with the Grove: The Nymph can step through a living tree or a pool of water and instantly emerge from another tree or pool within 60 feet without spending an Action (once per turn). She completely ignores all natural Difficult Terrain.

Aura of Awe: The air around the Nymph is thick with fey magic. Any enemy that begins their turn within 30 feet of the Nymph must surpass Charisma TN 9 + Resist bonus or gain Disadvantage on all attacks for the round, their hands shaking with the desire to protect her rather than harm her.

Action-Based Abilities
Blinding Beauty (Cost: 2 Actions): The Nymph drops her magical veil, revealing the true, unfiltered magnitude of her fey nature. All enemies within a 40-foot radius that can see her must pass a severe Willpower(11) test. On a failure, they take 25 Psychic/Radiant Wounds and are permanently Blinded until magically cured, their mortal eyes burned out by her perfection.

Fey-Kissed Devotion(TN8) (Cost: 1 Action): She whispers a command wrapped in enchanting magic. Target one enemy within 60 feet. Make a Casting attack (+4 To-Hit). If successful, the target is Charmed. On their next turn, the Charmed target MUST use their Actions to move toward and attack their closest ally, shouting about how they must protect the Grove-Warden. A Willpower(12) test is allowed to resist the spell effects.

Grasping Roots (Cost: 1 Action): The Nymph commands the earth to defend her. Target up to two enemies within 40 feet. They must surpass Agility TN 8 + Resist bonus or take 15 Bludgeoning Wounds and become Restrained as thick, thorny vines erupt from the soil to pin them in place.`},
{name:`Fimir: The Bog-Grunt`,size:`Medium`,type:`Humanoid / Monstrosity`,tier:`Minion`,tierColor:`#6b7280`,desc:`The younger, less magically developed kin of the Fen-Ghuls. They are still massive, hunchbacked brutes with saurian tails, but they lack the deep, primal connection to The Mists. Unable to conjure thick fog banks themselves, they instead lurk in naturally occurring swamp miasma or follow in the wake of a Fen-Ghul's conjured storms. Armed with crude driftwood clubs and their own heavy tails, they are simple-minded, aggressive shock-troops. Their jaundiced skin constantly weeps a slippery, toxic bile, making them incredibly difficult to pin down in a melee brawl.`,agl:`—`,awa:`1`,cha:`-1`,int:`—`,phy:`6`,wil:`4`,move:`15`,ap:`3`,def:`5`,wmArmor:`8`,wmBS:`5`,wmDP:`Immune`,wounds:`24`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+2`,meleeDmg:`+6/+12(2H)`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`1`,mob:`2-10`,gear:`Heavy Driftwood Club`,meleeDetail:`Driftwood Club & Tail`,rangeDetail:`None`,abilities:`Passive Traits
Slippery Bile: The constant excretion of toxic slime makes them nearly impossible to hold. The Bog-Grunt is completely immune to the Grappled and Restrained conditions from physical sources (like nets or wrestling). Any player who attempts an unarmed strike against the Grunt takes 2 Poison Wounds from the skin contact.

Swamp-Tread: They are perfectly adapted to their miserable homes. They completely ignore Movement penalties from mud, deep water, and swamp-based Difficult Terrain.

Mist-Parasite: While they cannot conjure the magical fog, they thrive in it. If a Bog-Grunt is standing within the Conjured Fog Bank of an allied Fen-Ghul (or natural heavy fog), they automatically gain Advantage on Willpower tests to resist Fear or Intimidation, emboldened by the concealment.

Action-Based Abilities
Crude Bash (Melee Cost: 2 Actions): A heavy, overhead swing with a driftwood club or a sweeping tail strike. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 12 Bludgeoning Wounds.

Yellow Phlegm (Range Cost: 1 Action): The Grunt snorts and spits a concentrated glob of bile. Make a Ranged attack against a target within 15 feet. On a hit, it deals 5 Poison Wounds and the target must surpass Physique TN 5 + Resist bonus or gain the Blinded condition for 1 round as the slime burns their eyes.

Lumbering Charge (Cost: 2 Actions): The Grunt lowers its head and barrels forward. It moves up to 20 feet in a straight line and immediately makes a Melee attack (+2 To-Hit). If this attack hits, it deals 1d10 + 15 Bludgeoning Wounds and the target is knocked Prone.`},
{name:`Fire Elemental Lord: Sol-Invictus`,size:`Enormous`,type:`Elemental Lord`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A gargantuan entity composed of "White-Hot Singularity Plasma" and swirling, dark magma pressurized into solid armor. Its core is a hyper-concentrated diamond-blue geode, pulsing with celestial-level heat. Its face is a blocky mask of smooth, dark stone with intense eyes glowing with fierce blue light. It moves with a terrifying, rhythmic thud—a slow but unstoppable stride that melts the ground into vitrified glass. Voluminous, blazing flame-whips of orange, red, and blue fire lash from its massive hands, while dense plumes of black and gray smoke erupt from its fissures. Its presence is a walking supernova that consumes the very atmosphere. Sol-Invictus does not just attack; it initiates a Total Thermal Event to vaporize all opposition and unmake local geography.`,agl:`4`,awa:`7`,cha:`8`,int:`5`,phy:`18`,wil:`12`,move:`80`,ap:`3`,def:`9`,wmArmor:`30`,wmBS:`25`,wmDP:`Immune`,wounds:`550`,focus:`+2/6`,reroll:`3`,luck:`2`,meleeHit:`+6`,meleeDmg:`+60`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+50`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`10`,mob:`1`,gear:`Random`,meleeDetail:`Celestial Flame-Whips`,rangeDetail:`Total Thermal Event`,abilities:`Passive Traits
Atmospheric Consumption: Sol-Invictus breathes the very oxygen out of the air. Any enemy starting their turn within 60 feet of the Lord must pass a severe Physique(10) test. On a failure, they suffer 15 Asphyxiation Wounds and are Silenced (unable to speak or cast verbal spells) as the air is ripped from their lungs to feed the supernova.

Vitrified Wake: Every step it takes melts the ground. The entire battlefield within 60 feet is permanently turned into cracked lava glass, treating it as extreme Difficult Terrain. Any non-flying character that moves more than 10 feet on their turn takes 10 Fire/Slashing Wounds from the jagged, superheated glass.

Pressurized Magma Armor: Standard weapons simply melt against its solid magma plating. Any physical Melee attack that fails to beat its 9 Defense or fails to overcome its 30 Armor Mitigation causes the attacker's weapon to instantly lose 1 tier of effectiveness (or shatter if non-magical) due to the intense, diamond-blue thermal heat.

Action-Based Abilities
Celestial Flame-Whip (Melee Cost: 2 Actions): The Lord lashes out with voluminous extensions of orange, red, and blue fire. Make a Melee attack (+6 To-Hit) with a massive 30-foot reach. If successful, it deals 1d10 + 60 Fire Wounds. The target is instantly pulled 15 feet closer to the Lord and gains 2 Burning conditions(2d10 wounds).

Total Thermal Event (Range Cost: 3 Actions): Sol-Invictus opens its blocky stone mask, unleashing the hyper-concentrated power of its blue geode core. Make a Ranged attack (+5 To-Hit) against a massive 80-foot cone. On a hit, targets take 4d10 + 50 Fire/Radiant Wounds. The blast completely vaporizes all non-magical cover, water sources, and environmental structures in its path.

Maelstrom of Smoke (Cost: 1 Action): The Lord forcibly vents the dense black and gray smoke from its fissures. A 40-foot radius around the Lord becomes heavily obscured (Total Concealment). All enemies caught in the smoke are instantly Blinded until they can move out of the cloud, making them easy prey for the Flame-Whips.`},
{name:`Fire Elemental: The Ember-Sprite`,size:`Medium`,type:`Elemental`,tier:`Minion`,tierColor:`#6b7280`,desc:`A flickering, waist-high manifestation of living heat. It doesn't have a solid form, appearing instead as a dancing core of white-hot plasma surrounded by a shifting body of orange and red flames. It moves with a frantic, crackling energy, leaving scorched footprints and a trail of black soot wherever it glides. Unlike other elementals, the Ember-Sprite is hyper-aggressive; it views everything organic as fuel. It emits a constant sound like a roaring hearth, and the air around it shimmers with a heat haze that makes its exact movements difficult to track.`,agl:`6`,awa:`1`,cha:`-1`,int:`—`,phy:`—`,wil:`4`,move:`18`,ap:`3`,def:`5`,wmArmor:`—`,wmBS:`5`,wmDP:`Immune`,wounds:`18`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+1`,meleeDmg:`+10`,meleeHeal:`—`,rangeHit:`+1`,rangeDmg:`+12`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1-10`,gear:`None`,meleeDetail:`Scorching Touch`,rangeDetail:`Spitting a glob of plasma up to 50Ft`,abilities:`Passive Traits
Heat Mirage: The shimmering air around the sprite warps light and trajectory. All non-magical Ranged attacks made against the Ember-Sprite automatically suffer Disadvantage.

Insubstantial Plasma: Because its Physical stat is exactly 0, normal weapons pass right through its flames. Any physical Melee or Ranged attack that successfully hits the sprite automatically has its Wounds halved. However, any Cold or Water-based attacks deal double Wounds to it.

Organic Fuel-Hunger: The sprite becomes exponentially more dangerous when it finds tinder. Any time the Ember-Sprite successfully deals Wounds to a target that is primarily organic (flesh, leather armor, wood, or plant-matter), the target automatically gains 1 Burning condition.

Action-Based Abilities
Scorching Touch (Melee Cost: 1 Action): The sprite lashes out to consume its prey. Make a Melee attack (+1 To-Hit). If successful, it deals 1d10 + 10 Fire Wounds.

Frantic Flicker (Cost: 1 Action): The sprite instantly darts up to 20 feet without triggering attacks of opportunity. It leaves a trail of white-hot embers in every square it passes through. Any enemy stepping into these squares takes 5 Fire Wounds.

Feed the Hearth (Cost: 2 Actions): The sprite latches onto a target to rapidly consume their organic gear. Make a Melee attack (+1 To-Hit). If successful, it deals 15 Fire Wounds and the sprite instantly heals 5 Wounds as it absorbs the heat of the burning material.`},
{name:`Fire Giant: The Forge-Father`,size:`Giant`,type:`Giant / Elemental`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A massive humanoid standing 18 to 20 feet tall, with skin the color of cooled basalt and hair that glows like smoldering embers. Their bodies are built like heavy-duty anvils—broad, dense, and seemingly immovable. They are almost never seen without their "Singe-Plate" armor, massive slabs of black iron bolted directly into their flesh or held by thick, heat-resistant chains. They live in the hearts of volcanoes, crafting weapons for gods and titans. In battle, they move with a heavy, rhythmic deliberation. They don't rush; they advance like a wall of lava, wielding weapons so hot they can slice through stone walls as if they were warm wax.`,agl:`2`,awa:`8`,cha:`5`,int:`7`,phy:`15`,wil:`8`,move:`40`,ap:`3`,def:`9`,wmArmor:`30`,wmBS:`20`,wmDP:`Immune`,wounds:`420`,focus:`+2/6`,reroll:`2`,luck:`1`,meleeHit:`+6`,meleeDmg:`+40/+70`,meleeHeal:`—`,rangeHit:`+4`,rangeDmg:`+60`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`6`,mob:`1-2`,gear:`Singe-Plate Armor, Magma-Forged Greatsword or Cinder-Maul`,meleeDetail:`Magma-Forged Weapon`,rangeDetail:`Hurling chunks of molten slag`,abilities:`Passive Traits
Singe-Plate Integration: The giant's armor is bolted into its flesh, making it impossible to disarm or sunder. Any melee attacker who successfully hits the Fire Giant with a non-reach weapon takes 10 Fire Wounds instantly from the radiating heat of the black iron plates.

Master Smith's Edge: The Forge-Father's weapons cut through stone like warm wax. All of the Fire Giant's Melee attacks completely ignore the first 5 points of a target's Armor Mitigation and deal double Wounds to environmental cover, shields, and structures.

Wall of Lava: The giant is built like a heavy-duty anvil. It is completely immune to the Knockback, Prone, and Grappled conditions from any creature smaller than Giant size, and it ignores all Difficult Terrain caused by rubble, fire, or magma.

Action-Based Abilities
Cinder-Maul Strike (Melee Cost: 1 Action): A brutal, calculated overhead swing. Make a Melee attack (+6 To-Hit) with a 15-foot reach. If successful, it deals 1d10 + 40 Bludgeoning/Fire Wounds, and the target's armor (if non-magical) loses 10 Wound Mitigation for the rest of the encounter as it melts and buckles.

Slag Cleave (Melee Cost: 3 Actions): The Giant sweeps its Magma-Forged Greatsword in a massive horizontal arc. Make a Melee attack (+6 To-Hit) against up to three adjacent targets within its reach. On a hit, it deals 1d10 + 70 Slashing/Fire Wounds and applies 2 Burning conditions to each struck target.

Eruption Stomp (Cost: 1 Action): The Giant brings its massive, iron-shod boot down with the force of a tectonic shift. All enemies within 30 feet must surpass Agility TN 12 + Resist bonus or be knocked Prone and take 20 Bludgeoning Wounds from the resulting localized earthquake.`},
{name:`Flesh Golem: The Galvanized Horror`,size:`Large`,type:`Construct`,tier:`Elite`,tierColor:`#b45309`,desc:`A grotesque masterpiece of mismatched anatomy, the Flesh Golem is a mountain of stitched-together muscle and bone. Standing eight feet tall and nearly four feet wide, its skin is a patchwork of pale, grey, and sallow tones held together by thick black surgical thread and rusted iron rivets. Copper rods protrude from its neck and spine, acting as conductors for the lightning that serves as its soul. It smells of formaldehyde and ozone, its every movement accompanied by the audible groaning of over-strained muscle. It is not raised; it is assembled and galvanized.`,agl:`5`,awa:`7`,cha:`1`,int:`2`,phy:`9`,wil:`8`,move:`21`,ap:`3`,def:`6`,wmArmor:`10`,wmBS:`15`,wmDP:`Immune`,wounds:`100`,focus:`—`,reroll:`1`,luck:`—`,meleeHit:`+4`,meleeDmg:`+30`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`6`,mob:`1-2`,gear:`None`,meleeDetail:`Hammer-like Fists`,rangeDetail:`None`,abilities:`Passive Traits
Galvanized Absorption: Lightning is its lifeblood. The Flesh Golem is completely immune to Lightning damage. Whenever it is hit by a Lightning attack, it instead heals 15 Wounds and instantly gains +1 Action on its next turn as the copper rods surge with energy.

Formaldehyde Stench: The golem is saturated in preserving chemicals. Any living creature that starts its turn adjacent to the Golem must surpass Physique TN 8 + Resist bonus or gain the Nauseated condition (Disadvantage on all rolls) for 1 round.

Berserk Fracture: If the Golem takes Fire damage or its Wounds drops below 30%, the binding energy becomes unstable. The Golem must surpass Willpower TN 11 + Resist bonus or enter a Berserk state, attacking the nearest living creature with Advantage on all Melee attacks but losing its ability to distinguish friend from foe.

Action-Based Abilities
Overstrained Slam (Melee Cost: 1 Action): The Golem brings its massive, stitched fists down with a sickening groan of muscle. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 30 Bludgeoning Wounds and the target must pass a severe surpass Physique TN 7 + Resist bonus or be knocked Prone.

Copper-Rod Discharge (Cost: 2 Actions): The Golem vents excess electrical energy through its rivets. All enemies within a 10-foot radius must make an Agility(9) test. On a failure, they take 20 Lightning Wounds and are Stunned (Movement reduced to 0 and cannot take Reactions) until the start of their next turn.

Stitched Grip & Crush (Melee Cost: 1 Action): The Golem grabs a target with its trunk-like arms. Make a Melee attack (+4 To-Hit). On a hit, the target is Grappled and Restrained. The Golem can use its next Action to deal an automatic 30 Bludgeoning Wounds to the grabbed target as it crushes their ribs.`},
{name:`Gelatinous Cube: The Dungeon Janitor`,size:`Large`,type:`Ooze / Aberration`,tier:`Elite`,tierColor:`#b45309`,desc:`A 10-foot cube of shimmering, translucent protoplasm. These are mindless organisms that drift silently through dungeon corridors, "cleaning" the floors of organic matter, bones, and discarded gear. Nearly invisible in low light, the only way to spot one is often to notice the floating "leftovers" of its previous meals—swords, coins, and skulls—suspended mid-air within its body. It does not hunt; it simply sweeps, absorbing anything foolish enough to stand in its path.`,agl:`5`,awa:`6`,cha:`2`,int:`1`,phy:`9`,wil:`8`,move:`6`,ap:`3`,def:`7`,wmArmor:`25`,wmBS:`10`,wmDP:`Immune`,wounds:`90`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+3`,meleeDmg:`+20`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1`,gear:`Random Undigested Loot (1d6 Gold Coins, a rusty dagger, a dwarven skull).`,meleeDetail:`Acidic Pseudopod`,rangeDetail:`None`,abilities:`Passive Traits
Transparent Ambusher: The Cube is nearly invisible in dim light or darkness. If the Cube has not yet moved or attacked this round, any player entering its line of sight must pass a severe surpass Awareness TN 7 + Resist bonus. On a failure, the player doesn't see the Cube until they physically walk directly into it, automatically suffering the effects of the Engulf ability.

Amorphous Hallway-Blocker: The Cube perfectly fills a standard 10x10 dungeon corridor. It is completely immune to the Prone, Knockback, Flanked, and Bleeding conditions. You cannot move past it or through it without being digested.

Anesthetic Slime: The outer layer of the Cube is coated in a paralyzing numbing agent. Any target that takes Melee damage from the Cube must surpass Physique TN 8 + Resist bonus or have their Movement reduced to 0 on their next turn as their muscles seize.

Action-Based Abilities
Pseudopod Lash (Melee Cost: 1 Action): The Cube extrudes a wobbly tentacle of acid. Make a Melee attack (+3 To-Hit) against an adjacent target. If successful, it deals 1d10 + 20 Acid/Bludgeoning Wounds.

Engulf (Cost: 2 Actions): The Cube simply flows forward to occupy an enemy's space. Target one adjacent creature. That creature must make an Agility(9) test. On a failure, they are pulled inside the Cube. An engulfed target is Grappled, Restrained, and Silenced (cannot breathe or cast verbal spells). At the start of the Cube's turn, any engulfed targets automatically take 20 Acid Wounds.

Digestive Pulse (Cost: 1 Action): The Cube churns its internal acids. It deals an immediate 15 Acid Wounds to any targets currently Engulfed within it.`},
{name:`Ghost: The Restless Spirit`,size:`Medium`,type:`Undead / Incorporeal`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A translucent, glowing apparition bound to the mortal plane by unfinished business, sudden trauma, or a terrible curse. They appear as shifting, faded echoes of who they were in life, often bearing the gruesome phantom wounds of their demise. They do not walk; they drift silently, bringing an unnatural, bone-deep chill wherever they roam. A Ghost doesn't care about your heavy plate armor or your physical strength—it bypasses the flesh entirely to strike directly at the soul.`,agl:`7`,awa:`6`,cha:`2`,int:`5`,phy:`1`,wil:`9`,move:`15`,ap:`3`,def:`8`,wmArmor:`—`,wmBS:`20`,wmDP:`Immune`,wounds:`35`,focus:`+1/3`,reroll:`1`,luck:`—`,meleeHit:`+4`,meleeDmg:`+15`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`+10`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`7`,mob:`1-4`,gear:`None`,meleeDetail:`Spectral Touch`,rangeDetail:`Special Abilities`,abilities:`Passive Traits
Incorporeal Form: The Ghost can pass freely through solid objects, walls, and other creatures. It is completely immune to the Grappled, Prone, and Restrained conditions. Furthermore, any non-magical physical attack that successfully hits the Ghost automatically has its total Wounds reduced to 0 (the weapon simply passes through the mist).

Life-Sense: The Ghost does not see with eyes. It tracks the soul. It can perfectly detect living creatures through walls and solid cover up to 60 feet away, and it ignores all visual penalties from magical darkness or smoke.

Unnatural Chill: The ambient temperature plummets in the Ghost's presence. Any living creature that starts its turn within 15 feet of the Ghost loses 1 Focus point and has its Movement reduced by 5 feet as the supernatural frost seeps into their joints.

Action-Based Abilities
Grave Touch (Melee Cost: 1 Action): The Ghost reaches its translucent hand directly into a target's chest. Make a Melee attack (+4 To-Hit). If successful, it deals 15 Cold/Necrotic Wounds. Because this attack targets the soul, it completely ignores the target's Armor Mitigation.

Poltergeist Throw (Range Cost: 1 Action): The Ghost weaponizes its Willpower to violently hurl a loose object (a chair, a rock, a loose weapon). Make a Ranged attack (+3 To-Hit) against a target within 30 feet. On a hit, it deals 1d10 + 10 Bludgeoning or Piercing Wounds, depending on the object.

Horrifying Visage (Cost: 2 Actions): The Ghost drops its mundane appearance to reveal the gruesome, terrifying reality of its death. All living enemies within 30 feet that can see the Ghost must pass a severe Willpower(10) test. On a failure, they take 15 Psychic Wounds and gain the Shaken condition, forcing them to move away from the Ghost on their next turn.`},
{name:`Giant Ape: The Silverback Titan`,size:`Giant`,type:`Beast / Primordial`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Deep within the uncharted, primordial jungles rules the Silverback Titan. Standing over twenty feet tall when fully upright, this ancient apex predator is fiercely territorial and highly intelligent. Its body is corded with impossibly dense muscle and covered in coarse, iron-grey hair thick enough to turn away arrows. It does not hunt for sport; it hunts to eliminate threats to its domain. The Titan fights with brutal, sweeping strikes that shatter trees and crush armor, using the jungle itself as a weapon by ripping up boulders and trunks to hurl at distant interlopers.`,agl:`6`,awa:`4`,cha:`2`,int:`7`,phy:`15`,wil:`8`,move:`40/30C`,ap:`3`,def:`9`,wmArmor:`20`,wmBS:`20`,wmDP:`20`,wounds:`380`,focus:`+1/3`,reroll:`2`,luck:`—`,meleeHit:`+5`,meleeDmg:`+40`,meleeHeal:`—`,rangeHit:`+4`,rangeDmg:`+20`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`6`,mob:`1`,gear:`None`,meleeDetail:`Colossal Fists`,rangeDetail:`Hurled Jungle Debris`,abilities:`Passive Traits
Iron-Grey Pelage: The Titan's thick fur acts as natural armor against projectiles. All non-magical Ranged attacks (arrows, bolts, throwing axes) automatically suffer Disadvantage to wound.

Jungle Arsenal: The Titan can weaponize its environment. It can uproot trees or tear chunks of bedrock from the earth without spending an Action. Furthermore, its Ranged attacks deal "Siege Damage," inflicting double Wounds to environmental structures, walls, or vehicles.

Apex Unstoppable: Due to its immense size and strength, the Silverback Titan is completely immune to the Prone, Grappled, and Restrained conditions from any creature smaller than Giant size. It also completely ignores all Movement penalties from jungle or forest Difficult Terrain.

Action-Based Abilities
Tree-Shattering Slam (Melee Cost: 2 Actions): The Titan brings two massive fists crashing down. Make a Melee attack (+5 To-Hit). If successful, it deals 2d10 + 60 Bludgeoning Wounds, and the target must surpass Physique TN 12 + Resist bonus or be violently knocked 20 feet backward and rendered Prone.

Colossal Hurl (Range Cost: 2 Actions): The Ape rips a massive boulder or tree trunk from the ground and hurls it across the battlefield. Make a Ranged attack (+5 To-Hit) targeting a 15-foot radius area up to 80 feet away. On a hit, all enemies in the zone take 3d10 + 20 Bludgeoning Wounds and are pinned under the debris (Movement reduced to 0 until they use an Action to free themselves).

Territorial Chest-Beat (Cost: 1 Action): The Titan rises to its full 20-foot height, unleashing a deafening, primordial roar while beating its chest. All enemies within 60 feet must surpass Willpower TN 10 + Resist bonus or become Shaken and Deafened for 1 round, suffering a -2 penalty to their Defense due to the sheer terror of the display.`},
{name:`Giant Spider: The Grave-Weaver`,size:`Large`,type:`Beast / Monstrosity`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A carriage-sized nightmare of chittering mandibles and bristling, barbed hairs. The Giant Spider dwells in lightless caverns and ancient, overgrown forests, spinning webs strong enough to ensnare a galloping horse. Its eight multifaceted eyes gleam with a cold, predatory intelligence, and venom constantly drips from its jagged, iron-hard fangs. It brings the creeping, visceral horror of the unseen ambush to the battlefield, turning the environment itself into a lethal, sticky snare.`,agl:`9`,awa:`8`,cha:`1`,int:`5`,phy:`7`,wil:`2`,move:`24`,ap:`3`,def:`6`,wmArmor:`10`,wmBS:`9`,wmDP:`30`,wounds:`65`,focus:`—`,reroll:`1`,luck:`—`,meleeHit:`+4`,meleeDmg:`+21`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`5`,mob:`1-2`,gear:`Random`,meleeDetail:`Iron-Hard Fangs`,rangeDetail:`Special Abilities`,abilities:`Passive Traits
Web-Sense & Master Climber: The Grave-Weaver ignores all Movement penalties for climbing, allowing it to rest perfectly upside down on ceilings. Furthermore, while in contact with its web, it knows the exact, pinpoint location of any other creature touching the web, completely ignoring magical invisibility or darkness.

Barbed Carapace: The spider is covered in jagged, irritating hairs. Any creature that successfully strikes the spider with an unarmed Melee attack, or attempts to Grapple it, automatically takes 5 Piercing/Poison Wounds and must pass a surpass Physique TN 7 + Resist bonus or become Blinded for 1 round by the loose hairs.

Ambush Predator: If the Grave-Weaver attacks a target that has the Restrained, Prone, or Surprised condition, the spider's Melee attacks automatically deal Maximum Wounds (no rolling for damage) as it accurately strikes the vital organs.

Action-Based Abilities
Iron-Fang Lunge (Melee Cost: 1 Action): The spider sinks its dripping mandibles into its prey. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 21 Piercing/Poison Wounds. The target must pass a Physique((8) test or gain the Paralyzed condition for 1 round as the venom locks their muscles.

Ensnaring Grave-Silk (Range Cost: 2 Actions): The spider rears back and sprays a thick, sticky net of silk. Make a Ranged attack (+3 To-Hit) against a target up to 40 feet away. On a hit, the target takes no Wounds but is instantly Restrained and anchored to the floor (Movement becomes 0). The target must use an Action and surpass Physical TN 9 + Resist bonus on their turn to tear the web apart.

Hoist the Kill (Cost: 1 Action): The spider grabs a Paralyzed or Restrained target and effortlessly drags them. The spider moves up to its full 24 Movement speed (including straight up a wall or tree), carrying the target into its space to separate them from their allies.`},
{name:`Goblin Shaman: The Cave-Whisperer`,size:`Small`,type:`Humanoid / Spellcaster`,tier:`Minion`,tierColor:`#6b7280`,desc:`The Cave Goblin Shaman is the dark, pulsating heart of the subterranean swarm. While standard goblins are driven by hunger and malice, the Shaman is guided by the whispers of ancient, restless cave spirits. Physically weak and frail, they rely entirely on their terrifying mental fortitude and deep connection to the metaphysical realm to dominate their tribe. Draped in bone charms that act as magical focal points, the air around them permanently smells of copper and ozone. When threatened, they vanish into a cloud of toxic green mist, reappearing across the cavern only to summon blood-drenched totems that drive their lesser kin into a frenzied, unkillable state.`,agl:`2`,awa:`4`,cha:`-1`,int:`5`,phy:`—`,wil:`6`,move:`18`,ap:`3`,def:`5`,wmArmor:`3`,wmBS:`12`,wmDP:`Immune`,wounds:`20`,focus:`+1/3`,reroll:`2`,luck:`1`,meleeHit:`+1`,meleeDmg:`+6`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+4`,castDmg:`+18`,castHeal:`+9`,castType:`Shaman`,fear:`—`,mob:`1-2`,gear:`Ancestral Bone Charms, Ritual Dagger`,meleeDetail:`Bone Staff (2H) `,rangeDetail:`Spiritual Venom`,abilities:`Passive Traits
Ozone Aura: The air around the Shaman crackles with volatile magic. Any enemy that successfully strikes the Shaman with a Melee attack automatically takes 5 Lightning Wounds from the static backlash.

Heart of the Swarm: As long as the Shaman is conscious and on the battlefield, all allied Goblins within 60 feet are completely immune to the Shaken and Charmed conditions.

Frail but Guarded: The Shaman uses its metaphysical connection to protect its fragile body. The Shaman may use its Willpower stat (6) in place of its Physical stat (0) when making tests to resist being knocked Prone, Grappled, or Poisoned.

Action-Based Abilities
Spiritual Venom(TN6) (Casting Cost: 1 Action): The Shaman channels the malice of the cave spirits into a concentrated bolt of green energy. Make a Casting attack (+4 To-Hit) against a target within 40 feet. On a hit, it deals 1d10 + 185 Necrotic/Poison Wounds, and the target must surpass Willpower TN 9 + Resist bonus or gain 1 Poisoned condition as the venom attacks their soul.

Blood-Drenched Totem(TN10)(Casting Cost: 2 Actions): The Shaman hurls a cluster of bone charms that embed into the ground, creating a Blood-Totem with 10 Wounds. While the Totem is active, any allied Goblin within 30 feet of it gains the Frenzied condition (Advantage on all Melee attacks) and cannot be reduced below 1 Wounds. The players must physically destroy the Totem to break the unkillable state.

Toxic Mist Step (Cost: 1 Action): When threatened, the Shaman vanishes. The Shaman instantly teleports up to 30 feet to an unoccupied space it can see. The space the Shaman left behind is filled with a 10-foot cloud of toxic green mist for 1 round; any enemy entering or starting their turn in the mist takes 10 Poison Wounds.`},
{name:`Gold Dragon: The Aureate Sovereign`,size:`Titanic`,type:`Dragon / Celestial`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A majestic, serpentine titan covered in scales of actual organic metal, harder than any forged steel. Their heads are feline and regal, featuring long, flowing whiskers that crackle with static energy and a mane of metallic hair. They act as the "Final Arbiters" of the world. Famous for walking among mortals, they often spend centuries as humble scholars or advisors before revealing their gargantuan, radiant nature to enforce cosmic balance. If a war threatens to unbalance reality, an Aureate Sovereign descends to impose a magical treaty—or incinerate both sides.`,agl:`3`,awa:`6`,cha:`7`,int:`15`,phy:`21`,wil:`8`,move:`40/120F`,ap:`4`,def:`9`,wmArmor:`45`,wmBS:`35`,wmDP:`Immune`,wounds:`800`,focus:`+4/12`,reroll:`3`,luck:`2`,meleeHit:`+7`,meleeDmg:`+70`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+50`,rangeHeal:`—`,castHit:`+5`,castDmg:`+40`,castHeal:`—`,castType:`Wizardry`,fear:`11`,mob:`1`,gear:`The accumulated knowledge and artifacts of a dozen fallen empires`,meleeDetail:`Feline Jaws & Golden Talons`,rangeDetail:`Sovereign's Incineration`,abilities:`Passive Traits
Mortal Guise: The Sovereign can shapeshift into a medium-sized humanoid (usually a humble scholar or aged advisor) at will. While in this form, it retains its 15 Intelligence and 8 Willpower, but its Physical and Defense stats drop to mortal levels. It can revert to its Titanic true form as a free Reaction, instantly shattering the guise in a blinding flash of golden light.

Aura of the Arbiter: The dragon's presence enforces cosmic law. The area within 120 feet of the Sovereign is an absolute Zone of Truth; no creature can knowingly speak a lie. Furthermore, any enemy attempting to cast a hostile spell within this aura must surpass Willpower TN 10 + Resist bonus, or the spell instantly fizzles and their Action is wasted.

Organic Metal Carapace: The dragon's scales are harder than forged steel. The Sovereign is completely immune to all non-magical Slashing and Piercing damage. Any mundane weapon that strikes the dragon shatters on impact.

Action-Based Abilities
Sovereign’s Strike (Cost: 1 Actions): The dragon sweeps its massive golden claws or snaps its feline jaws. Make a Melee attack (+7 To-Hit) with a 40-foot reach. If successful, it deals 1d10 + 70 Slashing/Piercing Wounds, and the target is knocked Prone and Restrained beneath the titan's claws.

Static Whisker Lash (Cost: 3 Actions): The dragon whips its crackling, energy-infused whiskers across the battlefield. Target up to three enemies within 150 feet. They must pass a severe Agility(12) test or take 1d10 + 50 Lightning Wounds and become Stunned (lose their next Action) from the electrical shock to their nervous system.

Incinerate the Imbalance (Range Cost: 4 Actions): The Sovereign opens its maw and unleashes a localized sun. Make a Ranged attack (+5 To-Hit) against a massive 90-foot cone. On a hit, all targets take 6d10 + 50 Radiant/Fire Wounds. This breath weapon instantly disintegrates any environmental cover, magical barriers, or structures, leaving behind only smooth, glowing glass.`},
{name:`Grand Arcanist of the Third Order`,size:`Medium`,type:`Humanoid / Spellcaster (Hero)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A legendary spell-weaver who has synchronized their mind across three different planes of magic. Clad in the intricate, floating vestments of the Third Order, their eyes hum with raw, contained cosmic energy. They carry no blades or armor, viewing physical combat as a crude relic of lesser minds. A Grand Arcanist does not merely cast spells; they unravel and rewrite the physics of the battlefield. When they unleash their power, the air screams, and their spells hit with the apocalyptic kinetic force of a siege engine without them ever lifting a physical weapon.`,agl:`2`,awa:`7`,cha:`6`,int:`9`,phy:`1`,wil:`8`,move:`30`,ap:`4`,def:`5`,wmArmor:`5`,wmBS:`25`,wmDP:`10`,wounds:`45`,focus:`+5/15`,reroll:`3`,luck:`4`,meleeHit:`+3`,meleeDmg:`+10`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+4`,castDmg:`+35`,castHeal:`—`,castType:`Wizardry`,fear:`—`,mob:`1`,gear:`estments of the Third Order, Tri-Planar Focus Amulet`,meleeDetail:`Staff Strike`,rangeDetail:`Siege-Force Spells`,abilities:`Passive Traits
Siege-Weaver: The Arcanist's spells carry terrifying kinetic mass. All Casting attacks made by the Arcanist deal double Wounds to environmental cover, non-magical shields, and physical structures, shattering them into shrapnel.

Planar Synchronization: The Arcanist exists slightly out of phase with physical reality. Any non-magical Ranged attack (like arrows or bolts) has a flat 50% chance to pass harmlessly through them. Furthermore, they are completely immune to the Silenced condition, able to cast spells purely through thought.

Archmage’s Rebuttal: The Arcanist casually dismantles rival magic. If targeted by a hostile spell, the Arcanist can use a free Reaction to make a Willpower(15) test. On a success, the hostile spell is instantly countered (negated), and the Arcanist absorbs the dissipated mana, granting them +1 Action on their next turn.

Action-Based Abilities
Tri-Planar Lance(TN7) (Casting Cost: 1 Action): The Arcanist fires a concentrated beam of solid kinetic magic. Make a Casting attack (+4 To-Hit) against a target within 80 feet. If successful, it deals 1d10 + 35 Force Wounds. The target must pass a severe Physique(8) test or be violently knocked 20 feet backward and rendered Prone.

Arcane Singularity(TN10) (Casting Cost: 2 Actions): The Arcanist collapses the gravity in a specific zone. Target a 20-foot radius area up to 100 feet away. Make a Casting attack (+4 To-Hit). On a hit, all targets inside take 3d10 + 35 Force Wounds. Any enemy within 15 feet of the outside edge of the zone must surpass Agility TN 6 + Resist bonus or be violently dragged into the center of the singularity.

Dimensional Fold(TN6) (Casting Cost: 1 Action): Rather than walking, the Arcanist folds space. They instantly teleport up to 60 feet to an unoccupied space they can see. The space they left behind detonates with a localized vacuum; any enemy adjacent to their starting position takes 10 Force Wounds and is Deafened for 1 round.`},
{name:`Greater Daemon: The Herald of Ruin`,size:`Enormous`,type:`Fiend / Daemonic`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Standing over 30 feet tall, the Herald of Ruin is a towering nightmare of jagged obsidian horns, rippling crimson muscle, and tattered, leathery wings that blot out the sun. It wields an Abyssal Greatblade forged from the agonizing souls of the damned, and hellfire constantly bleeds from its eyes and maw. It does not merely destroy cities; it corrupts the very geometry of the world around it. The sky boils into a bruised, toxic purple in its presence, and the earth turns to scorched glass beneath its hooves. To face the Herald is to stare directly into the abyss and watch it smile back.`,agl:`4`,awa:`5`,cha:`12`,int:`7`,phy:`15`,wil:`9`,move:`30/60F`,ap:`3`,def:`8`,wmArmor:`30`,wmBS:`30`,wmDP:`Immune`,wounds:`650`,focus:`+3/9`,reroll:`3`,luck:`—`,meleeHit:`+6`,meleeDmg:`+40/+90(2H)`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`Wizardry`,fear:`10`,mob:`1`,gear:`Abyssal Greatblade, Whip of Anguish`,meleeDetail:`Abyssal Greatblade`,rangeDetail:`Hellfire Orb`,abilities:`Passive Traits
Aura of the Abyss: The Herald passively corrupts the world. The area within 60 feet of the Daemon is choked with sulfur and necrotic ash. Any living creature that starts its turn in this radius takes 10 Necrotic Wounds and cannot regain Wounds (healing magic completely fails) until they leave the aura.

Wings of the Apocalypse: The Daemon's massive, tattered wings generate hurricane-force winds. Any enemy smaller than Enormous that attempts to Move or Dash toward the Daemon must pass a severe Physique(12) test or be violently pushed 15 feet backward by the downdraft, ending their movement.

Soul-Forged Carapace: The Daemon's hide is anathema to mortal steel. The Herald is completely immune to non-magical Melee attacks. Furthermore, any non-magical weapon that strikes the Daemon instantly melts into slag and is permanently destroyed.

Action-Based Abilities
Cleaver of the Damned (Melee Cost: 2 Actions): The Daemon swings its gargantuan, screaming blade. Make a Melee attack (+6 To-Hit) with a 30-foot reach. If successful, it deals 1d10 + 90 Slashing/Necrotic Wounds. The target must surpass Willpower TN 10 + Resist bonus or gain 1 Shaken condition as the screaming souls trapped in the blade assault their mind.

Word of Ruin (Cost: 3 Actions): The Herald speaks a single, forbidden syllable of Abyssal speech. All enemies within a 100-foot radius must pass a severe Willpower(11) test. On a failure, they take 4d10 + 20 Psychic Wounds, instantly drop any weapons they are holding, and fall Prone, physically forced to grovel before the Daemon's majesty.

Hellfire Eruption (Range Cost: 2 Action): The Daemon opens its maw and vomits a sphere of black fire. Make a Ranged attack (+5 To-Hit) against a 20-foot radius area up to 80 feet away. On a hit, all targets in the zone take 1d10 + 30 Fire/Necrotic Wounds, and the ground in that area becomes permanently ablaze, treating it as lethal Difficult Terrain for the rest of the encounter.`},
{name:`Griffon: The Alpine Apex`,size:`Large`,type:`Beast / Monstrosity`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Griffon is the undisputed king of the mountain peaks, a terrifying but majestic fusion of a golden eagle and a tawny lion. Possessing a massive wingspan and razor-sharp talons capable of piercing plate armor, they are brutal ambush predators that strike from the sun. They are fiercely territorial and proudly untamable, viewing anyone who enters their alpine hunting grounds as either a threat to their nest or their next meal. They do not fight fair; they rely on blinding dives, snatching their prey into the sky before the victim's allies can even draw their swords.
`,agl:`9`,awa:`8`,cha:`1`,int:`2`,phy:`7`,wil:`6`,move:`30/60F`,ap:`3`,def:`5`,wmArmor:`9`,wmBS:`5`,wmDP:`10`,wounds:`80`,focus:`—`,reroll:`1`,luck:`2`,meleeHit:`+4`,meleeDmg:`+21`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1-3`,gear:`Random`,meleeDetail:`Rending Talons & Beak`,rangeDetail:`None`,abilities:`Passive Traits
Death from Above: The Griffon uses gravity as a weapon. If the Griffon spends its movement flying at least 30 feet straight down toward a target before making a Melee attack, that attack automatically gains Advantage and ignores the target's first 3 points of Armor Mitigation due to the sheer kinetic force of the dive.

Sun-Blind Ascent: The Griffon instinctively positions itself with the sun behind it. Any enemy attempting to target the Griffon with a Ranged or Casting attack while it is flying above them suffers Disadvantage due to the blinding glare.

Unbroken Pride: The Griffon refuses to be cowed by lesser creatures. It is completely immune to the Shaken and Taunted conditions from any creature that is not Giant or Titanic in size.

Action-Based Abilities
Swooping Pounce (Melee Cost: 1 Action): The Griffon crashes into its prey, claws first. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 21 Slashing Wounds. If the target is Medium or smaller, they are instantly Grappled and knocked Prone beneath the beast's paws.

Executioner’s Beak (Melee Cost: 1 Action): The Griffon snaps its razor-sharp beak down on a helpless target. Make a Melee attack (+4 To-Hit). If this attack targets an enemy that is Grappled by the Griffon, it automatically hits (no roll required) and deals 1d10 + 21 Piercing Wounds as it tears through armor and flesh.

Gale Buffet (Cost: 2 Actions): The Griffon aggressively beats its massive wings, creating a localized hurricane. All enemies in a 20-foot cone must pass a severe Agility(7) test. On a failure, they take 15 Bludgeoning Wounds, are violently pushed 15 feet backward, and are knocked Prone.`},
{name:`Half-Ogre: The Pit-Bred Bruiser`,size:`Large`,type:`Humanoid (Giant-Kin)`,tier:`Elite`,tierColor:`#b45309`,desc:`A brutal crossbreed combining human cunning with the raw, terrifying mass of an ogre. Often raised in underground fighting pits or outlaw mercenary camps, they stand 8 to 9 feet tall, characterized by thick, sloping brows, jutting underbites, and heavily scarred, leathery skin. They are significantly smarter than full-blooded ogres but possess enough of their giant-kin heritage to effortlessly rip a man's arm from its socket. In the grim underworlds and mercenary companies, a Half-Ogre is a terrifying asset. They serve as enforcers, shock troops, and warlord bodyguards, clad in scavenged, mismatched iron plate and wielding weapons far too heavy for a normal human to lift.`,agl:`2`,awa:`4`,cha:`1`,int:`—`,phy:`6`,wil:`5`,move:`—`,ap:`3`,def:`5`,wmArmor:`10`,wmBS:`5`,wmDP:`15`,wounds:`100`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+2`,meleeDmg:`+12/+18`,meleeHeal:`—`,rangeHit:`+1`,rangeDmg:`+10`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`—`,gear:`Iron-Banded Greatclub, Scavenged Scrap-Plate, Signature Iron Gut-Plate`,meleeDetail:`Iron-Banded Greatclub`,rangeDetail:`Rock Thrower`,abilities:`Passive Traits
Unyielding Mass: Because of its Large size and immense density, the Half-Ogre cannot be physically pushed, Grappled, or knocked Prone by Melee attacks from Medium or smaller creatures.

Pit-Hardened: The Bruiser is used to taking a beating. It possesses a natural resistance to blunt trauma, taking half damage from all non-magical Bludgeoning weapons.

Reach of the Brute: The Half-Ogre's elongated arms and massive weapon grant it a natural 10-foot reach in melee combat, allowing it to strike over the heads of standard human infantry.

Action-Based Abilities
Skull-Cracker Swing (Melee Cost: 1 Action): A straightforward, brutal overhead slam. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 18 Bludgeoning Wounds. If this attack rolls a Critical Hit(10), the target's helmet (or shield) is shattered, and they gain the Dazed condition.

Gut-Check Shove (Cost: 1 Action): The Half-Ogre lowers its shoulder and drives its iron gut-plate directly into an enemy. Make a Melee attack (+2 To-Hit). On a hit, it deals 1d10 + 12 Bludgeoning Wounds, and the target is violently pushed 15 feet backward.

The Ragdoll Toss (Cost: 2 Actions): The brute reaches out to grab a compromised target. Make a Melee attack (+2 To-Hit) against a Medium or smaller creature. On a hit, the target takes 10 Bludgeoning Wounds as they are hoisted into the air, and the Half-Ogre throws them up to 20 feet in any direction. The target takes standard fall 2d10 damage upon landing and gains the Prone condition.`},
{name:`Harpy: Siren of the Canyons`,size:`Medium`,type:`Monstrosity (Avian)`,tier:`Minion`,tierColor:`#6b7280`,desc:`From a distance, their voices weave a tragic, hypnotic lullaby that echoes through the canyons, compelling travelers to step just a little closer to the cliff's edge. Up close, the illusion shatters. A Harpy is a vile, stench-ridden fusion of a feral humanoid and a scavenging bird of prey. They have hollow bones, filthy, razor-sharp talons, and eyes completely devoid of empathy. They do not fight fair; they lure, they swoop, they bleed their prey, and they let gravity do the rest of the work.`,agl:`6`,awa:`5`,cha:`9`,int:`—`,phy:`1`,wil:`2`,move:`12/40F`,ap:`3`,def:`4`,wmArmor:`1`,wmBS:`10`,wmDP:`29`,wounds:`21`,focus:`+1/3`,reroll:`—`,luck:`—`,meleeHit:`+3`,meleeDmg:`+15`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`3`,mob:`2-5`,gear:`Filth-crusted talons, jagged bone daggers.`,meleeDetail:`Filthy Talons.`,rangeDetail:`Sonic Shriek`,abilities:`Passive Traits
Hollow Bones: The Harpy is incredibly light, allowing for flight, but highly vulnerable to crushing blows. Any Bludgeoning damage dealt to the Harpy automatically gains a positive modifier to the final damage total.

Hit and Run: If the Harpy moves at least 20 feet in the air before making a melee attack, it does not trigger any defensive counter-attacks or reactions from the target when it flies away.

Gravity's Ally: The Harpy gains Advantage on checks made to grapple, push, or drag a target if they are currently adjacent to a cliff, pit, or deadly drop.

Action-Based Abilities
Siren's Lullaby (Cost: 2 Actions): The Harpy sings its tragic melody, utilizing its massive Charisma. All enemies within 60 feet must surpass Willpower TN 6 + Resist bonus against the Harpy's Casting To-Hit (+3). On a failure, they are Charmed and must use their movement on their next turn to walk toward the Harpy, even if it leads them into danger.

Swooping Talons (Melee Cost: 1 Action): The Harpy dives and slashes. Make a Melee attack (+3 To-Hit). If successful, it deals 6 Slashing Wounds and inflicts a Bleeding condition as the filthy claws rake the flesh.

Snatch and Drop (Melee Cost: 1 Action): If the Harpy has a target Grappled, it attempts to lift them into the air (contested Physique vs. Agility(6) check). If successful, it ascends and immediately releases the target, inflicting falling damage based on the height.`},
{name:`Havenspire Elite Guard`,size:`Medium`,type:`Humanoid (Human)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The capital city of Havenspire does not entrust its safety to mere mercenaries or peasant militias. The Elite Guard are the finest soldiers the realm has to offer, hand-picked for their physical prowess and unwavering loyalty. Clad in gleaming, interlocking plate armor forged in the capital's grand foundries, they are striking figures of authority. They fight with a cold, calculated precision, utilizing heavy tower shields and masterwork longswords. They are not mindless monsters or savage raiders; they are professional sentinels whose sole purpose is to hold the line, protect the city's VIPs, and pacify threats with methodical, overwhelming defense.`,agl:`2`,awa:`4`,cha:`1`,int:`2`,phy:`6`,wil:`5`,move:`15`,ap:`3`,def:`9`,wmArmor:`20`,wmBS:`10`,wmDP:`10`,wounds:`35`,focus:`+1/3`,reroll:`2`,luck:`2`,meleeHit:`+4`,meleeDmg:`+14`,meleeHeal:`—`,rangeHit:`+2`,rangeDmg:`+6`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`2-5`,gear:`Havenspire Full Plate, Tower Shield, Capital Longsword, Heavy Crossbow`,meleeDetail:`Capital Longsword`,rangeDetail:`Short Bow or Crossbow`,abilities:`Passive Traits
Sworn Protector: The Elite Guard is trained to be an unyielding barrier. If an adjacent ally (or VIP) is targeted by a physical attack, the Guard can automatically redirect the attack to themselves, forcing the attacker to roll against the Guard's massive Defense (9) instead.

Capital Forged: The metallurgy of Havenspire is legendary. The Guard's armor and weapons are immune to being shattered, sundered, or degraded by standard, non-magical abilities or corrosive slimes.

Phalanx Wall: While standing adjacent to another Elite Guard, both guards gain immunity to being flanked and cannot be physically pushed or knocked Prone by creatures Size Large or smaller.

Action-Based Abilities
Sentinel's Strike (Melee Cost: 1 Action): A clean, textbook swing with the longsword. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 14 Slashing Wounds.

Shield Bash (Melee Cost: 1 Action): The Guard steps forward and slams their heavy tower shield into the target. Make a Melee attack (+4 To-Hit). On a hit, it deals 10 Bludgeoning Wounds and the target must surpass Physical TN 6 + Resist bonus or be knocked Prone.

Hold the Gate (Melee Cost: 2 Actions): The Guard digs their heels in and raises their shield into a perfect defensive posture(+1). Until the start of their next turn, any enemy that makes a Melee attack against the Guard and misses immediately triggers a free, automatic counter-attack from the Guard's longsword.`},
{name:`Hippogryph: The Crag-Steed`,size:`Large`,type:`Monstrosity (Avian/Equine)`,tier:`Elite`,tierColor:`#b45309`,desc:`The Hippogryph commands the skies with the unblinking, predatory gaze of a giant raptor and the muscular, tearing power of a warhorse's hindquarters. Feared by travelers and knights alike, it is a master of the skies that plummets from the clouds like a feathered anvil. It tears through armor as easily as aged parchment and possesses a wild, unbroken spirit that refuses to be tamed by anything short of legendary magic. A Hippogryph features the head, wings, and foreclaws of a giant hawk, seamlessly transitioning into the powerful hindquarters and tail of a horse. In the wild, they are known for their "Storm-Gallop"—a behavior where herds race along the edge of mountain thunderstorms to catch the updrafts. Their feathers favor earthy tones like chestnut, steel-grey, or dapple-white, allowing them to blend into the rocky high-altitude terrain they call home.`,agl:`9`,awa:`5`,cha:`1`,int:`2`,phy:`4`,wil:`6`,move:`30/60F`,ap:`3`,def:`5`,wmArmor:`15`,wmBS:`15`,wmDP:`12`,wounds:`120`,focus:`+1/3`,reroll:`1`,luck:`2`,meleeHit:`+4`,meleeDmg:`+27/+40`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`4`,mob:`3-8`,gear:`Random`,meleeDetail:`Raking Foreclaws & Beak`,rangeDetail:`None`,abilities:`Passive Traits
Feathered Anvil: The Hippogryph turns gravity into a weapon. If the Hippogryph dives or moves at least 30 feet downward toward a target before making a melee attack, that attack automatically gains the Armor-Piercing(+3WM) quality, tearing through steel like parchment.

Unbroken Spirit: The creature's mind is wildly independent. It is completely immune to the Charmed or Shaken conditions unless the source is of a Legendary or Master-level magical tier.

Storm-Gallop: The Hippogryph treats severe weather (high winds, heavy rain, snow) as an advantage rather than a hindrance, completely ignoring any movement penalties associated with difficult atmospheric terrain.

Action-Based Abilities
Plummeting Strike (Melee Cost: 2 Actions): The Hippogryph folds its wings and drops from the sky. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 40 Piercing Wounds. If this attack benefits from Feathered Anvil, the target must also surpass Physical TN 6 + Resist bonus or be knocked Prone from the sheer kinetic impact.

Raptor's Rake (Melee Cost: 1 Action): The creature lashes out with its front talons. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 +27 Slashing Wounds.

Equine Kick (Melee Cost: 1 Action): If a target is behind or flanking the Hippogryph, it can unleash a brutal kick with its powerful hindquarters. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 27 Bludgeoning Wounds and physically pushes the target 10 feet back.`},
{name:`Human Cultist: The Fractured Soul`,size:`Medium`,type:`Humanoid (Chaos-Touched)`,tier:`Minion`,tierColor:`#6b7280`,desc:`A Cultist rarely looks like a monster at first glance. They wear heavy, layered robes of deep crimson or soot-black to hide the "Chaos-Marks" blooming across their skin—veins that pulse with violet light or patches of scales that feel like cold iron. Their eyes are often bloodshot and wide, dilated by a constant state of religious euphoria or shivering terror. They are tactical fanatics. Unlike disciplined soldiers, a Cultist fights with a terrifying disregard for their own safety. They view their bodies as mere vessels to be used and discarded. In battle, they carry jagged, ritual daggers and "Censer-Flails" that leak hallucinogenic smoke, preferring to die in a burst of chaotic energy rather than face the silence of a world without their dark patrons.`,agl:`5`,awa:`2`,cha:`1`,int:`3`,phy:`4`,wil:`6`,move:`16`,ap:`2`,def:`4`,wmArmor:`4`,wmBS:`12`,wmDP:`10`,wounds:`25`,focus:`—`,reroll:`1`,luck:`—`,meleeHit:`+2`,meleeDmg:`+10/+12Flail`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`+10`,rangeHeal:`—`,castHit:`+1`,castDmg:`+18`,castHeal:`—`,castType:`Wizardry`,fear:`—`,mob:`3-30`,gear:`Heavy Robes, Jagged Ritual Dagger, Censer-Flail.`,meleeDetail:`Censer-Flail / Jagged Dagger`,rangeDetail:`Throwing Daggers`,abilities:`Passive Traits
Reckless Abandon: The Cultist completely ignores self-preservation. When attacking this way, they automatically gain Advantage on their Melee To-Hit rolls, but any attack directed at the Cultist also gains Advantage, reflecting their refusal to defend themselves.

Vessel of Chaos: The Cultist's body is barely containing the dark magic within. When the Cultist is reduced to 0 Wounds, their Chaos-Marks violently rupture. All creatures within 10 feet must surpass Agility TN 5 + Resist bonus or take 10 points of unmitigable magical damage from the bursting violet energy.

Fanatical Mind: Driven by pure religious ecstasy, the Cultist is entirely immune to the Shaken, Charmed, and Dazed conditions.

Action-Based Abilities
Censer-Flail Sweep (Cost: 1 Action): The Cultist swings their heavy, smoking flail. Make a Melee attack (+2 To-Hit). On a hit, it deals 1d10 + 12 Bludgeoning Wounds.

Hallucinogenic Cloud (Cost: 2 Actions): The Cultist violently spins their Censer-Flail, filling a 15-foot radius with thick, noxious smoke. All non-cultists in the area must surpass Willpower TN 6 + Resist bonus. On a failure, they suffer the Confused condition, struggling to distinguish friend from foe through the mind-altering haze.

Blood Sacrifice (Melee Cost: 1 Action): The Cultist drags their jagged dagger across their own arm or chest. The Cultist immediately takes 5 Wounds of unmitigable damage, but their next Melee or Casting attack automatically results in a Critical Hit if it connects, fueled by the blood magic.`},
{name:`Ice Troll: The Glacial Behemoth`,size:`Large`,type:`Monstrosity (Troll)`,tier:`Elite`,tierColor:`#b45309`,desc:`Indigenous to the highest, most unforgiving glacial peaks, the Ice Troll is a terrifying adaptation of the troll lineage. Standing 10 feet tall, its pale blue skin is thick and leathery, pierced by jagged shards of true-ice that grow directly out of its bones. It does not bleed liquid blood; it bleeds a sub-zero slush that flash-freezes upon hitting the air. When an Ice Troll is wounded, it doesn't just knit its flesh back together—it pulls the ambient moisture from the air to pack its wounds with solid ice, making it harder to kill the longer a battle lasts.`,agl:`2`,awa:`4`,cha:`—`,int:`1`,phy:`9`,wil:`5`,move:`25`,ap:`3`,def:`6`,wmArmor:`18`,wmBS:`10`,wmDP:`30`,wounds:`130`,focus:`+1/3`,reroll:`1`,luck:`1`,meleeHit:`+4`,meleeDmg:`+25/+40`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`+30`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`5`,mob:`1-3`,gear:`None. Relies on its environment and physical form`,meleeDetail:`rue-Ice Claws`,rangeDetail:`Hurled Ice Boulders`,abilities:`Passive Traits
Glacial Regeneration: At the start of the Troll's turn, it heals 10 Wounds by pulling ambient moisture into its injuries. Every time this happens, the newly formed ice grants the Troll a permanent, cumulative +2 to its WM-Arm (Armor Mitigation) for the rest of the encounter. If the Troll takes Fire damage, this regeneration (and the armor boost) is paused until the end of its next turn.

Flash-Freeze Blood: When the Troll suffers a Critical Hit from a Melee weapon, its sub-zero slush blood erupts. The attacker must surpass Agility TN 7 + Resist bonus or have their weapon temporarily frozen to the Troll's body, requiring an Action and a Physical(9) test to wrench it free.

Jagged Carapace: Any creature that successfully Grapples the Troll, or hits it with an Unarmed strike, immediately takes 10 Piercing/Cold Wounds from the true-ice shards protruding from its bones.

Action-Based Abilities
Shattering Swipe (Melee Cost: 1 Action): A brutal backhand with an ice-crusted fist. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 25 Slashing/Cold Wounds.

Impale and Freeze (Melee Cost: 2 Actions): The Troll attempts to grab a target and crush them against its jagged chest. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 40 Piercing Wounds, and the target is Grappled. While Grappled, the target takes 10 unmitigable Cold Wounds at the start of their turn.

Sub-Zero Bellow (Cost: 1 Action): The Troll unleashes a roaring blast of freezing air and icy spittle. All enemies within a 15-foot cone must surpass Physical TN 9 + Resist bonus. On a failure, they suffer the Slowed condition, halving their movement speed and Agility on their next turn due to the biting cold.`},
{name:`Iron-Minotaur: The Blood-Gorgon`,size:`Medium`,type:`Monstrosity (Mutant / Brute)`,tier:`Elite`,tierColor:`#b45309`,desc:`A horrifying mutation of giant-kin and dark alchemy, the Iron-Minotaur is built for pure, unstoppable slaughter. Standing over ten feet tall, its flesh is fused with dark iron, and its very skeletal structure is composed of metallic bone that regularly protrudes through its heavily scarred skin. Most terrifyingly, it possesses four massive, heavily muscled arms, each gripping a crude, rusted cleaver or battleaxe. Driven entirely by a supernatural blood-greed, the Gorgon does not tire and does not retreat. It wades into the thickest phalanxes, its four arms working like a mechanical meat-grinder, turning disciplined formations into a spray of red mist.`,agl:`4`,awa:`2`,cha:`—`,int:`1`,phy:`9`,wil:`5`,move:`21`,ap:`3`,def:`6`,wmArmor:`25`,wmBS:`10`,wmDP:`30`,wounds:`125`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+4`,meleeDmg:`+12/+30`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`5`,mob:`1`,gear:`—`,meleeDetail:`Crude Chain-Linked Flail`,rangeDetail:`None`,abilities:`Passive Traits
