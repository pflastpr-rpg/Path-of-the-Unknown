Avalanche Stride (Melee Cost: 1 Action): The Golem uses its massive weight to trample its foes. It moves up to its full 30 Movement speed in a straight line, freely entering the spaces of smaller creatures. Any creature whose space it enters must surpass Agility TN 8 + Resist bonus or take 40 Bludgeoning Wounds and be knocked Prone.`},
{name:`Succubus Matriarch: The Lust-Queen`,size:`Large`,type:`Fiend (Demon)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Matriarch stands nearly 8 feet tall, possessing an otherworldly, shifting beauty that adapts to the deepest desires of whoever looks upon her. Her skin is a soft, bruised violet, and her wings are covered in a fine, velvet-like down that absorbs light. She wears jewelry made of "Frozen Tears"—gems formed from the sorrow of those she has betrayed. She views physical combat as a desperate, last-resort failure. In battle, she is a blurring phantom of motion and psychic pressure, turning your own subconscious and allies against you until you are entirely isolated and broken.`,agl:`9`,awa:`4`,cha:`12`,int:`6`,phy:`5`,wil:`15`,move:`21`,ap:`4`,def:`5`,wmArmor:`10`,wmBS:`30`,wmDP:`35`,wounds:`75`,focus:`+3/9`,reroll:`3`,luck:`3`,meleeHit:`+6`,meleeDmg:`+35`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+4`,castDmg:`+45`,castHeal:`—`,castType:`Wizardry`,fear:`7`,mob:`1`,gear:`Frozen Tear Jewelry`,meleeDetail:`Desperate Rake, Velvet-Down Wings & Claws`,rangeDetail:`None`,abilities:`Passive Traits
Aura of Frozen Tears: The sorrowful gems she wears emit a 30-foot aura of profound, crushing emotional despair. Any enemy within this radius completely loses the benefits of any Morale bonuses, Inspire actions, or Focus points. Furthermore, healing spells cast within this radius only heal for half their normal amount, as the target's will to live is actively suppressed.

Phantom Motion: She moves with a blurring, unnatural grace. The Matriarch never triggers free attacks or attacks of opportunity when moving out of melee range, and she can move seamlessly through spaces occupied by other creatures without penalty.

Shifting Visage of Desire: The Matriarch's face and form constantly shift to reflect the deepest subconscious desires of the person looking at her. Any enemy attempting to target her with a Melee or Ranged attack must first surpass Willpower TN 12 + Resist bonus. On a failure, they suffer Disadvantage on the To-Hit roll because their mind actively fights their body's attempt to harm her.

Action-Based Abilities
Ecstatic Agony(TN12) (Casting Cost: 1 Action): The Matriarch touches a target's mind, flooding their nervous system with a conflicting mix of extreme pleasure and agonizing pain. Make a Casting roll (+4 To-Cast). If successful, it deals 1d10 + 45 psychic Wounds. The target must pass a severe Willpower(12) test or become Charmed for 1 turn. While Charmed this way, they cannot willingly move away from the Matriarch and will actively step in front of the next physical attack aimed at her.

Phantom Step (Cost: 1 Action): The Matriarch blurs into a cloud of violet mist, instantly teleporting up to 30 feet to an unoccupied space she can see. If she teleports adjacent to a Charmed ally, she heals 10 Wounds by passively siphoning their devotion.

The Velvet Puppeteer(TN11) (Casting Cost: 2 Actions): This is her ultimate tool of betrayal. She locks eyes with a target within 60 feet. Make a Casting roll (+4 To-Cast) directly against the target's Willpower defense. On a success, she forcefully overtakes their nervous system. The Matriarch immediately forces the target to make one free Melee or Ranged attack against another target of her choice, using the victim's own stats, weapons, and bonuses.

Weaponize the Subconscious(TN13) (Casting Cost: 2 Actions): The Matriarch rips a dark secret or hidden resentment from a target's mind and broadcasts it telepathically to the rest of the party. The target must pass a severe Willpower(15) test. If they fail, they suffer 2 Stunned conditions as their mind reels from the exposure, and all allied creatures within 30 feet of the target take 2d10 + 20 psychic Wounds from the mental shockwave of the revelation.`},
{name:`Treant: The Grove-Warden`,size:`Giant`,type:`Plant (Elemental)`,tier:`Boss`,tierColor:`#b91c1c`,desc:`Standing roughly 20 feet tall, the Grove-Warden is the steadfast defender of the forest borders. While they lack the apocalyptic, slow-burning rage of the Elder-Barks, these animated oaks and pines are brutal, unyielding sentinels. Their bark is thick and grooved, serving as a natural armor that splinters swords and blunts axes. They are not prone to sudden mobilization; rather, they stand perfectly still for decades, blending seamlessly into the treeline until an intruder strikes the first blow. Once provoked, they unleash heavy, crushing sweeps with their massive boughs to pulp the threat into fertilizer.`,agl:`1`,awa:`5`,cha:`4`,int:`3`,phy:`9`,wil:`6`,move:`25`,ap:`3`,def:`6`,wmArmor:`20`,wmBS:`15`,wmDP:`Immune`,wounds:`200`,focus:`+1/3`,reroll:`1`,luck:`1`,meleeHit:`+4`,meleeDmg:`+28`,meleeHeal:`—`,rangeHit:`+2`,rangeDmg:`+20`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`4`,mob:`1-3`,gear:`None`,meleeDetail:`Massive Boughs`,rangeDetail:`Can hurl large rocks or heavy deadwood`,abilities:`Passive Traits
Deep-Rooted: Because of its immense weight and wooden physiology, the Warden is completely immune to being pushed, Grappled, or knocked Prone by any creature of Large size or smaller.

Timber Hide: The Warden's bark is exceptionally thick. It gains resistance (takes half damage) from all non-magical Piercing and Bludgeoning weapons. However, it possesses a severe vulnerability to Fire, taking double damage from all flame-based attacks as its dry foliage ignites.

False Canopy: While the Treant stands completely still in a forested environment, it is visually indistinguishable from a normal, mundane tree. It automatically gains Advantage on checks made to ambush intruders.

Action-Based Abilities
Crushing Branch (Melee Cost: 1 Action): A straightforward, heavy swing with a massive wooden arm. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 28 Bludgeoning Wounds.

Uprooting Sweep (Melee Cost: 2 Actions): The Treant drags a heavy branch across the ground in a wide arc. All enemies within a 15-foot cone must surpass Agility TN 7 + Resist bonus. On a failure, they take 1d10 + 28 Bludgeoning Wounds and are violently knocked Prone.

Splintering Grasp (Cost: 1 Action): The Treant attempts to crush a target within its massive hands. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 15 Bludgeoning Wounds and the target is Grappled. While Grappled in this way, the target takes an automatic 10 Bludgeoning Wounds at the start of their turn from the sheer pressure.`},
{name:`Triad Weaver (Arcane)`,size:`Medium`,type:`Fey / Caster`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`"Three minds, three voices, one devastating will. The Triad Weaver does not cast spells sequentially; it casts them simultaneously, pulling from three different dimensions of magic at once to shatter the minds and bodies of its foes."`,agl:`3`,awa:`4`,cha:`2`,int:`6`,phy:`1`,wil:`5`,move:`30`,ap:`3`,def:`12`,wmArmor:`4`,wmBS:`8`,wmDP:`3`,wounds:`33`,focus:`+3/9`,reroll:`3`,luck:`3`,meleeHit:`+1`,meleeDmg:`+4`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`+12`,rangeHeal:`—`,castHit:`+8`,castDmg:`+24`,castHeal:`+3`,castType:`Wizardry`,fear:`3`,mob:`1-3`,gear:`Tri-woven Robes, Staff of the Third Eye`,meleeDetail:`Tri-Strike Staff (+1)`,rangeDetail:`None`,abilities:`Passive Traits
Triple Mind: The Weaver is immune to Mind-Altering, Charming, and Illusion effects. It rolls all Awareness/Perception checks with Advantage because three minds are always watching.

Harmonic Warding: Any incoming spell damage is automatically reduced by 3. If a spell deals an exact multiple of 3 in damage, the spell is entirely absorbed and converted into +1 Focus.

Hovering Step: The Weaver floats 3 feet off the ground, ignoring difficult terrain, ground-based traps, and leaving no tracks or sound.

Actions
Triumvirate Blas(TN6) - Casting Cost: 2: Fires 3 arcane bolts at up to 3 different targets. Make 3 separate casting attacks. Each successful hit deals 1d10 + 24 Casting bonus damage.

Triangle of Binding(TN8) - Casting Cost: 2: Connects 3 enemies in a glowing ethereal triangle. Targets must make a Willpower(6) Save. On a failure, they are Paralyzed for 1 round and share any damage dealt to the other bound targets.

Trifold Restoration(TN7) - Casting Cost: 2): Heals up to 3 allies. Each ally restores 1d10 + Casting heal bonus Wounds and is cleansed of 1 negative condition.`},
{name:`True Dragon: The Calamity of Ages`,size:`Enormous`,type:`Dragon / Deity`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Unlike the animalistic Wyvern, a True Dragon is an elemental deity in physical form. They are ancient, arrogant, and possess a hoard of knowledge and gold that can destabilize entire kingdoms. They do not merely live in the world; they shape its geography and its history. To fight a True Dragon is to fight a fundamental force of nature with the intellect of a thousand scholars.`,agl:`4`,awa:`5`,cha:`9`,int:`12`,phy:`18`,wil:`8`,move:`35/100F`,ap:`3`,def:`7`,wmArmor:`25`,wmBS:`20`,wmDP:`Immune`,wounds:`650`,focus:`+2/6`,reroll:`3`,luck:`1`,meleeHit:`+6`,meleeDmg:`+60`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+40`,rangeHeal:`—`,castHit:`+5`,castDmg:`+30`,castHeal:`—`,castType:`Wizardry`,fear:`8`,mob:`1`,gear:`he accumulated wealth, secrets, and artifacts of lost civilizations.`,meleeDetail:`Deity's Claws & Jaws`,rangeDetail:`Calamity Breath`,abilities:`Passive Traits
Omniscient Arrogance: Thanks to its 12 Intelligence, the True Dragon already knows everything about the heroes. It automatically knows the highest and lowest stats, current Hit Points, and exact magical loadouts of every character on the battlefield. It uses this information to ruthlessly exploit their weakest saves.

Elemental Embodiment: The True Dragon chooses one Element (Fire, Cold, Lightning, Acid) at the start of combat. It becomes completely immune to that Element, and any Ranged or Casting attacks it makes completely ignore the players' Wound Mitigation/Resistances against that chosen Element.

The Weight of Ages: The sheer physical and magical pressure it exerts is suffocating. Any Ranged attack (like an arrow or thrown spear) loses all kinetic energy as it approaches the dragon, completely failing to deal Wounds unless the attacker spends 1 Focus point to push the projectile through the pressure field.

Action-Based Abilities
Breath of the Calamity (Range Cost: 2 Actions): The dragon exhales pure, unadulterated elemental destruction. Make a Ranged attack (+5 To-Hit) against a massive 80-foot cone. On a hit, targets take 1d10 + 40 Wounds of the dragon's chosen element. The sheer force of the blast permanently destroys all non-magical cover (trees, boulders, walls) in the area.

Word of Ruin(TN10) (Casting Cost:  Actions): Weaponizing its ancient knowledge, the dragon speaks a forgotten word of unmaking. Make a Casting attack (+5 To-Hit) against one target within 60 feet. On a hit, it deals 2d10 + 30 Psychic Wounds, and the target's strongest equipped magical item is temporarily deactivated/suppressed for 1 full round.

Tectonic Strike (Melee Cost: 1 Action): The dragon simply brings a massive claw down upon the earth. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 60 Wounds. Regardless of if the attack hits or misses, the impact causes the ground within a 20-foot radius to rupture, instantly becoming severe Difficult Terrain.`},
{name:`Umber-Hulk: The Chitinous Delver`,size:`Large`,type:`Monstrosity (Subterranean)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A horrific fusion of ape-like musculature and dense, beetle-like chitin. Compressed into a terrifyingly heavy man-sized frame, the Umber-Hulk is the ultimate subterranean ambush predator. Its arms end in massive, diamond-hard claws capable of shearing through solid granite like wet clay. However, its most dreaded feature is its face: a cluster of four glowing, multifaceted eyes that project a localized psychic distortion. Those who lock eyes with the beast find their spatial reasoning shattered, leaving them wandering aimlessly or swinging at phantoms while the Hulk closes in for the kill.`,agl:`1`,awa:`4`,cha:`5`,int:`—`,phy:`9`,wil:`2`,move:`25/BG`,ap:`3`,def:`6`,wmArmor:`25`,wmBS:`10`,wmDP:`30`,wounds:`75`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+4`,meleeDmg:`+22/+35`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`5`,mob:`1-2`,gear:`None`,meleeDetail:`Stone-Borer Claws`,rangeDetail:`None`,abilities:`Passive Traits
The Alien Gaze: The Umber-Hulk's four compound eyes scramble the mortal mind. Any enemy that starts its turn within 30 feet and has line of sight to the Hulk's face must pass a surpass Willpower TN 7 + Resist bonus against the Hulk's 5 Charisma. On a failure, the target gains the Dazed condition, and the target's Movement is forced in a random direction (determined by the Game Master) for that turn.

Tremorsense: The creature's 4 Awareness is tied to the earth. It completely ignores magical darkness, invisibility, and visual illusions as long as its target is touching the ground within 60 feet.

Tunnel-Borer: The Hulk burrows through solid rock, leaving behind a 5-foot wide permanent tunnel. Because its claws are designed to crush granite, any Melee attack it makes completely ignores 5 points of the target's WM-Arm (Armor Mitigation).

Action-Based Abilities
Chitinous Rake (Melee Cost: 1 Action): A brutal, heavy swipe with its massive claws. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 22 Slashing/Bludgeoning Wounds.

Mandible Crush (Melee Cost: 2 Actions): The Hulk attempts to bite a target cleanly in half. Target an enemy suffering from the Dazed or Prone condition. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 35 Piercing Wounds, and the target is violently pinned in the creature's jaws, gaining the Grappled condition.

Subterranean Eruption (Cost: 1 Action): If the Umber-Hulk is currently burrowed beneath the earth, it violently erupts into an unoccupied space on the surface. Any adjacent enemies must surpass Agility TN 7 + Resist bonus or take 10 Bludgeoning Wounds from the flying stone and be violently knocked Prone.`},
{name:`Umbric-Flayer (Shadow Stalker)`,size:`Medium`,type:`Monstrosity (Shadow)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A nightmare of emaciated efficiency. They are roughly man-sized, but their skeletal frame is composed of an obsidian-like shadow material that is both unnaturally light and impossibly dense. Their limbs are elongated and disjointed, ending in signature raking claws that are longer than their own forearms. They move in eerie, silent bursts of speed, using their terrifying reach to flay armor and flesh alike while their Midnight-Hound brethren keep the prey pinned. To face an Umbric-Flayer is to fight a living guillotine made of smoke and glass.`,agl:`9`,awa:`5`,cha:`1`,int:`3`,phy:`6`,wil:`4`,move:`25`,ap:`3`,def:`6`,wmArmor:`12`,wmBS:`25`,wmDP:`10`,wounds:`45`,focus:`+1/3`,reroll:`1`,luck:`1`,meleeHit:`+4/+6`,meleeDmg:`+25`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`5`,mob:`1-5`,gear:`Relies entirely on its natural obsidian body.`,meleeDetail:`Disjointed Raking Claws`,rangeDetail:`None`,abilities:`Passive Traits
Blood Frenzy: The Reaper's obsidian claws are highly reactive to spilled life force. If the Reaper attacks a target that is currently suffering from a Bleeding condition, it gains Advantage on its To-Hit rolls.

Elongated Reach: Because its limbs are disproportionately long and end in massive, forearm-length claws, the Reaper has a melee reach of 10 feet. This allows it to safely strike from behind a frontline of Midnight-Hounds without stepping into standard melee range itself.

Paradoxical Density: The obsidian-like material of its skeleton is both impossibly dense and unnaturally light. It completely ignores the first 10 Wounds of any non-magical physical attack that hits it. Furthermore, because it is so light, it never triggers pressure plates, leaves no footprints, and makes absolutely no sound when it walks, granting it Advantage on all Stealth or Surprise attempts.

Shadow-Burst Evasion: Because of its 9 Agility, the Flayer never triggers defensive or counter-attacks when moving out of an enemy's melee range. It can effortlessly slip through gaps in a frontline formation.

Action-Based Abilities
Flaying Rake (Melee Cost: 2 Action): The Reaper sweeps its massive claws in a brutal arc. Make a melee attack (+6 To-Hit). If successful, it deals normal 1d10 + 25 Wounds, and the sheer density of the claws actively shreds the target's defenses, permanently reducing the target's Armor Mitigation by 1 for the rest of the encounter (this effect stacks with multiple hits).

Umbric Impalement (Melee Cost: 2 Actions): The Reaper lunges with terrifying speed, attempting to drive both of its elongated claws directly through a target's torso. Make a melee attack at +4 To-Hit. If successful, it deals 2d10 + 25 Wounds. The target is instantly inflicted with 2 Bleeding conditions and is considered Grappled, pinned on the end of the Reaper's claws until they can break free with a Physique vs surpass Physique TN 7 + Resist bonus.

Shadow-Step Evisceration (Cost: 2 Actions): The Reaper merges its lightweight frame with the shadows, instantly teleporting up to 30 feet to appear directly in the blind spot of an enemy. Make a melee attack (+6 To-Hit) that completely ignores the target's worn Armor Mitigation. If the target is already Bleeding, the shock of the sudden, brutal strike forces them to surpass Physique TN 8 + Resist bonus or immediately suffer a Stunned condition.`},
{name:`Vampire: The Crimson Lord`,size:`Medium`,type:`Undead (Apex Predator)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Crimson Lord is not a mindless, rotting corpse, but a terrifying apex predator wrapped in the guise of aristocratic perfection. Pale, impossibly graceful, and possessing a gaze that can paralyze a charging knight, the Vampire views mortals as nothing more than cattle and fine wine. They move in blurs of unnatural speed, capable of shifting their physical form into mist to evade blows. In combat, they do not just seek to kill; they seek to subjugate, charm, and drain their victims dry, using the party's own blood to knit their undead flesh back together. To fight a Crimson Lord is to realize you have willingly walked into a slaughterhouse dressed as a ballroom.`,agl:`12`,awa:`6`,cha:`9`,int:`3`,phy:`5`,wil:`3`,move:`25`,ap:`4`,def:`9`,wmArmor:`10`,wmBS:`15`,wmDP:`Immune`,wounds:`65`,focus:`+3/9`,reroll:`2`,luck:`2`,meleeHit:`+4/+6`,meleeDmg:`+15/+40`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+4`,castDmg:`+30`,castHeal:`—`,castType:`Necromantic`,fear:`7`,mob:`1`,gear:`Aristocratic Garb, Master-Crafted Rapier, Signet Ring, Vials of Vitae`,meleeDetail:`Master-Crafted Rapier, Crimson Claws`,rangeDetail:`None`,abilities:`Passive Traits
Undead Anatomy & Sunlight Aversion: As a creature of the night, the Vampire is completely immune to the Poison and Disease conditions. However, they take double Wounds from any Radiant, Holy, or Fire-based attacks. If the Vampire starts its turn in direct sunlight (or magical equivalent), it suffers 2d10 Wounds and loses 1 Action for that turn.

Mist-Step Evasion: When the Vampire moves, it temporarily dissolves into a cloud of crimson mist. It never triggers free attacks or attacks of opportunity when moving out of melee range, and it can move through physical obstacles like iron grates, arrow slits, or even spaces occupied by other creatures without any movement penalty.

Blood-Frenzy Regeneration: The Vampire is vitalized by the scent of fresh blood. If the Vampire starts its turn within 30 feet of any creature currently suffering from a Bleeding condition, the Vampire automatically heals 2d10 + 10 Wounds as it draws the ambient life force through the air.

The Crimson Gaze: Any enemy that starts its turn within 30 feet and has line of sight to the Vampire must pass a surpass Willpower TN 7 + Resist bonus against the Vampire's Charisma. On a failure, they gain the Charmed condition, viewing the Vampire as an awe-inspiring sovereign and becoming unable to target them with hostile actions.

Action-Based Abilities
Flawless Lunge (Melee Cost: 1 Action): A blurring, textbook strike with their rapier. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 15 Piercing Wounds and ignores 5 points of the target's WM-Arm.

Predator's Gaze(TN9) (Casting Cost: 2 Actions): The Vampire locks eyes with a target within 40 feet, attempting to completely dominate their will. Make a Casting roll (+4 To-Cast) against the target's Willpower defense. If successful, the target is Charmed. On their next turn, the Charmed target must use their movement to walk directly toward the Vampire and immediately drop any weapons they are holding.

Sever the Artery (Melee Cost: 2 Action): A blindingly fast swipe of elongated, hardened fingernails. Make a Melee attack (+5 To-Hit). If successful, it deals normal 1d10 + 15 melee Wounds and bypasses half of the target's Armor Mitigation. The target automatically suffers 1 Bleeding condition.

The Crimson Kiss (Melee Cost: 2 Actions): The Vampire's signature feeding maneuver. This attack can only be used on a target that is currently Grappled, Stunned, or Charmed. Make a Melee attack (+6 To-Hit). If successful, the Vampire sinks its fangs into the victim, dealing 3d10 + 30 Wounds. The Vampire instantly heals Wounds equal to the damage dealt, and the victim permanently loses 1 point of Physique until they complete a long rest.`},
{name:`Vulkan-Kahn (The First Forge)`,size:`Enormous`,type:`Elemental (Pantheon Boss)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`: A god-like entity of the Pyreborn pantheon. Vulkan-Kahn stands nearly 30 feet tall when bipedal. He is a terrifying fusion of feline elegance and volcanic raw power. His fur is not hair, but a dense mesh of white-hot needles that shimmer like burning silk. His black stripes are actually deep fissures in his hide, pulsing with the rhythmic glow of a tectonic heart. To the Pyreborn, he is the "First Forge," the being from whom all heat originated. He bridges the gap between the Enormous and Titanic scale, combining the terrifying agility of an apex feline predator with the apocalyptic damage multipliers of a world-ending boss.`,agl:`18`,awa:`5`,cha:`4`,int:`3`,phy:`12`,wil:`6`,move:`45`,ap:`4`,def:`8`,wmArmor:`25`,wmBS:`25`,wmDP:`25`,wounds:`450`,focus:`+4/12`,reroll:`3`,luck:`2`,meleeHit:`+6`,meleeDmg:`+50`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+6`,castDmg:`+22`,castHeal:`—`,castType:`None`,fear:`9`,mob:`1`,gear:`"The World-Splitter" (Star-Iron Halberd)`,meleeDetail:`The World-Splitter, Tectonic Claws`,rangeDetail:`None`,abilities:`Passive Traits
The First Forge: Vulkan-Kahn is the literal origin of heat. He is entirely immune to Fire, Magma, and Heat damage. Furthermore, any enemy that strikes him with a melee attack takes 2d10 Fire Wounds immediately from his shimmering, white-hot needle fur.

Feline Elegance: Despite his Titanic size, his 18 Agility allows him to ignore the standard penalties of his mass. He cannot be flanked, ignores all difficult terrain, and never triggers traps. He takes no falling damage.

Tectonic Heart: The rhythmic pulsing of his fissures regulates his god-like form. At the start of every turn, he automatically cures himself of all negative conditions (Bleeding, Poison, Disease, Stunned, Prone) and restores 10 Wounds.

Actions
Eruption of the Forge(12) - (Casting/Area Cost: 3): Vulkan-Kahn slams the butt of "The World-Splitter" into the ground, detonating the tectonic pressure within his stripes. All enemies within a 100 ft radius must make a Physique(14) Save. On a failure, they take 4d10 + 25 Casting Wounds, are knocked Prone, and are pushed 30 feet away from him by the shockwave.

On All Fours - (Movement/Melee Cost: 1): Vulkan-Kahn drops to all fours, becoming a blurring streak of white-hot fire. He dashes up to 250 feet in a straight line, passing directly through enemies. Any creature in his path must make an Agility(15) Test or take 1d10 +25 Wounds (half his normal melee output) and gain 2 Bleeding conditions.

Roar of the Loom (Cost: 1 Action): He rears up on his hind legs and unleashes a roar that sounds like the earth splitting open. All enemies within an 80-foot cone must pass a surpass Willpower TN 7 + Resist bonus against his 9 Charisma or suffer the Paralyzed condition for 1 round, their nervous systems completely overwhelmed by the sonic pressure.

World-Splitter Cleave - (Melee Cost: 2): A sweeping strike with his Star-Iron Halberd. Deals normal 1d10 + 50 Melee Wounds. If the target survives, their armor is instantly melted and destroyed, reducing their WM-Arm to 0, if non-magical, for the remainder of the encounter.`},
{name:`Warrior of Chaos (Champion)`,size:`Medium`,type:`Humanoid (Corrupted)`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A towering monolith of dark iron, spiked plate, and unholy devotion. The Champion Warrior of Chaos has surrendered their humanity to the dark gods, gaining unnatural strength and resilience in return. They do not feel pain, they do not tire, and they march across the battlefield like a walking slaughterhouse. Where the human soldier holds the line, the Chaos Warrior shatters it. Beneath the horned helm, there is no longer a man—only an empty, bloodthirsty vessel driven by the whispering will of ruin.`,agl:`2`,awa:`5`,cha:`4`,int:`3`,phy:`12`,wil:`6`,move:`21`,ap:`4`,def:`9`,wmArmor:`25`,wmBS:`20`,wmDP:`Immune`,wounds:`200`,focus:`+2/6`,reroll:`2`,luck:`—`,meleeHit:`+5`,meleeDmg:`+30(2H)`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`5`,mob:`1`,gear:`Hell-Forged Greatsword, Fused Spiked Plate`,meleeDetail:`Hell-Forged Greatsword`,rangeDetail:`None`,abilities:`Passive Traits
Battle-Ready: Through extensive slaughter, they can confront up to 3 enemies in melee combat simultaneously without those enemies gaining an advantage to-hit, and they gain a passive +1 Melee Wound bonus.

Spiked Monolith: The Warrior's armor is designed to punish those who get close. Any enemy that successfully strikes the Champion with an Unarmed attack, or Grapples them, automatically takes 8 Piercing Wounds from the jagged, barbed plate.

Unholy Resilience: The dark gods do not allow their champion to fall easily. The Warrior is completely immune to the Shaken, Charmed, and Fatigued conditions. If an attack would reduce them to 0 Wounds, they may roll a Willpower(7+) test; on a success, they drop to 1 Wound instead and keep fighting.

Action-Based Abilities
Berzerker (Melee: Cost 1 Action): With ferocious but decisive strikes, the warrior loses any disadvantage on to-hit rolls for this turn. A successful strike causes normal 1d10 + 30 wounds plus an additional d10. On an unmodified 10, they deal normal plus 2d10 additional wounds.

Boon of Ruin (Cost: 2 Actions): The Champion pauses to offer a bloody tribute to the dark gods. By actively destroying a fallen corpse on the battlefield (or sacrificing 5 of their own Wounds), the Champion's weapon erupts in dark energy, granting them Advantage on all Melee To-Hit rolls and +10 Wounds to all damage dealt until the end of their next turn.

Executioner's Cleave (Cost: 1 Action): A brutal, tactical swing with the dark iron greatsword. Make a Melee attack (+5 To-Hit). If successful, it deals 1d10 + 30 Slashing/Necrotic Wounds and ignores 5 points of the target's WM-Arm.

Impact (Melee Cost 2 Actions): Gripping their 2H weapon, they rear back with a powerful swing to stun their opponent. A successful hit deals normal 1d10 + 30 + 2x Physique(24) wounds, and causes 1 Stunned condition.`},
{name:`White Dragon: The Blizzard Stalker`,size:`Giant`,type:`Dragon / Beast`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Unlike its scheming, manipulative cousins, the White Dragon is a creature of pure, feral instinct. It is a savage apex predator of the frozen wastes, driven by hunger and territorial rage rather than a desire for gold or dominion. Its scales are the color of packed snow and glacial ice, allowing it to vanish completely into a whiteout. It hunts like a massive, winged leopard, clinging to sheer ice walls or burrowing under deep snow to ambush prey, tearing them apart before they even realize the blizzard has teeth.

Move: 50 Ground / 40 Burrow (Ice) / 80 Flight`,agl:`6`,awa:`9`,cha:`4`,int:`2`,phy:`15`,wil:`5`,move:`50/80F`,ap:`3`,def:`7`,wmArmor:`20`,wmBS:`16`,wmDP:`Immune`,wounds:`350`,focus:`+2/6`,reroll:`2`,luck:`1`,meleeHit:`+6`,meleeDmg:`+35`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+20`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`6`,mob:`1`,gear:`The frozen, half-eaten corpses of past adventurers`,meleeDetail:`Rending Claws & Fangs`,rangeDetail:`Sub-Zero Gale`,abilities:`Passive Traits
Snow-Blind Stalker: The White Dragon ignores all visibility penalties from blizzards, fog, or darkness. Furthermore, it ignores Movement penalties on ice or deep snow, and can climb sheer vertical ice walls.

Feral Bloodlust: Fighting entirely on emotion, if the White Dragon takes any Wounds during a round, it flies into a rage, automatically gaining Advantage on its first Melee attack during its next turn.

Icebound Camouflage: When partially submerged in snow or pressed against a glacier, the dragon is effectively invisible. If it initiates combat from this state, it automatically wins the Initiative tie and its first attack completely ignores the target's Shield mitigation.

Action-Based Abilities
Glacier Pounce (Melee Cost: 1 Action): The dragon leaps directly onto its prey. It moves up to 40 feet and makes a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 35 Wounds, and the target is forcefully knocked Prone and Grappled beneath its massive claws.

Sub-Zero Gale (Range Cost: 2 Actions): The dragon exhales a roaring, 40-foot cone of absolute-zero ice shards. Make a Ranged attack (+5 To-Hit). On a hit, targets take 3d10 + 20 Cold Wounds and have their Movement speed reduced to 0 on their next turn.

Thrashing Tail (Melee Cost: 1 Action): Operating on pure instinct to clear its flanks, the dragon violently thrashes its heavy tail. Make a Melee attack (+6 To-Hit) against all enemies behind or beside the dragon. On a hit, targets take half Wounds 1d10 + 18) and are thrown 15 feet away.`},
{name:`Wither-Walker: The Blighted Sylvan`,size:`Giant`,type:`Plant / Undead`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A Wither-Walker stands 18 to 22 feet tall, appearing as a skeletal, humanoid tree. Its bark is a sickly, charcoal grey, weeping a thick, black sap that smells of ozone and vinegar. Its "leaves" are clusters of jagged obsidian shards and dried, razor-sharp briars. Moving with a slow, agonizing creak like a door being forced off its hinges, they are the ultimate "Attrition" bosses. They view all flesh-beings as parasites, turning the environment so toxic that victims simply collapse from exhaustion, ready to be mulched and fed to the dying forest.`,agl:`4`,awa:`6`,cha:`2`,int:`1`,phy:`9`,wil:`15`,move:`18`,ap:`3`,def:`7`,wmArmor:`25`,wmBS:`30`,wmDP:`Immune`,wounds:`300`,focus:`+2/6`,reroll:`2`,luck:`1`,meleeHit:`+6`,meleeDmg:`+40`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`+40`,rangeHeal:`—`,castHit:`+5`,castDmg:`+35`,castHeal:`—`,castType:`Necromantic`,fear:`7`,mob:`1`,gear:`None`,meleeDetail:`Obsidian-Briar Boughs`,rangeDetail:`Volatile Sap-Glob. Hurls globs of acidic sap up to 60ft`,abilities:`Passive Traits
Aura of the Blight: The Wither-Walker constantly radiates a suffocating, toxic miasma smelling of vinegar and ozone. Any enemy starting their turn within 30 feet of the Walker must pass a severe Physique(10) test. On a failure, they gain 1 Poison condition and 1 Fatigued condition as the toxic air burns their lungs and saps their stamina.

Weeping Black Sap: The Walker’s charcoal bark constantly oozes thick, highly acidic sap. Any Melee attack made against the Walker with a physical weapon causes the sap to splash. The attacker automatically takes 1d10 Acid Wounds, and non-magical weapons suffer a permanent -1 to their damage output as the acid immediately begins eating the metal or wood.

Petrified Undead Anatomy: As a fusion of dead wood and necromancy, the Walker is immune to Bleeding and takes only half Wounds from Piercing weapons. However, because its sap is highly volatile (smelling of ozone), any Fire-based attacks that hit the Walker deal double Wounds, but also cause the sap to explode, dealing 2d10 Fire Wounds to anyone within 10 feet of the Walker.

Action-Based Abilities
Obsidian-Briar Sweep (Melee Cost: 2 Actions): The Walker sweeps its massive, razor-sharp arms in a 20-foot frontal arc. It makes a single To-Hit roll (+6) against the Defense of all targets in the area. Anyone hit takes normal 1d10 + 40 melee Wounds and must surpass Agility TN 6 + Resist bonus or suffer 2 Bleeding conditions as the obsidian leaves flay their armor.

Flesh into Mulch (Melee Cost: 2 Actions): The Walker attempts to grab an exhausted victim to feed the roots. Make a Melee attack (+6 To-Hit). If successful, it deals no immediate Wounds, but the target is Grappled and lifted into the Walker's blighted, open trunk. At the start of the Walker's next turn, if the target has not broken free, they take 3d10 + 40 Acid Wounds, and the Walker heals Wounds equal to the damage dealt as it digests them.

Roots of Attrition (Casting Cost: 2 Actions): The Walker violently plunges its arms into the ground, causing blackened, necrotic roots to erupt beneath up to 3 different targets within 60 feet. Make a Casting roll (+8 To-Cast). If successful, the targets take 1d10 + 35 Necrotic Wounds, have their Movement reduced to 0 for their next turn, and immediately lose 1 Focus or Reroll point (target's choice) as the roots drain their mental resolve.`},
{name:`Wraith: The Hollow-Champion`,size:`Medium`,type:`Undead / Incorporeal`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A Wraith appears as a tall, hooded silhouette of tattered, midnight-colored robes. Where a face should be, there is only an endless, swirling vacuum of smoke and two freezing white pinpricks of light. They carry the "Echo" of the weapon they wielded in life—a blade made of solidified shadow that doesn't cut the flesh so much as it severs the soul's connection to the body. They drift through solid stone walls and iron doors as if they were mist. The air around them drops to sub-zero temperatures, misting breath and withering plants. They do not just kill; they consume. A victim slain by a Wraith leaves no corpse for resurrection—their soul is pulled into the Wraith's hollow chest to fuel its dark power.`,agl:`9`,awa:`5`,cha:`12`,int:`3`,phy:`4`,wil:`6`,move:`40`,ap:`3`,def:`8`,wmArmor:`—`,wmBS:`40`,wmDP:`Immune`,wounds:`65`,focus:`+2/6`,reroll:`2`,luck:`—`,meleeHit:`+5`,meleeDmg:`+25`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+5`,castDmg:`+30`,castHeal:`—`,castType:`Necromantic`,fear:`8`,mob:`1-2`,gear:`The "Echo" Blade (Solidified Shadow Weapon)`,meleeDetail:`Echo Blade (Targets the soul, not the body)`,rangeDetail:`None`,abilities:`Passive Traits
Aura of the Grave-Chill: The Wraith projects a 20-foot aura of sub-zero temperatures. Any living creature that starts its turn within this aura takes 1d10 Cold Wounds and must surpass Willpower TN 10 + Resist bonus or suffer 1 Fatigued condition as the freezing air literally saps the warmth from their blood.

Consume the Soul: The most terrifying mechanic in the Wraith's arsenal. If the Wraith reduces a target to 0 Wounds, it does not just kill them; it sucks their soul into its hollow chest. The Wraith instantly heals to its maximum Wounds. Furthermore, the slain target cannot be revived by normal resurrection magic—their soul is trapped. The party must destroy the Wraith within 24 hours to release the soul, or the party member is permanently erased from existence.

Incorporeal Entity: The Wraith has no physical body. It takes only half Wounds from all non-magical physical weapons. It is completely immune to the Grappled, Prone, Bleeding, Poison, and Disease conditions. It can move its full Movement speed through solid walls, closed doors, and other creatures without penalty.

Sub-Zero Vacuum (Aura): The Wraith drains the ambient heat from the world. Any living creature that ends its turn within 15 feet of the Wraith takes 5 Cold Wounds and suffers a -1 penalty to their Agility as frost rimes their armor and joints.

Action-Based Abilities
Dissipate (Cost: 1 Action): The Wraith breaks apart into a cloud of freezing black smoke and instantly teleports up to 40 feet to an unoccupied space it can see, ignoring all defensive or counter-attacks.

Hollow Siphon(TN11) (Casting Cost: 2 Actions): The Wraith reaches out with a spectral, freezing hand to drain the life force of a target within 30 feet. Make a Casting roll (+5 To-Cast). If successful, it deals 1d10 + 30 Necrotic Wounds. The target permanently loses 1 point of Willpower until they complete a long rest, and the Wraith heals Wounds equal to the damage dealt.

Phase-Step Retreat (Cost: 1 Action): The Wraith instantly drops its physical manifestation, becoming pure smoke. It Disengages from all melee combat without triggering any free attacks, and instantly moves up to 30 feet directly through the nearest floor, ceiling, or wall, placing a solid barrier between itself and the party to wait for its cooldowns.

Sever the Soul (Melee Cost: 1 Action): The Wraith swings its Echo Blade, aiming not for armor, but for the spirit. Make a Melee attack (+6 To-Hit). If successful, it deals normal 1d10 + 25 melee Wounds. Because the blade passes directly through physical matter, this attack completely ignores all Armor Wound Mitigation (using only the target's natural or magical mitigation).`},
{name:`Xaver: The Glass-Spined Stalker`,size:`Medium`,type:`Monstrosity (Hybrid / Skirmisher)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Xaver is a hexapedal mammalian-reptilian hybrid. It has the lean, powerful body of a cheetah, but is covered in flexible, diamond-hard scales that act like fiber optics, seamlessly bending light around its body. Its most striking feature is the row of crystalline spines running down its back, capable of vibrating at frequencies that shatter glass and eardrums alike. It doesn't hunt with scent or sight in the traditional sense; it "sees" through Photonic Resonance, detecting the minute light distortions caused by the movement of living souls. When a Xaver is about to strike, its spines glow with a prismatic light, and the air around it begins to hum with high-frequency energy.`,agl:`9`,awa:`6`,cha:`2`,int:`1`,phy:`4`,wil:`5`,move:`40`,ap:`4`,def:`7`,wmArmor:`20`,wmBS:`15`,wmDP:`20`,wounds:`60`,focus:`+1/3`,reroll:`2`,luck:`1`,meleeHit:`+4`,meleeDmg:`+25`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+20`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1-3`,gear:`None`,meleeDetail:`Prismatic Claws & Fangs`,rangeDetail:`Resonant Spine-Burst. Shoots a focused beam of sonic energy up to 60ft`,abilities:`Passive Traits
Photonic Resonance: The Xaver does not rely on normal vision. It detects the soul-light and movement of living beings. It is completely immune to the Blinded condition, magical darkness, and visual illusions. Furthermore, no living creature can benefit from Invisibility or Stealth while within 100 feet of the Xaver—it sees them perfectly.

Fiber-Optic Camouflage: The Xaver's diamond scales passively bend light around its body. Whenever the Xaver is not taking an Action, it is completely Invisible. Any Ranged attacks made against it while it is moving suffer Disadvantage. However, the moment it prepares to strike, its spines glow, briefly dropping the invisibility until its turn ends.

Hexapedal Sprint: The Xaver ignores all difficult terrain modifiers for rubble, underbrush, and steep inclines, effortlessly using its six legs to maintain its blistering 40 Movement speed.

Action-Based Abilities
The Humming Pounce (Melee Cost: 2 Actions): The Xaver sprints up to 30 feet and launches itself at a target. Make a Melee attack (+5 To-Hit). If successful, it deals normal 1d10 + 25 melee Wounds. If the Xaver started this attack while Invisible, the sudden prismatic flash blinds the target's defenses, automatically bypassing all of the target's Armor Mitigation for this strike.

Shatter-Frequency (Cost: 2 Actions): The Xaver arches its back, and its crystalline spines violently vibrate, emitting a devastating sonic wave in a 30-foot radius. All enemies in the area must pass a severe Willpower(11) test. On a failure, they take 3d10 + 20 Sonic Wounds, gain 1 Stunned condition (from ruptured eardrums), and any fragile glass items they are carrying (like health potions or vials) instantly shatter and are destroyed.

Prismatic Flay (Melee Cost: 1 Action): The Xaver unleashes a flurry of strikes with its six clawed limbs. Make a Melee attack (+5 To-Hit). If successful, it deals normal 1d10 + 25 Wounds and the target must surpass Agility TN 8 + Resist bonus or suffer 2 Bleeding conditions as the diamond-hard claws effortlessly shred through leather and flesh.`},
{name:`Yeti: The Blizzard-Stalker`,size:`Large`,type:`Monstrosity / Beast`,tier:`Elite`,tierColor:`#b45309`,desc:`Standing 9 to 11 feet tall, the Yeti is a mountain of corded muscle covered in thick, matted white fur. It doesn't just survive the deadly cold of the high peaks; it weaponizes it. To a Yeti, a blinding blizzard is the perfect hunting ground. They are incredibly territorial and possess a primal, cruel cunning—often burying themselves in snowdrifts to ambush travelers, or using their deafening roars to trigger localized avalanches that crush entire caravans beneath tons of ice.`,agl:`4`,awa:`5`,cha:`3`,int:`2`,phy:`9`,wil:`6`,move:`25`,ap:`3`,def:`7`,wmArmor:`10`,wmBS:`10`,wmDP:`25`,wounds:`120`,focus:`+1/3`,reroll:`1`,luck:`1`,meleeHit:`+4`,meleeDmg:`+25`,meleeHeal:`—`,rangeHit:`+2`,rangeDmg:`+20`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`4`,mob:`1-2`,gear:`None. Relies on massive fists and environmental debris.`,meleeDetail:`Simian Fists & Fangs`,rangeDetail:`Hurled Ice Chunks. Throws heavy debris up to 60ft`,abilities:`Passive Traits
Ghost of the Glacier: The Yeti is completely immune to Cold/Ice damage and all weather-related Movement penalties (deep snow, slick ice, etc.). Furthermore, its pristine white fur provides perfect camouflage. When in a snowy environment, the Yeti gains automatic Advantage on all Stealth tests, and any Ranged attacks made against it from further than 30 feet suffer Disadvantage due to the optical illusion of the snow blending with its fur.

Hypothermic Grip: The Yeti's body temperature is supernaturally cold to the touch. Any creature that is currently Grappled by the Yeti automatically suffers 1d10 Cold Wounds and 1 Fatigued condition at the start of their turn as the beast's freezing fur rapidly saps their body heat.

Snowdrift Ambush: The Yeti can use 1 Action to perfectly bury itself in deep snow. While buried, it is completely undetectable by non-magical means. If an enemy walks within 10 feet of the buried Yeti, it can instantly erupt from the snow, gaining a free Surprise Action before Initiative is rolled.

Action-Based Abilities
Savage Pummel (Melee Cost: 1 Action): The Yeti brings its massive, heavy fists down like sledgehammers. Make a Melee attack (+4 To-Hit). If successful, it deals normal 1d10 + 25 melee Wounds, and the target must pass a severe Physique(11) test or suffer 1 Stunned condition from the sheer concussive force of the blow.

Whiteout Roar (Cost: 2 Actions): The Yeti beats its chest and unleashes a deafening roar that literally calls the storm down. A 40-foot radius around the Yeti instantly becomes a howling vortex of snow and wind for 1 round. All enemies within the radius are permanently Blinded to anything further than 5 feet away while inside the storm, and must surpass Willpower TN 8 + Resist bonus or drop their weapons as they cover their ears against the deafening noise.

The Spine-Breaker (Melee Cost: 2 Actions): The Yeti attempts to grab an enemy in a horrifying bear-hug. Make a Melee attack (+4 To-Hit). If successful, the target is Grappled and lifted off the ground. The Yeti deals 2d10 + 25 Wounds as it violently compresses the target's ribcage. If the target is wearing physical armor, the sheer pressure buckles the metal, permanently reducing the target's Armor Mitigation by 5.`},
{name:`Zephyr: Greater Hurricane-Core`,size:`Giant`,type:`Elemental (Air)`,tier:`Elite`,tierColor:`#b45309`,desc:`If a standard Zephyr is a deadly cyclone, the Greater Zephyr is a living hurricane. Towering over sixty feet tall, this sentient vortex of violently pressurized air, screaming wind, and pulverized debris is a walking natural disaster. Born only in the most catastrophic magical storms or summoned by the highest echelon of sky-cults, it obliterates anything in its path with terrifying indifference. It doesn't wield weapons; it wields the environment itself, sucking up boulders, wagons, and armored knights into its funnel before violently ejecting them. To stand before a Greater Zephyr is to challenge the wrath of the sky itself.`,agl:`15`,awa:`5`,cha:`3`,int:`4`,phy:`2`,wil:`9`,move:`60F`,ap:`3`,def:`10`,wmArmor:`—`,wmBS:`30`,wmDP:`Immune`,wounds:`105`,focus:`+3/9`,reroll:`1`,luck:`1`,meleeHit:`+4`,meleeDmg:`+32`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`+20`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`6`,mob:`1`,gear:`None`,meleeDetail:`Pressurized Blades`,rangeDetail:`—`,abilities:`Passive Traits
Amorphous Colossus: The Greater Zephyr can move through solid structures by simply eroding them. Because it has no solid body, it is completely immune to the Grappled and Prone conditions, and takes exactly half damage from all non-magical Piercing and Bludgeoning weapons (cannonballs and greatswords simply pass through the funnel).

// ══════════════════════════════════════════════ STATE
let activeFilters = new Set();
let casterOnly    = false;
let currentMonster= null;
let pinnedMonster = null;
let compareMode   = false;
let filtered      = [...MONSTERS];
const artCache    = {};
const ART_DIR     = 'bestiary-art/';
const ART_EXTS    = ['jpg','jpeg','png','webp'];

// ══════════════════════════════════════════════ TIER
function tierFromWounds(w) {
  const n = parseInt(String(w).split(/[-\/]/)[0]) || 0;
  if (n <= 30)  return {tier:'Minion',    color:getComputedStyle(document.documentElement).getPropertyValue('--minion').trim()};
  if (n <= 80)  return {tier:'Skirmisher',color:getComputedStyle(document.documentElement).getPropertyValue('--skirmisher').trim()};
  if (n <= 150) return {tier:'Elite',     color:getComputedStyle(document.documentElement).getPropertyValue('--elite').trim()};
  if (n <= 300) return {tier:'Boss',      color:getComputedStyle(document.documentElement).getPropertyValue('--boss').trim()};
  return {tier:'Legendary',color:getComputedStyle(document.documentElement).getPropertyValue('--legendary').trim()};
}

function resistFromTier(tier) {
  switch(tier) {
    case 'Minion':     return {resist: 0, turn: 1};
    case 'Skirmisher': return {resist: 1, turn: 2};
    case 'Elite':      return {resist: 2, turn: 3};
    case 'Boss':       return {resist: 3, turn: 4};
    case 'Legendary':  return {resist: 5, turn: 6};
    default:           return {resist: 0, turn: 0};
  }
}

// ══════════════════════════════════════════════ FILTERS
function toggleTier(tier) {
  if(activeFilters.has(tier)) activeFilters.delete(tier); else activeFilters.add(tier);
  document.getElementById('f-'+tier).classList.toggle('active',activeFilters.has(tier));
  applyFilters();
}
function toggleCaster() {
  casterOnly=!casterOnly;
  document.getElementById('f-caster').classList.toggle('active',casterOnly);
  applyFilters();
}
function clearFilters() {
  activeFilters.clear(); casterOnly=false;
  document.getElementById('search-input').value='';
  ['Minion','Skirmisher','Elite','Boss','Legendary'].forEach(t=>document.getElementById('f-'+t).classList.remove('active'));
  document.getElementById('f-caster').classList.remove('active');
  applyFilters();
}
function applyFilters() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  filtered = MONSTERS.filter(m => {
    if(q && !m.name.toLowerCase().includes(q) && !m.type.toLowerCase().includes(q)) return false;
    if(activeFilters.size>0 && !activeFilters.has(m.tier)) return false;
    if(casterOnly && (!m.castType||m.castType==='—'||m.castType==='None')) return false;
    return true;
  });
  renderList();
}

// ══════════════════════════════════════════════ LIST
function shortName(n) { return n.split(':')[0].trim(); }

function renderList() {
  const panel = document.getElementById('list-panel');
  const count = document.getElementById('list-count');
  count.textContent = filtered.length+' / '+MONSTERS.length+' CREATURES';
  document.getElementById('hdr-count').textContent = filtered.length+' CREATURES';
  const existing = panel.querySelectorAll('.list-item,.no-results');
  existing.forEach(e=>e.remove());
  if(!filtered.length){
    const nr=document.createElement('div'); nr.className='no-results'; nr.textContent='No creatures found';
    panel.appendChild(nr); return;
  }
  filtered.forEach(m=>{
    const div=document.createElement('div');
    const isPinned = pinnedMonster===m;
    div.className='list-item'+(currentMonster===m?' active':'')+(isPinned?' pinned':'');
    div.innerHTML=`<div class="li-dot" style="background:${m.tierColor}"></div><div class="li-name">${shortName(m.name)}</div><div class="li-size">${m.size}</div>`;
    div.onclick=()=>selectMonster(m,div);
    panel.appendChild(div);
  });
}

// ══════════════════════════════════════════════ ABILITIES PARSER
function parseAbilities(raw) {
  const sections={passive:[],action:[],reaction:[]};
  let current='passive';
  const lines=(raw||'').split('\n').map(l=>l.trim()).filter(Boolean);
  for(const line of lines){
    if(line.length<=40 && !line.includes('(') && !line.includes(':')){
      const ll=line.toLowerCase();
      if(ll.includes('passive')){current='passive';continue;}
      if(ll.includes('reaction')){current='reaction';continue;}
      if(ll.includes('action')||ll.includes('active')){current='action';continue;}
    }
    if(line.length>2) sections[current].push(line);
  }
  return sections;
}

function abilityHTML(sections) {
  let html='';
  const defs=[{key:'passive',label:'Passive Traits',cls:'passive'},{key:'action',label:'Actions',cls:'action'},{key:'reaction',label:'Reactions',cls:'reaction'}];
  for(const {key,label,cls} of defs){
    if(!sections[key].length) continue;
    html+=`<div class="ability-section ${cls}"><div class="ability-section-head">${label}</div>`;
    sections[key].forEach(line=>{html+=`<div class="ability-entry ${cls}">${line}</div>`;});
    html+='</div>';
  }
  return html;
}

// ══════════════════════════════════════════════ CARD RENDER
function renderCard(m, compareWith) {
  const abilities = parseAbilities(m.abilities);

  // Build compare class for a stat cell
  function cmpClass(field, invert=false) {
    if(!compareWith) return '';
    const a=parseFloat(String(m[field]).replace(/[^0-9.\-]/g,''));
    const b=parseFloat(String(compareWith[field]).replace(/[^0-9.\-]/g,''));
    if(isNaN(a)||isNaN(b)) return '';
    const better = invert ? a<b : a>b;
    const worse  = invert ? a>b : a<b;
    return better?' sc-better':worse?' sc-worse':'';
  }
  function cmpAtk(field) {
    if(!compareWith) return '';
    const a=parseFloat(String(m[field]).replace(/[^0-9.\-]/g,''));
    const b=parseFloat(String(compareWith[field]).replace(/[^0-9.\-]/g,''));
    if(isNaN(a)||isNaN(b)) return '';
    return a>b?' ct-better':a<b?' ct-worse':'';
  }

  const nameSub   = m.name.includes(':') ? `<div class="mc-name-sub">${m.name.split(':').slice(1).join(':').trim()}</div>` : '';
  const castTag   = (m.castType&&m.castType!=='—'&&m.castType!=='None') ? `<span class="mc-tag cast">✦ ${m.castType}</span>` : '';
  const fearTag   = (m.fear&&m.fear!=='—') ? `<span class="mc-tag fear">FEAR ${m.fear}</span>` : '';
  const loreHTML  = (m.desc&&m.desc!=='—') ? `<div class="mc-lore">${m.desc}</div>` : '';
  const gearHTML  = (m.gear&&m.gear!=='—') ? `<div class="gear-box"><span class="gl">Gear &amp; Equipment</span>${m.gear}</div>` : '';
  const abilHtml  = (m.abilities&&m.abilities!=='—') ? `<div class="mc-abilities">${abilityHTML(abilities)}</div>` : '';

  const meleeRow = (m.meleeHit!=='—'||m.meleeDmg!=='—') ? `<tr class="${cmpAtk('meleeDmg')}"><td class="ct-lbl">Melee</td><td class="ct-val hit">${m.meleeHit}</td><td class="ct-val dmg">${m.meleeDmg}</td><td class="ct-val heal">${m.meleeHeal!=='—'?m.meleeHeal:'—'}</td><td class="ct-detail">${m.meleeDetail!=='—'?m.meleeDetail:''}</td></tr>` : '';
  const rangeRow = (m.rangeHit!=='—'||m.rangeDmg!=='—') ? `<tr class="${cmpAtk('rangeDmg')}"><td class="ct-lbl">Ranged</td><td class="ct-val hit">${m.rangeHit}</td><td class="ct-val dmg">${m.rangeDmg}</td><td class="ct-val heal">${m.rangeHeal!=='—'?m.rangeHeal:'—'}</td><td class="ct-detail">${m.rangeDetail!=='—'?m.rangeDetail:''}</td></tr>` : '';
  const castRow  = (m.castHit!=='—'||m.castDmg!=='—')   ? `<tr class="${cmpAtk('castDmg')}"><td class="ct-lbl">${(m.castType&&m.castType!=='—'&&m.castType!=='None')?m.castType:'Cast'}</td><td class="ct-val hit">${m.castHit}</td><td class="ct-val dmg">${m.castDmg}</td><td class="ct-val heal">${m.castHeal!=='—'?m.castHeal:'—'}</td><td class="ct-detail"></td></tr>` : '';

  const isPinned = pinnedMonster===m;
  const isCompare = !!compareWith;
  const cardClass = isCompare ? 'monster-card compare-card' : 'monster-card';

  const pinLabel = isPinned ? '&#x1F4CC; Pinned' : '&#x1F4CC; Pin';
  const pinCls   = isPinned ? 'mc-btn pin pinned' : 'mc-btn pin';
  const actionsHTML = isCompare ? '' : (
    '<div class="mc-actions">' +
    '<button class="mc-btn tracker" data-action="tracker">&#x2694; Tracker</button> ' +
    '<button class="' + pinCls + '" data-action="pin">' + pinLabel + '</button> ' +
    '<button class="mc-btn" data-action="edit">&#x270E; Edit</button> ' +
    '<button class="mc-btn" data-action="print">&#x2399; Print</button>' +
    '</div>'
  );

  return `<div class="${cardClass}">

  <div class="mc-header">
    <div class="mc-header-top">
      <div class="mc-header-left">
        <div class="mc-tier-banner" style="color:${m.tierColor}">
          <div class="mc-tier-dot" style="background:${m.tierColor}"></div>
          ${m.tier.toUpperCase()}
        </div>
        <div class="mc-name">${shortName(m.name)}</div>
        ${nameSub}
        <div class="mc-meta">
          <span class="mc-tag size">${m.size}</span>
          <span class="mc-tag">${m.type}</span>
          ${castTag}${fearTag}
        </div>
      </div>
      <div class="mc-header-right">
        <div class="mc-attrs-strip">
          <div class="mc-attr"><span class="mca-l">Agl</span><span class="mca-v">${m.agl}</span></div>
          <div class="mc-attr"><span class="mca-l">Awa</span><span class="mca-v">${m.awa}</span></div>
          <div class="mc-attr"><span class="mca-l">Cha</span><span class="mca-v">${m.cha}</span></div>
          <div class="mc-attr"><span class="mca-l">Int</span><span class="mca-v">${m.int}</span></div>
          <div class="mc-attr"><span class="mca-l">Phy</span><span class="mca-v">${m.phy}</span></div>
          <div class="mc-attr"><span class="mca-l">Wil</span><span class="mca-v">${m.wil}</span></div>
          <div class="mc-attr-sep"></div>
          <div class="mc-attr"><span class="mca-l">Luck</span><span class="mca-v">${m.luck}</span></div>
          <div class="mc-attr"><span class="mca-l">Reroll</span><span class="mca-v">${m.reroll}</span></div>
        </div>
        ${actionsHTML}
      </div>
    </div>
  </div>

  <div class="mc-stat-block">
    <div class="mc-stat-row">
      <div class="mc-stat-cell wounds${cmpClass('wounds')}"><span class="sc-lbl">Wounds</span><span class="sc-val">${m.wounds}</span></div>
      <div class="mc-stat-cell${cmpClass('def',true)}"><span class="sc-lbl">Defense</span><span class="sc-val">${m.def}</span></div>
      <div class="mc-stat-cell${cmpClass('ap')}"><span class="sc-lbl">Act Points</span><span class="sc-val">${m.ap}</span></div>
      <div class="mc-stat-cell${cmpClass('move')}"><span class="sc-lbl">Move</span><span class="sc-val">${m.move}</span></div>
      <div class="mc-stat-cell focus"><span class="sc-lbl">Focus</span><span class="sc-val">${m.focus}</span></div>
      <div class="mc-stat-cell wm"><span class="sc-lbl">WM Armour</span><span class="sc-val">${m.wmArmor}</span></div>
      <div class="mc-stat-cell wm"><span class="sc-lbl">WM Bless/Spell</span><span class="sc-val">${m.wmBS}</span></div>
      <div class="mc-stat-cell wm"><span class="sc-lbl">WM Disease/Pois</span><span class="sc-val">${m.wmDP}</span></div>
    </div>
    <div class="mc-stat-row" style="grid-template-columns:repeat(4,1fr);">
      ${(()=>{
        const rb = resistFromTier(m.tier);
        const hasDiscipline = m.castType && m.castType !== '—' && m.castType !== 'None' && m.castType !== '';
        const turnCell = hasDiscipline
          ? `<div class="mc-stat-cell" style="background:rgba(184,134,11,0.06);"><span class="sc-lbl" style="color:var(--gold);">Turn Bonus</span><span class="sc-val" style="color:var(--gold);font-size:16pt;">+${rb.turn}</span></div>`
          : `<div class="mc-stat-cell" style="opacity:0.3;"><span class="sc-lbl">Turn Bonus</span><span class="sc-val" style="font-size:14pt;">—</span></div>`;
        return `<div class="mc-stat-cell" style="background:rgba(139,16,16,0.06);"><span class="sc-lbl" style="color:var(--blood);">Resist Bonus</span><span class="sc-val" style="color:var(--blood);font-size:16pt;">+${rb.resist}</span></div>${turnCell}<div class="mc-stat-cell"><span class="sc-lbl">Tier</span><span class="sc-val" style="font-size:12pt;color:${m.tierColor};">${m.tier}</span></div><div class="mc-stat-cell"><span class="sc-lbl">Discipline</span><span class="sc-val" style="font-size:12pt;">${hasDiscipline ? m.castType : '—'}</span></div>`;
      })()}
    </div>
    <div class="mc-combat-row">
      <table class="mc-combat-table">
        <thead><tr>
          <th class="ct-h-type">Type</th>
          <th class="ct-h">To-Hit</th><th class="ct-h">Wounds</th><th class="ct-h">Heal</th>
          <th class="ct-h-detail">Weapon / Detail</th>
        </tr></thead>
        <tbody>${meleeRow}${rangeRow}${castRow}</tbody>
      </table>
    </div>
  </div>

  <div class="mc-body">
    <div class=\"mc-art\" id=\"${isCompare?'cmp-art-slot':'mc-art-slot'}\" onclick=\"if(!isCompare)triggerArtUpload()\">
      <div class="mc-art-label"><div class="al-icon">🖼</div><div class="al-text">LOADING ART…</div></div>
    </div>
    <div class="mc-lore-col">
      ${loreHTML}${gearHTML}${abilHtml}
    </div>
  </div>

</div>`;
}

// ══════════════════════════════════════════════ SELECT
function selectMonster(m, el) {
  currentMonster=m;
  document.querySelectorAll('.list-item').forEach(li=>li.classList.remove('active'));
  if(el) el.classList.add('active');
  renderDetail();
}

function attachCardListeners() {
  // No-op: event delegation handles all card button clicks
  // See the delegated listener on #detail-panel at init
}

function renderDetail() {
  if(!currentMonster) return;
  const panel = document.getElementById('detail-panel');
  const cmpWith = (compareMode && pinnedMonster && pinnedMonster !== currentMonster) ? pinnedMonster : null;
  panel.innerHTML = renderCard(currentMonster, cmpWith);
  // Reapply comparing class after innerHTML wipe
  if(compareMode) panel.classList.add('comparing');
  attachCardListeners();
  renderArtSlot(currentMonster, 'mc-art-slot');
  if(compareMode && pinnedMonster && pinnedMonster !== currentMonster) renderCompare();
}

// ══════════════════════════════════════════════ COMPARE
function toggleCompare() {
  compareMode=!compareMode;
  const btn=document.getElementById('compare-toggle');
  const cPanel=document.getElementById('compare-panel');
  const dPanel=document.getElementById('detail-panel');
  const mainLayout=document.getElementById('main-layout');
  btn.classList.toggle('active',compareMode);
  btn.textContent = compareMode ? '✕ COMPARE OFF' : '⚔ COMPARE';
  mainLayout.classList.toggle('compare-active', compareMode);
  // Let CSS handle display via compare-active class
  cPanel.style.display = '';
  dPanel.classList.toggle('comparing', compareMode);
  renderDetail();
}

function togglePin() {
  if(pinnedMonster===currentMonster){
    pinnedMonster=null;
  } else {
    pinnedMonster=currentMonster;
    if(!compareMode) toggleCompare();
  }
  renderList();
  renderDetail();
}

function clearPin() {
  pinnedMonster=null;
  renderList();
  renderDetail();
  document.getElementById('compare-content').innerHTML='<div class="detail-empty" style="height:300px;"><div class="de-rune" style="font-size:32pt;">📌</div><div class="de-text">Pin a monster first</div></div>';
}

function renderCompare() {
  if(!pinnedMonster) return;
  const content = document.getElementById('compare-content');
  content.innerHTML = renderCard(pinnedMonster, currentMonster);
  renderArtSlot(pinnedMonster, 'cmp-art-slot');
  const panel = document.getElementById('detail-panel');
  panel.innerHTML = renderCard(currentMonster, pinnedMonster);
  panel.classList.add('comparing');
  attachCardListeners();
  renderArtSlot(currentMonster, 'mc-art-slot');
}

// ══════════════════════════════════════════════ ART
function slugify(name){return name.split(':')[0].trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}

function renderArtSlot(m, slotId) {
  const slot=document.getElementById(slotId);
  if(!slot) return;
  if(artCache[m.name]){
    slot.innerHTML=`<img src="${artCache[m.name]}"><button class="art-clear" onclick="clearArt(event,'${m.name}','${slotId}')">✕ REMOVE</button>`;
    return;
  }
  const base=ART_DIR+slugify(m.name);
  let idx=0;
  function tryNext(){
    if(idx>=ART_EXTS.length){
      slot.innerHTML=`<input type="file" accept="image/*" onchange="loadArt(event,'${m.name}','${slotId}')" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%"><div class="mc-art-label"><div class="al-icon">🖼</div><div class="al-text">CLICK TO ADD ART</div><div class="al-sub">${base}.jpg</div></div>`;
      return;
    }
    const img=new Image();
    img.onload=()=>{slot.innerHTML=`<img src="${img.src}"><button class="art-clear" onclick="clearArt(event,'${m.name}','${slotId}')">✕ REMOVE</button>`;};
    img.onerror=tryNext;
    img.src=base+'.'+ART_EXTS[idx++];
  }
  tryNext();
}
function triggerArtUpload(){const f=document.getElementById('mc-art-slot')?.querySelector('input[type=file]');if(f)f.click();}
function loadArt(event,name,slotId){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{artCache[name]=e.target.result; renderArtSlot({name},slotId);};
  reader.readAsDataURL(file);
}
function clearArt(e,name,slotId){
  e.stopPropagation(); delete artCache[name];
  const m=MONSTERS.find(x=>x.name===name);
  if(m) renderArtSlot(m,slotId);
}

// ══════════════════════════════════════════════ TRACKER
function sendToTracker() {
  if(!currentMonster) return;
  const m=currentMonster;
  const wVal=parseInt(String(m.wounds).split(/[-\/]/)[0])||50;
  const fpM=String(m.focus).match(/\+?(\d+)\/(\d+)/);
  const pkg={
    identity:{name:shortName(m.name),race:m.type,size:m.size},
    combatStats:{
      wTotal:wVal, apTotal:parseInt(m.ap)||2,
      fpBase:fpM?parseInt(fpM[2]):0,
      initiative:parseInt(m.agl)||0, defense:parseInt(m.def)||0,
      movement:parseInt(m.move)||0,
      meleeHit1:m.meleeHit!=='—'?m.meleeHit:0, meleeDmg1:m.meleeDmg!=='—'?m.meleeDmg:0,
      rangeHit1:m.rangeHit!=='—'?m.rangeHit:null, rangeDmg1:m.rangeDmg!=='—'?m.rangeDmg:null,
      castHit:m.castHit!=='—'?m.castHit:null, castDmg:m.castDmg!=='—'?m.castDmg:null,
      castHeal:m.castHeal!=='—'?m.castHeal:null,
      wmArmor:parseInt(m.wmArmor)||0, wmBless:parseInt(m.wmBS)||0, wmDispoi:parseInt(m.wmDP)||0,
    },
    notes:`Fear:${m.fear} | Focus:${m.focus} | Mob:${m.mob}`,
    isNPC:true,
  };
  const blob=new Blob([JSON.stringify(pkg,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=shortName(m.name).replace(/[^a-z0-9]/gi,'_')+'.pou';
  a.click(); URL.revokeObjectURL(url);
  const btn=document.querySelector('.mc-btn.tracker');
  if(btn){const orig=btn.textContent; btn.textContent='✓ Downloaded'; setTimeout(()=>btn.textContent=orig,2000);}
}

// ══════════════════════════════════════════════ ADD MONSTER
function openAddMonster(clearForm) {
  if(clearForm) {
    // Reset form for a new monster
    window._editingMonster = null;
    ['f-name','f-subtitle','f-type','f-desc','f-gear','f-abilities','f-mob'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.value='';
    });
    ['f-agl','f-awa','f-cha','f-int','f-phy','f-wil'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.value='5';
    });
    const defaults={
      'f-wounds':'30','f-def':'6','f-ap':'3','f-move':'20',
      'f-focus':'—','f-fear':'—','f-reroll':'—','f-luck':'—',
      'f-wma':'—','f-wmbs':'—','f-wmdp':'—',
      'f-mhit':'—','f-mdmg':'—','f-mheal':'—','f-mdetail':'—',
      'f-rhit':'—','f-rdmg':'—','f-rheal':'—','f-rdetail':'—',
      'f-chit':'—','f-cdmg':'—','f-cheal':'—','f-cdetail':'—',
    };
    Object.entries(defaults).forEach(([id,val])=>{
      const el=document.getElementById(id); if(el) el.value=val;
    });
    const saveBtn=document.getElementById('modal-save-btn');
    if(saveBtn) saveBtn.textContent='Save Creature';
  }
  document.getElementById('add-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('add-modal').classList.remove('open');
  window._editingMonster = null;
  const saveBtn = document.getElementById('modal-save-btn');
  if(saveBtn) saveBtn.textContent = 'Save Creature';
}

function gf(id){ return document.getElementById(id)?.value?.trim()||'—'; }

function saveNewMonster() {
  const name     = document.getElementById('f-name').value.trim();
  const subtitle = document.getElementById('f-subtitle').value.trim();
  if(!name){ alert('Name is required.'); return; }

  const fullName = subtitle ? `${name}: ${subtitle}` : name;
  const wounds   = gf('f-wounds');
  const t        = tierFromWounds(wounds);

  const m = {
    name:fullName, size:gf('f-size'), type:gf('f-type'),
    tier:t.tier, tierColor:t.color,
    desc:document.getElementById('f-desc').value.trim()||'—',
    agl:gf('f-agl'), awa:gf('f-awa'), cha:gf('f-cha'),
    int:gf('f-int'), phy:gf('f-phy'), wil:gf('f-wil'),
    move:gf('f-move'), ap:gf('f-ap'), def:gf('f-def'),
    wmArmor:gf('f-wma'), wmBS:gf('f-wmbs'), wmDP:gf('f-wmdp'),
    wounds, focus:gf('f-focus'), reroll:gf('f-reroll'), luck:gf('f-luck'),
    meleeHit:gf('f-mhit'), meleeDmg:gf('f-mdmg'), meleeHeal:gf('f-mheal'),
    rangeHit:gf('f-rhit'), rangeDmg:gf('f-rdmg'), rangeHeal:gf('f-rheal'),
    castHit:gf('f-chit'),  castDmg:gf('f-cdmg'),  castHeal:gf('f-cheal'),
    castType:gf('f-cast'), fear:gf('f-fear'), mob:gf('f-mob'),
    gear:document.getElementById('f-gear').value.trim()||'—',
    meleeDetail:gf('f-mdetail'), rangeDetail:gf('f-rdetail'),
    abilities:document.getElementById('f-abilities').value.trim()||'—',
  };

  MONSTERS.push(m);
  filtered = [...MONSTERS];
  applyFilters();
  closeModal();
  selectMonster(m, null);
  // Re-find and highlight in list
  setTimeout(()=>{
    const items = document.querySelectorAll('.list-item');
    const last = items[items.length-1];
    if(last){ last.classList.add('active'); last.scrollIntoView({behavior:'smooth',block:'center'}); }
  }, 100);
}

// ══════════════════════════════════════════════ IMPORT / EXPORT
function exportData() {
  const blob=new Blob([JSON.stringify(MONSTERS.map(m=>{
    const vals=[];
    const fields=['name','size','type','','desc','agl','awa','cha','int','phy','wil','move','ap','def','wmArmor','wmBS','wmDP','wounds','focus','reroll','luck','meleeHit','meleeDmg','meleeHeal','rangeHit','rangeDmg','rangeHeal','castHit','castDmg','castHeal','castType','fear','mob','gear','meleeDetail','rangeDetail','abilities'];
    fields.forEach(f=>vals.push(f?m[f]||'':''));
    return {values:vals};
  }),null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='Clean_Bestiary.rpgb';a.click();URL.revokeObjectURL(url);
}

function importData(event) {
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(Array.isArray(data)){
        // Check if it's the new format (objects with named keys) or old (values array)
        if(data[0]?.name!==undefined){
          // New format — direct assign
          MONSTERS.length=0; data.forEach(m=>MONSTERS.push(m));
        } else if(data[0]?.values){
          // Old .rpgb format — map values
          MONSTERS.length=0;
          data.forEach(entry=>{
            const v=entry.values||[];
            const g=(i,d='—')=>(v[i]&&v[i]!==''&&v[i]!=='0')?v[i]:d;
            const wounds=g(17,'50');
            const t=tierFromWounds(wounds);
            MONSTERS.push({name:g(0),size:g(1),type:g(2),tier:t.tier,tierColor:t.color,
              desc:g(4),agl:g(5),awa:g(6),cha:g(7),int:g(8),phy:g(9),wil:g(10),
              move:g(11),ap:g(12),def:g(13),wmArmor:g(14),wmBS:g(15),wmDP:g(16),
              wounds,focus:g(18),reroll:g(19),luck:g(20),
              meleeHit:g(21),meleeDmg:g(22),meleeHeal:g(23),
              rangeHit:g(24),rangeDmg:g(25),rangeHeal:g(26),
              castHit:g(27),castDmg:g(28),castHeal:g(29),castType:g(30),
              fear:g(31),mob:g(32),gear:g(33),meleeDetail:g(34),rangeDetail:g(35),
              abilities:g(36,'—'),
            });
          });
        }
        filtered=[...MONSTERS]; applyFilters();
        alert(`Loaded ${MONSTERS.length} creatures.`);
      }
    }catch(err){alert('Import failed: '+err.message);}
  };
  reader.readAsText(file);
  event.target.value='';
}

// ══════════════════════════════════════════════ INIT
// Delegation — walk up from click target to find data-action
function handleCardClick(e) {
  let el = e.target;
  while(el && el !== document.body) {
    if(el.dataset && el.dataset.action) {
      const action = el.dataset.action;
      if(action === 'tracker') sendToTracker();
      else if(action === 'pin')  togglePin();
      else if(action === 'edit') editMonster();
      else if(action === 'print') window.print();
      e.stopPropagation();
      return;
    }
    el = el.parentElement;
  }
}

document.getElementById('detail-panel').addEventListener('click', handleCardClick);

applyFilters();
