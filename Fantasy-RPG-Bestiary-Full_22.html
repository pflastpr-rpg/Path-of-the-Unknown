Rune-Forged Carapace: The cursed iron plates bolted into the creature's flesh by the smiths of Birn Uluhm offer near-impenetrable defense. The Iron-Minotaur possesses an innate 15 points of WM-Arm (Armor Mitigation). However, attackers can choose to target the exposed joints by taking a -3 penalty to their To-Hit roll; a successful hit in this manner ignores all WM-Arm.

Furnace Blood: The creature is kept alive by a literal furnace of dark magic burning within its chest. It is completely immune to Fire and Heat-based damage. Furthermore, any enemy that starts its turn adjacent to the Iron-Minotaur takes 5 Fire Wounds from the radiating heat and scalding steam.

Unstoppable Momentum: Pain is a distant memory, replaced entirely by the agonizing drive of its dark machinery. The Iron-Minotaur is immune to the Staggered, Stunned, and Shaken conditions. Attempts to Grapple or knock the creature Prone are automatically resisted unless the attacker passes a surpass Physique TN 7 + Resist bonus against the Iron-Minotaur's 9 Physique.

Action-Based Abilities
Quake Strike (Melee Cost: 1 Action): Raising its massive, jagged iron weapon, the beast brings its full unnatural weight crashing down onto the ground. Make a Melee attack (+4 To-Hit). If successful, it deals 30 Bludgeoning Wounds. Additionally, the ground shatters in a 10-foot radius around the target, turning the area into difficult terrain.

Vent Slag (Cost: 1 Action): The Iron-Minotaur violently purges toxic buildup from its internal furnace. It targets a 15-foot cone in front of it. All targets within the cone must surpass Physique TN 9 + Resist bonus against the beast's 9 Physique. On a failure, they take 1d10 + 12 Fire Wounds and gain the Blinded and Choking conditions (suffering a -2 to all tests) for one turn. On a success, they take half Wounds and avoid the conditions.

Engine-Buster Charge (Cost: 2 Actions): The beast lowers its horns and barrels forward in a straight line up to 40 feet. It makes a single Melee attack (+4 To-Hit) against the first target in its path. On a hit, it deals 1d10 + 30 Piercing/Bludgeoning Wounds, and the target is violently pushed back 10 feet and gains the Prone condition. If the charge hits a solid structure, the structure takes double Wounds.`},
{name:`Knight of the Ruined Order (Dread Knight)`,size:`Medium`,type:`Undead (Hero)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`Dread Knights were once heroic crusaders who fell to corruption, their souls bound to their armor by dark necromancy long after their bodies turned to dust. They do not feel pain, fatigue, or pity. They are a vanguard of terror, projecting an aura of unnatural cold and soul-crushing dread. A Dread Knight rarely rushes into combat; it walks with slow, inevitable purpose, letting the sheer psychological weight of its presence break the minds of its enemies before its blade ever swings. It is a towering, imposing figure entirely encased in blackened, heavily pitted plate armor. There is no flesh visible beneath the visor—only a swirling vortex of freezing, spectral-blue mist and two piercing points of hateful light. Its armor is draped in the tattered, frost-rimed remnants of a once-noble tabard. In its gauntlets, it wields a massive, two-handed executioner's sword that trails a freezing black vapor.`,agl:`1`,awa:`5`,cha:`9`,int:`2`,phy:`6`,wil:`15`,move:`15`,ap:`4`,def:`8`,wmArmor:`20`,wmBS:`25`,wmDP:`Immune`,wounds:`80`,focus:`+2/6`,reroll:`4`,luck:`—`,meleeHit:`+5`,meleeDmg:`+20/+35`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`+6`,rangeHeal:`—`,castHit:`+4`,castDmg:`+12`,castHeal:`—`,castType:`Necromantic`,fear:`6`,mob:`1`,gear:`Pitted Black Plate, Tattered Frost-Rimed Tabard, Executioner's Sword`,meleeDetail:`Frost-Rimed Executioner's Sword`,rangeDetail:`Special Abilities`,abilities:`Passive Traits
Hollow Armor: The Knight has no physical body beneath its armor, only a swirling vortex of spectral-blue mist. It is completely immune to the Bleeding and Poisoned conditions. Furthermore, critical hits from Piercing weapons deal only normal damage, as the weapon simply passes through the mist inside the plate.

Aura of the Grave: The ground freezes around its sabatons, and the air grows thick with the chill of the grave. Any living creature that starts its turn within 20 feet of the Knight must pass a surpass Willpower TN 7 + Resist bonus against the Knight's staggering Charisma. On a failure, they gain the Shaken condition and their Movement speed is halved by the unnatural cold.

Inevitable Advance: The Dread Knight cannot be rushed or staggered. It is completely immune to being knocked Prone, physically pushed, or having its Movement speed reduced by any effect other than its own slow gait.

Action-Based Abilities
Executioner's Toll (Melee Cost: 2 Actions): A devastating, textbook swing of the massive sword. Make a Melee attack (+5 To-Hit). If successful, it deals 1d10 +35 Slashing/Cold Wounds. If this attack reduces a target to 0 Wounds, the Knight immediately regains 1 Action as the target's life force is snuffed out.

Vaporous Cleave (Melee Cost: 2 Actions): The Knight drags its blade along the frozen ground before unleashing a wide, upward sweeping arc. Make a Melee attack (+5 To-Hit) against up to three adjacent enemies. On a hit, it deals 1d10 + 35 Slashing Wounds and inflicts the Slowed condition as the freezing black vapor clings to their armor.

Gaze of the Ruined (Cost: 1 Action): The Knight stops and focuses the two piercing points of hateful light directly on a target's eyes. Make a Charisma vs. Willpower check. On a success, the target's mind momentarily breaks; they drop whatever they are holding and lose their next Action, overwhelmed by despair.`},
{name:`Kraken: The Abyssal Titan`,size:`Titanic`,type:`Monstrosity (Aquatic/Titan)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A nightmare of the deep, the Kraken is a monstrosity of writhing tentacles, crushing beaks, and eyes the size of galleons. Existing as a Titanic class entity, its sheer mass warps the battlefield. Its hide is thick enough to snap harpoons, and its immense strength can drag entire warships into the abyss. It does not simply fight its enemies; it acts as a natural disaster, overwhelming them with impossible reach and devastating, sweeping blows. To face the Kraken is to fight the ocean itself.`,agl:`4`,awa:`5`,cha:`1`,int:`3`,phy:`21`,wil:`6`,move:`10/80S`,ap:`12`,def:`9`,wmArmor:`35`,wmBS:`30`,wmDP:`Immune`,wounds:`800`,focus:`+2/6`,reroll:`—`,luck:`—`,meleeHit:`+4`,meleeDmg:`+40/+60`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`10`,mob:`1`,gear:`None`,meleeDetail:`Colossal Tentacles`,rangeDetail:`None`,abilities:`Passive Traits
Siege Monster: The Kraken's attacks bypass all standard Armor Mitigation when striking ships, buildings, or fortifications. It deals double damage to any inanimate structure. Due to its Titanic mass, it is entirely immune to being Grappled, pushed, or knocked Prone by anything smaller than another Titan.

Impossible Reach: The Kraken's massive tentacles allow it to make melee attacks against any target up to 100 feet away from its central body.

Lord of the Depths: The Kraken is immune to Cold damage and the effects of crushing deep-water pressure. It breathes water natively and treats underwater combat as normal terrain, while most mortals suffer severe penalties.

Action-Based Abilities
Sweeping Tentacle (Cost: 3 Actions): A massive tentacle sweeps across the deck of a ship. Make a Melee attack (+4 To-Hit). If successful, it deals 2d10 + 60 Bludgeoning Wounds. (With 12 Actions, the Kraken can unleash a horrifying barrage of these strikes across the entire party).

Crush and Drag (Cost: 2 Actions): A tentacle attempts to wrap around a target. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 40 Bludgeoning Wounds and the target is automatically Grappled. The Kraken immediately pulls the target 50 feet closer to its gaping beak.

Galleon-Crusher Beak (Melee Cost: 3 Actions): The Kraken bites down on a target currently Grappled by a tentacle. Make a Melee attack (+4 To-Hit). On a hit, it deals a staggering 3d10 + 80 Piercing Wounds, instantly shattering armor and bone.`},
{name:`Ledger-Devil: The Soul-Contractor`,size:`Giant`,type:`Fiend / Devil`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A Ledger-Devil is a tall, unnervingly thin Giant dressed in robes made of layered, yellowed parchment—each sheet a contract signed in blood. They have long, multi-jointed fingers perpetually stained with ink, and carry a massive, iron-bound book known as the "Tome of Arrears." Their eyes are replaced by two magnifying lenses fused to their skull, allowing them to see the "debt-weight" of any soul. They find physical combat vile and inefficient. Instead, they fight by imposing metaphysical rules, using verbal traps and "The Fine Print" to paralyze heroes and turn the party's own abilities into liabilities. To them, your life is a loan, and they have come to collect.`,agl:`5`,awa:`8`,cha:`9`,int:`15`,phy:`4`,wil:`12`,move:`40`,ap:`3`,def:`7`,wmArmor:`20`,wmBS:`30`,wmDP:`Immune`,wounds:`250`,focus:`+3/9`,reroll:`3`,luck:`—`,meleeHit:`—`,meleeDmg:`—`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+6`,castDmg:`+40`,castHeal:`—`,castType:`Wizardry`,fear:`7`,mob:`1`,gear:`he Tome of Arrears, Robes of the Damned`,meleeDetail:`Special Abilities`,rangeDetail:`Verbal Traps & Fines`,abilities:`Passive Traits
The Fine Print (Aura of Liability): The Ledger-Devil dictates the rules of engagement. Any time a player within 60 feet attempts to cast a spell, use a magical item, or trigger a special combat ability, they must first surpass Willpower TN 9 + Resist bonus or pay a "tax." If they fail, they instantly take 1d10 Psychic Wounds before the ability activates, as the Devil cites a breach of universal contract.

Vile Inefficiency: The Devil despises physical altercations. Any non-magical Melee attack made against the Ledger-Devil has its Wounds halved automatically, as the kinetic energy is absorbed by the dense, blood-signed parchment of his robes.

Debt-Weight Vision: The magnifying lenses fused to his skull see the exact sins and weaknesses of the party. The Ledger-Devil completely ignores any defensive buffs (like magical shields, evasive stances, or cover) when making a Casting attack.

Action-Based Abilities
Cease and Desist(TN6) (Casting Cost: 1 Action): The Devil speaks a binding legal injunction. Make a Casting attack (+6 To-Hit) against a target within 50 feet. If successful, it deals no Wounds, but the target is Silenced and Stunned for 1 round—metaphysically paralyzed by the weight of infernal bureaucracy. A Willpower(15) test is allowed to resist the effects.

Foreclosure of the Soul(TN13) (Casting Cost: 2 Actions): The Devil reads an extraction clause from the Tome of Arrears. Make a Casting attack (+6 To-Hit) against a target. On a hit, it deals 2d10 + 40 Necrotic Wounds. If this attack reduces a player to 0 Wounds, their soul is instantly bound to a page in the Tome, preventing any form of resurrection until the book is destroyed.

Redistribution of Assets(TN7) (Cost: 1 Action): The Devil exploits a loophole in the party's healing magic. He targets one player who has received healing or a buff this combat. That player must pass a severe Willpower(12) test; on a failure, the healing/buff is instantly stripped from them and granted to the Ledger-Devil or one of his summoned minions instead.`},
{name:`Lesser Treant: The Grove-Warden`,size:`Large`,type:`Plant / Elemental`,tier:`Elite`,tierColor:`#b45309`,desc:`Long before a Treant grows to the towering, earth-shaking heights of the ancient forest lords, they serve as Grove-Wardens. These young, ambulatory trees are roughly the size and shape of a mature oak or weeping willow. They lack the complex, slow-spoken wisdom of their elders, operating instead on a primal, instinctual drive to protect the borders of their sacred groves. When at rest, they are indistinguishable from standard flora. But when an intruder brings an axe or a torch into their domain, the roots tear free from the earth, and the heavy branches swing with the crushing force of a falling timber.`,agl:`—`,awa:`3`,cha:`2`,int:`1`,phy:`5`,wil:`4`,move:`25`,ap:`3`,def:`6`,wmArmor:`25`,wmBS:`10`,wmDP:`Immune`,wounds:`100`,focus:`+1/3`,reroll:`1`,luck:`1`,meleeHit:`+2`,meleeDmg:`+15`,meleeHeal:`—`,rangeHit:`+1`,rangeDmg:`+10`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`3`,mob:`1-4`,gear:`None`,meleeDetail:`Knotted Wooden Fists`,rangeDetail:`Hurled Debris/Hardened Sap/Rocks`,abilities:`Passive Traits
False Canopy: When the Lesser Treant remains motionless, it is entirely indistinguishable from a normal tree. It automatically gains Advantage on any check made to ambush or surprise intruders who enter its grove.

Iron Bark: The dense wood of the Treant turns away glancing blows. It is highly resistant to Piercing damage (arrows, spears), taking half damage from these sources. However, it possesses a severe vulnerability to Fire, taking double damage from all flame-based attacks.

Deep Roots: While standing on natural earth, soil, or grass, the Treant cannot be physically pushed, dragged, or knocked Prone by any creature of Size Large or smaller.

Action-Based Abilities
Timber Sweep (Melee Cost: 1 Action): The Treant swings a heavy, knotted branch. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 15 Bludgeoning Wounds and pushes the target 5 feet backward.

Entangling Roots (Cost: 2 Actions): The Treant plunges its hands into the soil, causing roots to violently erupt beneath a target within 20 feet. The target must surpass Agility TN 7 + Resist bonus or gain the Grappled and Restrained conditions as the roots bind their legs to the earth.

Sticky Sap (Cost: 1 Action): The Treant hurls a glob of hardened, incredibly sticky sap at a nearby enemy. Make a Ranged attack (+1 To-Hit) up to 25 feet. On a hit, the target takes no Wounds, but their weapon or boots become coated, inflicting the Slowed condition until they use an Action to pry the sap off.`},
{name:`Lizardman`,size:`Medium`,type:`LIzardman`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`Standing roughly seven feet tall and built like a brick wall of muscle and scales, the Lizardman is a terrifying apex predator of the marshlands. Classified as a Medium (Med) creature, they rely on pure, unadulterated Physique rather than magical size multipliers. Their thick, crocodilian hides deflect glancing blows, and their powerful tails and jaws make them deadly even if disarmed. They fight with a primal, rhythmic brutality that easily overwhelms lighter infantry.

In combat, they are "patient predators." They can stand perfectly still for hours in a swamp, appearing as nothing more than a mossy log, before exploding into a blur of bronze-tipped spears and crushing jaws. They favor weapons made from obsidian, bone, and "Great-Croc" leather—materials that do not rust in the humid rot of their homes. To a Lizardman, honor is found in the efficiency of the kill; they do not waste breath on threats or boasts.`,agl:`6`,awa:`5`,cha:`2`,int:`1`,phy:`9`,wil:`10`,move:`18`,ap:`3`,def:`8`,wmArmor:`16`,wmBS:`10`,wmDP:`18`,wounds:`80`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+3`,meleeDmg:`+14/+32(2H)`,meleeHeal:`—`,rangeHit:`+2`,rangeDmg:`+14`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`3-12`,gear:`Chain Armor with Shield`,meleeDetail:`1H Ax or Mace`,rangeDetail:`Throwing - Javelin/Spear`,abilities:`Passive Traits
Cold-Blooded: The Lizardman thrives in sweltering jungles and murky swamps, ignoring all difficult terrain penalties in these environments. However, if struck by Ice magic or exposed to freezing environments, they suffer a -2 penalty to their Agility characteristic.

Predator's Lungs: They can hold their breath underwater for up to an hour and suffer absolutely no penalties to their movement speed or melee To-Hit rolls while fighting fully submerged in water.

Thick Scaled Hide: Their natural crocodilian scales function as built-in armor, providing a permanent +3 to their Defense and significant base physical wound mitigation before any shields or skills are even applied.

Action-Based Abilities
Savage Bite (Melee Cost: 1 Action): The Lizardman snaps its massive, tooth-filled maw shut on an enemy. This brutal 1-Handed strike deals an automatic +16 wounds. If the attack roll is an unmodified 10, the target's flesh is torn, causing 1 Bleeding condition.

Brutal Tail Sweep (Melee Cost: 3 Actions): Pivoting sharply, the Lizardman uses its thick, muscular tail as a massive bludgeoning weapon. Because this acts as a 2-Handed heavy impact attack, the damage is doubled. It hits a tight arc, dealing 2d10 + 32 wounds to the target. The victim must pass an surpass Agility TN 7 + Resist bonus or instantly suffer the Prone condition.

Swamp Hunter's Javelin (Range Cost: 1 Action): Rearing back, the Lizardman hurls a heavy, barbed spear. As a thrown weapon, it combines half of their Agility and half of their Physique for the damage calculation, resulting in a heavy +14 wounds on impact.`},
{name:`Magma-Caller (The Vein-Witch)`,size:`Medium`,type:`Pyreborn / Caster`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`"A sight of terrible beauty, often older than the Vanguards. Her skin is almost entirely translucent in places, revealing the brilliant, flowing copper-gold of her 'Sun-Blood' beneath. Wearing robes of woven asbestos-fiber and obsidian plates, she carries a Core-Staff tipped with a smoking 'Primordial Spark.' In battle, she is slow and stationary, acting as a literal 'Hearth' for her people, reshaping the battlefield by raising walls of cooling slag and opening fissures that spew toxic gases. To a Magma-Caller, the enemy is not a person, but an 'impurity' in the landscape that must be smelted away."

(Often guarded by Thralls or Warriors)`,agl:`6`,awa:`4`,cha:`5`,int:`15`,phy:`3`,wil:`9`,move:`20`,ap:`4`,def:`6`,wmArmor:`7`,wmBS:`10`,wmDP:`10`,wounds:`42`,focus:`+4/12`,reroll:`2`,luck:`1`,meleeHit:`+2`,meleeDmg:`+10`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+6`,castDmg:`+37`,castHeal:`—`,castType:`Wizardry`,fear:`—`,mob:`1`,gear:`Woven Asbestos Robes, Core-Staff (Primordial Spark)`,meleeDetail:`Core-Staff Strike (+2)`,rangeDetail:`None`,abilities:`Passive Traits
The Living Hearth: The Magma-Caller is the spiritual and literal fire of her people. Allied Pyreborn within 30 ft gain +2 to their WM-B/S (Wounds Mitigation - Bless/Spell) and add +2 to their Melee Wounds from the ambient, empowering heat. She is completely immune to Fire and Heat damage.

Sun-Blood Spatter: Her translucent skin barely contains her superheated copper-gold blood. Anytime she suffers Melee Wounds, her skin ruptures, spraying the attacker with boiling fluid. The attacker instantly takes 6 Fire Wounds and gains 1 Bleeding (Burn) condition.

Smelt the Impurity: Her pyromancy burns so intensely that it melts physical defenses. Her spells automatically ignore the first 5 points of a target's WM-Blessing/Spells.

Actions
Primordial Spark(TN7) - (Casting Cost: 1): Points her Core-Staff, unleashing a concentrated beam of white-hot energy. Deals normal 1d10 + 37 Casting Wounds. On an unmodified 9 or 10 on the To-Cast roll, the target's armor fuses, permanently reducing their WM-Arm by 1 for the remainder of the battle.

Fissure of Toxic Slag(TN10) - (Casting/Area Cost: 2): Tears the ground open in a 30 ft line directly in front of her. Enemies caught in the path must make an Agility(8) Test or take 1d10 + 37 Casting Wounds and become trapped in the rapidly cooling slag, reducing their Movement to 0 for 1 turn. The fissure remains as a permanent line of impassable difficult terrain.

Vent the Core(TN11) - (Area Cost: 2): Releases a massive, hissing cloud of toxic, superheated volcanic gas in a 20 ft radius around herself. All enemies in the cloud must make a Physique(12) Test or take half her Casting Wounds 1d10 + 19 and gain the Poisoned condition, suffering 1d10 Wounds at the start of their next 2 turns from scorched lungs.`},
{name:`Manticore`,size:`Giant`,type:`Wild Beast`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A blasphemous fusion of beasts, the Manticore possesses the muscular body of a massive dire lion, the leathery wings of a dragon, and a grotesque, almost human-like face boasting three rows of razor-sharp teeth. Protruding from its hindquarters is a segmented, chitinous scorpion tail dripping with caustic black venom. As a Large (Lg) creature, it uses its immense physical power and flight to isolate and destroy prey, savoring the terror it inflicts just as much as the flesh it consumes.`,agl:`9`,awa:`5`,cha:`4`,int:`3`,phy:`15`,wil:`6`,move:`35/80F`,ap:`3`,def:`9`,wmArmor:`14`,wmBS:`6`,wmDP:`19`,wounds:`250`,focus:`+1/3`,reroll:`2`,luck:`1`,meleeHit:`+6`,meleeDmg:`+24`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+22`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`4`,mob:`1-2`,gear:`Random`,meleeDetail:`Bite, Claw, Tail, Special Abilities`,rangeDetail:`Special Abilities`,abilities:`Passive Traits
Winged Terror: The Manticore is a natural flyer. While airborne, it ignores all ground-based difficult terrain and gains a +1 bonus to its Defense against standard melee attacks from ground-bound enemies.

Scent of Blood: It can smell open wounds from up to a mile away. If any creature within 100 feet is suffering from a Bleeding condition, the Manticore gains advantage on all Awareness tests to track or locate them.

Frightful Presence: The grotesque, human-like face and unnatural roars of the Manticore are deeply unsettling. Any living creature that begins its turn within 40 feet must pass a surpass Willpower TN 7 + Resist bonus or suffer a -1 penalty to their +To-Hit rolls due to fear.

Action-Based Abilities
Triple-Rowed Maw (Melee Cost: 1 Action): The Manticore lunges forward, sinking its three rows of jagged teeth into its prey. Fueled by its high Physique and magnified by its Large size, this bite deals a devastating +24 wounds. On an unmodified 10, it tears the flesh, inflicting 2 Bleeding conditions.

Caustic Tail Sting (Melee Cost: 1 Action): Whipping its scorpion tail overhead in a blindingly fast strike, it pierces armor with ease, dealing +24 wounds. The victim must pass a surpass Physique TN 7 + Resist bonus or instantly suffer 1 Poison condition, taking additional damage each turn.

Volley of Spikes (Range Cost: 2 Actions): With a violent snap of its tail, the Manticore launches a spread of heavy, venomous chitin spikes. Treating this as a thrown weapon, it combines half its Agility and half its Physique, multiplied by its size, to deal +22 piercing wounds.`},
{name:`Midnight-Hound (Shadow Stalker)`,size:`Large`,type:`Shadow / Beast`,tier:`Elite`,tierColor:`#b45309`,desc:`The Gloom-Tracker
A terrifying distortion of a canine form. Standing nearly 4 feet at the shoulder, their bodies are elongated and hairless, covered in skin like wet, black leather. Lacking eyes entirely, their skull is a sleek, armored plate of bone. They hunt via sensitive, vibrating pits that detect the "heat" of a soul and the vibration of a heartbeat. They don't growl; instead, they emit a synchronized, low-frequency hum felt deep in the marrow, hunting with liquid precision to bleed their prey dry.`,agl:`9`,awa:`6`,cha:`3`,int:`1`,phy:`5`,wil:`4`,move:`40`,ap:`3`,def:`7`,wmArmor:`10`,wmBS:`8`,wmDP:`15`,wounds:`85`,focus:`+1/3`,reroll:`1`,luck:`1`,meleeHit:`+2`,meleeDmg:`+20`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`3`,mob:`1d8+2`,gear:`None`,meleeDetail:`Jagged Maw. Strikes deal a base of 60 Wounds `,rangeDetail:`None`,abilities:`Passive Traits
Soul-Scent & Tremorsense: Because the Hound has no eyes, it is completely immune to all visual illusions, blinding effects, and gaze attacks. Instead, it tracks the heat of a soul and the thumping of a heartbeat. Invisibility and magical darkness are completely useless against it. The only way to hide from a Midnight-Hound is to magically stop your own heart or suppress your soul's signature.

Liquid Pack-Tactics: The hounds move with synchronized, hive-mind-like precision. If a Midnight-Hound is adjacent to an ally Hound, they both gain Advantage on their To-Hit rolls. Furthermore, they can move through each other's spaces without colliding or suffering movement penalties, weaving around prey like black water.

Bone-Plated Skull: The top and front of the Hound's head is a solid, sloped plate of armored bone. Any physical ranged attacks (arrows, bolts) targeting the Hound from the front have a 50% chance to seamlessly glance off the armor plate, dealing exactly 0 Wounds.

Action-Based Abilities
The Bleed (Melee Cost: 1 Action): A specialized, darting bite aimed explicitly at the hamstrings and heels of fleeing prey. Make a melee attack at +2 To-Hit. Instead of dealing full damage, this attack deals half wounds (+10 Wounds), but instantly inflicts 2 Bleeding conditions. Additionally, the target's Movement speed is halved on their next turn.

Marrow Hum (Cost: 2 Actions): The Hound vibrates its throat and chest cavity, emitting a low-frequency hum that bypasses hearing and directly shakes the bones of nearby prey. All enemies within a 30-foot radius must surpass Physique TN 9 + Resist bonus. On a failure, the vibrating agony causes them to suffer 1 Fatigued condition, and they lose 1 Action on their next turn as their muscles violently cramp.

Drag Down (Melee Cost: 2 Actions): The Hound leaps, attempting to clamp its jaws onto a target's limb or throat to pin them for the rest of the pack. Make a melee attack; if successful, it deals normal 1d10 + 60 Melee Wounds and the target must immediately pass a severe Physique(8) test. If the target fails, they are violently pulled to the ground, gaining the Prone condition, and are considered Grappled by the Hound, unable to use movement actions until they break the Hound's grip.`},
{name:`Minotaur: The Labyrinthine Terror`,size:`Large`,type:`Monstrosity`,tier:`Elite`,tierColor:`#b45309`,desc:`A towering monstrosity standing over ten feet tall, the Minotaur possesses the heavily muscled body of a giant and the ferocious head of a primordial bull. As a Large creature, the Minotaur moves with a terrifying, thundering momentum that belies its sheer bulk. They are rarely found in the open, preferring to stalk the shadowed corridors of ancient ruins, catacombs, and cursed labyrinths where their prey has no room to escape. A Minotaur does not just kill; it demolishes, using massive weapons and its own thick-skulled horns to batter victims into unrecognizable pulp.`,agl:`4`,awa:`6`,cha:`2`,int:`—`,phy:`9`,wil:`5`,move:`30`,ap:`3`,def:`5`,wmArmor:`18`,wmBS:`10`,wmDP:`25`,wounds:`140`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+4`,meleeDmg:`+27/+54(2H)`,meleeHeal:`—`,rangeHit:`+4`,rangeDmg:`+21`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`4`,mob:`1-4`,gear:`Massive Rust-Pitted Greataxe, Iron Nose Ring`,meleeDetail:`Massive Greataxe / Horns`,rangeDetail:`Throwing Weapon`,abilities:`Passive Traits
Claustrophobic Hunter: The Minotaur excels in tight spaces. While fighting in indoor corridors, catacombs, or alleys no wider than 15 feet, it gains a permanent +1 to its Defense as it uses its massive bulk to completely block the passage.

Labyrinthine Recall: The Minotaur possesses a supernatural sense of direction. It can perfectly recall any path it has traveled and is completely immune to magical effects that cause confusion, spatial displacement, or maze-like entrapment.

Unstoppable Momentum: If the Minotaur moves at least 15 feet in a straight line before making a melee attack, it gains a +2 bonus to its +To-Hit roll and ignores the first 3 points of the target's physical armor mitigation.

Thick-Hided Brute: The dense muscle and matted fur covering the Minotaur grant it an exceptional resistance to pain. It is completely immune to the Bleeding condition from standard slashing weapons.

Action-Based Abilities
Shattering Greataxe (Melee - Cost: 2 Actions): Wielding a monstrous, rusted iron greataxe, the Minotaur delivers a horrific, sweeping blow. As a 2-Handed weapon multiplied by its Large size, this devastating strike deals a massive +54 wounds. If the target attempts to block with a shield, the shield is shattered on an unmodified 9 or 10.

Gore and Toss (Melee Cost: 2 Actions): The Minotaur lowers its head and drives its thick horns upward into a target. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 40 Piercing Wounds, and the target must surpass Physique TN 9 + Resist bonus or be violently tossed 15 feet backward and knocked Prone.

Goring Charge (Melee - Cost: 1 Action): Lowering its head, the Minotaur rams its blood-stained horns into a target. This natural attack deals a brutal 1d10 +27 wounds. The sheer force of the impact requires the victim to surpass Physique TN 10 + Resist bonus or immediately suffer the Prone and Stunned conditions.

Deafening Bellow (Tactical - Cost: 1 Action): Beating its chest, the Minotaur unleashes a guttural, terrifying roar that echoes through the corridors. All enemy creatures within a 40-foot radius must surpass Willpower TN 12 + Resist bonus or suffer a -2 penalty to their Defense and Agility until the end of their next turn as panic sets in.`},
{name:`Mountain Giant: The Earth-Shaker`,size:`Enormous`,type:`Giant / Elemental`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Dwarfing their Hill Giant kin, Mountain Giants are walking geographical features. Standing upwards of 40 feet tall, their skin is heavily calcified, resembling jagged granite crags interwoven with thick, root-like veins. They do not wear armor; they simply allow the earth and stone to fuse with their flesh. Sluggish but apocalyptically powerful, they smell of ozone, crushed minerals, and deep-earth dampness, wielding uprooted monoliths as casually as a man wields a club.`,agl:`1`,awa:`6`,cha:`—`,int:`2`,phy:`18`,wil:`12`,move:`40`,ap:`3`,def:`8`,wmArmor:`30`,wmBS:`20`,wmDP:`Immune`,wounds:`450`,focus:`+1/3`,reroll:`1`,luck:`—`,meleeHit:`+6`,meleeDmg:`+40/+100(2H)`,meleeHeal:`—`,rangeHit:`+2`,rangeDmg:`+40`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`8`,mob:`1`,gear:`Uprooted Stone Monolith`,meleeDetail:`Stone Monolith`,rangeDetail:`Hurled Crag`,abilities:`Passive Traits
Tectonic Footing: The Mountain Giant is quite literally rooted to the earth. It is completely immune to the Prone, Knockback, Grappled, and Restrained conditions. Furthermore, any ground within 60 feet of the giant becomes severe Difficult Terrain as the earth splinters and shifts under its sheer weight.

Granite Carapace: Blades simply chip against its calcified flesh. Any physical Melee attack that deals Slashing or Piercing Wounds has its damage halved before it even reaches the Giant's massive 30 Armor Mitigation.

Granite Hide: Non-magical weapons that roll a Critical Failure (1 on the d10) when striking the Giant's Defense immediately shatter against its stone-like flesh.

Tremorsense: Smelling of ozone and deep-earth dampness, the Giant tracks its prey through the soil. It completely ignores visibility penalties from darkness, fog, or invisibility as long as the target is touching the ground within 120 feet.

Action-Based Abilities
Avalanche Stomp (Cost: 1 Action): The Giant raises a massive, rocky foot and brings it down on a specific target area. Make a Melee attack (+6 To-Hit) targeting a 10-foot radius. On a hit, it deals 1d10 + 40 Bludgeoning Wounds to anyone caught underneath.

Monolith Sweep (Melee Cost: 2 Actions): The Giant casually swings its massive stone pillar. Make a Melee attack (+6 To-Hit) with a 30-foot reach. If successful, it deals 1d10 + 100 Bludgeoning Wounds. Targets struck must pass a severe Agility(10) test or be launched 30 feet through the air, taking additional falling damage.

Geological Upheaval (Cost: 2 Actions): The Giant slams both fists into the earth, triggering a catastrophic shockwave. All ground-bound enemies within a 60-foot radius must surpass Physique TN 11 + Resist bonus. On a failure, they take 4d10 + 40 Bludgeoning Wounds, are knocked Prone, and become Deafened by the booming thunder of cracking bedrock.

Crag Bombardment (Range Cost: 2 Action): The Giant rips a massive chunk of granite from its own calcified body or the surrounding earth and hurls it. Make a Ranged attack (+2 To-Hit) against a 20-foot radius area up to 100 feet away. On a hit, it deals 1d10 + 40 Bludgeoning Wounds to all targets in the zone.`},
{name:`Mummy: The Cursed Sovereign`,size:`Medium`,type:`Undead`,tier:`Elite`,tierColor:`#b45309`,desc:`Awakened from a millennial slumber, the Mummy is a terrifying testament to ancient burial rites and forbidden necromancy. Existing as a Medium creature, it is entirely wrapped in hardened, resin-soaked linens and adorned with tarnished, cursed gold. It does not sprint or charge; instead, it marches with a slow, terrifying inevitability. The true horror of the Mummy lies not just in its supernatural physical strength, but in the potent, rotting curses that radiate from its desiccated form. To breathe the air around it is to feel your lungs fill with tomb dust and your lifeforce begin to wither.`,agl:`2`,awa:`4`,cha:`9`,int:`3`,phy:`6`,wil:`5`,move:`18`,ap:`3`,def:`5`,wmArmor:`10`,wmBS:`15`,wmDP:`Immune`,wounds:`85`,focus:`+2/6`,reroll:`—`,luck:`—`,meleeHit:`+4`,meleeDmg:`+18`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`+20`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`Necromantic`,fear:`7`,mob:`1-3`,gear:`Tarnished Gold Adornments, Cursed Khopesh (Hooked Sword)`,meleeDetail:`Supernatural Slam / Cursed Khopesh`,rangeDetail:`Breath`,abilities:`Passive Traits
Undead Constitution: As an animated, preserved corpse devoid of blood or organs, the Mummy is entirely immune to the Bleeding, Disease, and Poison conditions.

Desiccated Form: The centuries-old, dried linens and alchemical resins that preserve the creature make it incredibly flammable. The Mummy takes double damage from all Fire-based magic and weaponry.

Rotting Aura (The Millennial Curse): The Mummy’s 9 Charisma radiates a lethal curse. Any living creature that ends its turn within 10 feet of the Mummy must pass a surpass Willpower TN 7 + Resist bonus or suffer the Weakened condition, instantly halving their Physical stat and Melee Wounds for their next turn as their muscles temporarily wither.

Action-Based Abilities
Breath of the Tomb (Range Cost: 2 Actions): The Mummy unhinges its jaw and exhales a 15-foot cone of choking tomb dust and flesh-eating scarabs. All enemies in the area must surpass Physique TN 7 + Resist bonus or take 1d10 + 20 Piercing/Necrotic Wounds and gain the Blinded condition for 1 round as their eyes and lungs fill with grit.

Desiccating Slam (Melee Cost: 1 Action): A brutal, heavy-handed strike. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 18 Bludgeoning Wounds. If this attack deals damage, the Mummy heals 5 Wounds as it siphons the moisture and vitality from the target's flesh.

Gaze of the Sovereign (Cost: 1 Action): The Mummy locks its hollow, glowing eye sockets onto a target within 30 feet. Make a Charisma vs. Willpower check. On a success, the target's mind is overwhelmed by millennial dread; they drop whatever they are holding and gain the Paralyzed condition until the end of their next turn.

Khopesh of the Sands (Melee - Cost: 2 Actions): Drawing a massive, crescent-shaped ceremonial blade, the Mummy executes a heavy, two-handed executioner's swing. This devastating strike doubles its unnatural strength to deal an uncompromising 1d10 + 32 wounds. The target must surpass Physique TN 9 + Resist bonus or be knocked Prone by the sheer force of the blow.

Rotting Grasp (Melee - Cost: 1 Action): The Mummy reaches out with a decaying, heavily bandaged hand, channeling the physical weight of centuries. This relentless 1-Handed strike crushes armor and bone, dealing a +18 wounds. If the attack roll is an unmodified 10, the dark magic clinging to its hands inflicts 1 Disease condition, bypassing normal immunities.`},
{name:`Nightmare Butcher (Shadow Stalker)`,size:`Large`,type:`Shadow / Monstrosity`,tier:`Elite`,tierColor:`#b45309`,desc:`The Sightless Carver
Deep in the most gore-stained corners of the wild or the lightless damp of urban slaughterhouses dwells the Nightmare Butcher. A grotesque masterpiece of anatomical horror, it is a towering, four-armed mass of slab-like muscle. Its face is a smooth, sloping expanse of pale, scarred flesh with no eyes. Its primary arms grip rusted cleavers with bone-crushing strength, while secondary tentacle-like appendages snake out from its ribs to pin prey. Despite its bulk, it moves in nauseating, fluid silence, sliding through shadows like spilled oil.`,agl:`5`,awa:`4`,cha:`—`,int:`—`,phy:`9`,wil:`3`,move:`25`,ap:`4`,def:`6`,wmArmor:`15`,wmBS:`10`,wmDP:`20`,wounds:`125`,focus:`+2/6`,reroll:`1`,luck:`1`,meleeHit:`+3`,meleeDmg:`+25`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`6`,mob:`1-3`,gear:`Twin Rusted Cleavers / Pitted Axes.`,meleeDetail:`Cleaver Chop. Strikes`,rangeDetail:`None`,abilities:`Passive Traits
Scent of Copper & The Thumping Drum: The Butcher has no eyes, rendering it completely immune to visual illusions, magical darkness, and blinding effects. It "sees" through tremorsense and the smell of blood. If a creature has a beating heart or is currently suffering from a Bleeding condition, they cannot gain the benefits of Stealth or Invisibility against the Butcher within 100 feet.

Abyssal Stealth (Spilled Oil): Despite its towering bulk, the Butcher makes absolutely no sound when it moves. It can slide seamlessly through the shadows, allowing it to move through spaces occupied by other creatures without penalty. If it initiates combat from darkness, enemies suffer Disadvantage on their Initiative rolls.

Asymmetrical Anatomy: Because its secondary rib-tentacles operate independently of its primary cleaver-wielding arms, the Butcher does not suffer any penalties for fighting multiple opponents. It can maintain a grapple on up to two different targets while still swinging its cleavers at full strength.

Action-Based Abilities
Tentacle Snare (Melee Cost: 1 Action): The Butcher lashes out with the fluid, prehensile appendages. Make a melee attack (+3 To-Hit) with a 10-foot reach. If successful, this deals no Wounds, but the target is instantly Grappled. A grappled target has their Movement reduced to 0, and the Butcher can freely drag them along as it moves.

The Silent Chop (Melee Cost: 1 Action): The Butcher brings its rusted cleavers down in a brutal, quiet arc. Make a melee attack (+3 To-Hit). If successful, it deals normal 1d10 + 25 Wounds. If the target is currently Grappled by the Butcher's tentacles, the Butcher gains Advantage on this attack and automatically inflicts 1 Bleeding condition as it saws into the pinned meat.

Meat-Grinder Maelstrom (Melee Cost: 3 Actions): The Butcher spins its massive frame, lashing out with rusted axes, cleavers, and grasping tentacles in a whirlwind of gore. The Butcher makes a single +3 To-Hit roll, applying the result against the Defense of all enemies within 10 feet. Any enemy hit suffers 2d10 + 60 Wounds, is pushed 5 feet away, and suffers 1 Bleeding condition. This violently severs any grapples it currently holds, tossing the carved victims aside.`},
{name:`Ogre`,size:`Large`,type:`Hmanoid`,tier:`Elite`,tierColor:`#b45309`,desc:`A mountain of grotesque fat, matted hair, and slab-like muscle, the Ogre is driven by a single, overriding instinct: an insatiable, endless hunger. Standing nearly ten feet tall, it easily falls into the Large (Lg) size category. While they lack the tactical cunning of a Minotaur or the martial discipline of a Lizardman Chieftain, Ogres are walking siege engines of pure, blunt force. They do not wear forged armor, relying instead on rolls of thick, leathery blubber that easily swallow the blades of standard swords.`,agl:`1`,awa:`4`,cha:`2`,int:`—`,phy:`9`,wil:`6`,move:`24`,ap:`3`,def:`5`,wmArmor:`20`,wmBS:`10`,wmDP:`30`,wounds:`150`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+4`,meleeDmg:`+27/+54(2H)`,meleeHeal:`—`,rangeHit:`+2`,rangeDmg:`+21`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`3`,mob:`1-5`,gear:`Uprooted Tree Trunk / Massive Splintered Club`,meleeDetail:`Massive Club`,rangeDetail:`Throwing Debris/Rocks`,abilities:`Passive Traits
Frenzied Hunger: The scent of fresh blood drives the Ogre into a feeding frenzy. If an enemy within 30 feet suffers a Bleeding condition, the Ogre gains a +2 bonus to its Movement and +To-Hit rolls as it recklessly charges toward its next meal.

Iron Stomach: An Ogre will eat absolutely anything, from rotting carrion to rusted metal armor. Because of this horrific diet, they are completely immune to ingested poisons and any Disease conditions.

Momentum of the Maw: The Ogre treats all characters of Size Medium or smaller as difficult terrain, meaning it can simply walk through their spaces by making an opposed Physical check to shove them aside.

Thick Blubber: The dense layers of fat and gristle beneath the Ogre's skin act as exceptional natural mitigation. They ignore the first 3 points of damage from any standard piercing or blunt weapon attack.

Action-Based Abilities
Belly Slam (Melee Cost: 1 Action): The Ogre surges forward and weaponizes its own grotesque mass. Make a Melee attack (+4 To-Hit). On a hit, it deals 1d10 + 20 Bludgeoning Wounds and the target must surpass Agility TN 7 + Resist bonus or be violently knocked Prone and flattened under its weight.

Devour (Melee Cost: 2 Actions): The Ogre grabs a Prone or Grappled target and attempts to take a massive bite out of them. Make a Melee attack (+6 To-Hit). On a hit, it deals 35 Piercing Wounds. If this deals damage, the Ogre immediately heals 15 Wounds as it consumes the fresh meat.

Uprooted Tree (Melee - Cost: 2 Actions): Wielding a massive, splintered log or a crude club made of stone and iron bands, the Ogre brings it down with devastating, uncontrolled force. As a 2-Handed weapon multiplied by its Large size, this catastrophic slam deals 1d10 + 54 wounds. Any target struck by this must surpass Physique TN 10 + Resist bonus or instantly be knocked Prone and suffer 1 Stunned condition.

Bone-Snapping Bite (Melee - Cost: 1 Action): Dropping its weapon or grabbing a target with one massive hand, the Ogre attempts to take a massive bite out of its prey. This natural attack deals 1d10 + 20 wounds. If the attack roll is an unmodified 10, the sheer trauma of the bite inflicts 2 Bleeding conditions.

Heave Debris (Range - Cost: 1 Action): Digging its massive, filth-caked fingers into the earth, the Ogre rips up a boulder or a chunk of masonry and hurls it. Calculating its half-Agility and half-Physique, multiplied by its Large size, this heavy projectile deals 1d10 +21 wounds on impact.`},
{name:`Oracle of Third Eye (Mystic)`,size:`Small`,type:`Humanoid / Caster`,tier:`Minion`,tierColor:`#6b7280`,desc:`A diminutive, floating mystic with three glowing eyes that rarely blinks. Being Small, it is incredibly difficult to hit, and it uses highly specialized magic to control the battlefield rather than relying on raw physical strength.`,agl:`4`,awa:`5`,cha:`3`,int:`9`,phy:`2`,wil:`6`,move:`25`,ap:`4`,def:`11`,wmArmor:`3`,wmBS:`2`,wmDP:`—`,wounds:`10`,focus:`+4/12`,reroll:`2`,luck:`2`,meleeHit:`—`,meleeDmg:`—`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+4`,castDmg:`+29`,castHeal:`—`,castType:`Wizardry`,fear:`—`,mob:`1-3`,gear:`Gilded Silks, Talisman of the Third Eye`,meleeDetail:`None`,rangeDetail:`None`,abilities:`Passive Traits
Foresight: The Oracle's third eye glimpses attacks before they happen. It forces any attacker rolling a natural 10 on a To-Hit against it to reroll the attack once per turn.

Aura of the Triad: Any ally within 15 ft of the Oracle gains +1 to their Willpower characteristic and +1 to their WM-B/S (Wounds Mitigation - Bless/Spell).

Ethereal Float: The Oracle ignores all ground-based hazards, traps, and difficult terrain, hovering silently above the battlefield.

Actions
Mind Fracture(TN5) (Casting Cost: 1): Targets one enemy within 60 ft. The target must make a Willpower Save (vs Int 7). On a failure, they take 10 Wounds and gain the Confused condition, forcing them to move in a random direction on their next turn.

Three-Fold Ward(TN8) (Casting Cost: 2): The Oracle places a glowing triangular ward on an ally. The next three times that ally takes damage, the damage is reduced by 10.

Glimpse of the Void (Area Cost: 3): The Oracle opens its third eye fully, projecting a 30 ft cone of psychic agony. All enemies in the cone take 3d10 + Casting Wounds (10) and lose 1 Action on their next turn due to mental shock.`},
{name:`Orc: Green Tide Grunt`,size:`Medium`,type:`Humanoid (Orc)`,tier:`Minion`,tierColor:`#6b7280`,desc:`Before an Orc earns their scars and bulks up into a frontline terror, they start as Grunts. Smaller, leaner, and constantly bullied by their larger kin, Grunts form the rushing, chaotic vanguard of the Green Tide. They are clad in the rusted, discarded scraps of previous campaigns and wield crudely sharpened choppers. Individually, a Grunt is a sloppy, reckless combatant who relies on wild swings rather than martial discipline. However, they are rarely encountered alone; they swarm the battlefield in shouting, spit-flying mobs, eager to kill a hero and claim the gear needed to elevate their rank in the warband.`,agl:`2`,awa:`1`,cha:`—`,int:`—`,phy:`4`,wil:`3`,move:`15`,ap:`2`,def:`5`,wmArmor:`10`,wmBS:`5`,wmDP:`10`,wounds:`25`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+1`,meleeDmg:`+8`,meleeHeal:`—`,rangeHit:`+1`,rangeDmg:`+4`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`5-20`,gear:`Rusted Chopper, Splintered Wood Shield, Stolen Trinkets.`,meleeDetail:`Rusted Chopper`,rangeDetail:`Crude Spear or Rock`,abilities:`Passive Traits
Mob Bravery: The Grunt is a coward when isolated. If it is not standing within 15 feet of at least one other allied Orc, it suffers a negative modifier to its Willpower(-1) tests. However, when adjacent to an allied Orc, it automatically gains Advantage on checks made to resist the Shaken condition.

Expendable Fodder: The Grunt is completely worthless to the warband's hierarchy. When a Grunt is killed, it does not trigger any morale checks or panic in allied Orcs. In fact, larger Orcs can move freely through a Grunt's space by physically shoving them aside.

Reckless Charge: When the Grunt uses a Movement action to move at least 15 feet directly toward a target, its first Melee attack that turn deals an additional 3 Slashing Wounds due to its wild momentum.

Action-Based Abilities
Wild Hack (Melee Cost: 1 Action): A sloppy, wide swing with its rusted chopper. Make a Melee attack (+1 To-Hit). If successful, it deals 1d10 + 8 Slashing Wounds.

Shield Bash (Melee Cost: 1 Action): The Grunt thrusts its splintered wooden shield forward to create space. Make a Melee attack (+1 To-Hit). On a hit, it deals 3 Bludgeoning Wounds and physically pushes the target 5 feet away.

Scavenger's Throw (Range Cost: 1 Action): The Grunt hurls whatever is handy—a jagged rock, a broken spear, or a handful of dirt. Make a Ranged attack (+1 To-Hit). On a hit, it deals 1d10 + 4 Bludgeoning Wounds and the target is mildly distracted, giving the next allied Orc to attack them Advantage on their To-Hit roll.`},
{name:`Owlbear: The Silent Ravager`,size:`Large`,type:`Monstrosity`,tier:`Elite`,tierColor:`#b45309`,desc:`A furious, lumbering mass of feathers, fur, and muscle. It hunts with eerie silence in the dark, closing the distance before unleashing a flurry of armor-rending claws and a bone-crushing beak. A terrifying, heavily muscled apex predator, the Owlbear combines the crushing physical strength of a bear with the silent ferocity and acute senses of a giant owl. Because it is Large, its physical capabilities are significantly multiplied, allowing it to snap the spines of forest intruders as easily as dry kindling.`,agl:`5`,awa:`6`,cha:`—`,int:`1`,phy:`9`,wil:`4`,move:`25`,ap:`3`,def:`4`,wmArmor:`9`,wmBS:`19`,wmDP:`20`,wounds:`90`,focus:`—`,reroll:`1`,luck:`—`,meleeHit:`+4`,meleeDmg:`+24`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1-2`,gear:`None`,meleeDetail:`Armor-Rending Claws / Bone-Crushing Beak`,rangeDetail:`None`,abilities:`Passive Traits:
Armor-Rending: The Owlbear's claws are designed to peel bark and bone. Any time it rolls a Critical Hit with a Melee attack, it permanently reduces the target’s WM-Arm (Armor Mitigation) by 3 as it shreds through their protection.

Frenzied Bloodlust: When the Owlbear is reduced below half of its total Wounds (45), it flies into a rage. Its Melee To-Hit increases to +1, and it ignores 1 point of Armor Mitigation on all targets it strikes.

Silent Approach: Despite its massive size, its owl-like feathers absorb sound. The Owlbear's first attack in any combat encounter gains a +3 To-Hit bonus if it moved at least 20 ft from a flanking or hidden position.

Action Based Abilities
Crushing Beak (Cost: 1 Action): A devastating bite aimed at a vital area. Make a Melee attack (+4 To-Hit). If successful, it deals 24 Piercing Wounds and ignores 5 points of the target's WM-Arm.

Tearing Flurry (Melee Cost: 2): A coordinated assault of swiping claws and a snapping beak. Deals normal 1d10 + 24 Melee Wounds and forces the target to make a Physique(8) Test. On a failure, the target gains 1 Bleeding condition.

Crushing Bear Hug - (Melee Cost: 1): Can only be used on a target struck by the Tearing Flurry in the same turn. The Owlbear grapples the target, automatically dealing 2x Physique Wounds (18) and rendering the target Prone and Grappled.

Piercing Screech - (Area Cost: 1): Unleashes a deafening, terrifying hoot-roar. All enemies within 30 ft must make a Willpower(7) Test or suffer 1 Stunned condition and be Deafened (Disadvantage on communication/awareness) for 2 turns.`},
{name:`Pit Fiend: General of the Damned`,size:`Giant`,type:`Fiend (Devil / Boss)`,tier:`Boss`,tierColor:`#b91c1c`,desc:`The ultimate general of the infernal armies. A towering, winged monstrosity of hardened scales and roaring hellfire. As a Giant-sized creature with incredibly high Intellect, Willpower, and Physique, it dominates both physical combat and dark magic seamlessly. Wrapped in a cloak of literal hellfire and wielding a massive mace forged from the souls of the damned, the Pit Fiend is a master of dark strategy and brutal subjugation. It does not just kill; it conquers. To face a Pit Fiend is to stand against the organized, inevitable march of Hell itself.`,agl:`3`,awa:`5`,cha:`6`,int:`18`,phy:`12`,wil:`9`,move:`35/60F`,ap:`4`,def:`13`,wmArmor:`30`,wmBS:`25`,wmDP:`Immune`,wounds:`266`,focus:`+3/9`,reroll:`2`,luck:`1`,meleeHit:`+6`,meleeDmg:`+40/+90(2H)`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+5`,castDmg:`+36`,castHeal:`—`,castType:`Wizardry`,fear:`9`,mob:`1`,gear:`Hell-Forged Plate, The Scourge Mace, Cloak of Hellfire`,meleeDetail:`Scourge Mace Strike (+3)`,rangeDetail:`None`,abilities:`Passive Traits
Aura of the Inferno: The air around the Pit Fiend is superheated. Any enemy that ends its turn within 15 feet of the Fiend automatically takes 10 Fire Wounds. The Fiend itself is completely immune to Fire and Poison damage.

Cloak of Hellfire (Aura): The Pit Fiend is wreathed in literal, roaring hellfire. Any creature that ends its turn within 15 feet of the Fiend, or successfully strikes it with a Melee weapon, automatically takes 10 Fire Wounds.

Diabolical Mind: With a 18 Intellect and 9 Willpower, the Pit Fiend is immune to all Charm, Fear, and Mind-Altering conditions. Furthermore, any spell cast at it with a To-Cast roll of less than 5 automatically fizzles out.

Lord of the Pit: Allied Fiends or Cultists within 60 feet gain a +2 bonus to their Melee To-Hit and share the Pit Fiend's Fear immunity, driven by their absolute terror of their master.

Action Based Abilities
Executioner's Toll (Melee Cost: 1 Action): A brutal, calculated swing with its massive mace. Make a Melee attack (+6 To-Hit). If successful, it deals 1d10 + 40 Bludgeoning/Necrotic Wounds. If this attack drops a target to 0 Wounds, their soul is instantly pulled into the mace, healing the Fiend for 20 Wounds.

Hellfire Mace (Melee Cost: 2 Actions): A crushing blow with its massive weapon. Deals normal 1d10 + 90 Melee Wounds. On an unmodified To-Hit roll of 9 or 10, the target must make a Physique(10) Save or gain 1 Stunned condition and 1 Bleeding condition.

Word of Damnation(TN10) (Casting Cost: Actions 2): Speaks a word of pure dark magic at a target within 100 feet. The target must make a Willpower(13) Test. On a failure, they take 2d10 + 36 Casting Wounds, and the Pit Fiend heals for 5 Wounds as it leeches their life force.

Infernal Command - (Area/Summon Cost: 3): Tears open a momentary rift to the hellscape. The Pit Fiend summons 1d10 Lesser Devils (use standard Imp or Cultist stats) to immediate adjacent spaces. These summoned creatures can act on the next turn.`},
{name:`Plague Rat Swarm`,size:`Large`,type:`Swarms`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`A seething, biting, chittering carpet of diseased rodents. They do not fight with tactics or strategy; they simply overwhelm by sheer numbers, tearing at armor gaps, climbing up legs, and spreading infectious filth.

"Individually weak, but collectively a nightmare. A Rat Swarm moves as a single, fluid entity. Weapons that pierce or slash are largely ineffective against a tide of a thousand bodies. They must be burned, blasted, or crushed to be truly destroyed."

`,agl:`6`,awa:`5`,cha:`—`,int:`—`,phy:`1`,wil:`4`,move:`20`,ap:`3`,def:`3`,wmArmor:`—`,wmBS:`5`,wmDP:`Immune`,wounds:`50`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+2`,meleeDmg:`+10`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`100+`,gear:`None`,meleeDetail:`Swarming Bites (+2)`,rangeDetail:`None`,abilities:`Passive Traits
Swarm Anatomy: The Swarm operates by completely different physical rules. It is utterly immune to the Grappled, Prone, and Paralyzed conditions. It takes half damage from all single-target Piercing or Slashing attacks, but possesses a severe vulnerability to Area-of-Effect attacks (like a fire spell or explosive), taking double damage from those sources.

Amorphous Mass: The swarm can move through any gap or space large enough for a single rat. It completely ignores the Prone, Stunned, and Grappled conditions, and it cannot be flanked.

Suffocating Presence: Any enemy that starts its turn sharing a space with the Rat Swarm automatically takes 5 Piercing Wounds and suffers Disadvantage on all Ranged and Casting attacks due to rats constantly climbing up their legs.

Action-Based Abilities
Devouring Wash (Melee Cost: 1 Action): The Swarm thrashes violently. Make a Melee attack (+2 To-Hit) against every creature currently sharing a space with the Swarm. On a hit, it deals 1d10 + 10 Piercing Wounds, and the target must surpass Physique TN 5 + Resist bonus or gain the Infected condition.

Surge (Melee Cost: 2 Actions): The Swarm moves up to its full Movement speed in a straight line, rolling directly through enemy spaces. Any creature it passes through must surpass Agility TN 6 + Resist bonus or be knocked Prone and take 1d10 + 20 Piercing Wounds as the rats scramble over them.

Cling and Gnaw (Cost: 1 Action): The rats attempt to physically weigh down a target. Make a Melee attack (+2 To-Hit) against one target sharing its space. On a hit, the target becomes Slowed (halving their movement speed) until they use an Action to physically brush the biting vermin off their armor.`},
{name:`Pyreborn Kin(Sun-Forged)`,size:`Medium`,type:`Humanoid (Pyreborn)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The Pyreborn are the ultimate survivalists of the extreme. Culturally, they are the world’s greatest smiths and pyromancers, viewing fire not as a destroyer, but as the "Loom" of reality. Encased in heat-treated bronze and obsidian that would cook a normal human alive, they advance with the steady, unstoppable momentum of a lava flow. A Sun-Forged warrior does not dodge or retreat; they simply march forward, trusting their master-crafted armor to shatter enemy blades while they reduce the opposition to ash and slag.`,agl:`2`,awa:`4`,cha:`1`,int:`3`,phy:`6`,wil:`9`,move:`25`,ap:`3`,def:`7`,wmArmor:`15`,wmBS:`10`,wmDP:`25`,wounds:`45`,focus:`+1/3`,reroll:`1`,luck:`—`,meleeHit:`+4`,meleeDmg:`+10/+25(2H)`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`+5`,castDmg:`+12`,castHeal:`—`,castType:`None`,fear:`—`,mob:`2-5`,gear:`Heat-Treated Bronze Armor, Obsidian Macem, Pyromancer's Focus`,meleeDetail:`Obsidian Mace`,rangeDetail:`None`,abilities:`Passive Traits
Sun-Forged: The Pyreborn Warrior is completely immune to all Fire and Heat-based damage. Furthermore, any spell or attack that utilizes Fire heals the Warrior for half the Wounds it would normally deal.

Momentum of the Magma: Slow to start, but impossible to stop. The Warrior is immune to the Knockback and Prone conditions from any creature of Large size or smaller.

Tempered Weapons: The Pyreborn's mastery of the Loom means their weapons are always kept at a super-heated threshold. Their Melee attacks ignore 2 points of the target's WM-Arm (Armor Mitigation) as the heated obsidian melts through standard mail.

Action-Based Abilities
Breath of the Loom (Cost: 2 Actions): The Sun-Forged channels their innate pyromancy, unleashing a wave of roaring flame from their gauntlet. All enemies within a 15-foot cone must pass an Agility(d10+4) test or take 1d10 + 20 Fire Wounds and gain the Burning condition.

Obsidian Greathammer (Melee Cost: 2): A devastating, heavy swing with a two-handed weapon. Deals normal 1d10 + 25 Melee Wounds. If the Warrior rolls an unmodified 9 or 10 on the To-Hit, the immense weight of the blow forces the target to make a Physique(6) Save or gain 1 Stunned condition.

Searing Grasp (Melee Cost: 1): The Warrior drops one hand from its hammer and grabs the target with its superheated bronze gauntlet. Deals 1d10 Fire Wounds. The target must make an Agility(6) Test or be Grappled, taking an additional 1d10 Fire Wounds at the start of each of the Warrior's turns until they break free with a Physique vs surpass Physique TN 7 + Resist bonus.

Ignite the Loom(TN7) (Casting/Area Cost: 1): The Warrior drags its obsidian hammer across its bronze armor, showering the area in a wave of pyromantic sparks. All enemies in a 15 ft cone must make an Agility Save or take 1d10 + 12 Fire Wounds and gain 1 Bleeding (Burn) condition.`},
{name:`Rat Ogre: The Alchemical Abomination`,size:`Large`,type:`Vermin`,tier:`Boss`,tierColor:`#b91c1c`,desc:`A grotesque, alchemically mutated horror of the deep sewers, the Rat Ogre is a towering, hunched monstrosity of hyper-developed muscle, patchy diseased fur, and rusted scrap metal violently bolted directly into its flesh. Standing at eight feet tall but fighting with a feral, scrambling gait, it possesses the raw, overwhelming Large (Lg) mass of an Ogre combined with the twitchy, predatory speed of a starving rat. Driven completely mad by its own unnatural growth, it thrashes wildly through subterranean tunnels, destroying anything in its path.`,agl:`6`,awa:`4`,cha:`—`,int:`—`,phy:`9`,wil:`5`,move:`30`,ap:`3`,def:`7`,wmArmor:`13`,wmBS:`9`,wmDP:`Immune`,wounds:`215`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+5`,meleeDmg:`+30/+60(2H)`,meleeHeal:`—`,rangeHit:`+2`,rangeDmg:`+30`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`5`,mob:`1-3`,gear:`Rusted Scrap Grafts, Alchemical Tubes/Injectors.`,meleeDetail:`Scavenged Metal Blades / Feral Claws`,rangeDetail:`Throwing Object/Rock`,abilities:`Passive Traits
Diseased Grafts: Any creature that takes Melee damage from the Rat Ogre must surpass Physique TN 6 + Resist bonus or gain the Infected condition, taking 5 unmitigable Wounds at the start of their next turn due to the filth and rust.

Feral Senses: Its hyper-developed snout and twitching whiskers allow it to navigate and hunt in total darkness. It ignores all To-Hit and Defense penalties associated with fighting in low light or absolute pitch-black environments.

Filth-Born: Having been born and mutated in the absolute worst alchemical runoff and raw sewage, the Rat Ogre is completely immune to all Disease and Poison conditions.

Warp-Spasm: When the Rat Ogre is reduced to less than half of its Total Wounds, its alchemically altered blood boils. It immediately gains +1 Action per turn, but suffers a -2 penalty to its Defense as it abandons all self-preservation to tear its enemies apart.

Action-Based Abilities
Rusted Warp-Cleaver (Melee - Cost: 2 Actions): Wielding a massive, jagged slab of rusted iron bolted to a sewer pipe, the Rat Ogre delivers a frenzied, sweeping chop. This 2-Handed heavy strike is fueled by its massive Physique and multiplied by its Large size, dealing a devastating 1d10 + 60 wounds. On an unmodified 9 or 10, the rusted metal inflicts 1 Bleeding condition.

Rabid Snapping Bite (Melee - Cost: 1 Action): Lunging forward with its elongated, foam-flecked snout, the beast clamps down with yellowed incisors. This 1-Handed natural attack deals 1d10 + 30 wounds. The victim must surpass Physique TN 7 + Resist bonus or immediately suffer 1 Disease condition from the horrific bacteria coating its teeth.

Sewer Grate Toss (Range - Cost: 1 Action): Ripping an iron grate or chunk of masonry from the tunnel walls, it hurls the heavy debris with terrifying speed. Combining its Agility and its Physique, multiplied by its size, this thrown projectile deals 1d10 + +30 blunt wounds on impact.`},
{name:`Ratman Scavenger: The Filth-Born`,size:`Medium`,type:`Humanoid (Beastkin)`,tier:`Minion`,tierColor:`#6b7280`,desc:`Twisted, bipedal rodents that infest the deep sewers and forgotten caverns beneath civilized cities. Operating in the shadows, they rely on quick strikes, overwhelming numbers, and the virulent diseases they carry to wear down stronger opponents. Hunched and twitchy, the Ratman is a survivor of the deepest filth. Clad in stitched-together scrap leather and wielding rusted, filth-encrusted blades, they are cowards when alone but viciously bold when attacking in a pack. They do not fight with honor; they fight to survive.`,agl:`6`,awa:`5`,cha:`2`,int:`—`,phy:`1`,wil:`4`,move:`20`,ap:`3`,def:`3`,wmArmor:`3`,wmBS:`5`,wmDP:`Immune`,wounds:`13`,focus:`—`,reroll:`1`,luck:`1`,meleeHit:`+1`,meleeDmg:`+4`,meleeHeal:`—`,rangeHit:`+2`,rangeDmg:`+6`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`4-15`,gear:`Stitched Leather, Rusted Shiv, Pouch of Filth`,meleeDetail:`Rusted Shiv`,rangeDetail:`Throwing Darts`,abilities:`Passive Traits
Filth-Born: The Ratman is completely immune to all Disease and Poison conditions. Any creature that successfully hits the Ratman with an unarmed strike or natural weapon (like a bite) must make a Physique(6) Test or gain 1 Disease condition.

Pack Cowardice: A Ratman's bravery is tied entirely to its swarm. While adjacent to at least one allied Ratman, it gains Advantage on all Melee To-Hit rolls. However, if a Ratman starts its turn without an ally within 15 feet, it must surpass Willpower TN 7 + Resist bonus or use its turn to immediately flee

Swarm Tactics: If two or more Ratmen are engaged in melee with the same target, they all gain Advantage on their Melee To-Hit rolls and bypass 2 points of the target's Armor Mitigation (WM-Arm) by finding gaps in the plating.

Skittering Evasion: The Ratman can move through the spaces of enemy creatures without penalty, provided the enemy is at least Medium size. They ignore difficult terrain penalties in subterranean environments.

Action-Based Abilities
Tetanus Shank (Cost: 1 Action): The Ratman lunges with its filth-encrusted blade. Make a Melee attack (+1 To-Hit). On a hit, it deals 1d10 + 4 Piercing Wounds, and the target must surpass Physique TN 5 + Resist bonus or gain the Infected condition, suffering 5 unmitigable Wounds at the start of their next 2 turns

Shatter-Vial - (Ranged/Area) Cost: 2 Actions): Throws a stolen, haphazardly crafted alchemical vial up to 40 ft. It bursts in a 10 ft radius. All creatures in the area must make an Agility(6) Test or take 2d10 Acid Wounds and gain 1 Blind condition, gaining disadvantage for all actions for 1 turn as the noxious fumes burn their eyes.

Coward's Retreat - (Movement Cost: 1): The Ratman instantly disengages from melee combat, taking no free strikes from adjacent enemies, and moves its full Move speed (50 ft) toward the nearest shadows, grating, or cover.`},
{name:`Riding Horse: Traveler's Companion`,size:`Large`,type:`Beast`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`The unsung hero of the civilized world, the Riding Horse is the backbone of travel, trade, and communication. Unlike their heavier, armor-clad Warhorse cousins, riding horses are bred for endurance, speed, and a smooth gait. They are highly intelligent for beasts and fiercely loyal to a gentle rider, but their instincts remain tied to survival. When the scent of a troll hits the wind or a fireball shatters the night, a Riding Horse’s primary directive is to run. They are not combatants; they are the reliable, swift engines that ensure adventurers live to see the next town.`,agl:`9`,awa:`6`,cha:`2`,int:`1`,phy:`5`,wil:`4`,move:`35`,ap:`3`,def:`5`,wmArmor:`5`,wmBS:`5`,wmDP:`15`,wounds:`60`,focus:`+1/3`,reroll:`1`,luck:`3`,meleeHit:`+2`,meleeDmg:`+12/+20`,meleeHeal:`—`,rangeHit:`—`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1-30`,gear:`Riding Saddle, Bit & Bridle, Saddlebags`,meleeDetail:`Panicked Hooves`,rangeDetail:`None`,abilities:`Passive Traits
Prey's Vision: Because a horse's eyes are set on the sides of its head, it has a massive field of vision. The Riding Horse cannot be flanked or surprised by mundane stealth unless the attacker is directly underneath or directly behind it in its small blind spot.

Flight Response: When the horse takes any damage or fails a surpass Willpower TN 7 + Resist bonus against a Fear effect, it immediately gains a positive modifier to its Agility checks and Movement speed for the remainder of the encounter as adrenaline floods its system.

Beast of Burden: The horse's Physical stat is perfectly tuned for hauling. It ignores Movement penalties from carrying heavy loads or encumbered riders, making it the perfect pack animal.

Action-Based Abilities
Bolt! (Cost: 2 Actions): The horse gives into panic and focuses entirely on escape. It immediately moves up to double its normal Movement speed of 70 away from the nearest source of danger.

Panicked Kick (Melee Cost: 1 Action): If cornered, the horse lashes out blindly with its rear hooves. Make a Melee attack (+2 To-Hit). On a hit, it deals 1d10 + 20 Bludgeoning Wounds and physically pushes the target 5 feet back.

Rearing Hooves (Melee Cost: 1 Action): The horse rears up on its hind legs and strikes downward with its front hooves. Make a Melee attack (+2 To-Hit). If successful, it deals 1d10 + 12 Bludgeoning Wounds. If this attack scores a Critical Hit, the target is knocked Prone.`},
{name:`Shade Crow: The Hollow-Gourd`,size:`Medium`,type:`Monstrosity (Plant / Shade)`,tier:`Skirmisher`,tierColor:`#a16207`,desc:`Standing roughly 6 feet tall, the Shade Crow is an unnervingly thin creature. Its body is composed of blackened, vine-like tendons wrapped around a skeletal frame that feels more like brittle wood than bone. It moves with a terrifying, silent twitchiness. Their hands are their most distinctive feature: elongated, multi-jointed "spiny fingers" that move with a life of their own, designed specifically to thread through the gaps of a knight's visor or the joints in heavy armor. To fight a Shade Crow in full plate is to lock yourself in an iron coffin and hand it the key.`,agl:`9`,awa:`6`,cha:`1`,int:`4`,phy:`3`,wil:`5`,move:`25`,ap:`4`,def:`5`,wmArmor:`7`,wmBS:`10`,wmDP:`Immune`,wounds:`35`,focus:`+2/6`,reroll:`2`,luck:`1`,meleeHit:`+4`,meleeDmg:`+10`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`+15`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`5`,mob:`1-3`,gear:`None. Relies entirely on its body.`,meleeDetail:`Multi-Jointed Spiny Fingers`,rangeDetail:`Can hurl splintered shards of its own blackened wood body up to 40ft for 15 Wounds.`,abilities:`Passive Traits
Armor Threading: The Shade Crow’s multi-jointed fingers are perfectly adapted to bypass defenses. All of its melee attacks ignore 2 points of Wound Mitigation provided by worn armor (target uses only natural mitigation).

Hollow Anatomy: Because its body is a hollow cage of dry vines and wood, it does not have vital organs. It is immune to the Bleeding condition, and piercing weapons deal half damage to it. However, because of its brittle, dry nature, it takes double wounds from all bludgeoning and Fire-based attacks.

Shadow-Meld: When in dim light, darkness, or heavy foliage, the blackened vines of its body absorb light. It becomes nearly invisible, granting enemies Disadvantage on To-Hit rolls against it until it makes an attack or enters a brightly lit area.

Action-Based Abilities
Gourd-Seed Spite (Cost: 2 Actions): The creature's "head" splits open, expelling a cloud of jagged, cursed seeds in a 15-foot cone. All enemies in the cone take 2d10 + 10 wounds. Those damaged must surpass Willpower TN 7 + Resist bonus; on a failure, the seeds burrow into their skin, causing agonizing hallucinations and inflicting 1 level of Exhaustion as shadow-magic floods their nervous system.

Tendon Snare (Range Cost: 1 Action): The Shade Crow detaches a long, whip-like tendon of blackened vine from its own body and lashes it at a target's legs up to 20 feet away. If it hits, the target takes no damage but their Movement is immediately reduced to 0 until the end of their next turn unless they spend an action to physically cut or tear the vine away.

Siphoning Grapple (Melee Cost: 2 Actions): The Crow threads its fingers deep into the target's armor and attempts to lock them in place. Make an Agility vs. Agility check against a target. On a success, the target is Grappled, and the Crow siphons their vitality, dealing 15 unmitigable Piercing Wounds and healing itself for 10 Wounds.

Visor Pierce (Melee Cost: 1 Action): A lightning-fast strike aimed at an exposed gap. Make a Melee attack (+4 To-Hit). If successful, it deals 1d10 + 10 Piercing Wounds. If this attack rolls a 10, it strikes an eye or vital artery, dealing double damage and applying the Blinded condition for 1 round.`},
{name:`Silver Dragon: The Winter Sage`,size:`Enormous`,type:`Dragon (Elemental/Arcane)`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`A breathtaking sight with scales like polished plate mail and a crest resembling a regal, spiked crown. Their slender bodies are built for soaring through high-altitude winds rather than raw brawling. A permanent chill of winter air and ozone surrounds them. Silver Dragons have a genuine fascination with mortal history, living among humans as sages, kings, or bards, hoarding artifacts for the stories attached to them. When they take to the sky, it is to protect the balance of the world. They prefer to end a fight without bloodshed, utilizing surgical strikes and freezing mist to de-escalate conflicts, backed by an absolute mastery of wizardry.`,agl:`12`,awa:`3`,cha:`9`,int:`18`,phy:`4`,wil:`5`,move:`40/120F`,ap:`3`,def:`6`,wmArmor:`25`,wmBS:`35`,wmDP:`30`,wounds:`380`,focus:`+3/9`,reroll:`2`,luck:`2`,meleeHit:`+4`,meleeDmg:`+30`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`+45`,rangeHeal:`—`,castHit:`+5`,castDmg:`+28`,castHeal:`—`,castType:`Wizardry`,fear:`5`,mob:`1`,gear:`ften carries magical artifacts, rings, or historical relics worn as jewelry`,meleeDetail:`Surgical Talons`,rangeDetail:`The Chill of Justice`,abilities:`Passive Traits
Pacifying Aura (Winter & Ozone): The permanent chill surrounding the dragon acts as a natural de-escalator. Any enemy starting their turn within 30 feet of the Dragon must surpass Willpower TN 9 + Resist bonus. On a failure, they lose any Enraged or Frenzied conditions and gain the Lethargic condition, reducing their Movement and Agility by half.

Master of the Arcane: The Silver Dragon requires no somatic or material components to cast spells, utilizing its massive 18 Intelligence. Furthermore, when the Dragon casts a spell, it may freely choose to deal non-lethal Wounds, instantly rendering targets unconscious at 0 Wounds rather than killing them.

Surgical Evasion: Because of its immense 12 Agility, any Ranged or Melee attack that misses the Dragon triggers an immediate, free Movement action for the Dragon to reposition up to 30 feet in the air without triggering counter-attacks.

Action-Based Abilities
Breath Weapon: Sub-Zero Mist (Cost: 2 Actions): The Dragon exhales a billowing, 60-foot cone of freezing mist and ozone. All targets in the area must surpass Physical TN 10 + Resist bonus against the Dragon's Casting To-Hit (+4). On a failure, they take 1d10 + 45 Cold Wounds and are Frozen (Stunned) in a layer of thick ice until they are broken out. On a success, they take half damage and are not frozen.

Arcane Severance(TN7) (Casting Cost: 1 Action): The Dragon utilizes a surgical strike of pure magic to disarm a conflict. Target one creature within 60 feet. Make a Casting attack (+4 To-Hit). If successful, the target's weapon is telekinetically thrown 20 feet away, or their active magical buffs are instantly dispelled.

Gale-Force Buffet (Cost: 1 Action): The Dragon snaps its massive wings, generating a localized hurricane. All enemies within 20 feet must surpass Agility TN 12 + Resist bonus or take 15 Bludgeoning Wounds and be violently knocked Prone, effectively ending a melee skirmish without shedding blood.`},
{name:`Skink: The Swamp Ambusher`,size:`Small`,type:`Humanoid (Reptilian)`,tier:`Minion`,tierColor:`#6b7280`,desc:`Standing barely four feet tall, the Skink is a lithe, crested reptilian darting through the jungle canopy and murky waters. What they lack in the robust strength of their larger kin, they make up for with cunning and sheer speed. They are the eyes and ears of the Lizardman warband, utilizing guerrilla tactics, poisoned weapons, and the treacherous swamp terrain to whittle down enemies before the heavy hitters arrive. A Skink rarely fights fair; they strike from the high branches with blowguns or hurl barbed javelins from the deep reeds, using the toxic flora of their home to lethal effect.`,agl:`6`,awa:`5`,cha:`2`,int:`4`,phy:`1`,wil:`3`,move:`21`,ap:`3`,def:`5`,wmArmor:`2`,wmBS:`5`,wmDP:`15`,wounds:`10`,focus:`+1/3`,reroll:`1`,luck:`2`,meleeHit:`+0`,meleeDmg:`+1`,meleeHeal:`—`,rangeHit:`+3`,rangeDmg:`+6`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`4-10`,gear:`Blowgun, Venom-Dipped Darts, Barbed Javelin`,meleeDetail:`Barbed Javelin (Used in melee)`,rangeDetail:`Blowpipe`,abilities:`Passive Traits
Canopy Crawler: The Skink possesses a climbing speed equal to its normal Movement speed. They can move freely across branches, sheer walls, and ceilings without penalty, automatically gaining Advantage on stealth checks when elevated.

Swamp Skirmisher: The Skink treats deep water and thick underbrush as normal terrain. Furthermore, if a Skink makes a Ranged attack while obscured by foliage, its position is not automatically revealed.

Hit and Fade: If the Skink successfully damages an enemy with a Melee or Ranged attack, its Movement speed is increased by 10 feet until the end of its turn, allowing it to easily retreat out of counter-attack range.

Action-Based Abilities
Venom-Dipped Dart (Range Cost: 2 Actions): The Skink fires a dart from the shadows. Make a Ranged attack (+3 To-Hit). On a hit, it deals only 1d10 + 6 Piercing Wounds, but the target must surpass Physique TN 6 + Resist bonus or gain the Poisoned condition, taking 5 unmitigable Wounds at the start of their next 2 turns.

Javelin Toss (Range Cost: 1 Action): A swift throw of a light spear. Make a Ranged attack (+3 To-Hit). On a hit, it deals 1d10 + 6 Piercing Wounds.

Darting Strike (Melee Cost: 1 Action): If cornered, the Skink stabs frantically with its javelin. Make a Melee attack (+0 To-Hit). If successful, it deals 4 Piercing Wounds and the Skink immediately shifts 5 feet backward without triggering a defensive reaction.`},
{name:`Stone Golem: The Monolith Warden`,size:`Giant`,type:`Construct / Elemental`,tier:`Legendary`,tierColor:`#7c3aed`,desc:`Forged not in a foundry, but carved directly from the heart of a mountain or the pillars of a forgotten temple, the Stone Golem is a towering, 20-foot-tall humanoid shape composed of solid, rune-carved granite. It does not hiss with steam; instead, its joints grind with the deafening sound of shifting tectonic plates. Overgrown with centuries of moss and creeping vines, it acts as a silent, eternal sentinel. It has no need for weapons; its fists are heavy enough to cave in a fortress gate. Its featureless stone face is set in a permanent, stoic mask that never shows fatigue, pain, or mercy.`,agl:`1`,awa:`5`,cha:`2`,int:`4`,phy:`15`,wil:`6`,move:`30`,ap:`3`,def:`9`,wmArmor:`30`,wmBS:`15`,wmDP:`Immune`,wounds:`450`,focus:`—`,reroll:`—`,luck:`—`,meleeHit:`+6`,meleeDmg:`+40`,meleeHeal:`—`,rangeHit:`+5`,rangeDmg:`—`,rangeHeal:`—`,castHit:`—`,castDmg:`—`,castHeal:`—`,castType:`None`,fear:`—`,mob:`1-2`,gear:`None`,meleeDetail:`Granite Fists`,rangeDetail:`Hurled Rubble`,abilities:`Passive Traits
Immutable Form: The magic that binds the Stone Golem is absolute. It is completely immune to any spell or effect that would alter its form (such as Petrification or Polymorph) and cannot be magically teleported against its will.

Magical Inertia: The Golem's ancient stone acts as a grounding rod for hostile magic. Any spell cast directly at the Golem that deals Fire, Cold, or Lightning damage automatically has its total Wounds halved before applying to Wound Mitigation.

Tectonic Mass: The Giant-sized Monolith Warden is completely immune to the Knockback, Prone, Grappled, and Restrained conditions from any creature smaller than Giant size. It ignores all Movement penalties for moving through non-magical Difficult Terrain, crushing obstacles into dust as it walks.

Action-Based Abilities
Fortress-Breaker Slam (Melee Cost: 1 Action): The Golem brings down a fist the size of a wagon. Make a Melee attack (+6 To-Hit) with a 15-foot reach. If successful, it deals 1d10 + 40 Bludgeoning Wounds. If this attack targets a door, wall, or environmental cover, it deals double Wounds, instantly obliterating it.

Rune of Slowing (Cost: 2 Actions): The ancient glyphs carved into its chest flare with suppressing magic. All enemies within a 30-foot radius must surpass Willpower TN 9 + Resist bonus. On a failure, they gain the Slowed condition for 1 round (their Movement is halved, and they lose 1 Action on their next turn) as time itself seems to grind to a halt around the titan.
